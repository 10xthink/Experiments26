<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cadence — Pure Focus Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #fafafa;
      --fg: #111111;
      --muted: #888888;
      --hairline: rgba(0, 0, 0, 0.08);
      --hairline-subtle: rgba(0, 0, 0, 0.04);
      --bar-bg: rgba(0, 0, 0, 0.06);
      --bar-fill: #111111;
      --check-border: #bbbbbb;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --fg: #f3f3f3;
        --muted: #737373;
        --hairline: rgba(255, 255, 255, 0.10);
        --hairline-subtle: rgba(255, 255, 255, 0.05);
        --bar-bg: rgba(255, 255, 255, 0.12);
        --bar-fill: #f3f3f3;
        --check-border: #444444;
      }
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: manipulation;
    }

    .font-mono {
      font-family: var(--font-mono);
    }

    /* Minimalist tactile checkbox */
    .tactile-checkbox {
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--check-border);
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 120ms ease;
      background: transparent;
      margin-top: 2px;
    }

    .tactile-checkbox:hover {
      border-color: var(--fg);
    }

    .tactile-checkbox.checked {
      background-color: var(--fg);
      border-color: var(--fg);
    }

    .tactile-checkbox.checked::after {
      content: '';
      width: 5px;
      height: 8.5px;
      border: solid var(--bg);
      border-width: 0 1.75px 1.75px 0;
      transform: rotate(45deg) translate(-0.5px, -1px);
    }

    .del-btn {
      opacity: 0.25;
      transition: opacity 120ms ease, color 120ms ease;
    }
    @media (hover: hover) {
      .del-btn { opacity: 0; }
      .task-item:hover .del-btn { opacity: 0.35; }
      .task-item .del-btn:hover { opacity: 1; color: var(--fg); }
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .current-week-dot {
      width: 4px;
      height: 4px;
      background-color: var(--fg);
      border-radius: 50%;
      margin-bottom: 3px;
    }

    .current-week-dot-placeholder {
      width: 4px;
      height: 4px;
      margin-bottom: 3px;
      visibility: hidden;
    }

    .week-tab {
      transition: opacity 120ms ease;
      cursor: pointer;
    }

    .week-tab:hover {
      opacity: 1;
    }

    .week-tab.active {
      opacity: 1;
    }
  </style>
</head>
<body class="min-h-[100dvh] flex flex-col justify-between selection:bg-[var(--fg)] selection:text-[var(--bg)]">

  <header class="w-full pt-6 sm:pt-10 pb-4 sm:pb-6 max-w-3xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-2 select-none">
    <div class="flex items-baseline space-x-2 flex-wrap">
      <button type="button" onclick="jumpToCurrentWeek()" title="Click to jump to active calendar week" class="text-xs font-semibold tracking-widest uppercase font-mono hover:opacity-60 transition-opacity flex items-center gap-1.5 cursor-pointer">
        <span>CADENCE</span>
      </button>
      <span class="text-xs font-mono text-[var(--muted)] opacity-40">/</span>
      <span id="quarter-label" class="text-xs font-mono text-[var(--muted)]">Q4</span>
      <span class="text-xs font-mono text-[var(--muted)] opacity-40">·</span>
      <span id="active-week-label" class="text-xs font-mono text-[var(--fg)] font-medium">WEEK 1</span>
      <span id="active-week-dates" class="text-[11px] font-mono text-[var(--muted)]"></span>
      <span class="text-xs font-mono text-[var(--muted)] opacity-40 hidden sm:inline">·</span>
      <span id="today-date-label" class="text-[11px] font-mono text-[var(--muted)] hidden sm:inline" title="Current calendar date"></span>
      <button type="button" id="dri-filter-tag" onclick="clearDriFilter()" class="hidden text-xs font-mono px-1.5 py-0.5 rounded bg-[var(--hairline)] hover:bg-[var(--fg)] hover:text-[var(--bg)] transition-colors"></button>
    </div>
    <div class="text-xs font-mono text-[var(--muted)] self-start sm:self-auto flex items-center space-x-1 cursor-pointer hover:text-[var(--fg)] transition-colors" onclick="toggleShippedView()" title="Toggle full quarter shipped ledger">
      <span id="header-total-shipped">0</span>
      <span>of</span>
      <span id="header-total-all">0</span>
      <span>total shipped</span>
      <span class="text-[10px] ml-0.5 opacity-60" id="ledger-icon">↓</span>
    </div>
  </header>

  <div class="w-full max-w-3xl mx-auto px-4 sm:px-6 mb-8 sm:mb-12">
    <div id="week-scrubber" class="grid grid-flow-col auto-cols-[3.25rem] sm:auto-cols-auto sm:grid-cols-12 gap-1 overflow-x-auto no-scrollbar py-1">
      <!-- Week tabs dynamically injected -->
    </div>
  </div>

  <main class="w-full max-w-3xl mx-auto px-4 sm:px-6 flex-1 flex flex-col">
    <!-- Capture Bar (only in active week view) -->
    <div id="capture-container" class="mb-10 sm:mb-12">
      <form id="capture-form" onsubmit="handleCapture(event)" class="relative border-b border-[var(--hairline)] focus-within:border-[var(--fg)] transition-colors duration-150">
        <input 
          id="capture-input" 
          type="text" 
          autocomplete="off" 
          spellcheck="false"
          placeholder="What are you shipping this week? Type title @DRI and press enter..."
          class="w-full bg-transparent py-2.5 sm:py-3 text-base sm:text-lg outline-none placeholder:text-[var(--muted)] placeholder:opacity-50 font-normal rounded-none"
        />
        <div class="absolute right-0 top-1/2 -translate-y-1/2 flex items-center space-x-2 text-[11px] font-mono text-[var(--muted)] pointer-events-none opacity-40 hidden sm:flex">
          <span>return ↵</span>
        </div>
      </form>
    </div>

    <!-- Active Deliverables Section (To Do & Done) -->
    <div id="board-container" class="grid grid-cols-1 md:grid-cols-2 gap-8 sm:gap-12 flex-1">
      <!-- To Do Column -->
      <section class="flex flex-col">
        <div class="flex items-baseline justify-between pb-3 border-b border-[var(--hairline)] mb-4">
          <h2 class="text-xs font-mono font-medium tracking-wider text-[var(--muted)] uppercase">TO DO</h2>
          <span id="todo-count" class="text-xs font-mono text-[var(--muted)]">0</span>
        </div>
        <div id="todo-list" class="flex flex-col divide-y divide-[var(--hairline-subtle)] flex-1 min-h-[160px]">
          <!-- Items injected -->
        </div>
      </section>

      <!-- Done Column -->
      <section class="flex flex-col">
        <div class="flex items-baseline justify-between pb-3 border-b border-[var(--hairline)] mb-4">
          <h2 class="text-xs font-mono font-medium tracking-wider text-[var(--muted)] uppercase">DONE</h2>
          <span id="done-count" class="text-xs font-mono text-[var(--muted)]">0</span>
        </div>
        <div id="done-list" class="flex flex-col divide-y divide-[var(--hairline-subtle)] flex-1 min-h-[160px]">
          <!-- Items injected -->
        </div>
      </section>
    </div>

    <!-- Shipped Ledger View (Toggleable across all 12 weeks) -->
    <div id="shipped-ledger-view" class="hidden flex-1 flex flex-col">
      <div class="flex items-baseline justify-between pb-3 border-b border-[var(--hairline)] mb-6">
        <div class="flex items-center space-x-2">
          <h2 class="text-xs font-mono font-semibold tracking-wider uppercase">SHIPPED LEDGER</h2>
          <span class="text-xs font-mono text-[var(--muted)]">· FULL HORIZON</span>
        </div>
        <button type="button" onclick="toggleShippedView()" class="text-xs font-mono text-[var(--muted)] hover:text-[var(--fg)] underline underline-offset-4 cursor-pointer">
          return to active week ↵
        </button>
      </div>
      <div id="ledger-content" class="flex flex-col space-y-8 pb-12">
        <!-- Rendered week rollups -->
      </div>
    </div>
  </main>

  <footer class="w-full max-w-3xl mx-auto px-4 sm:px-6 py-6 sm:py-8 border-t border-[var(--hairline-subtle)] mt-12 flex flex-col sm:flex-row justify-between items-center text-xs font-mono text-[var(--muted)] gap-3 select-none">
    <div class="flex items-center space-x-2">
      <span class="opacity-40">12-week rolling cadence</span>
    </div>
    
    <div class="flex items-center space-x-3">
      <button type="button" onclick="exportData()" class="hover:text-[var(--fg)] transition-colors cursor-pointer">export</button>
      <span class="opacity-30">/</span>
      <button type="button" onclick="importData()" class="hover:text-[var(--fg)] transition-colors cursor-pointer">import</button>
      <span class="opacity-30">/</span>
      <button type="button" id="clear-board-btn" onclick="promptClearAll()" class="hover:text-[var(--fg)] transition-colors cursor-pointer">clear</button>
      <input type="file" id="file-import-input" accept=".json" class="hidden" onchange="handleFileSelected(event)">
    </div>
  </footer>

  <!-- Non-blocking Import Resolution Notification -->
  <div id="import-resolution-modal" class="fixed bottom-16 sm:bottom-20 left-1/2 -translate-x-1/2 w-[92%] max-w-md bg-[var(--bg)] border border-[var(--fg)] shadow-2xl p-4 rounded-sm hidden z-50">
    <div class="text-xs font-mono mb-2">Importing <span id="import-count-label" class="font-bold">0</span> deliverables</div>
    <div class="text-xs text-[var(--muted)] mb-3">Choose whether to append team items or replace current board state.</div>
    <div class="flex items-center justify-end space-x-3 font-mono text-xs">
      <button type="button" onclick="cancelImport()" class="px-2 py-1 text-[var(--muted)] hover:text-[var(--fg)]">cancel</button>
      <button type="button" onclick="executeImport('merge')" class="px-2.5 py-1 bg-[var(--hairline)] hover:bg-[var(--fg)] hover:text-[var(--bg)] rounded-sm">merge</button>
      <button type="button" onclick="executeImport('replace')" class="px-2.5 py-1 border border-[var(--fg)] hover:bg-[var(--fg)] hover:text-[var(--bg)] rounded-sm">replace all</button>
    </div>
  </div>

  <script>
    let currentWeek = 1;
    let calendarWeek = 1;
    let currentQuarterName = 'Q1';
    let currentQuarterYear = new Date().getFullYear();
    let currentQuarterStart = null;
    let activeDriFilter = null;
    let showShippedView = false;
    let clearConfirmTimeout = null;
    let pendingImportPayload = null;

    // Seed Data
    const defaultTasks = [
      { id: 't-1', title: 'Ship responsive canvas layout', status: true, dri: 'Jay', week: 1 },
      { id: 't-2', title: 'Implement zero-friction inline capture', status: true, dri: 'Elena', week: 1 },
      { id: 't-3', title: 'Refactor binary status transitions', status: false, dri: 'Jay', week: 1 },
      { id: 't-4', title: 'Add quarterly volume indicators', status: false, dri: 'Elena', week: 1 },
      { id: 't-5', title: 'Execute full telemetry audit', status: false, dri: 'Marc', week: 2 },
      { id: 't-6', title: 'Finalize core client contracts', status: true, dri: 'Marc', week: 2 },
      { id: 't-7', title: 'Refactor authentication edge tokens', status: false, dri: 'Jay', week: 3 }
    ];

    let tasks = [];

    function calculateQuarterContext() {
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth(); // 0-11
      const quarterIndex = Math.floor(currentMonth / 3);
      const quarterNames = ['Q1', 'Q2', 'Q3', 'Q4'];
      
      currentQuarterName = quarterNames[quarterIndex];
      currentQuarterYear = currentYear;

      // Start of the calendar quarter
      const startOfQuarterMonth = quarterIndex * 3;
      const qStart = new Date(currentYear, startOfQuarterMonth, 1);
      
      // Align to the Monday of that week
      const dayOfWeek = qStart.getDay();
      const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      qStart.setDate(qStart.getDate() + diffToMonday);
      qStart.setHours(0, 0, 0, 0);
      currentQuarterStart = qStart;

      // Calculate the real-world current week (1-12)
      const diffTime = now.getTime() - qStart.getTime();
      const diffWeeks = Math.floor(diffTime / (7 * 24 * 60 * 60 * 1000)) + 1;
      calendarWeek = Math.max(1, Math.min(12, diffWeeks));
    }

    function getWeekDateRange(w) {
      if (!currentQuarterStart) return '';
      const start = new Date(currentQuarterStart);
      start.setDate(start.getDate() + (w - 1) * 7);
      
      const end = new Date(start);
      end.setDate(end.getDate() + 6);

      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${months[start.getMonth()]} ${start.getDate()}–${months[end.getMonth()]} ${end.getDate()}`;
    }

    function getStorageKey() {
      return `cadence_tasks_${currentQuarterYear}_${currentQuarterName}`;
    }

    function saveToStorage() {
      try {
        localStorage.setItem(getStorageKey(), JSON.stringify(tasks));
      } catch (e) {
        console.warn('Storage unavailable or quota exceeded', e);
      }
    }

    function loadFromStorage() {
      try {
        const stored = localStorage.getItem(getStorageKey());
        if (stored) {
          tasks = JSON.parse(stored);
          return true;
        }
      } catch (e) {
        console.warn('Error reading storage', e);
      }
      return false;
    }

    function renderTotals() {
      const scopedTasks = activeDriFilter 
        ? tasks.filter(t => (t.dri || '').toLowerCase() === activeDriFilter.toLowerCase())
        : tasks;

      const totalShipped = scopedTasks.filter(t => t.status).length;
      const totalAll = scopedTasks.length;

      document.getElementById('header-total-shipped').textContent = totalShipped;
      document.getElementById('header-total-all').textContent = totalAll;
      document.getElementById('quarter-label').textContent = currentQuarterName;
      document.getElementById('active-week-label').textContent = `WEEK ${currentWeek}${currentWeek === calendarWeek ? ' (CURRENT)' : ''}`;
      document.getElementById('active-week-dates').textContent = `(${getWeekDateRange(currentWeek)})`;

      const todayEl = document.getElementById('today-date-label');
      if (todayEl) {
        const now = new Date();
        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        todayEl.textContent = `Today: ${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
      }

      const filterTag = document.getElementById('dri-filter-tag');
      if (activeDriFilter) {
        filterTag.textContent = `@${activeDriFilter} ×`;
        filterTag.classList.remove('hidden');
      } else {
        filterTag.classList.add('hidden');
      }
    }

    function renderScrubber() {
      const container = document.getElementById('week-scrubber');
      container.innerHTML = '';

      const scopedTasks = activeDriFilter
        ? tasks.filter(t => (t.dri || '').toLowerCase() === activeDriFilter.toLowerCase())
        : tasks;

      for (let w = 1; w <= 12; w++) {
        const weekTasks = scopedTasks.filter(t => t.week === w);
        const total = weekTasks.length;
        const shipped = weekTasks.filter(t => t.status).length;
        const isSelected = w === currentWeek;
        const isCalendarNow = w === calendarWeek;

        const tab = document.createElement('div');
        tab.className = `week-tab py-1.5 px-2 text-center select-none flex flex-col items-center ${isSelected ? 'active' : 'text-[var(--muted)] hover:text-[var(--fg)]'}`;
        tab.title = `${getWeekDateRange(w)}${isCalendarNow ? ' (Current Week)' : ''}`;
        tab.onclick = () => {
          currentWeek = w;
          if (showShippedView) showShippedView = false;
          render();
        };

        const dot = document.createElement('div');
        if (isSelected) {
          dot.className = 'current-week-dot';
        } else if (isCalendarNow) {
          dot.className = 'w-[4px] h-[4px] rounded-full border border-[var(--fg)] opacity-70 mb-[3px]';
        } else {
          dot.className = 'current-week-dot-placeholder';
        }

        const label = document.createElement('div');
        label.className = `text-xs font-mono tracking-tight leading-none ${isSelected ? 'font-semibold text-[var(--fg)]' : ''} ${isCalendarNow && !isSelected ? 'text-[var(--fg)] font-medium' : ''}`;
        label.textContent = `W${w}`;

        const barTrack = document.createElement('div');
        barTrack.className = 'w-full h-[2.5px] bg-[var(--bar-bg)] mt-2 rounded-full overflow-hidden flex';

        if (total > 0) {
          const shippedPct = (shipped / total) * 100;
          const openPct = 100 - shippedPct;

          if (shippedPct > 0) {
            const shippedFill = document.createElement('div');
            shippedFill.style.width = `${shippedPct}%`;
            shippedFill.className = 'h-full bg-[var(--bar-fill)]';
            barTrack.appendChild(shippedFill);
          }

          if (openPct > 0) {
            const openFill = document.createElement('div');
            openFill.style.width = `${openPct}%`;
            openFill.className = 'h-full bg-[var(--bar-fill)] opacity-35';
            barTrack.appendChild(openFill);
          }
        }

        tab.appendChild(dot);
        tab.appendChild(label);
        tab.appendChild(barTrack);
        container.appendChild(tab);
      }
    }

    function renderLists() {
      const todoList = document.getElementById('todo-list');
      const doneList = document.getElementById('done-list');
      todoList.innerHTML = '';
      doneList.innerHTML = '';

      let weekTasks = tasks.filter(t => t.week === currentWeek);
      if (activeDriFilter) {
        weekTasks = weekTasks.filter(t => (t.dri || '').toLowerCase() === activeDriFilter.toLowerCase());
      }

      const todos = weekTasks.filter(t => !t.status);
      const dones = weekTasks.filter(t => t.status);

      document.getElementById('todo-count').textContent = todos.length;
      document.getElementById('done-count').textContent = dones.length;

      if (todos.length === 0) {
        todoList.innerHTML = `<div class="py-6 text-xs text-[var(--muted)] opacity-50 italic font-mono select-none">No active commitments for Week ${currentWeek}.</div>`;
      } else {
        todos.forEach(task => todoList.appendChild(createTaskNode(task)));
      }

      if (dones.length === 0) {
        doneList.innerHTML = `<div class="py-6 text-xs text-[var(--muted)] opacity-50 italic font-mono select-none">Nothing shipped yet this week.</div>`;
      } else {
        dones.forEach(task => doneList.appendChild(createTaskNode(task)));
      }
    }

    function createTaskNode(task) {
      const row = document.createElement('div');
      row.className = 'task-item group flex items-start justify-between py-2.5 sm:py-3 transition-colors';
      row.id = `item-${task.id}`;

      const left = document.createElement('div');
      left.className = 'flex items-start space-x-3 flex-1 min-w-0 pr-3';

      const check = document.createElement('button');
      check.type = 'button';
      check.className = `tactile-checkbox ${task.status ? 'checked' : ''}`;
      check.setAttribute('aria-label', task.status ? 'Mark incomplete' : 'Mark complete');
      check.onclick = (e) => {
        e.stopPropagation();
        toggleStatus(task.id);
      };

      const titleContainer = document.createElement('div');
      titleContainer.className = 'flex-1 min-w-0 flex items-baseline flex-wrap gap-x-2';

      const titleSpan = document.createElement('span');
      titleSpan.className = `text-sm sm:text-base leading-snug cursor-text break-words ${task.status ? 'line-through text-[var(--muted)] opacity-60' : 'text-[var(--fg)]'}`;
      titleSpan.textContent = task.title;
      titleSpan.onclick = () => enableInlineEdit(task, titleContainer, titleSpan);

      titleContainer.appendChild(titleSpan);

      if (task.dri) {
        const driSpan = document.createElement('button');
        driSpan.type = 'button';
        driSpan.className = 'text-xs font-mono text-[var(--muted)] hover:text-[var(--fg)] transition-colors select-none cursor-pointer';
        driSpan.textContent = `@${task.dri}`;
        driSpan.title = `Filter by @${task.dri}`;
        driSpan.onclick = (e) => {
          e.stopPropagation();
          setDriFilter(task.dri);
        };
        titleContainer.appendChild(driSpan);
      }

      left.appendChild(check);
      left.appendChild(titleContainer);

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del-btn text-base font-mono leading-none p-1 text-[var(--muted)] hover:text-[var(--fg)] select-none cursor-pointer';
      del.textContent = '×';
      del.title = 'Delete deliverable';
      del.onclick = (e) => {
        e.stopPropagation();
        deleteTask(task.id);
      };

      row.appendChild(left);
      row.appendChild(del);
      return row;
    }

    function renderShippedLedger() {
      const container = document.getElementById('ledger-content');
      container.innerHTML = '';

      const scopedTasks = activeDriFilter
        ? tasks.filter(t => (t.dri || '').toLowerCase() === activeDriFilter.toLowerCase())
        : tasks;

      const shipped = scopedTasks.filter(t => t.status);

      if (shipped.length === 0) {
        container.innerHTML = `<div class="py-12 text-center text-sm font-mono text-[var(--muted)] opacity-60">No shipped deliverables recorded yet this quarter.</div>`;
        return;
      }

      // Group deliverables by week (12 down to 1)
      for (let w = 12; w >= 1; w--) {
        const weekShipped = shipped.filter(t => t.week === w);
        if (weekShipped.length === 0) continue;

        const section = document.createElement('div');
        section.className = 'flex flex-col border-b border-[var(--hairline-subtle)] pb-6';

        const header = document.createElement('div');
        header.className = 'flex items-baseline justify-between mb-3';

        const title = document.createElement('div');
        title.className = 'text-xs font-mono font-medium';
        title.innerHTML = `<span class="text-[var(--fg)]">WEEK ${w}</span> <span class="text-[var(--muted)] opacity-60 ml-2">(${getWeekDateRange(w)})</span>`;

        const count = document.createElement('div');
        count.className = 'text-xs font-mono text-[var(--muted)]';
        count.textContent = `${weekShipped.length} shipped`;

        header.appendChild(title);
        header.appendChild(count);
        section.appendChild(header);

        const list = document.createElement('div');
        list.className = 'flex flex-col space-y-2';

        weekShipped.forEach(t => {
          const row = document.createElement('div');
          row.className = 'flex items-baseline justify-between text-sm';

          const left = document.createElement('div');
          left.className = 'flex items-baseline space-x-2';
          left.innerHTML = `<span class="text-[var(--fg)] opacity-80 line-through">${escapeHtml(t.title)}</span>`;

          if (t.dri) {
            left.innerHTML += `<span class="text-xs font-mono text-[var(--muted)]">@${escapeHtml(t.dri)}</span>`;
          }

          row.appendChild(left);
          list.appendChild(row);
        });

        section.appendChild(list);
        container.appendChild(section);
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function toggleStatus(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, status: !t.status } : t);
      saveToStorage();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveToStorage();
      render();
    }

    function handleCapture(e) {
      e.preventDefault();
      const input = document.getElementById('capture-input');
      const val = input.value.trim();
      if (!val) return;

      const driMatch = val.match(/@(\w+)/);
      let dri = driMatch ? driMatch[1] : null;
      let title = val.replace(/@\w+/, '').trim();

      if (!dri && activeDriFilter) {
        dri = activeDriFilter;
      }

      if (!title && dri) {
        title = `Focus commitment`;
      }

      tasks.push({
        id: 't-' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
        title: title,
        status: false,
        dri: dri,
        week: currentWeek
      });

      input.value = '';
      saveToStorage();
      render();
    }

    function enableInlineEdit(task, container, textElement) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'bg-transparent text-sm sm:text-base border-b border-[var(--fg)] outline-none w-full py-0 font-normal rounded-none';
      input.value = task.dri ? `${task.title} @${task.dri}` : task.title;

      container.innerHTML = '';
      container.appendChild(input);
      input.focus();

      let isFinished = false;

      const save = () => {
        if (isFinished) return;
        isFinished = true;

        const val = input.value.trim();
        if (!val) {
          deleteTask(task.id);
          return;
        }

        const driMatch = val.match(/@(\w+)/);
        const dri = driMatch ? driMatch[1] : null;
        const title = val.replace(/@\w+/, '').trim();

        tasks = tasks.map(t => t.id === task.id ? {
          ...t,
          title: title || task.title,
          dri: dri
        } : t);

        saveToStorage();
        render();
      };

      input.onkeydown = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          save();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          isFinished = true;
          render();
        } else if (e.key === 'Backspace' && input.value.trim() === '') {
          e.preventDefault();
          deleteTask(task.id);
        }
      };

      input.onblur = save;
    }

    function setDriFilter(dri) {
      activeDriFilter = dri;
      render();
    }

    function clearDriFilter() {
      activeDriFilter = null;
      render();
    }

    function jumpToCurrentWeek() {
      calculateQuarterContext();
      currentWeek = calendarWeek;
      if (showShippedView) showShippedView = false;
      render();
    }

    function toggleShippedView() {
      showShippedView = !showShippedView;
      const board = document.getElementById('board-container');
      const capture = document.getElementById('capture-container');
      const ledger = document.getElementById('shipped-ledger-view');
      const icon = document.getElementById('ledger-icon');

      if (showShippedView) {
        board.classList.add('hidden');
        capture.classList.add('hidden');
        ledger.classList.remove('hidden');
        icon.textContent = '↑ board';
        renderShippedLedger();
      } else {
        board.classList.remove('hidden');
        capture.classList.remove('hidden');
        ledger.classList.add('hidden');
        icon.textContent = '↓';
        render();
      }
    }

    function exportData() {
      const payload = {
        app: "cadence",
        year: currentQuarterYear,
        quarter: currentQuarterName,
        exportedAt: new Date().toISOString(),
        tasks: tasks
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `cadence-${currentQuarterYear}-${currentQuarterName}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importData() {
      document.getElementById('file-import-input').click();
    }

    function handleFileSelected(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          const importedTasks = Array.isArray(parsed) ? parsed : (parsed.tasks || []);
          
          if (!Array.isArray(importedTasks) || importedTasks.length === 0) {
            return;
          }

          if (tasks.length === 0) {
            tasks = importedTasks;
            saveToStorage();
            render();
            return;
          }

          pendingImportPayload = importedTasks;
          document.getElementById('import-count-label').textContent = importedTasks.length;
          document.getElementById('import-resolution-modal').classList.remove('hidden');
        } catch (err) {
          console.warn('Invalid JSON file format', err);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function cancelImport() {
      pendingImportPayload = null;
      document.getElementById('import-resolution-modal').classList.add('hidden');
    }

    function executeImport(mode) {
      if (!pendingImportPayload) return;

      if (mode === 'replace') {
        tasks = pendingImportPayload;
      } else if (mode === 'merge') {
        const existingKeys = new Set(tasks.map(t => `${t.week}-${(t.title || '').trim().toLowerCase()}-${(t.dri || '').toLowerCase()}`));
        const toAdd = [];

        pendingImportPayload.forEach(item => {
          const key = `${item.week}-${(item.title || '').trim().toLowerCase()}-${(item.dri || '').toLowerCase()}`;
          if (!existingKeys.has(key)) {
            toAdd.push(item);
            existingKeys.add(key);
          } else {
            if (item.status) {
              tasks = tasks.map(t => {
                const curKey = `${t.week}-${(t.title || '').trim().toLowerCase()}-${(t.dri || '').toLowerCase()}`;
                return curKey === key ? { ...t, status: true } : t;
              });
            }
          }
        });

        tasks = [...tasks, ...toAdd];
      }

      saveToStorage();
      cancelImport();
      render();
    }

    function promptClearAll() {
      const btn = document.getElementById('clear-board-btn');
      if (btn.dataset.confirming === "true") {
        clearTimeout(clearConfirmTimeout);
        tasks = [];
        saveToStorage();
        btn.textContent = 'clear';
        btn.dataset.confirming = "false";
        render();
      } else {
        btn.textContent = 'confirm clear?';
        btn.dataset.confirming = "true";
        clearConfirmTimeout = setTimeout(() => {
          btn.textContent = 'clear';
          btn.dataset.confirming = "false";
        }, 3500);
      }
    }

    function render() {
      renderTotals();
      renderScrubber();
      if (showShippedView) {
        renderShippedLedger();
      } else {
        renderLists();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (showShippedView) {
          toggleShippedView();
        } else if (activeDriFilter) {
          clearDriFilter();
        }
      }
    });

    window.onload = function() {
      calculateQuarterContext();
      currentWeek = calendarWeek;

      const loaded = loadFromStorage();
      if (!loaded) {
        tasks = [...defaultTasks];
        saveToStorage();
      }

      render();
    };
  </script>
</body>
</html>
