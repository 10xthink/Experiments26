<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>The Compounding Mind</title>
<style>
  :root{
    --ink:#111111;
    --paper:#FAF9F6;
    --line:#111111;
    --faint:#8a8578;
    --hair:#D8D4C8;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"]{
    --ink:#ECEAE3;
    --paper:#141310;
    --faint:#8f8a7c;
    --hair:#33312A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior:none;
    padding-top:var(--safe-t); padding-bottom:var(--safe-b);
    transition:background .2s ease, color .2s ease;
  }
  #app{ max-width:640px; margin:0 auto; min-height:100vh; padding:22px 20px 48px; }

  /* ---------- header ---------- */
  .top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; }
  .brand h1{
    margin:0; font-size:26px; font-weight:800; letter-spacing:-.01em;
    text-transform:uppercase; line-height:1;
  }
  .tagline{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-top:6px; }
  .icon-row{ display:flex; gap:10px; }
  .icon-btn{
    border:none; background:none; cursor:pointer; color:var(--ink); font-size:17px;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    border:1.3px solid var(--hair); border-radius:50%;
  }

  .day-nav{ display:flex; align-items:center; justify-content:center; gap:14px; margin:22px 0 26px; }
  .flip-btn{
    border:1.3px solid var(--ink); background:none; color:var(--ink); cursor:pointer;
    width:34px; height:34px; border-radius:50%; font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .flip-btn:disabled{ opacity:.25; cursor:default; }
  .day-badge{
    border:1.6px solid var(--ink); border-radius:4px; padding:6px 16px; text-align:center; min-width:110px;
  }
  .day-badge .num{ font-size:15px; font-weight:800; letter-spacing:.03em; }
  .day-badge .date{ font-size:10px; color:var(--faint); letter-spacing:.06em; margin-top:2px; text-transform:uppercase; }
  .today-pill{ text-align:center; font-size:11px; color:var(--faint); margin:-16px 0 20px; letter-spacing:.08em; text-transform:uppercase; }

  .intro-line{ font-size:14px; color:var(--faint); margin:-8px 0 20px; line-height:1.5; }

  /* ---------- sections ---------- */
  .section{ margin-bottom:30px; }
  .section-head{ display:flex; align-items:center; gap:12px; margin-bottom:4px; }
  .badge-num{
    width:28px; height:28px; border-radius:50%; background:var(--ink); color:var(--paper);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;
  }
  .section h2{ margin:0; font-size:19px; font-weight:800; letter-spacing:-.01em; text-transform:uppercase; }
  .section-sub{ font-size:13.5px; color:var(--faint); margin:6px 0 16px 40px; line-height:1.5; }

  /* ---------- item rows ---------- */
  .item-row{
    display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--hair);
  }
  .marker{
    width:22px; height:22px; border-radius:50%; border:1.6px solid var(--ink); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .marker.circled{ background:var(--ink); }
  .marker.crossed{ border-style:solid; }
  .marker svg{ width:12px; height:12px; }
  .marker svg line{ stroke:var(--ink); stroke-width:2; stroke-linecap:round; }
  .item-row.crossed .item-text{
    text-decoration:line-through; text-decoration-thickness:1.6px; text-decoration-color:var(--faint);
    color:var(--faint);
  }
  .item-text{ flex:1; font-size:16.5px; line-height:1.4; word-break:break-word; }
  .del-btn{
    border:none; background:none; color:var(--faint); font-size:18px; line-height:1; cursor:pointer;
    padding:4px 6px; flex-shrink:0;
  }

  .add-row{ display:flex; align-items:center; gap:10px; border-bottom:2px solid var(--ink); padding:10px 2px; margin-top:4px; }
  .add-row input{
    flex:1; border:none; background:none; font-size:16.5px; font-family:inherit; color:var(--ink);
    outline:none; padding:6px 0;
  }
  .add-row input::placeholder{ color:var(--faint); }
  .add-circle{
    width:32px; height:32px; border-radius:50%; border:1.6px solid var(--ink); background:none; color:var(--ink);
    font-size:20px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .helper-note{ font-size:12.5px; color:var(--faint); margin-top:10px; }

  .lock-btn{
    display:block; width:100%; margin-top:18px; padding:15px; font-size:14.5px; font-weight:700;
    letter-spacing:.03em; text-transform:uppercase; background:var(--ink); color:var(--paper);
    border:none; border-radius:3px; cursor:pointer;
  }
  .lock-btn:disabled{ opacity:.3; cursor:default; }
  .empty-note{ font-size:14px; color:var(--faint); padding:14px 2px; }

  /* ---------- start blocks ---------- */
  .start-block{ border:1.3px solid var(--hair); border-radius:4px; padding:16px 16px 14px; margin-bottom:14px; }
  .start-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .start-head .badge-num{ width:24px; height:24px; font-size:12px; }
  .start-head .start-text{ font-size:16px; font-weight:700; }
  .step-line{ display:flex; align-items:center; gap:12px; }
  .step-input{
    flex:1; border:none; border-bottom:1.4px solid var(--hair); background:none; font-family:inherit;
    font-size:15px; color:var(--ink); outline:none; padding:7px 2px;
  }
  .step-static{ flex:1; font-size:15px; padding:7px 2px; color:var(--ink); border-bottom:1.4px solid var(--hair); min-height:15px; }
  .step-static.empty{ color:var(--faint); }
  .done-check{ display:flex; align-items:center; gap:7px; cursor:pointer; flex-shrink:0; user-select:none; }
  .done-box{
    width:19px; height:19px; border:1.6px solid var(--ink); border-radius:3px; display:flex; align-items:center; justify-content:center;
  }
  .done-box svg{ width:12px; height:12px; opacity:0; }
  .done-box svg path{ fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .done-check.done .done-box svg{ opacity:1; }
  .done-label{ font-size:11.5px; letter-spacing:.05em; color:var(--faint); text-transform:uppercase; }

  .footer-tagline{ text-align:center; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-top:26px; }
  .milestone{ text-align:center; font-size:13px; color:var(--faint); line-height:1.6; margin-top:18px; padding:14px; border:1px dashed var(--hair); border-radius:4px; }

  /* ---------- confirm screen (inline, replaces body) ---------- */
  .confirm-wrap{ display:flex; flex-direction:column; min-height:70vh; text-align:center; }
  .confirm-wrap h2{ font-size:22px; font-weight:800; }
  .confirm-wrap p{ font-size:14.5px; color:var(--faint); line-height:1.55; margin:14px 0 30px; }
  .btn-danger{
    padding:16px; font-size:14.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    background:#8a2b20; color:#fff; border:none; border-radius:3px; cursor:pointer; margin-bottom:12px;
  }
  .btn-keep{
    padding:15px; font-size:14.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    background:none; color:var(--ink); border:1.4px solid var(--ink); border-radius:3px; cursor:pointer;
  }

  ::selection{ background:var(--ink); color:var(--paper); }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
"use strict";

const KEY = "compounding-mind-v2";

function todayISO(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function daysBetween(a,b){
  const A = new Date(a+"T00:00:00"), B = new Date(b+"T00:00:00");
  return Math.round((B-A)/86400000);
}
function fmtDate(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString(undefined,{month:"short", day:"numeric"});
}
function escapeHTML(s){
  return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function uid(){ return Math.random().toString(36).slice(2,9); }

function freshState(){
  return {
    onboarded:false,
    startDate:null,
    theme: (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light",
    pages:{}   // dateISO -> { items:[{id,text,circled,circleOrder,crossed}], locked:bool, steps:{itemId:{text,done}} }
  };
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
let state = load() || freshState();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

function emptyPage(){ return { items:[], locked:false, steps:{} }; }
function getPage(dateISO){ return state.pages[dateISO] || emptyPage(); }
function ensurePage(dateISO){
  if(!state.pages[dateISO]) state.pages[dateISO] = emptyPage();
  return state.pages[dateISO];
}
function dayNumberFor(dateISO){
  if(!state.startDate) return 1;
  return daysBetween(state.startDate, dateISO) + 1;
}
function circledItems(page){
  return page.items.filter(i=>i.circled).sort((a,b)=>(a.circleOrder||0)-(b.circleOrder||0));
}

let viewingDate = todayISO();
let showingConfirm = false;

/* ---- flippable dates: written pages + today, never beyond today ---- */
function flippableDates(){
  const today = todayISO();
  const set = new Set(Object.keys(state.pages));
  set.add(today);
  return [...set].filter(d=>d<=today).sort();
}
function flip(dir){
  const dates = flippableDates();
  const idx = dates.indexOf(viewingDate);
  const next = dates[idx+dir];
  if(next){ viewingDate = next; render(); }
}

/* ---------- theme ---------- */
function applyTheme(){
  document.documentElement.setAttribute("data-theme", state.theme);
}
function toggleTheme(){
  state.theme = state.theme==="dark" ? "light" : "dark";
  save(); applyTheme();
}

/* ================= RENDER ================= */
const app = document.getElementById("app");

function render(){
  if(!state.onboarded){ state.onboarded = true; state.startDate = todayISO(); save(); }
  applyTheme();
  if(showingConfirm){ renderConfirm(); return; }

  const dateISO = viewingDate;
  const page = getPage(dateISO);
  const today = todayISO();
  const editable = dateISO === today;
  const day = dayNumberFor(dateISO);
  const dates = flippableDates();
  const idx = dates.indexOf(dateISO);
  const canPrev = idx > 0;
  const canNext = idx < dates.length-1;

  let html = `
    <div class="top">
      <div class="brand">
        <h1>The Compounding Mind</h1>
        <div class="tagline">Less noise today. A brighter tomorrow.</div>
      </div>
      <div class="icon-row">
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">${state.theme==="dark"?"☀":"☾"}</button>
        <button class="icon-btn" id="menuBtn" aria-label="Settings">⋯</button>
      </div>
    </div>

    <div class="day-nav">
      <button class="flip-btn" id="prevBtn" ${canPrev?"":"disabled"} aria-label="Previous day">‹</button>
      <div class="day-badge">
        <div class="num">DAY ${day} / 30</div>
        <div class="date">${fmtDate(dateISO)}</div>
      </div>
      <button class="flip-btn" id="nextBtn" ${canNext?"":"disabled"} aria-label="Next day">›</button>
    </div>
    ${editable ? "" : `<div class="today-pill">A page from your journal</div>`}
    ${(day===1 && editable) ? `<p class="intro-line">You don't need to do everything you think of.</p>` : ""}
  `;

  /* ---- Section 1 ---- */
  html += `
    <div class="section">
      <div class="section-head"><div class="badge-num">1</div><h2>Empty your head</h2></div>
      <div class="section-sub">
        Write everything that's on your mind.<br>
        <span style="display:inline-block;width:14px;height:14px;border:1.6px solid var(--ink);border-radius:50%;vertical-align:-2px;margin-right:6px;"></span>Circle 3 that move the life you want forward.
        &nbsp;&nbsp;✕ Cross out the rest.
      </div>
      <div id="itemList">${renderItemList(page, editable)}</div>
  `;
  if(editable && !page.locked){
    html += `
      <div class="add-row">
        <input id="itemInput" type="text" placeholder="Type one thing…" autocomplete="off" aria-label="Add a thought">
        <button class="add-circle" id="addBtn" aria-label="Add">+</button>
      </div>
    `;
    const circledCount = page.items.filter(i=>i.circled).length;
    html += `<div class="helper-note" id="helperNote">${circledCount>0 ? circledCount+" of 3 circled" : ""}</div>`;
    html += `<button class="lock-btn" id="lockBtn" ${circledCount>0?"":"disabled"}>Cross out the rest</button>`;
  } else if(page.items.length===0){
    html += `<div class="empty-note">Nothing written on this page.</div>`;
  }
  html += `</div>`;

  /* ---- Section 2 ---- */
  const circled = circledItems(page);
  if(page.locked && circled.length>0){
    html += `
      <div class="section">
        <div class="section-head"><div class="badge-num">2</div><h2>Start</h2></div>
        <div class="section-sub">Smallest next step for each. Do them in any order.</div>
    `;
    circled.forEach((it, i)=>{
      const stepData = page.steps[it.id] || {text:"", done:false};
      html += `
        <div class="start-block" data-item="${it.id}">
          <div class="start-head">
            <div class="badge-num">${i+1}</div>
            <div class="start-text">${escapeHTML(it.text)}</div>
          </div>
          <div class="step-line">
            ${editable
              ? `<input class="step-input" data-item="${it.id}" type="text" placeholder="Smallest next step…" value="${escapeHTML(stepData.text)}">`
              : `<div class="step-static ${stepData.text?"":"empty"}">${escapeHTML(stepData.text || "— not written")}</div>`
            }
            <label class="done-check ${stepData.done?"done":""}" data-item="${it.id}">
              <span class="done-box"><svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4"/></svg></span>
              <span class="done-label">Done</span>
            </label>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }

  if(day>=30 && editable){
    html += `<div class="milestone">Day 30. Same discipline builds itself now — try tomorrow without opening this. The journal keeps every page whenever you come back.</div>`;
  }

  html += `<div class="footer-tagline">Small steps today. A bigger tomorrow.</div>`;

  app.innerHTML = html;
  wireEvents(page, editable, dateISO);
}

function renderItemList(page, editable){
  return page.items.map(it=>{
    const showCrossed = page.locked && !it.circled;
    const rowClass = showCrossed ? "item-row crossed" : "item-row";
    let marker;
    if(it.circled){
      marker = `<span class="marker circled" data-id="${it.id}"></span>`;
    } else if(showCrossed){
      marker = `<span class="marker crossed" data-id="${it.id}"><svg viewBox="0 0 12 12"><line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/></svg></span>`;
    } else {
      marker = `<span class="marker" data-id="${it.id}"></span>`;
    }
    const del = (editable && !page.locked) ? `<button class="del-btn" data-id="${it.id}" aria-label="Remove">×</button>` : "";
    return `<div class="${rowClass}"><div class="marker-slot">${marker}</div><span class="item-text">${escapeHTML(it.text)}</span>${del}</div>`;
  }).join("");
}

function renderConfirm(){
  app.innerHTML = `
    <div class="confirm-wrap">
      <div style="flex:1"></div>
      <h2>Erase everything?</h2>
      <p>Every page in this journal — every thought, every choice, every step — will be gone for good. This can't be undone.</p>
      <button class="btn-danger" id="confirmEraseBtn">Erase everything</button>
      <button class="btn-keep" id="cancelEraseBtn">Keep my journal</button>
      <div style="flex:1"></div>
    </div>
  `;
  document.getElementById("confirmEraseBtn").addEventListener("click", ()=>{
    localStorage.removeItem(KEY);
    state = freshState();
    viewingDate = todayISO();
    showingConfirm = false;
    save();
    render();
  });
  document.getElementById("cancelEraseBtn").addEventListener("click", ()=>{
    showingConfirm = false;
    render();
  });
}

function wireEvents(page, editable, dateISO){
  const themeBtn = document.getElementById("themeBtn");
  if(themeBtn) themeBtn.addEventListener("click", toggleTheme);

  const menuBtn = document.getElementById("menuBtn");
  if(menuBtn) menuBtn.addEventListener("click", ()=>{ showingConfirm = true; render(); });

  const prevBtn = document.getElementById("prevBtn");
  if(prevBtn) prevBtn.addEventListener("click", ()=>flip(-1));
  const nextBtn = document.getElementById("nextBtn");
  if(nextBtn) nextBtn.addEventListener("click", ()=>flip(1));

  if(editable && !page.locked){
    const input = document.getElementById("itemInput");
    const addBtn = document.getElementById("addBtn");
    function addItem(){
      const v = input.value.trim();
      if(!v) return;
      const p = ensurePage(dateISO);
      p.items.push({id:uid(), text:v, circled:false, circleOrder:null, crossed:false});
      save();
      input.value = "";
      render();
      const el = document.getElementById("itemInput");
      if(el) el.focus();
    }
    if(addBtn) addBtn.addEventListener("click", addItem);
    if(input){
      input.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); addItem(); } });
    }

    document.querySelectorAll("#itemList .marker").forEach(m=>{
      m.addEventListener("click", ()=>{
        const id = m.getAttribute("data-id");
        const p = ensurePage(dateISO);
        const item = p.items.find(i=>i.id===id);
        const circledCount = p.items.filter(i=>i.circled).length;
        if(!item.circled && circledCount>=3) return;
        item.circled = !item.circled;
        item.circleOrder = item.circled ? Date.now() : null;
        save();
        render();
      });
    });
    document.querySelectorAll("#itemList .del-btn").forEach(b=>{
      b.addEventListener("click", ()=>{
        const id = b.getAttribute("data-id");
        const p = ensurePage(dateISO);
        p.items = p.items.filter(i=>i.id!==id);
        save();
        render();
      });
    });

    const lockBtn = document.getElementById("lockBtn");
    if(lockBtn) lockBtn.addEventListener("click", ()=>{
      const p = ensurePage(dateISO);
      p.items.forEach(i=>{ if(!i.circled) i.crossed = true; });
      p.locked = true;
      save();
      render();
    });
  }

  if(editable && page.locked){
    document.querySelectorAll(".step-input").forEach(inp=>{
      inp.addEventListener("input", ()=>{
        const id = inp.getAttribute("data-item");
        const p = ensurePage(dateISO);
        if(!p.steps[id]) p.steps[id] = {text:"", done:false};
        p.steps[id].text = inp.value;
        save();
      });
    });
    document.querySelectorAll(".done-check").forEach(chk=>{
      chk.addEventListener("click", ()=>{
        const id = chk.getAttribute("data-item");
        const p = ensurePage(dateISO);
        if(!p.steps[id]) p.steps[id] = {text:"", done:false};
        p.steps[id].done = !p.steps[id].done;
        save();
        render();
      });
    });
  }

  // swipe to flip pages
  let touchX = null, touchY = null;
  app.addEventListener("touchstart", e=>{
    touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
  }, {passive:true});
  app.addEventListener("touchend", e=>{
    if(touchX===null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
      flip(dx < 0 ? 1 : -1);
    }
    touchX = null; touchY = null;
  }, {passive:true});
}

render();
})();
</script>
</body>
</html>
