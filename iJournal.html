<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Arc — Make room for life</title>
<style>
:root{--bg:#fbfbfd;--fg:#1d1d1f;--mut:#6e6e73;--line:#e5e5ea;--fill:rgba(120,120,128,.12);--card:#fff;--acc:#0071e3;--warn:#b25000;--glass:rgba(255,255,255,.93);--on:#fff;--shadow:0 12px 44px rgba(0,0,0,.14)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f5f5f7;--mut:#a1a1a6;--line:#2c2c2e;--fill:rgba(120,120,128,.24);--card:#1c1c1e;--acc:#2997ff;--warn:#ff9f0a;--glass:rgba(28,28,30,.93);--on:#48484a;--shadow:0 12px 44px rgba(0,0,0,.65)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.4}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 22px calc(220px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 0 10px;background:linear-gradient(var(--bg) 78%,transparent)}
.mark{font-size:1.35rem;font-weight:700;letter-spacing:-.06em}.mark i{font-style:normal;color:var(--acc)}
.tools{display:flex;gap:2px}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--mut);transition:background .15s,color .15s}
.ib:hover{background:var(--fill);color:var(--fg)}
.ib svg{width:22px;height:22px}
#searchbar{padding:6px 0 4px}
#q{width:100%;border:0;border-radius:14px;background:var(--fill);padding:.75rem 1rem;font-size:1rem;outline:none}
#q:focus-visible{outline:2px solid var(--acc)}
.pchips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.pchips button{white-space:nowrap;background:var(--fill);border-radius:999px;padding:.35rem .85rem;font-size:.9rem}
#hero{padding:6px 0 0}
.eyebrow{margin:0;color:var(--mut);font-size:1rem;font-weight:500}
h1{margin:.02em 0 0;font-size:clamp(2.15rem,6vw,2.9rem);line-height:1.05;letter-spacing:-.045em;font-weight:700}
.sub{margin:0;color:var(--mut);font-size:1.2rem;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px}
.seg button{padding:.5rem 1.15rem;border-radius:999px;font-size:.95rem;font-weight:500;color:var(--mut);transition:background .2s,color .2s,box-shadow .2s}
.seg button[aria-selected=true]{background:var(--on);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
main{outline:none;min-height:300px}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2.sec{margin:38px 0 4px;font-size:.85rem;font-weight:600;color:var(--mut);letter-spacing:.02em;display:flex;justify-content:space-between;align-items:baseline}
#view>.sec:first-child,#view>.fchips+.sec{margin-top:22px}
h2.sec button{font-weight:500;color:var(--acc);font-size:.9rem}
.row{display:flex;gap:6px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);transition:opacity .3s}
.row.enter{animation:enter .4s cubic-bezier(.2,.8,.2,1)}
.rb{flex:none}
.b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:background .15s,transform .15s,color .15s}
.b:hover{background:var(--fill)}.b:active{transform:scale(.88)}
.b svg{width:24px;height:24px}
.b.note{color:var(--mut)}.b.foc{color:var(--acc)}
.rc{flex:1;min-width:0;padding-top:4px}
.t{font-size:1.1rem;letter-spacing:-.012em;overflow-wrap:anywhere;cursor:text;transition:color .3s}
.body{color:var(--mut);font-size:.95rem;white-space:pre-wrap;margin-top:2px;overflow-wrap:anywhere}
.row.done .t{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1px}
.row.done{opacity:.62}
.m{display:flex;flex-wrap:wrap;gap:2px 12px;color:var(--mut);font-size:.84rem;margin-top:2px}
.m:empty{display:none}
.warn{color:var(--warn)}.foc{color:var(--acc);font-weight:600}
.chip{color:var(--acc);display:inline;font:inherit}
.chip:hover{text-decoration:underline}
.more{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mut);margin-top:0}
.more svg{width:20px;height:20px}
@media(hover:hover){.more{opacity:0}.row:hover .more,.row:focus-within .more,.more[aria-expanded=true]{opacity:1}}
.more:hover{background:var(--fill)}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 4px;animation:fade .2s ease}
.pb,.pin{background:var(--fill);border-radius:999px;padding:.4rem .85rem;font-size:.88rem;display:inline-flex;gap:.5rem;align-items:center}
.pb:hover{background:var(--line)}.pb.danger{color:#d70015}
.pin input{background:none;border:0;font-size:.88rem;padding:0;outline:none;color-scheme:light dark}
.pin span{color:var(--mut)}
.edit{width:100%;font:inherit;font-size:1.1rem;letter-spacing:-.012em;border:0;background:var(--fill);border-radius:12px;padding:.55rem .75rem;resize:none;outline:2px solid var(--acc);display:block}
.big .t{font-size:1.65rem;letter-spacing:-.03em;font-weight:600;line-height:1.15}
.big .b svg{width:30px;height:30px}.big .b{width:40px;height:40px}
.nudge .t{font-size:1rem;cursor:default}
.heart{color:#ff375f}
.nbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 22px;margin-top:34px}
.card p{margin:0}.card .q{font-size:1.35rem;font-weight:600;letter-spacing:-.025em;margin:4px 0 14px}
.card form{display:flex;gap:10px}
.card input{flex:1;min-width:0;border:0;background:var(--fill);border-radius:12px;padding:.7rem .9rem;font-size:1rem;outline:none}
.card input:focus-visible{outline:2px solid var(--acc)}
.primary{background:var(--fg);color:var(--bg);border-radius:999px;padding:.65rem 1.2rem;font-weight:600;font-size:.95rem;text-align:center}
.ghost{background:var(--fill);border-radius:999px;padding:.65rem 1.2rem;font-weight:500;font-size:.95rem;text-align:center;display:inline-block}
.link{color:var(--acc);font-size:.9rem}
.mut{color:var(--mut)}
.empty{color:var(--mut);font-size:1.15rem;padding:28px 0;line-height:1.5}
.try{display:block;width:100%;padding:14px 0;border-bottom:1px solid var(--line);font-size:1.1rem;letter-spacing:-.01em}
.try small{display:block;color:var(--mut);font-size:.85rem;margin-top:2px}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.fchips button{white-space:nowrap;background:var(--fill);border-radius:999px;padding:.35rem .85rem;font-size:.9rem;color:var(--mut)}
.fchips button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.banner{display:flex;justify-content:space-between;gap:10px;padding:8px 0;color:var(--mut);font-size:.95rem}
.banner button{color:var(--acc)}
foot,footer{display:block}
footer:empty{display:none}footer{margin-top:40px;color:var(--mut);font-size:.82rem;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
footer button{color:var(--acc);font-size:.82rem}
/* composer */
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:10;will-change:transform}
.dock::before{content:'';position:absolute;left:0;right:0;bottom:0;height:140%;background:linear-gradient(transparent,var(--bg) 55%);pointer-events:none}
.composer{pointer-events:auto;position:relative;width:100%;max-width:640px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:8px 8px 8px 10px;transition:border-color .2s}
.composer.on{border-color:color-mix(in srgb,var(--acc) 45%,var(--line))}
.inrow{display:flex;align-items:flex-end;gap:6px}
.cg{width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--mut);transition:color .2s}
.composer.on .cg{color:var(--fg)}
.cg svg{width:24px;height:24px}
#ta{flex:1;min-width:0;border:0;background:transparent;resize:none;outline:none;font-size:1.06rem;line-height:1.35;padding:6px 4px;max-height:140px;letter-spacing:-.012em}
#ta::placeholder{color:var(--mut)}
.send{flex:none;width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;transition:transform .2s,opacity .2s}
.send:disabled{opacity:0;transform:scale(.6);pointer-events:none}
.send svg{width:18px;height:18px}
.hint{font-size:.85rem;color:var(--mut);padding:2px 12px 8px}
.hint b{color:var(--fg);font-weight:600}
.types{display:none;gap:4px;padding:2px 2px 8px;overflow-x:auto;scrollbar-width:none}
.composer.on .types{display:flex}
.types button{display:inline-flex;align-items:center;gap:2px;padding:.2rem .7rem .2rem .3rem;border-radius:999px;font-size:.85rem;color:var(--mut);white-space:nowrap}
.types button svg{width:20px;height:20px}
.types button span{display:none}.types button.on span{display:inline}.types button{padding:.2rem .5rem .2rem .3rem}.types button.on{background:var(--fill);color:var(--fg);padding-right:.8rem}
.sugg{display:flex;gap:6px;padding:0 2px 8px;overflow-x:auto}
.sugg button{background:var(--fill);border-radius:999px;padding:.3rem .8rem;font-size:.9rem;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:#1d1d1fe6;color:#f5f5f7;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:999px;padding:.65rem 1.1rem;font-size:.92rem;display:flex;gap:14px;align-items:center;opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s;z-index:30;max-width:calc(100% - 28px)}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
.toast button{color:#6cb6ff;font-weight:600}
/* sheet */
dialog{border:0;padding:0;background:var(--card);color:var(--fg);border-radius:28px;width:min(520px,calc(100% - 24px));max-height:88vh;box-shadow:var(--shadow);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.38);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog[open]{animation:fade .25s ease}
@media(max-width:600px){dialog{margin:auto auto max(12px,env(safe-area-inset-bottom))}}
.sh{padding:24px 24px 26px}
.shh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.shh h3{margin:0;font-size:1.6rem;letter-spacing:-.04em}
.ptitle{font-size:1.8rem;font-weight:700;letter-spacing:-.04em;border:0;background:none;outline:none;width:100%;padding:0}
.x{width:34px;height:34px;border-radius:50%;background:var(--fill);color:var(--mut);font-size:1.3rem;display:grid;place-items:center;flex:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.fields{display:grid;gap:12px;margin:18px 0}
.fields label{display:block;font-size:.8rem;color:var(--mut)}
.fields input,.fields select,.sh textarea.msg{display:block;width:100%;margin-top:5px;border:0;background:var(--fill);border-radius:12px;padding:.7rem .85rem;font-size:1rem;outline:none;color-scheme:light dark}
.fields input:focus-visible,.fields select:focus-visible,.sh textarea.msg:focus-visible{outline:2px solid var(--acc)}
.sh textarea.msg{min-height:130px;resize:vertical;margin:14px 0}
.recent{margin:8px 0 0;padding:0;list-style:none;font-size:.95rem}
.recent li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.recent time{color:var(--mut);min-width:84px;font-size:.85rem;padding-top:1px}
.danger{color:#d70015;font-size:.92rem;margin-top:18px}
code{background:var(--fill);border-radius:6px;padding:.1rem .4rem;font-size:.88em}
.legend{display:grid;gap:10px;margin:14px 0;font-size:.95rem}
.legend div{display:flex;gap:10px;align-items:center}.legend svg{width:22px;height:22px;flex:none}
@media(max-width:600px){
.mark{display:none}
.eyebrow{font-size:.95rem}
.seg button{padding:.42rem 1rem;font-size:.92rem}
#view>.sec:first-child,#view>.fchips+.sec{margin-top:10px}
h2.sec{margin-top:26px}
.row{padding:8px 0}
.t{font-size:1.05rem}
.big .t{font-size:1.4rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button id="home" class="mark" aria-label="Arc, back to Today">arc<i>.</i></button>
    <div class="seg" role="tablist" aria-label="View" id="seg">
    <button role="tab" id="tab-today" data-v="today" aria-controls="view">Today</button>
    <button role="tab" id="tab-ahead" data-v="ahead" aria-controls="view">Ahead</button>
    <button role="tab" id="tab-log" data-v="log" aria-controls="view">Past</button>
  </div>
    <div class="tools">
      <button class="ib" id="sbtn" aria-label="Search" aria-expanded="false" title="Search (Ctrl/⌘ K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button class="ib" id="mbtn" aria-label="Menu and your data"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg></button>
    </div>
  </header>
  <div id="searchbar" hidden>
    <input id="q" type="search" placeholder="Search everything, or @someone, #tag" aria-label="Search" autocomplete="off">
    <div id="pchips" class="pchips"></div>
  </div>
  <section id="hero" aria-live="polite"></section>
  
  <main id="view" role="tabpanel" tabindex="-1"></main>
  <footer id="foot"></footer>
</div>

<div class="dock" id="dock">
  <form class="composer" id="composer" autocomplete="off">
    <div class="sugg" id="sugg" hidden></div>
    <div class="hint" id="hint" hidden></div>
    <div class="types" id="types" role="group" aria-label="Kind of entry"></div>
    <div class="inrow">
      <span class="cg" id="cg"></span>
      <textarea id="ta" rows="1" placeholder="Write anything…" aria-label="Write anything" enterkeyhint="send" autocapitalize="sentences"></textarea>
      <button type="submit" class="send" id="send" aria-label="Add" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button>
    </div>
  </form>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="sheet" aria-label="Details"></dialog>

<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const KEY='arc-life-v4',OLD='arc-life-v3',$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const P=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((P(a)-P(b))/864e5);
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L='en-AU';
function dlabel(s,rel=true){const n=diffDays(s,today());if(rel){if(n===0)return'Today';if(n===1)return'Tomorrow';if(n===-1)return'Yesterday'}
  const d=P(s),o={day:'numeric',month:'short'};if(n>1&&n<7)o.weekday='long';else if(n<=1&&n>-7)o.weekday='short';if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString(L,o)}
const ftime=t=>{const [h,m]=t.split(':').map(Number);return`${h%12||12}${m?':'+pad(m):''} ${h>=12?'pm':'am'}`};
function ago(s){const n=diffDays(today(),s);if(n<=0)return'today';if(n===1)return'yesterday';if(n<14)return n+' days ago';if(n<60)return Math.round(n/7)+' weeks ago';if(n<700)return Math.round(n/30)+' months ago';return Math.round(n/365)+' years ago'}
const autosize=(el,max=140)=>{el.style.height='auto';el.style.height=Math.min(el.scrollHeight,max)+'px'};

/* ---------- glyphs ---------- */
const sv=(p)=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const G={task:'<circle cx="12" cy="12" r="4.2" fill="currentColor"/>',
 done:'<path d="M8.5 8.5l7 7m0-7l-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
 event:'<circle cx="12" cy="12" r="5.2" fill="none" stroke="currentColor" stroke-width="2"/>',
 note:'<path d="M8 12h8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
 moment:'<path d="M12 6.5l5.5 5.5-5.5 5.5L6.5 12z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>',
 direction:'<path d="M12 6.5l5.5 5.5-5.5 5.5L6.5 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
 heart:'<path d="M12 18.2s-6.2-3.7-6.2-8.2A3.3 3.3 0 0 1 12 8.6 3.3 3.3 0 0 1 18.2 10c0 4.5-6.2 8.2-6.2 8.2z" fill="currentColor"/>'};
const glyph=(type,done)=>sv(done&&type==='task'?G.done:done&&type==='direction'?G.moment:G[type]);
const TYPES={task:'Task',event:'Event',note:'Note',moment:'Moment',direction:'Direction'};
const TIPS={task:'a thing to do',event:'something happening',note:'a thought',moment:'a memory worth keeping',direction:'where you’re headed'};

/* ---------- state ---------- */
const isD=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s),isT=s=>typeof s==='string'&&/^\d{2}:\d{2}$/.test(s);
const blank=()=>({v:4,items:[],people:[],meta:{focus:null,lastBackup:'',reflectSkip:''}});
function normItem(x){if(!x||typeof x!=='object'||typeof x.text!=='string'||!TYPES[x.type])return null;const text=x.text.trim().slice(0,2000);if(!text)return null;
  return{id:String(x.id||uid()),type:x.type,text,body:typeof x.body==='string'?x.body.slice(0,10000):'',date:isD(x.date)?x.date:null,time:isT(x.time)?x.time:null,done:!!x.done,doneAt:isD(x.doneAt)?x.doneAt:null,created:isD(x.created)?x.created:today(),ts:Number.isFinite(x.ts)?x.ts:Date.now(),moved:Number.isInteger(x.moved)&&x.moved>0?x.moved:0,reflect:!!x.reflect,people:Array.isArray(x.people)?x.people.filter(s=>typeof s==='string'):[]}}
function normPerson(x){if(!x||typeof x!=='object'||typeof x.name!=='string'||!x.name.trim())return null;
  return{id:String(x.id||uid()),name:x.name.trim().slice(0,80),birthday:isD(x.birthday)?x.birthday:'',contact:typeof x.contact==='string'?x.contact.slice(0,120):'',note:typeof x.note==='string'?x.note.slice(0,200):'',cadence:[0,14,30,42,90,180].includes(x.cadence)?x.cadence:0,last:isD(x.last)?x.last:'',snooze:isD(x.snooze)?x.snooze:'',created:isD(x.created)?x.created:today()}}
function clean(d){const s=blank();if(d&&typeof d==='object'){s.items=(Array.isArray(d.items)?d.items:[]).map(normItem).filter(Boolean);s.people=(Array.isArray(d.people)?d.people:[]).map(normPerson).filter(Boolean);
  const m=d.meta;if(m&&typeof m==='object'){s.meta={focus:typeof m.focus==='string'?m.focus:null,lastBackup:isD(m.lastBackup)?m.lastBackup:'',reflectSkip:isD(m.reflectSkip)?m.reflectSkip:''}}}return s}
function migrate(o){const s=blank(),arr=k=>Array.isArray(o&&o[k])?o[k]:[];let n=0;const ts=x=>(Date.parse(x.date)||Date.now())+(n++);

  case'delperson':{const p=S.people.find(x=>x.id===id);if(!p)break;closeSheet();mutate(()=>{S.people=S.people.filter(x=>x.id!==id);S.items.forEach(x=>{x.people=x.people.filter(y=>y!==id)})},p.name+' removed');break}
  case'copyview':closeSheet();copyView();break;
  case'menu':openSheet(menuHTML());break;
  case'export':exportAll();break;
  case'ics':exportIcs();break;
  case'close':closeSheet();break}});
document.addEventListener('change',e=>{const el=e.target,a=el.dataset.a;
  if(a==='date'||a==='time'){const i=find(el.dataset.id);if(!i)return;if(a==='date')i.date=el.value||(i.type==='task'||i.type==='direction'?null:today());else i.time=el.value||null;save();render()}
  else if(el.dataset.pf==='cadence'||el.dataset.pf==='birthday'){const p=S.people.find(x=>x.id===sheetPerson);if(!p)return;p[el.dataset.pf]=el.dataset.pf==='cadence'?Number(el.value):el.value;save()}
  else if(el.id==='imp')importFile(el.files[0])});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.pf==='name'||el.dataset.pf==='contact'||el.dataset.pf==='note'){const p=S.people.find(x=>x.id===sheetPerson);if(!p)return;if(el.dataset.pf==='name'&&!el.value.trim())return;p[el.dataset.pf]=el.value.slice(0,120);save()}
  if(el.classList&&el.classList.contains('edit'))autosize(el,400)});
$('#view').addEventListener('keydown',e=>{if(!e.target.classList.contains('edit'))return;if(e.key==='Enter'&&!e.shiftKey&&!coarse){e.preventDefault();commitEdit(e.target.dataset.edit,e.target.value)}else if(e.key==='Escape'){editing=null;render()}});
$('#view').addEventListener('focusout',e=>{if(!e.target.classList.contains('edit'))return;const id=e.target.dataset.edit,v=e.target.value;setTimeout(()=>{if(editing===id&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.acts')))commitEdit(id,v)},0)});
$('#view').addEventListener('submit',e=>{const f=e.target.closest('form[data-form=reflect]');if(!f)return;e.preventDefault();const v=f.querySelector('input').value.trim();if(!v)return;const it=normItem({id:uid(),type:'moment',text:v,date:today(),created:today(),ts:Date.now(),reflect:true});newPeople=[];it.people=linkPeople(v,true);S.items.push(it);save();lastAdded=it.id;render();toast('Kept in your story.')});
addEventListener('storage',e=>{if(e.key===KEY&&!editing){S=load();render()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!editing&&!sheet.open)render()});

/* ---------- go ---------- */
upd();render(true);if(!coarse&&!S.items.length)ta.focus();
})();
</script>
