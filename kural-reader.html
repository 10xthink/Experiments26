ார்க்கு அமையுமே","l2":"வாழுநம் என்னும் செருக்கு.","mv":"காதலரால் விரும்பப்படுகின்றவர்க்கும் ( பிரிவுத் துன்பம் இருந்தாலும்) மீண்டும் வந்தபின் வாழ்வோம் என்று இருக்கும் செருக்குத் தகும்.","ex":"The pride that says \"we shall live\" suits only those who are loved by their beloved (husbands)","t1":"Veezhunar Veezhap Patuvaarkku Amaiyume","t2":"Vaazhunam Ennum Serukku"},{"n":1194,"c":120,"ct":"தனிப்படர்மிகுதி","ce":"Feeling All Alone","l1":"வீழப் படுவார் கெழீஇயிலர் தாம்வீழ்வார்","l2":"வீழப் படாஅர் எனின்.","mv":"தாம் விரும்பும் காதலரால் விரும்பப்படாவிட்டால் உலகத்தாரால் விரும்பப்படும் நிலையில் உள்ளவரும் நல்வினை பொருந்தியவர் அல்லர்.","ex":"Even those who are esteemed (by other women) are devoid of excellence, if they are not loved by their beloved","t1":"Veezhap Patuvaar Kezheeiyilar Thaamveezhvaar","t2":"Veezhap Pataaar Enin"},{"n":1195,"c":120,"ct":"தனிப்படர்மிகுதி","ce":"Feeling All Alone","l1":"நாம்காதல் கொண்டார் நமக்கெவன் செய்பவோ","l2":"தாம்காதல் கொள்ளாக் கடை.","mv":"நாம் காதல் கொண்ட காதலர் தாமும் அவ்வாறே நம்மிடம் காதல் கொள்ளாதபோது, நமக்கு அவர் என்ன நன்மை செய்வார்?","ex":"He who is beloved by me, what will he do to me, if I am not beloved by him ?","t1":"Naamkaadhal Kontaar Namakkevan Seypavo","t2":"Thaamkaadhal Kollaak Katai"},{"n":1196,"c":120,"ct":"தனிப்படர்மிகுதி","ce":"Feeling All Alone","l1":"ஒருதலையான் இன்னாது காமம்காப் போல","l2":"இருதலை யானும் இனிது.","mv":"காதல் ஒரு பக்கமாக இருத்தல் துன்பமானது; காவடியின் பாரம் போல் இருபக்கமாகவும் ஒத்திருப்பது இன்பமானதாகும்.","ex":"Lust, like the weight of the KAVADI, pains if it lies in one end only but pleases if it is in both","t1":"Orudhalaiyaan Innaadhu Kaamamkaap Pola","t2":"Irudhalai Yaanum Inidhu"},{"n":1197,"c":120,"ct":"தனிப்படர்மிகுதி","ce":"Feeling All Alone","l1":"பருவரலும் பைதலும் காணான்கொல் காமன்","l2":"ஒருவர்கண் நின்றொழுகு வான்.","mv":"( காதலர் இருவரிடத்திலும் ஒத்திருக்காமல்) ஒருவரிடத்தில் மட்டும் காமன் நின்று இயங்குவதால், என்னுடைய துன்பத்தையும் வருத்தத்தையும் அறியானோ?","ex":"Would not cupid who abides and contends in one party (only) witness the pain and sorrow (in that party)?","t1":"Paruvaralum Paidhalum Kaanaankol Kaaman","t2":"Oruvarkan Nindrozhuku Vaan"},{"n":1198,"c":120,"ct":"தனிப்படர்மிகுதி","ce":"Feeling All Alone","l1":"வீழ்வாரின் இன்சொல் பெறாஅது உலகத்து","l2":"வாழ்வாரின் வன்கணார் இல்.","mv":"தான் விரும்பும் காதலரின் இனிய சொல்லைப் பெறாமல் உலகத்தில் ( பிரிவுத் துன்பத்தைப் பொறுத்து) வாழ்கின்றவரைப் போல் வன்கண்மை உடையவர் இல்லை.","ex":"There is no one in the world so hard-hearted as those who can live without receiving (even) a kind word from their beloved","t1":"Veezhvaarin Insol Peraaadhu Ulakaththu","t2":"Vaazhvaarin Vankanaar Il"},{"n":1199,"c":120,"ct":"தனிப்படர்மிகுதி","ce":"Feeling All Alone","l1":"நசைஇயார் நல்கார் எனினும் அவர்மாட்டு","l2":"இசையும் இனிய செவிக்கு.","mv":"யான் விரும்பிய காதலர் மீண்டு வந்து அன்பு செய்யமாட்டார் என்றாலும், அவரைப் பற்றிய புகழைக் ‌கேட்பதும் என் செவிக்கு இன்பமாக இருக்கின்றது.","ex":"Though my beloved bestows no love on one, still are his words sweet to my ears","t1":"Nasaiiyaar Nalkaar Eninum Avarmaattu","t2":"Isaiyum Iniya Sevikku"},{"n":1200,"c":120,"ct":"தனிப்படர்மிகுதி","ce":"Feeling All Alone","l1":"உறாஅர்க்கு உறுநோய் உரைப்பாய் கடலைச்","l2":"செறாஅஅய் வாழிய நெஞ்சு.","mv":"நெஞ்சமே! நீ வாழி! அன்பு இல்லாதவரிடம் உன் மிகுந்த துன்பத்தைச் சொல்கின்றாய்! அதை விட எளிதாகக் கடலைத் தூர்ப்பாயாக.","ex":"Live, O my soul, would you who relate your great sorrow to strangers, try rather to fill up your own sea (of sorrow)","t1":"Uraaarkku Urunoi Uraippaai Katalaich","t2":"Cheraaaai Vaazhiya Nenju"},{"n":1201,"c":121,"ct":"நினைந்தவர்புலம்பல்","ce":"Recollecting the Pleasures of Love","l1":"உள்ளினும் தீராப் பெருமகிழ் செய்தலால்","l2":"கள்ளினும் காமம் இனிது.","mv":"நினைத்தாலும் தீராத பெரிய மகிழ்ச்சியைச் செய்தலால் ( உண்டபோது மட்டும் மகிழ்ச்சி தரும் ) கள்ளை விட காமம் இன்பமானதாகும்.","ex":"Sexuality is sweeter than liquor, because when remembered, it creates a most rapturous delight","t1":"Ullinum Theeraap Perumakizh Seydhalaal","t2":"Kallinum Kaamam Inidhu"},{"n":1202,"c":121,"ct":"நினைந்தவர்புலம்பல்","ce":"Recollecting the Pleasures of Love","l1":"எனைத்தொனறு ஏனிதேகாண் காமம்தாம் வீழ்வார்","l2":"நினைப்ப வருவதொன்று ஏல்.","mv":"தாம் விரும்புகின்ற காதலர் தம்மை நினைத்தலும் பிரிவால் வரக்கூடிய துன்பம் இல்லாமல் போகின்றது. அதனால் காமம் எவ்வளவாயினும் இன்பம் தருவதே ஆகும்.","ex":"Even to think of one's beloved gives one no pain Sexuality, in any degree, is always delightful","t1":"Enaiththonaru Inidhekaan Kaamamdhaam Veezhvaar","t2":"Ninaippa Varuvadhondru El"},{"n":1203,"c":121,"ct":"நினைந்தவர்புலம்பல்","ce":"Recollecting the Pleasures of Love","l1":"நினைப்பவர் போன்று நினையார்கொல் தும்மல்","l2":"சினைப்பது போன்று கெடும்.","mv":"தும்மல் வருவது போலிருந்து வாராமல் அடங்குகின்றதே! என் காதலர் என்னை நினைப்பவர் போலிருந்து நினையாமல் விடுகின்றாரோ?","ex":"I feel as if I am going to sneeze but do not, and (therefore) my beloved is about to think (of me) but does not","t1":"Ninaippavar Pondru Ninaiyaarkol Thummal","t2":"Sinaippadhu Pondru Ketum"},{"n":1204,"c":121,"ct":"நினைந்தவர்புலம்பல்","ce":"Recollecting the Pleasures of Love","l1":"யாமும் உளேங்கொல் அவர்நெஞ்சத்து எந்நெஞ்சத்து","l2":"ஓஒ உளரே அவர்.","mv":"எம்முடைய நெஞ்சில் காதலராகிய அவர் இருக்கின்றாரே! ( அது போலவே) யாமும் அவருடைய நெஞ்சத்தில் நீங்காமல் இருக்கின்றோ‌மோ?","ex":"He continues to abide in my soul, do I likewise abide in his ?","t1":"Yaamum Ulengol Avarnenjaththu Ennenjaththu","t2":"Oo Ulare Avar"},{"n":1205,"c":121,"ct":"நினைந்தவர்புலம்பல்","ce":"Recollecting the Pleasures of Love","l1":"தம்நெஞ்சத்து எம்மைக் கடிகொண்டார் நாணார்கொல்","l2":"எம்நெஞ்சத்து ஓவா வரல்.","mv":"தம்முடைய நெஞ்சில் எம்மை வரவிடாது காவல் கொண்ட காதலர், எம்முடைய நெஞ்சில் தாம் ஓயாமல் வரவதைப் பற்றி நாணமாட்டாரோ?","ex":"He who has imprisoned me in his soul, is he ashamed to enter incessantly into mine","t1":"Thamnenjaththu Emmaik Katikontaar Naanaarkol","t2":"Emnenjaththu Ovaa Varal"},{"n":1206,"c":121,"ct":"நினைந்தவர்புலம்பல்","ce":"Recollecting the Pleasures of Love","l1":"மற்றியான் என்னுளேன் மன்னோ அவரொடி யான்","l2":"உற்றநாள் உள்ள உளேன்.","mv":"காதலராகிய அவரோடு யான் பொருந்தியிருந்த நாட்களை நினைத்துக் கொள்வதால்தான் உயிரோடு இருக்கின்றேன்; வேறு எதனால் உயிர் வாழ்கின்றேன்?","ex":"I live by remembering my (former) intercourse with him; if it were not so, how could I live ?","t1":"Matriyaan Ennulen Manno Avaroti","t2":"Yaan Utranaal Ulla Ulen"},{"n":1207,"c":121,"ct":"நினைந்தவர்புலம்பல்","ce":"Recollecting the Pleasures of Love","l1":"மறப்பின் எவனாவன் மற்கொல் மறப்பறியேன்","l2":"உள்ளினும் உள்ளம் சுடும்.","mv":"( காதலரை ) மறந்தறியாமல் நினைத்தாலும் உள்ளத்தைப் பிரிவுத் துன்பம் சுடுகின்றதே! நினைக்காமல் மறந்து விட்டால் என்ன ஆவேனோ?","ex":"I have never forgotten (the pleasure); even to think of it burns my soul; could I live, if I should ever forget it ?","t1":"Marappin Evanaavan Markol Marappariyen","t2":"Ullinum Ullam Sutum"},{"n":1208,"c":121,"ct":"நினைந்தவர்புலம்பல்","ce":"Recollecting the Pleasures of Love","l1":"எனைத்து நினைப்பினும் காயார் அனைத்தன்றோ","l2":"காதலர் செய்யும் சிறப்பு.","mv":"காதலரை எவ்வளவு மிகுதியாக நினைத்தாலும் அவர் என்மேல் சினங்கொள்ளார்; காதலர் செய்யும் சிறந்த உதவி அத்தன்மையானது அன்றோ!","ex":"He will not be angry however much I may think of him; is it not so much the delight my beloved","t1":"Enaiththu Ninaippinum Kaayaar Anaiththandro","t2":"Kaadhalar Seyyum Sirappu"},{"n":1209,"c":121,"ct":"நினைந்தவர்புலம்பல்","ce":"Recollecting the Pleasures of Love","l1":"விளியுமென் இன்னுயிர் வேறல்லம் என்பார்","l2":"அளியின்மை ஆற்ற நினைந்து.","mv":"நாம் இருவரும் வேறு அல்லேம் என்று அடிக்கடி சொல்லும் அவர் இப்போது அன்பு இல்லாதிருத்தலை மிக நினைத்து என் இனிய உயிர் அழிகின்றது.","ex":"My precious life is wasting away by thinking too much on the cruelty of him who said we were not different","t1":"Viliyumen Innuyir Verallam Enpaar","t2":"Aliyinmai Aatra Ninaindhu"},{"n":1210,"c":121,"ct":"நினைந்தவர்புலம்பல்","ce":"Recollecting the Pleasures of Love","l1":"விடாஅது சென்றாரைக் கண்ணினால் காணப்","l2":"படாஅதி வாழி மதி.","mv":"தி்ங்களே! பிரியாமல் இருந்து இறுதியில் பிரிந்து சென்ற காதலரை என் கண்ணால் தேடிக் காணும்படியாக நீ மறைந்து விடாமல் இருப்பாயாக!","ex":"May you live, O Moon! Do not set, that I mine see him who has departed without quitting my soul","t1":"Vitaaadhu Sendraaraik Kanninaal Kaanap","t2":"Pataaadhi Vaazhi Madhi"},{"n":1211,"c":122,"ct":"கனவுநிலையுரைத்தல்","ce":"Dreams of Love","l1":"காதலர் தூதொடு வந்த கனவினுக்கு","l2":"யாதுசெய் வேன்கொல் விருந்து.","mv":"( யான் பிரிவால் வருந்தி உறங்கியபோது) காதலர் அனுப்பிய தூதோடு வந்த கனவுக்கு உரிய விருந்தாக என்ன செய்து உதவுவேன்?","ex":"Where with shall I feast the dream which has brought me my dear one's messenger ?","t1":"Kaadhalar Thoodhotu Vandha Kanavinukku","t2":"Yaadhusey Venkol Virundhu"},{"n":1212,"c":122,"ct":"கனவுநிலையுரைத்தல்","ce":"Dreams of Love","l1":"கயலுண்கண் யானிரப்பத் துஞ்சிற் கலந்தார்க்கு","l2":"உயலுண்மை சாற்றுவேன் மன்.","mv":"கண்கள் யான் வேண்டுவதுபோல் தூங்குமானால், ( அப்போது வரும் கனவில் காணும்) காதலர்க்கு யான் தப்பிப் பிழைத்திருக்கும்‌ தன்மையைச் சொல்வேன்.","ex":"If my fish-like painted eyes should, at my begging, close in sleep, I could fully relate my sufferings to my lord","t1":"Kayalunkan Yaanirappath Thunjir Kalandhaarkku","t2":"Uyalunmai Saatruven Man"},{"n":1213,"c":122,"ct":"கனவுநிலையுரைத்தல்","ce":"Dreams of Love","l1":"நனவினால் நல்கா தவரைக் கனவினால்","l2":"காண்டலின் உண்டென் உயிர்.","mv":"நனவில் வந்து அன்பு செய்யாத காதலரைக் கனவில் காண்பதால்தான் என்னுடைய உயிர் இன்னும் நீங்காமல் உள்ளதாகின்றது.","ex":"My life lasts because in my dream I behold him who does not favour me in my waking hours","t1":"Nanavinaal Nalkaa Thavaraik Kanavinaal","t2":"Kaantalin Unten Uyir"},{"n":1214,"c":122,"ct":"கனவுநிலையுரைத்தல்","ce":"Dreams of Love","l1":"கனவினான் உண்டாகும் காமம் நனவினான்","l2":"நல்காரை நாடித் தரற்கு.","mv":"நனவில் வந்து அன்பு செய்யாத காதலரைத் தேடி அழைத்துக் கொண்டு வருவதற்காகக் கனவில் அவரைப் பற்றிய காதல் நிகழ்ச்சிகள் உண்டாகின்றன.","ex":"There is pleasure in my dream, because in it I seek and obtain him who does not visit me in my wakefulness","t1":"Kanavinaan Untaakum Kaamam Nanavinaan","t2":"Nalkaarai Naatith Thararku"},{"n":1215,"c":122,"ct":"கனவுநிலையுரைத்தல்","ce":"Dreams of Love","l1":"நனவினால் கண்டதூஉம் ஆங்கே கனவுந்தான்","l2":"கண்ட பொழுதே இனிது.","mv":"முன்பு நனவில் கண்ட இன்பமும் அப்பொழுது மட்டும் இனிதாயிற்று; இப்‌பொழுது காணும் கனவும் கண்ட பொழுது மட்டுமே இன்பமாக உள்ளது.","ex":"I saw him in my waking hours, and then it was pleasant; I see him just now in my dream, and it is (equally) pleasant","t1":"Nanavinaal Kantadhooum Aange Kanavundhaan","t2":"Kanta Pozhudhe Inidhu"},{"n":1216,"c":122,"ct":"கனவுநிலையுரைத்தல்","ce":"Dreams of Love","l1":"நனவென ஒன்றில்லை ஆயின் கனவினால்","l2":"காதலர் நீங்கலர் மன்.","mv":"நனவு என்று சொல்லப்படுகின்ற ஒன்று இல்லாதிருக்குமானால், கனவில் வந்த காதலர் என்னை விட்டுப் பிரியாமலே இருப்பர்.","ex":"Were there no such thing as wakefulness, my beloved (who visited me) in my dream would not depart from me","t1":"Nanavena Ondrillai Aayin Kanavinaal","t2":"Kaadhalar Neengalar Man"},{"n":1217,"c":122,"ct":"கனவுநிலையுரைத்தல்","ce":"Dreams of Love","l1":"நனவினால் நல்காக் கொடியார் கனவனால்","l2":"என்எம்மைப் பீழிப் பது.","mv":"நனவில் வந்து எமக்கு அன்பு செய்யாத கொடுமை உடைய அவர், கனவில் வந்து எம்மை வருத்துவது என்ன காரணத்தால்?","ex":"The cruel one who would not favour me in my wakefulness, what right has he to torture me in my dreams?","t1":"Nanavinaal Nalkaak Kotiyaar Kanavanaal","t2":"Enemmaip Peezhip Padhu"},{"n":1218,"c":122,"ct":"கனவுநிலையுரைத்தல்","ce":"Dreams of Love","l1":"துஞ்சுங்கால் தோள்மேலர் ஆகி விழிக்குங்கால்","l2":"நெஞ்சத்தர் ஆவர் விரைந்து.","mv":"தூங்கும்போது கனவில் வந்து என் தோள்மேல் உள்ளவராகி, விழி்த்தெழும்போது விரைந்து என் நெஞ்சில் உள்ளவராகிறார்‌.","ex":"When I am asleep he rests on my shoulders, (but) when I awake he hastens into my soul","t1":"Thunjungaal Tholmelar Aaki Vizhikkungaal","t2":"Nenjaththar Aavar Viraindhu"},{"n":1219,"c":122,"ct":"கனவுநிலையுரைத்தல்","ce":"Dreams of Love","l1":"நனவினால் நல்காரை நோவர் கனவினால்","l2":"காதலர்க் காணா தவர்.","mv":"கனவில் காதலர் வரக் காணாத மகளிர், நனவில் வந்து அன்பு செய்யாத கா‌தலரை ( அவர் வராத காரணம் பற்றி ) நொந்து கொள்வர்.","ex":"They who have no dear ones to behold in their dreams blame him who visits me not in my waking hours","t1":"Nanavinaal Nalkaarai Novar Kanavinaal","t2":"Kaadhalark Kaanaa Thavar"},{"n":1220,"c":122,"ct":"கனவுநிலையுரைத்தல்","ce":"Dreams of Love","l1":"நனவினால் நம்நீத்தார் என்பர் கனவினால்","l2":"காணார்கொல் இவ்வூ ரவர்.","mv":"நனவில் நம்‌மை விட்டு நீங்கினார் என்று காதலரைப் பழித்து பேசுகின்றனரே! இந்த ஊரார் கனவில் அவரைக் காண்பதில்லையோ?","ex":"The women of this place say he has forsaken me in my wakefulness I think they have not seen him visit me in my dreams","t1":"Nanavinaal Namneeththaar Enpar Kanavinaal","t2":"Kaanaarkol Ivvoo Ravar"},{"n":1221,"c":123,"ct":"பொழுதுகண்டிரங்கல்","ce":"Sunset and Sorrow","l1":"மாலையோ அல்லை மணந்தார் உயிருண்ணும்","l2":"வேலைநீ வாழி பொழுது.","mv":"பொழுதே! நீ மாலைக்காலம் அல்ல; (காதலரோடு கூடியிருந்து பிறகு பிரிந்து வாழும்) மகளிரின் உயிரை உண்ணும் முடிவுக் காலமாக இருக்கினறாய்!","ex":"Live, O you evening are you (the former) evening? No, you are the season that slays (married) women","t1":"Maalaiyo Allai Manandhaar Uyirunnum","t2":"Velainee Vaazhi Pozhudhu"},{"n":1222,"c":123,"ct":"பொழுதுகண்டிரங்கல்","ce":"Sunset and Sorrow","l1":"புன்கண்ணை வாழி மருள்மாலை எம்கேள்போல்","l2":"வன்கண்ண தோநின் துணை.","mv":"மயங்கிய மாலைப்‌பொழுதே! நீயும் எம்மைப்போல் துன்பப்படுகின்‌றாயே! உன் துணையும் எம் காதலர் போல் இரக்கம் அற்றதோ?","ex":"A long life to you, O dark evening! You are sightless Is your help-mate (also) as hard-hearted as mine","t1":"Punkannai Vaazhi Marulmaalai Emkelpol","t2":"Vankanna Thonin Thunai"},{"n":1223,"c":123,"ct":"பொழுதுகண்டிரங்கல்","ce":"Sunset and Sorrow","l1":"பனிஅரும்பிப் பைதல்கொள் மாலை துனிஅரும்பித்","l2":"துன்பம் வளர வரும்.","mv":"பனி தோன்றிப் பசந்த நிறம் கொண்ட மாலைப் பொழுது எனக்கு வருத்தம் ஏற்பட்டுத் துன்பம் மேன்மேலும் வளரும்படியாக வருகின்றது.","ex":"The evening that (once) came in with trembling and dimness (now) brings me an aversion for life and increasing sorrow","t1":"Paniarumpip Paidhalkol Maalai Thuniarumpith","t2":"Thunpam Valara Varum"},{"n":1224,"c":123,"ct":"பொழுதுகண்டிரங்கல்","ce":"Sunset and Sorrow","l1":"காதலர் இல்வழி மாலை கொலைக்களத்து","l2":"ஏதிலர் போல வரும்.","mv":"காதலர் இல்லாத இப்போது, கொலை செய்யும் இடத்தில் பகைவர் வருவது போல் மாலைப்பொழுது ( என் உயிரைக் கொள்ள) வருகின்றது.","ex":"In the absence of my lover, evening comes in like slayers on the field of slaughter","t1":"Kaadhalar Ilvazhi Maalai Kolaikkalaththu","t2":"Edhilar Pola Varum"},{"n":1225,"c":123,"ct":"பொழுதுகண்டிரங்கல்","ce":"Sunset and Sorrow","l1":"காலைக்குச் செய்தநன்று என்கொல் எவன்கொல்யான்","l2":"மாலைக்குச் செய்த பகை?","mv":"யான் காலைப்பொழுதிற்குச் செய்த நன்மை என்ன? (என்னைத் துன்புறுத்துகின்ற) மாலைப் பொழுதிற்குச் செய்த பகையான தீமை என்ன?","ex":"O eve, why art thou foe! thou dost renew my grief","t1":"Kaalaikkuch Cheydhanandru Enkol Evankolyaan","t2":"Maalaikkuch Cheydha Pakai?"},{"n":1226,"c":123,"ct":"பொழுதுகண்டிரங்கல்","ce":"Sunset and Sorrow","l1":"மாலைநோய் செய்தல் மணந்தார் அகலாத","l2":"காலை அறிந்த திலேன்.","mv":"மாலைப் பொழுது இவ்வாறு துன்பம் செய்ய வல்லது என்பதைக் காதலர் என்னை விட்டு அகலாமல் உடனிருந்த காலத்தில் யான் அறியவில்லை.","ex":"Previous to my husband's departure, I know not the painful nature of evening","t1":"Maalainoi Seydhal Manandhaar Akalaadha","t2":"Kaalai Arindha Thilen"},{"n":1227,"c":123,"ct":"பொழுதுகண்டிரங்கல்","ce":"Sunset and Sorrow","l1":"காலை அரும்பிப் பகலெல்லாம் போதாகி","l2":"மாலை மலரும்இந் நோய்.","mv":"இந்த காமநோய், காலைப்பொழுதில் அரும்பாய்த் தோன்றி, பகற்பொழுதெல்லாம் பேரரும்பாய் வளர்ந்து மாலைப்பொழுதில் மலராகின்றது.","ex":"This malady buds forth in the morning, expands all day long and blossoms in the evening","t1":"Kaalai Arumpip Pakalellaam Podhaaki","t2":"Maalai Malarumin Noi"},{"n":1228,"c":123,"ct":"பொழுதுகண்டிரங்கல்","ce":"Sunset and Sorrow","l1":"அழல்போலும் மாலைக்குத் தூதாகி ஆயன்","l2":"குழல்போலும் கொல்லும் படை.","mv":"ஆயனுடைய புல்லாங்குழல், நெருப்புப்போல் வருத்தும்‌ மாலைப்பொழுதிற்குத் தூதாகி என்னைக் கொல்லும்‌‌ படையாகவும் வருகின்றது.","ex":"The shepherd's flute now sounds as a fiery forerunner of night, and is become a weapon that slays (me)","t1":"Azhalpolum Maalaikkuth Thoodhaaki Aayan","t2":"Kuzhalpolum Kollum Patai"},{"n":1229,"c":123,"ct":"பொழுதுகண்டிரங்கல்","ce":"Sunset and Sorrow","l1":"பதிமருண்டு பைதல் உழக்கும் மதிமருண்டு","l2":"மாலை படர்தரும் போழ்து.","mv":"அறிவு மயங்கும்படியாக மாலைப்பொழுது வந்து படரும்போது, இந்த ஊரும் மயங்கி என்னைப் போல் துன்பத்தால் வருந்தும்.","ex":"When night comes on confusing (everyone's) mind, the (whole) town will lose its sense and be plunged in sorrow","t1":"Padhimaruntu Paidhal Uzhakkum Madhimaruntu","t2":"Maalai Patardharum Pozhdhu"},{"n":1230,"c":123,"ct":"பொழுதுகண்டிரங்கல்","ce":"Sunset and Sorrow","l1":"பொருள்மாலை யாளரை உள்ளி மருள்மாலை","l2":"மாயும்என் மாயா உயிர்.","mv":"( பிரிவுத் துன்பத்தால்) மாயமாய் நின்ற என் உயிர், பொருள் காரணமாகப் பிரிந்து சென்ற காதலரை நினைந்து மயங்குகின்ற இம் மாலைப்பொழுதில் மாய்கின்றது.","ex":"My (hitherto) unextinguished life is now lost in this bewildering night at the thought of him who has the nature of wealth","t1":"Porulmaalai Yaalarai Ulli Marulmaalai","t2":"Maayumen Maayaa Uyir"},{"n":1231,"c":124,"ct":"உறுப்புநலனழிதல்","ce":"Wasting Away","l1":"சிறுமை நமக்கொழியச் சேட்சென்றார் உள்ளி","l2":"நறுமலர் நாணின கண்.","mv":"இத்துன்பத்தை நமக்கு விட்டு விட்டுத் தொலைவில் உள்ள நாட்டுக்குச் சென்ற காதலரை நினைந்து அழுதமையால் கண்கள் அழகு இழந்து நறுமலர்களுக்கு நாணி விட்டன.","ex":"While we endure the unbearable sorrow, your eyes weep for him who is gone afar, and shun (the sight of) fragrant flowers","t1":"Sirumai Namakkozhiyach Chetchendraar Ulli","t2":"Narumalar Naanina Kan"},{"n":1232,"c":124,"ct":"உறுப்புநலனழிதல்","ce":"Wasting Away","l1":"நயந்தவர் நல்காமை சொல்லுவ போலும்","l2":"பசந்து பனிவாரும் கண்.","mv":"பசலை நிறம் அடைந்து நீர் சொரியும் கண்கள், நாம் விரும்பிய காதலர் நமக்கு அன்பு செய்யாத தன்மையைப் ( பிறர்க்குச்) சொல்வன போல் உள்ளன.","ex":"The discoloured eyes that shed tears profusely seem to betray the unkindness of our beloved","t1":"Nayandhavar Nalkaamai Solluva Polum","t2":"Pasandhu Panivaarum Kan"},{"n":1233,"c":124,"ct":"உறுப்புநலனழிதல்","ce":"Wasting Away","l1":"தணந்தமை சால அறிவிப்ப போலும்","l2":"மணந்தநாள் வீங்கிய தோள்.","mv":"கூடியிருந்த காலத்தில் மகிழ்ந்து பூரித்திருந்த தோள்கள், ( இப்போது மெலிந்தும்) காதலருடைய பிரிவை நன்றாக அறிவிப்பவை போல் உள்ளன.","ex":"The shoulders that swelled on the day of our union (now) seem to announce our separation clearly (to the public)","t1":"Thanandhamai Saala Arivippa Polum","t2":"Manandhanaal Veengiya Thol"},{"n":1234,"c":124,"ct":"உறுப்புநலனழிதல்","ce":"Wasting Away","l1":"பணைநீங்கிப் பைந்தொடி சோரும் துணைநீங்கித்","l2":"தொல்கவின் வாடிய தோள்.","mv":"துணைவர் விட்டு நீங்கியதால் பழைய அழகு கெட்டு வாடிய தோள்கள், பருத்த தன்மை கெட்டு மெலிந்து வளையல்களும் கழலச் செய்கின்றன.","ex":"In the absence of your consort, your shoulders having lost their former beauty and fulness, your bracelets of pure gold have become loose","t1":"Panaineengip Paindhoti Sorum Thunaineengith","t2":"Tholkavin Vaatiya Thol"},{"n":1235,"c":124,"ct":"உறுப்புநலனழிதல்","ce":"Wasting Away","l1":"கொடியார் கொடுமை உரைக்கும் தொடியொடு","l2":"தொல்கவின் வாடிய தோள்.","mv":"வளையல்களும் கழன்று பழைய அழகும் கெட்டு, வாடிய தோள்கள் (என் துன்பம் உணராத) கொடியவரி்ன கொடுமையைப் பிறர் அறியச் சொல்கின்றன.","ex":"The (loosened) bracelets, and the shoulders from which the old beauty has faded, relate the cruelty of the pitiless one","t1":"Kotiyaar Kotumai Uraikkum Thotiyotu","t2":"Tholkavin Vaatiya Thol"},{"n":1236,"c":124,"ct":"உறுப்புநலனழிதல்","ce":"Wasting Away","l1":"தொடியொடு தோள்நெகிழ நோவல் அவரைக்","l2":"கொடியர் எனக்கூறல் நொந்து.","mv":"வளையல்கள் கழன்று தோள்களும் மெலிவடைவதால் (அவற்றைக் காண்போர்) காதலரைக் கொடியவர் என்று கூறுவதைக் கேட்டு வருந்துகின்றேன்.","ex":"I am greatly pained to hear you call him a cruel man, just because your shoulders are reduced and your bracelets loosened","t1":"Thotiyotu Tholnekizha Noval Avaraik","t2":"Kotiyar Enakkooral Nondhu"},{"n":1237,"c":124,"ct":"உறுப்புநலனழிதல்","ce":"Wasting Away","l1":"பாடுபெறுதியோ நெஞ்சே கொடியார்க்கென்","l2":"வாடுதோட் பூசல் உரைத்து.","mv":"நெஞ்சே! கொடியவர் என்று சொல்லப்படுகின்ற காதலர்க்கு என் மெலிந்த தோள்களின் ஆரவாரத்தை உரைத்து, அந்த உதவியால் பெருமை அடைவாயோ?","ex":"Can you O my soul! gain glory by relating to the (so-called) cruel one the clamour of my fading shoulders?","t1":"Paatu Perudhiyo Nenje Kotiyaarkken","t2":"Vaatudhot Poosal Uraiththu"},{"n":1238,"c":124,"ct":"உறுப்புநலனழிதல்","ce":"Wasting Away","l1":"முயங்கிய கைகளை ஊக்கப் பசந்தது","l2":"பைந்தொடிப் பேதை நுதல்.","mv":"தழுவிய கை‌களைத் தளர்த்தியவுடனே, பைந்தொடி அணிந்த காதலியின் நெற்றி, ( அவ்வளவு சிறியதாகிய பிரிவையும் பொறுக்காமல்) பசலை நிறம் அடைந்தது.","ex":"When I once loosened the arms that were in embrace, the forehead of the gold-braceleted women turned sallow","t1":"Muyangiya Kaikalai Ookkap Pasandhadhu","t2":"Paindhotip Pedhai Nudhal"},{"n":1239,"c":124,"ct":"உறுப்புநலனழிதல்","ce":"Wasting Away","l1":"முயக்கிடைத் தண்வளி போழப் பசப்புற்ற","l2":"பேதை பெருமழைக் கண்.","mv":"தழுவுதலுக்கு இடையே குளி்ந்த காற்று நுழைய, காதலியின் பெரிய மழை போன்ற கண்கள் பசலை நிறம் அடைந்தன.","ex":"When but a breath of breeze penetrated our embrace, her large cool eyes became sallow","t1":"Muyakkitaith Thanvali Pozhap Pasapputra","t2":"Pedhai Perumazhaik Kan"},{"n":1240,"c":124,"ct":"உறுப்புநலனழிதல்","ce":"Wasting Away","l1":"கண்ணின் பசப்போ பருவரல் எய்தின்றே","l2":"ஒண்ணுதல் செய்தது கண்டு.","mv":"காதலியின் ஒளி பொருந்திய நெற்றி, பசலை நிறம் உற்றதைக் கண்டு, அவளுடைய க்ண்களில் பசலையும் துன்பம் அடைந்து விட்டது.","ex":"Was it at the sight of what the bright forehead had done that the sallowness of her eyes became sad?","t1":"Kannin Pasappo Paruvaral Eydhindre","t2":"Onnudhal Seydhadhu Kantu"},{"n":1241,"c":125,"ct":"நெஞ்சொடுகிளத்தல்","ce":"Soliloquy of the Lady Love","l1":"நினைத்தொன்று சொல்லாயோ நெஞ்சே எனைத்தொன்றும்","l2":"எவ்வநோய் தீர்க்கும் மருந்து.","mv":"நெஞ்சே! ( காதலால் வளர்ந்த) இத் துன்ப நோயைத் தீர்க்கும் மருந்து ஏதாவது ஒன்றை நீ நினைத்துப் பார்த்து எனக்குச் சொல்ல மாட்டாயோ?","ex":"O my soul, will you not think and tell me some medicine be it what it may, that can cure this incurable malady?","t1":"Ninaiththondru Sollaayo Nenje Enaiththondrum","t2":"Evvanoi Theerkkum Marundhu"},{"n":1242,"c":125,"ct":"நெஞ்சொடுகிளத்தல்","ce":"Soliloquy of the Lady Love","l1":"காதல் அவரிலர் ஆகநீ நோவது","l2":"பேதைமை வாழியென் நெஞ்சு.","mv":"என் நெஞ்சே! வாழ்க! அவர் நம்மிடம் காதல் இல்லாதவராக இருக்க, நீ மட்டும் அவரை நினைந்து வருந்துவது உன் அறியாமையே!","ex":"Is folly, fare thee well my heart!","t1":"Kaadhal Avarilar Aakanee Novadhu","t2":"Pedhaimai Vaazhiyen Nenju"},{"n":1243,"c":125,"ct":"நெஞ்சொடுகிளத்தல்","ce":"Soliloquy of the Lady Love","l1":"இருந்துள்ளி என்பரிதல் நெஞ்சே பரிந்துள்ளல்","l2":"பைதல்நோய் செய்தார்கண் இல்.","mv":"நெஞ்சே (என்னுடன்) இருந்து அவரை நினைந்து வருந்துவது ஏன்? இந்தத் துன்பநோயை உண்டாக்கியவரிடம் இவ்வாறு அன்பு கொண்டு நினைக்கும் தன்மை இல்லையே!","ex":"O my soul! why remain (here) and suffer thinking (of him)? There are no lewd thoughts (of you) in him who has caused you this disease of sorrow","t1":"Irundhulli Enparidhal Nenje Parindhullal","t2":"Paidhalnoi Seydhaarkan Il"},{"n":1244,"c":125,"ct":"நெஞ்சொடுகிளத்தல்","ce":"Soliloquy of the Lady Love","l1":"கண்ணும் கொளச்சேறி நெஞ்சே இவையென்னைத்","l2":"தின்னும் அவர்க்காணல் உற்று.","mv":"நெஞ்சே! நீ அவரிடம் செல்லும்போது என் கண்களையும் உடன் கொண்டு செல்வாயாக; அவரைக் காணவேண்டும் என்று இவை என்னைப் பிடுங்கித் தின்கின்றன.","ex":"O my soul! take my eyes also with you, (if not), these would eat me up (in their desire) to see him","t1":"Kannum Kolachcheri Nenje Ivaiyennaith","t2":"Thinnum Avarkkaanal Utru"},{"n":1245,"c":125,"ct":"நெஞ்சொடுகிளத்தல்","ce":"Soliloquy of the Lady Love","l1":"செற்றார் எனக்கை விடல்உண்டோ நெஞ்சேயாம்","l2":"உற்றால் உறாஅ தவர்.","mv":"நெஞ்சே! யாம் விரும்பி நாடினாலும் எம்மை நாடாத அவர் நம்மை வெறுத்து விட்டார் என்று எண்ணிக் கைவிட முடியும‌ோ?","ex":"O my soul! can he who loves not though he is beloved, be forsaken saying he hates me (now)?","t1":"Setraar Enakkai Vitalunto Nenjeyaam","t2":"Utraal Uraaa Thavar"},{"n":1246,"c":125,"ct":"நெஞ்சொடுகிளத்தல்","ce":"Soliloquy of the Lady Love","l1":"கலந்துணர்த்தும் காதலர்க் கண்டாற் புலந்துணராய்","l2":"பொய்க்காய்வு காய்திஎன் நெஞ்சு.","mv":"என் நெஞ்சே! ஊடியபோது கூடி ஊடல் உணர்த்த வல்ல காதலரைக் கண்டபோது நீ பிணங்கி உணர மாட்டாய்; பொய்யான சினங்கொண்டு காய்கினறாய்.","ex":"O my soul! when you see the dear one who remove dislike by intercourse, you are displeased and continue to be so Nay, your displeasure is (simply) false","t1":"Kalandhunarththum Kaadhalark Kantaar Pulandhunaraai","t2":"Poikkaaivu Kaaidhien Nenju"},{"n":1247,"c":125,"ct":"நெஞ்சொடுகிளத்தல்","ce":"Soliloquy of the Lady Love","l1":"காமம் விடுஒன்றோ நாண்விடு நன்னெஞ்சே","l2":"யானோ பொறேன்இவ் விரண்டு.","mv":"நல்ல நெஞ்சே! ஒன்று காமத்தை விட்டு விடு; அல்லது நாணத்தை விட்டு விடு; இந்த இரண்டையும் பொறுத்துக் கொண்டிருக்க என்னால் முடியாது.","ex":"O my good soul, give up either lust or honour, as for me I can endure neither","t1":"Kaamam Vituondro Naanvitu Nannenje","t2":"Yaano Poreniv Virantu"},{"n":1248,"c":125,"ct":"நெஞ்சொடுகிளத்தல்","ce":"Soliloquy of the Lady Love","l1":"பரிந்தவர் நல்காரென்று ஏங்கிப் பிரிந்தவர்","l2":"பின்செல்வாய் பேதைஎன் நெஞ்சு.","mv":"என் நெஞ்சே! பிரிவுத் துன்பத்தால் வருந்தி அவர் வந்து அன்பு செய்ய வில்லையே என்று ஏங்கி பிரிந்தவரின் பின் செல்கின்றாய் பேதை.","ex":"You are a fool, O my soul! to go after my departed one, while you mourn that he is not kind enough to favour you","t1":"Parindhavar Nalkaarendru Engip Pirindhavar","t2":"Pinselvaai Pedhaien Nenju"},{"n":1249,"c":125,"ct":"நெஞ்சொடுகிளத்தல்","ce":"Soliloquy of the Lady Love","l1":"உள்ளத்தார் காத லவரால் உள்ளிநீ","l2":"யாருழைச் சேறியென் நெஞ்சு.","mv":"என் நெஞ்சே! காதலர் உன் உள்ளத்தில் உள்ளவராக இருக்கும்போது நீ அவரை நினைத்து யாரிடம் தேடிச் செல்கின்றாய்?","ex":"O my soul! to whom would you repair, while the dear one is within yourself?","t1":"Ullaththaar Kaadha Lavaraal Ullinee","t2":"Yaaruzhaich Cheriyen Nenju"},{"n":1250,"c":125,"ct":"நெஞ்சொடுகிளத்தல்","ce":"Soliloquy of the Lady Love","l1":"துன்னாத் துறந்தாரை நெஞ்சத்து உடையேமா","l2":"இன்னும் இழத்தும் கவின்.","mv":"நம்மோடு பொருந்தி இருக்காமல் கைவிட்டுச சென்ற காதலரை நெஞ்சில் வைத்திருக்கும்போது இன்னும் மெலிந்து அழகை இழந்து வருகின்றோம்.","ex":"If I retain in my heart him who has left me without befriending me, I shall lose even the (inward) beauty that remains","t1":"Thunnaath Thurandhaarai Nenjaththu Utaiyemaa","t2":"Innum Izhaththum Kavin"},{"n":1251,"c":126,"ct":"நிறையழிதல்","ce":"On the Loss of Modesty","l1":"காமக் கணிச்சி உடைக்கும் நிறையென்னும்","l2":"நாணுத்தாழ் வீழ்த்த கதவு.","mv":"நாணம் என்னும் தாழ்ப்பாள் பொருந்திய நிறை என்று சொல்லப்படும் கதவை காமம் ஆகிய கோடாலி உடைத்து விடுகிறதே.","ex":"The axe of lust can break the door of chastity which is bolted with the bolt of modesty","t1":"Kaamak Kanichchi Utaikkum Niraiyennum","t2":"Naanuththaazh Veezhththa Kadhavu"},{"n":1252,"c":126,"ct":"நிறையழிதல்","ce":"On the Loss of Modesty","l1":"காமம் எனவொன்றோ கண்ணின்றென் நெஞ்சத்தை","l2":"யாமத்தும் ஆளும் தொழில்.","mv":"காமம் என்று சொல்லப்படுகின்ற ஒன்று கண்ணோட்டம் இல்லாதது. அது என் நெஞ்சத்தை நள்ளிரவில் ஏவல் கொண்டு ஆள்கிறது.","ex":"Even at midnight is my mind worried by lust, and this one thing, alas! is without mercy","t1":"Kaamam Enavondro Kannindren Nenjaththai","t2":"Yaamaththum Aalum Thozhil"},{"n":1253,"c":126,"ct":"நிறையழிதல்","ce":"On the Loss of Modesty","l1":"மறைப்பேன்மன் காமத்தை யானோ குறிப்பின்றித்","l2":"தும்மல்போல் தோன்றி விடும்.","mv":"யான் காமத்தை என்னுள்‌ளே மறைக்க முயல்வேன்; ஆனால் அதுவே என் குறிப்பின்படி நிற்காமல் தும்மல் போல் தானே வெளிப்பட்டு விடுகிறது.","ex":"I would conceal my lust, but alas, it yields not to my will but breaks out like a sneeze","t1":"Maraippenman Kaamaththai Yaano Kurippindrith","t2":"Thummalpol Thondri Vitum"},{"n":1254,"c":126,"ct":"நிறையழிதல்","ce":"On the Loss of Modesty","l1":"நிறையுடையேன் என்பேன்மன் யானோஎன் காமம்","l2":"மறையிறந்து மன்று படும்.","mv":"யான் இதுவரையில் நிறையோடிருப்பதாக எண்ணிக கொண்டிருந்தேன். ஆனால் என் காமம் என்னுள் மறைந்திருத்தலைக் கடந்து மன்றத்தில் வெளிப்படுகின்றது.","ex":"I say I would be firm, but alas, my malady breaks out from its concealment and appears in public","t1":"Niraiyutaiyen Enpenman Yaanoen Kaamam","t2":"Maraiyirandhu Mandru Patum"},{"n":1255,"c":126,"ct":"நிறையழிதல்","ce":"On the Loss of Modesty","l1":"செற்றார்பின் செல்லாப் பெருந்தகைமை காமநோய்","l2":"உற்றார் அறிவதொன்று அன்று.","mv":"தம்மை வெறுத்து நீங்கியவரின் பின் செல்லாமல் மானத்தோடு நிற்கும் பெருந்தகைமை, காமநோய் உற்றவர் அறியும் தன்மையது அனறு.","ex":"The dignity that would not go after an absent lover is not known to those who are sticken by love","t1":"Setraarpin Sellaap Perundhakaimai Kaamanoi","t2":"Utraar Arivadhondru Andru"},{"n":1256,"c":126,"ct":"நிறையழிதல்","ce":"On the Loss of Modesty","l1":"செற்றவர் பின்சேறல் வேண்டி அளித்தரோ","l2":"எற்றென்னை உற்ற துயர்.","mv":"வெறுத்து நீங்கிய காதலரின் பின் செல்ல விரும்பிய நிலையில் இருப்பதால் என்னை அடைந்த இந்த காமநோய் எத்தன்மையானது? அந்‌தோ!","ex":"The sorrow I have endured by desiring to go after my absent lover, in what way is it excellent?","t1":"Setravar Pinseral Venti Aliththaro","t2":"Etrennai Utra Thuyar"},{"n":1257,"c":126,"ct":"நிறையழிதல்","ce":"On the Loss of Modesty","l1":"நாணென ஒன்றோ அறியலம் காமத்தால்","l2":"பேணியார் பெட்ப செயின்.","mv":"நாம் விரும்பிய காதலர் காமத்தால் நமக்கு விருப்பமானவற்றைச் செய்வாரானால். நாணம் என்று சொல்லப்படும் ஒரு பண்பையும் அறியாமல் இருப்போம்.","ex":"I know nothing like shame when my beloved does from love (just) what is desired (by me)","t1":"Naanena Ondro Ariyalam Kaamaththaal","t2":"Peniyaar Petpa Seyin"},{"n":1258,"c":126,"ct":"நிறையழிதல்","ce":"On the Loss of Modesty","l1":"பன்மாயக் கள்வன் பணிமொழி அன்றோநம்","l2":"பெண்மை உடைக்கும் படை.","mv":"நம்முடைய பெண்மையாகிய அரணை அழிக்கும் படையாக இருப்பது, பல மாயங்களில் வல்ல, கள்வனான காதலரடைய பணிவுடைய மொழி அன்றோ?","ex":"Are not the enticing words of my trick-abounding roguish lover the weapon that breaks away my feminine firmness?","t1":"Panmaayak Kalvan Panimozhi Andronam","t2":"Penmai Utaikkum Patai"},{"n":1259,"c":126,"ct":"நிறையழிதல்","ce":"On the Loss of Modesty","l1":"புலப்பல் எனச்சென்றேன் புல்லினேன் நெஞ் சம்","l2":"கலத்தல் உறுவது கண்டு.","mv":"ஊடுவேன் என்று எண்ணிக் கொண்டு சென்றேன்; ஆனால் என் நெஞ்சம் என்னை விட்டு அவரோடு கூடுவதை கண்டு தழுவினேன்.","ex":"I said I would feign dislike and so went (away); (but) I embraced him the moment I say my mind began to unite with him!","t1":"Pulappal Enachchendren Pullinen Nenjam","t2":"Kalaththal Uruvadhu Kantu"},{"n":1260,"c":126,"ct":"நிறையழிதல்","ce":"On the Loss of Modesty","l1":"நிணந்தீயில் இட்டன்ன நெஞ்சினார்க்கு உண்டோ","l2":"புணர்ந்தூடி நிற்பேம் எனல்.","mv":"கொழுப்பைத் தீயில் இட்டால் போன்ற உருகும் நெஞ்சுடைய என்னைப் போன்றவர்க்கு, இசைந்து ஊடி நிற்போம் என்று ஊடும் தன்மை உண்டோ?","ex":"Is it possible for those whose hearts melt like fat in the fire to say they can feign a strong dislike and remain so?","t1":"Ninandheeyil Ittanna Nenjinaarkku Unto","t2":"Punarndhooti Nirpem Enal"},{"n":1261,"c":127,"ct":"அவர்வயின்விதும்பல்","ce":"On the Distress of each Towards the Other","l1":"வாளற்றுப் புற்கென்ற கண்ணும் அவர்சென்ற","l2":"நாளொற்றித் தேய்ந்த விரல்.","mv":"என் கண்களும் அவர் வரும் வழியைப் பார்த்துப் பார்த்து ஒளி இழந்து அழகு கெட்டன; விரல்களும் அவர் சென்ற நாட்களைக் குறித்துத் தொட்டுத் தொட்டுத் தேய்ந்தன.","ex":"My finger has worn away by marking (on the wall) the days he has been absent while my eyes have lost their lustre and begin to fail","t1":"Vaalatrup Purkendra Kannum Avarsendra","t2":"Naalotrith Theyndha Viral"},{"n":1262,"c":127,"ct":"அவர்வயின்விதும்பல்","ce":"On the Distress of each Towards the Other","l1":"இலங்கிழாய் இன்று மறப்பின்என் தோள்மேல்","l2":"கலங்கழியும் காரிகை நீத்து.","mv":"தோழி! காதலரின் பிரிவால்துன்புற்று வருந்துகின்ற இன்றும் அவரை மறந்து விட்டால், அழகு கெட்டு என் தோள் மேல் அணிந்துள்ள அணிகள் கழலுமாறு நேரும்.","ex":"O you bright-jewelled maid, if I forget (him) today, my shoulders will lose their beauty even in the other life and make my bracelets loose","t1":"Ilangizhaai Indru Marappinen Tholmel","t2":"Kalangazhiyum Kaarikai Neeththu"},{"n":1263,"c":127,"ct":"அவர்வயின்விதும்பல்","ce":"On the Distress of each Towards the Other","l1":"உரன்நசைஇ உள்ளம் துணையாகச் சென்றார்","l2":"வரல்நசைஇ இன்னும் உளேன்.","mv":"வெற்றியை விரும்பி ஊக்கமே துணையாகக் கொண்டு வெளிநாட்டுக்குச் சென்ற காதலர், திரும்பி வருதலைக் காண விரும்பியே இன்னும் யான் உயிரோடு இருக்கின்றேன்.","ex":"I still live by longing for the arrival of him who has gone out of love for victory and with valour as his guide","t1":"Urannasaii Ullam Thunaiyaakach Chendraar","t2":"Varalnasaii Innum Ulen"},{"n":1264,"c":127,"ct":"அவர்வயின்விதும்பல்","ce":"On the Distress of each Towards the Other","l1":"கூடிய காமம் பிர஧ந்தார் வரவுள்ளிக்","l2":"கோடுகொ டேறுமென் நெஞ்சு.","mv":"முன்பு கூடியிருந்த காதலைக் கைவிட்டுப் பிரிந்த அவருடைய வருகை‌யைநினைத்து என் நெஞ்சம் மரத்தின் கிளைகளின் மேலும் ஏறிப் பார்க்கின்றது.","ex":"My heart is rid of its sorrow and swells with rapture to think of my absent lover returning with his love","t1":"Kootiya Kaamam Pirindhaar Varavullik","t2":"Kotuko Terumen Nenju"},{"n":1265,"c":127,"ct":"அவர்வயின்விதும்பல்","ce":"On the Distress of each Towards the Other","l1":"காண்கமன் கொண்கனைக் கண்ணாரக் கண்டபின்","l2":"நீங்கும்என் மென்தோள் பசப்பு.","mv":"என் காதலரைக் கண்ணாரக் காண்பேனாக; கண்ட பிறகு என்னுடைய மெல்லிய தோளில் உண்டாகிய பசலை நிறம் தானே நீங்கி விடும்.","ex":"May I look on my lover till I am satisfied and thereafter will vanish the sallowness of my slender shoulders","t1":"Kaankaman Konkanaik Kannaarak Kantapin","t2":"Neengumen Mendhol Pasappu"},{"n":1266,"c":127,"ct":"அவர்வயின்விதும்பல்","ce":"On the Distress of each Towards the Other","l1":"வருகமன் கொண்கன் ஒருநாள் பருகுவன்","l2":"பைதல்நோய் எல்லாம் கெட.","mv":"என் காதலன் ஒருநாள் என்னிடம் வருவானாக; வந்த பிறகு, என்னுடைய துன்பநோய் எல்லொம் தீருமாறு நான் நன்றாக நுகர்வேன்.","ex":"May my husband return some day; and then will I enjoy (him) so as to destroy all this agonizing sorrow","t1":"Varukaman Konkan Orunaal Parukuvan","t2":"Paidhalnoi Ellaam Keta"},{"n":1267,"c":127,"ct":"அவர்வயின்விதும்பல்","ce":"On the Distress of each Towards the Other","l1":"புலப்பேன்கொல் புல்லுவேன் கொல்லோ கலப்பேன்கொல்","l2":"கண்அன்ன கேளிர் விரன்.","mv":"என்னுடைய கண்போன்ற காதலர் வருவாரானால், யான் அவரோடு ஊடுவேனோ? அல்லது அவரைத் தழுவுவேனோ? அவரோடு கூடுவேனோ?","ex":"On the return of him who is as dear as my eyes, am I displeased or am I to embrace (him); or am I to do both?","t1":"Pulappenkol Pulluven Kollo Kalappenkol","t2":"Kananna Kelir Viran"},{"n":1268,"c":127,"ct":"அவர்வயின்விதும்பல்","ce":"On the Distress of each Towards the Other","l1":"வினைகலந்து வென்றீக வேந்தன் மனைகலந்து","l2":"மாலை அயர்கம் விருந்து.","mv":"அரசன் இச் செயலில் முனைந்து நின்று வெற்றி பெறுவானாக; அதன்பின் யாம் மனைவியோடு கூடியிருந்து அனறு வரும் மாலைப் பொழுதிற்கு விருந்து செய்வோம்.","ex":"Let the king fight and gain (victories); (but) let me be united to my wife and feast the evening","t1":"Vinaikalandhu Vendreeka Vendhan Manaikalandhu","t2":"Maalai Ayarkam Virundhu"},{"n":1269,"c":127,"ct":"அவர்வயின்விதும்பல்","ce":"On the Distress of each Towards the Other","l1":"ஒருநாள் எழுநாள்போல் செல்லும்சேண் சென்றார்","l2":"வருநாள்வைத்து ஏங்கு பவர்க்கு.","mv":"தொலைவில் உள்ள வெளிநாட்டிற்குச் சென்ற காதலர் திரும்பி வரும் நாளை நினைத்து ஏங்கும் மகளிர்க்கு ஒருநாள் ஏழுநாள் போல ( நெடிதாக) கழியும்.","ex":"To those who suffer waiting for the day of return of their distant lovers one day is as long as seven days","t1":"Orunaal Ezhunaalpol Sellumsen Sendraar","t2":"Varunaalvaiththu Engu Pavarkku"},{"n":1270,"c":127,"ct":"அவர்வயின்விதும்பல்","ce":"On the Distress of each Towards the Other","l1":"பெறின்என்னாம் பெற்றக்கால் என்னாம் உறினென்னாம்","l2":"உள்ளம் உடைந்துக்கக் கால்.","mv":"துன்பத்தைத் தாங்காமல் மனம் உடைந்து அழிந்து விட்டால், நம்மைத் திரும்பப்‌ பெறுவதனால் என்ன? பெற்றக்கால் என்ன? பெற்றுப் பொருந்தினாலும் என்ன?","ex":"After (my wife) has died of a broken heart, what good will there be if she is to receive me, has received me, or has even embraced me?","t1":"Perinennaam Petrakkaal Ennaam Urinennaam","t2":"Ullam Utaindhukkak Kaal"},{"n":1271,"c":128,"ct":"குறிப்பறிவுறுத்தல்","ce":"On Speaking on the Signs","l1":"கரப்பினுங் கையிகந் தொல்லாநின் உண்கண்","l2":"உரைக்கல் உறுவதொன் றுண்டு.","mv":"நீ சொல்லாமல் மறைத்தாலும் நிற்காமல் உன்னைக் கடந்து உன்னுடைய கண்கள் எனக்குச் சொல்லக் கூடிய செய்தி ஒன்று இருக்கிறது.","ex":"Though you would conceal (your feelings), your painted eyes would not, for, transgressing (their bounds), they tell (me) something","t1":"Karappinung Kaiyikan Thollaanin Unkan","t2":"Uraikkal Uruvadhon Runtu"},{"n":1272,"c":128,"ct":"குறிப்பறிவுறுத்தல்","ce":"On Speaking on the Signs","l1":"கண்ணிறைந்த காரிகைக் காம்பேர்தோட் பேதைக்குப்","l2":"பெண்நிறைந்த நீர்மை பெரிது.","mv":"கண் நிறைந்த அழகும் மூங்கில் போன்ற தோளும் உடைய என் காதலிக்குப் பெண்மைத்தன்மை நிறைந்து விளங்கும் இயல்பு மிகுதியாக உள்ளது.","ex":"Unusually great is the female simplicity of your maid whose beauty fills my eyes and whose shoulders resemble the bamboo","t1":"Kanniraindha Kaarikaik Kaamperdhot Pedhaikkup","t2":"Penniraindha Neermai Peridhu"},{"n":1273,"c":128,"ct":"குறிப்பறிவுறுத்தல்","ce":"On Speaking on the Signs","l1":"மணியில் திகழ்தரு நூல்போல் மடந்தை","l2":"அணியில் திகழ்வதொன்று உண்டு.","mv":"( கோத்த) மணியினுள் விளங்கும் நூலைப் போல் என் காதலியின் அழகினுள் விளங்குவதான குறிப்பு ஒன்று இருக்கின்றது.","ex":"There is something that is implied in the beauty of this woman, like the thread that is visible in a garland of gems","t1":"Maniyil Thikazhdharu Noolpol Matandhai","t2":"Aniyil Thikazhvadhondru Untu"},{"n":1274,"c":128,"ct":"குறிப்பறிவுறுத்தல்","ce":"On Speaking on the Signs","l1":"முகைமொக்குள் உள்ளது நாற்றம்போல் பேதை","l2":"நகைமொக்குள் உள்ளதொன் றுண்டு.","mv":"அரும்பு தோன்றும்போது அடங்கியிருக்கும் மணத்தைப் போல், காதலியின் புன்முறுவலின் தோற்றத்தில் அடங்கி இருக்கும் குறிப்பு ஒன்று உள்ளது.","ex":"There is something in the unmatured smile of this maid like the fragrance that is contained in an unblossomed bud","t1":"Mukaimokkul Ulladhu Naatrampol Pedhai","t2":"Nakaimokkul Ulladhon Runtu"},{"n":1275,"c":128,"ct":"குறிப்பறிவுறுத்தல்","ce":"On Speaking on the Signs","l1":"செறிதொடி செய்திறந்த கள்ளம் உறுதுயர்","l2":"தீர்க்கும் மருந்தொன்று உடைத்து.","mv":"காதலி என்னை நோக்கி செய்து விட்டுச் சென்ற கள்ளமான குறிப்பு, என் மிக்க துயரத்தைத் தீர்க்கும் மருந்து ஒன்று உடையதாக இருக்கின்றது.","ex":"The well-meant departure of her whose bangles are tight-fitting contains a remedy that can cure my great sorrow","t1":"Seridhoti Seydhirandha Kallam Urudhuyar","t2":"Theerkkum Marundhondru Utaiththu"},{"n":1276,"c":128,"ct":"குறிப்பறிவுறுத்தல்","ce":"On Speaking on the Signs","l1":"பெரிதாற்றிப் பெட்பக் கலத்தல் அரிதாற்றி","l2":"அன்பின்மை சூழ்வ துடைத்து.","mv":"பெரிதும் அன்பு செய்து விரும்புமாறு கூடுதல், அரிதாகிய பிரிவைச் செய்து பிறகு அன்பில்லாமல்கைவிட எண்ணுகின்ற குறிப்பை உடையதாகும்.","ex":"The embrace that fills me with comfort and gladness is capable of enduring (my former) sorrow and meditating on his want of love","t1":"Peridhaatrip Petpak Kalaththal Aridhaatri","t2":"Anpinmai Soozhva Thutaiththu"},{"n":1277,"c":128,"ct":"குறிப்பறிவுறுத்தல்","ce":"On Speaking on the Signs","l1":"தண்ணந் துறைவன் தணந்தமை நம்மினும்","l2":"முன்னம் உணர்ந்த வளை.","mv":"குளிர்ந்த துறையை உடைய காதலன் பிரிந்த பிரிவை நம்மை விட முன்னம‌ே நம்முடைய வளையல்கள் உணர்ந்து கழன்று விட்டனவே!","ex":"My bracelets have understood before me the (mental) separation of him who rules the cool seashore","t1":"Thannan Thuraivan Thanandhamai Namminum","t2":"Munnam Unarndha Valai"},{"n":1278,"c":128,"ct":"குறிப்பறிவுறுத்தல்","ce":"On Speaking on the Signs","l1":"நெருநற்றுச் சென்றார்எம் காதலர் யாமும்","l2":"எழுநாளேம் மேனி பசந்து.","mv":"எம்முடைய காதலர் நேற்றுதான் பிரிந்து சென்றார்; யாமும் மேனி பசலை நிறம் அடைந்து ஏழு நாட்கள் ஆய்விட்ட நிலையில் இருக்கின்றோம்.","ex":"It was but yesterday my lover departed (from me); and it is seven days since my complexion turned sallow","t1":"Nerunatruch Chendraarem Kaadhalar Yaamum","t2":"Ezhunaalem Meni Pasandhu"},{"n":1279,"c":128,"ct":"குறிப்பறிவுறுத்தல்","ce":"On Speaking on the Signs","l1":"தொடிநோக்கி மென்தோளும் நோக்கி அடிநோக்கி","l2":"அஃதாண் டவள்செய் தது.","mv":"தன்னுடைய வளையல்களை நோக்கி, மெல்லிய தோள்களையும் நோக்கித் தன்னுடைய அடிகளையும் நோக்கி அவள் செய்த குறிப்பு உடன்போக்காகிய அதுவேயாகும்.","ex":"She looked at her bracelets, her tender shoulders, and her feet; this was what she did there (significantly)","t1":"Thotinokki Mendholum Nokki Atinokki","t2":"Aqdhaan Tavalsey Thadhu"},{"n":1280,"c":128,"ct":"குறிப்பறிவுறுத்தல்","ce":"On Speaking on the Signs","l1":"பெண்ணினால் பெண்மை உடைத்தென்ப கண்ணினால்","l2":"காமநோய் சொல்லி இரவு.","mv":"கண்ணினால் காமநோயைத் தெரிவித்துப் பிரியாமல் இருக்குமாறு இரத்தல், பெண் தன்மைக்கு மேலும் பெண் தன்மை உடையது என்று கூறுவர்.","ex":"To express their love-sickness by their eyes and resort to begging bespeaks more than ordinary female excellence","t1":"Penninaal Penmai Utaiththenpa Kanninaal","t2":"Kaamanoi Solli Iravu"},{"n":1281,"c":129,"ct":"புணர்ச்சிவிதும்பல்","ce":"On Yearning After Union","l1":"உள்ளக் களித்தலும் காண மகிழ்தலும்","l2":"கள்ளுக்கில் காமத்திற் குண்டு.","mv":"நினைத்த அளவிலே களிப்படைதலும் கண்ட அளவிலே மகிழ்ச்சி அடைதலும் ஆகிய இந்த இருவகை தன்மையும் கள்ளுக்கு இல்‌லை; காமத்திற்கு உண்டு","ex":"To please by thought and cheer by sight is peculiar, not to liquor but lust","t1":"Ullak Kaliththalum Kaana Makizhdhalum","t2":"Kallukkil Kaamaththir Kuntu"},{"n":1282,"c":129,"ct":"புணர்ச்சிவிதும்பல்","ce":"On Yearning After Union","l1":"தினைத்துணையும் ஊடாமை வேண்டும் பனைத் துணையும்","l2":"காமம் நிறைய வரின்.","mv":"காமம் பனையளவாக நிறைய வரும்போது காதலரோடு தினையளவாகச் சிறிதேனும் ஊடல் கொள்ளாமல் இருக்க வேண்டும்.","ex":"If women have a lust that exceeds even the measure of the palmyra fruit, they will not desire (to feign) dislike even as much as the millet","t1":"Thinaiththunaiyum Ootaamai Ventum Panaith","t2":"Thunaiyum Kaamam Niraiya Varin"},{"n":1283,"c":129,"ct":"புணர்ச்சிவிதும்பல்","ce":"On Yearning After Union","l1":"பேணாது பெட்பவே செய்யினும் கொண்கனைக்","l2":"காணா தமையல கண்.","mv":"என்னை விரும்பாமல் புறக்கணித்துத் தனக்கு விருப்பமானவற்றையே செய்து ஒழுகினாலும், என்னுடைய கண்கள் காதலனைக் காணாமல் பொருந்தவில்லை.","ex":"Though my eyes disregard me and do what is pleasing to my husband, still will they not be satisfied unless they see him","t1":"Penaadhu Petpave Seyyinum Konkanaik","t2":"Kaanaa Thamaiyala Kan"},{"n":1284,"c":129,"ct":"புணர்ச்சிவிதும்பல்","ce":"On Yearning After Union","l1":"ஊடற்கண் சென்றேன்மன் தோழி அதுமறந்து","l2":"கூடற்கண் சென்றது என் னெஞ்சு.","mv":"தோழி! யான் அவரோடு ஊடுவதற்காகச் சென்றேன்; ஆனால், என்னுடைய நெஞ்சம் அந்த நோக்கத்தை மறந்து அவரோடு கூடுவதற்காகச் சென்றது.","ex":"My heart, forgetting all, could not its love restrain","t1":"Ootarkan Sendrenman Thozhi Adhumarandhu","t2":"Kootarkan Sendradhu En Nenju"},{"n":1285,"c":129,"ct":"புணர்ச்சிவிதும்பல்","ce":"On Yearning After Union","l1":"எழுதுங்கால் கோல்காணாக் கண்ணேபோல் கொண்கன்","l2":"பழிகாணேன் கண்ட இடத்து.","mv":"மை தீட்டும் நேரத்தில் தீட்டு் கோலைக் காணாத கண்களைப் போல், காதலனைக் கண்டபோது மட்டும் அவனுடைய குற்றத்தை நினைக்காமல் மறந்து விடுகின்றேன்.","ex":"Like the eyes which see not the pencil that paints it, I cannot see my husband's fault (just) when I meet him","t1":"Ezhudhungaal Kolkaanaak Kannepol Konkan","t2":"Pazhikaanen Kanta Itaththu"},{"n":1286,"c":129,"ct":"புணர்ச்சிவிதும்பல்","ce":"On Yearning After Union","l1":"காணுங்கால் காணேன் தவறாய காணாக்கால்","l2":"காணேன் தவறல் லவை.","mv":"காதலரைக் யான் காணும்போது ( அவருடைய செயல்களில்) தவறானவற்றைக் காண்பதில்லை; அவரைக் காணாதபோது தவறு அல்லாத நன்மைகளைக் காண்பதில்லை.","ex":"When I see my husband, I do not see any faults; but when I do not see him, I do not see anything but faults","t1":"Kaanungaal Kaanen Thavaraaya Kaanaakkaal","t2":"Kaanen Thavaral Lavai"},{"n":1287,"c":129,"ct":"புணர்ச்சிவிதும்பல்","ce":"On Yearning After Union","l1":"உய்த்தல் அறிந்து புனல்பாய் பவரேபோல்","l2":"பொய்த்தல் அறிந்தென் புலந்து.","mv":"வெள்ளம் இழுத்துச் செல்வதை அறிந்திருந்தும் ஓட் நீரில் பாய்கின்றவரைப் போல், பயன்படாமை அறிந்திருந்திருந்தும் ஊடல் கொள்வதால் பயன் ன்னெ?","ex":"Like those who leap into a stream which they know will carry them off, why should a wife feign dislike which she knows cannot hold out long?","t1":"Uyththal Arindhu Punalpaai Pavarepol","t2":"Poiththal Arindhen Pulandhu"},{"n":1288,"c":129,"ct":"புணர்ச்சிவிதும்பல்","ce":"On Yearning After Union","l1":"இளித்தக்க இன்னா செயினும் களித்தார்க்குக்","l2":"கள்ளற்றே கள்வநின் மார்பு.","mv":"கள்வ! இழிவு வரத்தக்க துன்பங்களைச் செய்தாலும் கள்ளுண்டு களித்தவர்க்கு மேன்‌மேலும் விருப்பம் தரும் கள்ளைப் போன்றது உன் மார்பு.","ex":"O you rogue! your breast is to me what liquor is to those who rejoice in it, though it only gives them an unpleasant disgrace","t1":"Iliththakka Innaa Seyinum Kaliththaarkkuk","t2":"Kallatre Kalvanin Maarpu"},{"n":1289,"c":129,"ct":"புணர்ச்சிவிதும்பல்","ce":"On Yearning After Union","l1":"மலரினும் மெல்லிது காமம் சிலர்அதன்","l2":"செவ்வி தலைப்படு வார்.","mv":"காமம் மலரை விட மென்மை உடையதாகும்; அந்த உண்மை அறிந்து அதன் நல்ல பயனைப் பெறக்கூடியவர் சிலரே.","ex":"Sexual delight is more delicate than a flower, and few are those who understand its real nature","t1":"Malarinum Mellidhu Kaamam Silaradhan","t2":"Sevvi Thalaippatu Vaar"},{"n":1290,"c":129,"ct":"புணர்ச்சிவிதும்பல்","ce":"On Yearning After Union","l1":"கண்ணின் துனித்தே கலங்கினாள் புல்லுதல்","l2":"என்னினும் தான்விதுப் புற்று.","mv":"கண் பார்வையின் அளவில் பிணங்கி, என்னை விடத் தான் விரைந்து தழுவுதலை விரும்பி, ( பிணங்கிய நிலையையும் மறந்து) கலந்து விட்டாள்.","ex":"She once feigned dislike in her eyes, but the warmth of her embrace exceeded my own","t1":"Kannin Thuniththe Kalanginaal Pulludhal","t2":"Enninum Thaanvidhup Putru"},{"n":1291,"c":130,"ct":"நெஞ்சொடுபுலத்தல்","ce":"On Speaking with the Mind","l1":"அவர்நெஞ்சு அவர்க்காதல் கண்டும் எவன்நெஞ்சே","l2":"நீஎமக்கு ஆகா தது.","mv":"நெஞ்சே! அவருடைய நெஞ்சம் ( நம்மை நினையாமல் நம்மிடம் வராமல்) அவர்க்குத் துணையாதலைக் கண்டும் நீ எமக்குத் துணையாகாதது ஏன்?","ex":"O my soul! although you have seen how his soul stands by him, how is it you do not stand by me?","t1":"Avarnenju Avarkkaadhal Kantum Evannenje","t2":"Neeemakku Aakaa Thadhu"},{"n":1292,"c":130,"ct":"நெஞ்சொடுபுலத்தல்","ce":"On Speaking with the Mind","l1":"உறாஅ தவர்க்கண்ட கண்ணும் அவரைச்","l2":"செறாஅரெனச் சேறியென் நெஞ்சு.","mv":"என் நெஞசே! நம்மேல் அன்பு கொள்ளாத காதலரைக் கண்டபோதும், அவர் வெறுக்கமாட்டார் என்று எண்ணி அவரிடம் செல்கின்றாயே!","ex":"O my soul! although you have known him who does not love me, still do you go to him, saying \"he will not be displeased.\"","t1":"Uraaa Thavarkkanta Kannum Avaraich","t2":"Cheraaarenach Cheriyen Nenju"},{"n":1293,"c":130,"ct":"நெஞ்சொடுபுலத்தல்","ce":"On Speaking with the Mind","l1":"கெட்டார்க்கு நட்டார்இல் என்பதோ நெஞ்சேநீ","l2":"பெட்டாங்கு அவர்பின் செலல்.","mv":"நெஞ்சே! நீ உன் விருப்பத்தின்படியே அவர் பின் செல்வதற்குக் காரணம், துன்பத்தால் அழிந்தவர்‌க்கு நண்பர் இல்லை என்னும் எண்ண‌மோ?","ex":"O my soul! do you follow him at pleasure under the belief that the ruined have no friends?","t1":"Kettaarkku Nattaaril Enpadho Nenjenee","t2":"Pettaangu Avarpin Selal"},{"n":1294,"c":130,"ct":"நெஞ்சொடுபுலத்தல்","ce":"On Speaking with the Mind","l1":"இனிஅன்ன நின்னொடு சூழ்வார்யார் நெஞ்சே","l2":"துனிசெய்து துவ்வாய்காண் மற்று.","mv":"நெஞ்‌சே! நீ ஊடலைச் செய்து அதன் பயனை நுகர மாட்டாய்; இனிமேல் அத்தகையவற்றைப் பற்றி உன்னோடு கலந்து எண்ணப் போகின்றவர் யார்?","ex":"O my soul! you would not first seem sulky and then enjoy (him); who then would in future consult you about such things?","t1":"Inianna Ninnotu Soozhvaaryaar Nenje","t2":"Thuniseydhu Thuvvaaikaan Matru"},{"n":1295,"c":130,"ct":"நெஞ்சொடுபுலத்தல்","ce":"On Speaking with the Mind","l1":"பெறாஅமை அஞ்சும் பெறின்பிரிவு அஞ்சும்","l2":"அறாஅ இடும்பைத்தென் நெஞ்சு.","mv":"( காதலரைப் பெறாதபோது) பெறாமைக்கு அஞ்சும்; பெற்றால் பிரிவை நினைத்து அஞ்சும்; ( இவ்வாறாக) என் நெஞ்சம் தீராத துன்பம் உடையதாகின்றது.","ex":"My soul fears when it is without him; it also fears when it is with him; it is subject to incessant sorrow","t1":"Peraaamai Anjum Perinpirivu Anjum","t2":"Araaa Itumpaiththen Nenju"},{"n":1296,"c":130,"ct":"நெஞ்சொடுபுலத்தல்","ce":"On Speaking with the Mind","l1":"தனியே இருந்து நினைத்தக்கால் என்னைத்","l2":"தினிய இருந்ததென் நெஞ்சு.","mv":"காதலரைப் பிரிந்து தனியே இருந்து அவருடைய தவறுகளை நினைத்தபோது என் நெஞ்சம் என்னைத் தின்பது போல் துன்பம் செய்வதாக இருந்தது.","ex":"My mind has been (here) in order to eat me up (as it were) whenever I think of him in my solitude","t1":"Thaniye Irundhu Ninaiththakkaal Ennaith","t2":"Thiniya Irundhadhen Nenju"},{"n":1297,"c":130,"ct":"நெஞ்சொடுபுலத்தல்","ce":"On Speaking with the Mind","l1":"நாணும் மறந்தேன் அவர்மறக் கல்லாஎன்","l2":"மாணா மடநெஞ்சிற் பட்டு.","mv":"காதலனை மறக்க முடியாத என்னுடைய சிறப்பில்லாத மட நெஞ்சினோடு சேர்ந்து, மறக்கத் தகாததாகிய நாணத்தையும் மறந்து விடடேன்.","ex":"I have even forgotten my modesty, having been caught in my foolish mind which is not dignified enough to forget him","t1":"Naanum Marandhen Avarmarak Kallaaen","t2":"Maanaa Matanenjir Pattu"},{"n":1298,"c":130,"ct":"நெஞ்சொடுபுலத்தல்","ce":"On Speaking with the Mind","l1":"எள்ளின் இளிவாம்என்று எண்ணி அவர்திறம்","l2":"உள்ளும் உயிர்க்காதல் நெஞ்சு.","mv":"உயரின் மேல் காதல் கொண்ட என் நெஞ்சம், பிரிந்த காதலரை இகழ்ந்தால் இழிவாகும் என்று எண்ணி அவருடைய உயர்ந்த பண்புகளையே நினைக்கின்றது.","ex":"My soul which clings to life thinks only of his (own) gain in the belief that it would be disgraceful for it to despise him","t1":"Ellin Ilivaamendru Enni Avardhiram","t2":"Ullum Uyirkkaadhal Nenju"},{"n":1299,"c":130,"ct":"நெஞ்சொடுபுலத்தல்","ce":"On Speaking with the Mind","l1":"துன்பத்திற்கு யாரே துணையாவார் தாமுடைய","l2":"நெஞ்சந் துணையல் வழி.","mv":"ஒருவர்க்குத் துன்பம் வந்தபோது, தாம் உரிமையாகப் பெற்றுள்ள நெஞ்சமே துணையாகா விட்டால், வேறு யார் துணையாவார்?","ex":"Who would help me out of one's distress, when one's own soul refuses help to one?","t1":"Thunpaththirku Yaare Thunaiyaavaar Thaamutaiya","t2":"Nenjan Thunaiyal Vazhi"},{"n":1300,"c":130,"ct":"நெஞ்சொடுபுலத்தல்","ce":"On Speaking with the Mind","l1":"தஞ்சம் தமரல்லர் ஏதிலார் தாமுடைய","l2":"நெஞ்சம் தமரல் வழி.","mv":"ஒருவர்க்கு தாம் உரிமையாகப் பெற்ற நெஞ்சமே உறவாகாதபோது அயலார் உறவில்லாதவராக இருப்பது எளிதேயாகும்.","ex":"It is hardly possible for strangers to behave like relations, when one's own soul acts like a stranger","t1":"Thanjam Thamarallar Edhilaar Thaamutaiya","t2":"Nenjam Thamaral Vazhi"},{"n":1301,"c":131,"ct":"புலவி","ce":"On Lovers' Misunderstanding","l1":"புல்லா திராஅப் புலத்தை அவர் உறும்","l2":"அல்லல்நோய் காண்கம் சிறிது.","mv":"( ஊடும்போது அவர் அடைகின்ற) துன்ப நோயைச் சிறிது காண்போம்; அதற்காக அவரைத் தழுவாமலிருந்து பிணங்குவாயாக.","ex":"Let us witness awhile his keen suffering; just feign dislike and embrace him not","t1":"Pullaa Thiraaap Pulaththai Avar","t2":"Urum Allalnoi Kaankam Siridhu"},{"n":1302,"c":131,"ct":"புலவி","ce":"On Lovers' Misunderstanding","l1":"உப்பமைந் தற்றால் புலவி அதுசிறிது","l2":"மிக்கற்றால் நீள விடல்.","mv":"உப்பு, உணவில் அளவோடு அமைந்திருப்பதைப் போன்றது ஊடல்; ஊடலை அளவு கடந்து நீட்டித்தல், அந்த உப்பு சிறிதளவு மிகுதியாக இருப்பதைப் போன்றது.","ex":"A little dislike is like salt in proportion; to prolong it a little is like salt a little too much","t1":"Uppamain Thatraal Pulavi Adhusiridhu","t2":"Mikkatraal Neela Vital"},{"n":1303,"c":131,"ct":"புலவி","ce":"On Lovers' Misunderstanding","l1":"அலந்தாரை அல்லல்நோய் செய்தற்றால் தம்மைப்","l2":"புலந்தாரைப் புல்லா விடல்.","mv":"தம்மோடு பிணங்கியவரை ஊடலுணர்த்தித் தழுவாமல் விடுதல், துன்பத்தால் வருந்தியவரை மேலும் துன்ப நோய் செய்து வரத்தினாற் போன்றது.","ex":"For men not to embrace those who have feigned dislike is like torturing those already in agony","t1":"Alandhaarai Allalnoi Seydhatraal Thammaip","t2":"Pulandhaaraip Pullaa Vital"},{"n":1304,"c":131,"ct":"புலவி","ce":"On Lovers' Misunderstanding","l1":"ஊடி யவரை உணராமை வாடிய","l2":"வள்ளி முதலரிந் தற்று.","mv":"பிணங்கியவரை ஊடலுணர்த்தி அன்பு செய்யாமல் இருத்தல், முன்னமே வாடியுள்ள கொடியை அதன் அடியிலேயே அறுத்தல் போன்றது.","ex":"Not to reconcile those who have feigned dislike is like cutting a faded creeper at its root","t1":"Ooti Yavarai Unaraamai Vaatiya","t2":"Valli Mudhalarin Thatru"},{"n":1305,"c":131,"ct":"புலவி","ce":"On Lovers' Misunderstanding","l1":"நலத்தகை நல்லவர்க்கு ஏஎர் புலத்தகை","l2":"பூஅன்ன கண்ணார் அகத்து.","mv":"நல்ல பண்புகள் அமைந்த நல்ல ஆடவர்க்கு அழகு, மலர் போன்ற கண்களை உடைய மகளிரின் நெஞ்சம் விளையும் ஊடலின் சிறப்பே ஆகும்.","ex":"An increased shyness in those whose eyes are like flowers is beautiful even to good and virtuous husbands","t1":"Nalaththakai Nallavarkku Eer Pulaththakai","t2":"Pooanna Kannaar Akaththu"},{"n":1306,"c":131,"ct":"புலவி","ce":"On Lovers' Misunderstanding","l1":"துனியும் புலவியும் இல்லாயின் காமம்","l2":"கனியும் கருக்காயும் அற்று.","mv":"பெரும் பிணக்கும் சிறு பிணக்கும் இல்லாவிட்டால், காமம் மிகப் பழுத்த பழமும் முற்றாத இளங்காயும் போல் பயன்படாததாகும்.","ex":"Sexual pleasure, without prolonged and short-lived dislike, is like too ripe, and unripe fruit","t1":"Thuniyum Pulaviyum Illaayin Kaamam","t2":"Kaniyum Karukkaayum Atru"},{"n":1307,"c":131,"ct":"புலவி","ce":"On Lovers' Misunderstanding","l1":"ஊடலின் உண்டாங்கோர் துன்பம் புணர்வது","l2":"நீடுவ தன்று கொல் என்று.","mv":"கூடியிருக்கும் இன்பம் இனிமேல் நீட்டிக்காதோ என்று ஏங்கி எண்ணுவதால் ஊடியிருத்தலினும் காதலர்க்கு ஒருவகைத் துன்பம் இருக்கின்றது.","ex":"The doubt as to whether intercourse would take place soon or not, creates a sorrow (even) in feigned dislike","t1":"Ootalin Untaangor Thunpam Punarvadhu","t2":"Neetuva Thandru Kol Endru"},{"n":1308,"c":131,"ct":"புலவி","ce":"On Lovers' Misunderstanding","l1":"நோதல் எவன்மற்று நொந்தாரென்று அஃதறியும்","l2":"காதலர் இல்லா வழி.","mv":"நம்மால் இவர் வருந்தினார் என்று அந்த வருத்தத்தை அறிகின்ற காதலர் இல்லாதபோது, வருந்துவதால் பயன் என்ன?","ex":"What avails sorrow when I am without a wife who can understand the cause of my sorrow?","t1":"Nodhal Evanmatru Nondhaarendru Aqdhariyum","t2":"Kaadhalar Illaa Vazhi"},{"n":1309,"c":131,"ct":"புலவி","ce":"On Lovers' Misunderstanding","l1":"நீரும் நிழலது இனிதே புலவியும்","l2":"வீழுநர் கண்ணே இனிது.","mv":"நீரும் நிழலை அடுத்திருப்பதே இனிமையானது; அதுபோல், ஊடலும் அன்பு செலுத்துவோரிடத்தில் கொள்வதே இன்பமானது.","ex":"Like water in the shade, dislike is delicious only in those who love","t1":"Neerum Nizhaladhu Inidhe Pulaviyum","t2":"Veezhunar Kanne Inidhu"},{"n":1310,"c":131,"ct":"புலவி","ce":"On Lovers' Misunderstanding","l1":"ஊடல் உணங்க விடுவாரோடு என்நெஞ்சம்","l2":"கூடுவேம் என்பது அவா.","mv":"ஊடல் கொண்ட‌போது உணர்த்தி மகிழ்விக்காமல் வாட விடுகின்றவரோடு என் நெஞ்சம் கூடியிருப்போம் என்று முயல்வதற்குக் காரணம் அதன் ஆசையே.","ex":"It is nothing but strong desire that makes her mind unite with me who can leave her to her own dislike","t1":"Ootal Unanga Vituvaarotu Ennenjam","t2":"Kootuvem Enpadhu Avaa"},{"n":1311,"c":132,"ct":"புலவி நுணுக்கம்","ce":"On Subtlety of Lovers' Misunderstanding","l1":"பெண்ணியலார் எல்லாரும் கண்ணின் பொதுஉண்பர்","l2":"நண்ணேன் பரத்தநின் மார்பு.","mv":"பரத்தமை உடையாய்! பெண் தன்மை உடையவர் எல்லாரும் தம்தம் கண்களால் ‌பொதுப் பொருளாகக் கொண்டு நுகர்கின்றார்கள்; ஆகையால் உன் மார்பைப் பொருந்தேன்.","ex":"You are given to prostitution; all those who are born as womankind enjoy you with their eyes in an ordinary way I will not embrace you","t1":"Penniyalaar Ellaarum Kannin Podhuunpar","t2":"Nannen Paraththanin Maarpu"},{"n":1312,"c":132,"ct":"புலவி நுணுக்கம்","ce":"On Subtlety of Lovers' Misunderstanding","l1":"ஊடி இருந்தேமாத் தும்மினார் யாம்தம்மை","l2":"நீடுவாழ் கென்பாக் கறிந்து.","mv":"காதலரோடு ஊடல் கொண்டிருந்தோமாக, யாம் தம்மை நெடுங்காலம் வாழ்க என்று வாய் திறந்து சொல்லுவோம் என நினைத்து அவர் தும்மினார்.","ex":"When I continued to be sulky he sneezed and thought I would (then) wish him a long life","t1":"Ooti Irundhemaath Thumminaar Yaamdhammai","t2":"Neetuvaazh Kenpaak Karindhu"},{"n":1313,"c":132,"ct":"புலவி நுணுக்கம்","ce":"On Subtlety of Lovers' Misunderstanding","l1":"கோட்டுப் பூச் சூடினும் காயும் ஒருத்தியைக்","l2":"காட்டிய சூடினீர் என்று.","mv":"கிளைகளில் மலர்ந்த மலர்களைச் சூடினாலும், நீர் இந்த அழகை யாரோ ஒருத்திக்கு காட்டுவதற்காகச் சூடினீர் என்று சினம் கொள்வாள்.","ex":"Even if I were adorned with a garland of branch-flowers, she would say I did so to show it to another woman","t1":"Kottup Pooch Chootinum Kaayum","t2":"Oruththiyaik Kaattiya Sootineer Endru"},{"n":1314,"c":132,"ct":"புலவி நுணுக்கம்","ce":"On Subtlety of Lovers' Misunderstanding","l1":"யாரினும் காதலம் என்றேனா ஊடினாள்","l2":"யாரினும் யாரினும் என்று.","mv":"யாரையும் விட நாம் மிக்க காதல் கொண்டிருக்கிறோம் என்று சொன்னேனாக; ய‌ாரை விட...? யாரை விட..? என்று கேட்டு ஊடல் கொண்டாள்.","ex":"When I said I loved her more than any other woman, she said \"more than others, yes, more than others,\" and remained sulky","t1":"Yaarinum Kaadhalam Endrenaa Ootinaal","t2":"Yaarinum Yaarinum Endru"},{"n":1315,"c":132,"ct":"புலவி நுணுக்கம்","ce":"On Subtlety of Lovers' Misunderstanding","l1":"இம்மைப் பிறப்பில் பிரியலம் என்றேனாக்","l2":"கண்நிறை நீர்கொண் டனள்.","mv":"இப்பிறப்பில் யாம் பிரிய மாட்டோம் என்று காதலியிடம் சொன்னேனாக, இனி வரும் பிறப்பில் பிரிவதாக உணர்ந்து கண் நிறையக் கண்ணீர் கொண்டாள்.","ex":"When I said I would never part from her in this life her eyes were filled with tears","t1":"Immaip Pirappil Piriyalam Endrenaak","t2":"Kannirai Neerkon Tanal"},{"n":1316,"c":132,"ct":"புலவி நுணுக்கம்","ce":"On Subtlety of Lovers' Misunderstanding","l1":"உள்ளினேன் என்றேன்மற் றென்மறந்தீர் என்றென்னைப்","l2":"புல்லாள் புலத்தக் கனள்.","mv":"நினைத்தேன் என்று கூறி‌னேன்; நினைப்புக்கு முன் மறப்பு உண்டு அன்றோ? ஏன் மறந்தீர் என்று என்னைத் தழுவாமல் ஊடினாள்.","ex":"When I said I had remembered her, she said I had forgotten her and relaxing her embrace, began to feign dislike","t1":"Ullinen Endrenmar Renmarandheer Endrennaip","t2":"Pullaal Pulaththak Kanal"},{"n":1317,"c":132,"ct":"புலவி நுணுக்கம்","ce":"On Subtlety of Lovers' Misunderstanding","l1":"வழுத்தினாள் தும்மினேன் ஆக அழித்தழுதாள்","l2":"யாருள்ளித் தும்மினீர் என்று.","mv":"யான் தும்மினேனாக; அவள் நூறாண்டு என வாழ்த்தினாள்; உடனே அதை விட்டு யார் நினைத்ததால் தும்மினீர்? என்று கேட்டு அழுதாள்?","ex":"When I sneezed she blessed me, but at once changed (her mind) and wept, asking, \"At the thought of whom did you sneeze?\"","t1":"Vazhuththinaal Thumminen Aaka Azhiththazhudhaal","t2":"Yaarullith Thummineer Endru"},{"n":1318,"c":132,"ct":"புலவி நுணுக்கம்","ce":"On Subtlety of Lovers' Misunderstanding","l1":"தும்முச் செறுப்ப அழுதாள் நுமர்உள்ளல்","l2":"எம்மை மறைத்திரோ என்று.","mv":"அவளுடைய ஊடலுக்கு அஞ்சி யான் தும்மலை அடக்கிக் கொள்ள உம்மவர் உம்மை நினைப்பதை எமக்குத் தெரியாமல் மறைக்கின்றீரோ என்று அழுதாள்.","ex":"When I suppressed my sneezing, she wept saying, \"I suppose you (did so) to hide from me your own people's remembrance of you\"","t1":"Thummuch Cheruppa Azhudhaal Numarullal","t2":"Emmai Maraiththiro Endru"},{"n":1319,"c":132,"ct":"புலவி நுணுக்கம்","ce":"On Subtlety of Lovers' Misunderstanding","l1":"தன்னை உணர்த்தினும் காயும் பிறர்க்கும்நீர்","l2":"இந்நீரர் ஆகுதிர் என்று.","mv":"ஊடியிருந்தபோது அவளை ஊடல் உணர்த்தி மகிழ்வித்தாலும், நீர் மற்ற மகளிர்க்கும் இத்தன்மையானவராக ஆவீர் என்று ‌சொல்லிச் சினம் கொள்வாள்.","ex":"'I see', quoth she, 'to other folks How you are wondrous kind' Even when I try to remove her dislike, she is displeased and says, \"This is the way you behave","t1":"Thannai Unarththinum Kaayum Pirarkkumneer","t2":"Inneerar Aakudhir Endru"},{"n":1320,"c":132,"ct":"புலவி நுணுக்கம்","ce":"On Subtlety of Lovers' Misunderstanding","l1":"நினைத்திருந்து நோக்கினும் காயும் அனைத்துநீர்","l2":"யாருள்ளி நோக்கினீர் என்று.","mv":"அவளுடைய அழகை நி‌னைத்து அமைதியாக இருந்து நோக்கினாலும், நீர் யாரை நினைத்து ஒப்புமையாக எல்லாம் பார்க்கின்றீர்? என்று சினம் கொள்வாள்.","ex":"Even when I look on her contemplating (her beauty), she is displeased and says, \"With whose thought have you (thus) looked on my person?\"","t1":"Ninaiththirundhu Nokkinum Kaayum Anaiththuneer","t2":"Yaarulli Nokkineer Endru"},{"n":1321,"c":133,"ct":"ஊடலுவகை","ce":"On the Pleasures of Lovers' Misunderstanding","l1":"இல்லை தவறவர்க்கு ஆயினும் ஊடுதல்","l2":"வல்லது அவர்அள஧க்கு மாறு.","mv":"அவரிடம் தவறு ஒன்றும் இல்லையானலும், அவரோடு ஊடுதல், அவர் நம்மேல் மிகுதியாக அன்பு செலுத்துமாறு செய்ய வல்லது.","ex":"Although my husband is free from defects, the way in which he embraces me is such as to make me feign dislike","t1":"Illai Thavaravarkku Aayinum Ootudhal","t2":"Valladhu Avaralikku Maaru"},{"n":1322,"c":133,"ct":"ஊடலுவகை","ce":"On the Pleasures of Lovers' Misunderstanding","l1":"ஊடலின் தோன்றும் சிறுதுனி நல்லளி","l2":"வாடினும் பாடு பெறும்.","mv":"ஊடுதலால் உண்டாகின்ற சிறிய துன்பம், காதலர் செய்கின்ற நல்ல அன்பு வாடிவிடக் காரணமாக இருந்தாலும் பெருமை பெறும்.","ex":"His love will increase though it may (at first seem to) fade through the short-lived distress caused by (my) dislike","t1":"Ootalin Thondrum Sirudhuni Nallali","t2":"Vaatinum Paatu Perum"},{"n":1323,"c":133,"ct":"ஊடலுவகை","ce":"On the Pleasures of Lovers' Misunderstanding","l1":"புலத்தலின் புத்தேள்நாடு உண்டோ நிலத்தொடு","l2":"நீரியைந் தன்னார் அகத்து.","mv":"நிலத்தோடு நீர் பொருந்தி கலந்தாற் போன்ற அன்புடைய காதலரிடத்தில் ஊடுவதை விட இன்பம் தருகின்ற தேவருலம் இருக்கின்றதோ.","ex":"Is there a celestial land that can please like the feigned dislike of those whose union resembles that of earth and water?","t1":"Pulaththalin Puththelnaatu Unto Nilaththotu","t2":"Neeriyain Thannaar Akaththu"},{"n":1324,"c":133,"ct":"ஊடலுவகை","ce":"On the Pleasures of Lovers' Misunderstanding","l1":"புல்லி விடாஅப் புலவியுள் தோன்றுமென்","l2":"உள்ளம் உடைக்கும் படை.","mv":"காதலரைத் தழுவிக்கொண்டு விடாமலிருப்பதற்கு காரணமான ஊடலுள், என்னுடைய உள்ளத்தை உடைக்க வல்ல படை தோன்றுகிறது.","ex":"In prolonged dislike after an embrace there is a weapon that can break my heart","t1":"Pulli Vitaaap Pulaviyul Thondrumen","t2":"Ullam Utaikkum Patai"},{"n":1325,"c":133,"ct":"ஊடலுவகை","ce":"On the Pleasures of Lovers' Misunderstanding","l1":"தவறிலர் ஆயினும் தாம்வீழ்வார் மென்றோள்","l2":"அகறலின் ஆங்கொன் றுடைத்து.","mv":"தவறு இல்லாத போதும் ஊடலுக்கு ஆளாகித் தாம் விரும்பும் மகளிரின் மெல்லிய தோள்களை நீங்கி இருக்கும் போது ஓர் இன்பம் உள்ளது.","ex":"Though free from defects, men feel pleased when they cannot embrace the delicate shoulders of those whom they love","t1":"Thavarilar Aayinum Thaamveezhvaar Mendrol","t2":"Akaralin Aangon Rutaiththu"},{"n":1326,"c":133,"ct":"ஊடலுவகை","ce":"On the Pleasures of Lovers' Misunderstanding","l1":"உணலினும் உண்டது அறல்இனிது காமம்","l2":"புணர்தலின் ஊடல் இனிது.","mv":"உண்பதை விட முன் உண்ட உணவுச் செரிப்பது இன்பமானது, அதுபோல் காமத்தில் கூடுவதைவிட ஊடுதல் இன்பமானது.","ex":"To digest what has been eaten is more delightful than to eat more; likewise love is more delightful in dislike than intercourse","t1":"Unalinum Untadhu Aralinidhu Kaamam","t2":"Punardhalin Ootal Inidhu"},{"n":1327,"c":133,"ct":"ஊடலுவகை","ce":"On the Pleasures of Lovers' Misunderstanding","l1":"ஊடலில் தோற்றவர் வென்றார் அதுமன்னும்","l2":"கூடலிற் காணப் படும்.","mv":"ஊடலில் தோற்றவரே வெற்றி பெற்றவர் ஆவர், அந்த உண்மை,ஊடல் முடிந்த பின் கூடிமகிழும் நிலையில் காணப்படும்.","ex":"Those are conquerors whose dislike has been defeated and that is proved by the love (which","t1":"Ootalil Thotravar Vendraar Adhumannum","t2":"Kootalir Kaanap Patum"},{"n":1328,"c":133,"ct":"ஊடலுவகை","ce":"On the Pleasures of Lovers' Misunderstanding","l1":"ஊடிப் பெறுகுவம் கொல்லோ நுதல்வெயர்ப்பக்","l2":"கூடலில் தோன்றிய உப்பு.","mv":"நெற்றி வியர்க்கும் படியாக கூடுவதில் உளதாகும் இனிமையை ஊடியிருந்து உணர்வதன் பயனாக இனியும் பெறுவோமோ.","ex":"Will I enjoy once more through her dislike, the pleasure of that love that makes her forehead perspire?","t1":"Ootip Perukuvam Kollo Nudhalveyarppak","t2":"Kootalil Thondriya Uppu"},{"n":1329,"c":133,"ct":"ஊடலுவகை","ce":"On the Pleasures of Lovers' Misunderstanding","l1":"ஊடுக மன்னோ ஒளியிழை யாமிரப்ப","l2":"நீடுக மன்னோ இரா.","mv":"காதலி இன்னும் ஊடுவாளாக, அந்த ஊடலைத் தணிக்கும் பொருட்டு யாம் இரந்து நிற்குமாறு இராக்காலம் இன்னும் நீட்டிப்பதாக.","ex":"May the bright-jewelled one feign dislike, and may the night be prolonged for me to implore her!","t1":"Ootuka Manno Oliyizhai Yaamirappa","t2":"Neetuka Manno Iraa"},{"n":1330,"c":133,"ct":"ஊடலுவகை","ce":"On the Pleasures of Lovers' Misunderstanding","l1":"ஊடுதல் காமத்திற்கு இன்பம் அதற்கின்பம்","l2":"கூடி முயங்கப் பெறின்.","mv":"காமத்திற்கு இன்பம் தருவது ஊடுதல் ஆகும், ஊடல் முடிந்த பின் கூடித் தழுவப் பெற்றால் அந்த ஊடலுக்கு இன்பமாகும்.","ex":"Dislike adds delight to love; and a hearty embrace (thereafter) will add delight to dislike","t1":"Ootudhal Kaamaththirku Inpam Adharkinpam","t2":"Kooti Muyangap Perin"}];

let currentTab = 'verses';
let offsets = { verses: [], meanings: [] };
let sharedIndex = 0; // one pointer, kept in sync across both pages

const LANG_ORDER_KEY = 'kuralTwoPageTamil.langOrder.v1';
function loadLangOrder(){
  try{
    const raw = localStorage.getItem(LANG_ORDER_KEY);
    return (raw === 'ta' || raw === 'en') ? raw : 'ta';
  }catch(e){ return 'ta'; }
}
let langOrder = loadLangOrder(); // 'ta' = Tamil first everywhere, 'en' = English first everywhere

function setLangOrder(order){
  if(order === langOrder) return;
  langOrder = order;
  try{ localStorage.setItem(LANG_ORDER_KEY, order); }catch(e){}
  document.getElementById('lang-btn-ta').classList.toggle('active', order === 'ta');
  document.getElementById('lang-btn-en').classList.toggle('active', order === 'en');
  renderToc();
  renderAll();
  // re-render changes each panel's layout, so restore exactly where the reader was
  scrollToIndex(sharedIndex, false);
}

function verseItemHtml(k){
  const chapterLabel = langOrder === 'ta'
    ? `<span class="lang-ta">${k.ct}</span> <span class="lang-secondary">(${k.ce})</span>`
    : `${k.ce} <span class="lang-secondary lang-ta">(${k.ct})</span>`;
  const tamilBlock = `<div class="${langOrder==='ta' ? 'v-content-primary' : 'v-content-secondary'} lang-ta">${k.l1}<br>${k.l2}</div>`;
  const translitBlock = `<div class="${langOrder==='ta' ? 'v-content-secondary' : 'v-content-primary'}">${k.t1}${k.t2 ? ' &nbsp;·&nbsp; ' + k.t2 : ''}</div>`;
  return `<div class="item" id="v-${k.n}" onclick="toggleItemActions(this)">
    <div class="item-top">
      <span class="i-num">#${k.n}</span>
      <button class="copy-btn" onclick="event.stopPropagation(); copyKural(${k.n}, this)" aria-label="Copy this kural">⧉</button>
    </div>
    <div class="v-chapter">Ch. ${k.c} · ${chapterLabel}</div>
    ${langOrder==='ta' ? tamilBlock + translitBlock : translitBlock + tamilBlock}
  </div>`;
}

function meaningItemHtml(k){
  const chapterLabel = langOrder === 'ta'
    ? `<span class="lang-ta">${k.ct}</span> <span class="lang-secondary">(${k.ce})</span>`
    : `${k.ce} <span class="lang-secondary lang-ta">(${k.ct})</span>`;
  const taBlock = `<p class="${langOrder==='ta' ? 'm-content-primary' : 'm-content-secondary'} lang-ta">${k.mv || 'இந்த குறளுக்கான உரை இதுவரை இல்லை.'}</p>`;
  const enBlock = `<p class="${langOrder==='ta' ? 'm-content-secondary' : 'm-content-primary'}">${k.ex}</p>`;
  return `<div class="item" id="m-${k.n}" onclick="toggleItemActions(this)">
    <div class="item-top">
      <span class="i-num">#${k.n}</span>
      <button class="copy-btn" onclick="event.stopPropagation(); copyKural(${k.n}, this)" aria-label="Copy this kural">⧉</button>
    </div>
    <div class="m-chapter">Ch. ${k.c} · ${chapterLabel}</div>
    ${langOrder==='ta' ? taBlock + enBlock : enBlock + taBlock}
  </div>`;
}

function toggleItemActions(el){
  el.classList.toggle('show-actions');
}

function composeShareText(k){
  const header = langOrder === 'ta'
    ? `குறள் #${k.n} · ${k.ct} (${k.ce})`
    : `Kural #${k.n} · ${k.ce} (${k.ct})`;
  const verseLines = `${k.l1}\n${k.l2}`;
  const translit = `${k.t1}${k.t2 ? ' · ' + k.t2 : ''}`;
  const mvBlock = `மு.வரதராசனார் உரை:\n${k.mv || ''}`;
  const enBlock = `English:\n${k.ex || ''}`;
  const meaningBlocks = langOrder === 'ta' ? `${mvBlock}\n\n${enBlock}` : `${enBlock}\n\n${mvBlock}`;
  return `${header}\n\n${verseLines}\n\n${translit}\n\n${meaningBlocks}\n\n— Thirukkural, Kural Reader`;
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try{ document.execCommand('copy'); }catch(e){ /* copy unsupported — nothing more we can do */ }
  document.body.removeChild(ta);
}

function showCopiedFeedback(btn){
  const original = btn.textContent;
  const item = btn.closest('.item');
  btn.textContent = '✓';
  btn.classList.add('copied');
  setTimeout(()=>{
    btn.textContent = original;
    btn.classList.remove('copied');
    // the action is done — fade the icon back out rather than leaving it sitting there
    if(item) item.classList.remove('show-actions');
  }, 1200);
}

function copyKural(n, btn){
  const k = KURAL_DATA[n - 1];
  const text = composeShareText(k);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=> showCopiedFeedback(btn))
      .catch(()=>{ fallbackCopy(text); showCopiedFeedback(btn); });
  } else {
    fallbackCopy(text);
    showCopiedFeedback(btn);
  }
}

function renderAll(){
  document.getElementById('panel-verses').innerHTML = KURAL_DATA.map(verseItemHtml).join('');
  document.getElementById('panel-meanings').innerHTML = KURAL_DATA.map(meaningItemHtml).join('');
  computeOffsets();
}

function computeOffsets(){
  const vPanel = document.getElementById('panel-verses');
  const mPanel = document.getElementById('panel-meanings');
  const cPanel = document.getElementById('panel-contents');
  offsets.verses = Array.from(vPanel.children).map(el => el.offsetTop);
  offsets.meanings = Array.from(mPanel.children).map(el => el.offsetTop);
  // contents is organized by chapter (133), not by kural (1330) — offsets.contents[c-1] = that chapter's row position
  offsets.contents = Array.from(cPanel.querySelectorAll('.toc-chapter')).map(el => el.offsetTop);
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tab-contents').classList.toggle('active', tab==='contents');
  document.getElementById('tab-verses').classList.toggle('active', tab==='verses');
  document.getElementById('tab-meanings').classList.toggle('active', tab==='meanings');
  document.getElementById('panel-contents').classList.toggle('active', tab==='contents');
  document.getElementById('panel-verses').classList.toggle('active', tab==='verses');
  document.getElementById('panel-meanings').classList.toggle('active', tab==='meanings');
  // carry the same pointer over to the newly active tab, instantly, no animation — Contents included
  scrollToIndex(sharedIndex, false);
}

function activePanel(){
  if(currentTab === 'verses') return document.getElementById('panel-verses');
  if(currentTab === 'meanings') return document.getElementById('panel-meanings');
  return document.getElementById('panel-contents');
}

function binarySearchOffset(arr, scrollTop){
  let lo = 0, hi = arr.length - 1, ans = 0;
  while(lo <= hi){
    const mid = (lo + hi) >> 1;
    if(arr[mid] <= scrollTop + 4){ ans = mid; lo = mid + 1; }
    else{ hi = mid - 1; }
  }
  return ans;
}

const STORAGE_KEY = 'kuralTwoPageTamil.position.v1';

function savePositionNow(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ tab: currentTab, index: sharedIndex })); }
  catch(e){ /* storage unavailable — reading still works, just no memory across refresh */ }
}

let saveTimer = null;
function savePositionDebounced(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(savePositionNow, 300);
}

function loadPosition(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    if(typeof parsed.index !== 'number' || parsed.index < 0 || parsed.index >= KURAL_DATA.length) return null;
    return parsed;
  }catch(e){ return null; }
}

function updateScrubFromIndex(idx){
  sharedIndex = idx;
  const frac = idx / (KURAL_DATA.length - 1);
  document.getElementById('scrub-fill').style.width = (frac * 100) + '%';
  document.getElementById('scrub-handle').style.left = (frac * 100) + '%';
  document.getElementById('scrub-current').textContent = '#' + (idx + 1);
  savePositionDebounced();
}

let scrollRAF = null;
function onPanelScroll(){
  if(scrollRAF) return;
  scrollRAF = requestAnimationFrame(()=>{
    const panel = activePanel();
    if(currentTab === 'contents'){
      const chapterIdx = binarySearchOffset(offsets.contents, panel.scrollTop); // 0..132
      const kuralIdx = chaptersMeta[chapterIdx].firstIdx;
      updateScrubFromIndex(kuralIdx);
    } else {
      const idx = binarySearchOffset(offsets[currentTab], panel.scrollTop);
      updateScrubFromIndex(idx);
    }
    scrollRAF = null;
  });
}

function scrollToIndex(idx, smooth){
  idx = Math.max(0, Math.min(KURAL_DATA.length - 1, idx));
  const panel = activePanel();
  let target;
  if(currentTab === 'contents'){
    const chapterNum = KURAL_DATA[idx].c;
    target = offsets.contents[chapterNum - 1];
  } else {
    target = offsets[currentTab][idx];
  }
  panel.scrollTo({ top: target, behavior: smooth ? 'smooth' : 'auto' });
  updateScrubFromIndex(idx);
}

function jumpToInput(){
  const val = parseInt(document.getElementById('jump-input').value, 10);
  if(!val || val < 1 || val > KURAL_DATA.length) return;
  scrollToIndex(val - 1, true);
}

document.getElementById('jump-input').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') jumpToInput();
});

function scrubToClientX(clientX){
  const bar = document.getElementById('scrub-bar');
  const rect = bar.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  const idx = Math.round(frac * (KURAL_DATA.length - 1));
  scrollToIndex(idx, false);
}

const scrubBar = document.getElementById('scrub-bar');
let dragging = false;
scrubBar.addEventListener('mousedown', (e)=>{ dragging = true; scrubToClientX(e.clientX); });
window.addEventListener('mousemove', (e)=>{ if(dragging) scrubToClientX(e.clientX); });
window.addEventListener('mouseup', ()=>{ dragging = false; });
scrubBar.addEventListener('touchstart', (e)=>{ dragging = true; scrubToClientX(e.touches[0].clientX); }, {passive:true});
scrubBar.addEventListener('touchmove', (e)=>{ if(dragging) scrubToClientX(e.touches[0].clientX); }, {passive:true});
scrubBar.addEventListener('touchend', ()=>{ dragging = false; });

document.getElementById('panel-verses').addEventListener('scroll', onPanelScroll);
document.getElementById('panel-meanings').addEventListener('scroll', onPanelScroll);
document.getElementById('panel-contents').addEventListener('scroll', onPanelScroll);

// Derive the 133 chapters directly from the loaded dataset — no separate source to keep in sync.
let chaptersMeta = [];
(function buildChaptersMeta(){
  const seen = new Set();
  KURAL_DATA.forEach((k, idx)=>{
    if(!seen.has(k.c)){
      seen.add(k.c);
      chaptersMeta[k.c - 1] = { n: k.c, en: k.ce, ta: k.ct, firstIdx: idx };
    }
  });
})();

function iyalChaptersHtml(iyal){
  const [start, end] = iyal.range;
  let html = '';
  for(let c = start; c <= end; c++){
    const meta = chaptersMeta[c - 1];
    if(!meta) continue;
    const names = langOrder === 'ta'
      ? `<span class="lang-primary lang-ta">${meta.ta}</span><span class="lang-secondary">${meta.en}</span>`
      : `<span class="lang-primary">${meta.en}</span><span class="lang-secondary lang-ta">${meta.ta}</span>`;
    html += `<div class="toc-chapter" onclick="gotoChapter(${meta.firstIdx})">
      <span class="toc-chapter-num">${meta.n}</span>
      ${names}
    </div>`;
  }
  return html;
}

function renderToc(){
  const body = document.getElementById('panel-contents');
  body.innerHTML = BOOK_INFO.map(book=>{
    const iyalsHtml = book.iyals.map(iyalId=>{
      const iyal = IYAL_INFO.find(i => i.id === iyalId);
      const iyalNames = langOrder === 'ta'
        ? `<span class="lang-primary lang-ta">${iyal.ta}</span><span class="lang-secondary">${iyal.en}</span>`
        : `<span class="lang-primary">${iyal.en}</span><span class="lang-secondary lang-ta">${iyal.ta}</span>`;
      return `<div class="toc-iyal">
        <div class="toc-iyal-head">
          ${iyalNames}
          <div class="toc-iyal-desc">${iyal.desc}</div>
        </div>
        <div class="toc-chapters">${iyalChaptersHtml(iyal)}</div>
      </div>`;
    }).join('');

    const bookNames = langOrder === 'ta'
      ? `<span class="lang-primary lang-ta">${book.ta}</span><span class="lang-secondary">${book.en}</span>`
      : `<span class="lang-primary">${book.en}</span><span class="lang-secondary lang-ta">${book.ta}</span>`;

    return `<div class="toc-book">
      <div class="toc-book-head">
        ${bookNames}
        <div class="toc-book-desc">${book.desc}</div>
      </div>
      ${iyalsHtml}
    </div>`;
  }).join('');
}

function gotoChapter(idx){
  switchTab('verses');
  scrollToIndex(idx, true);
}

      { h: `மூலம் &amp; நன்றி`, p: `திருக்குறள் மூலப்பாடம் பொதுக்களப் பயன்பாட்டில் உள்ள பாரம்பரியத் தமிழ் இலக்கியம் ஆகும். உரைகளும் மொழிபெயர்ப்புகளும் திறந்த தரவுத்தொகுப்புகளிலிருந்து பெறப்பட்டு, தெரிந்தவரை அவற்றின் மூல ஆசிரியர்களுக்கே பெருமை அளிக்கப்பட்டுள்ளது. இந்தச் செயலி மூலப்பாடத்திற்கோ உரைக்கோ எவ்வித உரிமையும் கோரவில்லை — அதைச் சுற்றி வடிவமைக்கப்பட்ட வாசிப்பு அனுபவத்திற்கு மட்டுமே.` },
      { h: `தனியுரிமை`, p: `இச்செயலி திறந்தவுடன் முழுவதுமாக இணையமின்றி இயங்குகிறது. இது எந்த இணைய வேண்டுகோளையும் அனுப்புவதில்லை, எந்தத் தரவையும் சேகரிப்பதில்லை, விளம்பரங்களும் காட்டாது. உங்கள் வாசிப்பு நிலையும் மொழி விருப்பமும் உங்கள் சாதனத்தில் மட்டுமே சேமிக்கப்படும், அது ஒருபோதும் வெளியேறாது.` },
      { h: `கருத்து`, p: `பிழை கண்டீர்களா, அல்லது ஒரு பரிந்துரை உள்ளதா? <span class="placeholder-note">[தற்காலிக இடம் — feedback@example.com]</span>` }
    ],
    credit: `குறள் தோட்டம் திட்டத்தின் ஒரு பகுதி.`
  }
};

function renderAboutBody(){
  const content = ABOUT_CONTENT[langOrder];
  document.getElementById('about-title').textContent = content.title;
  const sectionsHtml = content.sections.map(s => {
    const heading = s.h ? `<h4>${s.h}</h4>` : '';
    if(s.ul){
      return heading + `<ul>${s.ul.map(item => `<li>${item}</li>`).join('')}</ul>`;
    }
    return heading + `<p${s.tip ? ' class="about-tip"' : ''}>${s.p}</p>`;
  }).join('');
  document.getElementById('about-body').innerHTML =
    sectionsHtml + `<p class="about-credit">${content.credit}</p>`;
}

function openAbout(){
  renderAboutBody(); // always reflects the current language toggle
  document.getElementById('about-overlay').classList.add('open');
}
function closeAbout(){
  document.getElementById('about-overlay').classList.remove('open');
}
document.getElementById('about-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'about-overlay') closeAbout();
});

document.getElementById('lang-btn-ta').classList.toggle('active', langOrder === 'ta');
document.getElementById('lang-btn-en').classList.toggle('active', langOrder === 'en');

renderToc();

renderAll();

// Restore the last-read position, if any, instead of always starting at #1.
const saved = loadPosition();
if(saved){
  sharedIndex = saved.index;
  switchTab(saved.tab === 'meanings' ? 'meanings' : 'verses');
} else {
  updateScrubFromIndex(0);
}

// Make sure the very latest position is saved even if the debounce timer hasn't fired yet.
window.addEventListener('beforeunload', ()=>{
  clearTimeout(saveTimer);
  savePositionNow();
});

// Recompute offsets if the viewport changes (e.g. rotation), since font sizes are responsive.
let resizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(computeOffsets, 200);
});
</script>
