் நட்பில் நகைத்து மகிழுமாறு செய்து அத் தொடர்பு சாகுமாறு நடக்க வேண்டும்.","ex":"It is the duty of kings to affect great love but make it die (inwardly); as regard those foes who shew them great friendship but despise them (in their heart)","t1":"Mikachcheydhu Thammellu Vaarai Nakachcheydhu","t2":"Natpinul Saappullar Paatru"},{"n":830,"c":83,"ct":"கூடாநட்பு","ce":"On False Alliance","l1":"பகைநட்பாம் காலம் வருங்கால் முகநட்டு","l2":"அகநட்பு ஒரீஇ விடல்.","mv":"பகைவர் நண்பராகும் காலம் வரும் போது முகத்தளவில் நட்பு கொண்டு அகத்தில் நட்பு நீங்கி வாய்ப்புக் கிடைத்த போது அதையும் விட வேண்டும்.","ex":"When one's foes begin to affect friendship, one should love them with one's looks, and, cherishing no love in the heart, give up (even the former)","t1":"Pakainatpaam Kaalam Varungaal Mukanattu","t2":"Akanatpu Oreei Vital"},{"n":831,"c":84,"ct":"பேதைமை","ce":"On Stupidity","l1":"பேதைமை என்பதொன்று யாதெனின் ஏதங்கொண்டு","l2":"ஊதியம் போக விடல்.","mv":"பேதைமை என்று சொல்லப்படுவது யாது என்றால், தனக்கு கெடுதியானதைக் கைக் கொண்டு ஊதியமானதை கைவிடுதலாகும்.","ex":"Folly is one (of the chief defects); it is that which (makes one) incur loss and forego gain","t1":"Pedhaimai Enpadhondru Yaadhenin Edhangontu","t2":"Oodhiyam Poka Vital"},{"n":832,"c":84,"ct":"பேதைமை","ce":"On Stupidity","l1":"பேதைமையுள் எல்லாம் பேதைமை காதன்மை","l2":"கையல்ல தன்கட் செயல்.","mv":"ஒருவனுக்கு பேதைமை எல்லாவற்றிலும் மிக்க பேதைமை, தன் ஒழுக்கத்திற்குப் பொருந்தாததில் தன் விருப்பத்தை செலுத்துதல் ஆகும்.","ex":"The greatest folly is that which leads one to take delight in doing what is forbidden","t1":"Pedhaimaiyul Ellaam Pedhaimai Kaadhanmai","t2":"Kaiyalla Thankat Seyal"},{"n":833,"c":84,"ct":"பேதைமை","ce":"On Stupidity","l1":"நாணாமை நாடாமை நாரின்மை யாதொன்றும்","l2":"பேணாமை பேதை தொழில்","mv":"தகாதவற்றிற்கு நாணாமலிருத்தல், தக்கவற்றை நாடாமலிருத்தல், அன்பு இல்லாமை, நன்மை ஒன்றையும் விரும்பாமை ஆகியவை பேதையின் தொழில்கள்.","ex":"Shamelessness indifference (to what must be sought after), harshness, and aversion for everything (that ought to be desired) are the qualities of the fool","t1":"Naanaamai Naataamai Naarinmai Yaadhondrum","t2":"Penaamai Pedhai Thozhil"},{"n":834,"c":84,"ct":"பேதைமை","ce":"On Stupidity","l1":"ஓதி உணர்ந்தும் பிறர் க்குரைத்தும் தானடங்காப்","l2":"பேதையின் பேதையார் இல்.","mv":"நூல்களை ஓதியும், அவற்றின் பொருளை உணர்ந்தும், பிறர்க்கு எடுத்துச் சொல்லியும் தான் அவற்றின் நெறியில் அடங்கி ஒழுகாதப் பேதைப் போல் வேறு பேதையர் இல்லை.","ex":"There are no greater fools than he who, though he has read and understood (a great deal) and even taught it to others, does not walk according to his own teaching","t1":"Odhi Unarndhum Pirarkkuraiththum Thaanatangaap","t2":"Pedhaiyin Pedhaiyaar Il"},{"n":835,"c":84,"ct":"பேதைமை","ce":"On Stupidity","l1":"ஒருமைச் செயலாற்றும் பேதை எழுமையும்","l2":"தான்புக் கழுந்தும் அளறு.","mv":"எழுப்பிறப்பிலும் தான் புகுந்து அழுந்துவதற்கு உரிய நரகத் துன்பத்தைப் பேதைத் தன் ஒருபிறவியில் செய்து கொள்ள வல்லவனாவான்.","ex":"A fool can procure in a single birth a hell into which he may enter and suffer through all the seven births","t1":"Orumaich Cheyalaatrum Pedhai Ezhumaiyum","t2":"Thaanpuk Kazhundhum Alaru"},{"n":836,"c":84,"ct":"பேதைமை","ce":"On Stupidity","l1":"பொய்படும் ஒன்றோ புனைபூணும் கையறியாப்","l2":"பேதை வினைமேற் கொளின்.","mv":"ஒழுக்க நெறி அறியத பேதை ஒருச் செயலை மேற்கொண்டால் (அந்த செயல் முடிவுபெறாமல்) பொய்படும், அன்றியும் அவன் குற்றவாளியாகித் தளை பூணுவான்.","ex":"If the fool, who knows not how to act undertakes a work, he will (certainly) fail (But) is it all ? He will even adorn himself with fetters","t1":"Poipatum Ondro Punaipoonum Kaiyariyaap","t2":"Pedhai Vinaimer Kolin"},{"n":837,"c":84,"ct":"பேதைமை","ce":"On Stupidity","l1":"ஏதிலார் ஆரத் தமர்பசிப்பர் பேதை","l2":"பெருஞ்செல்வம் உற்றக் கடை.","mv":"பேதை பெருஞ் செல்வம் அடைந்த போது ( அவனோடு தொடர்பில்லாத) அயலார் நிறைய நன்மை பெற, அவனுடைய சுற்றத்தார் வருந்துவர்.","ex":"If a fool happens to get an immense fortune, his neighbours will enjoy it while his relations starve","t1":"Edhilaar Aarath Thamarpasippar Pedhai","t2":"Perunjelvam Utrak Katai"},{"n":838,"c":84,"ct":"பேதைமை","ce":"On Stupidity","l1":"மையல் ஒருவன் களித்தற்றால் பேதைதன்","l2":"கையொன்று உடைமை பெறின்.","mv":"பேதை தன் கையில் ஒரு பொருள் பெற்றால் (அவன் நிலைமை) பித்து பிடித்த ஒருவன் கள்குடித்து மயங்கினார் போன்றதாகும்.","ex":"A fool happening to possess something is like the intoxication of one who is (already) giddy","t1":"Maiyal Oruvan Kaliththatraal Pedhaidhan","t2":"Kaiyondru Utaimai Perin"},{"n":839,"c":84,"ct":"பேதைமை","ce":"On Stupidity","l1":"பெரிதினிது பேதையார் கேண்மை பிரிவின்கண்","l2":"பீழை தருவதொன் றில்.","mv":"பேதையிரிடமிருந்து பிரிவு நேர்ந்த போது, அப்பிரிவு துன்பம் ஒன்றும் தருவதில்லை, ஆகையால் பேதையரிடம் கொள்ளும் நட்பு மிக இனியதாகும்.","ex":"The friendship between fools is exceedingly delightful (to each other): for at parting there will be","t1":"Peridhinidhu Pedhaiyaar Kenmai Pirivinkan","t2":"Peezhai Tharuvadhon Ril"},{"n":840,"c":84,"ct":"பேதைமை","ce":"On Stupidity","l1":"கழாஅக்கால் பள்ளியுள் வைத்தற்றால் சான்றோர்","l2":"குழாஅத்துப் பேதை புகல்.","mv":"சான்றோரின் கூட்டத்தில் பேதை புகுதல், ஒருவன் தூய்மையில்லாதவற்றை மிதித்துக் கழுவாதக் காலைப் படுக்கையில் வைத்தாற் போன்றது.","ex":"The appearance of a fool in an assembly of the learned is like placing (one's) unwashed feet on a bed","t1":"Kazhaaakkaal Palliyul Vaiththatraal Saandror","t2":"Kuzhaaaththup Pedhai Pukal"},{"n":841,"c":85,"ct":"புல்லறிவாண்மை","ce":"On Ignorance","l1":"அறிவின்மை இன்மையுள் இன்மை பிறிதின்மை","l2":"இன்மையா வையா துலகு.","mv":"அறியாமையே இல்லாமைப் பலவற்றுளளும் கொடிய இல்லாமையாகும், மற்ற இல்லாமைகளை உலகம் அத்தகைய இல்லாமையாகக் கருதாது.","ex":"The want of wisdom is the greatest of all wants; but that of wealth the world will not regard as such","t1":"Arivinmai Inmaiyul Inmai Piridhinmai","t2":"Inmaiyaa Vaiyaa Thulaku"},{"n":842,"c":85,"ct":"புல்லறிவாண்மை","ce":"On Ignorance","l1":"அறிவிலான் நெஞ்சுவந்து ஈதல் பிறிதியாதும்","l2":"இல்லை பெறுவான் தவம்.","mv":"அறிவில்லாதவவன் மனம் மகிழ்ந்து ஒரு பொருளைக் கொடுத்தலுக்கு காரணம், வேறொன்றும் இல்லை, அப் பொருளைப் பெறுகின்றவனுடைய நல்வினையே ஆகும்.","ex":"(The cause of) a fool cheerfully giving (something) is nothing else but the receiver's merit (in a former birth)","t1":"Arivilaan Nenjuvandhu Eedhal Piridhiyaadhum","t2":"Illai Peruvaan Thavam"},{"n":843,"c":85,"ct":"புல்லறிவாண்மை","ce":"On Ignorance","l1":"அறிவிலார் தாந்தம்மைப் பீழிக்கும் பீழை","l2":"செறுவார்க்கும் செய்தல் அரிது.","mv":"அறிவில்லாதவர் தம்மைத்தாமே துன்புறுத்தும் துன்பம் அவருடைய பகைவர்க்கும் செய்யமுடியாத அளவினதாகும்.","ex":"The suffering that fools inflict upon themselves is hardly possible even to foes","t1":"Arivilaar Thaandhammaip Peezhikkum Peezhai","t2":"Seruvaarkkum Seydhal Aridhu"},{"n":844,"c":85,"ct":"புல்லறிவாண்மை","ce":"On Ignorance","l1":"வெண்மை எனப்படுவ தியாதெனின் ஒண்மை","l2":"உடையம்யாம் என்னும் செருக்கு.","mv":"புல்லறிவு என்று சொல்லப்படுவது யாது என்றால் யாம் அறிவுடையேம் என்று ஒருவன் தன்னைத்தான் மதித்துகொள்ளும் செருக்காகும்.","ex":"What is called want of wisdom is the vanity which says, \"We are wise\"","t1":"Venmai Enappatuva Thiyaadhenin Onmai","t2":"Utaiyamyaam Ennum Serukku"},{"n":845,"c":85,"ct":"புல்லறிவாண்மை","ce":"On Ignorance","l1":"கல்லாத மேற்கொண் டொழுகல் கசடற","l2":"வல்லதூஉம் ஐயம் தரும்.","mv":"அறிவில்லாதவர் தாம் கற்காத நூல்களை கற்றவர் போல் மேற்கொண்டு நடத்தல், அவர் குற்றமறக் கற்றுவல்ல பொருளைப் பற்றியும் மற்றவர்க்கு ஐயம் உண்டாகும்.","ex":"Fools pretending to know what has not been read (by them) will rouse suspicion even as to what they have thoroughly mastered","t1":"Kallaadha Merkon Tozhukal Kasatara","t2":"Valladhooum Aiyam Tharum"},{"n":846,"c":85,"ct":"புல்லறிவாண்மை","ce":"On Ignorance","l1":"அற்றம் மறைத்தலோ புல்லறிவு தம்வயின்","l2":"குற்றம் மறையா வழி.","mv":"தம்மிடத்தில் உள்ளக் குற்றத்தை அறிந்து நீக்காத போது , உடம்பில் மறைப்பதற்குரிய பகுதியை மட்டும், ஆடையால் மறைத்தல் புல்லறிவாகும்.","ex":"Even to cover one's nakedness would be folly, if (one's) faults were not covered (by forsaking them)","t1":"Atram Maraiththalo Pullarivu Thamvayin","t2":"Kutram Maraiyaa Vazhi"},{"n":847,"c":85,"ct":"புல்லறிவாண்மை","ce":"On Ignorance","l1":"அருமறை சோரும் அறிவிலான் செய்யும்","l2":"பெருமிறை தானே தனக்கு.","mv":"அரிய மறைபொருளை மனத்தில் வைத்துக் காக்காமல் சேர்த்தும் வெளிபடுத்தும் அறிவில்லாதவன் தனக்குத் தானே பெருந்தீங்கு செய்து கொள்வான்.","ex":"The fool who neglects precious counsel does, of his own accord, a great injury to himself","t1":"Arumarai Sorum Arivilaan Seyyum","t2":"Perumirai Thaane Thanakku"},{"n":848,"c":85,"ct":"புல்லறிவாண்மை","ce":"On Ignorance","l1":"ஏவவும் செய்கலான் தான்தேறான் அவ்வுயிர்","l2":"போஒம் அளவுமோர் நோய்.","mv":"தனக்கு நன்மையானவற்றை பிறர் ஏவினாலும் செய்யாதவனாய், தானாகவும் உணர்ந்து தெளியாதவனாய் உள்ளவனுடைய உயிர் போகுமளவும் ஒரு நோயாகும்.","ex":"The fool will not perform (his duties) even when advised nor ascertain them himself; such a soul is a","t1":"Evavum Seykalaan Thaandheraan Avvuyir","t2":"Poom Alavumor Noi"},{"n":849,"c":85,"ct":"புல்லறிவாண்மை","ce":"On Ignorance","l1":"காணாதான் காட்டுவான் தான்காணான் காணாதான்","l2":"கண்டானாம் தான்கண்ட வாறு.","mv":"அறிவு இல்லாதவனுக்கு அறிவிப்பவன் தானே அறிவில்லாதவனாய் நிற்பான், அறிவு இல்லாதவனோ தான் அறிந்த வகையால் அறிவுடையவனாகத் தோன்றுவான்.","ex":"One who would teach a fool will (simply) betray his folly; and the fool would (still) think himself \"wise in his own conceit\"","t1":"Kaanaadhaan Kaattuvaan Thaankaanaan Kaanaadhaan","t2":"Kantaanaam Thaankanta Vaaru"},{"n":850,"c":85,"ct":"புல்லறிவாண்மை","ce":"On Ignorance","l1":"உலகத்தார் உண்டென்பது இல்லென்பான் வையத்து","l2":"அலகையா வைக்கப் படும்.","mv":"உலகத்தார் உண்டு என்று சொல்வதை இல்லை என்று கூறுகின்ற ஒருவன், உலகத்தில் காணப்படும் ஒரு பேயாகக் கருதி விலக்கப்படுவான்.","ex":"He who denies the existence of what the world believes in will be regarded as a demon on earth","t1":"Ulakaththaar Untenpadhu Illenpaan Vaiyaththu","t2":"Alakaiyaa Vaikkap Patum"},{"n":851,"c":86,"ct":"இகல்","ce":"On Discord","l1":"இகலென்ப எல்லா உயிர்க்கும் பகலென்னும்","l2":"பண்பின்மை பார஧க்கும் நோய்.","mv":"எல்லா உயிர்களுக்கும் மற்ற உயிர்களோடு பொருந்தாமல் வேறுபடுதலாகிய தீயப் பண்பை வளர்க்கும் நோய் இகழ் (மாறுபாடு) என்று சொல்வர் அறிஞர்.","ex":"The disease which fosters the evil of disunion among all creatures is termed hatred by the wise","t1":"Ikalenpa Ellaa Uyirkkum Pakalennum","t2":"Panpinmai Paarikkum Noi"},{"n":852,"c":86,"ct":"இகல்","ce":"On Discord","l1":"பகல்கருதிப் பற்றா செயினும் இகல்கருதி","l2":"இன்னாசெய் யாமை தலை.","mv":"ஒருவன் தன்னோடு பொருந்தாமல் வேறுபடுதலைக் கருதி அன்பில்லாதவற்றைச் செய்தாலும் தான் இகழ் கொண்டு அவர்க்கு துன்பம் செய்யாதிருத்தல் சிறந்ததாகும்.","ex":"Though disagreeable things may be done from (a feeling of) disunion, it is far better that nothing painful be done from (that of) hatred","t1":"Pakalkarudhip Patraa Seyinum Ikalkarudhi","t2":"Innaasey Yaamai Thalai"},{"n":853,"c":86,"ct":"இகல்","ce":"On Discord","l1":"இகலென்னும் எவ்வநோய் நீக்கின் தவலில்லாத்","l2":"தாவில் விளக்கம் தரும்.","mv":"ஒருவன் இகல் என்று சொல்லப்படும் துன்ப நோயை நீக்கி விட்டால் அஃது அவனுக்கு அழிவில்லாத நிலையான புகழைக் கொடுக்கும்.","ex":"To rid one-self of the distressing dtsease of hatred will bestow (on one) a never-decreasing imperishable fame","t1":"Ikalennum Evvanoi Neekkin Thavalillaath","t2":"Thaavil Vilakkam Tharum"},{"n":854,"c":86,"ct":"இகல்","ce":"On Discord","l1":"இன்பத்துள் இன்பம் பயக்கும் இகலென்னும்","l2":"துன்பத்துள் துன்பங் கெடின்.","mv":"இகல் என்று சொல்லப்படும் துன்பங்களில் கொடிய துன்பம் கெட்டுவிட்டால், அஃது அவனுக்கு இன்பங்களில் சிறந்த இன்பத்தை கொடுக்கும்.","ex":"If hatred which is the greatest misery is destroyed, it will yield the greatest delight","t1":"Inpaththul Inpam Payakkum Ikalennum","t2":"Thunpaththul Thunpang Ketin"},{"n":855,"c":86,"ct":"இகல்","ce":"On Discord","l1":"இகலெதிர் சாய்ந்தொழுக வல்லாரை யாரே","l2":"மிக்லூக்கும் தன்மை யவர்.","mv":"இகலை எதிர்த்து நிற்காமல் அதன் எதிரே சாய்ந்து நடக்க வல்லவரை வெல்லக் கருதுகின்ற ஆற்றல் உடையவர் யார்.","ex":"Who indeed would think of conquering those who naturally shrink back from hatred ?","t1":"Ikaledhir Saaindhozhuka Vallaarai Yaare","t2":"Mikalookkum Thanmai Yavar"},{"n":856,"c":86,"ct":"இகல்","ce":"On Discord","l1":"இகலின் மிகலினிது என்பவன் வாழ்க்கை","l2":"தவலும் கெடலும் நணித்து.","mv":"இகல் கொள்வதால் வெல்லுதல் இனியது என்று கருதுகின்றவனுடைய வாழ்க்கை தவறிபோதலும் அழிதலும் விரைவவில் உள்ளனவாம்.","ex":"Failure and ruin are not far from him who says it is sweet to excel in hatred","t1":"Ikalin Mikalinidhu Enpavan Vaazhkkai","t2":"Thavalum Ketalum Naniththu"},{"n":857,"c":86,"ct":"இகல்","ce":"On Discord","l1":"மிகல்மேவல் மெய்ப்பொருள் காணார் இகல்மேவல்","l2":"இன்னா அறிவி னவர்.","mv":"இகலை விரும்புகின்ற தீய அறிவை உடையவர் வெற்றி பொருந்துதலுக்குக் காரணமான உண்மைப் பொருளை அறியமாட்டார்.","ex":"Who only know to work men woe, fulfilled of enmity","t1":"Mikalmeval Meypporul Kaanaar Ikalmeval","t2":"Innaa Arivi Navar"},{"n":858,"c":86,"ct":"இகல்","ce":"On Discord","l1":"இகலிற்கு எதிர்சாய்தல் ஆக்கம் அதனை","l2":"மிக்லூக்கின் ஊக்குமாம் கேடு.","mv":"இகலுக்கு எதிரே சாய்ந்து நடத்தல் ஒருவனுக்கு ஆக்கமாகும், அதனை எதிர்த்து வெல்லக்கருதினால் கேடு அவனிடம் வரக் கருதும்.","ex":"Shrinking back from hatred will yield wealth; indulging in its increase will hasten ruin","t1":"Ikalirku Edhirsaaidhal Aakkam Adhanai","t2":"Mikalookkin Ookkumaam Ketu"},{"n":859,"c":86,"ct":"இகல்","ce":"On Discord","l1":"இகல்காணான் ஆக்கம் வருங்கால் அதனை","l2":"மிகல்காணும் கேடு தரற்கு.","mv":"ஒருவன் தனக்கு ஆக்கம் வரும்போது இகலைக் கருதமாட்டான், தனக்கு கேடு தருவிக்கொள்ளும் போது அதனை எதிர்த்து வெல்லக் கருதுவான்.","ex":"At the approach of wealth one will not think of hatred (but) to secure one's ruin, one will look to its increase","t1":"Ikalkaanaan Aakkam Varungaal Adhanai","t2":"Mikalkaanum Ketu Thararku"},{"n":860,"c":86,"ct":"இகல்","ce":"On Discord","l1":"இகலானாம் இன்னாத எல்லாம் நகலானாம்","l2":"நன்னயம் என்னும் செருக்கு.","mv":"ஒருவனுக்கு இகலால் துன்பமானவை எல்லாம் உண்டாகும்,அதற்கு மாறான நட்பால் நல்ல நீதியாகிய பெருமித நிலை உண்டாகும்.","ex":"All calamities are caused by hatred; but by the delight (of friendship) is caused the great wealth of good virtues","t1":"Ikalaanaam Innaadha Ellaam Nakalaanaam","t2":"Nannayam Ennum Serukku"},{"n":861,"c":87,"ct":"பகைமாட்சி","ce":"On Enmity","l1":"வலியார்க்கு மாறேற்றல் ஓம்புக ஓம்பா","l2":"மெலியார்மேல் மேக பகை.","mv":"தம்மை விட வலியவர்க்கு மாறுபட்டு எதிர்த்தலை விட வேண்டும், தம்மை விட மெலியவர் மேல் பகைக் கொள்வதை விடாமல் விரும்பி மேற்கொள்ள வேண்டும்.","ex":"Avoid offering resistance to the strong; (but) never fail to cherish enmity towards the weak","t1":"Valiyaarkku Maaretral Ompuka Ompaa","t2":"Meliyaarmel Meka Pakai"},{"n":862,"c":87,"ct":"பகைமாட்சி","ce":"On Enmity","l1":"அன்பிலன் ஆன்ற துணையிலன் தான்துவ்வான்","l2":"என்பரியும் ஏதிலான் துப்பு.","mv":"ஒருவன் அன்பு இல்லாதவனாய், அமைந்த துணை இல்லாதடனாய், தானும் வலிமை இல்லாதவனாய் இருந்தால், அவன் பகைவனுடைய வலிமையை எவ்வாறு ஒழிக்க முடியும்.","ex":"How can he who is unloving, destitute of powerful aids, and himself without strength overcome the might of his foe ?","t1":"Anpilan Aandra Thunaiyilan Thaandhuvvaan","t2":"Enpariyum Edhilaan Thuppu"},{"n":863,"c":87,"ct":"பகைமாட்சி","ce":"On Enmity","l1":"அஞ்சும் அறியான் அமைவிலன் ஈகலான்","l2":"தஞ்சம் எளியன் பகைக்கு.","mv":"ஒருவன் அஞ்சுகின்றவனாய், அறிவு இல்லாதவனாய், பொருந்தும் பண்பு இல்லாதவனாய், பிறர்க்கு ஒன்று ஈயாதவனாய் இருந்தால் , அவன் பகைவர்க்கு மிக எளியவன்.","ex":"In the estimation of foes miserably weak is he, who is timid, ignorant, unsociable and niggardly","t1":"Anjum Ariyaan Amaivilan Eekalaan","t2":"Thanjam Eliyan Pakaikku"},{"n":864,"c":87,"ct":"பகைமாட்சி","ce":"On Enmity","l1":"நீங்கான் வெகுளி நிறையிலன் எஞ்ஞான்றும்","l2":"யாங்கணும் யார்க்கும் எளிது.","mv":"ஒருவன் சினம் நீங்காதவனாய், நெஞ்சத்தை நிறுத்தியாளும் தன்மை இல்லாதவனாய் இருந்தால் அவன் எக்காலத்திலும் எவ்விடத்திலும் எவர்க்கும் எளியவன்.","ex":"He who neither refrains from anger nor keeps his secrets will at all times and in all places be easily conquered by all","t1":"Neengaan Vekuli Niraiyilan Egngnaandrum","t2":"Yaanganum Yaarkkum Elidhu"},{"n":865,"c":87,"ct":"பகைமாட்சி","ce":"On Enmity","l1":"வழிநோக்கான் வாய்ப்பன செய்யான் பழிநோக்கான்","l2":"பண்பிலன் பற்றார்க்கு இனிது.","mv":"ஒருவன் நல்வழியை நோக்காமல் பொருத்தமானவற்றைச் செய்யாமல், பழியையும் பார்க்காமல், நற்பண்பும் இல்லாமல் இருந்தால் அவன் பகைவர்க்கும் எளியனவான்.","ex":"(A) pleasing (object) to his foes is he who reads not moral works, does nothing that is enjoined by them cares not for reproach and is not possessed of good qualities","t1":"Vazhinokkaan Vaaippana Seyyaan Pazhinokkaan","t2":"Panpilan Patraarkku Inidhu"},{"n":866,"c":87,"ct":"பகைமாட்சி","ce":"On Enmity","l1":"காணாச் சினத்தான் கழிபெருங் காமத்தான்","l2":"பேணாமை பேணப் படும்.","mv":"ஒருவன் உண்மை காணாத சினம் உடையவனாய், மிகப் பெரிய ஆசை உடையவனாய் இருந்தால் அவனுடைய பகை விரும்பி மேற்கொள்ளப்படும்.","ex":"Highly to be desired is the hatred of him whose anger is blind, and whose lust increases beyond measure","t1":"Kaanaach Chinaththaan Kazhiperung Kaamaththaan","t2":"Penaamai Penap Patum"},{"n":867,"c":87,"ct":"பகைமாட்சி","ce":"On Enmity","l1":"கொடுத்தும் கொளல்வேண்டும் மன்ற அடுத்திருந்து","l2":"மாணாத செய்வான் பகை.","mv":"தன்னை அடுத்துத் தன்னோடிருந்தும் பொருந்தாதவற்றைச் செய்பவனுடைய பகையைப் பொருள் கொடுத்தாவது கொள்ள வேண்டும்.","ex":"It is indeed necessary to obtain even by purchase the hatred of him who having begun (a work) does what is not conductive (to its accomplishment)","t1":"Kotuththum Kolalventum Mandra Atuththirundhu","t2":"Maanaadha Seyvaan Pakai"},{"n":868,"c":87,"ct":"பகைமாட்சி","ce":"On Enmity","l1":"குணனிலனாய்க் குற்றம் பலவாயின் மாற்றார்க்கு","l2":"இனனிலனாம் ஏமாப் புடைத்து.","mv":"ஒருவன் குணம் இல்லாதவனாய், குற்றம் பல உடையவனானால் அவன் துணை இல்லாதவன் ஆவான், அந்நிலைமையே அவனுடைய பகைவர்க்கு நன்மையாகும்.","ex":"He will become friendless who is without (any good) qualities and whose faults are many; (such a character) is a help to (his) foes","t1":"Kunanilanaaik Kutram Palavaayin Maatraarkku","t2":"Inanilanaam Emaap Putaiththu"},{"n":869,"c":87,"ct":"பகைமாட்சி","ce":"On Enmity","l1":"செறுவார்க்குச் சேணிகவா இன்பம் அறிவிலா","l2":"அஞ்சும் பகைவர்ப் பெறின்.","mv":"அறிவு இல்லாத அஞ்சும் இயல்புடைய பகைவரைப் பெற்றால், அவரை எதிர்த்து பகை கொள்பவர்க்கு இன்பங்கள் தொலைவில் நீங்காமல் இருக்கும்.","ex":"There will be no end of lofty delights to the victorious, if their foes are (both) ignorant and timid","t1":"Seruvaarkkuch Chenikavaa Inpam Arivilaa","t2":"Anjum Pakaivarp Perin"},{"n":870,"c":87,"ct":"பகைமாட்சி","ce":"On Enmity","l1":"கல்லான் வெகுளும் சிறுபொருள் எஞ்ஞான்றும்","l2":"ஒல்லானை ஒல்லா தொளி.","mv":"கல்வி கற்காதவனைப் பகைத்துக்கொள்ளும் எளிய செயலைச் செய்ய இயலாத ஒருவனிடம் எக்காலத்திலும் புகழ் வந்து பொருந்தாது.","ex":"The light (of fame) will never be gained by him who gains not the trifling reputation of having fought an unlearned (foe)","t1":"Kallaan Vekulum Siruporul Egngnaandrum","t2":"Ollaanai Ollaa Tholi"},{"n":871,"c":88,"ct":"பகைத்திறந்தெரிதல்","ce":"On Knowing the Enemy's Strength","l1":"பகைஎன்னும் பண்பி லதனை ஒருவன்","l2":"நகையேயும் வேண்டற்பாற்று அன்று.","mv":"பகை என்று சொல்லப்படும் பண்பு இல்லாத தீமையை ஒருவன் சிறிதும் பொழுது போக்கும் விளையாட்டாகவும் விரும்புதலாகாது.","ex":"The evil of hatred is not of a nature to be desired by one even in sport","t1":"Pakaiennum Panpi Ladhanai Oruvan","t2":"Nakaiyeyum Ventarpaatru Andru"},{"n":872,"c":88,"ct":"பகைத்திறந்தெரிதல்","ce":"On Knowing the Enemy's Strength","l1":"வில்லேர் உழவர் பகைகொளினும் கொள்ளற்க","l2":"சொல்லேர் உழவர் பகை.","mv":"வில்லை ஏராக உடைய உழவராகிய வீரருடன் பகை கொண்ட போதிலும், சொல்லை ஏராக உடைய உழவராகிய அறிஞருடன் பகை கொள்ளக் கூடாது.","ex":"Though you may incur the hatred of warriors whose ploughs are bows, incur not that of ministers whose ploughs are words","t1":"Viller Uzhavar Pakaikolinum Kollarka","t2":"Soller Uzhavar Pakai"},{"n":873,"c":88,"ct":"பகைத்திறந்தெரிதல்","ce":"On Knowing the Enemy's Strength","l1":"ஏமுற் றவரினும் ஏழை தமியனாய்ப்","l2":"பல்லார் பகைகொள் பவன்.","mv":"தான் தனியாக இருந்து பலருடைய பகையைத் தேடிக் கொள்பவன், பித்துப் பிடித்தாரை விட அறிவில்லாதவனாகக் கருதப்படுவான்.","ex":"He who being alone, incurs the hatred of many is more infatuated than even mad men","t1":"Emur Ravarinum Ezhai Thamiyanaaip","t2":"Pallaar Pakaikol Pavan"},{"n":874,"c":88,"ct":"பகைத்திறந்தெரிதல்","ce":"On Knowing the Enemy's Strength","l1":"பகைநட்பாக் கொண்டொழுகும் பண்புடை யாளன்","l2":"தகைமைக்கண் தங்கிற்று உலகு.","mv":"பகையையும் நட்பாக செய்து கொண்டு நடக்கும், பண்புடையவனது பெருந்தன்மையில் உலகம் தங்கியிருப்பதாகும்.","ex":"Whose worthy rule can change his foes to friends","t1":"Pakainatpaak Kontozhukum Panputai Yaalan","t2":"Thakaimaikkan Thangitru Ulaku"},{"n":875,"c":88,"ct":"பகைத்திறந்தெரிதல்","ce":"On Knowing the Enemy's Strength","l1":"தன்துணை இன்றால் பகையிரண்டால் தான்ஒருவன்","l2":"இன்துணையாக் கொள்கவற்றின் ஒன்று.","mv":"தனக்கு உதவியான துணையே இல்லை, பகையே இரண்டு, தானே ஒருவன் இந் நிலையில் அப் பகைகளில் ஒன்றை இனியத் துணையாகக் கொள்ள வேண்டும்.","ex":"He who is alone and helpless while his foes are two should secure one of them as an agreeable help (to himself)","t1":"Thandhunai Indraal Pakaiyirantaal Thaanoruvan","t2":"Indhunaiyaak Kolkavatrin Ondru"},{"n":876,"c":88,"ct":"பகைத்திறந்தெரிதல்","ce":"On Knowing the Enemy's Strength","l1":"தேற஧னும் தேறா விடினும் அழிவின்கண்","l2":"தேறான் பகாஅன் விடல்.","mv":"இதற்கு முன் ஒருவனைப் பற்றி ஆராய்ந்து தெளிந்திருந்தாலும், தெளியாவிட்டாலும் அழிவு வந்த காலத்தில் அவனைத் தெளியாமலும் நீங்காமலும் வாளாவிட வேண்டும்.","ex":"Though (one's foe is) aware or not of one's misfortune one should act so as neither to join nor separate (from him)","t1":"Thera�num Theraa Vitinum Azhivinkan","t2":"Theraan Pakaaan Vital"},{"n":877,"c":88,"ct":"பகைத்திறந்தெரிதல்","ce":"On Knowing the Enemy's Strength","l1":"நோவற்க நொந்தது அறியார்க்கு மேவற்க","l2":"மென்மை பகைவர் அகத்து.","mv":"துன்புற்றதைத் தாமாகவே அறியாத நண்பர்க்குத் துன்பத்தைச் சொல்லக் கூடாது, பகைவரிடத்தில் மென்மை மேற்கொள்ளக் கூடாது.","ex":"Relate not your suffering even to friends who are ignorant of it, nor refer to your weakness in the presence of your foes","t1":"Novarka Nondhadhu Ariyaarkku Mevarka","t2":"Menmai Pakaivar Akaththu"},{"n":878,"c":88,"ct":"பகைத்திறந்தெரிதல்","ce":"On Knowing the Enemy's Strength","l1":"வகையறிந்து தற்செய்து தற்காப்ப மாயும்","l2":"பகைவர்கண் பட்ட செருக்கு.","mv":"செய்யும் வகையை அறிந்து தன்னை வலிமைப்படுத்திக் கொண்டு தற்காப்புத் தேடிக் கொண்டால், பகைவரிடத்தில் ஏற்பட்ட செருக்குத் தானாவே அழியும்.","ex":"The joy of one's foes will be destroyed if one guards oneself by knowing the way (of acting) and securing assistance","t1":"Vakaiyarindhu Tharseydhu Tharkaappa Maayum","t2":"Pakaivarkan Patta Serukku"},{"n":879,"c":88,"ct":"பகைத்திறந்தெரிதல்","ce":"On Knowing the Enemy's Strength","l1":"இளைதாக முள்மரம் கொல்க களையுநர்","l2":"கைகொல்லும் காழ்த்த இடத்து.","mv":"முள் மரத்தை இளையதாக இருக்கும் போதே வெட்ட வேண்டும், காழ்ப்பு ஏறி முதிர்ந்த போது வெட்டுகின்றவரின் கையை அது வருத்தும்.","ex":"A thorny tree should be felled while young, (for) when it is grown it will destroy the hand of the feller","t1":"Ilaidhaaka Mulmaram Kolka Kalaiyunar","t2":"Kaikollum Kaazhththa Itaththu"},{"n":880,"c":88,"ct":"பகைத்திறந்தெரிதல்","ce":"On Knowing the Enemy's Strength","l1":"உயிர்ப்ப உளரல்லர் மன்ற செயிர்ப்பவர்","l2":"செம்மல் சிதைக்கலா தார்.","mv":"பகைத்தவருடையத் தலைமையைக் கொடுக்க முடியாதவர் திண்ணமாக மூச்சு விடும் அளவிற்கும் உயிரோடு வாழ்கின்றவர் அல்லர்.","ex":"Those who do not destroy the pride of those who hate (them) will certainly not exist even to breathe","t1":"Uyirppa Ularallar Mandra Seyirppavar","t2":"Semmal Sidhaikkalaa Thaar"},{"n":881,"c":89,"ct":"உட்பகை","ce":"Internal Foes","l1":"நிழல்நீரும் இன்னாத இன்னா தமர்நீரும்","l2":"இன்னாவாம் இன்னா செயின்.","mv":"இன்பம் தரும் நிழலும் நீரும் நோய் செய்வனவாக இருந்தால் தீயனவே ஆகும், அதுபோலவே சுற்றத்தாறின் தன்மைகளும் துன்பம் தருவானால் தீயனவே ஆகும்.","ex":"Shade and water are not pleasant, (if) they cause disease; so are the qualities of (one's) relations not agreeable, (if) they cause pain","t1":"Nizhalneerum Innaadha Innaa Thamarneerum","t2":"Innaavaam Innaa Seyin"},{"n":882,"c":89,"ct":"உட்பகை","ce":"Internal Foes","l1":"வாள்போல பகைவரை அஞ்சற்க அஞ்சுக","l2":"கேள்போல் பகைவர் தொடர்பு.","mv":"வாளைப்போல் வெளிப்படையான பகைவர்க்கு அஞ்ச வேண்டியதில்லை, ஆனால் உறவினரைப் போல் இருந்து உட்பகை கொண்டவரின் தொடர்புக்கு அஞ்ச வேண்டும்.","ex":"Fear not foes (who say they would cut) like a sword; (but) fear the friendship of foes (who seemingly","t1":"Vaalpola Pakaivarai Anjarka Anjuka","t2":"Kelpol Pakaivar Thotarpu"},{"n":883,"c":89,"ct":"உட்பகை","ce":"Internal Foes","l1":"உட்பகை அஞ்சித்தற் காக்க உலைவிடத்து","l2":"மட்பகையின் மாணத் தெறும்.","mv":"உட்பகைக்கு அஞ்சி ஒருவன் தன்னைக் காத்துக்கொள்ள வேண்டும், தளர்ச்சி வந்த போது மட்கலத்தை அறுக்கும் கருவி போல் அந்த உட்பகை தவறாமல் அழிவு செய்யும்.","ex":"Fear internal enmity and guard yourself; (if not) it will destroy (you) in an evil hour, as surely as the tool which cuts the potter's clay","t1":"Utpakai Anjiththar Kaakka Ulaivitaththu","t2":"Matpakaiyin Maanath Therum"},{"n":884,"c":89,"ct":"உட்பகை","ce":"Internal Foes","l1":"மனமாணா உட்பகை தோன்றின் இனமாணா","l2":"ஏதம் பலவும் தரும்.","mv":"மனம் திறந்தாத உட்பகை ஒருவனுக்கு உண்டாகுமானால், அது அவனுக்குச் சுற்றம் சிர்படாமைக்கு காரணமான குற்றம் பலவற்றைத் தரும்.","ex":"The secret enmity of a person whose mind in unreformed will lead to many evils causing disaffection among (one's) relations","t1":"Manamaanaa Utpakai Thondrin Inamaanaa","t2":"Edham Palavum Tharum"},{"n":885,"c":89,"ct":"உட்பகை","ce":"Internal Foes","l1":"உறல்முறையான் உட்பகை தோன்றின் இறல்முறையான்","l2":"ஏதம் பலவும் தரும்.","mv":"உறவுமுறையோடு உட்பகை உண்டாகுமானால், அது ஒருவனுக்கு இறக்கும் வகையான துன்பம் பலவற்றையும் கொடுக்கும்.","ex":"If there appears internal hatred in a (king's) family; it will lead to many a fatal crime","t1":"Uralmuraiyaan Utpakai Thondrin Iralmuraiyaan","t2":"Edham Palavum Tharum"},{"n":886,"c":89,"ct":"உட்பகை","ce":"Internal Foes","l1":"ஒன்றாமை ஒன்றியார் கட்படின் எஞ்ஞான்றும்","l2":"பொன்றாமை ஒன்றல் அரிது.","mv":"ஒருவனுடைய உற்றாரிடத்தில் பகைமை ஏற்படுமானால், அந்த உட்பகையால் அவன் அழியாமலிருத்தல் எப்போதும் அரிது.","ex":"If hatred arises among (one's) own people, it will be hardly possible (for one) to escape death","t1":"Ondraamai Ondriyaar Katpatin Egngnaandrum","t2":"Pondraamai Ondral Aridhu"},{"n":887,"c":89,"ct":"உட்பகை","ce":"Internal Foes","l1":"செப்பின் புணர்ச்சிபோல் கூடினும் கூடாதே","l2":"உட்பகை உற்ற குடி.","mv":"செப்பின் இணைப்பைப் போல புறத்தே பொருந்தி இருந்தாலும், உட்பகை உண்டான குடியில் உள்ளவர் அகத்தே பொருந்தி இருக்கமாட்டார்.","ex":"Never indeed will a family subject to internal hatred unite (really) though it may present an apparent union like that of a casket and its lid","t1":"Seppin Punarchchipol Kootinum Kootaadhe","t2":"Utpakai Utra Kuti"},{"n":888,"c":89,"ct":"உட்பகை","ce":"Internal Foes","l1":"அரம்பொருத பொன்போலத் தேயும் உரம்பொருது","l2":"உட்பகை உற்ற குடி.","mv":"உட்பகை உண்டான குடி அரத்தினால் தேய்க்கப் பட்ட இரும்பு போல் வலிமை குறைக்கப் பட்டு தேய்ந்து போகும்.","ex":"A family subject to internal hatred will wear out and lose its strength like iron that has been filed away","t1":"Aramporudha Ponpolath Theyum Uramporudhu","t2":"Utpakai Utra Kuti"},{"n":889,"c":89,"ct":"உட்பகை","ce":"Internal Foes","l1":"எட்பக வன்ன சிறுமைத்தே ஆயினும்","l2":"உட்பகை உள்ளதாங் கேடு.","mv":"எள்ளின் பிளவைப் போன்ற சிறிய அளவு உடையதே ஆனாலும், ஒரு குடியை அழிக்கவல்ல கேடு உட்பகையில் உள்ளதாகும்.","ex":"Although internal hatred be as small as the fragment of the sesamum (seed), still does destruction dwell in it","t1":"Etpaka Vanna Sirumaiththe Aayinum","t2":"Utpakai Ulladhaang Ketu"},{"n":890,"c":89,"ct":"உட்பகை","ce":"Internal Foes","l1":"உடம்பாடு இலாதவர் வாழ்க்கை குடங்கருள்","l2":"பாம்போடு உடனுறைந் தற்று.","mv":"அகத்தில் உடண்பாடு இல்லாதவருடன் குடிவாழும் வாழ்க்கை, ஒரு குடிசையிற் பாம்போடு உடன்வாழ்ந்தாற் போன்றது.","ex":"Living with those who do not agree (with one) is like dwelling with a cobra (in the same) hut","t1":"Utampaatu Ilaadhavar Vaazhkkai Kutangarul","t2":"Paampotu Utanurain Thatru"},{"n":891,"c":90,"ct":"பெரியாரைப் பிழையாமை","ce":"Not Censuring the Great","l1":"ஆற்றுவார் ஆற்றல் இகழாமை போற்றுவார்","l2":"போற்றலுள் எல்லாம் தலை.","mv":"மேற்கொண்ட செயலைச் செய்து முடிக்க வல்லவரின் ஆற்றலை இகழாதிருத்தல், காப்பவர் செய்து கொள்ளும் காவல் எல்லாவற்றிலும் சிறந்தது.","ex":"Not to disregard the power of those who can carry out (their wishes) is more important than all the watchfulness of those who guard (themselves against evil)","t1":"Aatruvaar Aatral Ikazhaamai Potruvaar","t2":"Potralul Ellaam Thalai"},{"n":892,"c":90,"ct":"பெரியாரைப் பிழையாமை","ce":"Not Censuring the Great","l1":"பெரியாரைப் பேணாது ஒழுகிற் பெரியாரால்","l2":"பேரா இடும்பை தரும்.","mv":"ஆற்றல் மிகுந்த பெரியாரை விரும்பி மதிக்காமல் நடந்தால், அது அப் பெரியாரால் நீங்காத துன்பத்தைத் தருவதாகும்.","ex":"To behave without respect for the great (rulers) will make them do (us) irremediable evils","t1":"Periyaaraip Penaadhu Ozhukir Periyaaraal","t2":"Peraa Itumpai Tharum"},{"n":893,"c":90,"ct":"பெரியாரைப் பிழையாமை","ce":"Not Censuring the Great","l1":"கெடல்வேண்டின் கேளாது செய்க அடல்வேண்டின்","l2":"ஆற்று பவர்கண் இழுக்கு.","mv":"அழிக்க வேண்டுமானால் அவ்வாறே செய்து முடிக்க வல்லவரிடத்தில் தவறு செய்தலை, ஒருவன் கெட வேண்டுமானால் கேளாமலேச் செய்யலாம்.","ex":"If a person desires ruin, let him not listen to the righteous dictates of law, but commit crimes against those who are able to slay (other sovereigns)","t1":"Ketalventin Kelaadhu Seyka Atalventin","t2":"Aatru Pavarkan Izhukku"},{"n":894,"c":90,"ct":"பெரியாரைப் பிழையாமை","ce":"Not Censuring the Great","l1":"கூற்றத்தைக் கையால் விளித்தற்றால் ஆற்றுவார்க்கு","l2":"ஆற்றாதார் இன்னா செயல்.","mv":"ஆற்றல் உடையவர்க்கு ஆற்றல் இல்லாதவர் தீமை செய்தல், தானே வந்து அழிக்க வல்ல எமனைக் கைகாட்டி அழைத்தாற் போன்றது.","ex":"The weak doing evil to the strong is like beckoning Yama to come (and destroy them)","t1":"Kootraththaik Kaiyaal Viliththatraal Aatruvaarkku","t2":"Aatraadhaar Innaa Seyal"},{"n":895,"c":90,"ct":"பெரியாரைப் பிழையாமை","ce":"Not Censuring the Great","l1":"யாண்டுச் சென்று யாண்டும் உளராகார் வெந்துப்பின்","l2":"வேந்து செறப்பட் டவர்.","mv":"மிக்க வலிமை உள்ள அரசனால் வெகுளப்பட்டவர், அவனிடமிருந்து தப்புவதற்க்காக எங்கே சென்றாலும் எங்கும் வாழ முடியாது.","ex":"Those who have incurred the wrath of a cruel and mighty potentate will not prosper wherever they may go","t1":"Yaantuch Chendru Yaantum Ularaakaar","t2":"Vendhuppin Vendhu Serappat Tavar"},{"n":896,"c":90,"ct":"பெரியாரைப் பிழையாமை","ce":"Not Censuring the Great","l1":"எரியால் சுடப்படினும் உய்வுண்டாம் உய்யார்","l2":"பெரியார்ப் பிழைத்தொழுகு வார்.","mv":"தீயால் சுடப்பட்டாலும் ஒருகால் உயிர் பிழைத்து வாழ முடியும், ஆற்றல் மிகுந்த பெரியவரிடத்தில் தவறு செய்து நடப்பவர் தப்பி பிழைக்க முடியாது.","ex":"Though burnt by a fire (from a forest), one may perhaps live; (but) never will he live who has shown disrespect to the great (devotees)","t1":"Eriyaal Sutappatinum Uyvuntaam Uyyaar","t2":"Periyaarp Pizhaiththozhuku Vaar"},{"n":897,"c":90,"ct":"பெரியாரைப் பிழையாமை","ce":"Not Censuring the Great","l1":"வகைமாண்ட வாழ்க்கையும் வான்பொருளும் என்னாம்","l2":"தகைமாண்ட தக்கார் செறின்.","mv":"தகுதியால் சிறப்புற்ற பெரியவர் ஒருவனை வெகுண்டால் அவனுக்கு பலவகையால் மாண்புற்ற வாழ்க்கையும் பெரும் பொருளும் இருந்தும் என்ன பயன்.","ex":"If a king incurs the wrath of the righteous great, what will become of his government with its splendid auxiliaries and (all) its untold wealth ?","t1":"Vakaimaanta Vaazhkkaiyum Vaanporulum Ennaam","t2":"Thakaimaanta Thakkaar Serin"},{"n":898,"c":90,"ct":"பெரியாரைப் பிழையாமை","ce":"Not Censuring the Great","l1":"குன்றன்னார் குன்ற மதிப்பின் குடியொடு","l2":"நின்றன்னார் மாய்வர் நிலத்து.","mv":"மலை போன்ற பெரியவர் கெட நினைத்தால். உலகில் அழியாமல் நிலைபெற்றாற் போல் உள்ளவரும் தம் குடியோடு அழிவர்.","ex":"If (the) hill-like (devotees) resolve on destruction, those who seemed to be everlasting will be destroyed root and branch from the earth","t1":"Kundrannaar Kundra Madhippin Kutiyotu","t2":"Nindrannaar Maaivar Nilaththu"},{"n":899,"c":90,"ct":"பெரியாரைப் பிழையாமை","ce":"Not Censuring the Great","l1":"ஏந்திய கொள்கையார் சீறின் இடைமுரிந்து","l2":"வேந்தனும் வேந்து கெடும்.","mv":"உயர்ந்த கொள்கையுடைய பெரியவர் சீறினால் நாட்டை ஆளும் அரசனும் இடை நடுவே முறிந்து அரசு இழந்து கெடுவான்.","ex":"Kings even fall from high estate and perish in the flame","t1":"Endhiya Kolkaiyaar Seerin Itaimurindhu","t2":"Vendhanum Vendhu Ketum"},{"n":900,"c":90,"ct":"பெரியாரைப் பிழையாமை","ce":"Not Censuring the Great","l1":"இறந்தமைந்த சார்புடையர் ஆயினும் உய்யார்","l2":"சிறந்தமைந்த சீரார் செறின்.","mv":"மிகச் சிறப்பாக அமைந்த பெருமையுடையவர் வெகுண்டால் அளவு கடந்து அமைந்துள்ள சார்புகள் உடையவரானாலும் தப்பி பிழைக்க முடியாது.","ex":"Though in possession of numerous auxiliaries, they will perish who are-exposed to the wrath of the noble whose penance is boundless","t1":"Irandhamaindha Saarputaiyar Aayinum Uyyaar","t2":"Sirandhamaindha Seeraar Serin"},{"n":901,"c":91,"ct":"பெண்வழிச்சேறல்","ce":"On Following Women's Advice","l1":"மனைவிழைவார் மாண்பயன் எய்தார் வினைவிழையார்","l2":"வேண்டாப் பொருளும் அது.","mv":"மனைவியை விரும்பி அவள் சொன்னபடி நடப்பவர், சிறந்த பயனை அடையமாட்டார், கடமையைச் செய்தலை விரும்புகின்றவர் வேண்டாத பொருளும் அதுவே.","ex":"Those who lust after their wives will not attain the excellence of virtue; and it is just this that is not desired by those who are bent on acquiring wealth","t1":"Manaivizhaivaar Maanpayan Eydhaar Vinaivizhaiyaar","t2":"Ventaap Porulum Adhu"},{"n":902,"c":91,"ct":"பெண்வழிச்சேறல்","ce":"On Following Women's Advice","l1":"பேணாது பெண்விழைவான் ஆக்கம் பெரியதோர்","l2":"நாணாக நாணுத் தரும்.","mv":"கடமையை விரும்பாமல் மனைவியின் பெண்மையை விரும்புகின்றவனுடைய ஆக்கம், பெரியதொரு நாணத்தக்கச் செயலாக நாணத்தைக் கொடுக்கும்.","ex":"The wealth of him who, regardless (of his manliness), devotes himself to his wife's feminine nature will cause great shame (to ali men) and to himself;","t1":"Penaadhu Penvizhaivaan Aakkam Periyadhor","t2":"Naanaaka Naanuth Tharum"},{"n":903,"c":91,"ct":"பெண்வழிச்சேறல்","ce":"On Following Women's Advice","l1":"இல்லாள்கண் தாழ்ந்த இயல்பின்மை எஞ்ஞான்றும்","l2":"நல்லாருள் நாணுத் தரும்.","mv":"மனைவியிடத்தில் தாழ்ந்து நடக்கும் இழிந்த தன்மை ஒருவனுக்கு எப்போதும் நல்லவரிடையே இருக்கும் போது நாணத்தைச் தரும்.","ex":"The frailty that stoops to a wife will always make (her husband) feel ashamed among the good","t1":"Illaalkan Thaazhndha Iyalpinmai Egngnaandrum","t2":"Nallaarul Naanuth Tharum"},{"n":904,"c":91,"ct":"பெண்வழிச்சேறல்","ce":"On Following Women's Advice","l1":"மனையாளை அஞ்சும் மறுமையி லாளன்","l2":"வினையாண்மை வீறெய்த லின்று.","mv":"மனைவிக்கு அஞ்சி நடக்கின்ற மறுமைப் பயன் இல்லாத ஒருவன், செயல் ஆற்றுந்தன்மை பெருமை பெற்று விளங்க முடிவதில்லை.","ex":"The undertaking of one, who fears his wife and is therefore destitute of (bliss), will never be applauded","t1":"Manaiyaalai Anjum Marumaiyi Laalan","t2":"Vinaiyaanmai Veereydha Lindru"},{"n":905,"c":91,"ct":"பெண்வழிச்சேறல்","ce":"On Following Women's Advice","l1":"இல்லாளை அஞ்சுவான் அஞ்சுமற் றெஞ்ஞான்றும்","l2":"நல்லார்க்கு நல்ல செயல்.","mv":"மனைவிக்கு அஞ்சி வாழ்கின்றவன் எப்போதும் நல்லவர்க்கு நன்மையான கடமையைச் செய்வதற்கு அஞ்சி நடப்பான்.","ex":"He that fears his wife will always be afraid of doing good deeds (even) to the good","t1":"Illaalai Anjuvaan Anjumar Regngnaandrum","t2":"Nallaarkku Nalla Seyal"},{"n":906,"c":91,"ct":"பெண்வழிச்சேறல்","ce":"On Following Women's Advice","l1":"இமையாரின் வாழினும் பாடிலரே இல்லாள்","l2":"அமையார்தோள் அஞ்சு பவர்.","mv":"மனைவியின் தோளுக்கு அஞ்சி வாழ்கின்றவர் தேவரைப் போல் இவ்வுலகில் சிறப்பான நிலையில் வாழ்ந்த போதிலும் பெருமை இல்லாதவரே ஆவர்.","ex":"They that fear the bamboo-like shoulders of their wives will be destitute of manliness though they may flourish like the Gods","t1":"Imaiyaarin Vaazhinum Paatilare Illaal","t2":"Amaiyaardhol Anju Pavar"},{"n":907,"c":91,"ct":"பெண்வழிச்சேறல்","ce":"On Following Women's Advice","l1":"பெண்ணேவல் செய்தொழுகும் ஆண்மையின் நாணுடைப்","l2":"பெண்ணே பெருமை உடைத்து.","mv":"மனைவியின் ஏவலைச் செய்து நடக்கின்றவனுடைய ஆண்மையைவிட, நாணத்தை தன் இயல்பாக உடையவளின் பெண்மையே பெருமை உடையது.","ex":"Even shame faced womanhood is more to be esteemed than the shameless manhood that performs","t1":"Penneval Seydhozhukum Aanmaiyin Naanutaip","t2":"Penne Perumai Utaiththu"},{"n":908,"c":91,"ct":"பெண்வழிச்சேறல்","ce":"On Following Women's Advice","l1":"நட்டார் குறைமுடியார் நன்றாற்றார் நன்னுதலாள்","l2":"பெட் டாங்கு ஒழுகு பவர்.","mv":"மனைவி விரும்பியபடி செய்து நடப்பவர், தமது நண்பர்க்கு உற்ற குறையையும் செய்து முடிக்க மாட்டார், அறத்தையும் செய்ய மாட்டார்.","ex":"Those who yield to the wishes of their wives will neither relieve the wants of (their) friends nor perform virtuous deeds","t1":"Nattaar Kuraimutiyaar Nandraatraar Nannudhalaal","t2":"Pettaangu Ozhuku Pavar"},{"n":909,"c":91,"ct":"பெண்வழிச்சேறல்","ce":"On Following Women's Advice","l1":"அறவினையும் ஆன்ற பொருளும் பிறவினையும்","l2":"பெண்ஏவல் செய்வார்கண் இல்.","mv":"அறச் செயலும் அதற்க்கு காரணமாக அமைந்த பொருள் முயற்சியும், மற்றக் கடமைகளும் மனைவியின் ஏவலைச் செய்வோரிடத்தில் இல்லை.","ex":"From those who obey the commands of their wives are to be expected neither deeds of virtue, nor those of wealth nor (even) those of pleasure","t1":"Aravinaiyum Aandra Porulum Piravinaiyum","t2":"Peneval Seyvaarkan Il"},{"n":910,"c":91,"ct":"பெண்வழிச்சேறல்","ce":"On Following Women's Advice","l1":"எண்சேர்ந்த நெஞ்சத் திடனுடையார்க்கு எஞ்ஞான்றும்","l2":"பெண்சேர்ந்தாம் பேதைமை இல்.","mv":"நன்றாக எண்ணுதல், பொருந்திய நெஞ்சத்தோடு தக்க நிலையும் உடையார்க்கு எக்காலத்திலும் மனைவியின் ஏவலுக்கு இணங்கும் அறியாமை இல்லை.","ex":"The foolishness that results from devotion to a wife will never be found in those who possess a reflecting mind and a prosperity (flowing) therefrom","t1":"Enserndha Nenjath Thitanutaiyaarkku Egngnaandrum","t2":"Penserndhaam Pedhaimai Il"},{"n":911,"c":92,"ct":"வரைவின்மகளிர்","ce":"On Public Women","l1":"அன்பின் விழையார் பொருள்விழையும் ஆய்தொடியார்","l2":"இன்சொல் இழுக்குத் தரும்.","mv":"அன் பினால் விரும்பாமல் பொருள் காரணமாக விரும்புகின்ற பொது மகளிர் பேசுகின்ற இனிய சொல், ஒருவனுக்கு துன்பத்தைக் கொடுக்கும்.","ex":"The sweet words of elegant braceleted (prostitutes) who desire (a man) not from affection but from avarice, will cause sorrow","t1":"Anpin Vizhaiyaar Porulvizhaiyum Aaidhotiyaar","t2":"Insol Izhukkuth Tharum"},{"n":912,"c":92,"ct":"வரைவின்மகளிர்","ce":"On Public Women","l1":"பயன்தூக்கிப் பண்புரைக்கும் பண்பின் மகளிர்","l2":"நயன்தூக்கி நள்ளா விடல்.","mv":"கிடைக்க கூடிய பயனை அளந்து பார்த்து, அதற்கு ஏற்றவாறு இனிய சொல் கூறுகின்ற பண்பற்ற பொது மகளிரின் இன்பத்தை ஆராய்ந்து பொருந்தாமல் விட வேண்டும்.","ex":"One must ascertain the character of the ill-natured women who after ascertaining the wealth (of a man) speak (as if they were) good natured-ones, and avoid intercourse (with them)","t1":"Payandhookkip Panpuraikkum Panpin Makalir","t2":"Nayandhookki Nallaa Vital"},{"n":913,"c":92,"ct":"வரைவின்மகளிர்","ce":"On Public Women","l1":"பொருட்பெண்டிர் பொய்ம்மை முயக்கம் இருட்டறையில்","l2":"ஏத஧ல் பிணந்தழீஇ அற்று.","mv":"பொருளையே விரும்பும் பொது மகளிரின் பொய்யானத் தழுவல், இருட்டறையில் தொடர்பில்லாத ஒரு பிணத்தைத் தழுவினாற் போன்றது.","ex":"The false embraces of wealth-loving women are like (hired men) embracing a strange corpse in a dark room","t1":"Porutpentir Poimmai Muyakkam Iruttaraiyil","t2":"Edhil Pinandhazheei Atru"},{"n":914,"c":92,"ct":"வரைவின்மகளிர்","ce":"On Public Women","l1":"பொருட்பொருளார் புன்னலந் தோயார் அருட்பொருள்","l2":"ஆயும் அறிவி னவர்.","mv":"பொருள் ஒன்றையே பொருளாகக் கொண்ட பொது மகளிரின் புன்மையான இன்பத்தை, அருளாகிய சிறந்த பொருளை ஆராயும் அறிவுடையோர் பொருந்த மாட்டார்.","ex":"The wise who seek the wealth of grace will not desire the base favours of those who regard wealth (and not pleasure) as (their) riches","t1":"Porutporulaar Punnalan Thoyaar Arutporul","t2":"Aayum Arivi Navar"},{"n":915,"c":92,"ct":"வரைவின்மகளிர்","ce":"On Public Women","l1":"பொதுநலத்தார் புன்னலம் தோயார் மதிநலத்தின்","l2":"மாண்ட அறிவி னவர்.","mv":"இயற்கை யறிவின் நன்மையால் சிறப்புற்ற அறிவுடையோர், பொருள் தருவார் எல்லார்க்கும் பொதுவாக இன்பம் தரும் மகளிரின் புன்மையான நலத்தைப் பொருந்தார்.","ex":"Those whose knowledge is made excellent by their (natural) sense will not covet the trffling delights","t1":"Podhunalaththaar Punnalam Thoyaar Madhinalaththin","t2":"Maanta Arivi Navar"},{"n":916,"c":92,"ct":"வரைவின்மகளிர்","ce":"On Public Women","l1":"தந்நலம் பார஧ப்பார் தோயார் தகைசெருக்கிப்","l2":"புன்னலம் பாரிப்பார் தோள்.","mv":"அழகு முதலியவற்றால் செருக்கு கொண்டு தம் புன்மையான நலத்தை விற்கும் பொது மகளிரின் தோளை, தம் நல்லோழுக்கத்தைப் போற்றும் சான்றோர் பொருந்தார்.","ex":"Those who would spread (the fame of) their own goodness will not desire the shoulders of those,who rejoice in their accomplishments and bestow their despicable favours (on all who pay)","t1":"Thannalam Paarippaar Thoyaar Thakaiserukkip","t2":"Punnalam Paarippaar Thol"},{"n":917,"c":92,"ct":"வரைவின்மகளிர்","ce":"On Public Women","l1":"நிறைநெஞ்சம் இல்லவர் தோய்வார் பிறநெஞ்சிற்","l2":"பேணிப் புணர்பவர் தோள்.","mv":"நெஞ்சத்தை நிறுத்தி ஆளும் ஆற்றல் இல்லாதவர், தம் நெஞ்சில் வேறுபொருளை விரும்பிக்கூடும் போது மகளிரின் தோளைப் பொருந்துவர்.","ex":"Those who are destitute of a perfectly (reformed) mind will covet the shoulders of those who embrace (them) while their hearts covet other things","t1":"Nirainenjam Illavar Thoivaar Piranenjir","t2":"Penip Punarpavar Thol"},{"n":918,"c":92,"ct":"வரைவின்மகளிர்","ce":"On Public Women","l1":"ஆயும் அறிவினர் அல்லார்க்கு அணங்கென்ப","l2":"மாய மகளிர் முயக்கு.","mv":"வஞ்சம் நிறைந்த பொதுமகளிரின் சேர்க்கை, ஆராய்ந்தறியும் அறிவு இல்லாதவற்க்கு அணங்கு தாக்கு(மோகினி மயக்கு) என்று கூறுவர்.","ex":"The wise say that to such as are destitute of discerning sense the embraces of faithless women are (as ruinous as those of) the celestail female","t1":"Aayum Arivinar Allaarkku Anangenpa","t2":"Maaya Makalir Muyakku"},{"n":919,"c":92,"ct":"வரைவின்மகளிர்","ce":"On Public Women","l1":"வரைவிலா மாணிழையார் மென்தோள் புரையிலாப்","l2":"பூரியர்கள் ஆழும் அளறு.","mv":"ஒழுக்க வரையரை இல்லாத பொது மகளிரின் மெல்லிய தோள், உயர்வில்லாத கீழ்மக்கள் ஆழ்ந்து கிடக்கின்ற நரகமாகும்.","ex":"The delicate shoulders of prostitutes with excellent jewels are a hell into which are plunged the ignorant base","t1":"Varaivilaa Maanizhaiyaar Mendhol Puraiyilaap","t2":"Pooriyarkal Aazhum Alaru"},{"n":920,"c":92,"ct":"வரைவின்மகளிர்","ce":"On Public Women","l1":"இருமனப் பெண்டிரும் கள்ளும் கவறும்","l2":"திருநீக்கப் பட்டார் தொடர்பு.","mv":"இருவகைப்பட்ட மனம் உடைய பொது மகளிரும், கள்ளும் சூதுமாகிய இவ் மூவகையும் திருமகளால் நீக்கப்பட்டவரின் உறவாகும்.","ex":"Treacherous women, liquor, and gambling are the associates of such as have forsaken by Fortune","t1":"Irumanap Pentirum Kallum Kavarum","t2":"Thiruneekkap Pattaar Thotarpu"},{"n":921,"c":93,"ct":"கள்ளுண்ணாமை","ce":"On Avoiding Alcohol","l1":"உட்கப் படாஅர் ஒளியிழப்பர் எஞ்ஞான்றும்","l2":"கட்காதல் கொண்டொழுகு வார்.","mv":"கள்ளின் மேல் விருப்பம் கொண்டு நடப்பவர், எக்காலத்திலும் பகைவரால் அஞ்சப்படார், தமக்கு உள்ள புகழையும் இழந்து விடுவார்.","ex":"Those who always thirst after drink will neither inspire fear (in others) nor retain the light (of their fame)","t1":"Utkap Pataaar Oliyizhappar Egngnaandrum","t2":"Katkaadhal Kontozhuku Vaar"},{"n":922,"c":93,"ct":"கள்ளுண்ணாமை","ce":"On Avoiding Alcohol","l1":"உண்ணற்க கள்ளை உணில்உண்க சான்றோரான்","l2":"எண்ணப் படவேண்டா தார்.","mv":"கள்ளை உண்ணக் கூடாது, சான்றோரால் நன்கு எண்ணப்படுவதை விரும்பாதவர் கள்ளை உண்ண வேண்டுமானால் உண்ணலாம்.","ex":"Let no liquor be drunk; if it is desired, let it be drunk by those who care not for esteem of the great","t1":"Unnarka Kallai Unilunka Saandroraan","t2":"Ennap Pataventaa Thaar"},{"n":923,"c":93,"ct":"கள்ளுண்ணாமை","ce":"On Avoiding Alcohol","l1":"ஈன்றாள் முகத்தேயும் இன்னாதால் என்மற்றுச்","l2":"சான்றோர் முகத்துக் களி.","mv":"பெற்றதாயின் முகத்திலும் கள்ளுண்டு மயங்குதல் துன்பம் தருவதாகும், அப்படியானால் குற்றம் கடியும் இயல்புடைய சான்றோரின் முகத்தில் அது எண்ணவாகும்.","ex":"Intoxication is painful even in the presence of (one's) mother; what will it not then be in that of the wise ?","t1":"Eendraal Mukaththeyum Innaadhaal Enmatruch","t2":"Chaandror Mukaththuk Kali"},{"n":924,"c":93,"ct":"கள்ளுண்ணாமை","ce":"On Avoiding Alcohol","l1":"நாண்என்னும் நல்லாள் புறங்கொடுக்கும் கள்ளென்னும்","l2":"பேணாப் பெருங்குற்றத் தார்க்கு.","mv":"நாணம் என்று சொல்லப்படும் நல்லவள், கள் என்று சொல்லப்படும் விரும்பத்தக்காத பெருங்குற்றம் உடையவர்க்கு எதிரே நிற்காமல் செய்வாள்.","ex":"The fair maid of modesty will turn her back on those who are guilty of the great and abominable crime of drunkenness","t1":"Naanennum Nallaal Purangotukkum Kallennum","t2":"Penaap Perungutrath Thaarkku"},{"n":925,"c":93,"ct":"கள்ளுண்ணாமை","ce":"On Avoiding Alcohol","l1":"கையறி யாமை உடைத்தே பொருள்கொடுத்து","l2":"மெய்யறி யாமை கொளல்.","mv":"விளைப் பொருள் கொடுத்து கள்ளுண்டு தன் உடம்பைத் தான் அறியாத நிலையை மேற்கொள்ளுதல், செய்வது இன்னதென்று அறியாத அறியாமை உடையதாகும்.","ex":"To give money and purchase unconsciousness is the result of one's ignorance of (one's own actions)","t1":"Kaiyari Yaamai Utaiththe Porulkotuththu","t2":"Meyyari Yaamai Kolal"},{"n":926,"c":93,"ct":"கள்ளுண்ணாமை","ce":"On Avoiding Alcohol","l1":"துஞ்சினார் செத்தாரின் வேறல்லர் எஞ்ஞான்றும்","l2":"நஞ்சுண்பார் கள்ளுண் பவர்.","mv":"உறங்கினவர் இறந்தவரை விட வேறுபட்டவர் அல்லர், அவ்வாறே கள்ளுண்பவரும் அறிவுமயங்குதலால் நஞ்சு உண்பவரே ஆவர்.","ex":"They that sleep resemble the deed; (likewise) they that drink are no other than poison-eaters","t1":"Thunjinaar Seththaarin Verallar Egngnaandrum","t2":"Nanjunpaar Kallun Pavar"},{"n":927,"c":93,"ct":"கள்ளுண்ணாமை","ce":"On Avoiding Alcohol","l1":"உள்ளொற்றி உள்ளூர் நகப்படுவர் எஞ்ஞான்றும்","l2":"கள்ளொற்றிக் கண்சாய் பவர்","mv":"கள்ளை மறைந்திருந்து குடித்து அறிவு மயங்குபவர், உள்ளூரில் வாழ்கின்றவரால் உள்ளான செய்திகள் ஆராயப்பட்டு எந்நாளும் சிரிக்கப்படும்.","ex":"Those who always intoxicate themselves by a private (indulgence in) drink; will have their secrets detected and laughed at by their fellow-townsmen","t1":"Ullotri Ulloor Nakappatuvar Egngnaandrum","t2":"Kallotrik Kansaai Pavar"},{"n":928,"c":93,"ct":"கள்ளுண்ணாமை","ce":"On Avoiding Alcohol","l1":"களித்தறியேன் என்பது கைவிடுக நெஞ்சத்து","l2":"ஒளித்ததூஉம் ஆங்கே மிகும்.","mv":"கள்ளுண்பவன் யான் ஒருபோதும் கள்ளுண்டறியேன் என்று சொல்வதை விட வேண்டும், நெஞ்சில் ஒளிந்திருந்த குற்றமும் கள்ளுண்டபோதே வெளிப்படும்.","ex":"Let (the drunkard) give up saying \"I have never drunk\"; (for) the moment (he drinks) he will simply betray his former attempt to conceal","t1":"Kaliththariyen Enpadhu Kaivituka Nenjaththu","t2":"Oliththadhooum Aange Mikum"},{"n":929,"c":93,"ct":"கள்ளுண்ணாமை","ce":"On Avoiding Alcohol","l1":"களித்தானைக் காரணம் காட்டுதல் கீழ்நீர்க்","l2":"குளித்தானைத் தீத்துரீஇ அற்று.","mv":"கள்ளுண்டு மயங்கினவனைக் காரணம் காட்டி தெளிவித்தல், நீரின் கீழ் மூழ்கின ஒருவனைத் தீவிளக்கு கொண்டு தேடினாற் போன்றது.","ex":"Reasoning with a drunkard is like going under water with a torch in search of a drowned man","t1":"Kaliththaanaik Kaaranam Kaattudhal Keezhneerk","t2":"Kuliththaanaith Theeththureei Atru"},{"n":930,"c":93,"ct":"கள்ளுண்ணாமை","ce":"On Avoiding Alcohol","l1":"கள்ளுண்ணாப் போழ்திற் களித்தானைக் காணுங்கால்","l2":"உள்ளான்கொல் உண்டதன் சோர்வு.","mv":"ஒருவன் தான் கள் உண்ணாத போது கள்ளுண்டு மயங்கினவளைக் காணுமிடத்தில் உண்டு மயங்குவதால் வரும் சோர்வை நினைக்கமாட்டானோ.","ex":"When (a drunkard) who is sober sees one who is not, it looks as if he remembered not the evil effects of his (own) drink","t1":"Kallunnaap Pozhdhir Kaliththaanaik Kaanungaal","t2":"Ullaankol Untadhan Sorvu"},{"n":931,"c":94,"ct":"சூது","ce":"On Gambling","l1":"வேண்டற்க வென்றிடினும் சூதினை வென்றதூஉம்","l2":"தூண்டிற்பொன் மீன்விழுங்கி அற்று.","mv":"வெற்றியே பெறுவதாலும் சூதாட்டத்தை விரும்பக்கூடாது, வென்ற வெற்றியும் தூண்டில் இரும்பை இரை என்று மயங்கி மீன் விழுகினாற் போன்றது.","ex":"Though able to win, let not one desire gambling; (for) even what is won is like a fish swallowing the iron in fish-hook","t1":"Ventarka Vendritinum Soodhinai Vendradhooum","t2":"Thoontirpon Meenvizhungi Atru"},{"n":932,"c":94,"ct":"சூது","ce":"On Gambling","l1":"ஒன்றெய்தி நூறிழக்கும் சூதர்க்கும் உண்டாங்கொல்","l2":"நன்றெய்தி வாழ்வதோர் ஆறு.","mv":"ஒரு பொருள் பெற்று நூறு மடங்கு பொருளை இழந்து விடும் சூதாடிகளுக்கும், நன்மை பெற்று வாழும் ஒரு வழி உண்டோ.","ex":"That they may good obtain, and see a prosperous day? Is there indeed a means of livelihood that can bestow happiness on gamblers who gain one and lose a hundred?","t1":"Ondreydhi Noorizhakkum Soodharkkum Untaangol","t2":"Nandreydhi Vaazhvadhor Aaru"},{"n":933,"c":94,"ct":"சூது","ce":"On Gambling","l1":"உருளாயம் ஓவாது கூறின் பொருளாயம்","l2":"போஒய்ப் புறமே படும்.","mv":"ஒருவன் உருளுகின்ற கருவியால் வரும் ஒரு பொருளை இடைவிடாமல் கூறி சூதாடினால், பொருள் வருவாய் அவனை விட்டு நீங்கிப் பகைவரிடத்தில் சேரும்.","ex":"If the king is incessantly addicted to the rolling dice in the hope of gain, his wealth and the resources thereof will take their departure and fall into other's hands","t1":"Urulaayam Ovaadhu Koorin Porulaayam","t2":"Pooip Purame Patum"},{"n":934,"c":94,"ct":"சூது","ce":"On Gambling","l1":"சிறுமை பலசெய்து சீரழ஧க்கும் சூதின்","l2":"வறுமை தருவதொன்று இல்.","mv":"ஒருவனுக்குத் துன்பம் பலவற்றையும் உண்டாக்கி அவனுடைய புகழைக் கெடுக்கின்ற சூதைபோல் வறுமை தருவது வேறொன்றும் இல்லை.","ex":"There is nothing else that brings (us) poverty like gambling which causes many a misery and destroys (one's) reputation","t1":"Sirumai Palaseydhu Seerazhikkum Soodhin","t2":"Varumai Tharuvadhondru Il"},{"n":935,"c":94,"ct":"சூது","ce":"On Gambling","l1":"கவறும் கழகமும் கையும் தருக்கி","l2":"இவறியார் இல்லாகி யார்.","mv":"சூதாடு கருவியும், ஆடும் இடமும், கைத்திறமையும் மதித்துக் கைவிடாதவர், (எல்லாப் பொருள் உடையவராக இருந்தும்) இல்லாதவர் ஆகிவிடுவார்.","ex":"Penniless are those who by reason of their attachment would never forsake gambling, the gamblingplace and the handling (of dice)","t1":"Kavarum Kazhakamum Kaiyum Tharukki","t2":"Ivariyaar Illaaki Yaar"},{"n":936,"c":94,"ct":"சூது","ce":"On Gambling","l1":"அகடாரார் அல்லல் உழப்பர்சூ தென்னும்","l2":"முகடியான் மூடப்பட் டார்.","mv":"சூது என்று சொல்லப்படும் மூதேவியால் விழுங்கப்பட்டவர், வயிறு நிறைய உணவும் உண்ணாதவராகிப் பல துன்பப்பட்டு வருந்துவர்.","ex":"Those who are swallowed by the goddess called \"gambling\" will never have their hunger satisfied, but suffer the pangs of hell in the next world","t1":"Akataaraar Allal Uzhapparsoo Thennum","t2":"Mukatiyaan Mootappat Taar"},{"n":937,"c":94,"ct":"சூது","ce":"On Gambling","l1":"பழகிய செல்வமும் பண்பும் கெடுக்கும்","l2":"கழகத்துக் காலை புகின்.","mv":"சூதாடுமிடத்தில் ஒருவனுடைய காலம் கழியுமானால் அது அவனுடைய பழைமையாய் வந்த செல்வத்தையும் இயல்பான நற்பண்பையும் கெடுக்கும்.","ex":"To waste time at the place of gambling will destroy inherited wealth and goodness of character","t1":"Pazhakiya Selvamum Panpum Ketukkum","t2":"Kazhakaththuk Kaalai Pukin"},{"n":938,"c":94,"ct":"சூது","ce":"On Gambling","l1":"பொருள் கெடுத்துப் பொய்மேற் கொளீஇ அருள்கெடுத்து","l2":"அல்லல் உழப்பிக்கும் சூது.","mv":"சூது உள்ள பொருளை அழித்துப் பொய்யை மேற்கொள்ளச் செய்து அருளையும் கெடுத்துப் பலவகையிலும் துன்பமுற்று வருந்தச் செய்யும்.","ex":"Gambling destroys property, teaches falsehood, puts an end to benevolence, and brings in misery (here and hereafter)","t1":"Porul Ketuththup Poimer Koleei","t2":"Arulketuththu Allal Uzhappikkum Soodhu"},{"n":939,"c":94,"ct":"சூது","ce":"On Gambling","l1":"உடைசெல்வம் ஊண்ஒளி கல்விஎன்று ஐந்தும்","l2":"அடையாவாம் ஆயங் கொளின்.","mv":"சூதாடுதலை ஒருவன் மேற்கொண்டால், புகழ், கல்வி, செல்வம், உணவு, உடை ஆகிய ஐந்தும் அவனைச் சேராமல் ஒதுங்கும்.","ex":"The habit of gambling prevents the attainment of these five: clothing, wealth, food, fame and learning","t1":"Utaiselvam Oonoli Kalviendru Aindhum","t2":"Ataiyaavaam Aayang Kolin"},{"n":940,"c":94,"ct":"சூது","ce":"On Gambling","l1":"இழத்தொறூஉம் காதலிக்கும் சூதேபோல் துன்பம்","l2":"உழத்தொறூஉம் காதற்று உயிர்.","mv":"பொருள் வைத்து இழக்க இழக்க மேன்மேலும் விருப்பத்தை வளர்க்கும் சூதாட்டம் போல், உடல் துன்பப்பட்டு வருந்ந வருந்த உயிர் மேன்மேலும் காதல் உடையதாகும்.","ex":"As the gambler loves (his vice) the more he loses by it, so does the soul love (the body) the more it suffers through it","t1":"Izhaththoru�um Kaadhalikkum Soodhepol Thunpam","t2":"Uzhaththoru�um Kaadhatru Uyir"},{"n":941,"c":95,"ct":"மருந்து","ce":"On Medicine","l1":"மிகினும் குறையினும் நோய்செய்யும் நூலோர்","l2":"வளிமுதலா எண்ணிய மூன்று.","mv":"மருத்துவ நூலோர் வாதம் பித்தம் சிலேத்துமம் என எண்ணிய மூன்று அளவுக்கு மிகுந்தாலும் குறைந்தாலும் நோய் உண்டாகும்.","ex":"If (food and work are either) excessive or deficient, the three things enumerated by (medical) writers, flatulence, biliousness, and phlegm, will cause (one) disease","t1":"Mikinum Kuraiyinum Noiseyyum Noolor","t2":"Valimudhalaa Enniya Moondru"},{"n":942,"c":95,"ct":"மருந்து","ce":"On Medicine","l1":"மருந்தென வேண்டாவாம் யாக்கைக்கு அருந்தியது","l2":"அற்றது போற்றி உணின்.","mv":"முன் உண்ட உணவு செரித்த தன்மை ஆராய்ந்து போற்றியப் பிறகு தக்க அளவு உண்டால், உடம்பிற்கு மருந்து என ஒன்று வேண்டியதில்லை.","ex":"No medicine is necessary for him who eats after assuring (himself) that what he has (already) eaten has been digested","t1":"Marundhena Ventaavaam Yaakkaikku Arundhiyadhu","t2":"Atradhu Potri Unin"},{"n":943,"c":95,"ct":"மருந்து","ce":"On Medicine","l1":"அற்றால் அறவறிந்து உண்க அஃதுடம்பு","l2":"பெற்றான் நெடிதுய்க்கும் ஆறு.","mv":"முன் உண்ட உணவு செரித்துவிட்டால், பின் வேண்டிய அளவு அறிந்து உண்ணவேண்டும், அதுவே உடம்பு பெற்றவன் அதை நெடுங்காலம் செலுத்தும் வழியாகும்.","ex":"If (one's food has been) digested let one eat with moderation; (for) that is the way to prolong the life of an embodied soul","t1":"Atraal Aravarindhu Unka Aqdhutampu","t2":"Petraan Netidhuykkum Aaru"},{"n":944,"c":95,"ct":"மருந்து","ce":"On Medicine","l1":"அற்றது அறிந்து கடைப்பிடித்து மாறல்ல","l2":"துய்க்க துவரப் பசித்து.","mv":"முன் உண்ட உணவு செரித்த தன்மையை அறிந்து மாறுபாடில்லாத உணவுகளைக் கடைபிடித்து அவற்றையும் பசித்த பிறகு உண்ண வேண்டும்.","ex":"(First) assure yourself that your food has been digested and never fail to eat, when very hungry, whatever is not disagreeable (to you)","t1":"Atradhu Arindhu Kataippitiththu Maaralla","t2":"Thuykka Thuvarap Pasiththu"},{"n":945,"c":95,"ct":"மருந்து","ce":"On Medicine","l1":"மாறுபாடு இல்லாத உண்டி மறுத்துண்ணின்","l2":"ஊறுபாடு இல்லை உயிர்க்கு.","mv":"மாறுபாடில்லாதா உணவை அளவு மீறாமல் மறுத்து அளவோடு உண்டால், உயிர் உடம்பில் வாழ்வதற்கு இடையூறான நோய் இல்லை.","ex":"There will be no disaster to one's life if one eats with moderation, food that is not disagreeable","t1":"Maarupaatu Illaadha Unti Maruththunnin","t2":"Oorupaatu Illai Uyirkku"},{"n":946,"c":95,"ct":"மருந்து","ce":"On Medicine","l1":"இழிவறிந்து உண்பான்கண் இன்பம்போல் நிற்கும்","l2":"கழிபேர் இரையான்கண் நோய்.","mv":"குறைந்த அளவு இன்னதென்று அறிந்து உண்பவனிடத்தில் இன்பம் நிலைநிற்பது போல, மிகப்பெரிதும் உண்பவனிடத்தில் நோய் நிற்க்கும்.","ex":"As pleasure dwells with him who eats moderately, so disease (dwells) with the glutton who eats voraciously","t1":"Izhivarindhu Unpaankan Inpampol Nirkum","t2":"Kazhiper Iraiyaankan Noi"},{"n":947,"c":95,"ct":"மருந்து","ce":"On Medicine","l1":"தீயள வன்றித் தெரியான் பெரிதுண்ணின்","l2":"நோயள வின்றிப் படும்.","mv":"பசித்தீயின் அளவின் படி அல்லாமல், அதை ஆராயாமல் மிகுதியாக உண்டால் , அதனால் நோய்கள் அளவில்லாமல் ஏற்ப்பட்டு விடும்.","ex":"He will be afflicted with numberless diseases, who eats immoderately, ignorant (of the rules of health)","t1":"Theeyala Vandrith Theriyaan Peridhunnin","t2":"Noyala Vindrip Patum"},{"n":948,"c":95,"ct":"மருந்து","ce":"On Medicine","l1":"நோய்நாடி நோய்முதல் நாடி அதுதணிக்கும்","l2":"வாய்நாடி வாய்ப்பச் செயல்.","mv":"நோய் இன்னதென்று ஆராய்ந்து, நோயின் காரணம் ஆராய்ந்து, அதைத் தணிக்கும் வழியையும் ஆராய்ந்து, உடலுக்கு பொருந்தும் படியாகச் செய்யவேண்டும்.","ex":"Let the physician enquire into the (nature of the) disease, its cause and its method of cure and treat it faithfully according to (medical rule)","t1":"Noinaati Noimudhal Naati Adhudhanikkum","t2":"Vaainaati Vaaippach Cheyal"},{"n":949,"c":95,"ct":"மருந்து","ce":"On Medicine","l1":"உற்றான் அளவும் பிணியளவும் காலமும்","l2":"கற்றான் கருதிச் செயல்.","mv":"மருத்துவ நூலைக் கற்றவன், நோயுற்றவனுடைய வயது முதலியவற்றையும், நோயின் அளவையும், காலத்தையும் ஆராய்ந்து செய்ய வேண்டும்.","ex":"The learned (physician) should ascertain the condition of his patient; the nature of his disease, and the season (of the year) and (then) proceed (with his treatment)","t1":"Utraan Alavum Piniyalavum Kaalamum","t2":"Katraan Karudhich Cheyal"},{"n":950,"c":95,"ct":"மருந்து","ce":"On Medicine","l1":"உற்றவன் தீர்ப்பான் மருந்துழைச் செல்வானென்று","l2":"அப்பால் நாற் கூற்றே மருந்து.","mv":"நோயுற்றவன், நோய் தீர்க்கும் மருத்துவன், மருந்து, மருந்தை அங்கிருந்து கொடுப்பவன் என்று மருத்துவ முறை அந்த நான்குவகைப் பாகுபாடு உடையது.","ex":"Medical science consists of four parts, viz, patient, physician, medicine and compounder; and each of these (again) contains four sub-divisions","t1":"Utravan Theerppaan Marundhuzhaich Chelvaanendru","t2":"Appaal Naar Kootre Marundhu"},{"n":951,"c":96,"ct":"குடிமை","ce":"On Noble Lineage","l1":"இற்பிறந்தார் கண்அல்லது இல்லை இயல்பாகச்","l2":"செப்பமும் நாணும் ஒருங்கு.","mv":"நடுவு நிமையும் நாணமும் உயர்குடியில் பிறந்தவனிடத்தில் அல்லாமல் மற்றவரிடத்தில் இயல்பாக ஒருசேர அமைவதில்லை.","ex":"Consistency (of thought, word and deed) and fear (of sin) are conjointly natural only to the high-born","t1":"Irpirandhaar Kanalladhu Illai Iyalpaakach","t2":"Cheppamum Naanum Orungu"},{"n":952,"c":96,"ct":"குடிமை","ce":"On Noble Lineage","l1":"ஒழுக்கமும் வாய்மையும் நாணும் இம் மூன்றும்","l2":"இழுக்கார் குடிப்பிறந் தார்.","mv":"உயர் குடியில் பிறந்தவர் ஒழுக்கமும் வாய்மையும் நாணமும் ஆகிய இம் மூன்றிலிருந்தும் வழுவாமல் இயல்பாகவே நன்னெறியில் வாழ்வர்.","ex":"The high-born will never deviate from these three; good manners, truthfulness and modesty","t1":"Ozhukkamum Vaaimaiyum Naanum Im","t2":"Moondrum Izhukkaar Kutippiran Thaar"},{"n":953,"c":96,"ct":"குடிமை","ce":"On Noble Lineage","l1":"நகைஈகை இன்சொல் இகழாமை நான்கும்","l2":"வகையென்ப வாய்மைக் குடிக்கு.","mv":"உண்மையான உயர்குடியில் பிறந்தவர்க்கு முகமலர்ச்சி, ஈகை, இனிய சொல், பிறரை இகழ்ந்து கூறாமை ஆகிய நான்கும் நல்லப் பண்புகள் என்பர்.","ex":"A cheerful countenance, liberality, pleasant words, and an unreviling disposition, these four are said to be the proper qualities of the truly high-born","t1":"Nakaieekai Insol Ikazhaamai Naankum","t2":"Vakaiyenpa Vaaimaik Kutikku"},{"n":954,"c":96,"ct":"குடிமை","ce":"On Noble Lineage","l1":"அடுக்கிய கோடி பெறினும் குடிப்பிறந்தார்","l2":"குன்றுவ செய்தல் இலர்.","mv":"பல கோடிப் பொருளைப் பெறுவதாக இருந்தாலும் உயர்குடியில் பிறந்தவர் தம் குடியின் சிறப்புக் குன்றுவதற்கு காரணமான குற்றங்களைச் செய்வதில்லை.","ex":"Though blessed with immense wealth, the noble will never do anything unbecoming","t1":"Atukkiya Koti Perinum Kutippirandhaar","t2":"Kundruva Seydhal Ilar"},{"n":955,"c":96,"ct":"குடிமை","ce":"On Noble Lineage","l1":"வழங்குவ துள்வீழ்ந்தக் கண்ணும் பழங்குடி","l2":"பண்பில் தலைப்பிரிதல் இன்று.","mv":"தாம் பிறர்க்குக் கொடுத்துதவும் வன்மை வறுமையால் சுருங்கிய போதிலும், பழம் பெருமை உடைய குடியில் பிறந்தவர் தம் பண்பிலிருந்து நீங்குவதில்லை.","ex":"Though their means fall off, those born in ancient families, will not lose their character (for liberality)","t1":"Vazhanguva Thulveezhndhak Kannum Pazhanguti","t2":"Panpil Thalaippiridhal Indru"},{"n":956,"c":96,"ct":"குடிமை","ce":"On Noble Lineage","l1":"சலம்பற்றிச் சால்பில செய்யார்மா சற்ற","l2":"குலம்பற்றி வாழ்தும் என் பார்.","mv":"மாசற்ற குடிப் பண்புடன் வாழ்வோம் என்று கருதி வாழ்வோர், வஞ்சனைக் கொண்டு தகுதியில்லாதவற்றைக் செய்யமாட்டார்.","ex":"Those who seek to preserve the irreproachable honour of their families will not viciously do what is detrimental thereto","t1":"Salampatrich Chaalpila Seyyaarmaa Satra","t2":"Kulampatri Vaazhdhum En Paar"},{"n":957,"c":96,"ct":"குடிமை","ce":"On Noble Lineage","l1":"குடிப்பிறந்தார் கண்விளங்கும் குற்றம் விசும்பின்","l2":"மத஧க்கண் மறுப்போல் உயர்ந்து.","mv":"உயர் குடியில் பிறந்தவரிடத்தில் உண்டாகும் குற்றம், ஆகாயத்தில் திங்களிடம் காணப்படும் களங்கம்போல் பலரறியத் தோன்றும்.","ex":"As spots on her bright orb that walks sublime the evening sky","t1":"Kutippirandhaar Kanvilangum Kutram Visumpin","t2":"Madhikkan Maruppol Uyarndhu"},{"n":958,"c":96,"ct":"குடிமை","ce":"On Noble Lineage","l1":"நலத்தின்கண் நாரின்மை தோன்றின் அவனைக்","l2":"குலத்தின்கண் ஐயப் படும்.","mv":"ஒருவனுடைய நல்லப் பண்புகளுக்கிடையில் அன்பற்றத் தன்மைக் காணப்பட்டால், அவனை அவனுடைய குடிப் பிறப்பு பற்றி ஐயப்பட நேரும்.","ex":"If one of a good family betrays want of affection, his descent from it will be called in question","t1":"Nalaththinkan Naarinmai Thondrin Avanaik","t2":"Kulaththinkan Aiyap Patum"},{"n":959,"c":96,"ct":"குடிமை","ce":"On Noble Lineage","l1":"நிலத்தில் கிடந்தமை கால்காட்டும் காட்டும்","l2":"குலத்தில் பிறந்தார்வாய்ச் சொல்.","mv":"இன்ன நிலத்தில் இருந்து முளைத்தது என்பதை முளை காட்டும், அதுபோல் குடியிற் பிறந்தவரின் வாய்ச் சொல் அவருடைய குடிப்பிறப்பைக் காட்டும்.","ex":"As the sprout indicates the nature of the soil, (so) the speech of the noble indicates (that of one's birth)","t1":"Nilaththil Kitandhamai Kaalkaattum Kaattum","t2":"Kulaththil Pirandhaarvaaich Chol"},{"n":960,"c":96,"ct":"குடிமை","ce":"On Noble Lineage","l1":"நலம்வேண்டின் நாணுடைமை வேண்டும் குலம் வேண்டின்","l2":"வேண்டுக யார்க்கும் பணிவு.","mv":"ஒருவனுக்கு நன்மை வேண்டுமானால் நாணம் உடையவனாக வேண்டும், குடியின் உயர்வு வேண்டுமானால் எல்லோரிடத்தும் பணிவு வேண்டும்.","ex":"He who desires a good name must desire modesty; and he who desires (the continuance of) a family greatness must be submissive to all","t1":"Nalamventin Naanutaimai Ventum Kulam","t2":"Ventin Ventuka Yaarkkum Panivu"},{"n":961,"c":97,"ct":"மானம்","ce":"On Honour","l1":"இன்றி அமையாச் சிறப்பின ஆயினும்","l2":"குன்ற வருப விடல்.","mv":"இன்றியமையாத சிறப்பை உடைய செயல்களே ஆயினும் குடிப்பெருமை தாழுமாறு வரும் செயல்களை ஒருவன் செய்யாமல் விட வேண்டும்.","ex":"Actions that would degrade (one's) family should not be done; though they may be so important that not doing them would end in death","t1":"Indri Amaiyaach Chirappina Aayinum","t2":"Kundra Varupa Vital"},{"n":962,"c":97,"ct":"மானம்","ce":"On Honour","l1":"சீரினும் சீரல்ல செய்யாரே சீரொடு","l2":"பேராண்மை வேண்டு பவர்.","mv":"புகழோடு பெரிய ஆண்மையும் விரும்புகின்றவர், புகழ் தோடும் வழியிலும் குடிப்பெருமைக்கு ஒவ்வாத செயல்களைச் செய்யமாட்டார்.","ex":"Those who desire (to maintain their) honour, will surely do nothing dishonourable, even for the sake of fame","t1":"Seerinum Seeralla Seyyaare Seerotu","t2":"Peraanmai Ventu Pavar"},{"n":963,"c":97,"ct":"மானம்","ce":"On Honour","l1":"பெருக்கத்து வேண்டும் பணிதல் சிறிய","l2":"சுருக்கத்து வேண்டும் உயர்வு.","mv":"செல்வம் பெருகியுள்ள காலத்தில் ஒருவனுக்குப் பண்பு வேண்டும், செல்வம் குறைந்து சுருங்கும் வறுமையுள்ள காலத்தில் பணியாத உயர்வு வேண்டும்.","ex":"In great prosperity humility is becoming; dignity, in great adversity","t1":"Perukkaththu Ventum Panidhal Siriya","t2":"Surukkaththu Ventum Uyarvu"},{"n":964,"c":97,"ct":"மானம்","ce":"On Honour","l1":"தலையின் இழிந்த மயிரனையர் மாந்தர்","l2":"நிலையின் இழிந்தக் கடை.","mv":"மக்கள் தம் உயர்வுக்கு உரிய நிலையிலிருந்து தாழ்ந்த போது, தலைமையிலிருந்து விழுந்து தாழ்வுற்ற மயிரினைப் போன்றவர் ஆவர்.","ex":"They who have fallen from their (high) position are like the hair which has fallen from the head","t1":"Thalaiyin Izhindha Mayiranaiyar Maandhar","t2":"Nilaiyin Izhindhak Katai"},{"n":965,"c":97,"ct":"மானம்","ce":"On Honour","l1":"குன்றின் அனையாரும் குன்றுவர் குன்றுவ","l2":"குன்றி அனைய செயின்.","mv":"மலை போல் உயர்ந்த நிலையில் உள்ளவரும், தாழ்வுக்கு காரணமானச் செயல்களை ஒரு குன்றிமனி அளவு செய்தாலும் தாழ்ந்து போய் விடுவர்.","ex":"Even those who are exalted like a hill will be thought low, if they commit deeds that are debasing","t1":"Kundrin Anaiyaarum Kundruvar Kundruva","t2":"Kundri Anaiya Seyin"},{"n":966,"c":97,"ct":"மானம்","ce":"On Honour","l1":"புகழ்இன்றால் புத்தேள்நாட்டு உய்யாதால் என்மற்று","l2":"இகழ்வார்பின் சென்று நிலை.","mv":"மதியாமல் இகழ்கின்றவரின் பின் சென்று பணிந்து நிற்க்கும் நிலை, ஒருவனுக்கு புகழும் தராது, தேவருலகிலும் செலுத்தாது, வேறு பயன் என்ன.","ex":"Why follow men who scorn, and at their bidding wait?","t1":"Pukazhindraal Puththelnaattu Uyyaadhaal Enmatru","t2":"Ikazhvaarpin Sendru Nilai"},{"n":967,"c":97,"ct":"மானம்","ce":"On Honour","l1":"ஒட் டார்பின் சென்றொருவன் வாழ்தலின் அந்நிலையே","l2":"கெட்டான் எனப்படுதல் நன்று.","mv":"மதியாதவரின் பின் சென்று ஒருவன் உயிர்வாழ்வதை விட, அவ்வாறு செய்யாத நிலையில் நின்று அழிந்தான் என்று சொல்லப்படுதல் நல்லது.","ex":"It is better for a man to be said of him that he died in his usual state than that he eked out his life by following those who disgraced him","t1":"Ottaarpin Sendroruvan Vaazhdhala�n Annilaiye","t2":"Kettaan Enappatudhal Nandru"},{"n":968,"c":97,"ct":"மானம்","ce":"On Honour","l1":"மருந்தோமற்று ஊன்ஓம்பும் வாழ்க்கை பெருந்தகைமை","l2":"பீடழிய வந்த இடத்து.","mv":"ஒருவனுடைய பெருந்தகைமை தன் சிறப்புக்கெட நேர்ந்த போது, அவன் உடம்பை மட்டும் காத்து வாழும் வாழ்க்கை சாவாமைக்கு மருந்தோ.","ex":"For the high-born to keep their body in life when their honour is gone will certainly not prove a remedy against death","t1":"Marundhomatru Oonompum Vaazhkkai Perundhakaimai","t2":"Peetazhiya Vandha Itaththu"},{"n":969,"c":97,"ct":"மானம்","ce":"On Honour","l1":"மயிர்நீப்பின் வாழாக் கவரிமா அன்னார்","l2":"உயிர்நீப்பர் மானம் வரின்.","mv":"தன் உடம்பிலிருந்து மயிர் நீங்கினால் உயிர்வாழாத கவரிமானைப் போன்றவர் மானம் அழிய நேர்ந்தால் உயிரை விட்டுவிடுவர்.","ex":"Those who give up (their) life when (their) honour is at stake are like the yark which kills itself at the loss of (even one of) its hairs","t1":"Mayirneeppin Vaazhaak Kavarimaa Annaar","t2":"Uyirneeppar Maanam Varin"},{"n":970,"c":97,"ct":"மானம்","ce":"On Honour","l1":"இளிவரின் வாழாத மானம் உடையார்","l2":"ஒளிதொழுது ஏத்தும் உலகு.","mv":"தமக்கு யாதேனும் இழிவு நேர்ந்தால் உயிர் வாழாத மானம் உடையவரின் புகழை உலகத்தார் தொழுது ஏந்தி நிற்பார்கள்.","ex":"The world will (always) praise and adore the fame of the honourable who would rather die than suffer indignity","t1":"Ilivarin Vaazhaadha Maanam Utaiyaar","t2":"Olidhozhudhu Eththum Ulaku"},{"n":971,"c":98,"ct":"பெருமை","ce":"On Greatness","l1":"ஒளிஒருவற்கு உள்ள வெறுக்கை இளிஒருவற்கு","l2":"அஃதிறந்து வாழ்தும் எனல்.","mv":"ஒருவனுக்கு ஒளி ஊக்கமிகுதியே ஆகும், ஒருவனுக்கு இழிவு அந்த ஊக்கம் இல்லாமலேயே உயிர்வாழலாம் என்று எண்ணுதலாம்.","ex":"One's light is the abundance of one's courage; one's darkness is the desire to live destitute of such (a state of mind.)","t1":"Olioruvarku Ulla Verukkai Ilioruvarku","t2":"Aqdhirandhu Vaazhdhum Enal"},{"n":972,"c":98,"ct":"பெருமை","ce":"On Greatness","l1":"பிறப்பொக்கும் எல்லா உயிர்க்கும் சிறப்பொவ்வா","l2":"செய்தொழில் வேற்றுமை யான்.","mv":"எல்லா உயிர்க்கும் பிறப்பு ஒருத் தன்மையானதே, ஆயினும் செய்கின்ற தொழில்களின் உயர்வு தாழ்வு வேறுபாடுகளால் சிறப்பியல்பு ஒத்திருப்பதில்லை.","ex":"All human beings agree as regards their birth but differ as regards their characteristics, because of the different qualities of their actions","t1":"Pirappokkum Ellaa Uyirkkum Sirappovvaa","t2":"Seydhozhil Vetrumai Yaan"},{"n":973,"c":98,"ct":"பெருமை","ce":"On Greatness","l1":"மேலிருந்தும் மேலல்லார் மேலல்லர் கீழிருந்தும்","l2":"கீழல்லார் கீழல் லவர்.","mv":"மேல்நிலையில் இருந்தாலும் மேன்மைப் பண்பு இல்லாதவர் மேலானவர் அல்லர், கீழ் நிலையில் இருந்தாலும் இழிகுணம் இல்லாதவர் கீழ் மக்கள் அல்லர்.","ex":"Though (raised) above, the base cannot become great; though (brought) low, the great cannot become base","t1":"Melirundhum Melallaar Melallar Keezhirundhum","t2":"Keezhallaar Keezhal Lavar"},{"n":974,"c":98,"ct":"பெருமை","ce":"On Greatness","l1":"ஒருமை மகளிரே போலப் பெருமையும்","l2":"தன்னைத்தான் கொண்டொழுகின் உண்டு.","mv":"ஒரு தன்மையான கற்புடைய மகளிரைப்போல் பெருமைப் பண்பும் ஒருவன் தன்னைத் தான் காத்துக் கொண்டு நடந்தால் உளதாகும்.","ex":"Exists while to itself is true","t1":"Orumai Makalire Polap Perumaiyum","t2":"Thannaiththaan Kontozhukin Untu"},{"n":975,"c":98,"ct":"பெருமை","ce":"On Greatness","l1":"பெருமை யுடையவர் ஆற்றுவார் ஆற்றின்","l2":"அருமை உடைய செயல்.","mv":"பெருமைப் பண்பு உடையவர் செய்வதற்கு அருமையானச் செயலைச் செய்வதற்க்கு உரிய நெறியில் செய்து முடிக்க வல்லவர் ஆவர்.","ex":"(Though reduced) the great will be able to perform, in the proper way, deeds difficult (for others to do)","t1":"Perumai Yutaiyavar Aatruvaar Aatrin","t2":"Arumai Utaiya Seyal"},{"n":976,"c":98,"ct":"பெருமை","ce":"On Greatness","l1":"சிறியார் உணர்ச்சியுள் இல்லை பெரியாரைப்","l2":"பேணிக் கொள் வேம் என்னும் நோக்கு.","mv":"பெரியாரை விரும்பிப் போற்றுவோம் எண்ணும் உயர்ந்த நோக்கம், அவருடைய சிறப்பை உணராத சிறியோரின் உணர்ச்சியில் இல்லை.","ex":"It is never in the nature of the base to seek the society of the great and partake of their nature","t1":"Siriyaar Unarchchiyul Illai Periyaaraip","t2":"Penikkol Vemennum Nokku"},{"n":977,"c":98,"ct":"பெருமை","ce":"On Greatness","l1":"இறப்பே புரிந்த தொழிற்றாம் சிறப்புந்தான்","l2":"சீரல் லவர்கண் படின்.","mv":"சிறப்பு நிலையும் தனக்கு பொருந்தாத சீரற்ற கீழ் மக்களிடம் ஏற்பட்டால், வரம்பு மீறிய செயலை உடையதாகும்.","ex":"Even nobility of birth, wealth and learning, if in (the possession of) the base, will (only) produce everincreasing pride","t1":"Irappe Purindha Thozhitraam Sirappundhaan","t2":"Seeral Lavarkan Patin"},{"n":978,"c":98,"ct":"பெருமை","ce":"On Greatness","l1":"பணியுமாம் என்றும் பெருமை சிறுமை","l2":"அணியுமாம் தன்னை வியந்து.","mv":"பெருமைப் பண்பு எக்காலத்திலும் பணிந்து நடக்கும், ஆனால் சிறுமையோ தன்னைத் தானே வியந்துப் பாராட்டிக் கொள்ளும்.","ex":"The great will always humble himself; but the mean will exalt himself in self-admiration","t1":"Paniyumaam Endrum Perumai Sirumai","t2":"Aniyumaam Thannai Viyandhu"},{"n":979,"c":98,"ct":"பெருமை","ce":"On Greatness","l1":"பெருமை பெருமிதம் இன்மை சிறுமை","l2":"பெருமிதம் ஊர்ந்து விடல்.","mv":"பெருமை பண்பு செருக்கு இல்லாமல் வாழ்தல், சிறுமையோ செருக்கே மிகுந்து அதன் எல்லையில் நின்று விடுவதாகும்.","ex":"Freedom from conceit is (the nature of true) greatness; (while) obstinacy therein is (that of) meanness","t1":"Perumai Perumidham Inmai Sirumai","t2":"Perumidham Oorndhu Vital"},{"n":980,"c":98,"ct":"பெருமை","ce":"On Greatness","l1":"அற்றம் மறைக்கும் பெருமை சிறுமைதான்","l2":"குற்றமே கூறி விடும்.","mv":"பெருமைப் பண்பு பிறருடைய குறைப்பாட்டை மறைக்கும், சிறுமையோ பிறருடைய குற்றத்தையே எடுத்துச் சொல்லிவிடும்","ex":"The great hide the faults of others; the base only divulge them","t1":"Atram Maraikkum Perumai Sirumaidhaan","t2":"Kutrame Koori Vitum"},{"n":981,"c":99,"ct":"சான்றாண்மை","ce":"On Good Conduct","l1":"கடன்என்ப நல்லவை எல்லாம் கடன்அறிந்து","l2":"சான்றாண்மை மேற்கொள் பவர்க்கு.","mv":"கடமை இவை என்று அறிந்து சான்றான்மை மேற்கொண்டு நடப்பவர்க்கு நல்லவை எல்லாம் இயல்பான கடமை என்று கூறுவர்.","ex":"It is said that those who are conscious of their duty and behave with a perfect goodness will regard as natural all that is good","t1":"Katanenpa Nallavai Ellaam Katanarindhu","t2":"Saandraanmai Merkol Pavarkku"},{"n":982,"c":99,"ct":"சான்றாண்மை","ce":"On Good Conduct","l1":"குணநலம் சான்றோர் நலனே பிறநலம்","l2":"எந்நலத்து உள்ளதூஉம் அன்று.","mv":"சான்றோரின் நலம் என்று கூறப்படுவது அவறுடைய பண்புகளின் நலமே, மற்ற நலம் வேறு எந்த நலத்திலும் சேர்ந்துள்ளதும் அன்று.","ex":"The only delight of the perfect is that of their goodness; all other (sensual) delights are not to be included among any (true) delights","t1":"Kunanalam Saandror Nalane Piranalam","t2":"Ennalaththu Ulladhooum Andru"},{"n":983,"c":99,"ct":"சான்றாண்மை","ce":"On Good Conduct","l1":"அன்புநாண் ஒப்புரவு கண்ணோட்டம் வாய்மையொடு","l2":"ஐந்துசால் ஊன்றிய தூண்.","mv":"அன்பு, நாணம்,ஒப்புரவு, கண்ணோட்டம், வாய்மை, என்னும் ஐந்து பண்புகளும், சால்பு என்பதைத் தாங்கியுள்ள தூண்களாகும்.","ex":"Affection, fear (of sin), benevolence, favour and truthfulness; these are the five pillars on which perfect goodness rests","t1":"Anpunaan Oppuravu Kannottam Vaaimaiyotu","t2":"Aindhusaal Oondriya Thoon"},{"n":984,"c":99,"ct":"சான்றாண்மை","ce":"On Good Conduct","l1":"கொல்லா நலத்தது நோன்மை பிறர்தீமை","l2":"சொல்லா நலத்தது சால்பு.","mv":"தவம் ஓர் உயிரையும் கொல்லாத அறத்தை அடிப்படையாகக் கொண்டது, சால்பு பிறருடையத் தீமையை எடுத்துச் சொல்லாத நற்பண்பை அடிப்படையாகக் கொண்டது.","ex":"Penance consists in the goodness that kills not , and perfection in the goodness that tells not others' faults","t1":"Kollaa Nalaththadhu Nonmai Pirardheemai","t2":"Sollaa Nalaththadhu Saalpu"},{"n":985,"c":99,"ct":"சான்றாண்மை","ce":"On Good Conduct","l1":"ஆற்றுவார் ஆற்றல் பணிதல் அதுசான்றோர்","l2":"மாற்றாரை மாற்றும் படை.","mv":"ஆற்றலுடையவரின் ஆற்றலாவது பணிவுடன் நடத்தலாகும், அது சான்றோர் தம் பகைவரைப் பகைமையிலிருந்து மாற்றுகின்ற கருவியாகும்.","ex":"Stooping (to inferiors) is the strength of those who can accomplish (an undertaking); and that is the weapon with which the great avert their foes","t1":"Aatruvaar Aatral Panidhal Adhusaandror","t2":"Maatraarai Maatrum Patai"},{"n":986,"c":99,"ct":"சான்றாண்மை","ce":"On Good Conduct","l1":"சால்பிற்குக் கட்டளை யாதெனின் தோல்வி","l2":"துலையல்லார் கண்ணும் கொளல்.","mv":"சால்புக்கு உரைகல் போல் மதிப்பிடும் கருவி எது என்றால் தமக்கு ஒப்பில்லாத தாழ்ந்தோரிடத்திலும்தோல்வியை ஏற்றுக் கொள்ளும் பண்பாகும்.","ex":"The touch-stone of perfection is to receive a defeat even at the hands of one's inferiors","t1":"Saalpirkuk Kattalai Yaadhenin Tholvi","t2":"Thulaiyallaar Kannum Kolal"},{"n":987,"c":99,"ct":"சான்றாண்மை","ce":"On Good Conduct","l1":"இன்னாசெய் தார்க்கும் இனியவே செய்யாக்கால்","l2":"என்ன பயத்ததோ சால்பு.","mv":"துன்பமானவற்றைச் செய்தவர்க்கும் இனிய உதவிகளைச் செய்யா விட்டால், சான்றோரின் சால்பு என்ன பயன் உடையதாகும்.","ex":"Of what avail is perfect goodness if it cannot do pleasing things even to those who have pained (it) ?","t1":"Innaasey Thaarkkum Iniyave Seyyaakkaal","t2":"Enna Payaththadho Saalpu"},{"n":988,"c":99,"ct":"சான்றாண்மை","ce":"On Good Conduct","l1":"இன்மை ஒருவற்கு இளிவன்று சால்பென்னும்","l2":"திண்மை உண் டாகப் பெறின்.","mv":"சால்பு என்னும் வலிமை உண்டாகப் பெற்றால் ஒருவனுக்குப் பொருள் இல்லாத குறையாகிய வறுமை இழிவானது அன்று.","ex":"Poverty is no disgrace to one who abounds in good qualities","t1":"Inmai Oruvarku Ilivandru Saalpennum","t2":"Thinmai Un Taakap Perin"},{"n":989,"c":99,"ct":"சான்றாண்மை","ce":"On Good Conduct","l1":"ஊழி பெயரினும் தாம்பெயரார் சான்றாண்மைக்கு","l2":"ஆழி எனப்படு வார்.","mv":"சால்பு என்னும் தன்மைக்குக் கடல் என்று புகழப்படுகின்றவர், ஊழிக்காலத்தின் வேறுபாடுகளே நேர்ந்தாலும் தாம் வேறுபடாமல் இருப்பர்.","ex":"Those who are said to be the shore of the sea of perfection will never change, though ages may change","t1":"Oozhi Peyarinum Thaampeyaraar Saandraanmaikku","t2":"Aazhi Enappatu Vaar"},{"n":990,"c":99,"ct":"சான்றாண்மை","ce":"On Good Conduct","l1":"சான்றவர் சான்றாண்மை குன்றின் இருநிலந்தான்","l2":"தாங்காது மன்னோ பொறை.","mv":"சான்றோரின் சால்பு நிறைந்த பண்பு குறைபடுமானால் இந்தப் பெரிய நிலவுலகமும் தன் பாரத்தைத் தாங்க முடியாமற் போய் விடும்.","ex":"If there is a defect in the character of the perfect, (even) the great world cannot bear (its) burden","t1":"Saandravar Saandraanmai Kundrin Irunilandhaan","t2":"Thaangaadhu Manno Porai"},{"n":991,"c":100,"ct":"பண்புடைமை","ce":"On Courtesy","l1":"எண்பதத்தால் எய்தல் எளிதென்ப யார்மாட்டும்","l2":"பண்புடைமை என்னும் வழக்கு.","mv":"பண்பு உடையவராக வாழும் நல்வழியை, யாரிடத்திலும் எளிய செவ்வியுடன் இருப்பதால் அடைவது எளிது என்று கூறுவர்.","ex":"If one is easy of access to all, it will be easy for one to obtain the virtue called goodness","t1":"Enpadhaththaal Eydhal Elidhenpa Yaarmaattum","t2":"Panputaimai Ennum Vazhakku"},{"n":992,"c":100,"ct":"பண்புடைமை","ce":"On Courtesy","l1":"அன்புடைமை ஆன்ற குடிப்பிறத்தல் இவ்விரண்டும்","l2":"பண்புடைமை என்னும் வழக்கு.","mv":"அன்புடையவராக இருத்தல், உயர்ந்த குடியில் பிறந்த தன்மை அமைந்திருத்தல் ஆகிய இவ் விரண்டும் பண்பு உடையவராக வாழும் நல்வழியாகும்.","ex":"Affectionateness and birth in a good family, these two constitute what is called a proper behaviour to all","t1":"Anputaimai Aandra Kutippiraththal Ivvirantum","t2":"Panputaimai Ennum Vazhakku"},{"n":993,"c":100,"ct":"பண்புடைமை","ce":"On Courtesy","l1":"உறுப்பொத்தல் மக்களொப்பு அன்றால் வெறுத்தக்க","l2":"பண்பொத்தல் ஒப்பதாம் ஒப்பு.","mv":"உடம்பால் ஒத்திருத்தல் மக்களோடு ஒப்புமை அன்று, பொருந்தத்தக்கப் பண்பால் ஒத்திருத்தலே கொள்ளத்தக்க ஒப்புமையாகும்.","ex":"Resemblance of bodies is no resemblance of souls; true resemblance is the resemblance of qualities that attract","t1":"Uruppoththal Makkaloppu Andraal Veruththakka","t2":"Panpoththal Oppadhaam Oppu"},{"n":994,"c":100,"ct":"பண்புடைமை","ce":"On Courtesy","l1":"யனொடு நன்றி புரிந்த பயனுடையார்","l2":"பண்புபா ராட்டும் உலகு.","mv":"நீதியையும் நன்மையையும் விரும்பிப் பிறர்க்குப் பயன்பட வாழும் பெரியோரின் நல்லப் பண்பை உலகத்தார் போற்றிக் கொண்டாடுவர்.","ex":"The world applauds the character of those whose usefulness results from their equity and charity","t1":"Nayanotu Nandri Purindha Payanutaiyaar","t2":"Panpupaa Raattum Ulaku"},{"n":995,"c":100,"ct":"பண்புடைமை","ce":"On Courtesy","l1":"நகையுள்ளும் இன்னா திகழ்ச்சி பகையுள்ளும்","l2":"பண்புள பாடறிவார் மாட்டு.","mv":"ஒருவனை இகழ்ந்து பேசுதல் விளையாட்டிலும் துன்பம் தருவதாகும், பிறருடைய இயல்பை அறிந்து நடப்பவரிடத்தில் பகைமையிலும் நல்லப் பண்புகள் உள்ளன.","ex":"Reproach is painful to one even in sport; those (therefore) who know the nature of others exhibit (pleasing) qualities even when they are hated","t1":"Nakaiyullum Innaa Thikazhchchi Pakaiyullum","t2":"Panpula Paatarivaar Maattu"},{"n":996,"c":100,"ct":"பண்புடைமை","ce":"On Courtesy","l1":"பண்புடையார்ப் பட்டுண்டு உலகம் அதுஇன்றேல்","l2":"மண்புக்கு மாய்வது மன்.","mv":"பண்பு உடையவரிடத்தில் பொருந்தியிருப்பதால் உலகம் உள்ளதாய் இயங்குகின்றது, அஃது இல்லையானால் மண்ணில் புகுந்து அழிந்து போகும்.","ex":"The (way of the) world subsists by contact with the good; if not, it would bury itself in the earth and perish","t1":"Panputaiyaarp Pattuntu Ulakam Adhuindrel","t2":"Manpukku Maaivadhu Man"},{"n":997,"c":100,"ct":"பண்புடைமை","ce":"On Courtesy","l1":"அரம்போலும் கூர்மைய ரேனும் மரம்போல்வர்","l2":"மக்கட்பண்பு இல்லா தவர்.","mv":"மக்களுக்கு உரிய பண்பு இல்லாதவர் அரம் போல் கூர்மையான அறிவுடையவரானாலும், ஓரறிவுயிராகிய மரத்தைப் போன்றவரே ஆவர்.","ex":"He who is destitute of (true) human qualities (only) resembles a tree, though he may possess the sharpness of a file","t1":"Arampolum Koormaiya Renum Marampolvar","t2":"Makkatpanpu Illaa Thavar"},{"n":998,"c":100,"ct":"பண்புடைமை","ce":"On Courtesy","l1":"நண்பாற்றார் ஆகி நயமில செய்வார்க்கும்","l2":"பண்பாற்றார் ஆதல் கடை.","mv":"நட்பு கொள்ள முடியாதவராய்த் தீயவைச் செய்கின்றவரிடத்திலும் பண்பு உடையவராய் நடக்க முடியாமை இழிவானதாகும்.","ex":"It is wrong (for the wise) not to exhibit (good) qualities even towards those who bearing no friendship (for them) do only what is hateful","t1":"Nanpaatraar Aaki Nayamila Seyvaarkkum","t2":"Panpaatraar Aadhal Katai"},{"n":999,"c":100,"ct":"பண்புடைமை","ce":"On Courtesy","l1":"நகல்வல்லர் அல்லார்க்கு மாயிரு ஞாலம்","l2":"பகலும்பாற் பட்டன்று இருள்.","mv":"பிறரோடு கலந்து பழகி மகிழ முடியாதவர்க்கு, மிகப் பெரிய இந்த உலகம் ஒளியுள்ள பகற் காலத்திலும் இருளில் கிடப்பதாம்.","ex":"To those who cannot rejoice, the wide world is buried darkness even in (broad) day light","t1":"Nakalvallar Allaarkku Maayiru Gnaalam","t2":"Pakalumpaar Pattandru Irul"},{"n":1000,"c":100,"ct":"பண்புடைமை","ce":"On Courtesy","l1":"ண்பிலான் பெற்ற பெருஞ்செல்வம் நன்பால்","l2":"கலந்தீமை யால்திரிந் தற்று.","mv":"பண்பு இல்லாதவன் பெற்ற பெரிய செல்வம், வைத்த கலத்தின் தீமையால் நல்ல பால் தன் சுவை முதலியன கெட்டாற் போன்றதாகும்.","ex":"The great wealth obtained by one who has no goodness will perish like pure milk spoilt by the","t1":"Panpilaan Petra Perunjelvam Nanpaal","t2":"Kalandheemai Yaaldhirin Thatru"},{"n":1001,"c":101,"ct":"நன்றியில்செல்வம்","ce":"On Unprofitable Wealth","l1":"வைத்தான்வாய் சான்ற பெரும்பொருள் அஃதுண்ணான்","l2":"செத்தான் செயக்கிடந்தது இல்.","mv":"ஒருவன் இடமெல்லாம் நிறைந்த பெரும் பொருளைச் சேர்த்து வைத்து அதை உண்டு நூகராமல் இறந்து போனால் அவன் அந்த பொருளால் செய்ய முடிந்தது ஒன்றுமில்லை.","ex":"He who does not enjoy the immense riches he has heaped up in his house, is (to be reckoned as) dead, (for) there is nothing achieved (by him)","t1":"Vaiththaanvaai Saandra Perumporul Aqdhunnaan","t2":"Seththaan Seyakkitandhadhu Il"},{"n":1002,"c":101,"ct":"நன்றியில்செல்வம்","ce":"On Unprofitable Wealth","l1":"பொருளானாம் எல்லாமென்று ஈயாது இவறும்","l2":"மருளானாம் மாணாப் பிறப்பு","mv":"பொருளால் எல்லாம் ஆகும் என்று பிறர்க்கு ஒன்றும் கொடுக்காமல் இறுகப்பற்றிய மயக்கத்தால் சிறப்பில்லாத பிறவி உண்டாம்.","ex":"He who knows that wealth yields every pleasure and yet is so blind as to lead miserly life will be born a demon","t1":"Porulaanaam Ellaamendru Eeyaadhu Ivarum","t2":"Marulaanaam Maanaap Pirappu"},{"n":1003,"c":101,"ct":"நன்றியில்செல்வம்","ce":"On Unprofitable Wealth","l1":"ஈட்டம் இவறி இசைவேண்டா ஆடவர்","l2":"தோற்றம் நிலக்குப் பொறை.","mv":"சேர்த்து வைப்பதையே விரும்பிப் பற்றுள்ளம் கொண்டு புகழை விரும்பாத மக்கள் பிறந்து வாழ்தல் நிலத்திற்கு பாரமே ஆகும்.","ex":"A burden to the earth are men bent on the acquisition of riches and not (true) fame","t1":"Eettam Ivari Isaiventaa Aatavar","t2":"Thotram Nilakkup Porai"},{"n":1004,"c":101,"ct":"நன்
