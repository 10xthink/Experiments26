,"ex":"He who thinks lightly of going into the wife of another acquires guilt that will abide with him imperishably and for ever","t1":"Elidhena Illirappaan Eydhumenj Gnaandrum","t2":"Viliyaadhu Nirkum Pazhi"},{"n":146,"c":15,"ct":"பிறனில் விழையாமை","ce":"On Adultery","l1":"பகைபாவம் அச்சம் பழியென நான்கும்","l2":"இகவாவாம் இல்லிறப்பான் கண்.","mv":"பகை பாவம் அச்சம் பழி என்னும் இந்நான்கு குற்றங்களும் பிறன் மனைவியிடத்து நெறி தவறி நடப்பவனிடத்திலிருந்து நீங்காவாம்.","ex":"Hatred, sin, fear, disgrace; these four will never leave him who goes in to his neighbour's wife","t1":"Pakaipaavam Achcham Pazhiyena Naankum","t2":"Ikavaavaam Illirappaan Kan"},{"n":147,"c":15,"ct":"பிறனில் விழையாமை","ce":"On Adultery","l1":"அறனியலான் இல்வாழ்வான் என்பான் பிறனியலாள்","l2":"பெண்மை நயவா தவன்.","mv":"அறத்தின் இயல்போடு பொருந்தி இல்வாழ்க்கை வாழ்பவன், பிறனுக்கு உரிமையானவளின் பெண் தன்மையை விரும்பாதவனே","ex":"He who desires not the womanhood of her who should walk according to the will of another will be praised as a virtuous house-holder","t1":"Araniyalaan Ilvaazhvaan Enpaan Piraniyalaal","t2":"Penmai Nayavaa Thavan"},{"n":148,"c":15,"ct":"பிறனில் விழையாமை","ce":"On Adultery","l1":"பிறன்மனை நோக்காத பேராண்மை சான்றோர்க்கு","l2":"அறனொன்றோ ஆன்ற வொழுக்கு.","mv":"பிறனுடைய மனைவியை விரும்பி நோக்காத ‌பெரிய ஆண்மை, சான்றோர்க்கு அறம் மட்டும் அன்று; நிறைந்த ஒழுக்கமுமாகும்.","ex":"That noble manliness which looks not at the wife of another is the virtue and dignity of the great","t1":"Piranmanai Nokkaadha Peraanmai Saandrorkku","t2":"Aranondro Aandra Vozhukku"},{"n":149,"c":15,"ct":"பிறனில் விழையாமை","ce":"On Adultery","l1":"நலக்குரியார் யாரெனின் நாமநீர் வைப்பின்","l2":"பிறர்க்குரியாள் தோள்தோயா தார்.","mv":"கடல் சூழ்ந்த உலகத்தில் நன்மைக்கு உரியவர் யார் என்றொல் பிறனுக்கு உரிமையானவளின் தோளைப் பொருந்தாதவரே ஆவர்","ex":"Is it asked, \"who are those who shall obtain good in this world surrounded by the terror-producing sea ?\" Those who touch not the shoulder of her who belongs to another","t1":"Nalakkuriyaar Yaarenin Naamaneer Vaippin","t2":"Pirarkkuriyaal Tholdhoyaa Thaar"},{"n":150,"c":15,"ct":"பிறனில் விழையாமை","ce":"On Adultery","l1":"அறன்வரையான் அல்ல செயினும் பிறன்வரையாள்","l2":"பெண்மை நயவாமை நன்று.","mv":"ஒருவன் அறநெறியில் நிற்காமல் அறமில்லாதவைகளைச் செய்தாலும், பிறனுக்கு உரியவளின் பெண்மையை விரும்பாமல் வாழ்தல் நல்லது","ex":"Though a man perform no virtuous deeds and commit (every) vice, it will be well if he desire not the womanhood of her who is within the limit (of the house) of another","t1":"Aranvaraiyaan Alla Seyinum Piranvaraiyaal","t2":"Penmai Nayavaamai Nandru"},{"n":151,"c":16,"ct":"பொறையுடைமை","ce":"On Patience","l1":"அகழ்வாரைத் தாங்கும் நிலம்போலத் தம்மை","l2":"இகழ்வார்ப் பொறுத்தல் தலை.","mv":"தன்னை வெட்டுவோரையும் விழாமல் தாங்குகின்ற நிலம் போல், தம்மை இகழ்வாரையும் பொறுப்பதே தலையான பண்பாகும்","ex":"To bear with those who revile us, just as the earth bears up those who dig it, is the first of virtues","t1":"Akazhvaaraith Thaangum Nilampolath Thammai","t2":"Ikazhvaarp Poruththal Thalai"},{"n":152,"c":16,"ct":"பொறையுடைமை","ce":"On Patience","l1":"பொறுத்தல் இறப்பினை என்றும் அதனை","l2":"மறத்தல் அதனினும் நன்று.","mv":"வரம்பு கடந்து பிறர் செய்யும் தீங்கை எப்போதும் பொறுக்க வேண்டும்; அத் தீங்கை நினைவிலும் கொள்ளாமல் மறந்து விடுதல் பொறுத்தலை விட நல்லது.","ex":"Bear with reproach even when you can retaliate; but to forget it will be still better than that","t1":"Poruththal Irappinai Endrum Adhanai","t2":"Maraththal Adhaninum Nandru"},{"n":153,"c":16,"ct":"பொறையுடைமை","ce":"On Patience","l1":"இன்நம்யுள் இன்மை விருந்தொரால் வன்மையுள்","l2":"வன்மை மடவார்ப் பொறை.","mv":"வறுமையுள் வறுமை, விருந்தினரைப் போற்றாமல் நீக்குதல்; வல்லமையுள் வல்லமை என்பது அறிவிலார் தீங்கு செய்தலைப் பொறுத்தலாகும்.","ex":"To neglect hospitality is poverty of poverty To bear with the ignorant is might of might","t1":"Inmaiyul Inmai Virundhoraal Vanmaiyul","t2":"Vanmai Matavaarp Porai"},{"n":154,"c":16,"ct":"பொறையுடைமை","ce":"On Patience","l1":"நிறையுடைமை நீங்காமை வேண்டின் பொற்யுடைமை","l2":"போற்றி யொழுகப் படும்.","mv":"நிறை உடையவனாக இருக்கும் தன்மை தன்னை விட்டு நீங்காமல் இருக்க வேண்டினால், பொறுமையைப் போற்றி ஒழுக வேண்டும்.","ex":"If you desire that greatness should never leave, you preserve in your conduct the exercise of patience","t1":"Niraiyutaimai Neengaamai Ventin Poraiyutaimai","t2":"Potri Yozhukap Patum"},{"n":155,"c":16,"ct":"பொறையுடைமை","ce":"On Patience","l1":"ஒறுத்தாரை ஒன்றாக வையாரே வைப்பர்","l2":"பொறுத்தாரைப் பொன்போற் பொதிந்து.","mv":"( தீங்கு செய்தவரைப்) பொறுக்காமல் வருத்தினவரை உலகத்தார் ஒரு பொருளாக மதியார்; ஆனால், பொறுத்தவரைப் பொன்போல் மனத்துள் வைத்து மதிப்பர்.","ex":"(The wise) will not at all esteem the resentful They will esteem the patient just as the gold which they lay up with care","t1":"Oruththaarai Ondraaka Vaiyaare Vaippar","t2":"Poruththaaraip Ponpor Podhindhu"},{"n":156,"c":16,"ct":"பொறையுடைமை","ce":"On Patience","l1":"ஒறுத்தார்க்கு ஒருநாளை இன்பம் பொறுத்தார்க்குப்","l2":"பொன்றுந் துணையும் புகழ்.","mv":"தீங்கு செய்தவரைப் பொறுக்காமல் வருத்தினவர்க்கு ஒருநாள் இன்பமே; பொறுத்தவர்க்கு உலகம் அழியும் வரைக்கும் புகழ் உண்டு.","ex":"The pleasure of the resentful continues for a day The praise of the patient will continue until (the final destruction of) the world","t1":"Oruththaarkku Orunaalai Inpam Poruththaarkkup","t2":"Pondrun Thunaiyum Pukazh"},{"n":157,"c":16,"ct":"பொறையுடைமை","ce":"On Patience","l1":"திறனல்ல தற்பிறர் செய்யினும் நோநொந்து","l2":"அறனல்ல செய்யாமை நன்று.","mv":"தகுதி அல்லாதவைகளைத் தனக்குப் பிறர் செய்த போதிலும், அதனால், அவர்க்கு வரும் துன்பத்திற்காக நொந்து, அறம் அல்லாதவைகளைச் செய்யாதிருத்தல் நல்லது.","ex":"Though others inflict injuries on you, yet compassionating the evil (that will come upon them) it will be well not to do them anything contrary to virtue","t1":"Thiranalla Tharpirar Seyyinum Nonondhu","t2":"Aranalla Seyyaamai Nandru"},{"n":158,"c":16,"ct":"பொறையுடைமை","ce":"On Patience","l1":"மிகுதியான் மிக்கவை செய்தாரைத் தாந்தம்","l2":"தகுதியான் வென்று விடல்.","mv":"செருக்கினால் தீங்கானவற்றைச் செய்தவரைத் தாம் தம்முடைய பொறுமைப் பண்பினால் பொறுத்து வென்று விட வேண்டும்.","ex":"Let a man by patience overcome those who through pride commit excesses","t1":"Mikudhiyaan Mikkavai Seydhaaraith Thaandham","t2":"Thakudhiyaan Vendru Vital"},{"n":159,"c":16,"ct":"பொறையுடைமை","ce":"On Patience","l1":"துறந்தாரின் தூய்மை உடையர் இறந்தார்வாய்","l2":"இன்னாச்சொல் நோற்கிற் பவர்.","mv":"வரம்பு கடந்து நடப்பவரின் வாயில் பிறக்கும் கொடுஞ்சொற்களைப் பொறுத்துக் கொள்பவர், துறந்தவரைப் போலத் தூய்மையானவர் ஆவர்.","ex":"Those who bear with the uncourteous speech of the insolent are as pure as the ascetics","t1":"Thurandhaarin Thooimai Utaiyar Irandhaarvaai","t2":"Innaachchol Norkir Pavar"},{"n":160,"c":16,"ct":"பொறையுடைமை","ce":"On Patience","l1":"உண்ணாது நோற்பார் பெரியர் பிறர்சொல்லும்","l2":"இன்னாச்சொல் நோற்பாரின் பின்.","mv":"உணவு உண்ணாமல் நோன்பு கிடப்பவர், பிறர் ‌சொல்லும் கொடுஞ் சொற்களைப் பொறுப்பவர்க்கு அடுத்த நிலையில்தான் பெரியவர் ஆவர்.","ex":"Those who endure abstinence from food are great, next to those who endure the uncourteous speech of others","t1":"Unnaadhu Norpaar Periyar Pirarsollum","t2":"Innaachchol Norpaarin Pin"},{"n":161,"c":17,"ct":"அழுக்காறாமை","ce":"On Envy","l1":"ஒழுக்காறாக் கொள்க ஒருவன்தன் நெஞ்சத்து","l2":"அழுக்காறு இலாத இயல்பு.","mv":"ஒருவன் தன் நெஞ்சில் பொறாமை இல்லாமல் வாழும் இயல்பைத் தனக்கு உரிய ஒழுக்க நெறியாகக் கொண்டு போற்ற வேண்டும்.","ex":"Let a man esteem that disposition which is free from envy in the same manner as propriety of conduct","t1":"Ozhukkaaraak Kolka Oruvandhan Nenjaththu","t2":"Azhukkaaru Ilaadha Iyalpu"},{"n":162,"c":17,"ct":"அழுக்காறாமை","ce":"On Envy","l1":"விழுப்பேற்றின் அஃதொப்பது இல்லையார் மாட்டும்","l2":"அழுக்காற்றின் அன்மை பெறின்.","mv":"யாரிடத்திலும் பொறாமை இல்லாதிருக்கப் பெற்றால், ஒருவன் பெறத்தக்க மேம்பாடான பேறுகளில் அதற்கு ஒப்பானது வேறொன்றும் இல்லை.","ex":"Amongst all attainable excellences there is none equal to that of being free from envy towords others","t1":"Vizhuppetrin Aqdhoppadhu Illaiyaar Maattum","t2":"Azhukkaatrin Anmai Perin"},{"n":163,"c":17,"ct":"அழுக்காறாமை","ce":"On Envy","l1":"அறன்ஆக்கம் வேண்டாதான் என்பான் பிறனாக்கம்","l2":"பேணாது அழுக்கறுப் பான்.","mv":"தனக்கு அறமும் ஆக்கமும் விரும்பாதவன் என்று கருதத் தக்கவனே, பிறனுடைய ஆக்கத்தைக் கண்டு மகிழாமல் அதற்காகப் பொறாமைப்படுவான்.","ex":"Of him who instead of rejoicing in the wealth of others, envies it, it will be said \"he neither desires virtue not wealth.\"","t1":"Aranaakkam Ventaadhaan Enpaan Piranaakkam","t2":"Penaadhu Azhukkarup Paan"},{"n":164,"c":17,"ct":"அழுக்காறாமை","ce":"On Envy","l1":"அழுக்காற்றின் அல்லவை செய்யார் இழுக்காற்றின்","l2":"ஏதம் படுபாக்கு அறிந்து.","mv":"பொறாமைப்படுதலாகிய தவறான நெறியில் துன்பம் ஏற்படுத‌ை அறிந்து, பொறாமை காரணமாக அறமல்லாதவைகளைச் செய்யார் அறிவுடையோர்.","ex":"(The wise) knowing the misery that comes from transgression will not through envy commit unrighteous deeds","t1":"Azhukkaatrin Allavai Seyyaar Izhukkaatrin","t2":"Edham Patupaakku Arindhu"},{"n":165,"c":17,"ct":"அழுக்காறாமை","ce":"On Envy","l1":"அழுக்காறு உடையார்க்கு அதுசாலும் ஒன்னார்","l2":"வழுக்காயும் கேடீன் பது.","mv":"பொறாமை உடை‌யவர்க்கு வேறு பகை வேண்டா. அஃது ஒன்றே போதும், பகைவர் தீங்கு செய்யத் தவறினாலும் தவறாது கேட்டைத் தருவது அது.","ex":"To those who cherish envy that is enough Though free from enemies that (envy) will bring destruction","t1":"Azhukkaaru Utaiyaarkku Adhusaalum Onnaar","t2":"Vazhukka�yum Keteen Padhu"},{"n":166,"c":17,"ct":"அழுக்காறாமை","ce":"On Envy","l1":"கொடுப்பது அழுக்கறுப்பான் சுற்றம் உடுப்பதூஉம்","l2":"உண்பதூஉம் இன்றிக் கெடும்.","mv":"பிறர்க்கு உதவியாகக் கொடுக்கப்படும் பொருளைக் கண்டு பொறாமைப்படுகின்றவனுடைய சுற்றம், உடையும் உணவும் இல்லாமல் கெடும்.","ex":"He who is envious at a gift (made to another) will with his relations utterly perish destitute of food and rainment","t1":"Kotuppadhu Azhukkaruppaan Sutram Utuppadhooum","t2":"Unpadhooum Indrik Ketum"},{"n":167,"c":17,"ct":"அழுக்காறாமை","ce":"On Envy","l1":"அவ்வித்து அழுக்காறு உடையானைச் செய்யவள்","l2":"தவ்வையைக் காட்டி விடும்.","mv":"பொறாமை உடையவனைத் திருமகள் கண்டு பொறாமைப்பட்டுத் தன் தமக்கைக்கு அவனைக் காட்டி நீங்கி விடுவாள்.","ex":"Lakshmi envying (the prosperity) of the envious man will depart and introduce him to her sister","t1":"Avviththu Azhukkaaru Utaiyaanaich Cheyyaval","t2":"Thavvaiyaik Kaatti Vitum"},{"n":168,"c":17,"ct":"அழுக்காறாமை","ce":"On Envy","l1":"அழுக்காறு எனஒரு பாவி திருச்செற்றுத்","l2":"தீயுழி உய்த்து விடும்.","mv":"பொறாமை என்று கூறப்படும் ஒப்பற்ற பாவி, ஒருவனுடைய செல்வத்தைக் கெடுத்துத் தீய வழியில் அவனைச் செலுத்தி விடும்.","ex":"Envy will destroy (a man's) wealth (in his world) and drive him into the pit of fire (in the world to come.)","t1":"Azhukkaaru Enaoru Paavi Thiruchchetruth","t2":"Theeyuzhi Uyththu Vitum"},{"n":169,"c":17,"ct":"அழுக்காறாமை","ce":"On Envy","l1":"அவ்விய நெஞ்சத்தான் ஆக்கமும் செவ்வியான்","l2":"கேடும் நினைக்கப் படும்.","mv":"பொறாமை பொருந்திய நெஞ்சத்தானுடைய ஆக்கமும், பொறாமை இல்லாத நல்லவனுடைய கேடும் ஆராயத் தக்கவை","ex":"The wealth of a man of envious mind and the poverty of the righteous will be pondered","t1":"Avviya Nenjaththaan Aakkamum Sevviyaan","t2":"Ketum Ninaikkap Patum"},{"n":170,"c":17,"ct":"அழுக்காறாமை","ce":"On Envy","l1":"அழுக்கற்று அகன்றாரும் இல்லை அஃதுஇல்லார்","l2":"பெருக்கத்தில் தீர்ந்தாரும் இல்.","mv":"பொறாமைப்பட்டுப் பெருமையுற்றவரும் உலகத்தில் இல்லை; பொறாமை இல்லாதவராய் மேம்பாட்டிலிருந்து நீங்கியவரும் இல்லை.","ex":"Never have the envious become great; never have those who are free from envy been without greatness","t1":"Azhukkatru Akandraarum Illai Aqdhuillaar","t2":"Perukkaththil Theerndhaarum Il"},{"n":171,"c":18,"ct":"வெஃகாமை","ce":"On Non-Coveting","l1":"நடுவின்றி நன்பொருள் வெஃகின் குடிபொன்றிக்","l2":"குற்றமும் ஆங்கே தரும்.","mv":"நடுவுநிலைமை இல்லாமல் பிறர்க்குரிய நல்ல பொருளை ஒருவன் கவர விரும்பினால் அவனுடைய குடியும் கெட்டுக் குற்றமும் அப்போழுதே வந்து சேரும்.","ex":"If a man departing from equity covet the property (of others), at that very time will his family be destroyed and guilt be incurred","t1":"Natuvindri Nanporul Veqkin Kutipondrik","t2":"Kutramum Aange Tharum"},{"n":172,"c":18,"ct":"வெஃகாமை","ce":"On Non-Coveting","l1":"படுபயன் வெஃகிப் பழிப்படுவ செய்யார்","l2":"நடுவன்மை நாணு பவர்.","mv":"நடுவுநிலைமை அல்லாதவற்றைக் கண்டு நாணி ஒதுங்குகின்றவர், பிறர் பொருளைக் கவர்வதால் வரும் பயனை விரும்பிப் பழியான செயல்களைச் செய்யார்.","ex":"Those who blush at the want of equity will not commit disgraceful acts through desire of the profit that may be gained","t1":"Patupayan Veqkip Pazhippatuva Seyyaar","t2":"Natuvanmai Naanu Pavar"},{"n":173,"c":18,"ct":"வெஃகாமை","ce":"On Non-Coveting","l1":"சிற்றின்பம் வெஃகி அறனல்ல செய்யாரே","l2":"மற்றின்பம் வேண்டு பவர்.","mv":"அறநெறியால் பெறும் இன்பத்தை விரும்புகின்றவர், நிலையில்லாத சிறிய இன்பத்தை விரும்பி அறம் அல்லாதவற்றைச் செய்யார்.","ex":"Those who desire the higher pleasures (of heaven) will not act unjustly through desire of the trifling joy. (in this life.)","t1":"Sitrinpam Veqki Aranalla Seyyaare","t2":"Matrinpam Ventu Pavar"},{"n":174,"c":18,"ct":"வெஃகாமை","ce":"On Non-Coveting","l1":"இலமென்று வெஃகுதல் செய்யார் புலம்வென்ற","l2":"புன்மையில் காட்சி யவர்.","mv":"ஐம்புலன்களையும் வென்ற குற்றமில்லாத அறிவை உடையவர், யாம் வறுமை அடைந்தோம் என்று எண்ணியும் பிறர் பொருளை விரும்பார்‌.","ex":"The wise who have conquered their senses and are free from crime, will not covet (the things of others), with the thought \"we are destitute.\"","t1":"Ilamendru Veqkudhal Seyyaar Pulamvendra","t2":"Punmaiyil Kaatchi Yavar"},{"n":175,"c":18,"ct":"வெஃகாமை","ce":"On Non-Coveting","l1":"அஃகி அகன்ற அறிவென்னாம் யார்மாட்டும்","l2":"வெஃகி வெறிய செயின்.","mv":"யாரிடத்திலும் பொருளைக் கவர விரும்பிப் பொருந்தாதவற்றைச் செய்தால், நுட்பமானதாய் விரிவுடையதாய் வளர்ந்த அறிவால் பயன் என்ன?","ex":"What is the advantage of extensive and accurate knowledge if a man through covetousness act senselessly towards all ?","t1":"Aqki Akandra Arivennaam Yaarmaattum","t2":"Veqki Veriya Seyin"},{"n":176,"c":18,"ct":"வெஃகாமை","ce":"On Non-Coveting","l1":"அருள்வெஃகி ஆற்றின்கண் நின்றான் பொருள்வெஃகிப்","l2":"பொல்லாத சூழக் கெடும்.","mv":"அருளை விரும்பி அறநெறியில் நின்றவன், பிறனுடைய பொருளை விரும்பிப் பொல்லாத குற்றங்களை எண்ணினால் கெடுவான்.","ex":"If he, who through desire of the virtue of kindness abides in the domestic state ie, the path in which it may be obtained, covet (the property of others) and think of evil methods (to obtain it), he will perish","t1":"Arulveqki Aatrinkan Nindraan Porulveqkip","t2":"Pollaadha Soozhak Ketum"},{"n":177,"c":18,"ct":"வெஃகாமை","ce":"On Non-Coveting","l1":"வேண்டற்க வெஃகியாம் ஆக்கம் விளைவயின்","l2":"மாண்டற் கரிதாம் பயன்.","mv":"பிறர் பொருளைக் கவர விரும்புவதால் ஆகும் ஆக்கத்தை விரும்பாதிருக்க வேண்டும்; அது பயன் விளைவிக்கும்போது அப்பயன் நன்மையாவது அரிதாகும்.","ex":"Desire not the gain of covetousness In the enjoyment of its fruits there is no glory","t1":"Ventarka Veqkiyaam Aakkam Vilaivayin","t2":"Maantar Karidhaam Payan"},{"n":178,"c":18,"ct":"வெஃகாமை","ce":"On Non-Coveting","l1":"அஃகாமை செல்வத்திற்கு யாதெனின் வெஃகாமை","l2":"வேண்டும் பிறன்கைப் பொருள்.","mv":"ஒருவனுடைய செல்வத்திற்குக் குறைவு நேராதிருக்க வழி எது என்றால், அவன் பிறனுடைய கைப்பொருளை விரும்பாதிருத்தலாகும்.","ex":"If it is weighed, \"what is the indestructibility of wealth,\" it is freedom from covetousness","t1":"Aqkaamai Selvaththirku Yaadhenin Veqkaamai","t2":"Ventum Pirankaip Porul"},{"n":179,"c":18,"ct":"வெஃகாமை","ce":"On Non-Coveting","l1":"அறனறிந்து வெஃகா அறிவுடையார்ச் சேரும்","l2":"திறன்அறிந் தாங்கே திரு.","mv":"அறம் இஃது என்று அறிந்து பிறர் பொருளை விரும்பாத அறிவுடையாரைத் திருமகள் தான் சேரும் திறன் அறிந்து அதற்கு ஏற்றவாறு சேர்வாள்.","ex":"Lakshmi, knowing the manner (in which she may approach) will immediately come to those wise men who, knowing that it is virtue, covet not the property of others","t1":"Aranarindhu Veqkaa Arivutaiyaarch Cherum","t2":"Thiranarin Thaange Thiru"},{"n":180,"c":18,"ct":"வெஃகாமை","ce":"On Non-Coveting","l1":"இறலீனும் எண்ணாது வெஃகின் விறல்ஈனும்","l2":"வேண்டாமை என்னுஞ் செருக்கு.","mv":"வி‌ளைவை எண்ணாமல் பிறர் பொருளை விரும்பினால் அஃது அழிவைத் தரும்; அப்பொருளை விரும்பாமல் வாழும் பெருமை வெற்றியைத் தரும்.","ex":"To covet (the wealth of another) regardless of consequences will bring destruction That greatness (of mind) which covets not will give victory","t1":"Iraleenum Ennaadhu Veqkin Viraleenum","t2":"Ventaamai Ennunj Cherukku"},{"n":181,"c":19,"ct":"புறங்கூறாமை","ce":"On Not Back-Biting","l1":"அறங்கூறான் அல்ல செயினும் ஒருவன்","l2":"புறங்கூறான் என்றல் இனிது.","mv":"ஒருவன் அறத்தைப் போற்றிக் கூறாதவனாய் அறமல்லாதவற்றைச் செய்தாலும், மற்றவனைப் பற்றிப் புறங்கூறாமல் இருக்கிறான் என்று சொல்லப்படுதல் நல்லது.","ex":"Though one do not even speak of virtue and live in sin, it will be well if it be said of him \"he does not backbite.\"","t1":"Arangooraan Alla Seyinum Oruvan","t2":"Purangooraan Endral Inidhu"},{"n":182,"c":19,"ct":"புறங்கூறாமை","ce":"On Not Back-Biting","l1":"அறனழீஇ அல்லவை செய்தலின் தீதே","l2":"புறனழீஇப் பொய்த்து நகை.","mv":"அறத்தை அழித்துப் பேசி அறமல்லாதவைகளைச் செய்வதை விட, ஒருவன் இல்லாதவிடத்தில் அவனைப் பழித்துப் பேசி நேரில் பொய்யாக முகமலர்ந்து பேசுதல் தீமையாகும்.","ex":"To smile deceitfully (in another's presence) after having reviled him to his destruction (behind his back) is a greater evil than the commission of (every other) sin and the destruction of (every) virtue","t1":"Aranazheei Allavai Seydhalin Theedhe","t2":"Puranazheeip Poiththu Nakai"},{"n":183,"c":19,"ct":"புறங்கூறாமை","ce":"On Not Back-Biting","l1":"புறங்கூறிப் பொய்த்துயிர் வாழ்தலின் சாதல்","l2":"அறங்கூற்றும் ஆக்கத் தரும்.","mv":"புறங்கூறிப் பொய்யாக நடந்து உயிர் வாழ்தலை விட, அவ்வாறு செய்யாமல் வறுமையுற்று இறந்து விடுதல், அறநூல்கள் சொல்லும் ஆக்கத்தைத் தரும்‌‌.","ex":"Death rather than life will confer upon the deceitful backbiter the profit which (the treatises on) virtue point out","t1":"Purangoorip Poiththuyir Vaazhdhalin Saadhal","t2":"Arangootrum Aakkath Tharum"},{"n":184,"c":19,"ct":"புறங்கூறாமை","ce":"On Not Back-Biting","l1":"கண்ணின்று கண்ணறச் சொல்லினும் சொல்லற்க","l2":"முன்னின்று பின்நோக்காச் சொல்.","mv":"எதிரே நின்று கண்ணோ‌ட்டம் இல்லாமல் கடுமையாகச் சொன்னாலும் சொல்லலாம்; நேரில் இல்லாதபோது பின் விளைவை ஆராயாத சொல்லைச் சொல்லக்கூடாது.","ex":"Though you speak without kindness before another's face speak not in his absence words which regard not the evil subsequently resulting from it","t1":"Kannindru Kannarach Chollinum Sollarka","t2":"Munnindru Pinnokkaach Chol"},{"n":185,"c":19,"ct":"புறங்கூறாமை","ce":"On Not Back-Biting","l1":"அறஞ்சொல்லும் நெஞ்சத்தான் அன்மை புறஞ்சொல்லும்","l2":"புன்மையாற் காணப் படும்.","mv":"அறத்தை நல்லதென்று போற்றும் நெஞ்சம் இல்லாததன்மை, ஒருவன் மற்றவனைப் பற்றிப் புறங்கூறுகின்ற சிறுமையால் காணப்படும்.","ex":"The emptiness of that man's mind who (merely) praises virtue will be seen from the meanness of reviling another behind his back","t1":"Aranjollum Nenjaththaan Anmai Puranjollum","t2":"Punmaiyaar Kaanap Patum"},{"n":186,"c":19,"ct":"புறங்கூறாமை","ce":"On Not Back-Biting","l1":"பிறன்பழி கூறுவான் தன்பழி யுள்ளும்","l2":"திறன்தெரிந்து கூறப் படும்.","mv":"மற்றவனைப் பற்றிப் புறங்கூறுகின்றவன், அவனுடைய பழிகள் பலவற்றிலும் நோகத்தக்கவை ஆராய்ந்து கூறிப் பிறரால் பழிக்கப்படுவான்.","ex":"The character of the faults of that man who publishes abroad the faults of others will be sought out and published","t1":"Piranpazhi Kooruvaan Thanpazhi Yullum","t2":"Thirandherindhu Koorap Patum"},{"n":187,"c":19,"ct":"புறங்கூறாமை","ce":"On Not Back-Biting","l1":"பகச்சொல்லிக் கேளிர்ப் பிரிப்பர் நகச்சொல்லி","l2":"நட்பாடல் தேற்றா தவர்.","mv":"மகிழும்படியாகப் பேசி நட்புக் கொள்ளுதல் நன்மை என்று தெளியாதவர் தம்மை விட்டு நீங்கும்படியாகப் புறம் கூறி நண்பரையும் பிரித்து விடுவர்.","ex":"Those who know not to live in friendship with amusing conversation will by back-biting estrange even their relatives","t1":"Pakachchollik Kelirp Pirippar Nakachcholli","t2":"Natpaatal Thetraa Thavar"},{"n":188,"c":19,"ct":"புறங்கூறாமை","ce":"On Not Back-Biting","l1":"துன்னியார் குற்றமும் தூற்றும் மரபினார்","l2":"என்னைகொல் ஏதிலார் மாட்டு.","mv":"நெருங்கிப் பழகியவரின் குற்றத்தையும் புறங்கூறித் தூற்றும் இயல்புடையவர், பழகாத அயலாரிடத்து என்ன செய்வாரோ?","ex":"What will those not do to strangers whose nature leads them to publish abroad the faults of their intimate friends ?","t1":"Thunniyaar Kutramum Thootrum Marapinaar","t2":"Ennaikol Edhilaar Maattu"},{"n":189,"c":19,"ct":"புறங்கூறாமை","ce":"On Not Back-Biting","l1":"அறன்நோக்கி ஆற்றுங்கொல் வையம் புறன்நோக்கிப்","l2":"புன்சொல் உரைப்பான் பொறை.","mv":"ஒருவர் நேரில் இல்லாதது கண்டு பழிச்‌சொல் கூறுவோனுடைய உடல் பாரத்தை, இவனையும் சுமப்பதே எனக்கு அறம் என்று கருதி நிலம் சுமக்கின்றதோ?","ex":"The world through charity supports the weight of those who reproach others observing their absence","t1":"Arannokki Aatrungol Vaiyam Purannokkip","t2":"Punsol Uraippaan Porai"},{"n":190,"c":19,"ct":"புறங்கூறாமை","ce":"On Not Back-Biting","l1":"ஏதிலார் குற்றம்போல் தங்குற்றங் காண்கிற்பின்","l2":"தீதுண்டோ மன்னும் உயிர்க்கு.","mv":"அயலாருடைய குற்றத்தைக் காண்பது போல் தம் குற்றத்தையும் காண வல்லவரானால், நிலைபெற்ற உயிர் வாழ்க்கைக்குத் துன்பம் உண்ட‌ோ?","ex":"If they observed their own faults as they observe the faults of others, would any evil happen to men ?","t1":"Edhilaar Kutrampol Thangutrang Kaankirpin","t2":"Theedhunto Mannum Uyirkku"},{"n":191,"c":20,"ct":"பயனில சொல்லாமை","ce":"On Frivolity of Speech","l1":"பல்லார் முனியப் பயனில சொல்லுவான்","l2":"எல்லாரும் எள்ளப் படும்.","mv":"கேட்டவர் பலரும் வெறுக்கும் படியாகப் பயனில்லாத சொற்களைச் சொல்லுகின்றவன், எல்லாராலும் இகழப்படுவான்","ex":"He who to the disgust of many speaks useless things will be despised by all","t1":"Pallaar Muniyap Payanila Solluvaan","t2":"Ellaarum Ellap Patum"},{"n":192,"c":20,"ct":"பயனில சொல்லாமை","ce":"On Frivolity of Speech","l1":"பயனில பல்லார்முன் சொல்லல் நயனில","l2":"நட்டார்கண் செய்தலிற் றீது.","mv":"பலர் முன்னே பயனில்லாத சொற்களைச் சொல்லுதல், நண்பரிடத்தில் அறம் இல்லா செயல்களைச் செய்தலை விடத் தீமையானதாகும்.","ex":"To speak useless things in the presence of many is a greater evil than to do unkind things towards friends","t1":"Payanila Pallaarmun Sollal Nayanila","t2":"Nattaarkan Seydhalir Reedhu"},{"n":193,"c":20,"ct":"பயனில சொல்லாமை","ce":"On Frivolity of Speech","l1":"நயனிலன் என்பது சொல்லும் பயனில","l2":"பாரித் துரைக்கும் உரை.","mv":"ஒருவன் பயனில்லா பொருள்களைப் பற்றி விரிவாகச் சொல்லும் சொற்கள், அவன் அறம் இல்லாதவன் என்பதை அறிவிக்கும்.","ex":"That conversation in which a man utters forth useless things will say of him \"he is without virtue.\"","t1":"Nayanilan Enpadhu Sollum Payanila","t2":"Paarith Thuraikkum Urai"},{"n":194,"c":20,"ct":"பயனில சொல்லாமை","ce":"On Frivolity of Speech","l1":"நயன்சாரா நன்மையின் நீக்கும் பயன்சாராப்","l2":"பண்பில்சொல் பல்லா ரகத்து.","mv":"பயனோடு பொருந்தாத பண்பு இல்லாத சொற்களைப் பலரிடத்தும் சொல்லுதல், அறத்தோடு பொருந்தாமல் நன்மையிலிருந்து நீங்கச் செய்யும்.","ex":"The words devoid of profit or pleasure which a man speaks will, being inconsistent with virtue,","t1":"Nayansaaraa Nanmaiyin Neekkum Payansaaraap","t2":"Panpilsol Pallaa Rakaththu"},{"n":195,"c":20,"ct":"பயனில சொல்லாமை","ce":"On Frivolity of Speech","l1":"சீர்மை சிறப்பொடு நீங்கும் பயனில","l2":"நீர்மை யுடையார் சொலின்.","mv":"பயனில்லாத சொற்களை நல்ல பண்பு உடையவர் சொல்லுவாரானால், அவனுடைய மேம்பாடு அவர்க்குரிய மதிப்போடு நீங்கிவிடும்.","ex":"If the good speak vain words their eminence and excellence will leave them","t1":"Seermai Sirappotu Neengum Payanila","t2":"Neermai Yutaiyaar Solin"},{"n":196,"c":20,"ct":"பயனில சொல்லாமை","ce":"On Frivolity of Speech","l1":"பயனில் சொல் பராட்டு வானை மகன்எனல்","l2":"மக்கட் பதடி யெனல்.","mv":"பயனில்லாத சொற்களைப் பலமுறையும் சொல்லுகின்ற ஒருவனை மனிதன் என்று சொல்லக்கூடாது, மக்களுள் பதர் என்று சொல்லவேண்டும்.","ex":"Call not him a man who parades forth his empty words Call him the chaff of men","t1":"Payanil Sol Paaraattu Vaanai","t2":"Makanenal Makkat Padhati Yenal"},{"n":197,"c":20,"ct":"பயனில சொல்லாமை","ce":"On Frivolity of Speech","l1":"நயனில சொல்லினுஞ் சொல்லுக சான்றோர்","l2":"பயனில சொல்லாமை நன்று.","mv":"அறம் இல்லாதவற்றைச் சொன்னாலும் சொல்லலாம், சான்றோர் பயன் இல்லாத சொற்களைச் சொல்லாமல் இருத்தல் நன்மையாகும்.","ex":"Let the wise if they will, speak things without excellence; it will be well for them not to speak useless things","t1":"Nayanila Sollinunj Cholluka Saandror","t2":"Payanila Sollaamai Nandru"},{"n":198,"c":20,"ct":"பயனில சொல்லாமை","ce":"On Frivolity of Speech","l1":"அரும்பயன் ஆயும் அறிவினார் சொல்லார்","l2":"பெரும்பயன் இல்லாத சொல்.","mv":"அருமையான பயன்களை ஆராயவல்ல அறிவை உடைய அறிஞர், மிக்க பயன் இல்லாத சொற்களை ஒருபோதும் சொல்லமாட்டார்","ex":"The wise who seek after rare pleasures will not speak words that have not much weight in them","t1":"Arumpayan Aayum Arivinaar Sollaar","t2":"Perumpayan Illaadha Sol"},{"n":199,"c":20,"ct":"பயனில சொல்லாமை","ce":"On Frivolity of Speech","l1":"பொருள்தீர்ந்த பொச்சாந்துஞ் சொல்லார் மருள்தீர்ந்த","l2":"மாசறு காட்சி யவர்.","mv":"மயக்கத்திலிருந்து தெளிந்த மாசற்ற அறிவை உடையவர், பயன் நீங்கிய சொற்களை ஒருகால் மறந்தும் சொல்லமாட்டார்.","ex":"Those wise men who are without faults and are freed from ignorance will not even forgetfully speak things that profit not","t1":"Poruldheerndha Pochchaandhunj Chollaar Maruldheerndha","t2":"Maasaru Kaatchi Yavar"},{"n":200,"c":20,"ct":"பயனில சொல்லாமை","ce":"On Frivolity of Speech","l1":"சொல்லுக சொல்லிற் பயனுடைய சொல்லற்க","l2":"சொல்லிற் பயனிலாச் சொல்.","mv":"சொற்களில் பயன் உடைய சொற்களை மட்டுமே சொல்லவேண்டும், பயன் இல்லாதவைகளாகிய சொற்களை சொல்லவே கூடாது.","ex":"Speak what is useful, and speak not useless words","t1":"Solluka Sollir Payanutaiya Sollarka","t2":"Sollir Payanilaach Chol"},{"n":201,"c":21,"ct":"தீவினையச்சம்","ce":"On Fear of Evil Deeds","l1":"தீவினையார் அஞ்சார் விழுமியார் அஞ்சுவர்","l2":"தீவினை என்னும் செருக்கு.","mv":"தீயவை செய்தலாகிய செருக்கைத் தீவினை உடைய பாவிகள் அஞ்சார், தீவினை இல்லாத மேலோர் மட்டுமே அஞ்சுவர்.","ex":"Those who have experience of evil deeds will not fear, but the excellent will fear the pride of sin","t1":"Theevinaiyaar Anjaar Vizhumiyaar Anjuvar","t2":"Theevinai Ennum Serukku"},{"n":202,"c":21,"ct":"தீவினையச்சம்","ce":"On Fear of Evil Deeds","l1":"தீயவை தீய பயத்தலால் தீயவை","l2":"தீயினும் அஞ்சப் படும்.","mv":"தீயசெயல்கள் தீமையை விளைவிக்கும் தன்மை உடையனவாக இருத்தலால், அத் தீயச் செயல்கள் தீயைவிடக் கொடியனவாகக் கருதி அஞ்சப்படும்.","ex":"Because evil produces evil, therefore should evil be feared more than fire","t1":"Theeyavai Theeya Payaththalaal Theeyavai","t2":"Theeyinum Anjap Patum"},{"n":203,"c":21,"ct":"தீவினையச்சம்","ce":"On Fear of Evil Deeds","l1":"அறிவினுள் எல்லாந் தலையென்ப தீய","l2":"செறுவார்க்கும் செய்யா விடல்.","mv":"தம்மை வருத்துவோர்க்கும் தீய செயல்களைச் செய்யாமலிருத்தலை, அறிவு எல்லாவற்றிலும் தலையான அறிவு என்று கூறுவர்.","ex":"So shalt thou wisdom's highest law, 'tis said, fulfil","t1":"Arivinul Ellaan Thalaiyenpa Theeya","t2":"Seruvaarkkum Seyyaa Vital"},{"n":204,"c":21,"ct":"தீவினையச்சம்","ce":"On Fear of Evil Deeds","l1":"மறந்தும் பிறன்கேடு சூழற்க சூழின்","l2":"அறஞ்சூழம் சூழ்ந்தவன் கேடு.","mv":"பிறனுக்கு கேட்டைத் தரும் தீய செயல்களை ஒருவன் மறந்தும் கூட எண்ணக்கூடாது, எண்ணினால் எண்ணியவனுக்கு கேடு விளையுமாறு அறம் எண்ணும்.","ex":"Even though forgetfulness meditate not the ruin of another Virtue will meditate the ruin of him who thus meditates","t1":"Marandhum Piranketu Soozharka Soozhin","t2":"Aranjoozham Soozhndhavan Ketu"},{"n":205,"c":21,"ct":"தீவினையச்சம்","ce":"On Fear of Evil Deeds","l1":"இலன் என்று தீயவை செய்யற்க செய்யின்","l2":"இலனாகும் மற்றும் பெயர்த்து.","mv":"யான் வறியவன் என்று நினைத்துத் தீய செயல்களைச் செய்யக்கூடாது, செய்தால் மீண்டும் வறியவன் ஆகி வருந்துவான்.","ex":"Commit not evil, saying, \"I am poor\": if you do, you will become poorer still","t1":"Ilan Endru Theeyavai Seyyarka","t2":"Seyyin Ilanaakum Matrum Peyarththu"},{"n":206,"c":21,"ct":"தீவினையச்சம்","ce":"On Fear of Evil Deeds","l1":"தீப்பால தான்பிறர்கண் செய்யற்க நோய்ப்பால","l2":"தன்னை அடல்வேண்டா தான்.","mv":"துன்பம் செய்யும் தீவினைகள் தன்னை வருத்துதலை விரும்பாதவன், தீயசெயல்களைத் தான் பிறருக்குச் செய்யாமலிருக்க வேண்டும்.","ex":"Let him not do evil to others who desires not that sorrows should pursue him","t1":"Theeppaala Thaanpirarkan Seyyarka Noippaala","t2":"Thannai Atalventaa Thaan"},{"n":207,"c":21,"ct":"தீவினையச்சம்","ce":"On Fear of Evil Deeds","l1":"எனைப்பகை யுற்றாரும் உய்வர் வினைப்பகை","l2":"வீயாது பின்சென்று அடும்.","mv":"எவ்வளவு கொடிய பகை உடையவரும் தப்பி வாழ முடியும், ஆனால் தீயவை செய்தால் வரும் தீவினையாகிய பகை நீங்காமல் பின் சென்று வருத்தும்.","ex":"However great be the enmity men have incurred they may still live The enmity of sin will incessantly pursue and kill","t1":"Enaippakai Yutraarum Uyvar Vinaippakai","t2":"Veeyaadhu Pinsendru Atum"},{"n":208,"c":21,"ct":"தீவினையச்சம்","ce":"On Fear of Evil Deeds","l1":"தீயவை செய்தார் கெடுதல் நிழல்தன்னை","l2":"வீயாது அஇஉறைந் தற்று.","mv":"தீய செயல்களைச் செய்தவர் கேட்டை அடைதல், ஒருவனுடைய நிழல் அவனை விடாமல் வந்து அடியில் தங்கியிருத்தலைப் போன்றது.","ex":"Destruction will dwell at the heels of those who commit evil even as their shadow that leaves them not","t1":"Theeyavai Seydhaar Ketudhal Nizhaldhannai","t2":"Veeyaadhu Atiurain Thatru"},{"n":209,"c":21,"ct":"தீவினையச்சம்","ce":"On Fear of Evil Deeds","l1":"தன்னைத்தான் காதல னாயின் எனைத்தொன்றும்","l2":"துன்னற்க தீவினைப் பால்.","mv":"ஒருவன் தன்னைத் தான் விரும்பி வாழ்பவனாயின், தீய செயலாகிய பகுதியை எவ்வளவு சிறியதாயினும் பொருந்தாமல் நீங்க வேண்டும்.","ex":"If a man love himself, let him not commit any sin however small","t1":"Thannaiththaan Kaadhala Naayin Enaiththondrum","t2":"Thunnarka Theevinaip Paal"},{"n":210,"c":21,"ct":"தீவினையச்சம்","ce":"On Fear of Evil Deeds","l1":"அருங்கேடன் என்பது அறிக மருங்கோடித்","l2":"தீவினை செய்யான் எனின்.","mv":"ஒருவன் தவறான நெறியில் சென்று தீயசெயல் செய்யாதிருப்பானானால் அவன் கேடு இல்லாதவன் என்று அறியலாம்.","ex":"Know ye that he is freed from destruction who commits no evil, going to neither side of the right path","t1":"Arungetan Enpadhu Arika Marungotith","t2":"Theevinai Seyyaan Enin"},{"n":211,"c":22,"ct":"ஒப்புரவறிதல்","ce":"On Decorum","l1":"கைம்மாறு வேண்டா கடப்பாடு மாரிமாட்டு","l2":"என் ஆற்றுங் கொல்லோ உலகு.","mv":"இந்த உலகத்தார் மழைக்கு என்ன கைமாறு செய்கின்றனர்;, மழை போன்றவர் செய்யும் உதவிகளும் கைமாறு வேண்டாதவை.","ex":"Benevolence seeks not a return. What does the world give back to the clouds ?","t1":"Kaimmaaru Ventaa Katappaatu Maarimaattu","t2":"En Aatrung Kollo Ulaku"},{"n":212,"c":22,"ct":"ஒப்புரவறிதல்","ce":"On Decorum","l1":"தாளாற்றித் தந்த பொருளெல்லாம் தக்கார்க்கு","l2":"வேளாண்மை செய்தற் பொருட்டு.","mv":"ஒப்புரவாளன் தன்னால் இயன்ற முயற்சி செய்து சேர்த்த பொருள் எல்லாம் தக்கவர்க்கு உதவி செய்வதற்கே ஆகும்.","ex":"All the wealth acquired with perseverance by the worthy is for the exercise of benevolence","t1":"Thaalaatrith Thandha Porulellaam Thakkaarkku","t2":"Velaanmai Seydhar Poruttu"},{"n":213,"c":22,"ct":"ஒப்புரவறிதல்","ce":"On Decorum","l1":"புத்தே ளுலகத்தும் ஈண்டும் பெறலரிதே","l2":"ஒப்புரவின் நல்ல பிற.","mv":"பிறர்க்கு உதவி செய்து வாழும் ஒப்புரவைப் போல நல்லனவாகிய வேறு அறப்பகுதிகளைத் தேவருலகத்திலும் இவ்வுலகத்திலும் பெறுதல் இயலாது.","ex":"It is difficult to obtain another good equal to benevolence either in this world or in that of the gods","t1":"Puththe Lulakaththum Eentum Peralaridhe","t2":"Oppuravin Nalla Pira"},{"n":214,"c":22,"ct":"ஒப்புரவறிதல்","ce":"On Decorum","l1":"ஒத்த தறவோன் உயிர்வாழ்வான் மற்றையான்","l2":"செத்தாருள் வைக்கப் படும்.","mv":"ஒப்புரவை அறிந்து போற்றிப் பிறர்க்கு உதவியாக வாழ்கின்றவன் உயிர்வாழ்கின்றவன் ஆவான், மற்றவன் செத்தவருள் சேர்த்துக் கருதப்படுவான்.","ex":"He truly lives who knows (and discharges) the proper duties (of benevolence) He who knows them not will be reckoned among the dead","t1":"Oththa Tharavon Uyirvaazhvaan Matraiyaan","t2":"Seththaarul Vaikkap Patum"},{"n":215,"c":22,"ct":"ஒப்புரவறிதல்","ce":"On Decorum","l1":"ஊருணி நீர்நிறைந் தற்றே உலகவாம்","l2":"பேரறி வாளன் திரு.","mv":"ஒப்புரவினால் உலகம் வாழுமாறு விரும்பும் பேரறிவாளியின் செல்வம், ஊரார் நீருண்ணும் குளம் நீரால் நிறைந்தாற் போன்றது.","ex":"The wealth of that man of eminent knowledge who desires to exercise the benevolence approved of by the world, is like the full waters of a city-tank","t1":"Ooruni Neernirain Thatre Ulakavaam","t2":"Perari Vaalan Thiru"},{"n":216,"c":22,"ct":"ஒப்புரவறிதல்","ce":"On Decorum","l1":"பயன்மரம் உள்ளூர்ப் பழுத்தற்றால் செல்வம்","l2":"நயனுடை யான்கண் படின்.","mv":"ஒப்புராவாகிய நற்பண்பு உடையவனிடம் செல்வம் சேர்ந்தால் அஃது ஊரின் நடுவே உள்ள பயன் மிகுந்த மரம் பழங்கள் பழுத்தாற் போன்றது.","ex":"The wealth of a man (possessed of the virtue) of benevolence is like the ripening of a fruitful tree in the midst of a town","t1":"Payanmaram Ulloorp Pazhuththatraal Selvam","t2":"Nayanutai Yaankan Patin"},{"n":217,"c":22,"ct":"ஒப்புரவறிதல்","ce":"On Decorum","l1":"மருந்தாகித் தப்பா மரத்தற்றால் செல்வம்","l2":"பெருந்தகை யான்கண் படின்.","mv":"ஒப்புரவாகிய பெருந்தகைமை உடையவனிடத்து செல்வம் சேர்ந்தால் அஃது எல்லா உறுப்புகளுக்கும் மருந்தாகிப் பயன்படத் தவறாத மரம் போன்றது.","ex":"If wealth be in the possession of a man who has the great excellence (of benevolence), it is like a tree which as a medicine is an infallible cure for disease","t1":"Marundhaakith Thappaa Maraththatraal Selvam","t2":"Perundhakai Yaankan Patin"},{"n":218,"c":22,"ct":"ஒப்புரவறிதல்","ce":"On Decorum","l1":"இடனில் பருவத்தும் ஒப்புரவிற்கு ஒல்கார்","l2":"கடனறி காட்சி யவர்.","mv":"ஒப்புரவு அறிந்து ஒழுதலாகியத் தன் கடமை அறிந்த அறிவை உடையவர், செல்வ வளம் இல்லாத காலத்திலும் ஒப்புரவுக்குத் தளர மாட்டார்.","ex":"The wise who know what is duty will not scant their benevolence even when they are without wealth","t1":"Itanil Paruvaththum Oppuravirku Olkaar","t2":"Katanari Kaatchi Yavar"},{"n":219,"c":22,"ct":"ஒப்புரவறிதல்","ce":"On Decorum","l1":"நயனுடையான் நல்கூர்ந்தா னாதல் செயும்நீர","l2":"செய்யாது அமைகலா வாறு.","mv":"ஒப்புரவாகிய நற்பண்பு உடையவன் வறுமை உடையவனாதல், செய்யத்தக்க உதவிகளைச் செய்யாமல் வருந்துகின்ற தன்மையாகும்.","ex":"The poverty of a benevolent man, is nothing but his inability to exercise the same","t1":"Nayanutaiyaan Nalkoorndhaa Naadhal Seyumneera","t2":"Seyyaadhu Amaikalaa Vaaru"},{"n":220,"c":22,"ct":"ஒப்புரவறிதல்","ce":"On Decorum","l1":"ஒப்புரவி னால்வரும் கேடெனின் அஃதொருவன்","l2":"விற்றுக்கோள் தக்க துடைத்து.","mv":"ஒப்புரவால் கேடு வரும் என்றால் அக் கேடு ஒருவன் தன்னை விற்றாவது வாங்கிக்கொள்ளும் தகுதி உடையதாகும்.","ex":"If it be said that loss will result from benevolence, such loss is worth being procured even by the sale of one's self","t1":"Oppuravi Naalvarum Ketenin Aqdhoruvan","t2":"Vitrukkol Thakka Thutaiththu"},{"n":221,"c":23,"ct":"ஈகை","ce":"On Liberality","l1":"வறியார்க்கொன்று ஈவதே ஈகைமற் றெல்லாம்","l2":"குறியெதிர்ப்பை நீர துடைத்து.","mv":"வறியவர்க்கு ஒரு பொருளைக் கொடுப்பதே ஈகை எனப்படுவது, மற்றவர்க்குக் கொடுப்பதெல்லாம் பயன் எதிர்பார்த்து கொடுக்கும் தன்மை உடையது.","ex":"To give to the destitute is true charity All other gifts have the nature of (what is done for) a measured return","t1":"Variyaarkkondru Eevadhe Eekaimar Rellaam","t2":"Kuriyedhirppai Neera Thutaiththu"},{"n":222,"c":23,"ct":"ஈகை","ce":"On Liberality","l1":"நல்லாறு எனினும் கொளல்தீது மேலுலகம்","l2":"இல்லெனினும் ஈதலே நன்று.","mv":"பிறரிடம் பொருள் பெற்றுக் கொள்ளுதல் நல்ல நெறி என்றாலும் கொள்ளல் தீமையானது, மேலுலகம் இல்லை என்றாலும் பிறக்குக் கொடுப்பதே சிறந்தது.","ex":"To beg is evil, even though it were said that it is a good path (to heaven) To give is good, even though it were said that those who do so cannot obtain heaven","t1":"Nallaaru Eninum Kolaldheedhu Melulakam","t2":"Illeninum Eedhale Nandru"},{"n":223,"c":23,"ct":"ஈகை","ce":"On Liberality","l1":"இலனென்னும் எவ்வம் உரையாமை ஈதல்","l2":"குலனுடையான் கண்ணே யுள.","mv":"யான் வறியவன் என்னும் துன்பச் சொல்லை ஒருவன் உரைப்பதற்கு முன் அவனுக்கு கொடுக்கும் தன்மை, நல்ல குடி பிறப்பு உடையவனிடம் உண்டு.","ex":"(Even in a low state) not to adopt the mean expedient of saying \"I have nothing,\" but to give, is the characteristic of the mad of noble birth","t1":"Ilanennum Evvam Uraiyaamai Eedhal","t2":"Kulanutaiyaan Kanne Yula"},{"n":224,"c":23,"ct":"ஈகை","ce":"On Liberality","l1":"இன்னாது இரக்கப் படுதல் இரந்தவர்","l2":"இன்முகங் காணும் அளவு.","mv":"பொருள் வேண்டும் என்ற இரந்தவரின் மகிழ்ந்த முகத்தைக் காணும் வரைக்கும் (இரத்தலைப் போலவே ) இரந்து கேட்கப்படுவதும் துன்பமானது.","ex":"To see men begging from us in disagreeable, until we see their pleasant countenance","t1":"Innaadhu Irakkap Patudhal Irandhavar","t2":"Inmukang Kaanum Alavu"},{"n":225,"c":23,"ct":"ஈகை","ce":"On Liberality","l1":"ஆற்றுவார் ஆற்றல் பசிஆற்றல் அப்பசியை","l2":"மாற்றுவார் ஆற்றலின் பின்.","mv":"தவ வலிமை உடையவரின் வலிமை பசியை பொறுத்துக் கொள்ளலாகும், அதுவும் அப் பசியை உணவு கொடுத்து மாற்றுகின்றவரின் ஆற்றலுக்குப் பிற்பட்டதாகும்.","ex":"The power of those who perform penance is the power of enduring hunger It is inferior to the power of those who remove the hunger (of others)","t1":"Aatruvaar Aatral Pasiaatral Appasiyai","t2":"Maatruvaar Aatralin Pin"},{"n":226,"c":23,"ct":"ஈகை","ce":"On Liberality","l1":"அற்றார் அழிபசி தீர்த்தல் அஃதொருவன்","l2":"பெற்றான் பொருள்வைப் புழி.","mv":"வறியவரின் கடும்பசியைத் தீர்க்க வேண்டும் அதுவே பொருள் பெற்ற ஒருவன் அப் பொருளைத் தனக்குப் பிற்காலத்தில் உதவுமாறு சேர்த்து வைக்கும் இடமாகும்.","ex":"The removal of the killing hunger of the poor is the place for one to lay up his wealth","t1":"Atraar Azhipasi Theerththal Aqdhoruvan","t2":"Petraan Porulvaip Puzhi"},{"n":227,"c":23,"ct":"ஈகை","ce":"On Liberality","l1":"பாத்தூண் மரீஇ யவனைப் பசியென்னும்","l2":"தீப்பிணி தீண்டல் அரிது.","mv":"தான் பெற்ற உணவை பலரோடும் பகிர்ந்து உண்ணும் பழக்கம் உடையவனை பசி என்று கூறப்படும் தீயநோய் அணுகுதல் இல்லை.","ex":"The fiery disease of hunger shall never touch him who habitually distributes his food to others","t1":"Paaththoon Mareei Yavanaip Pasiyennum","t2":"Theeppini Theental Aridhu"},{"n":228,"c":23,"ct":"ஈகை","ce":"On Liberality","l1":"ஈத்துவக்கும் இன்பம் அறியார்கொல் தாமுடைமை","l2":"வைத்திழக்கும் வன்க ணவர்.","mv":"தாம் சேர்த்து வைத்துள்ள பொருளைப் பிறருக்குக் கொடுக்காமல் வைத்திருந்து பின் இழந்து விடும் வன் கண்மை உடையவர், பிறர்க்கு கொடுத்து மகிழும் மகிழ்ச்சியை அறியாரோ.","ex":"Do the hard-eyed who lay up and lose their possessions not know the happiness which springs from the pleasure of giving ?","t1":"Eeththuvakkum Inpam Ariyaarkol Thaamutaimai","t2":"Vaiththizhakkum Vanka Navar"},{"n":229,"c":23,"ct":"ஈகை","ce":"On Liberality","l1":"இரத்தலின் இன்னாது மன்ற நிரப்பிய","l2":"தாமே தமியர் உணல்.","mv":"பொருளின் குறைபாட்டை நிரப்புவதற்க்காக உள்ளதைப் பிறர்க்கு ஈயாமல் தாமே தமியராய் உண்பது வறுமையால் இறப்பதை விடத் துன்பமானது.","ex":"Solitary and unshared eating for the sake of filling up one's own riches is certainly much more","t1":"Iraththalin Innaadhu Mandra Nirappiya","t2":"Thaame Thamiyar Unal"},{"n":230,"c":23,"ct":"ஈகை","ce":"On Liberality","l1":"சாதலின் இன்னாத தில்லை இனிததூஉம்","l2":"ஈதல் இயையாக் கடை.","mv":"சாவதை விடத் துன்பமானது வேறொன்றும் இல்லை, ஆனால் வறியவர்க்கு ஒரு பொருள் கொடுக்க முடியாதநிலை வந்தபோது அச் சாதலும் இனியதே ஆகும்.","ex":"Nothing is more unpleasant than death: yet even that is pleasant where charity cannot be exercised","t1":"Saadhalin Innaadha Thillai Inidhadhooum","t2":"Eedhal Iyaiyaak Katai"},{"n":231,"c":24,"ct":"புகழ்","ce":"On Renown","l1":"ஈதல் இசைபட வாழ்தல் அதுவல்லது","l2":"ஊதியம் இல்லை உயிர்க்கு.","mv":"வறியவர்க்கு ஈதல் வேண்டும் அதனால் புகழ் உண்டாக வாழ வேண்டும், அப் புகழ் அல்லாமல் உயிர்க்கு ஊதியமானது வேறொன்றும் இல்லை.","ex":"Give to the poor and live with praise There is no greater profit to man than that","t1":"Eedhal Isaipata Vaazhdhal Adhuvalladhu","t2":"Oodhiyam Illai Uyirkku"},{"n":232,"c":24,"ct":"புகழ்","ce":"On Renown","l1":"உரைப்பார் உரைப்பவை எல்லாம் இரப்பார்க்கொன்று","l2":"ஈவார்மேல் நிற்கும் புகழ்.","mv":"புகழ்ந்து சொல்கின்றவர் சொல்பவை எல்லாம் வறுமையால் இரப்பவர்க்கு ஒரு பொருள் கொடுத்து உதவுகின்றவரின் மேல் நிற்கின்ற புகழேயாகும்.","ex":"Whatsoever is spoken in the world will abide as praise upon that man who gives alms to the poor","t1":"Uraippaar Uraippavai Ellaam Irappaarkkondru","t2":"Eevaarmel Nirkum Pukazh"},{"n":233,"c":24,"ct":"புகழ்","ce":"On Renown","l1":"ஒன்றா உலகத்து உயர்ந்த புகழல்லால்","l2":"பொன்றாது நிற்பதொன் றில்.","mv":"உயர்ந்த புகழ் அல்லாமல் உலகத்தில் ஒப்பற்ற ஒரு பொருளாக அழியாமல் நிலைநிற்க வல்லது வேறொன்றும் இல்லை.","ex":"There is nothing that stands forth in the world imperishable, except fame, exalted in solitary greatness","t1":"Ondraa Ulakaththu Uyarndha Pukazhallaal","t2":"Pondraadhu Nirpadhon Ril"},{"n":234,"c":24,"ct":"புகழ்","ce":"On Renown","l1":"நிலவரை நீள்புகழ் ஆற்றின் புலவரைப்","l2":"போற்றாது புத்தேள் உலகு.","mv":"நிலவுலகின் எல்லையில் நெடுங்காலம் நிற்கவல்ல புகழைச் செய்தால், வானுலகம் (அவ்வாறு புகழ் செய்தாரைப் போற்றுமே அல்லாமல்) தேவரைப் போற்றாது..","ex":"If one has acquired extensive fame within the limits of this earth, the world of the Gods will no longer praise those sages who have attained that world","t1":"Nilavarai Neelpukazh Aatrin Pulavaraip","t2":"Potraadhu Puththel Ulaku"},{"n":235,"c":24,"ct":"புகழ்","ce":"On Renown","l1":"நத்தம்போல் கேடும் உளதாகும் சாக்காடும்","l2":"வித்தகர்க் கல்லால் அரிது.","mv":"புகழுடம்பு மேம்படுதலாகும் வாழ்வில் கேடும், புகழ் நிலை நிற்பதாகும் சாவும் அறிவில் சிறந்தவர்க்கு அல்லாமல் மற்றவர்க்கு இல்லை.","ex":"Prosperity to the body of fame, resulting in poverty to the body of flesh and the stability to the former arising from the death of the latter, are achievable only by the wise","t1":"Naththampol Ketum Uladhaakum Saakkaatum","t2":"Viththakark Kallaal Aridhu"},{"n":236,"c":24,"ct":"புகழ்","ce":"On Renown","l1":"தோன்றின் புகழொடு தோன்றுக அஃதிலார்","l2":"தோன்றலின் தோன்றாமை நன்று.","mv":"ஒரு துறையில் முற்பட்டுத் தோன்றுவதானால் புகழோடு தோன்ற வேண்டும், அத்தகைய சிறப்பு இல்லாதவர் அங்குத் தோன்றுவதைவிடத் தோன்றாமலிருப்பதே நல்லது.","ex":"If you are born (in this world), be born with qualities conductive to fame From those who are destitute of them it will be better not to be born","t1":"Thondrin Pukazhotu Thondruka Aqdhilaar","t2":"Thondralin Thondraamai Nandru"},{"n":237,"c":24,"ct":"புகழ்","ce":"On Renown","l1":"புகழ்பட வாழாதார் தந்நோவார் தம்மை","l2":"இகழ்வாரை நோவது எவன்?","mv":"தமக்குப் புகழ் உண்டாகுமாறு வாழமுடியாதவர் தம்மைத் தாம் நொந்து கொள்ளாமல் தம்மை இகழ்கின்றவரை நொந்து கொள்ளக் காரணம் என்ன?","ex":"Why do those who cannot live with praise, grieve those who despise them, instead of grieving themselves for their own inability","t1":"Pukazhpata Vaazhaadhaar Thannovaar Thammai","t2":"Ikazhvaarai Novadhu Evan?"},{"n":238,"c":24,"ct":"புகழ்","ce":"On Renown","l1":"வசையென்ப வையத்தார்க் கெல்லாம் இசையென்னும்","l2":"எச்சம் பெறாஅ விடின்.","mv":"தமக்குப் பின் எஞ்சி நிற்பதாகியப் புகழைப் பெறாவிட்டால் உலகத்தார் எல்லார்க்கும் அத்தகைய வாழ்க்கை பழி என்று சொல்லுவர்.","ex":"Not to beget fame will be esteemed a disgrace by the wise in this world","t1":"Vasaiyenpa Vaiyaththaark Kellaam Isaiyennum","t2":"Echcham Peraaa Vitin"},{"n":239,"c":24,"ct":"புகழ்","ce":"On Renown","l1":"வசையிலா வண்பயன் குன்றும் இசையிலா","l2":"யாக்கை பொறுத்த நிலம்.","mv":"புகழ் பெறாமல் வாழ்வைக் கழித்தவருடைய உடம்பைச் சுமந்த நிலம், வசையற்ற வளமான பயனாகிய விளைவு இல்லாமல் குன்றிவிடும்.","ex":"The ground which supports a body without fame will diminish in its rich produce","t1":"Vasaiyilaa Vanpayan Kundrum Isaiyilaa","t2":"Yaakkai Poruththa Nilam"},{"n":240,"c":24,"ct":"புகழ்","ce":"On Renown","l1":"வசையொழிய வாழ்வாரே வாழ்வார் இசையொழிய","l2":"வாழ்வாரே வாழா தவர்.","mv":"தாம் வாழும் வாழ்க்கையில் பழி உண்டாகாமல் வாழ்கின்றவரே உயிர் வாழ்கின்றவர், புகழ் உண்டாகாமல் வாழ்கின்றவரே உயிர் வாழாதவர்.","ex":"Those live who live without disgrace Those who live without fame live not","t1":"Vasaiyozhiya Vaazhvaare Vaazhvaar Isaiyozhiya","t2":"Vaazhvaare Vaazhaa Thavar"},{"n":241,"c":25,"ct":"அருளுடைமை","ce":"On Compassion","l1":"அருட்செல்வம் செல்வத்துள் செல்வம் பொருட்செல்வம்","l2":"பூரியார் கண்ணும் உள.","mv":"பொருள்களாகிய செல்வங்கள் இழிந்தவரிடத்திலும் உள்ளன; (உயர்ந்தவரிடத்தில் மட்டுமே உள்ள) அருளாகிய செல்வமே செல்வங்களில் சிறந்த செல்வமாகும்.","ex":"The wealth of kindness is wealth of wealth, in as much as the wealth of property is possessed by the basest of men","t1":"Arutchelvam Selvaththul Selvam Porutchelvam","t2":"Pooriyaar Kannum Ula"},{"n":242,"c":25,"ct":"அருளுடைமை","ce":"On Compassion","l1":"நல்லாற்றாள் நாடி அருளாள்க பல்லாற்றால்","l2":"தேரினும் அஃதே துணை.","mv":"நல்ல வழியால் ஆராய்ந்து அருளுடையவர்களாக விளங்க வேண்டும்; பலவழிகளால் ஆராய்ந்து கண்டாலும் அருளே வாழ்க்கைக்குத் துணையாக இருக்கும்.","ex":"(Stand) in the good path, consider, and be kind. Even considering according to the conflicting tenets of the different sects, kindness will be your best aid, (in the acquisition of heavenly bliss.)","t1":"Nallaatraal Naati Arulaalka Pallaatraal","t2":"Therinum Aqdhe Thunai"},{"n":243,"c":25,"ct":"அருளுடைமை","ce":"On Compassion","l1":"அருள்சேர்ந்த நெஞ்சினார்க் கில்லை இருள்சேர்ந்த","l2":"இன்னா உலகம் புகல்.","mv":"அறியாமையாகிய இருள் பொருந்திய துன்ப உலகில் இருந்து வாழும் வாழ்க்கை, அருள் பொருந்திய நெஞ்சம் உடையவர்களுக்கு இல்லை.","ex":"They will never enter the world of darkness and wretchedness whose minds are the abode of kindness","t1":"Arulserndha Nenjinaark Killai Irulserndha","t2":"Innaa Ulakam Pukal"},{"n":244,"c":25,"ct":"அருளுடைமை","ce":"On Compassion","l1":"மன்னுயிர் ஓம்பி அருளாள்வார்க்கு இல்லென்ப","l2":"தன்னுயிர் அஞ்சும் வினை.","mv":"தன் உயிரின் பொருட்டு அஞ்சி வாழ்கின்ற தீவினை, உலகில் நிலைபெற்றுள்ள மற்ற உயிர்களைப் போற்றி அருளுடையவனாக இருப்பவனுக்கு இல்லை.","ex":"(The wise) say that the evils, which his soul would dread, will never come upon the man who exercises kindness and protects the life (of other creatures)","t1":"Mannuyir Ompi Arulaalvaarkku Illenpa","t2":"Thannuyir Anjum Vinai"},{"n":245,"c":25,"ct":"அருளுடைமை","ce":"On Compassion","l1":"அல்லல் அருளாள்வார்க்கு இல்லை வளிவழங்கும்","l2":"மல்லன்மா ஞாலங் கரி.","mv":"அருளுடையவராக வாழ்கின்றவர்களுக்குத் துன்பம் இல்லை, காற்று இயங்குகின்ற வளம் பெரிய உலகத்தில் வாழ்வோரே இதற்குச் சான்று ஆவர்.","ex":"This great rich earth over which the wind blows, is a witness that sorrow never comes upon the kindhearted","t1":"Allal Arulaalvaarkku Illai Valivazhangum","t2":"Mallanmaa Gnaalang Kari"},{"n":246,"c":25,"ct":"அருளுடைமை","ce":"On Compassion","l1":"பொருள்நீங்கிப் பொச்சாந்தார் என்பர் அருள்நீங்கி","l2":"அல்லவை செய்தொழுகு வார்.","mv":"அருள் இல்லாதவராய் அறமல்லாதவைகளைச் செய்து நடப்பவர்களை, உறுதிப்பொருளாகிய அறத்திலிருந்து நீங்கித் தம் வாழ்க்கையின் குறிக்கோளை மறந்தவர் என்பார்.","ex":"(The wise) say that those who neglect kindness and practise cruelties, neglected virtue (in their former birth), and forgot (the sorrows which they must suffer.)","t1":"Porulneengip Pochchaandhaar Enpar Arulneengi","t2":"Allavai Seydhozhuku Vaar"},{"n":247,"c":25,"ct":"அருளுடைமை","ce":"On Compassion","l1":"அருளில்லார்க்கு அவ்வுலகம் இல்லை பொருளில்லார்க்கு","l2":"இவ்வுலகம் இல்லாகி யாங்கு.","mv":"பொருள் இல்லாதவர்க்கு இவ்வுலகத்து வாழ்க்கை இல்லாதவாறு போல உயிர்களிடத்தில் அருள் இல்லாதவர்க்கு அவ்வுலகத்து வாழ்க்கை இல்லையாம்.","ex":"As this world is not for those who are without wealth, so that world is not for those who are without kindness","t1":"Arulillaarkku Avvulakam Illai Porulillaarkku","t2":"Ivvulakam Illaaki Yaangu"},{"n":248,"c":25,"ct":"அருளுடைமை","ce":"On Compassion","l1":"பொருளற்றார் பூப்பர் ஒருகால் அருளற்றார்","l2":"அற்றார்மற் றாதல் அரிது.","mv":"பொருள் இல்லாதவர் ஒரு காலத்தில் வளம் பெற்று விளங்குவர், அருள் இல்லாதவர் வாழ்க்கையின் பயம் அற்றவரே அவர் ஒரு காலத்திலும் சிறந்து விளங்குதல் இல்லை.","ex":"Those who are without wealth may, at some future time, become prosperous; those who are destitute of kindness are utterly destitute; for them there is no change","t1":"Porulatraar Pooppar Orukaal Arulatraar","t2":"Atraarmar Raadhal Aridhu"},{"n":249,"c":25,"ct":"அருளுடைமை","ce":"On Compassion","l1":"தெருளாதான் மெய்ப்பொருள் கண்டற்றால் தேரின்","l2":"அருளாதான் செய்யும் அறம்.","mv":"அருள் மேற்கொள்ளாதவன் செய்கின்ற அறச்செயலை ஆராய்ந்தால், அஃது அறிவு தெளியாதவன் ஒரு நூலின் உண்மைப் பொருளைக் கண்டாற் போன்றது.","ex":"If you consider, the virtue of him who is without kindness is like the perception of the true being by him who is without wisdom","t1":"Therulaadhaan Meypporul Kantatraal Therin","t2":"Arulaadhaan Seyyum Aram"},{"n":250,"c":25,"ct":"அருளுடைமை","ce":"On Compassion","l1":"வலியார்முன் தன்னை நினைக்க தான் தன்னின்","l2":"மெலியார்மேல் செல்லு மிடத்து.","mv":"(அருள் இல்லாதவன் ) தன்னை விட மெலிந்தவர் மேல் துன்புறுத்த செல்லும் போது, தன்னை விட வலியவரின் முன் தான் அஞ்சி நிற்கும் நிலைமையை நினைக்க வேண்டும்.","ex":"When a man is about to rush upon those who are weaker than himself, let him remember how he has stood (trembling) before those who are stronger than himself","t1":"Valiyaarmun Thannai Ninaikka Thaan","t2":"Thannin Meliyaarmel Sellu Mitaththu"},{"n":251,"c":26,"ct":"புலான்மறுத்தல்","ce":"On Abstaining from Meat","l1":"தன்னூன் பெருக்கற்குத் தான்பிறிது ஊனுண்பான்","l2":"எங்ஙனம் ஆளும் அருள்?","mv":"தன் உடம்பைப் பெருக்கச் செய்வதற்காகத் தான் மற்றோர் உயிரின் உடம்பைத் தின்கின்றவன் எவ்வாறு அருளுடையவனாக இருக்க முடியும்.","ex":"How can he be possessed of kindness, who to increase his own flesh, eats the flesh of other creatures","t1":"Thannoon Perukkarkuth Thaanpiridhu Oonunpaan","t2":"Engnganam Aalum Arul?"},{"n":252,"c":26,"ct":"புலான்மறுத்தல்","ce":"On Abstaining from Meat","l1":"பொருளாட்சி போற்றாதார்க்கு இல்லை அருளாட்சி","l2":"ஆங்கில்லை ஊன்தின் பவர்க்கு.","mv":"பொருளுடையவராக இருக்கும் சிறப்பு அப்பொருளை வைத்துக் காப்பாற்றாதவர்க்கு இல்லை, அருளுடையவராக இருக்கும் சிறப்பு புலால் தின்பவர்க்கு இல்லை.","ex":"As those possess no property who do not take care of it, so those possess no kindness who feed on flesh","t1":"Porulaatchi Potraadhaarkku Illai Arulaatchi","t2":"Aangillai Oondhin Pavarkku"},{"n":253,"c":26,"ct":"புலான்மறுத்தல்","ce":"On Abstaining from Meat","l1":"படைகொண்டார் நெஞ்சம்போல் நன்னூக்காது ஒன்றன்","l2":"உடல்சுவை உண்டார் மனம்.","mv":"ஓர் உயிரின் உடம்பைச் சுவையாக உண்டவரின் மனம் கொலைக்கருவியைக் கையில் கொண்டவரின் நெஞ்சம் போல் நன்மையாகி அருளைப் போற்றாது.","ex":"Like the (murderous) mind of him who carries a weapon (in his hand), the mind of him who feasts with pleasure on the body of another (creature), has no regard for goodness","t1":"Pataikontaar Nenjampol Nannookkaadhu Ondran","t2":"Utalsuvai Untaar Manam"},{"n":254,"c":26,"ct":"புலான்மறுத்தல்","ce":"On Abstaining from Meat","l1":"ருளல்லது யாதெனின் கொல்லாமை கோறல்","l2":"பொருளல்லது அவ்வூன் தினல்.","mv":"அருள் எது என்றால் ஓர் உயிரையும் கொல்லாமலிருத்தல் அருளல்லாது எது என்றால் உயிர்களைக்கொள்ளுதல் அதன் உடம்பைத் தின்னுதல் அறம் அல்லாதது.","ex":"If it be asked what is kindness and what its opposite, the answer would be preservation and destruction of life; and therefore it is not right to feed on the flesh (obtained by taking away life)","t1":"Arulalladhu Yaadhenin Kollaamai Koral","t2":"Porulalladhu Avvoon Thinal"},{"n":255,"c":26,"ct":"புலான்மறுத்தல்","ce":"On Abstaining from Meat","l1":"உண்ணாமை உள்ளது உயிர்நிலை ஊனுண்ண","l2":"அண்ணாத்தல் செய்யாது அளறு.","mv":"உயிர்கள் உடம்பு பெற்று வாழும் நிலைமை, ஊன் உண்ணாதிருத்தலை அடிப்படையாகக் கொண்டது ஊன் உண்டால் நரகம் அவனை வெளிவிடாது.","ex":"Not to eat flesh contributes to the continuance of life; therefore if a man eat flesh, hell will not open its mouth (to let him escape out, after he has once fallen in)","t1":"Unnaamai Ulladhu Uyirnilai Oonunna","t2":"Annaaththal Seyyaadhu Alaru"},{"n":256,"c":26,"ct":"புலான்மறுத்தல்","ce":"On Abstaining from Meat","l1":"தினற்பொருட்டால் கொல்லாது உலகெனின் யாரும்","l2":"விலைப்பொருட்டால் ஊன்றருவா ரில்.","mv":"புலால் தின்னும் பொருட்டு உலகத்தார் உயிர்களைக் கொல்லா திருப்பாரானால், விலையின் பொருட்டு ஊன் விற்பவர் இல்லாமல் போவார்.","ex":"If the world does not destroy life for the purpose of eating, then no one would sell flesh for the sake of money","t1":"Thinarporuttaal Kollaadhu Ulakenin Yaarum","t2":"Vilaipporuttaal Oondraruvaa Ril"},{"n":257,"c":26,"ct":"புலான்மறுத்தல்","ce":"On Abstaining from Meat","l1":"உண்ணாமை வேண்டும் புலாஅல் பிறிதொன்றன்","l2":"புண்ணது உணர்வார்ப் பெறின்.","mv":"புலால் உண்ணாமலிருக்க வேண்டும், ஆராய்ந்து அறிவாரைப் பெற்றால், அப் புலால் வேறோர் உயிரின் புண் என்பதை உணரலாம்.","ex":"If men should come to know that flesh is nothing but the unclean ulcer of a body, let them abstain from eating it","t1":"Unnaamai Ventum Pulaaal Piridhondran","t2":"Punnadhu Unarvaarp Perin"},{"n":258,"c":26,"ct":"புலான்மறுத்தல்","ce":"On Abstaining from Meat","l1":"செயிரின் தலைப்பிரிந்த காட்சியார் உண்ணார்","l2":"உயிரின் தலைப்பிரிந்த ஊன்.","mv":"குற்றத்திலிருந்து நீங்கிய அறிவை உடையவர், ஒர் உயிரினிடத்திலிருந்து பிரிந்து வந்த ஊனை உண்ணமாட்டார்.","ex":"The wise, who have freed themselves from mental delusion, will not eat the flesh which has been severed from an animal","t1":"Seyirin Thalaippirindha Kaatchiyaar Unnaar","t2":"Uyirin Thalaippirindha Oon"},{"n":259,"c":26,"ct":"புலான்மறுத்தல்","ce":"On Abstaining from Meat","l1":"அவிசொரிந் தாயிரம் வேட்டலின் ஒன்றன்","l2":"உயிர்செகுத் துண்ணாமை நன்று.","mv":"நெய் முதலியப் பொருள்களைத் தீயில் சொரிந்து ஆயிரம் வேள்விகள் செய்தலை விட ஒன்றன் உயிரைக்கொன்று உடம்பைத் தின்னாதிருத்தல் நல்லது.","ex":"Not to kill and eat (the flesh of) an animal, is better than the pouring forth of ghee etc, in a thousand sacrifices","t1":"Avisorin Thaayiram Vettalin Ondran","t2":"Uyirsekuth Thunnaamai Nandru"},{"n":260,"c":26,"ct":"புலான்மறுத்தல்","ce":"On Abstaining from Meat","l1":"கொல்லான் புலாலை மறுத்தானைக் கைகூப்பி","l2":"எல்லா உயிருந் தொழும்.","mv":"ஓருயிரையும் கொல்லாமல் புலால் உண்ணாமல் வாழ்கின்றவனை உலகத்தில் உள்ள எல்லா உயிர்களும் கைகூப்பி வணங்கும்.","ex":"All creatures will join their hands together, and worship him who has never taken away life, nor eaten flesh","t1":"Kollaan Pulaalai Maruththaanaik Kaikooppi","t2":"Ellaa Uyirun Thozhum"},{"n":261,"c":27,"ct":"தவம்","ce":"On Penance","l1":"உற்றநோய் நோன்றல் உயிர்க்குறுகண் செய்யாமை","l2":"அற்றே தவத்திற் குரு.","mv":"தனக்கு உற்ற துன்பத்தை பொறுத்தலும் மற்ற உயிர்க்குத் துன்பம் செய்யாதிருத்தலும் ஆகிய அவ்வளவே தவத்திற்கு வடிவமாகும்","ex":"The nature of religious discipline consists, in the endurance (by the ascetic) of the sufferings which it brings on himself, and in abstaining from giving pain to others","t1":"Utranoi Nondral Uyirkkurukan Seyyaamai","t2":"Atre Thavaththir Kuru"},{"n":262,"c":27,"ct":"தவம்","ce":"On Penance","l1":"தவமும் தவமுடையார்க்கு ஆகும் அதனை","l2":"அஃதிலார் மேற்கொள் வது.","mv":"தவக்கோலமும் தவஒழுக்கமும் உடையவர்க்கே பொருந்துவதாகும்; அக் கோலத்தை தவஒழுக்கம் இல்லாதவர் மேற்கொள்வது வீண்முயற்சியாகும்.","ex":"Austerities can only be borne, and their benefits enjoyed, by those who have practised them (in a former birth); it will be useless for those who have not done so, to attempt to practise them (now)","t1":"Thavamum Thavamutaiyaarkku Aakum Adhanai","t2":"Aqdhilaar Merkol Vadhu"},{"n":263,"c":27,"ct":"தவம்","ce":"On Penance","l1":"துறந்தார்க்குத் துப்புரவு வேண்டி மறந்தார்கொல்","l2":"மற்றை யவர்கள் தவம்.","mv":"துறந்தவர்க்கு உணவு முதலியனக் கொடுத்து உதவவேண்டும் என விரும்பி மற்றவர்கள் (இல்லறத்தினர்) தவம் செய்தலை மறந்தார்களோ","ex":"It is to provide food etc, for the ascetics who have abandoned (the desire of earthly possessions) that other persons have forgotten (to practise) austerity ?","t1":"Thurandhaarkkuth Thuppuravu Venti Marandhaarkol","t2":"Matrai Yavarkal Thavam"},{"n":264,"c":27,"ct":"தவம்","ce":"On Penance","l1":"ஒன்னார்த் தெறலும் உவந்தாரை ஆக்கலும்","l2":"எண்ணின் தவத்தான் வரும்.","mv":"தீமை செய்யும் பகைவரை அடக்குதலும் நன்மை செய்யும் நண்பரை உயர்த்துதலும் நினைத்த அளவில் தவத்தின் வலிமையால் உண்டாகும்.","ex":"If (the ascetic) desire the destruction of his enemies, or the aggrandizement of his friends, it will be effected by (the power of) his austerities","t1":"Onnaarth Theralum Uvandhaarai Aakkalum","t2":"Ennin Thavaththaan Varum"},{"n":265,"c":27,"ct":"தவம்","ce":"On Penance","l1":"வேண்டிய வேண்டியாங் கெய்தலால் செய்தவம்","l2":"ஈண்டு முயலப் படும்.","mv":"விரும்பிய பயன்களை விரும்பியவாறே அடைய முடியுமாகையால் செய்யத்தக்க தவம் இந்நிலையிலும் (இல்லற வாழ்க்கையிலும்) முயன்று செய்யப்படும்.","ex":"Religious dislipline is practised in this world, because it secures the attainment of whatever one may wish to enjoy (in the world to come)","t1":"Ventiya Ventiyaang Keydhalaal Seydhavam","t2":"Eentu Muyalap Patum"},{"n":266,"c":27,"ct":"தவம்","ce":"On Penance","l1":"தவஞ் செய்வார் தங்கருமஞ் செய்வார்மற் றல்லார்","l2":"அவஞ்செய்வார் ஆசையுட் பட்டு.","mv":"தவம் செய்கின்றவரே தமக்குரிய கடமையைச் செய்கின்றவர் ஆவர், அவர் அல்லாத மற்றவர் ஆசை வலையில் அகப்பட்டு வீண் முயற்சி செய்கின்றவரே.","ex":"Those discharge their duty who perform austerities; all others accomplish their own destruction, through the entanglement of the desire (of riches and sensual pleasure)","t1":"Thavanj Cheyvaar Thangarumanj Cheyvaarmar","t2":"Rallaar Avanjeyvaar Aasaiyut Pattu"},{"n":267,"c":27,"ct":"தவம்","ce":"On Penance","l1":"சுடச்சுடரும் பொன்போல் ஒளிவிடும் துன்பஞ்","l2":"சுடச்சுட நோற்கிற் பவர்க்கு.","mv":"புடமிட்டு சுடச்சுட ஒளிவிடுகின்ற பொன்னைப் போல் தவம் செய்கின்றவரை துன்பம் வருத்த வருத்த மெய்யுணர்வு மிகும்","ex":"Just as gold is purified as heated in the fire, will those shine, who have endured the burning of pain (in frequent austerities)","t1":"Sutachchutarum Ponpol Olivitum Thunpanjjch","t2":"Utachchuta Norkir Pavarkku"},{"n":268,"c":27,"ct":"தவம்","ce":"On Penance","l1":"தன்னுயிர் தான்அறப் பெற்றானை ஏனைய","l2":"மன்னுயி ரெல்லாந் தொழும்.","mv":"தவ வலிமையால் தன்னுடைய உயிர், தான் என்னும் பற்று நீங்கப் பெற்றவனை மற்ற உயிர்கள் எல்லாம் (அவனுடைய பெருமையை உணர்ந்து) தொழும்.","ex":"All other creatures will worship him who has attained the control of his own soul","t1":"Thannuyir Thaanarap Petraanai Enaiya","t2":"Mannuyi Rellaan Thozhum"},{"n":269,"c":27,"ct":"தவம்","ce":"On Penance","l1":"கூற்றம் குதித்தலும் கைகூடும் நோற்றலின்","l2":"ஆற்றல் தலைப்பட் டவர்க்குல்.","mv":"தவம் செய்வதால் பெறத்தக்க ஆற்றலைப் பெற்றவர்க்கு (ஓர் இடையூறும் இல்லையாகையால் ) எமனை வெல்லுதலும் கைகூடும்","ex":"Those who have attained the power which religious discipline confers, will be able also to pass the limit of Yama, (the God of death)","t1":"Kootram Kudhiththalum Kaikootum Notralin","t2":"Aatral Thalaippat Tavarkkul"},{"n":270,"c":27,"ct":"தவம்","ce":"On Penance","l1":"இலர்பல ராகிய காரணம் நோற்பார்","l2":"சிலர்பலர் நோலா தவர்.","mv":"ஆற்றல் இல்லாதவர் பலராக உலகில் இருப்பதற்குக் காரணம் தவம் செய்கின்றவர் சிலராகவும், செய்யாதவர் பலராகவும் இருப்பதே ஆகும்.","ex":"Because there are few who practise austerity and many who do not, there are many destitute and few rich in this world","t1":"Ilarpala Raakiya Kaaranam Norpaar","t2":"Silarpalar Nolaa Thavar"},{"n":271,"c":28,"ct":"கூடாவொழுக்கம்","ce":"On Improper Conduct","l1":"வஞ்ச மனத்தான் படிற்றொழுக்கம் பூதங்கள்","l2":"ஐந்தும் அகத்தே நகும்.","mv":"வஞ்சமனம் உடையவனது பொய்யொழுக்கத்தை அவனுடைய உடம்பில் கலந்து நிற்க்கும் ஐந்து பூதங்களும் கண்டு தம்முள் சிரிக்கும்.","ex":"The five elements (of his body) will laugh within him at the feigned conduct of the deceitful minded man","t1":"Vanja Manaththaan Patitrozhukkam Poodhangal","t2":"Aindhum Akaththe Nakum"},{"n":272,"c":28,"ct":"கூடாவொழுக்கம்","ce":"On Improper Conduct","l1":"வானுயர் தோற்றம் எவன்செய்யும் தன்னெஞ்சம்","l2":"தான்அறி குற்றப் படின்.","mv":"தன் மனம் தான் அறிந்த குற்றத்தில் தங்குமானால் வானத்தைப் போல் உயர்ந்துள்ள தவக்கோலம் ஒருவனுக்கு என்ன பயன் செய்யும்.","ex":"What avails an appearance (of sanctity) high as heaven, if his mind suffers (the indulgence) of conscious sin","t1":"Vaanuyar Thotram Evanseyyum Thannenjam","t2":"Thaanari Kutrap Patin"},{"n":273,"c":28,"ct":"கூடாவொழுக்கம்","ce":"On Improper Conduct","l1":"வலியில் நிலைமையான் வல்லுருவம் பெற்றம்","l2":"புலியின்தோல் போர்த்துமேய்ந் தற்று.","mv":"மனத்தை அடக்கும் வல்லமை இல்லாதவன் மேற்கொண்ட வலிய தவக்கோலம், புலியின் தோலைப் போர்த்திக் கொண்டு பயிரை பசு மேய்ந்தாற் போன்றது.","ex":"The assumed appearance of power, by a man who has no power (to restrain his senses and perform austerity), is like a cow feeding on grass covered with a tiger's skin","t1":"Valiyil Nilaimaiyaan Valluruvam Petram","t2":"Puliyindhol Porththumeyn Thatru"},{"n":274,"c":28,"ct":"கூடாவொழுக்கம்","ce":"On Improper Conduct","l1":"தவமறைந்து அல்லவை செய்தல் புதல்மறைந்து","l2":"வேட்டுவன் புள்சிமிழ்த் தற்று.","mv":"தவக்கோலத்தில் மறைந்து கொண்டு தவம் அல்லாத தீயச்செயல்களைச் செய்தல், புதரில் மறைந்து கொண்டு வேடன் பறவைகளை வலைவீசிப் பிடித்தலைப் போன்றது.","ex":"He who hides himself under the mask of an ascetic and commits sins, like a sportsman who conceals himself in the thicket to catch birds","t1":"Thavamaraindhu Allavai Seydhal Pudhalmaraindhu","t2":"Vettuvan Pulsimizhth Thatru"},{"n":275,"c":28,"ct":"கூடாவொழுக்கம்","ce":"On Improper Conduct","l1":"பற்றற்றேம் என்பார் படிற்றொழுக்கம் எற்றெற்றென்று","l2":"ஏதம் பலவுந் தரும்.","mv":"பற்றுக்களைத் துறந்தோம் என்று சொல்கின்றவரின் பொய்யொழுக்கம் என்ன செய்தோம் என்ன செய்தோம் என்று வருந்தும் படியான துன்பம் பலவும் தரும்.","ex":"The false conduct of those who say they have renounced all desire will one day bring them sorrows that will make them cry out, \"Oh! what have we done, what have we done.\"","t1":"Patratrem Enpaar Patitrozhukkam Etretrendru","t2":"Edham Palavun Tharum"},{"n":276,"c":28,"ct":"கூடாவொழுக்கம்","ce":"On Improper Conduct","l1":"நெஞ்சின் துறவார் துறந்தார்போல் வஞ்சித்து","l2":"வாழ்வாரின் வன்கணார் இல்.","mv":"மனத்தில் பற்றுக்களைத் துறக்காமல் துறந்தவரைப் போல் வஞ்சனைச் செய்து வாழ்கின்றவரைப் போல் இரக்கமற்றவர் எவரும் இல்லை.","ex":"Amongst living men there are none so hard-hearted as those who without to saking (desire) in their heart, falsely take the appearance of those who have forsaken (it)","t1":"Nenjin Thuravaar Thurandhaarpol Vanjiththu","t2":"Vaazhvaarin Vankanaar Il"},{"n":277,"c":28,"ct":"கூடாவொழுக்கம்","ce":"On Improper Conduct","l1":"புறங்குன்றி கண்டனைய ரேனும் அகங்குன்றி","l2":"முக்கிற் கரியார் உடைத்து.","mv":"புறத்தில் குன்றிமணிப்போல் செம்மையானவராய் காணப்பட்டாராயினும் அகத்தில் குன்றிமணியின் மூக்குப்போல் கருத்திருப்பவர் உலகில் உணடு.","ex":"(The world) contains persons whose outside appears (as fair) as the (red) berry of the Abrus, but whose inside is as black as the nose of that berry","t1":"Purangundri Kantanaiya Renum Akangundri","t2":"Mukkir Kariyaar Utaiththu"},{"n":278,"c":28,"ct":"கூடாவொழுக்கம்","ce":"On Improper Conduct","l1":"மனத்தது மாசாக மாண்டார் நீராடி","l2":"மறைந்தொழுகு மாந்தர் பலர்.","mv":"மனத்தில் மாசு இருக்க, தவத்தால் மாண்பு பெற்றவரைப்போல், நீரில் மறைந்து நடக்கும் வஞ்சனை உடைய மாந்தர் உலகில் பலர் உள்ளனர்.","ex":"There are many men of masked conduct, who perform their ablutions, and (make a show) of","t1":"Manaththadhu Maasaaka Maantaar Neeraati","t2":"Maraindhozhuku Maandhar Palar"},{"n":279,"c":28,"ct":"கூடாவொழுக்கம்","ce":"On Improper Conduct","l1":"கணைகொடிது யாழ்கோடு செவ்விதுஆங் கன்ன","l2":"வினைபடு பாலால் கொளல்.","mv":"நேராகத் தோன்றினும் அம்பு கொடியது; வளைவுடன் தோன்றினாலும் யாழின் கொம்பு நன்மையானது. மக்களின் பண்புகளையும் செயல்வகையால் உணர்ந்துகொள்ள வேண்டும்.","ex":"As, in its use, the arrow is crooked, and the curved lute is straight, so by their deeds, (and not by their appearance) let (the uprightness or crookedness of) men be estimated","t1":"Kanaikotidhu Yaazhkotu Sevvidhuaang Kanna","t2":"Vinaipatu Paalaal Kolal"},{"n":280,"c":28,"ct":"கூடாவொழுக்கம்","ce":"On Improper Conduct","l1":"மழித்தலும் நீட்டலும் வேண்டா உலகம்","l2":"பழித்தது ஒழித்து விடின்.","mv":"உலகம் பழிக்கும் தீயொழுக்கத்தை விட்டு விட்டால் மொட்டை அடித்தலும் சடை வளர்த்தலுமாகிய புறக்கோலங்கள் வேண்டா.","ex":"There is no need of a shaven crown, nor of tangled hair, if a man abstain from those deeds which the wise have condemned","t1":"Mazhiththalum Neettalum Ventaa Ulakam","t2":"Pazhiththadhu Ozhiththu Vitin"},{"n":281,"c":29,"ct":"கள்ளாமை","ce":"On Non-Stealing","l1":"எள்ளாமை வேண்டுவான் என்பான் எனைத்தொன்றும்","l2":"கள்ளாமை காக்கதன் நெஞ்சு.","mv":"பிறரால் இகழப்படால் வாழ விரும்புகிறவன், எத்தன்மையானப் பொருளையும் பிறரிடமிருந்து வஞ்சித்துக்கொள்ள எண்ணாதபடி தன் நெஞ்சைக் காக்க வேண்டும்.","ex":"Let him, who desires not to be despised, keep his mind from (the desire of) defrauding another of the smallest thing","t1":"Ellaamai Ventuvaan Enpaan Enaiththondrum","t2":"Kallaamai Kaakkadhan Nenju"},{"n":282,"c":29,"ct":"கள்ளாமை","ce":"On Non-Stealing","l1":"உள்ளத்தால் உள்ளலும் தீதே பிறன்பொருளைக்","l2":"கள்ளத்தால் கள்வேம் எனல்.","mv":"குற்றமானதை உள்ளத்தால் எண்ணுவதும் குற்றமே, அதானால் பிறன் பொருளை அவன் அறியாதப் வகையால் வஞ்சித்துக்கொள்வோம் என்று எண்ணாதிருக்க வேண்டும்.","ex":"Even the thought (of sin) is sin; think not then of crafiily stealing the property of another","t1":"Ullaththaal Ullalum Theedhe Piranporulaik","t2":"Kallaththaal Kalvem Enal"},{"n":283,"c":29,"ct":"கள்ளாமை","ce":"On Non-Stealing","l1":"களவினால் ஆகிய ஆக்கம் அளவிறந்து","l2":"ஆவது போலக் கெடும்.","mv":"களவு செய்து பொருள் கொள்வதால் உண்டாகிய ஆக்கம் பெருகுவது போல் தோன்றி இயல்பாக இருக்க வேண்டிய அளவையும் கடந்து கெட்டு விடும்.","ex":"The property, which is acquired by fraud, will entirely perish, even while it seems to increase","t1":"Kalavinaal Aakiya Aakkam Alavirandhu","t2":"Aavadhu Polak Ketum"},{"n":284,"c":29,"ct":"கள்ளாமை","ce":"On Non-Stealing","l1":"களவின்கண் கன்றிய காதல் விளைவின்கண்","l2":"வீயா விழுமம் தரும்.","mv":"களவு செய்து பிறர் பொருள் கொள்ளுதலில் ஒருவனுக்கு உள்ள மிகுந்த விருப்பம், பயன் விளையும் போது தொலையாதத் துன்பத்தைத் தரும்.","ex":"The eager desire of defrauding others will, when it brings forth its fruit, produce undying sorrow","t1":"Kalavinkan Kandriya Kaadhal Vilaivinkan","t2":"Veeyaa Vizhumam Tharum"},{"n":285,"c":29,"ct":"கள்ளாமை","ce":"On Non-Stealing","l1":"அருள்கருதி அன்புடைய ராதல் பொருள்கருதிப்","l2":"பொச்சாப்புப் பார்ப்பார்கண் இல்.","mv":"அருளைப் பெரிதாகக்கருதி அன்பு உடையவராய் நடத்தல், பிறருடைய பொருளைக்கவர எண்ணி அவர் சோர்ந்திருக்கும் நிலையைப் பார்ப்பவரிடத்தில் இல்லை.","ex":"The study of kindness and the exercise of benevolence is not with those who watch for another's forgetfulness, though desire of his property","t1":"Arulkarudhi Anputaiya Raadhal Porulkarudhip","t2":"Pochchaappup Paarppaarkan Il"},{"n":286,"c":29,"ct":"கள்ளாமை","ce":"On Non-Stealing","l1":"அளவின்கண் நின்றொழுகல் ஆற்றார் களவின்கண்","l2":"கன்றிய காத லவர்.","mv":"களவு செய்து பிறர் பொருள் கொள்ளுதலில் மிக்க விருப்பம் உடையவர், அளவு (சிக்கனம்) போற்றி வாழும் நெறியில் நின்று ஒழுக மாட்டார்.","ex":"They cannot walk steadfastly, according to rule, who eagerly desire to defraud others","t1":"Alavinkan Nindrozhukal Aatraar Kalavinkan","t2":"Kandriya Kaadha Lavar"},{"n":287,"c":29,"ct":"கள்ளாமை","ce":"On Non-Stealing","l1":"களவென்னும் காரறி வாண்மை அளவென்னும்","l2":"ஆற்றல் புரிந்தார்கண்ட இல்.","mv":"களவு என்பதற்கு காரணமான மயங்கிய அறிவு உடையவராயிருத்தல், அளவு அறிந்து வாழ்தலாகிய ஆற்றலை விரும்பினவரிடத்தில் இல்லை.","ex":"That black-knowledge which is called fraud, is not in those who desire that greatness which is called rectitude","t1":"Kalavennum Kaarari Vaanmai Alavennum","t2":"Aatral Purindhaarkanta Il"},{"n":288,"c":29,"ct":"கள்ளாமை","ce":"On Non-Stealing","l1":"அளவற஧ந்தார் நெஞ்சத் தறம்போல நிற்கும்","l2":"களவறிந்தார் நெஞ்சில் கரவு.","mv":"அளவறிந்து வாழ்கின்றவரின் நெஞ்சில் நிற்கும் அறம் போல் களவு செய்து பழகி அறிந்தவரின் நெஞ்சில் வஞ்சம் நிற்கும்.","ex":"Deceit dwells in the mind of those who are conversant with fraud, even as virtue in the minds of those who are conversant with rectitude","t1":"Alavarindhaar Nenjath Tharampola Nirkum","t2":"Kalavarindhaar Nenjil Karavu"},{"n":289,"c":29,"ct":"கள்ளாமை","ce":"On Non-Stealing","l1":"அளவல்ல செய்தாங்கே வீவர் களவல்ல","l2":"மற்றைய தேற்றா தவர்.","mv":"களவு செய்தலைத் தவிர மற்ற நல்லவழிகளைத் நம்பித் தெளியாதவர் அளவு அல்லாத செயல்களைச் செய்து அப்போதே கெட்டழிவர்.","ex":"Those, who are acquainted with nothing but fraud, will perish in the very commission of transgression","t1":"Alavalla Seydhaange Veevar Kalavalla","t2":"Matraiya Thetraa Thavar"},{"n":290,"c":29,"ct":"கள்ளாமை","ce":"On Non-Stealing","l1":"கள்வார்க்குத் தள்ளும் உயிர்நிலை கள்வார்க்குத்","l2":"தள்ளாது புத்தே ளுளகு.","mv":"களவு செய்வார்க்கு உடலில் உயிர் வாழும் வாழ்வும் தவறிப் போகும், களவு செய்யாமல் வாழ்வோர்க்கு தேவருலகும் வாய்க்கத் தவறாது.","ex":"Even their body will fail the fraudulent; but even the world of the gods will not fail those who are free from fraud","t1":"Kalvaarkkuth Thallum Uyirnilai Kalvaarkkuth","t2":"Thallaadhu Puththe Lulaku"},{"n":291,"c":30,"ct":"வாய்மை","ce":"On Truth","l1":"வாய்மை எனப்படுவது யாதெனின் யாதொன்றும்","l2":"தீமை இலாத சொலல்.","mv":"வாய்மை என்று கூறப்படுவது எது என்றால், அது மற்றவர்க்கு ஒரு சிறிதும் தீங்கு இல்லாத சொற்களைக் சொல்லுதல் ஆகும்.","ex":"Truth is the speaking of such words as are free from the least degree of evil (to others)","t1":"Vaaimai Enappatuvadhu Yaadhenin Yaadhondrum","t2":"Theemai Ilaadha Solal"},{"n":292,"c":30,"ct":"வாய்மை","ce":"On Truth","l1":"பொய்மையும் வாய்மை யிடத்த புரைதீர்ந்த","l2":"நன்மை பயக்கும் எனின்.","mv":"குற்றம் தீர்த்த நன்மையை விளைக்குமானால் பொய்யாச் சொற்களும் வாய்மை என்று கருதத் தக்க இடத்தைப் பெறும்.","ex":"Even falsehood has the nature of truth, if it confer a benefit that is free from fault","t1":"Poimaiyum Vaaimai Yitaththa Puraidheerndha","t2":"Nanmai Payakkum Enin"},{"n":293,"c":30,"ct":"வாய்மை","ce":"On Truth","l1":"தன்நெஞ் சறிவது பொய்யற்க பொய்த்தபின்","l2":"தன்நெஞ்சே தன்னைச் சுடும்.","mv":"ஒருவன் தன் நெஞ்சம் அறிவதாகிய ஒன்றைக்குறித்துப் பொய்ச் சொல்லக்கூடாது, பொய் சொன்னால் அதைக்குறித்துத் தன் நெஞ்சமே தன்னை வருத்தும்.","ex":"Let not a man knowingly tell a lie; for after he has told the lie, his mind will burn him (with the memory of his guilt)","t1":"Thannenj Charivadhu Poiyarka Poiththapin","t2":"Thannenje Thannaich Chutum"},{"n":294,"c":30,"ct":"வாய்மை","ce":"On Truth","l1":"உள்ளத்தாற் பொய்யா தொழுகின் உலகத்தார்","l2":"உள்ளத்து ளெல்லாம் உளன்.","mv":"ஒருவன் தன் உள்ளம் அறியப் பொய் இல்லாமல் நடப்பானானால் அத்தகையவன் உலகத்தாரின் உள்ளங்களில் எல்லாம் இருப்பவனாவான்.","ex":"He who, in his conduct, preserves a mind free from deceit, will dwell in the minds of all men","t1":"Ullaththaar Poiyaa Thozhukin Ulakaththaar","t2":"Ullaththu Lellaam Ulan"},{"n":295,"c":30,"ct":"வாய்மை","ce":"On Truth","l1":"மனத்தொடு வாய்மை மொழியின் தவத்தொடு","l2":"தானஞ்செய் வாரின் தலை.","mv":"ஒருவன் தன் மனதோடு பொருந்த உண்மை பேசுவானானால் அவன் தவத்தேடு தானமும் ஒருங்கே செய்வாரை விடச் சிறந்தவன்.","ex":"He, who speaks truth with all his heart, is superior to those who make gifts and practise austerities","t1":"Manaththotu Vaaimai Mozhiyin Thavaththotu","t2":"Thaananjey Vaarin Thalai"},{"n":296,"c":30,"ct":"வாய்மை","ce":"On Truth","l1":"பொய்யாமை அன்ன புகழில்லை எய்யாமை","l2":"எல்லா அறமுந் தரும்.","mv":"ஒருவனுக்கு பொய் இல்லாமல் வாழ்தலை விடப் புகழ் நிலை வேறொன்றும் இல்லை, அஃது அவன் அறியாமலேயெ அவனுக்கு எல்லா அறமும் கொடுக்கும்.","ex":"There is no praise like the praise of never uttering a falsehood: without causing any suffering, it will lead to every virtue","t1":"Poiyaamai Anna Pukazhillai Eyyaamai","t2":"Ellaa Aramun Tharum"},{"n":297,"c":30,"ct":"வாய்மை","ce":"On Truth","l1":"பொய்யாமை பொய்யாமை ஆற்றின் அறம்பிற","l2":"செய்யாமை செய்யாமை நன்று.","mv":"பொய்யாமை ஆகிய அறத்தை உண்மையாகவே போற்றி வாழ முடிந்தால் மற்ற அறங்களைச் செய்தலும் நல்லது ஆகும்.","ex":"If a man has the power to abstain from falsehood, it will be well with him, even though he practise no other virtue","t1":"Poiyaamai Poiyaamai Aatrin Arampira","t2":"Seyyaamai Seyyaamai Nandru"},{"n":298,"c":30,"ct":"வாய்மை","ce":"On Truth","l1":"புறள்தூய்மை நீரான் அமையும் அகந்தூய்மை","l2":"வாய்மையால் காணப் படும்.","mv":"புறத்தே தூய்மையாக விளங்குதல் நீரினால் ஏற்ப்படும், அதுபோல அகத்தே தூய்மையாக விளங்குதல் வாய்மையால் உண்டாகும்.","ex":"Purity of body is produced by water and purity of mind by truthfulness","t1":"Puraldhooimai Neeraan Amaiyum Akandhooimai","t2":"Vaaimaiyaal Kaanap Patum"},{"n":299,"c":30,"ct":"வாய்மை","ce":"On Truth","l1":"எல்லா விளக்கும் விளக்கல்ல சான்றோர்க்குப்","l2":"பொய்யா விளக்கே விளக்கு.","mv":"(புறத்தில் உள்ள இருளை நீக்கும்) விளக்குகள் எல்லாம் விளக்குகள் அல்ல, சான்றோர்க்கு (அகத்து இருள் நீக்கும்) பொய்யாமையாகிய விளக்கே விளக்கு ஆகும்.","ex":"All lamps of nature are not lamps; the lamp of truth is the lamp of the wise","t1":"Ellaa Vilakkum Vilakkalla Saandrorkkup","t2":"Poiyaa Vilakke Vilakku"},{"n":300,"c":30,"ct":"வாய்மை","ce":"On Truth","l1":"யாமெய்யாக் கண்டவற்றுள் இல்லை எனைத்தொன்றும்","l2":"வாய்மையின் நல்ல பிற.","mv":"யாம் உண்மையாக கண்ட பொருள்களுள் வாய்மைவிடத் எத்தன்மையாலும் சிறந்தவைகளாகச் சொல்லத்தக்கவை வேறு இல்லை.","ex":"Amidst all that we have seen (described) as real (excellence), there is nothing so good as truthfulness","t1":"Yaameyyaak Kantavatrul Illai Enaiththondrum","t2":"Vaaimaiyin Nalla Pira"},{"n":301,"c":31,"ct":"வெகுளாமை","ce":"On Not Getting Angry","l1":"செல்லிடத்துக் காப்பான் சினங்காப்பான் அல்லிடத்துக்","l2":"காக்கின்என் காவாக்கால் என்?","mv":"பலிக்கும் இடத்தில் சினம் வராமல் காப்பவனே சினம் காப்பவன், பலிக்காத இடத்தில் காத்தால் என்ன, காக்கா விட்டால் என்ன?","ex":"He restrains his anger who restrains it when it can injure; when it cannot injure, what does it matter whether he restrain it, or not ?","t1":"Sellitaththuk Kaappaan Sinangaappaan Allitaththuk","t2":"Kaakkinen Kaavaakkaal En?"},{"n":302,"c":31,"ct":"வெகுளாமை","ce":"On Not Getting Angry","l1":"செல்லா இடத்துச் சினந்தீது செல்லிடத்தும்","l2":"இல்அதனின் தீய பிற.","mv":"பலிக்காத இடத்தில் (தன்னை விட வலியவரிடத்தில்) சினம் கொள்வது தீங்கு. பலிக்கும் இடத்திலும் (மெலியவரித்திலும்) சினத்தைவிடத் தீயவை வேறு இல்லை.","ex":"Anger is bad, even when it cannot injure; when it can injure; there is no greater evil","t1":"Sellaa Itaththuch Chinandheedhu Sellitaththum","t2":"Iladhanin Theeya Pira"},{"n":303,"c":31,"ct":"வெகுளாமை","ce":"On Not Getting Angry","l1":"மறத்தல் வெகுளியை யார்மாட்டும் தீய","l2":"பிறத்தல் அதனான் வரும்.","mv":"யாரிடத்திலும் சினம் கொள்ளாமல் அதை மறந்து விட வேண்டும், தீமையான விளைவுகள் அச் சினத்தாலேயே ஏற்படும்.","ex":"Forget anger towards every one, as fountains of evil spring from it","t1":"Maraththal Vekuliyai Yaarmaattum Theeya","t2":"Piraththal Adhanaan Varum"},{"n":304,"c":31,"ct":"வெகுளாமை","ce":"On Not Getting Angry","l1":"நகையும் உவகையும் கொல்லும் சினத்தின்","l2":"பகையும் உளவோ பிற.","mv":"முகமலர்ச்சியும் அகமலர்ச்சியும் கொல்லுகின்ற சினத்தை விட ஒருவனுக்கு பகையானவை வேறு உள்ளனவோ?","ex":"What other foe to man works such annoy?","t1":"Nakaiyum Uvakaiyum Kollum Sinaththin","t2":"Pakaiyum Ulavo Pira"},{"n":305,"c":31,"ct":"வெகுளாமை","ce":"On Not Getting Angry","l1":"தன்னைத்தான் காக்கின் சினங்காக்க காவாக்கால்","l2":"தன்னையே கொல்லுஞ் சினம்.","mv":"ஒருவன் தன்னைத்தான் காத்துக் கொள்வதானால் சினம் வராமல் காத்துக் கொள்ள வேண்டும், காக்கா விட்டால் சினம் தன்னையே அழித்து விடும்.","ex":"If a man would guard himself, let him guard against anger; if he do not guard it, anger will kill him","t1":"Thannaiththaan Kaakkin Sinangaakka Kaavaakkaal","t2":"Thannaiye Kollunj Chinam"},{"n":306,"c":31,"ct":"வெகுளாமை","ce":"On Not Getting Angry","l1":"சினமென்னும் சேர்ந்தாரைக் கொல்லி இனமென்னும்","l2":"ஏமப் புணையைச் சுடும்.","mv":"சினம் என்னும் சேர்ந்தவரை அழிக்கும் நெருப்பு ஒருவனுக்கு இனம் இன்பத் தெப்பத்தையும் சுட்டழிக்கும்.","ex":"The fire of anger will burn up even the pleasant raft of friendship","t1":"Sinamennum Serndhaaraik Kolli Inamennum","t2":"Emap Punaiyaich Chutum"},{"n":307,"c":31,"ct":"வெகுளாமை","ce":"On Not Getting Angry","l1":"சினத்தைப் பொருளென்று கொண்டவன் கேடு","l2":"நிலத்தறைந்தான் கைபிழையா தற்று.","mv":"(தன் வல்லமை புலப்படுத்தச்) சினத்தை பொருளென்று கொண்டவன் அழிதல், நிலத்தை அறைந்தவனுடைய கை தப்பாதது போல் ஆகும்.","ex":"Destruction will come upon him who ragards anger as a good thing, as surely as the hand of him who strikes the ground will not fail","t1":"Sinaththaip Porulendru Kontavan Ketu","t2":"Nilaththaraindhaan Kaipizhaiyaa Thatru"},{"n":308,"c":31,"ct":"வெகுளாமை","ce":"On Not Getting Angry","l1":"இணர்எரி தோய்வன்ன இன்னா செயினும்","l2":"புணரின் வெகுளாமை நன்று.","mv":"பலச் சுடர்களை உடைய பெரு நெருப்பில் தோய்வது போன்ற துன்பத்தை ஒருவன் செய்த போதிலும் கூடுமானால் அவன் மேல் சினங் கொள்ளாதிருத்தல் நல்லது.","ex":"Though one commit things against you as painful (to bear) as if a bundle of fire had been thrust upon you, it will be well, to refrain, if possible, from anger","t1":"Inareri Thoivanna Innaa Seyinum","t2":"Punarin Vekulaamai Nandru"},{"n":309,"c":31,"ct":"வெகுளாமை","ce":"On Not Getting Angry","l1":"உள்ளிய தெல்லாம் உடனெய்தும் உள்ளத்தால்","l2":"உள்ளான் வெகுளி எனின்.","mv":"ஒருவன் தன் மனதால் சினத்தை எண்ணாதிருப்பானானால் நினைத்த நன்மைகளை எல்லாம் அவன் ஒருங்கே பெறுவான்.","ex":"If a man never indulges anger in his heart, he will at once obtain whatever he has thought of","t1":"Ulliya Thellaam Utaneydhum Ullaththaal","t2":"Ullaan Vekuli Enin"},{"n":310,"c":31,"ct":"வெகுளாமை","ce":"On Not Getting Angry","l1":"இறந்தார் இறந்தார் அனையர் சினத்தைத்","l2":"துறந்தார் துறந்தார் துணை.","mv":"சினத்தில் அளவு கடந்து சென்றவர் இறந்தவரைப் போன்றவர், சினத்தை அடியோடு துறந்தவர் துறந்தவர்க்கு ஒப்பாவர்.","ex":"Those, who give way to excessive anger, are no better than dead men; but those, who are freed from it, are equal to those who are freed (from death)","t1":"Irandhaar Irandhaar Anaiyar Sinaththaith","t2":"Thurandhaar Thurandhaar Thunai"},{"n":311,"c":32,"ct":"இன்னாசெய்யாமை","ce":"On Not Doing Evil","l1":"சிறப்பீனும் செல்வம் பெறினும் பிறர்க்கு இன்னா","l2":"செய்யாமை மாசற்றார் கோள்.","mv":"சிறப்பைத்தருகின்ற பெருஞ் செல்வத்தைப் பெறுவதாக இருந்தாலும், பிறர்க்குத் துன்பம் செய்யாதிருத்தலே மாசற்றவரின் கொள்கையாம்.","ex":"It is the determination of the spotless not to cause sorrow to others, although they could (by so causing) obtain the wealth which confers greatness","t1":"Sirappeenum Selvam Perinum Pirarkku","t2":"Innaa Seyyaamai Maasatraar Kol"},{"n":312,"c":32,"ct":"இன்னாசெய்யாமை","ce":"On Not Doing Evil","l1":"கறுத்துஇன்னா செய்தவக் கண்ணும் மறுத்தின்னா","l2":"செய்யாமை மாசற்றார் கோள்.","mv":"ஒருவன் கறுவுகொண்டு துன்பம் செய்த போதிலும் அவனுக்கு திரும்ப துன்பம் செய்யாதிருத்தலே மாசற்றவரின் கொள்கையாகும்.","ex":"It is the determination of the spotless not to do evil, even in return, to those who have cherished enmity and done them evil","t1":"Karuththuinnaa Seydhavak Kannum Maruththinnaa","t2":"Seyyaamai Maasatraar Kol"},{"n":313,"c":32,"ct":"இன்னாசெய்யாமை","ce":"On Not Doing Evil","l1":"செய்யாமல் செற்றார்க்கும் இன்னாத செய்தபின்","l2":"உய்யா விழுமந் தரும்.","mv":"தான் ஒன்றும் செய்யாதிருக்கத் தனக்குத் தீங்கு செய்தவர்க்கும் துன்பமானாவற்றைச் செய்தால் செய்தபிறகு தப்பமுடியாத துன்பத்தையே கொடுக்கும்.","ex":"In an ascetic inflict suffering even on those who hate him, when he has not done them any evil, it will afterwards give him irretrievable sorrow","t1":"Seyyaamal Setraarkkum Innaadha Seydhapin","t2":"Uyyaa Vizhuman Tharum"},{"n":314,"c":32,"ct":"இன்னாசெய்யாமை","ce":"On Not Doing Evil","l1":"இன்னாசெய் தாரை ஒறுத்தல் அவர்நாண","l2":"நன்னயஞ் செய்து விடல்.","mv":"இன்னா செய்தவரைத் தண்டித்தல் அவரே நாணும் படியாக அவருக்கு நல்லுதவி செய்து அவருடைய தீமையையும் நன்மையையும் மறந்து விடுதலாகும்.","ex":"The (proper) punishment to those who have done evil (to you), is to put them to shame by showing them kindness, in return and to forget both the evil and the good done on both sides","t1":"Innaasey Thaarai Oruththal Avarnaana","t2":"Nannayanj Cheydhu Vital"},{"n":315,"c":32,"ct":"இன்னாசெய்யாமை","ce":"On Not Doing Evil","l1":"அறிவினான் ஆகுவ துண்டோ பிறிதின்நோய்","l2":"தந்நோய்போல் போற்றாக் கடை.","mv":"மற்ற உயிரின் துன்பத்தை தன் துன்பம் போல் கருதிக் காப்பாற்றா விட்டால் பெற்றுள்ள அறிவினால் ஆகும் பயன் உண்டோ.","ex":"What benefit has he derived from his knowledge, who does not endeavour to keep off pain from another as much as from himself ?","t1":"Arivinaan Aakuva Thunto Piridhinnoi","t2":"Thannoipol Potraak Katai"},{"n":316,"c":32,"ct":"இன்னாசெய்யாமை","ce":"On Not Doing Evil","l1":"இன்னா எனத்தான் உணர்ந்தவை துன்னாமை","l2":"வேண்டும் பிறன்கண் செயல்.","mv":"ஒருவன் துன்பமானவை என்று தன் வாழ்க்கையில் கண்டு உணர்ந்தவைகளை மற்றவனிடத்தில் செய்யாமல் தவிர்க்க வேண்டும்.","ex":"Let not a man consent to do those things to another which, he knows, will cause sorrow","t1":"Innaa Enaththaan Unarndhavai Thunnaamai","t2":"Ventum Pirankan Seyal"},{"n":317,"c":32,"ct":"இன்னாசெய்யாமை","ce":"On Not Doing Evil","l1":"எனைத்தானும் எஞ்ஞான்றும் யார்க்கும் மனத்தானாம்","l2":"மாணாசெய் யாமை தலை.","mv":"எவ்வளவு சிறியதாயினும் எக்காலத்திலும் எவரிடத்திலும் மனதால் எண்ணி உண்டாகின்ற துன்பச்செயலைச் செய்யாதிருத்தலே நல்லது.","ex":"It is the chief of all virtues not knowingly to do any person evil, even in the lowest degree, and at any time","t1":"Enaiththaanum Egngnaandrum Yaarkkum Manaththaanaam","t2":"Maanaasey Yaamai Thalai"},{"n":318,"c":32,"ct":"இன்னாசெய்யாமை","ce":"On Not Doing Evil","l1":"தன்னுயிர்ககு ஏன்னாமை தானறிவான் என்கொலோ","l2":"மன்னுயிர்க்கு இன்னா செயல்.","mv":"தன் உயிருக்குத் துன்பமானவை இவை என்று உணர்ந்தவன், அத் துன்பத்தை மற்ற உயிருக்குச் செய்தல் என்ன காரணத்தாலோ.","ex":"Why does a man inflict upon other creatures those sufferings, which he has found by experience are sufferings to himself ?","t1":"Thannuyirkaku Ennaamai Thaanarivaan Enkolo","t2":"Mannuyirkku Innaa Seyal"},{"n":319,"c":32,"ct":"இன்னாசெய்யாமை","ce":"On Not Doing Evil","l1":"பிறர்க்கின்னா முற்பகல் செய்யின் தமக்கு இன்னா","l
