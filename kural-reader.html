.","ex":"My precious life is saved by the raise of rumour, and this, to my good luck no others are aware of","t1":"Alarezha Aaruyir Na�rkum Adhanaip","t2":"Palarariyaar Paakkiyath Thaal"},{"n":1142,"c":115,"ct":"அலரறிவுறுத்தல்","ce":"Rumours of Secret Love","l1":"மலரன்ன கண்ணாள் அருமை அறியாது","l2":"அலரெமக்கு ஈந்ததிவ் வூர்.","mv":"மலர் போன்ற கண்ணை உடைய இவளுடைய அருமை அறியாமல், இந்த ஊரார் எளியவளாகக் கருதி அலர் கூறி எமக்கு உதவி செய்தனர்.","ex":"Not knowing the value of her whose eyes are like flowers this town has got up a rumour about me","t1":"Malaranna Kannaal Arumai Ariyaadhu","t2":"Alaremakku Eendhadhiv Voor"},{"n":1143,"c":115,"ct":"அலரறிவுறுத்தல்","ce":"Rumours of Secret Love","l1":"உறாஅதோ ஊரறிந்த கெளவை அதனைப்","l2":"பெறாஅது பெற்றன்ன நீர்த்து.","mv":"ஊரார் எல்லோரும் அறிந்துள்ள அலர் நமக்குப் பொருந்தாதோ, (பொருந்தும்) அந்த அலர் பெறமுடியாமலிருந்து பெற்றார் போன்ற நன்மை உடையதாக இருக்கின்றது.","ex":"Will I not get a rumour that is known to the (whole) town ? For what I have not got is as if I had got it (already)","t1":"Uraaadho Oorarindha Kelavai Adhanaip","t2":"Peraaadhu Petranna Neerththu"},{"n":1144,"c":115,"ct":"அலரறிவுறுத்தல்","ce":"Rumours of Secret Love","l1":"கவ்வையால் கவ்விது காமம் அதுவின்றேல்","l2":"தவ்வென்னும் தன்மை இழந்து.","mv":"எம் காமம் ஊரார் சொல்லுகின்ற அலரால் வளர்வதாயிற்று, அந்த அலர் இல்லையானால் அது தன் தன்மை இழந்து சுருங்கிப் போய்விடும்.","ex":"Rumour increases the violence of my passion; without it it would grow weak and waste away","t1":"Kavvaiyaal Kavvidhu Kaamam Adhuvindrel","t2":"Thavvennum Thanmai Izhandhu"},{"n":1145,"c":115,"ct":"அலரறிவுறுத்தல்","ce":"Rumours of Secret Love","l1":"களித்தொறும் கள்ளுண்டல் வேட்டற்றால் காமம்","l2":"வெளிப்படுந் தோறும் இனிது.","mv":"காமம் அலரால் வெளிப்பட இனியதாதல், கள்ளுண்பவர் கள்ளுண்டு மயங்க மயங்க அக் கள்ளுண்பதையே விரும்பினாற் போன்றது.","ex":"As drinking liquor is delightful (to one) whenever one is in mirth, so is lust delightful to me whenever it is the subject of rumour","t1":"Kaliththorum Kalluntal Vettatraal Kaamam","t2":"Velippatun Thorum Inidhu"},{"n":1146,"c":115,"ct":"அலரறிவுறுத்தல்","ce":"Rumours of Secret Love","l1":"கண்டது மன்னும் ஒருநாள் அலர்மன்னும்","l2":"திங்களைப் பாம்புகொண் டற்று.","mv":"காதலரைக் கண்டது ஒருநாள் தான், அதனால் உண்டாகிய அலரோ, திங்களைப் பாம்பு கொண்ட செய்தி போல் எங்கும் பரந்து விட்டது.","ex":"It was but a single day that I looked on (my lover); but the rumour thereof has spread like the seizure of the moon by the serpent","t1":"Kantadhu Mannum Orunaal Alarmannum","t2":"Thingalaip Paampukon Tatru"},{"n":1147,"c":115,"ct":"அலரறிவுறுத்தல்","ce":"Rumours of Secret Love","l1":"ஊரவர் கெளவை எருவாக அன்னைசொல்","l2":"நீராக நீளும்இந் நோய்.","mv":"இந்தக் காம நோய் ஊராரின் அலர் தூற்றலே எருவாகவும் அன்னை கடிந்து சொல்லும் கடுஞ்சொல்லே நீராகவும் கொண்டு செழித்து வளர்கின்றது.","ex":"This malady (of lust) is manured by the talk of women and watered by the (harsh) words of my mother","t1":"Ooravar Kelavai Eruvaaka Annaisol","t2":"Neeraaka Neelumin Noi"},{"n":1148,"c":115,"ct":"அலரறிவுறுத்தல்","ce":"Rumours of Secret Love","l1":"நெய்யால் எரிநுதுப்பேம் என்றற்றால் கெளவையால்","l2":"காமம் நுதுப்பேம் எனல்.","mv":"அலர் கூறுவதால் காமத்தை அடக்குவோம் என்று முயலுதல், நெய்யால் நெருப்பை அவிப்போம் என்று முயல்வதைப் போன்றது.","ex":"To say that one could extinguish passion by rumour is like extinguishing fire with ghee","t1":"Neyyaal Erinudhuppem Endratraal Kelavaiyaal","t2":"Kaamam Nudhuppem Enal"},{"n":1149,"c":115,"ct":"அலரறிவுறுத்தல்","ce":"Rumours of Secret Love","l1":"அலர்நாண ஒல்வதோ அஞ்சலோம்பு என்றார்","l2":"பலர்நாண நீத்தக் கடை.","mv":"அஞ்ச வேண்டா என்று அன்று உறுதிகூறியவர், இன்று பலரும் நாணும்படியாக நம்மை விட்டுப் பிரிந்தால் அதனால் அலருக்கு நாணியிருக்க முடியுமோ.","ex":"When the departure of him who said \"fear not\" has put me to shame before others, why need I be ashamed of scandal","t1":"Alarnaana Olvadho Anjalompu Endraar","t2":"Palarnaana Neeththak Katai"},{"n":1150,"c":115,"ct":"அலரறிவுறுத்தல்","ce":"Rumours of Secret Love","l1":"தாம்வேண்டின் நல்குவர் காதலர் யாம்வேண்டும்","l2":"கெளவை எடுக்கும்இவ் வூர்.","mv":"யாம் விரும்புகின்ற அலரை இவ்வூரார் எடுத்துக்கூறுகின்றனர், அதனால் இனிமேல் காதலர் விரும்பினால் விரும்பியவாறு அதனை உதவுவார்.","ex":"The rumour I desire is raised by the town (itself); and my lover would if desired consent (to my following him)","t1":"Thaamventin Nalkuvar Kaadhalar Yaamventum","t2":"Kelavai Etukkumiv Voor"},{"n":1151,"c":116,"ct":"பிரிவாற்றாமை","ce":"The Pangs of Separation","l1":"செல்லாமை உண்டேல் எனக்குரை மற்றுநின்","l2":"வல்வரவு வாழ்வார்க் குரை.","mv":"பிரிந்து செல்லாத நிலைமை இருந்தால் எனக்குச் சொல், பிரிந்து சென்று விரைந்து வருதலைப் பற்றியானால் அதுவரையில் உயிர்வாழ வல்லவர்க்குச் சொல்.","ex":"If it is not departure, tell me; but if it is your speedy return, tell it to those who would be alive then","t1":"Sellaamai Untel Enakkurai Matrunin","t2":"Valvaravu Vaazhvaark Kurai"},{"n":1152,"c":116,"ct":"பிரிவாற்றாமை","ce":"The Pangs of Separation","l1":"இன்கண் உடைத்தவர் பார்வல் பிரிவஞ்சும்","l2":"புன்கண் உடைத்தால் புணர்வு.","mv":"அவருடைய பார்வை முன்பு இன்பம் உடையதாக இருந்தது, இப்போது அவருடைய கூட்டம் பிரிவுக்கு அஞ்சுகின்ற துன்பம் உடையதாக இருக்கின்றது.","ex":"His very look was once pleasing; but (now) even intercourse is painful through fear of separation","t1":"Inkan Utaiththavar Paarval Pirivanjum","t2":"Punkan Utaiththaal Punarvu"},{"n":1153,"c":116,"ct":"பிரிவாற்றாமை","ce":"The Pangs of Separation","l1":"அரிதரோ தேற்றம் அறிவுடையார் கண்ணும்","l2":"பிரிவோ ரிடத்துண்மை யான்.","mv":"அறிவுடைய காதலரிடத்தும் பிரிவு ஒரு காலத்தில் உள்ள படியால் அவர் பிரியேன் என்று சொல்லும் உறுதி மொழியை நம்பித் தெளிவது அரிது.","ex":"As even the lover who understands (everything) may at times depart, confidence is hardly possible","t1":"Aridharo Thetram Arivutaiyaar Kannum","t2":"Pirivo Ritaththunmai Yaan"},{"n":1154,"c":116,"ct":"பிரிவாற்றாமை","ce":"The Pangs of Separation","l1":"அளித்தஞ்சல் என்றவர் நீப்பின் தெளித்தசொல்","l2":"தேறியார்க்கு உண்டோ தவறு.","mv":"அருள் மிகுந்தவராய் அஞ்ச வேண்டா என்று முன் தேற்றியவர் பிரிந்து செல்வாரானால் அவர் கூறிய உறுதிமொழியை நம்பித் தெளிந்தவர்க்கு குற்றம் உண்டோ.","ex":"If he who bestowed his love and said \"fear not\" should depart, will it be the fault of those who believed in (his) assuring words ?","t1":"Aliththanjal Endravar Neeppin Theliththasol","t2":"Theriyaarkku Unto Thavaru"},{"n":1155,"c":116,"ct":"பிரிவாற்றாமை","ce":"The Pangs of Separation","l1":"ஓம்பின் அமைந்தார் பிரிவோம்பல் மற்றவர்","l2":"நீங்கின் அரிதால் புணர்வு.","mv":"காத்துக் கொள்வதானால் காதலராக அமைந்தவரின் பிரிவு நேராமல் காக்க வேண்டும், அவர் பிரிந்து நீங்கினால் மீண்டும் கூடுதல் அரிது.","ex":"If you would save (my life), delay the departure of my destined (husband); for if he departs, intercourse will become impossible","t1":"Ompin Amaindhaar Pirivompal Matravar","t2":"Neengin Aridhaal Punarvu"},{"n":1156,"c":116,"ct":"பிரிவாற்றாமை","ce":"The Pangs of Separation","l1":"பிரிவுரைக்கும் வன்கண்ணர் ஆயின் அரிதவர்","l2":"நல்குவர் என்னும் நசை.","mv":"பிரிவைப்பற்றி தெரிவிக்கும் அளவிற்குக் கல் நெஞ்சம் உடையவரானால் , அத்தகையவர் திரும்பிவந்து அன்பு செய்வார் என்னும் ஆசை பயனற்றது.","ex":"Is hard, when he could stand, and of departure speak to me","t1":"Pirivuraikkum Vankannar Aayin Aridhavar","t2":"Nalkuvar Ennum Nasai"},{"n":1157,"c":116,"ct":"பிரிவாற்றாமை","ce":"The Pangs of Separation","l1":"துறைவன் துறந்தமை தூற்றாகொல் முன்கை","l2":"இறைஇறவா நின்ற வளை.","mv":"என் மெலிவால் முன் கையில் இறை கடந்து கழலும் வளையல்கள், தலைவன் விட்டுப் பிரிந்த செய்தியைப் பலரறியத் தெரிவித்துத் தூற்றாமலிருக்குமோ.","ex":"Do not the rings that begin to slide down my fingers forebode the separation of my lord ?","t1":"Thuraivan Thurandhamai Thootraakol Munkai","t2":"Iraiiravaa Nindra Valai"},{"n":1158,"c":116,"ct":"பிரிவாற்றாமை","ce":"The Pangs of Separation","l1":"இன்னாது இனன்இல்ஊர் வாழ்தல் அதனினும்","l2":"இன்னாது இனியார்ப் பிரிவு.","mv":"இனத்தவராக நம்மேல் அன்புடையார் இல்லாத ஊரில் வாழ்தல் துன்பமானது, இனியக் காதலரின் பிரிவு அதை விடத் துன்பமானது.","ex":"Painful is it to live in a friendless town; but far more painful is it to part from one's lover","t1":"Innaadhu Inaniloor Vaazhdhal Adhaninum","t2":"Innaadhu Iniyaarp Pirivu"},{"n":1159,"c":116,"ct":"பிரிவாற்றாமை","ce":"The Pangs of Separation","l1":"தொடிற்சுடின் அல்லது காமநோய் போல","l2":"விடிற்சுடல் ஆற்றுமோ தீ.","mv":"நெருப்பு, தன்னைத் தொட்டால் சுடுமே அல்லாமல் காமநோய் போல் தன்னை விட்டு நீங்கிய பொழுது சுடவல்லதாகுமோ.","ex":"Fire burns when touched; but, like the sickness of love, can it also burn when removed ?","t1":"Thotirsutin Alladhu Kaamanoi Pola","t2":"Vitirsutal Aatrumo Thee"},{"n":1160,"c":116,"ct":"பிரிவாற்றாமை","ce":"The Pangs of Separation","l1":"அரிதாற்றி அல்லல்நோய் நீக்கிப் பிரிவாற்றிப்","l2":"பின்இருந்து வாழ்வார் பலர்.","mv":"பிரிய முடியாத பிரிவிற்கு உடன்பட்டு,( பிரியும் போது) துன்பத்தால் கலங்குவதையும், விட்டு பிரிந்த பின் பொருத்திருந்து பின்னும் உயிரோடிருந்து வாழ்வோர் உலகில் பலர்.","ex":"As if there were many indeed that can consent to the impossible, kill their pain, endure separation and yet continue to live afterwards","t1":"Aridhaatri Allalnoi Neekkip Pirivaatrip","t2":"Pinirundhu Vaazhvaar Palar"},{"n":1161,"c":117,"ct":"படர்மெலிந்திரங்கல்","ce":"The Cry of the Separated","l1":"மறைப்பேன்மன் யானிஃதோ நோயை இறைப்பவர்க்கு","l2":"ஊற்றுநீர் போல மிகும்.","mv":"இக் காமநோயைப் பிறர் அறியாமல் யான் மறைப்பேன், ஆனால் இது இறைப்பவர்க்கு ஊற்று நீர் மிகுவது போல் மிகுகின்றது.","ex":"I would hide this pain from others; but it (only) swells like a spring to those who drain it","t1":"Maraippenman Yaaniqdho Noyai Iraippavarkku","t2":"Ootruneer Pola Mikum"},{"n":1162,"c":117,"ct":"படர்மெலிந்திரங்கல்","ce":"The Cry of the Separated","l1":"கரத்தலும் ஆற்றேன்இந் நோயைநோய் செய்தார்க்கு","l2":"உரைத்தலும் நாணுத் தரும்.","mv":"இக் காமநோயைப் பிறர் அறியாமல் முற்றிலும் மறைக்கவும் முடியவில்லை, நோய் செய்த காதலர்க்குச் சொல்வதும் நாணம் தருகின்றது.","ex":"I cannot conceal this pain, nor can I relate it without shame to him who has caused it","t1":"Karaththalum Aatrenin Noyainoi Seydhaarkku","t2":"Uraiththalum Naanuth Tharum"},{"n":1163,"c":117,"ct":"படர்மெலிந்திரங்கல்","ce":"The Cry of the Separated","l1":"காமமும் நாணும் உயிர்காவாத் தூங்கும்என்","l2":"நோனா உடம்பின் அகத்து.","mv":"துன்பத்தைப் பொருக்காமல் வருந்துகின்ற என் உடம்பினிடத்தில் உயிரே காவடித்தண்டாகக் கொண்டு காமநோயும் நாணமும் இருப்பக்கமாக தொங்குகின்றன.","ex":"(Both) lust and shame, with my soul for their shoulder pole balance themselves on a body that cannot bear them","t1":"Kaamamum Naanum Uyirkaavaath Thoongumen","t2":"Nonaa Utampin Akaththu"},{"n":1164,"c":117,"ct":"படர்மெலிந்திரங்கல்","ce":"The Cry of the Separated","l1":"காமக் கடல்மன்னும் உண்டே அதுநீந்தும்","l2":"ஏமப் புணைமன்னும் இல்.","mv":"காமநோயாகிய கடல் இருக்கின்றது. ஆனால் அதை நீந்திக்கடந்து செல்வதற்கு வேண்டிய காவலான ‌தோணியோ இல்லை.","ex":"There is indeed a flood of lust; but there is no raft of safety to cross it with","t1":"Kaamak Katalmannum Unte Adhuneendhum","t2":"Emap Punaimannum Il"},{"n":1165,"c":117,"ct":"படர்மெலிந்திரங்கல்","ce":"The Cry of the Separated","l1":"துப்பின் எவனாவர் மன்கொல் துயர்வரவு","l2":"நட்பினுள் ஆற்று பவர்.","mv":"( இன்பமான) நட்பிலேயே துயரத்தை வரச் செய்வதில் வல்லவர். ( துன்பம் தரும் பகையை வெல்லும்) வலிமை வேண்டும்போது என்ன ஆவாரோ?","ex":"What will they prove when angry tempests lower?","t1":"Thuppin Evanaavar Mankol Thuyarvaravu","t2":"Natpinul Aatru Pavar"},{"n":1166,"c":117,"ct":"படர்மெலிந்திரங்கல்","ce":"The Cry of the Separated","l1":"இன்பம் கடல்மற்றுக் காமம் அஃதடுங்கால்","l2":"துன்பம் அதனிற் பெரிது.","mv":"காமம் மகிழ்விக்கும்போது அதன் இன்பம் கடல் போன்றது; அது வருத்தும்போது அதன் துன்பமோ கடலைவிடப் பெரியது.","ex":"The pleasure of lust is (as great as) the sea; but the pain of lust is far greater","t1":"Inpam Katalmatruk Kaamam Aqdhatungaal","t2":"Thunpam Adhanir Peridhu"},{"n":1167,"c":117,"ct":"படர்மெலிந்திரங்கல்","ce":"The Cry of the Separated","l1":"காமக் கடும்புனல் நீந்திக் கரைகாணேன்","l2":"யாமத்தும் யானே உளேன்.","mv":"காமம் என்னும்‌ வெள்ளத்தை நீந்தியும் அதன் கரையை யான் காணவில்லை; நள்ளிரவிலும் யான் தனியே இருக்கின்றேன்.","ex":"I have swam across the terrible flood of lust, but have not seen its shore; even at midnight I am alone; still I live","t1":"Kaamak Katumpunal Neendhik Karaikaanen","t2":"Yaamaththum Yaane Ulen"},{"n":1168,"c":117,"ct":"படர்மெலிந்திரங்கல்","ce":"The Cry of the Separated","l1":"மன்னுயிர் எல்லாம் துயிற்றி அளித்திரா","l2":"என்னல்லது இல்லை துணை.","mv":"இந்த இராக்காலம் இரங்கத்தக்கது; எல்லா உயிரையும் தூங்கச் செய்துவிட்டு என்னை அல்லாமல் வேறு துணை இல்லாமல் இருக்கின்றது.","ex":"The night which graciously lulls to sleep all living creatures, has me alone for her companion","t1":"Mannuyir Ellaam Thuyitri Aliththiraa","t2":"Ennalladhu Illai Thunai"},{"n":1169,"c":117,"ct":"படர்மெலிந்திரங்கல்","ce":"The Cry of the Separated","l1":"> கொடியார் கொடுமையின் தாம்கொடிய இந்நாள்","l2":"நெடிய கழியும் இரா.","mv":"( பிரிந்து துன்புறுகின்ற) இந்நாட்களில் நெடுநேரம் உடையனவாய்க் கழிகின்ற இராக்காலங்கள், பிரிந்த கொடியவரின் கொடுமையை விடத் தாம் கொடியவை.","ex":"The long nights of these days are far more cruel than the heartless one who is torturing me","t1":"Kotiyaar Kotumaiyin Thaamkotiya Innaal","t2":"Netiya Kazhiyum Iraa"},{"n":1170,"c":117,"ct":"படர்மெலிந்திரங்கல்","ce":"The Cry of the Separated","l1":"உள்ளம்போன்று உள்வழிச் செல்கிற்பின் வெள்ளநீர்","l2":"நீந்தல மன்னோஎன் கண்.","mv":"காதலர் உள்ள இடத்திற்கு என் மனத்தைப்போல் செல்ல முடியுமானால், என்‌ கண்கள் இவ்வாறு வெள்ளமாகிய கண்ணீரில் நீந்த வேண்டியதில்லை.","ex":"Could mine eyes travel like my thoughts to the abode (of my absent lord), they would not swim in this flood of tears","t1":"Ullampondru Ulvazhich Chelkirpin Vellaneer","t2":"Neendhala Mannoen Kan"},{"n":1171,"c":118,"ct":"கண்விதுப்பழிதல்","ce":"On Eyes That Languish","l1":"கண்தாம் கலுழ்வ தெவன்கொலோ தண்டாநோய்","l2":"தாம்காட்ட யாம்கண் டது.","mv":"தீராத இக்காமநோய், கண்கள் காட்ட யாம் கண்டதால் விளைந்தது; அவ்வாறிருக்க, காட்டிய கண்கள், இன்று அன்பு கொண்டு உணராமல் துன்பத்தால் வருந்துவது ஏன்?","ex":"As this incurable malady has been caused by my eyes which showed (him) to me, why should they now weep for (him)","t1":"Kandhaam Kaluzhva Thevankolo Thantaanoi","t2":"Thaamkaatta Yaamkan Tadhu"},{"n":1172,"c":118,"ct":"கண்விதுப்பழிதல்","ce":"On Eyes That Languish","l1":"தெரிந்துணரா நோக்கிய உண்கண் பரிந்துணராப்","l2":"பைதல் உழப்பது எவன்?","mv":"ஆராய்ந்து உணராமல் அன்று நோக்கிக் காதல் கொண்ட கண்கள், இன்று அன்பு கொண்டு உணராமல் துன்பத்தால் வருந்துவது ஏன்?","ex":"The dyed eyes that (then) looked without foresight, why should they now endure sorrow, without feeling sharply (their own fault)","t1":"Therindhunaraa Nokkiya Unkan Parindhunaraap","t2":"Paidhal Uzhappadhu Evan?"},{"n":1173,"c":118,"ct":"கண்விதுப்பழிதல்","ce":"On Eyes That Languish","l1":"கதுமெனத் தாநோக்கித் தாமே கலுழும்","l2":"இதுநகத் தக்க துடைத்து.","mv":"அன்று காதலரைக் கண்கள் தாமே விரைந்து நோக்கி இன்று தாமே அழுகின்றன; இது நகைக்கத்தக்க தன்மை உடையது.","ex":"They themselves looked eagerly (on him) and now they weep. Is not this to be laughed at ?","t1":"Kadhumenath Thaanokkith Thaame Kaluzhum","t2":"Ithunakath Thakka Thutaiththu"},{"n":1174,"c":118,"ct":"கண்விதுப்பழிதல்","ce":"On Eyes That Languish","l1":"பெயலாற்றா நீருலந்த உண்கண் உயலாற்றா","l2":"உய்வில்நோய் என்கண் நிறுத்து.","mv":"என் கண்கள், தப்பிப் பிழைக்க முடியாத தீராத காமநோயை என்னிடத்தில் உண்டாக்கி நிறுத்திவிட்டு, தாமும் அழமுடியாமல் நீர் வறண்டு விட்டன.","ex":"These painted eyes have caused me a lasting mortal disease; and now they can weep no more, the tears having dried up","t1":"Peyalaatraa Neerulandha Unkan Uyalaatraa","t2":"Uyvilnoi Enkan Niruththu"},{"n":1175,"c":118,"ct":"கண்விதுப்பழிதல்","ce":"On Eyes That Languish","l1":"படலாற்றா பைதல் உழக்கும் கடலாற்றாக்","l2":"காமநோய் செய்தஎன் கண்.","mv":"அன்று கடலும் தாங்கமுடியாத காமநோயை உண்டாக்கிய என் கண்கள், இன்று உறங்க முடியாமல் துன்பத்தால் வருந்துகின்றன.","ex":"Mine eyes have caused me a lust that is greater than the sea and (they themselves) endure the torture of sleeplessness","t1":"Patalaatraa Paidhal Uzhakkum Katalaatraak","t2":"Kaamanoi Seydhaen Kan"},{"n":1176,"c":118,"ct":"கண்விதுப்பழிதல்","ce":"On Eyes That Languish","l1":"ஓஒ இனிதே எமக்கிந்நோய் செய்தகண்","l2":"தாஅம் இதற்பட் டது.","mv":"எமக்கு இந்தக் காமநோயைஉண்டாக்கிய கண்கள், தாமும் இத்தகைய துன்பத்தைப்பட்டு வருந்துவது மிகவும் நல்லதே!","ex":"The eyes that have given me this disease have themselves been seized with this (suffering) Oh! I am much delighted","t1":"Oo Inidhe Emakkinnoi Seydhakan","t2":"Thaaam Itharpat Tadhu"},{"n":1177,"c":118,"ct":"கண்விதுப்பழிதல்","ce":"On Eyes That Languish","l1":"உழந்துழந் துள்நீர் அறுக விழைந்திழைந்து","l2":"வேண்டி அவர்க்கண்ட கண்.","mv":"அன்று விரும்பி நெகிழ்ந்து காதலரைக் கண்ட கண்கள் இன்று உறக்கமில்லாத துன்பத்தால் வருந்தி வருந்திக் கண்ணீரும் அற்றுப் போகட்டும்.","ex":"The eyes that became tender and gazed intently on him, may they suffer so much as to dry up the fountain of their tears","t1":"Uzhandhuzhan Thulneer Aruka Vizhaindhizhaindhu","t2":"Venti Avarkkanta Kan"},{"n":1178,"c":118,"ct":"கண்விதுப்பழிதல்","ce":"On Eyes That Languish","l1":"பேணாது பெட்டார் உளர்மன்னோ மற்றவர்க்","l2":"காணாது அமைவில கண்.","mv":"உள்ளத்தால் விரும்பாமலே சொல்லளவில் விரும்பிப் பழகியவர் ஒருவர் இருக்கின்றார்; அவரைக் காணாமல் கண்கள் அமைதியுறவில்லை.","ex":"He is indeed here who loved me with his lips but not with his heart but mine eyes suffer from not seeing him","t1":"Penaadhu Pettaar Ularmanno Matravark","t2":"Kaanaadhu Amaivila Kan"},{"n":1179,"c":118,"ct":"கண்விதுப்பழிதல்","ce":"On Eyes That Languish","l1":"வாராக்கால் துஞ்சா வரின்துஞ்சா ஆயிடை","l2":"ஆரஞர் உற்றன கண்.","mv":"காதலர் வாராவிட்டால் தூங்குவதில்லை; வந்தாலும் தூங்குவதில்லை; இவற்றுக்கி‌டையே என் கண்கள் மிக்க துன்பத்தை அடைந்தன.","ex":"When he is away they do not sleep; when he is present they do not sleep; in either case, mine eyes endure unbearable agony","t1":"Vaaraakkaal Thunjaa Varindhunjaa Aayitai","t2":"Aaragnar Utrana Kan"},{"n":1180,"c":118,"ct":"கண்விதுப்பழிதல்","ce":"On Eyes That Languish","l1":"மறைபெறல் ஊரார்க்கு அரிதன்றால் எம்போல்","l2":"அறைபறை கண்ணார் அகத்து.","mv":"அறையப்படும் பறைபோல் துன்பத்தை வெளிப்படுத்தும் கண்களை உடைய எம்மைப் போன்றவரிடத்தில் மறைபொருளான செய்தியை அறிதல் ஊரார்க்கு அரிது அன்று.","ex":"It is not difficult for the people of this place to understand the secret of those whose eyes, like mine, are as it were beaten drums","t1":"Maraiperal Ooraarkku Aridhandraal Empol","t2":"Araiparai Kannaar Akaththu"},{"n":1181,"c":119,"ct":"பசப்புறுபருவரல்","ce":"Grieving Over Love's Pallor","l1":"நயந்தவர்க்கு நல்காமை நேர்ந்தேன் பசந்தவென்","l2":"பண்பியார்க்கு உரைக்கோ பிற.","mv":"விரும்பிய காதலர்க்கு அன்று பிரிவை உடன்பட்டேன்; பிரிந்தபின் பசலை உற்ற என் தன்மையை வேறு யார்க்குச் சென்று சொல்வேன்?","ex":"I who (then) consented to the absence of my loving lord, to whom can I (now) relate the fact of my having turned sallow","t1":"Nayandhavarkku Nalkaamai Nerndhen Pasandhaven","t2":"Panpiyaarkku Uraikko Pira"},{"n":1182,"c":119,"ct":"பசப்புறுபருவரல்","ce":"Grieving Over Love's Pallor","l1":"அவர்தந்தார் என்னும் தகையால் இவர்தந்தென்","l2":"மேனிமேல் ஊரும் பசப்பு.","mv":"அந்தக் காதலர் உண்டாக்கினார் என்னும் பெருமிதத்தோடு இந்தப் பசலை நிறம் என்னுடைய மேனிமேல் ஏறி ஊர்ந்து பரவி வருகிறது.","ex":"Sallowness, as if proud of having been caused by him, would now ride on my person","t1":"Avardhandhaar Ennum Thakaiyaal Ivardhandhen","t2":"Menimel Oorum Pasappu"},{"n":1183,"c":119,"ct":"பசப்புறுபருவரல்","ce":"Grieving Over Love's Pallor","l1":"சாயலும் நாணும் அவர்கொண்டார் கைம்மாறா","l2":"நோயும் பசலையும் தந்து.","mv":"காம நோயையும் பசலை நிறத்தையும் எனக்குக் கைம்மாறாக ‌‌கொடுத்து விட்டு, என் சாயலையும் நாணத்தையும் அவர் என்னிடமிருந்து பெற்றுக் கொண்டார்.","ex":"He has taken (away) my beauty and modesty, and given me instead disease and sallowness","t1":"Saayalum Naanum Avarkontaar Kaimmaaraa","t2":"Noyum Pasalaiyum Thandhu"},{"n":1184,"c":119,"ct":"பசப்புறுபருவரல்","ce":"Grieving Over Love's Pallor","l1":"உள்ளுவன் மன்யான் உரைப்பது அவர்திறமால்","l2":"கள்ளம் பிறவோ பசப்பு.","mv":"யான் அவருடைய நல்லியல்புகளை நினைக்கின்றேன்; யான் உரைப்பதும் அவற்றையே; அவ்வாறிருந்தும் பசலை வந்தது வஞ்சனையோ? வேறு வகையோ?","ex":"I think (of him); and what I speak about is but his excellence; still is there sallowness; and this is deceitful","t1":"Ulluvan Manyaan Uraippadhu Avardhiramaal","t2":"Kallam Piravo Pasappu"},{"n":1185,"c":119,"ct":"பசப்புறுபருவரல்","ce":"Grieving Over Love's Pallor","l1":"உவக்காண்எம் காதலர் செல்வார் இவக்காண்என்","l2":"மேனி பசப்பூர் வது.","mv":"அதோ பார்! எம்முடைய காதலர் பிரிந்து செல்கின்றார்; இதோ பார்! என்னுடைய மேனியில் பசலை நிறம் வந்து படர்கிறது.","ex":"Just as my lover departed then, did not sallowness spread here on my person ?","t1":"Uvakkaanem Kaadhalar Selvaar Ivakkaanen","t2":"Meni Pasappoor Vadhu"},{"n":1186,"c":119,"ct":"பசப்புறுபருவரல்","ce":"Grieving Over Love's Pallor","l1":"விளக்கற்றம் பார்க்கும் இருளேபோல் கொண்கன்","l2":"முயக்கற்றம் பார்க்கும் பசப்பு.","mv":"விளக்கினுடைய மறைவைப் பார்த்துக் காத்திருக்கின்ற இருளைப் போலவே, தலைவனுடைய தழுவுதலின் ‌சோர்வைப் பார்த்துக் காத்திருக்கினறது.","ex":"Just as darkness waits for the failing light; so does sallowness wait for the laxity of my husband's intercourse","t1":"Vilakkatram Paarkkum Irulepol Konkan","t2":"Muyakkatram Paarkkum Pasappu"},{"n":1187,"c":119,"ct":"பசப்புறுபருவரல்","ce":"Grieving Over Love's Pallor","l1":"புல்லிக் கிடந்தேன் புடைபெயர்ந்தேன் அவ்வளவில்","l2":"அள்ளிக்கொள் வற்றே பசப்பு.","mv":"தலைவனைத் தழுவிக் கிடந்தேன்; பக்கத்தே சிறிது அகன்றேன்; அவ்வளவிலேயே பசலை நிறம் அள்ளிக் கொள்வதுபோல் வந்து பரவி விட்டதே!","ex":"I who was in close embrace just turned aside and the moment I did so, sallowness came on me like something to be seized on","t1":"Pullik Kitandhen Putaipeyarndhen Avvalavil","t2":"Allikkol Vatre Pasappu"},{"n":1188,"c":119,"ct":"பசப்புறுபருவரல்","ce":"Grieving Over Love's Pallor","l1":"பசந்தாள் இவள்என்பது அல்லால் இவளைத்","l2":"துறந்தார் அவர்என்பார் இல்.","mv":"இவள் பிரிவால் வருத்திப் பசலை நிறம் அடைந்தாள் என்ற பழி சொல்வதே அல்லாமல், இவளைக் காதலர் விட்டுப் பிரிந்தார் என்று சொல்பவர் இல்லையே!","ex":"Besides those who say \"she has turned sallow\" there are none who say \"he has forsaken her\"","t1":"Pasandhaal Ivalenpadhu Allaal Ivalaith","t2":"Thurandhaar Avarenpaar Il"},{"n":1189,"c":119,"ct":"பசப்புறுபருவரல்
