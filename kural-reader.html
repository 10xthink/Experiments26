2":"பிற்பகல் தாமே வரும்.","mv":"முற்பகலில் மற்றவருக்கு துன்பமானவற்றைச் செய்தால் அவ்வாறு செய்தவர்க்கே பிற்பகலில் துன்பங்கள் தாமாக வந்து சேரும்.","ex":"If a man inflict sorrow upon others in the morning, it will come upon him unsought in the very evening","t1":"Pirarkkinnaa Murpakal Seyyin Thamakku","t2":"Innaa Pirpakal Thaame Varum"},{"n":320,"c":32,"ct":"இன்னாசெய்யாமை","ce":"On Not Doing Evil","l1":"நோயெல்லாம் நோய்செய்தார் மேலவாம் நோய்செய்யார்","l2":"நோயின்மை வேண்டு பவர்.","mv":"துன்பம் எல்லாம் துன்பம் செய்தவரையேச் சார்வன, ஆகையால் துன்பம் இல்லாமல் வாழ்தலை விரும்புகின்றவர் பிறர்க்கு துன்பம் செய்யார்.","ex":"Sorrow will come upon those who cause pain to others; therfore those, who desire to be free from sorrow, give no pain to others","t1":"Noyellaam Noiseydhaar Melavaam Noiseyyaar","t2":"Noyinmai Ventu Pavar"},{"n":321,"c":33,"ct":"கொல்லாமை","ce":"On Not Killing","l1":"அறவினை யாதெனின் கொல்லாமை கோறல்","l2":"பிறவினை எல்லாந் தரும்.","mv":"அறமாகிய செயல் எது என்றால் ஒரு உயிரையும் கொல்லாமையாகும், கொல்லுதல் அறமல்லாத செயல்கள் எல்லாவற்றையும் விளைக்கும்.","ex":"Never to destroy life is the sum of all virtuous conduct The destruction of life leads to every evil","t1":"Aravinai Yaadhenin Kollaamai Koral","t2":"Piravinai Ellaan Tharum"},{"n":322,"c":33,"ct":"கொல்லாமை","ce":"On Not Killing","l1":"பகுத்துண்டு பல்லுயிர் ஓம்புதல் நூலோர்","l2":"தொகுத்தவற்றுள் எல்லாந் தலை.","mv":"கிடைத்ததைப் பகுந்து கொடுத்துத் தானும் உண்டு பல உயிர்களையும் காப்பாற்றுதல் அறநூலார் தொகுத்த அறங்கள் எல்லாவற்றிலும் தலையான அறமாகும்.","ex":"The chief of all (the virtues) which authors have summed up, is the partaking of food that has been shared with others, and the preservation of the mainfold life of other creatures","t1":"Pakuththuntu Palluyir Ompudhal Noolor","t2":"Thokuththavatrul Ellaan Thalai"},{"n":323,"c":33,"ct":"கொல்லாமை","ce":"On Not Killing","l1":"ஒன்றாக நல்லது கொல்லாமை மற்றதன்","l2":"பின்சாரப் பொய்யாமை நன்று.","mv":"இணையில்லாத ஓர் அறமாகக் கொல்லாமை நல்லது, அதற்கு அடுத்த நிலையில் கூறத்தக்கதாகப் பொய்யாமை நல்லது.","ex":"Not to destroy life is an incomparably (great) good next to it in goodness ranks freedom from falsehood","t1":"Ondraaka Nalladhu Kollaamai Matradhan","t2":"Pinsaarap Poiyaamai Nandru"},{"n":324,"c":33,"ct":"கொல்லாமை","ce":"On Not Killing","l1":"நல்லாறு எனப்படுவது யாதெனின் யாதொன்றும்","l2":"கொல்லாமை சூழும் நெறி.","mv":"நல்ல வழி என்று அறநூல்களால் சொல்லப்படுவது எது என்றால், எந்த உயிரையும் கொல்லாத அறத்தைப் போற்றும் நெறியாகும்.","ex":"Good path is that which considers how it may avoid killing any creature","t1":"Nallaaru Enappatuvadhu Yaadhenin Yaadhondrum","t2":"Kollaamai Soozhum Neri"},{"n":325,"c":33,"ct":"கொல்லாமை","ce":"On Not Killing","l1":"நிலைஅஞ்சி நீத்தாருள் எல்லாம் கொலைஅஞ்சிக்","l2":"கொல்லாமை சூழ்வான் தலை.","mv":"வாழ்க்கையின் தன்மையைக்கண்டு அஞ்சித் துறந்தவர்கள் எல்லாரிலும், கொலைசெய்வதற்க்கு அஞ்சிக் கொல்லாத அறத்தைப் போற்றுகின்றவன் உயர்ந்தவன்.","ex":"Of all those who, fearing the permanence of earthly births, have abandoned desire, he is the chief who, fearing (the guilt of) murder, considers how he may avoid the destruction of life","t1":"Nilaianji Neeththaarul Ellaam Kolaianjik","t2":"Kollaamai Soozhvaan Thalai"},{"n":326,"c":33,"ct":"கொல்லாமை","ce":"On Not Killing","l1":"கொல்லாமை மேற்கொண் டொழுகுவான் வாழ்நாள்மேல்","l2":"செல்லாது உயிருண்ணுங் கூற்று.","mv":"கொல்லாத அறத்தை மேற்கொண்டு நடக்கின்றவனுடைய வாழ்நாளின் மேல், உயிரைக்கொண்டு செல்லும் கூற்றுவனும் செல்லமாட்டான்.","ex":"Yama, the destroyer of life, will not attack the life of him, who acts under the determination of never destroying life","t1":"Kollaamai Merkon Tozhukuvaan Vaazhnaalmel","t2":"Sellaadhu Uyirunnung Kootru"},{"n":327,"c":33,"ct":"கொல்லாமை","ce":"On Not Killing","l1":"தன்னுயிர் நீப்பினும் செய்யற்க தான்பிறிது","l2":"இன்னுயிர் நீக்கும் வினை.","mv":"தன் உயிர் உடம்பிலிருந்து நீங்கிச் செல்வதாக இருந்தாலும், அதைத் தடுப்பதற்காகத் தான் வேறோர் உயிரை நீக்கும் செயலைச் செய்யக்கூடாது.","ex":"Let no one do that which would destroy the life of another, although he should by so doing, lose his own life","t1":"Thannuyir Neeppinum Seyyarka Thaanpiridhu","t2":"Innuyir Neekkum Vinai"},{"n":328,"c":33,"ct":"கொல்லாமை","ce":"On Not Killing","l1":"நன்றாகும் ஆக்கம் பெரிதெனினும் சான்றோர்க்குக்","l2":"கொன்றாகும் ஆக்கங் கடை.","mv":"கொலையால் நன்மையாக விளையும் ஆக்கம் பெரிதாக இருந்தாலும், சான்றோர்க்குக் கொலையால் வரும் ஆக்கம் மிக இழிவானதாகும்.","ex":"The advantage which might flow from destroying life in sacrifice, is dishonourable to the wise (who renounced the world), even although it should be said to be productive of great good","t1":"Nandraakum Aakkam Peridheninum Saandrorkkuk","t2":"Kondraakum Aakkang Katai"},{"n":329,"c":33,"ct":"கொல்லாமை","ce":"On Not Killing","l1":"கொலைவினைய ராகிய மாக்கள் புலைவினையர்","l2":"புன்மை தெரிவா ரகத்து.","mv":"கொலைத்தொழிலினராகிய மக்கள் அதன் இழிவை ஆராய்ந்தவரிடத்தில் புலைத்தொழிலுடையவராய்த் தாழ்ந்து தோன்றுவர்.","ex":"To minds of them who what is vileness know","t1":"Kolaivinaiya Raakiya Maakkal Pulaivinaiyar","t2":"Punmai Therivaa Rakaththu"},{"n":330,"c":33,"ct":"கொல்லாமை","ce":"On Not Killing","l1":"உயிர் உடம்பின் நீக்கியார் என்ப செயிர் உடம்பின்","l2":"செல்லாத்தீ வாழ்க்கை யவர்.","mv":"நோய் மிகுந்த உடம்புடன் வறுமையான தீய வாழ்க்கை உடையவர், முன்பு கொலை பல செய்து உயிர்களை உடம்புகளில் இருந்து நீக்கினவர் என்று அறிஞர் கூறுவர்.","ex":"(The wise) will say that men of diseased bodies, who live in degradation and in poverty, are those who separated the life from the body of animals (in a former birth)","t1":"Uyir Utampin Neekkiyaar Enpa","t2":"Seyir Utampin Sellaaththee Vaazhkkai"},{"n":331,"c":34,"ct":"நிலையாமை","ce":"On Instability","l1":"நில்லாத வற்றை நிலையின என்றுணரும்","l2":"புல்லறி வாண்மை கடை.","mv":"நிலையில்லாதவைகளை நிலையானவை என்று மயங்கி உணரும் புல்லறிவு உடையவராக இருத்தல் வாழ்க்கையில் இழிந்த நிலையாகும்.","ex":"That ignorance which considers those things to be stable which are not so, is dishonourable (to the wise)","t1":"Nillaadha Vatrai Nilaiyina Endrunarum","t2":"Pullari Vaanmai Katai"},{"n":332,"c":34,"ct":"நிலையாமை","ce":"On Instability","l1":"கூத்தாட்டு அவைக் குழாத் தற்றே பெருஞ்செல்வம்","l2":"போக்கும் அதுவிளிந் தற்று.","mv":"பெரிய செல்வம் வந்து சேர்தல், கூத்தாடும் இடத்தில் கூட்டம் சேர்வதைப் போன்றது, அது நீங்கிப் போதலும் கூத்து முடிந்ததும் கூட்டம் கலைவதைப் போன்றது.","ex":"The acquisition of wealth is like the gathering together of an assembly for a theatre; its expenditure is like the breaking up of that assembly","t1":"Kooththaattu Avaik Kuzhaath Thatre","t2":"Perunjelvam Pokkum Adhuvilin Thatru"},{"n":333,"c":34,"ct":"நிலையாமை","ce":"On Instability","l1":"அற்கா இயல்பிற்றுச் செல்வம் அதுபெற்றால்","l2":"அற்குப ஆங்கே செயல்.","mv":"செல்வம் நிலைக்காத இயல்பை உடையது, அத்தகைய செல்வத்தைப்பெற்றால், பெற்ற அப்போதே நிலையான அறங்களைச் செய்ய வேண்டும்.","ex":"Wealth is perishable; let those who obtain it immediately practise those (virtues) which are imperishable","t1":"Arkaa Iyalpitruch Chelvam Adhupetraal","t2":"Arkupa Aange Seyal"},{"n":334,"c":34,"ct":"நிலையாமை","ce":"On Instability","l1":"நாளென ஒன்றுபோற் காட்டி உயிர் ஈரும்","l2":"வாளது உணர்வார்ப் பெறின்.","mv":"வாழ்க்கையை ஆராய்ந்து உணர்வாரைப் பெற்றால் நாள் என்பது ஒரு கால அளவுகோல்காட்டி, உயிரை உடம்பிலிருந்து பிரித்து அறுக்கும் வாளாக உள்ளது.","ex":"Time, which shows itself (to the ignorant) as if it were something (real) is in the estimation of the wise (only) a saw which cuts down life","t1":"Naalena Ondrupor Kaatti Uyir","t2":"Eerum Vaaladhu Unarvaarp Perin"},{"n":335,"c":34,"ct":"நிலையாமை","ce":"On Instability","l1":"நாச்செற்று விக்குள்மேல் வாராமுன் நல்வினை","l2":"மேற்சென்று செய்யப் படும்","mv":"நாவை அடக்கி விக்கல் மேலெழுவதற்கு முன்னே (இறப்பு நெருங்குவதற்கு முன்) நல்ல அறச்செயலை விரைந்து செய்யத்தக்கதாகும்.","ex":"Let virtuous deeds be done quickly, before the hiccup comes making the tongue silent","t1":"Naachchetru Vikkulmel Vaaraamun Nalvinai","t2":"Mersendru Seyyap Patum"},{"n":336,"c":34,"ct":"நிலையாமை","ce":"On Instability","l1":"நெருநல் உளனொருவன் இன்றில்லை என்னும்","l2":"பெருமை உடைத்துஇவ் வுலகு.","mv":"நேற்று இருந்தவன் ஒருவன் இன்று இல்லாமல் இறந்து போனான் என்று சொல்லப்படும் நிலையாமைஆகிய பெருமை உடையது இவ்வுலகம்.","ex":"This world possesses the greatness that one who yesterday was is not today","t1":"Nerunal Ulanoruvan Indrillai Ennum","t2":"Perumai Utaiththuiv Vulaku"},{"n":337,"c":34,"ct":"நிலையாமை","ce":"On Instability","l1":"ஒருபொழுதும் வாழ்வது அறியார் கருதுப","l2":"கோடியும் அல்ல பல.","mv":"அறிவில்லாதவர் ஒரு வேளையாவது வாழ்க்கையின் தன்மையை ஆராய்ந்து அறிவதில்லை.ஆனால் வீணீல் எண்ணுவனவோ ஒரு கோடியும் அல்ல, மிகப்பல எண்ணங்கள்.","ex":"Innumerable are the thoughts which occupy the mind of (the unwise), who know not that they shall live another moment","t1":"Orupozhudhum Vaazhvadhu Ariyaar Karudhupa","t2":"Kotiyum Alla Pala"},{"n":338,"c":34,"ct":"நிலையாமை","ce":"On Instability","l1":"குடம்பை தனித்து ஒழியப் புள்பறந் தற்றே","l2":"உடம்பொடு உயிரிடை நட்பு.","mv":"உடம்போடு உயிர்க்கு உள்ள உறவு, தான் இருந்த கூடு தனியே இருக்க அதை விட்டு வேறிடத்திற்குப் பறவை பறந்தாற் போன்றது.","ex":"The love of the soul to the body is like (the love of) a bird to its egg which it flies away from and leaves empty","t1":"Kutampai Thaniththu Ozhiyap Pulparan","t2":"Thatre Utampotu Uyiritai Natpu"},{"n":339,"c":34,"ct":"நிலையாமை","ce":"On Instability","l1":"உறங்கு வதுபோலுஞ் சாக்காடு உறங்கி","l2":"விழிப்பது போலும் பிறப்பு.","mv":"இறப்பு எனப்படுவது ஒருவனுக்குஉறக்கம் வருதலைப் போன்றது, பிறப்பு எனப்படுவது உறக்கம் நீங்கி விழித்துக் கொள்வதைப் போன்றது.","ex":"Death is like sleep; birth is like awaking from it","t1":"Urangu Vadhupolunj Chaakkaatu Urangi","t2":"Vizhippadhu Polum Pirappu"},{"n":340,"c":34,"ct":"நிலையாமை","ce":"On Instability","l1":"புக்கில் அமைந்தின்று கொல்லோ உடம்பினுள்","l2":"துச்சில் இருந்த உயிர்க்கு.","mv":"(நோய்களுக்கு இடமாகிய) உடம்பில் ஒரு மூலையில் குடியிருந்த உயிர்க்கு, நிலையாகப் புகுந்திருக்கும் வீடு இதுவரையில் அமையவில்லையோ.","ex":"It seems as if the soul, which takes a temporary shelter in a body, had not attained a home","t1":"Pukkil Amaindhindru Kollo Utampinul","t2":"Thuchchil Irundha Uyirkku"},{"n":341,"c":35,"ct":"துறவு","ce":"On Renunciation","l1":"யாதனின் யாதனின் நீங்கியான் நோதல்","l2":"அதனின் அதனின் இலன்.","mv":"ஒருவன் எந்தப் பொருளிலிருந்து, எந்தப் பொருளிலிருந்து பற்று நீங்கியவனாக இருக்கின்றானோ, அந்தந்தப் பொருளால் அவன் துன்பம் அடைவதில்லை.","ex":"Whatever thing, a man has renounced, by that thing; he cannot suffer pain","t1":"Yaadhanin Yaadhanin Neengiyaan Nodhal","t2":"Adhanin Adhanin Ilan"},{"n":342,"c":35,"ct":"துறவு","ce":"On Renunciation","l1":"வேண்டின் உண் டாகத் துறக்க துறந்தபின்","l2":"ஈண்டுஇயற் பால பல.","mv":"துன்பமில்லாத நிலைமை வேண்டுமானால் எல்லாப் பொருள்களும் உள்ள காலத்திலேயெ துறக்க வேண்டும்,துறந்த பின் இங்குப் பெறக்கூடும் இன்பங்கள் பல.","ex":"After a man has renounced (all things), there will still be many things in this world (which he may enjoy); if he should desire them, let him, while it is time abandon (the world)","t1":"Ventin Un Taakath Thurakka","t2":"Thurandhapin Eentuiyar Paala Pala"},{"n":343,"c":35,"ct":"துறவு","ce":"On Renunciation","l1":"அடல்வேண்டும் ஐந்தன் புலத்தை விடல்வேண்டும்","l2":"வேண்டிய வெல்லாம் ஒருங்கு.","mv":"ஐம்பொறிகளுக்கும் உரிய ஐந்து புலன்களின் ஆசையையும் வெல்லுதல் வேண்டும், அவற்றிற்கு வேண்டிய பொருள்களை எல்லாம் ஒரு சேர விட வேண்டும்.","ex":"Let the five senses be destroyed; and at the same time, let everything be abandoned that (the ascetic) has (formerly) desired","t1":"Atalventum Aindhan Pulaththai Vitalventum","t2":"Ventiya Vellaam Orungu"},{"n":344,"c":35,"ct":"துறவு","ce":"On Renunciation","l1":"இயல்பாகும் நோன்பிற்கொன்று இன்மை உடைமை","l2":"மயலாகும் மற்றும் பெயர்த்து.","mv":"தவம் செய்தவற்கு ஒரு பற்றும் இல்லாதிருத்தல் இயல்பாகும், பற்று உடையவராக இருத்தல் மீண்டும் மயங்குவதற்கு வழியாகும்.","ex":"To be altogether destitute is the proper condition of those who perform austerities; if they possess anything, it will change (their resolution) and bring them back to their confused state","t1":"Iyalpaakum Nonpirkondru Inmai Utaimai","t2":"Mayalaakum Matrum Peyarththu"},{"n":345,"c":35,"ct":"துறவு","ce":"On Renunciation","l1":"மற்றும் தொடர்ப்பாடு எவன்கொல் பிறப்பறுக்கல்","l2":"உற்றார்க்கு உடம்பும் மிகை.","mv":"பிறவித் துன்பத்தைப் போக்க முயல்கின்றவர்க்கு உடம்பும் மிகையான பொருள் ஆகையால் அதற்கு மேல் வேறு தொடர்பு கொள்வது ஏனோ.","ex":"What means the addition of other things those who are attempting to cut off (future) births, when even their body is too much (for them)","t1":"Matrum Thotarppaatu Evankol Pirapparukkal","t2":"Utraarkku Utampum Mikai"},{"n":346,"c":35,"ct":"துறவு","ce":"On Renunciation","l1":"யான் எனது என்னும் செருக்கு அறுப்பான் வானோர்க்கு","l2":"உயர்ந்த உலகம் புகும்.","mv":"உடம்பை யான் எனக் கருதலும் தொடர்பு இல்லாத பொருளை எனது எனக்கருதலுமாகிய மயக்கத்தை போக்குகின்றவன், தேவர்க்கும் எட்டாத உயர்ந்த நிலை அடைவான்.","ex":"Shall enter realms above the powers divine","t1":"Yaan Enadhu Ennum Serukku","t2":"Aruppaan Vaanorkku Uyarndha Ulakam"},{"n":347,"c":35,"ct":"துறவு","ce":"On Renunciation","l1":"பற்றி விடாஅ இடும்பைகள் பற்றினைப்","l2":"பற்றி விடாஅ தவர் க்கு.","mv":"யான் எனது என்னும் இருவகைப் பற்றுக்களையும் பற்றிக் கொண்டுவிடாத வரை, துன்பங்களும் விடாமல் பற்றிக்கொள்கின்றன.","ex":"Sorrows will never let go their hold of those who give not up their hold of desire","t1":"Patri Vitaaa Itumpaikal Patrinaip","t2":"Patri Vitaaa Thavarkku"},{"n":348,"c":35,"ct":"துறவு","ce":"On Renunciation","l1":"தலைப்பட்டார் தீரத் துறந்தார் மயங்கி","l2":"வலைப்பட்டார் மற்றை யவர்.","mv":"முற்றத் துறந்தவறே உயர்ந்த நிலையினர் ஆவர், அவ்வாறு துறக்காத மற்றவர் அறியாமையாகிய வலையில் அகப்பட்டவர் ஆவர்.","ex":"Those who have entirely renounced (all things and all desire) have obtained (absorption into God); all others wander in confusion, entangled in the net of (many) births","t1":"Thalaippattaar Theerath Thurandhaar Mayangi","t2":"Valaippattaar Matrai Yavar"},{"n":349,"c":35,"ct":"துறவு","ce":"On Renunciation","l1":"பற்றற்ற கண்ணே பிறப்பறுக்கும் மற்று","l2":"நிலையாமை காணப் படும்.","mv":"இருவகைப் பற்றும் அற்றபொழுதே அந்நிலை பிறவித் துன்பத்தை ஒழிக்கும், இல்லையானால் (பிறவித்துன்பம் மாறி மாறி வந்து) நிலையாமைக் காணப்படும்.","ex":"At the moment in which desire has been abandoned, (other) births will be cut off; when that has not been done, instability will be seen","t1":"Patratra Kanne Pirapparukkum Matru","t2":"Nilaiyaamai Kaanap Patum"},{"n":350,"c":35,"ct":"துறவு","ce":"On Renunciation","l1":"பற்றுக பற்றற்றான் பற்றினை அப்பற்றைப்","l2":"பற்றுக பற்று விடற்கு.","mv":"பற்றில்லாதவனாகிய கடவுளுடைய பற்றை மட்டும் பற்றிக் கொள்ள வேண்டும், உள்ள பற்றுக்களை விட்டொழிப்பதற்கே அப் பற்றைப் பற்ற வேண்டும்.","ex":"Desire the desire of Him who is without desire; in order to renounce desire, desire that desire","t1":"Patruka Patratraan Patrinai Appatraip","t2":"Patruka Patru Vitarku"},{"n":351,"c":36,"ct":"மெய்யுணர்தல்","ce":"On Knowledge","l1":"பொருளல்ல வற்றைப் பொருளென்று உணரும்","l2":"மருளானாம் மாணாப் பிறப்பு.","mv":"மெய்ப்பொருள் அல்லாதவைகளை மெய்ப்பொருள் என்று தவறாக உணர்கின்ற மயக்க உணர்வால் சிறப்பில்லாத துன்பப் பிறவி உண்டாகும்.","ex":"Inglorious births are produced by the confusion (of mind) which considers those things to be real which are not real","t1":"Porulalla Vatraip Porulendru Unarum","t2":"Marulaanaam Maanaap Pirappu"},{"n":352,"c":36,"ct":"மெய்யுணர்தல்","ce":"On Knowledge","l1":"இருள்நீங்கி இன்பம் பயக்கும் மருள்நீங்கி","l2":"மாசறு காட்சி யவர்க்கு.","mv":"மயக்கம் நீங்கிக் குற்றம் அற்ற மெய்யுணர்வை உடையவர்க்கு, அம் மெய்யுணர்வு அறியாமையை நீக்கி இன்ப நிலையைக்கொடுக்கும்.","ex":"A clear, undimmed vision of things will deliver its possessors from the darkness of future births, and confer the felicity (of heaven)","t1":"Irulneengi Inpam Payakkum Marulneengi","t2":"Maasaru Kaatchi Yavarkku"},{"n":353,"c":36,"ct":"மெய்யுணர்தல்","ce":"On Knowledge","l1":"ஐயத்தின் நீங்கித் தெளிந்தார்க்கு வையத்தின்","l2":"வானம் நணிய துடைத்து.","mv":"ஐயத்திலிருந்து நீங்கி மெய்யுணர்வு பெற்றவர்க்கு அடைந்துள்ள இவ்வுலகை விட அடைய வேண்டிய மேலுலகம் அண்மையில் உள்ளதாகும்.","ex":"Heaven is nearer than earth to those men of purified minds who are freed from from doubt","t1":"Aiyaththin Neengith Thelindhaarkku Vaiyaththin","t2":"Vaanam Naniya Thutaiththu"},{"n":354,"c":36,"ct":"மெய்யுணர்தல்","ce":"On Knowledge","l1":"ஐயுணர்வு எய்தியக் கண்ணும் பயமின்றே","l2":"மெய்யுணர்வு இல்லா தவர்க்கு.","mv":"மெய்யுணர்வு இல்லாதவர்க்கு ஐந்து புலன்களின் வேறுபாட்டால் வளர்ந்த ஐந்து வகை உணர்வும் முற்றப்பெற்ற போதிலும் பயன் இல்லை.","ex":"Even those who have all the knowledge which can be attained by the five senses, will derive no benefit from it, if they are without a knowledge of the true nature of things","t1":"Aiyunarvu Eydhiyak Kannum Payamindre","t2":"Meyyunarvu Illaa Thavarkku"},{"n":355,"c":36,"ct":"மெய்யுணர்தல்","ce":"On Knowledge","l1":"எப்பொருள் எத்தன்மைத் தாயினும் அப்பொருள்","l2":"மெய்ப்பொருள் காண்பது அறிவு.","mv":"எப்பொருள் எத்தன்மையதாய்த் தோன்றினாலும் (அத்தோற்றத்தை மட்டும் கண்டுமங்காமல்) அப் பொருளின் உண்மையான இயல்பை அறிவதே மெய்யுணர்வு.","ex":"(True) knowledge is the perception concerning every thing of whatever kind, that that thing is the true thing","t1":"Epporul Eththanmaith Thaayinum Apporul","t2":"Meypporul Kaanpadhu Arivu"},{"n":356,"c":36,"ct":"மெய்யுணர்தல்","ce":"On Knowledge","l1":"கற்றீண்டு மெய்ப்பொருள் கண்டார் தலைப்படுவர்","l2":"மற்றீண்டு வாரா நெறி.","mv":"கற்க வேண்டிய வற்றைக் கற்று இங்கு மெய்ப் பொருளை உணர்ந்தவர் , மீண்டும் இப்பிறப்பிற்கு வராத வழியை அடைவர்.","ex":"They, who in this birth have learned to know the True Being, enter the road which returns not into this world","t1":"Katreentu Meypporul Kantaar Thalaippatuvar","t2":"Matreentu Vaaraa Neri"},{"n":357,"c":36,"ct":"மெய்யுணர்தல்","ce":"On Knowledge","l1":"ஓர்த்துள்ளம் உள்ளது உணரின் ஒருதலையாப்","l2":"பேர்த்துள்ள வேண்டா பிறப்பு.","mv":"ஒருவனுடைய உள்ளம் உண்மைப் பொருளை ஆராய்ந்து உறுதியாக உணர்ந்தால், அவனுக்கு மீண்டும் பிறப்பு உள்ள தென எண்ண வேண்டா.","ex":"Let it not be thought that there is another birth for him whose mind having thoroughly considered (all it has been taught) has known the True Being","t1":"Orththullam Ulladhu Unarin Orudhalaiyaap","t2":"Perththulla Ventaa Pirappu"},{"n":358,"c":36,"ct":"மெய்யுணர்தல்","ce":"On Knowledge","l1":"பிறப்பென்னும் பேதைமை நீங்கச் சிறப்பென்னும்","l2":"செம்பொருள் காண்பது அறிவு.","mv":"பிறவித்துன்பத்திற்கு காரணமான அறியாமை நீங்குமாறு முக்தி எனும் சிறந்த நிலைக்குக் காரணமான செம் பொருளைக் காண்பதே மெய்யுணர்வு.","ex":"True knowledge consists in the removal of ignorance; which is (the cause of) births, and the perception of the True Being who is (the bestower of) heaven","t1":"Pirappennum Pedhaimai Neengach Chirappennum","t2":"Semporul Kaanpadhu Arivu"},{"n":359,"c":36,"ct":"மெய்யுணர்தல்","ce":"On Knowledge","l1":"சார்புணர்ந்து சார்பு கெடஒழுகின் மற்றழித்துச்","l2":"சார்தரா சார்தரு நோய்.","mv":"எல்லாப் பொருளுக்கும் சார்பான செம்பொருளை உணர்ந்து பற்றுக் கெடுமாறு ஒழுகினால், சார்வதற்க்கு உரிய துன்பங்கள் திரும்ப வந்து அடையா.","ex":"He who so lives as to know Him who is the support of all things and abandon all desire, will be freed from the evils which would otherwise cleave to him and destroy (his efforts after absorption)","t1":"Saarpunarndhu Saarpu Ketaozhukin Matrazhiththuch","t2":"Chaardharaa Saardharu Noi"},{"n":360,"c":36,"ct":"மெய்யுணர்தல்","ce":"On Knowledge","l1":"காமம் வெகுளி மயக்கம் இவ்முன்றன்","l2":"நாமம் கெடக்கெடும் நோய்.","mv":"விருப்பு, வெறுப்பு, அறியாமை ஆகிய இக் குற்றங்கள் மூன்றனுடைய பெயரும் கெடுமாறு ஒழுகினால் துன்பங்கள் வராமற் கெடும்.","ex":"If the very names of these three things, desire, anger, and confusion of mind, be destroyed, then will also perish evils (which flow from them)","t1":"Kaamam Vekuli Mayakkam Ivaimundran","t2":"Naamam Ketakketum Noi"},{"n":361,"c":37,"ct":"அவாவறுத்தல்","ce":"On the Destruction of Desire","l1":"அவாஎன்ப எல்லா உயிர்க்கும் எஞ் ஞான்றும்","l2":"தவாஅப் பிறப்பீனும் வித்து.","mv":"எல்லா உயிர்களுக்கும் எக்காலத்திலும் ஒழியாமல் வருகின்ற பிறவித்துன்பத்தை உண்டாக்கும் வித்து அவா என்றுக் கூறுவர்.","ex":"(The wise) say that the seed, which produces unceasing births, at all times, to all creatures, is desire","t1":"Avaaenpa Ellaa Uyirkkum Enj","t2":"Gnaandrum Thavaaap Pirappeenum Viththu"},{"n":362,"c":37,"ct":"அவாவறுத்தல்","ce":"On the Destruction of Desire","l1":"வேண்டுங்கால் வேண்டும் பிறவாமை மற்றது","l2":"வேண்டாமை வேண்ட வரும்.","mv":"ஒருவன் ஒன்றை விரும்புவதனால் பிறவா நிலைமையை விரும்ப வேண்டும், அது அவா அற்ற நிலையை விரும்பினால் உண்டாகும்.","ex":"If anything be desired, freedom from births should be desired; that (freedom from births) will be attained by desiring to be without desire","t1":"Ventungaal Ventum Piravaamai Matradhu","t2":"Ventaamai Venta Varum"},{"n":363,"c":37,"ct":"அவாவறுத்தல்","ce":"On the Destruction of Desire","l1":"வேண்டாமை அன்ன விழுச்செல்வம் ஈண்டில்லை","l2":"ஆண்டும் அஃதொப்பது இல்.","mv":"அவா அற்ற நிலைமை போன்ற சிறந்த செல்வம் இவ்வுலகில் இல்லை, வேறு எங்கும் அதற்க்கு நிகரான ஒன்று இல்லை.","ex":"There is in this world no excellence equal to freedom from desire; and even in that world, there is nothing like it","t1":"Ventaamai Anna Vizhuchchelvam Eentillai","t2":"Aantum Aqdhoppadhu Il"},{"n":364,"c":37,"ct":"அவாவறுத்தல்","ce":"On the Destruction of Desire","l1":"தூஉய்மை என்பது அவாவின்மை மற்றது","l2":"வாஅய்மை வேண்ட வரும்.","mv":"தூயநிலை என்றுக் கூறப்படுவது அவா இல்லா திருத்தலே யாகும், அவா அற்ற அத்தன்மை மெய்ப்பொருளை விரும்புவதால் உண்டாகும்.","ex":"Purity (of mind) consists in freedom from desire; and that (freedom from desire) is the fruit of the love of truth","t1":"Thoouymai Enpadhu Avaavinmai Matradhu","t2":"Vaaaimai Venta Varum"},{"n":365,"c":37,"ct":"அவாவறுத்தல்","ce":"On the Destruction of Desire","l1":"அற்றவர் என்பார் அவாஅற்றார் மற்றையார்","l2":"அற்றாக அற்றது இலர்.","mv":"பற்றற்றவர் என்றுக் கூறப்படுவோர் அவா அற்றவரே, அவா அறாத மற்றவர் அவ்வளவாகப் பற்று அற்றவர் அல்லர்.","ex":"They are said to be free (from future birth) who are freed from desire; all others (who, whatever else they may be free from, are not freed from desire) are not thus free","t1":"Atravar Enpaar Avaaatraar Matraiyaar","t2":"Atraaka Atradhu Ilar"},{"n":366,"c":37,"ct":"அவாவறுத்தல்","ce":"On the Destruction of Desire","l1":"அஞ்சுவ தோரும் அறனே ஒருவனை","l2":"வஞ்சிப்ப தோரும் அவா.","mv":"ஒருவன் அவாவிற்கு அஞ்சி வாழ்வதே அறம், ஏன் எனில் ஒருவனைச் சோர்வு கண்டுகொடுத்து வஞ்சிப்பது அவாவே.","ex":"It is the chief duty of (an ascetic) to watch against desire with (jealous) fear; for it has power to deceive (and destroy) him","t1":"Anjuva Thorum Arane Oruvanai","t2":"Vanjippa Thorum Avaa"},{"n":367,"c":37,"ct":"அவாவறுத்தல்","ce":"On the Destruction of Desire","l1":"அவாவினை ஆற்ற அறுப்பின் தவாவினை","l2":"தான்வேண்டு மாற்றான் வரும்.","mv":"ஒருவன் ஆசையை முழுதும் ஒழித்தால், அவன் கெடாமல் வாழ்வதற்கு உரிய நல்ல செயல் அவன் விரும்புமாறு வாய்க்கும்.","ex":"If a man thoroughly cut off all desire, the deeds, which confer immortality, will come to him, in the path in which he seeks them","t1":"Avaavinai Aatra Aruppin Thavaavinai","t2":"Thaanventu Maatraan Varum"},{"n":368,"c":37,"ct":"அவாவறுத்தல்","ce":"On the Destruction of Desire","l1":"அவாஇல்லார்க் கில்லாகுந் துன்பம் அஃதுண்டேல்","l2":"தவாஅது மேன்மேல் வரும்.","mv":"அவா இல்லாதவர்க்குத் துன்பம் இல்லையாகும், அவா இருந்தால் எல்லாத் துன்பங்களும் மேலும் மேலும் ஒழியாமல் வரும்.","ex":"There is no sorrow to those who are without desire; but where that is, (sorrow) will incessantly come, more and more","t1":"Avaaillaark Killaakun Thunpam Aqdhuntel","t2":"Thavaaadhu Menmel Varum"},{"n":369,"c":37,"ct":"அவாவறுத்தல்","ce":"On the Destruction of Desire","l1":"இன்பம் இடையறா தீண்டும் அவாவென்னும்","l2":"துன்பத்துள் துன்பங் கெடின்.","mv":"அவா என்று சொல்லப்படுகின்ற துன்பங்களுள் பொல்லாதத் துன்பம் கெடுமானால் இவ் வுலகில் இன்பம் இடையறாமல் வாய்க்கும்.","ex":"Even while in this body, joy will never depart (from the mind, in which) desire, that sorrow of sorrows, has been destroyed","t1":"Inpam Itaiyaraa Theentum Avaavennum","t2":"Thunpaththul Thunpang Ketin"},{"n":370,"c":37,"ct":"அவாவறுத்தல்","ce":"On the Destruction of Desire","l1":"ஆரா இயற்கை அவாநீப்பின் அந்நிலையே","l2":"பேரா இயற்கை தரும்.","mv":"ஒருபோதும் நிரம்பாத தன்மை உடைய அவாவை ஒழித்தால் ஒழித்த அந்நிலையே எப்போதும் மாறாதிருக்கும் இன்ப வாழ்வைத் தரும்.","ex":"The removal of desire, whose nature it is never to be satisfied, will immediately confer a nature that can never be changed","t1":"Aaraa Iyarkai Avaaneeppin Annilaiye","t2":"Peraa Iyarkai Tharum"},{"n":371,"c":38,"ct":"ஊழ்","ce":"On Fate","l1":"ஆகூழால் தோன்றும் அசைவின்மை கைப்பொருள்","l2":"போகூழால் தோன்றும் மடி.","mv":"கைப்பொருள் ஆவதற்க்கு காரணமான ஊழால் சோர்வில்லாத முயற்சி உண்டாகும், கைப்பொருள் போவதற்க்கு காரணமான ஊழால் சோம்பல் ஏற்படும்.","ex":"Perseverance comes from a prosperous fate, and idleness from an adverse fate","t1":"Aakoozhaal Thondrum Asaivinmai Kaipporul","t2":"Pokoozhaal Thondrum Mati"},{"n":372,"c":38,"ct":"ஊழ்","ce":"On Fate","l1":"பேதைப் படுக்கும் இழவூழ் அறிவகற்றும்","l2":"ஆகலூழ் உற்றக் கடை.","mv":"பொருள் இழந்தற்கு காரணமான ஊழ், பேதை யாக்கும் பொருள் ஆவதற்க்கு காரணமான ஊழ் அறிவைப் பெருக்கும்.","ex":"An adverse fate produces folly, and a prosperous fate produces enlarged knowledge","t1":"Pedhaip Patukkum Izhavoozh Arivakatrum","t2":"Aakaloozh Utrak Katai"},{"n":373,"c":38,"ct":"ஊழ்","ce":"On Fate","l1":"நுண்ணிய நூல்பல கற்பினும் மற்றுந்தன்","l2":"உண்மை யறிவே மிகும்.","mv":"ஒருவன் நுட்பமான நூல் பலவற்றைக் கற்றாலும் ஊழுக்கு ஏற்றவாறு அவனுக்கு உள்ள தாகும் அறிவே மேம்பட்டுத் தோன்றும்.","ex":"Although (a man) may study the most polished treatises, the knowledge which fate has decreed to him will still prevail","t1":"Nunniya Noolpala Karpinum Matrundhan","t2":"Unmai Yarive Mikum"},{"n":374,"c":38,"ct":"ஊழ்","ce":"On Fate","l1":"இருவேறு உலகத்து இயற்கை திருவேறு","l2":"தெள்ளிய ராதலும் வேறு.","mv":"உலகத்தின் இயற்க்கை ஊழின் காரணமாக இரு வேறு வகைப்படும், செல்வம் உடையவராதலும் வேறு அறிவு உடையவராதலும் வேறு.","ex":"There are (through fate) two different natures in the world, hence the difference (observable in men) in (their acquisition of) wealth, and in their attainment of knowledge","t1":"Iruveru Ulakaththu Iyarkai Thiruveru","t2":"Thelliya Raadhalum Veru"},{"n":375,"c":38,"ct":"ஊழ்","ce":"On Fate","l1":"நல்லவை எல்லாஅந் தீயவாம் தீயவும்","l2":"நல்லவாம் செல்வம் செயற்கு.","mv":"செல்வத்தை ஈட்டும் முயற்சிக்கு ஊழ்வகையால் நல்லவை எல்லாம் தீயவை ஆதலும் உண்டு, தீயவை நல்லவை ஆதலும் உண்டு.","ex":"In the acquisition of property, every thing favourable becomes unfavourable, and (on the other hand) everything unfavourable becomes favourable, (through the power of fate)","t1":"Nallavai Ellaaan Theeyavaam Theeyavum","t2":"Nallavaam Selvam Seyarku"},{"n":376,"c":38,"ct":"ஊழ்","ce":"On Fate","l1":"பரியினும் ஆகாவாம் பாலல்ல உய்த்துச்","l2":"சொரியினும் போகா தம.","mv":"ஊழால் தமக்கு உரியவை அல்லாதப் பொருள்கள் வருந்திக்காப்பாற்றினாலும் நில்லாமல் போகும் தமக்கு உரியவை கொண்டு போய்ச் சொரிந்தாலும் போகா.","ex":"Whatever is not conferred by fate cannot be preserved although it be guarded with most painful care; and that, which fate has made his, cannot be lost, although one should even take it and throw it away","t1":"Pariyinum Aakaavaam Paalalla Uyththuch","t2":"Choriyinum Pokaa Thama"},{"n":377,"c":38,"ct":"ஊழ்","ce":"On Fate","l1":"வகுத்தான் வகுத்த வகையல்லால் கோடி","l2":"தொகுத்தார்க்கு துய்த்தல் அரிது.","mv":"ஊழ் ஏற்ப்படுத்திய வகையால் அல்லாமல் முயன்று கோடிக்கணக்கானப் பொருளைச் சேர்த்தவருக்கும் அவற்றை நுகர முடியாது.","ex":"Even those who gather together millions will only enjoy them, as it has been determined by the disposer (of all things)","t1":"Vakuththaan Vakuththa Vakaiyallaal Koti","t2":"Thokuththaarkku Thuyththal Aridhu"},{"n":378,"c":38,"ct":"ஊழ்","ce":"On Fate","l1":"துறப்பார்மன் துப்புர வில்லார் உறற்பால","l2":"ஊட்டா கழியு மெனின்.","mv":"வரவேண்டிய துன்பங்கள் வந்து வருத்தாமல் நீங்குமானால் நுகரும் பொருள் இல்லாத வறியவர் துறவறம் மேற்க்கொள்வர்.","ex":"The destitute will renounce desire (and become ascetics), if (fate) do not make them suffer the hindrances to which they are liable, and they pass away","t1":"Thurappaarman Thuppura Villaar Urarpaala","t2":"Oottaa Kazhiyu Menin"},{"n":379,"c":38,"ct":"ஊழ்","ce":"On Fate","l1":"நன்றாங்கால் நல்லவாக் காண்பவர் அன்றாங்கால்","l2":"அல்லற் படுவ தெவன்?","mv":"நல்வினை விளையும் போது நல்லவை எனக் கருதி மகிழ்கின்றனர், தீவினை விளையும் போது துன்பப்பட்டுக் கலங்குவது ஏனோ.","ex":"How is it that those, who are pleased with good fortune, trouble themselves when evil comes, (since both are equally the decree of fate) ?","t1":"Nandraangaal Nallavaak Kaanpavar Andraangaal","t2":"Allar Patuva Thevan?"},{"n":380,"c":38,"ct":"ஊழ்","ce":"On Fate","l1":"ஊழிற் பெருவலி யாவுள மற்றொன்று","l2":"சூழினுந் தான்முந் துறும்.","mv":"ஊழை விட மிக்க வலிமையுள்ளவை வேறு எவை உள்ளன, ஊழை விலக்கும் பொருட்டு மற்றோரு வழியைஆராய்ந்தாலும் அங்கும் தானே முன் வந்து நிற்கும்.","ex":"What is stronger than fate ? If we think of an expedient (to avert it), it will itself be with us before (the thought)","t1":"Oozhir Peruvali Yaavula Matrondru","t2":"Soozhinun Thaanmun Thurum"},{"n":381,"c":39,"ct":"இறைமாட்சி","ce":"On Majesty","l1":"படைகுடி கூழ்அமைச்சு நட்பரண் ஆறும்","l2":"உடையான் அரசருள் ஏறு.","mv":"படை குடி கூழ் அமைச்சு நட்பு அரண் என்று கூறப்படும் ஆறு அங்கங்களையும் உடையவனே அரசருள் ஆண் சிங்கம் போனறவன்.","ex":"He who possesses these six things, an army, a people, wealth, ministers, friends and a fortress, is a lion among kings","t1":"Pataikuti Koozhamaichchu Natparan Aarum","t2":"Utaiyaan Arasarul Eru"},{"n":382,"c":39,"ct":"இறைமாட்சி","ce":"On Majesty","l1":"அஞ்சாமை ஈகை அறிவூக்கம் இந்நான்கும்","l2":"எஞ்சாமை வேந்தர்க் கியல்பு.","mv":"அஞ்சாமை, ஈகை , அறிவுடைமை, ஊக்கமுடைமை இந்த நான்கு பண்புகளும் குறைவு படாமல் இருத்தலே அரசனுக்கு இயல்பாகும்.","ex":"Never to fail in these four things, fearlessness, liberality, wisdom, and energy, is the kingly character","t1":"Anjaamai Eekai Arivookkam Innaankum","t2":"Enjaamai Vendhark Kiyalpu"},{"n":383,"c":39,"ct":"இறைமாட்சி","ce":"On Majesty","l1":"தூங்காமை கல்வி துணிவுடைமை இம்மூன்றும்","l2":"நீங்கா நிலனான் பவர்க்கு.","mv":"காலம் தாழ்த்தாத தன்மை, கல்வியுடைமை, துணிவுடைமை இந்த மூன்று பண்புகளும் நிலத்தை ஆளும் அரசனுக்கு நீங்காமல் இருக்க வேண்டியவை.","ex":"These three things, viz, vigilance, learning, and bravery, should never be wanting in the ruler of a country","t1":"Thoongaamai Kalvi Thunivutaimai Immoondrum","t2":"Neengaa Nilanaan Pavarkku"},{"n":384,"c":39,"ct":"இறைமாட்சி","ce":"On Majesty","l1":"அறனிழுக்கா தல்லவை நீக்கி மறனிழுக்கா","l2":"மானம் உடைய தரசு.","mv":"ஆட்சி முறைக்கு உரிய அறத்தில் தவறாமல் அறமல்லாதவற்றை நீக்கி வீரத்தில் குறைபடாத மானத்தை உடையவனே சிறந்த அரசன் ஆவான்.","ex":"He is a king who, with manly modesty, swerves not from virtue, and refrains from vice","t1":"Aranizhukkaa Thallavai Neekki Maranizhukkaa","t2":"Maanam Utaiya Tharasu"},{"n":385,"c":39,"ct":"இறைமாட்சி","ce":"On Majesty","l1":"இயற்றலும் ஈட்டலுங் காத்தலும் காத்த","l2":"வகுத்தலும் வல்ல தரசு.","mv":"பொருள் வரும் வழிகளை மேன்மேலும் இயற்றலும் வந்த பொருள்களைச் சேர்த்தலும், காத்தலும் காத்தவற்றை வகுத்துச் செலவு செய்தலும் வல்லவன் அரசன்.","ex":"He is a king who is able to acquire (wealth), to lay it up, to guard, and to distribute it","t1":"Iyatralum Eettalung Kaaththalum Kaaththa","t2":"Vakuththalum Valla Tharasu"},{"n":386,"c":39,"ct":"இறைமாட்சி","ce":"On Majesty","l1":"காட்சிக் கெளியன் கடுஞ்சொல்லன் அல்லனேல்","l2":"மீக்கூறும் மன்னன் நிலம்","mv":"காண்பதற்கு எளியவனாய்க் கடுஞ்சொல் கூறாதவாய் இருந்தால் அந்த மன்னனுடைய ஆட்சிக்கு உட்பட்ட நாட்டை உலகம் புகழும்.","ex":"The whole world will exalt the country of the king who is easy of access, and who is free from harsh language","t1":"Kaatchik Keliyan Katunjollan Allanel","t2":"Meekkoorum Mannan Nilam"},{"n":387,"c":39,"ct":"இறைமாட்சி","ce":"On Majesty","l1":"இன்சொலால் ஈத்தளிக்க வல்லார்க்குத் தன்சொலால்","l2":"தான்கண் டனைத்திவ் வுலகு.","mv":"இனியச் சொற்களுடன் தக்கவர்க்குப் பொருளை உதவிக் காக்க வல்ல அரசனுக்கு இவ்வுலகம் தன் புகழோடு தான் கருதியபடி அமைவதாகும்.","ex":"The world will praise and submit itself to the mind of the king who is able to give with affability, and to protect all who come to him","t1":"Insolaal Eeththalikka Vallaarkkuth Thansolaal","t2":"Thaankan Tanaiththiv Vulaku"},{"n":388,"c":39,"ct":"இறைமாட்சி","ce":"On Majesty","l1":"முறைசெய்து காப்பாற்றும் மன்னவன் மக்கட்கு","l2":"இறையென்று வைக்கப் படும்.","mv":"நீதி முறை செய்து குடிமக்களைக் காப்பாற்றும் மன்னவன், மக்களுக்கு தலைவன் என்றுக் கருதித் தனியே மதிக்கப்படுவான்.","ex":"That king, will be esteemed a God among men, who performs his own duties, and protects (his subjects).","t1":"Muraiseydhu Kaappaatrum Mannavan Makkatku","t2":"Iraiyendru Vaikkap Patum"},{"n":389,"c":39,"ct":"இறைமாட்சி","ce":"On Majesty","l1":"செவிகைப்பச் சொற்பொறுக்கும் பண்புடை வேந்தன்","l2":"கவிகைக்கீழ்த் தங்கும் உலகு.","mv":"குறைகூறுவோறின் சொற்களைக் செவிகைக்கும் நிலையிலும் பொறுக்கின்ற பண்பும் உடைய அரசனது குடைநிழலில் உலகம் தங்கும்.","ex":"The whole world will dwell under the umbrella of the king, who can bear words that embitter the ear","t1":"Sevikaippach Chorporukkum Panputai Vendhan","t2":"Kavikaikkeezhth Thangum Ulaku"},{"n":390,"c":39,"ct":"இறைமாட்சி","ce":"On Majesty","l1":"கொடையளி செங்கோல் குடியோம்பல் நான்கும்","l2":"உடையானாம் வேந்தர்க் கொளி.","mv":"கொடை, அருள், செங்கோல்முறை, தளர்ந்த குடிமக்களைக்காத்தல் ஆகிய நான்கும் உடைய அரசன், அரசர்க்கெல்லாம் விளக்குப் போன்றவன்.","ex":"He is the light of kings who has there four things, beneficence, benevolence, rectitude, and care for his people","t1":"Kotaiyali Sengol Kutiyompal Naankum","t2":"Utaiyaanaam Vendhark Koli"},{"n":391,"c":40,"ct":"கல்வி","ce":"On Learning","l1":"கற்க கசடறக் கற்பவை கற்றபின்","l2":"நிற்க அதற்குத் தக.","mv":"கல்வி கற்க நல்ல நூல்களைக் குற்றமறக் கற்க வேண்டும், அவ்வாறு கற்ற பிறகு, கற்ற கல்விக்கு தக்கவாறு நெறியில் நிற்க வேண்டும்.","ex":"Let a man learn thoroughly whatever he may learn, and let his conduct be worthy of his learning","t1":"Karka Kasatarak Karpavai Katrapin","t2":"Nirka Adharkuth Thaka"},{"n":392,"c":40,"ct":"கல்வி","ce":"On Learning","l1":"எண்ணென்ப ஏனை எழுத்தென்ப இவ்விரண் டும்","l2":"கண்ணென்ப வாழும் உயிர்க்கு.","mv":"எண் என்று சொல்லப்படுவன எழுத்து என்று சொல்லப்படுவன ஆகிய இரு வகைக் கலைகளையும் வாழும் மக்களுக்குக் கண்கள் என்று கூறுவர்.","ex":"Letters and numbers are the two eyes of man","t1":"Ennenpa Enai Ezhuththenpa Ivvirantum","t2":"Kannenpa Vaazhum Uyirkku"},{"n":393,"c":40,"ct":"கல்வி","ce":"On Learning","l1":"கண்ணுடையர் என்பவர் கற்றோர் முகத்திரண்டு","l2":"புண்ணுடையர் கல்லா தவர்.","mv":"கண்ணுடையவர் என்றுக் கூறப்படுபவர் கற்றவரே, கல்லாதவர் முகத்தில் இரண்டுப் புண் உடையவர் ஆவார்.","ex":"The learned are said to have eyes, but the unlearned have (merely) two sores in their face","t1":"Kannutaiyar Enpavar Katror Mukaththirantu","t2":"Punnutaiyar Kallaa Thavar"},{"n":394,"c":40,"ct":"கல்வி","ce":"On Learning","l1":"உவப்பத் தலைக்கூடி உள்ளப் பிரிதல்","l2":"அனைத்தே புலவர் தொழில்.","mv":"மகிழும் படியாகக் கூடிபழகி (இனி இவரை எப்போது காண்போம் என்று ) வருந்தி நினைக்கும் படியாகப் பிரிதல் புலவரின் தொழிலாகும்.","ex":"It is the part of the learned to give joy to those whom they meet, and on leaving, to make them think (Oh! when shall we meet them again.)","t1":"Uvappath Thalaikkooti Ullap Piridhal","t2":"Anaiththe Pulavar Thozhil"},{"n":395,"c":40,"ct":"கல்வி","ce":"On Learning","l1":"உடையார்முன் இல்லார்போல் ஏக்கற்றுங் கற்றார்","l2":"கடையரே கல்லா தவர்.","mv":"செல்வர் முன் வறியவர் நிற்பது போல் (கற்றவர்முன்) ஏங்கித் தாழ்ந்து நின்றும் கல்விக் கற்றவரே உயர்ந்தவர், கல்லாதவர் இழிந்தவர்.","ex":"The unlearned are inferior to the learned, before whom they stand begging, as the destitute before the wealthy","t1":"Utaiyaarmun Illaarpol Ekkatrung Katraar","t2":"Kataiyare Kallaa Thavar"},{"n":396,"c":40,"ct":"கல்வி","ce":"On Learning","l1":"தொட்டனைத் தூறும் மணற்கேணி மாந்தர்க்குக்","l2":"கற்றனைத் தூறும் அறிவு.","mv":"மணலில் உள்ள கேணியில் தோண்டிய அளவிற்க்கு நீர் ஊறும், அதுபோல் மக்களின் கற்றக் கல்வியின் அளவிற்கு அறிவு ஊறும்.","ex":"Water will flow from a well in the sand in proportion to the depth to which it is dug, and knowledge will flow from a man in proportion to his learning","t1":"Thottanaith Thoorum Manarkeni Maandharkkuk","t2":"Katranaith Thoorum Arivu"},{"n":397,"c":40,"ct":"கல்வி","ce":"On Learning","l1":"யாதானும் நாடாமால் ஊராமால் என்னொருவன்","l2":"சாந்துணையுங் கல்லாத வாறு.","mv":"கற்றவனுக்கு தன் நாடும் ஊரும் போல வேறு எதுவாயினும் நாடாகும், ஊராகும் ஆகையால் ஒருவன் சாகும் வரையில் கல்லாமல் காலங்கழிப்பது ஏன்.","ex":"How is it that any one can remain without learning, even to his death, when (to the learned man) every country is his own (country), and every town his own (town) ?","t1":"Yaadhaanum Naataamaal Ooraamaal Ennoruvan","t2":"Saandhunaiyung Kallaadha Vaaru"},{"n":398,"c":40,"ct":"கல்வி","ce":"On Learning","l1":"ஒருமைக்கண் தான் கற்ற கல்வி ஒருவற்கு","l2":"எழுமையும் ஏமாப் புடைத்து.","mv":"ஒரு பிறப்பில் தான் கற்றக் கல்வியானது அப்பிறப்பிற்கு மட்டும் அல்லாமல் அவனுக்கு ஏழுபிறப்பிறப்பிலும் உதவும் தன்மை உடையது.","ex":"The learning, which a man has acquired in one birth, will yield him pleasure during seven births","t1":"Orumaikkan Thaan Katra Kalvi","t2":"Oruvarku Ezhumaiyum Emaap Putaiththu"},{"n":399,"c":40,"ct":"கல்வி","ce":"On Learning","l1":"தாமின் புறுவது உலகின் புறக் கண்டு","l2":"காமுறுவர் கற்றறிந் தார்.","mv":"தாம் இன்புறுவதற்குக் காரணமான கல்வியால் உலகமும் இன்புறுவதைக் கண்டு, கற்றறிந்த அறிஞர் மேன்மேலும் (அக் கல்வியையே) விரும்புவர்.","ex":"The learned will long (for more learning), when they see that while it gives pleasure to themselves, the world also derives pleasure from it","t1":"Thaamin Puruvadhu Ulakin Purak","t2":"Kantu Kaamuruvar Katrarin Thaar"},{"n":400,"c":40,"ct":"கல்வி","ce":"On Learning","l1":"கேடில் விழுச்செல்வம் கல்வி யொருவற்கு","l2":"மாடல்ல மற்றை யவை.","mv":"ஒருவனுக்கு அழிவு இல்லாத சிறந்த செல்வம் கல்வியே ஆகும், கல்வியைத் தவிர மற்றப் பொருள்கள் (அத்தகைய சிறப்புடைய) செல்வம் அல்ல.","ex":"Learning is the true imperishable riches; all other things are not riches","t1":"Ketil Vizhuchchelvam Kalvi Yoruvarku","t2":"Maatalla Matrai Yavai"},{"n":401,"c":41,"ct":"கல்லாமை","ce":"On Non-Learning","l1":"அரங்கின்றி வட்டாடி யற்றே நிரம்பிய","l2":"நூலின்றிக் கோட்டி கொளல்.","mv":"அறிவு நிரம்புவதற்குக் காரணமானக் நூல்களைக் கற்காமல் கற்றவரிடம் சென்று பேசதல், சூதாடும் அரங்கு இழைக்காமல் வட்டுக்காயை உருட்டிஆடினார் போன்றது.","ex":"To speak in an assembly (of the learned) without fullness of knowledge, is like playing at chess (on a board) without squares","t1":"Arangindri Vattaati Yatre Nirampiya","t2":"Noolindrik Kotti Kolal"},{"n":402,"c":41,"ct":"கல்லாமை","ce":"On Non-Learning","l1":"கல்லாதான் சொற்கா முறுதல் முலையிரண்டும்","l2":"இல்லாதாள் பெண்காமுற் றற்று.","mv":"(கற்றவரின் அவையில்) கல்லாதவன் ஒன்றைச் சொல்ல விரும்புதல், முலை இரண்டும் இல்லாதவள் பெண் தன்மையை விரும்பினாற் போன்றது.","ex":"The desire of the unlearned to speak (in an assembly), is like a woman without breasts desiring (the enjoyment of ) woman-hood","t1":"Kallaadhaan Sorkaa Murudhal Mulaiyirantum","t2":"Illaadhaal Penkaamur Ratru"},{"n":403,"c":41,"ct":"கல்லாமை","ce":"On Non-Learning","l1":"கல்லா தவரும் நனிநல்லர் கற்றார்முன்","l2":"சொல்லா திருக்கப் பெறின்.","mv":"கற்றவரின் முன்னிலையில் ஒன்றையும் சொல்லாமல் அமைதியாக இருக்கப் பெற்றால் கல்லாதவர்களும் மிகவும் நல்லவரே ஆவார்.","ex":"The unlearned also are very excellent men, if they know how to keep silence before the learned","t1":"Kallaa Thavarum Naninallar Katraarmun","t2":"Sollaa Thirukkap Perin"},{"n":404,"c":41,"ct":"கல்லாமை","ce":"On Non-Learning","l1":"கல்லாதான் ஒட்பம் கழியநன் றாயினும்","l2":"கொள்ளார் அறிவுடை யார்.","mv":"கல்லாதவனுடைய அறிவுடைய ஒருக்கால் மிக நன்றாக இருந்தாலும் அறிவுடையோர் அதனை அறிவின் பகுதியாக ஏற்றுக்கொள்ள மாட்டார்.","ex":"Although the natural knowledge of an unlearned man may be very good, the wise will not accept for true knowledge","t1":"Kallaadhaan Otpam Kazhiyanan Raayinum","t2":"Kollaar Arivutai Yaar"},{"n":405,"c":41,"ct":"கல்லாமை","ce":"On Non-Learning","l1":"கல்லா ஒருவன் தகைமை தலைப்பெய்து","l2":"சொல்லாடச் சோர்வு படும்.","mv":"கல்லாதவன் ஒருவன் தன்னைத்தான் மகிழ்ந்து பேசும் மதிப்பு ( கற்றவரிடம்) கூடிபேசும் போது அப்பேசினால் கெடும்.","ex":"The self-conceit of an unlearned man will fade away, as soon as he speaks in an assembly (of","t1":"Kallaa Oruvan Thakaimai Thalaippeydhu","t2":"Sollaatach Chorvu Patum"},{"n":406,"c":41,"ct":"கல்லாமை","ce":"On Non-Learning","l1":"உளரென்னும் மாத்திரையர் அல்லால் பயவாக்","l2":"களரனையர் கல்லா தவர்.","mv":"கல்லாதவர் உயிரோடிருக்கின்றனர் என்று சொல்லப்படும் அளவினரே அல்லாமல் ஒன்றும் விளையாத களர் நிலத்திற்கு ஒப்பாவர்.","ex":"The unlearned are like worthless barren land: all that can be said of them is, that they exist","t1":"Ularennum Maaththiraiyar Allaal Payavaak","t2":"Kalaranaiyar Kallaa Thavar"},{"n":407,"c":41,"ct":"கல்லாமை","ce":"On Non-Learning","l1":"நுண்மாண் நுழைபுலம் இல்லான் எழில்நலம்","l2":"மண்மாண் புனைபாவை யற்று.","mv":"நுட்பமானதாய் மாட்சியுடையதாய் ஆராய வல்லவான அறிவு இல்லாதவனுடைய எழுச்சியான அழகு மண்ணால் சிறப்பாகப் புனையப்பட்ட பாவை போன்றது.","ex":"The beauty and goodness of one who is destitute of knowledge by the study of great and exquisite works, is like (the beauty and goodness) of a painted earthen doll","t1":"Nunmaan Nuzhaipulam Illaan Ezhilnalam","t2":"Manmaan Punaipaavai Yatru"},{"n":408,"c":41,"ct":"கல்லாமை","ce":"On Non-Learning","l1":"நல்லார்கண் பட்ட வறுமையின் இன்னாதே","l2":"கல்லார்கண் பட் ட திரு.","mv":"கல்லாதவனிடம் சேர்ந்துள்ள செல்வமானது, கற்றறிந்த நல்லவரிடம் உள்ள வறுமையைவிட மிகத்துன்பம் செய்வதாகும்.","ex":"Wealth, gained by the unlearned, will give more sorrow than the poverty which may come upon the learned","t1":"Nallaarkan Patta Varumaiyin Innaadhe","t2":"Kallaarkan Patta Thiru"},{"n":409,"c":41,"ct":"கல்லாமை","ce":"On Non-Learning","l1":"மேற்பிறந்தா ராயினும் கல்லாதார் கீழ்ப்பிறந்தும்","l2":"கற்றார் அனைத்திலர் பாடு.","mv":"கல்லாதவர் உயர்ந்த குடியில் பிறந்தவராக இருப்பினும் தாழ்ந்த குடியில் பிறந்திருந்தும் கல்விக் கற்றவரைப் போன்ற பெருமை இல்லாதவரே.","ex":"The unlearned, though born in a high caste, are not equal in dignity to the learned; though they may have been born in a low caste","t1":"Merpirandhaa Raayinum Kallaadhaar Keezhppirandhum","t2":"Katraar Anaiththilar Paatu"},{"n":410,"c":41,"ct":"கல்லாமை","ce":"On Non-Learning","l1":"விலங்கொடு மக்கள் அனையர் இலங்குநூல்","l2":"கற்றாரோடு ஏனை யவர்.","mv":"அறிவு விளங்குதற்குக் காரணமான நூல்களைக் கற்றவரோடுக் கல்லாதவர், மக்களோடு விலங்குகளுக்கு உள்ள அவ்வளவு வேற்றுமை உடையவர்.","ex":"As beasts by the side of men, so are other men by the side of those who are learned in celebrated works","t1":"Vilangotu Makkal Anaiyar Ilangunool","t2":"Katraarotu Enai Yavar"},{"n":411,"c":42,"ct":"கேள்வி","ce":"On Hearing","l1":"செல்வத்துட் செல்வஞ் செவிச்செல்வம் அச்செல்வம்","l2":"செல்வத்து ளெல்லாந் தலை.","mv":"செவியால் கேட்டறியும் செல்வம், செல்வங்களுள் ஒன்றாகப் போற்றப்படும் செல்வமாகும், அச் செல்வம் செல்வங்கள் எல்லாவற்றிலும் தலையானதாகும்.","ex":"Wealth (gained) by the ear is wealth of wealth; that wealth is the chief of all wealth","t1":"Selvaththut Selvanj Chevichchelvam Achchelvam","t2":"Selvaththu Lellaan Thalai"},{"n":412,"c":42,"ct":"கேள்வி","ce":"On Hearing","l1":"செவுக்குண வில்லாத போழ்து சிறிது","l2":"வயிற்றுக்கும் ஈயப் படும்.","mv":"செவிக்கு கேள்வியாகிய உணவு இல்லாத போது (அதற்க்கு துணையாக உடலை ஒப்புமாறு) வயிற்றுக்கும் சிறிது உணவு தரப்படும்.","ex":"When there is no food for the ear, give a little also to the stomach","t1":"Sevikkuna Villaadha Pozhdhu Siridhu","t2":"Vayitrukkum Eeyap Patum"},{"n":413,"c":42,"ct":"கேள்வி","ce":"On Hearing","l1":"செவியுணவிற் கேள்வி யுடையார் அவியுணவின்","l2":"ஆன்றாரோ டொப்பர் நிலத்து.","mv":"செவியுணவாகிய கேள்வி உடையவர் நிலத்தில் வாழ்கின்றவரே ஆயினும் அவி உணவைக் கொள்ளும் தேவரோடு ஒப்பாவார்.","ex":"Those who in this world enjoy instruction which is the food of the ear, are equal to the Gods, who enjoy the food of the sacrifices","t1":"Seviyunavir Kelvi Yutaiyaar Aviyunavin","t2":"Aandraaro Toppar Nilaththu"},{"n":414,"c":42,"ct":"கேள்வி","ce":"On Hearing","l1":"கற்றில னாயினுங் கேட்க அஃதொருவற்கு","l2":"ஒற்கத்தின் ஊற்றாந் துணை.","mv":"நூல்களைக் கற்றவில்லையாயினும், கற்றறிந்தவர்களிடம் கேட்டறிய வேண்டும், அது ஒருவனுக்கு வாழ்க்கையில் தளர்ச்சி வந்த போது ஊன்றுகோல் போல் துணையாகும்.","ex":"Although a man be without learning, let him listen (to the teaching of the learned); that will be to him a staff in adversity","t1":"Katrila Naayinung Ketka Aqdhoruvarku","t2":"Orkaththin Ootraan Thunai"},{"n":415,"c":42,"ct":"கேள்வி","ce":"On Hearing","l1":"இழுக்கல் உடையுழி ஊற்றுக்கோல் அற்றே","l2":"ஒழுக்க முடையார்வாய்ச் சொல்.","mv":"ஒழுக்கமுடைய சான்றோரின் வாய்ச் சொற்கள், வழுக்கல் உடைய சேற்று நிலத்தில் ஊன்றுகோல் போல் வாழ்க்கையில் உதவும்.","ex":"The words of the good are like a staff in a slippery place","t1":"Izhukkal Utaiyuzhi Ootrukkol Atre","t2":"Ozhukka Mutaiyaarvaaich Chol"},{"n":416,"c":42,"ct":"கேள்வி","ce":"On Hearing","l1":"எனைத்தானும் நல்லவை கேட்க அனைத்தானும்","l2":"ஆன்ற பெருமை தரும்.","mv":"எவ்வளவு சிறிதே ஆயினும் நல்லவற்றைக் கேட்டறிய வேண்டும், கேட்ட அந்த அளவிற்கு அவை நிறைந்த பெருமையைத் தரும்.","ex":"Let a man listen, never so little, to good (instruction), even that will bring him great dignity","t1":"Enaiththaanum Nallavai Ketka Anaiththaanum","t2":"Aandra Perumai Tharum"},{"n":417,"c":42,"ct":"கேள்வி","ce":"On Hearing","l1":"பிழைத் துணர்ந்தும் பேதைமை சொல்லா ரிழைத்துணர்ந்","l2":"தீண்டிய கேள்வி யவர்.","mv":"நுட்பமாக உணர்ந்து நிறைந்த கேள்வியறிவை உடையவர், ( ஒரு கால் பொருள்களைத்) தவறாக உணர்ந்திருந்தாலும் பேதைமையானவற்றைச் சொல்லார்.","ex":"Not even when they have imperfectly understood (a matter), will those men speak foolishly, who have profoundly studied and diligently listened (to instruction)","t1":"Pizhaith Thunarndhum Pedhaimai Sollaa","t2":"Rizhaiththunarn Theentiya Kelvi Yavar"},{"n":418,"c":42,"ct":"கேள்வி","ce":"On Hearing","l1":"கேட்பினுங் கேளாத் தகையவே கேள்வியால்","l2":"தோட்கப் படாத செவி.","mv":"கேள்வியறிவால் துளைக்கப் படாத செவிகள், ( இயற்கையான துளைகள் கொண்டு ஓசையைக்) கேட்டறிந்தாலும் கேளாத செவிட்டுத் தன்மை உடையனவே.","ex":"The ear which has not been bored by instruction, although it hears, is deaf","t1":"Ketpinung Kelaath Thakaiyave Kelviyaal","t2":"Thotkap Pataadha Sevi"},{"n":419,"c":42,"ct":"கேள்வி","ce":"On Hearing","l1":"நுணங்கிய கேள்விய ரல்லார் வணங்கிய","l2":"வாயின ராதல் அரிது.","mv":"நுட்பமான பொருள்களைக் கேட்டறிந்தவர் அல்லாத மற்றவர், வணக்கமானச் சொற்களைப் பேசும் வாயினை உடையவராக முடியாது.","ex":"It is a rare thing to find modesty, a reverend mouth- with those who have not received choice instruction","t1":"Nunangiya Kelviya Rallaar Vanangiya","t2":"Vaayina Raadhal Aridhu"},{"n":420,"c":42,"ct":"கேள்வி","ce":"On Hearing","l1":"செவியிற் சுவையுணரா வாயுணர்வின் மாக்கள்","l2":"அவியினும் வாழினும் என்?","mv":"செவியால் கேள்விச் சுவை உணராமல் வாயின் சுவையுணர்வு மட்டும் உடைய மக்கள், இறந்தாலும் என்ன, உயிரோடு வாழ்ந்தாலும் என்ன.","ex":"What does it matter whether those men live or die, who can judge of tastes by the mouth, and not by the ear ?","t1":"Seviyir Suvaiyunaraa Vaayunarvin Maakkal","t2":"Aviyinum Vaazhinum En?"},{"n":421,"c":43,"ct":"அறிவுடைமை","ce":"On Knowledge","l1":"அறிவற்றங் காக்குங் கருவி செறுவார்க்கும்","l2":"உள்ளழிக்க லாகா அரண்.","mv":"அறிவு அழிவு வராமல் காக்கும் கருவியாகும், அன்றியும் பகைகொண்டு எதிர்ப்பவர்க்கும் அழிக்க முடியாத உள்ளரணும் ஆகும்.","ex":"Wisdom is a weapon to ward off destruction; it is an inner fortress which enemies cannot destroy","t1":"Arivatrang Kaakkung Karuvi Seruvaarkkum","t2":"Ullazhikka Laakaa Aran"},{"n":422,"c":43,"ct":"அறிவுடைமை","ce":"On Knowledge","l1":"சென்ற இடத்தால் செலவிடா தீதொரீஇ","l2":"நன்றின்பால் உய்ப்ப தறிவு.","mv":"மனத்தை சென்ற இடத்தில் செல்லவிடாமல், தீமையானதிலிருந்து நீக்கிக் காத்து நன்மையானதில் செல்லவிடுவதே அறிவாகும்.","ex":"Not to permit the mind to go where it lists, to keep it from evil, and to employ it in good, this is wisdom","t1":"Sendra Itaththaal Selavitaa Theedhoreei","t2":"Nandrinpaal Uyppa Tharivu"},{"n":423,"c":43,"ct":"அறிவுடைமை","ce":"On Knowledge","l1":"எப்பொருள் யார்யார்வாய்க் கேட்பினும் அப்பொருள்","l2":"மெய்ப்பொருள் காண்ப தறிவு.","mv":"எப்பொருளை யார் யார் இடம் கேட்டாலும் (கேட்டவாறே கொள்ளாமல்) அப் பொருளின் மெய்யானப் பொருளைக் காண்பதே அறிவாகும்.","ex":"To discern the truth in every thing, by whomsoever spoken, is wisdom","t1":"Epporul Yaaryaarvaaik Ketpinum Apporul","t2":"Meypporul Kaanpa Tharivu"},{"n":424,"c":43,"ct":"அறிவுடைமை","ce":"On Knowledge","l1":"எண்பொருள வாகச் செலச்சொல்லித் தான்பிறர்வாய்","l2":"நுண்பொருள் காண்ப தறிவு.","mv":"தான் சொல்லுவன எளிய பொருளையுடையனவாகப் பதியுமாறு சொல்லி, தான் பிறரிடம் கேட்பவற்றின் நுட்பமானப் பொருளையும் ஆராய்ந்து காண்பது அறிவாகும்.","ex":"To speak so as that the meaning may easily enter the mind of the hearer, and to discern the subtlest thought which may lie hidden in the words of others, this is wisdom","t1":"Enporula Vaakach Chelachchollith Thaanpirarvaai","t2":"Nunporul Kaanpa Tharivu"},{"n":425,"c":43,"ct":"அறிவுடைமை","ce":"On Knowledge","l1":"உலகம் தழீஇய தொட்பம் மலர்தலும்","l2":"கூம்பலும் இல்ல தறிவு.","mv":"உலகத்து உயர்ந்தவரை நட்பாக்கி கொள்வது சிறந்த அறிவு, முன்னே மகிழ்ந்து விரிதலும் பின்னே வருந்திக் குவிதலும் இல்லாத அறிவு.","ex":"To secure the friendship of the great is true wisdom; it is (also) wisdom to keep (that friendship unchanged, and) not opening and closing (like the lotus flower)","t1":"Ulakam Thazheeiya Thotpam Malardhalum","t2":"Koompalum Illa Tharivu"},{"n":426,"c":43,"ct":"அறிவுடைமை","ce":"On Knowledge","l1":"எவ்வ துறைவது உலகம் உலகத்தோடு","l2":"அவ்வ துறைவ தறிவு.","mv":"உலகம் எவ்வாறு நடைபெறுகின்றதோ, உலகத்தோடு பொருந்திய வகையில் தானும் அவ்வாறு நடப்பதே அறிவாகும்.","ex":"To live as the world lives, is wisdom","t1":"Evva Thuraivadhu Ulakam Ulakaththotu","t2":"Avva Thuraiva Tharivu"},{"n":427,"c":43,"ct":"அறிவுடைமை","ce":"On Knowledge","l1":"அறிவுடையார் ஆவ தறிவார் அறிவிலார்","l2":"அஃதறி கல்லா தவர்.","mv":"அறிவுடையோர் எதிர்காலத்தில் நிகழப்போவதை முன்னே எண்ணி அறியவல்லார், அறிவில்லாதவர் அதனை அறிய முடியாதவர்.","ex":"The wise are those who know beforehand what will happen; those who do not know this are the unwise","t1":"Arivutaiyaar Aava Tharivaar Arivilaar","t2":"Aqdhari Kallaa Thavar"},{"n":428,"c":43,"ct":"அறிவுடைமை","ce":"On Knowledge","l1":"அஞ்சுவ தஞ்சாமை பேதைமை அஞ்சுவது","l2":"அஞ்சல் அறிவார் தொழில்.","mv":"அஞ்சத்தக்கதைக் கண்டு அஞ்சாதிருப்பது அறியாமையாகும், அஞ்சத் தக்கதைக் கண்டு அஞ்சுவதே அறிவுடையவரின் தொழிலாகும்.","ex":"Not to fear what ought to be feared, is folly; it is the work of the wise to fear what should be feared","t1":"Anjuva Thanjaamai Pedhaimai Anjuvadhu","t2":"Anjal Arivaar Thozhil"},{"n":429,"c":43,"ct":"அறிவுடைமை","ce":"On Knowledge","l1":"எதிரதாக் காக்கும் அறிவினார்க் கில்லை","l2":"அதிர வருவதோர் நோய்.","mv":"வரப்போவதை முன்னே அறிந்து காத்துக் கொள்ளவல்ல அறிவுடையவர்க்கு, அவர் நடுங்கும் படியாக வரக்கூடிய துன்பம் ஒன்றும் இல்லை.","ex":"No terrifying calamity will happen to the wise, who (foresee) and guard against coming evils","t1":"Edhiradhaak Kaakkum Arivinaark Killai","t2":"Adhira Varuvadhor Noi"},{"n":430,"c":43,"ct":"அறிவுடைமை","ce":"On Knowledge","l1":"அறிவுடையார் எல்லா முடையார் அறிவிலார்","l2":"என்னுடைய ரேனும் இலர்.","mv":"அறிவுடையவர் (வேறொன்றும் இல்லாதிருப்பினும்) எல்லாம் உடையவரே ஆவர், அறிவில்லாதவர் வேறு என்ன உடையவராக இருப்பினும் ஒன்றும் இல்லாதவரே ஆவர்.","ex":"Those who possess wisdom, possess every thing; those who have not wisdom, whatever they may possess, have nothing","t1":"Arivutaiyaar Ellaa Mutaiyaar Arivilaar","t2":"Ennutaiya Renum Ilar"},{"n":431,"c":44,"ct":"குற்றங்கடிதல்","ce":"On Restraining Faults","l1":"செருக்குஞ் சினமும் சிறுமையும் இல்லார்","l2":"பெருக்கம் பெருமித நீர்த்து.","mv":"செருக்கும் சினமும் காமமும் ஆகிய இந்தக் குற்றங்கள் இல்லாதவனுடைய வாழ்வில் காணும் பெருக்கம் மேம்பாடு உடையதாகும்.","ex":"Truly great is the excellence of those (kings) who are free from pride, anger, and lust","t1":"Serukkunj Chinamum Sirumaiyum Illaar","t2":"Perukkam Perumidha Neerththu"},{"n":432,"c":44,"ct":"குற்றங்கடிதல்","ce":"On Restraining Faults","l1":"இவறலும் மாண்பிறந்த மானமும் மாணா","l2":"உவகையும் ஏதம் இறைக்கு.","mv":"பொருள் கொடாத தன்மையும் மாட்சியில்லாத மானமும், தகுதியற்ற மகிழ்ச்சியும் தலைவனாக இருப்பனுக்கு குற்றங்களாகும்.","ex":"Avarice, undignified pride, and low pleasures are faults in a king","t1":"Ivaralum Maanpirandha Maanamum Maanaa","t2":"Uvakaiyum Edham Iraikku"},{"n":433,"c":44,"ct":"குற்றங்கடிதல்","ce":"On Restraining Faults","l1":"தினைத்துணையாங் குற்றம் வரினும் பனைத்துணையாக்","l2":"கொள்வர் பழிநாணு வார்.","mv":"பழி நாணுகின்ற பெருமக்கள் தினையளவாகிய சிறு குற்றம் நேர்ந்தாலும் அதை பனையளவாகக் கருதிக் (குற்றம் செய்யாமல்) காத்துக் கொள்வர்.","ex":"Those who fear guilt, if they commit a fault small as a millet seed, will consider it to be as large as a palmyra tree","t1":"Thinaiththunaiyaang Kutram Varinum Panaiththunaiyaak","t2":"Kolvar Pazhinaanu Vaar"},{"n":434,"c":44,"ct":"குற்றங்கடிதல்","ce":"On Restraining Faults","l1":"குற்றமே காக்க பொருளாகக் குற்றமே","l2":"அற்றந் த்ரூஉம் பகை.","mv":"குற்றமே ஒருவனுக்கு அழிவை உண்டாக்கும் பகையாகும், ஆகையால் குற்றம் செய்யாமல் இருப்பதே நோக்கமாகக் கொண்டு காத்துக் கொள்ள வேண்டும்.","ex":"Guard against faults as a matter (of great consequence; for) faults are a deadly enemy","t1":"Kutrame Kaakka Porulaakak Kutrame","t2":"Atran Tharooum Pakai"},{"n":435,"c":44,"ct":"குற்றங்கடிதல்","ce":"On Restraining Faults","l1":"வருமுன்னர்க் காவாதான் வாழ்க்கை எரிமுன்னர்","l2":"வைத்தூறு போலக் கெடும்.","mv":"குற்றம் நேர்வதற்கு முன்னமே வராமல் காத்துக் கொள்ளாதவனுடைய வாழ்க்கை, நெருப்பின் முன் நின்ற வைக்கோல் போர் போல் அழிந்துவிடும்.","ex":"The prosperity of him who does not timely guard against faults, will perish like straw before fire","t1":"Varumunnark Kaavaadhaan Vaazhkkai Erimunnar","t2":"Vaiththooru Polak Ketum"},{"n":436,"c":44,"ct":"குற்றங்கடிதல்","ce":"On Restraining Faults","l1":"தன்குற்றம் நீக்கிப் பிறர்குற்றங் காண்கிற்பின்","l2":"என்குற்ற மாகும் இறைக்கு?","mv":"முன்னே தன் குற்றத்தைக் கண்டு நீக்கி பிறகு பிறருடையக் குற்றத்தை ஆராயவல்லவனானால், தலைவனுக்கு என்ன குற்றமாகும்.","ex":"What fault will remain in the king who has put away his own evils, and looks after the evils of others","t1":"Thankutram Neekkip Pirarkutrang Kaankirpin","t2":"Enkutra Maakum Iraikku?"},{"n":437,"c":44,"ct":"குற்றங்கடிதல்","ce":"On Restraining Faults","l1":"செயற்பால செய்யா திவறியான் செல்வம்","l2":"உயற்பால தன்றிக் கெடும்.","mv":"செய்யத்தக்க நன்மைகளைச் செய்யாமல் பொருளைச் சேர்த்து வைத்திருப்பவனுடைய செல்வம், உய்யுந் தன்மை இல்லாமல் அழியும்.","ex":"The wealth of the avaricious man, who does not expend it for the purposes for which he ought to expend it will waste away and not continue","t1":"Seyarpaala Seyyaa Thivariyaan Selvam","t2":"Uyarpaala Thandrik Ketum"},{"n":438,"c":44,"ct":"குற்றங்கடிதல்","ce":"On Restraining Faults","l1":"பற்றுள்ளம் என்னும் இவறன்மை எற்றுள்ளும்","l2":"எண்ணப் படுவதொன் றன்று.","mv":"பொருளினிடத்தில் பற்றுக் கொள்ளும் உள்ளமாகிய ஈயாத்தன்மை, குற்றம் எதனோடும் சேர்ந்து எண்ணத்தகாத ஒரு தனிக் குற்றமாகும்.","ex":"Griping avarice is not to be reckoned as one among other faults; (it stands alone - greater than all)","t1":"Patrullam Ennum Ivaranmai Etrullum","t2":"Ennap Patuvadhon Randru"},{"n":439,"c":44,"ct":"குற்றங்கடிதல்","ce":"On Restraining Faults","l1":"வியவற்க எஞ்ஞான்றும் தன்னை நயவற்க","l2":"நன்றி பயவா வினை.","mv":"எக்காலத்திலும் தன்னை மிக உயர்வாக எண்ணி வியந்து மதிக்கக் கூடாது, நன்மை தராத செயலைத்தான் விரும்பவும் கூடாது.","ex":"Let no (one) praise himself, at any time; let him not desire to do useless things","t1":"Viyavarka Egngnaandrum Thannai Nayavarka","t2":"Nandri Payavaa Vinai"},{"n":440,"c":44,"ct":"குற்றங்கடிதல்","ce":"On Restraining Faults","l1":"காதல காதல் அறியாமை உய்க்கிற்பின்","l2":"ஏதில ஏதிலார் நூல்.","mv":"தன் விருப்பம் பிறர்க்கு தெரியாதபடி விருப்பமான வற்றை நுகர வல்லவனானால், பகைவர் தன்னை வஞ்சிப்பதற்காகச் செய்யும் சூழ்ச்சிகள் பலிக்காமல் போகும்.","ex":"If (a king) enjoys, privately the things which he desires, the designs of his enemies will be useless","t1":"Kaadhala Kaadhal Ariyaamai Uykkirpin","t2":"Edhila Edhilaar Nool"},{"n":441,"c":45,"ct":"பெரியாரைத் துணைக்கோடல்","ce":"On Association with Elders","l1":"அறனறிந்து மூத்த அறிவுடையார் கேண்மை","l2":"திறனறிந்து தேர்ந்து கொளல்.","mv":"அறம் உணர்ந்தவராய்த் தன்னை விட மூத்தவராய் உள்ள அறிவுடையவரின் நட்பை, கொள்ளும் வகை அறிந்து ஆராய்ந்து கொள்ள வேண்டும்.","ex":"Let (a king) ponder well its value, and secure the friendship of men of virtue and of mature knowledge","t1":"Aranarindhu Mooththa Arivutaiyaar Kenmai","t2":"Thiranarindhu Therndhu Kolal"},{"n":442,"c":45,"ct":"பெரியாரைத் துணைக்கோடல்","ce":"On Association with Elders","l1":"உற்றநோய் நீக்கி உறாஅமை முற்காக்கும்","l2":"பெற்றியார்ப் பேணிக் கொளல்.","mv":"வந்துள்ள துன்பத்தை நீக்கி, இனித் துன்பம் வராதபடி முன்னதாகவே காக்கவல்ல தன்மையுடையவரைப் போற்றி நட்புக் கொள்ள வேண்டும்.","ex":"Let (a king) procure and kindly care for men who can overcome difficulties when they occur, and guard against them before they happen","t1":"Utranoi Neekki Uraaamai Murkaakkum","t2":"Petriyaarp Penik Kolal"},{"n":443,"c":45,"ct":"பெரியாரைத் துணைக்கோடல்","ce":"On Association with Elders","l1":"அரியவற்று ளெல்லாம் அரிதே பெரியாரைப்","l2":"பேணித் தமராக் கொளல்.","mv":"பெரியாரைப் போற்றி தமக்குச் சுற்றத்தாராக்கிக் கொள்ளுதல், பெறத்தக்க அரிய பேறுகள் எல்லாவற்றிலும் அருமையானதாகும்.","ex":"To cherish great men and make them his own, is the most difficult of all difficult things","t1":"Ariyavatru Lellaam Aridhe Periyaaraip","t2":"Penith Thamaraak Kolal"},{"n":444,"c":45,"ct":"பெரியாரைத் துணைக்கோடல்","ce":"On Association with Elders","l1":"தம்மிற் பெரியார் தமரா ஒழுகுதல்","l2":"வன்மையு ளெல்லாந் தலை.","mv":"தம்மைவிட (அறிவு முதலியவற்றால் ) பெரியவர் தமக்குச் சுற்றத்தராகுமாறு நடத்தல், வல்லமை எல்லாவற்றிலும் சிறந்ததாகும்.","ex":"So to act as to make those men, his own, who are greater than himself is of all powers the highest","t1":"Thammir Periyaar Thamaraa Ozhukudhal","t2":"Vanmaiyu Lellaan Thalai"},{"n":445,"c":45,"ct":"பெரியாரைத் துணைக்கோடல்","ce":"On Association with Elders","l1":"சூழ்வார்கண் ணாக ஒழுகலான் மன்னவன்","l2":"சூழ்வாரைக் சூழ்ந்து கொளல்.","mv":"தக்க வழிகளை ஆராய்ந்து கூறும் அறிஞரையே உலகம் கண்ணாகக் கொண்டு நடத்தலால், மன்னவனும் அத்தகையாரைக் ஆராய்ந்து நட்புக்கொள்ள வேண்டும்.","ex":"As a king must use his ministers as eyes (in managing his kingdom), let him well examine their character and qualifications before he engages them","t1":"Soozhvaarkan Naaka Ozhukalaan Mannavan","t2":"Soozhvaaraik Soozhndhu Kolal"},{"n":446,"c":45,"ct":"பெரியாரைத் துணைக்கோடல்","ce":"On Association with Elders","l1":"தக்கா ரினத்தனாய்த் தானொழுக வல்லானைச்","l2":"செற்றார் செயக்கிடந்த தில்.","mv":"தக்க பெரியாரின் கூட்டத்தில் உள்ளனவாய் நடக்கவல்ல ஒருவனுக்கு,அவனுடைய பகைவர் செய்யக்கூடியத் தீங்கு ஒன்றும் இல்லை.","ex":"There will be nothing left for enemies to do, against him who has the power of acting (so as to secure) the fellowship of worthy men","t1":"Thakkaa Rinaththanaaith Thaanozhuka Vallaanaich","t2":"Chetraar Seyakkitandha Thil"},{"n":447,"c":45,"ct":"பெரியாரைத் துணைக்கோடல்","ce":"On Association with Elders","l1":"இடிக்குந் துணையாரை யாள்வரை யாரே","l2":"கெடுக்குந் தகைமை யவர்.","mv":"கடிந்து அறிவுரைக் கூறவல்ல பெரியாரின் துணை கொண்டு நடப்பவரை கெடுக்கும் ஆற்றல் உள்ளவர் எவர் இருக்கின்றனர்.","ex":"Who are great enough to destroy him who has servants that have power to rebuke him ?","t1":"Itikkun Thunaiyaarai Yaalvarai Yaare","t2":"Ketukkun Thakaimai Yavar"},{"n":448,"c":45,"ct":"பெரியாரைத் துணைக்கோடல்","ce":"On Association with Elders","l1":"இடிப்பாரை இல்லாத ஏமரா மன்னன்","l2":"கெடுப்பா ரிலானுங் கெடும்.","mv":"கடிந்து அறிவுரைக் கூறும் பெரியாரின் துணை இல்லாதக் காவலற்ற அரசன், தன்னைக் கெடுக்ககும் பகைவர் எவரும் இல்லாவிட்டாலும் கெடுவான்.","ex":"The king, who is without the guard of men who can rebuke him, will perish, even though there be no one to destroy him","t1":"Itippaarai Illaadha Emaraa Mannan","t2":"Ketuppaa Rilaanung Ketum"},{"n":449,"c":45,"ct":"பெரியாரைத் துணைக்கோடல்","ce":"On Association with Elders","l1":"முதலிலார்க ஊதிய மில்லை மதலையாஞ்","l2":"சார்பிலார்க் கில்லை நிலை.","mv":"முதல் இல்லாத வணிகர்க்கு அதனால் வரும் ஊதியம் இல்லை, அதுபோல் தம்மைத் தாங்கிக் காப்பாற்றும் துணை இல்லாதவர்க்கு நிலைபேறு இல்லை.","ex":"There can be no gain to those who have no capital; and in like manner there can be no permanence to","t1":"Mudhalilaarkku Oodhiya Millai Madhalaiyaanjjch","t2":"Aarpilaark Killai Nilai"},{"n":450,"c":45,"ct":"பெரியாரைத் துணைக்கோடல்","ce":"On Association with Elders","l1":"பல்லார் பகை கொளலிற் பத்தடுத்த தீமைத்தே","l2":"நல்லார் தொடர்கை விடல்.","mv":"நல்லவராகிய பெரியாரின் தொடர்பைக் கைவிடுதல் பலருடைய பகையைத் தேடிக்கொள்வதைவிடப் பத்து மடங்கு தீமை உடையதாகும்.","ex":"It is tenfold more injurious to abandon the friendship of the good, than to incur the hatred of the many","t1":"Pallaar Pakai Kolalir Paththatuththa","t2":"Theemaiththe Nallaar Thotarkai Vital"},{"n":451,"c":46,"ct":"சிற்றினஞ்சேராமை","ce":"On Avoiding Low Company","l1":"சிற்றினம் அஞ்சும் பெருமை சிறுமைதான்","l2":"சுற்றமாச் சூழ்ந்து விடும்.","mv":"பெரியோரின் இயல்பு சிற்றினத்தை அஞ்சி ஒதுக்கும், சிறியோரின் இயல்பு அதையே சுற்றமாக எண்ணித் தழுவிக் கொள்ளும்.","ex":"(True) greatness fears the society of the base; it is only the low - minded who will regard them as friends","t1":"Sitrinam Anjum Perumai Sirumaidhaan","t2":"Sutramaach Choozhndhu Vitum"},{"n":452,"c":46,"ct":"சிற்றினஞ்சேராமை","ce":"On Avoiding Low Company","l1":"நிலத்தியல்பால் நீர்திரிந் தற்றாகும் மாந்தர்க்கு","l2":"இனத்தியல்ப தாகும் அறிவு.","mv":"சேர்ந்த நிலத்தின் இயல்பால் அந்த நீர் வேறுபட்டு அந் நிலத்தின் தன்மையுடையதாகும், அதுபோல் மக்களுடைய அறிவு இனத்தின் இயல்பினை உடையதாகும்.","ex":"As water changes (its nature), from the nature of the soil (in which it flows), so will the character of men resemble that of their associates","t1":"Nilaththiyalpaal Neerdhirin Thatraakum Maandharkku","t2":"Inaththiyalpa Thaakum Arivu"},{"n":453,"c":46,"ct":"சிற்றினஞ்சேராமை","ce":"On Avoiding Low Company","l1":"மனத்தானாம் மாந்தர்க் குணர்ச்சி இனத்தானாம்","l2":"இன்னான் எனப்படுஞ் சொல்.","mv":"மக்களுக்கு இயற்கையறிவு மனத்தால் ஏற்படும், இப்படிப் பட்டவன் என்று உலகத்தாரால் மதிக்கப்படும் சொல், சேர்ந்த இனத்தால் ஏற்படும்.","ex":"The power of knowing is from the mind; (but) his character is from that of his associates","t1":"Manaththaanaam Maandhark Kunarchchi Inaththaanaam","t2":"Innaan Enappatunj Chol"},{"n":454,"c":46,"ct":"சிற்றினஞ்சேராமை","ce":"On Avoiding Low Company","l1":"மனத்து ளதுபோலக் காட்டி ஒருவற்கு","l2":"இனத்துள தாகும் அறிவு.","mv":"ஒருவனுக்கு சிறப்பறிவு மனத்தில் உள்ளது போலக் காட்டி (உண்மையாக நோக்கும் போது) அவன் சேர்ந்த இனத்தில் உள்ளதாகும்.","ex":"Wisdom appears to rest in the mind, but it really exists to a man in his companions","t1":"Manaththu Ladhupolak Kaatti Oruvarku","t2":"Inaththula Thaakum Arivu"},{"n":455,"c":46,"ct":"சிற்றினஞ்சேராமை","ce":"On Avoiding Low Company","l1":"மனந்தூய்மை செய்வினை தூய்மை இரண்டும்","l2":"இனந்தூய்மை தூவா வரும்.","mv":"மனத்தின் தூய்மை செய்யும் செயலின் தூய்மை ஆகிய இவ்விரண்டும் சேர்ந்த இனத்தின் தூய்மையைப் பொறுத்தே ஏற்ப்படும்.","ex":"Chaste company is the staff on which come, these two things, viz, purity of mind and purity of conduct","t1":"Manandhooimai Seyvinai Thooimai Irantum","t2":"Inandhooimai Thoovaa Varum"},{"n":456,"c":46,"ct":"சிற்றினஞ்சேராமை","ce":"On Avoiding Low Company","l1":"மனந்தூயார்க் கெச்சம்நன் றாகும் இனந்தூயார்க்கு","l2":"இல்லைநன் றாகா வினை.","mv":"மனம் தூய்மையாகப் பெற்றவர்க்கு , அவர்க்குப் பின் எஞ்சி நிற்கும் புகழ் முதலியவை நன்மையாகும், இனம் தூய்மையாக உள்ளவர்க்கு நன்மையாகாத செயல் இல்லை.","ex":"To the pure-minded there will be a good posterity By those whose associates are pure, no deeds will be done that are not good","t1":"Manandhooyaark Kechchamnan Raakum Inandhooyaarkku","t2":"Illainan Raakaa Vinai"},{"n":457,"c":46,"ct":"சிற்றினஞ்சேராமை","ce":"On Avoiding Low Company","l1":"மனநலம் மன்னுயிர்க் காக்கம் இனநலம்","l2":"எல்லாப் புகழும் தரும்.","mv":"மனதின் நன்மை உயிர்க்கு ஆக்கமாகும், இனத்தின் தன்மை (அவ்வளவோடு நிற்காமல்) எல்லாப் புகழையும் கொடுக்கும்.","ex":"Goodness of mind will give wealth, and good society will bring with it all praise, to men","t1":"Mananalam Mannuyirk Kaakkam Inanalam","t2":"Ellaap Pukazhum Tharum"},{"n":458,"c":46,"ct":"சிற்றினஞ்சேராமை","ce":"On Avoiding Low Company","l1":"மனநலம் நன்குடைய ராயினும் சான்றோர்க்கு","l2":"இனநலம் ஏமாப் புடைத்து.","mv":"மனதின் நன்மையை உறுதியாக உடையவராயினும் சான்றோர்க்கு இனத்தின் நன்மை மேலும் நல்ல காவலாக அமையும்.","ex":"Yet good companionship is confirmation strong","t1":"Mananalam Nankutaiya Raayinum Saandrorkku","t2":"Inanalam Emaap Putaiththu"},{"n":459,"c":46,"ct":"சிற்றினஞ்சேராமை","ce":"On Avoiding Low Company","l1":"மனநலத்தின் ஆகும் மறுமைமற் றஃதும்","l2":"இனநலத்தின் ஏமாப் புடைத்து.","mv":"மனத்தின் நன்மையால் மறுமை இன்பம் உண்டாகும், அதுவும் இனத்தின் நன்மையால் மேலும் சிறப்புடையதாகும்.","ex":"Future bliss is (the result) of goodness of mind; and even this acquires strength from the society of the good","t1":"Mananalaththin Aakum Marumaimar Raqdhum","t2":"Inanalaththin Emaap Putaiththu"},{"n":460,"c":46,"ct":"சிற்றினஞ்சேராமை","ce":"On Avoiding Low Company","l1":"நல்லினத்தி னூங்குந் துணையில்லை தீயினத்தின்","l2":"அல்லற் படுப்பதூஉம் இல்.","mv":"நல்ல இனத்தைவிடச் சிறந்ததாகிய துணையும் உலகத்தில் இல்லை, தீய இனத்தைவிடத் துன்பப்படுத்தும் பகையும் இல்லை.","ex":"There is no greater help than the company of the good; there is no greater source of sorrow than the company of the wicked","t1":"Nallinaththi Noongun Thunaiyillai Theeyinaththin","t2":"Allar Patuppadhooum Il"},{"n":461,"c":47,"ct":"தெரிந்துசெயல்வகை","ce":"On Action after Due Deliberation","l1":"அழிவதூஉம் ஆவதூஉம் ஆகி வழிபயக்கும்","l2":"ஊதியமும் சூழ்ந்து செயல்.","mv":"(ஒரு செயலைத் தொடங்குமுன்) அதனால் அழிவதையும் அழிந்த பின் ஆவதையும், பின்பு உண்டாகும் ஊதியத்தையும் ஆராய்ந்து செய்ய வேண்டும்.","ex":"Let a man reflect on what will be lost, what will be acquired and (from these) what will be his ultimate gain, and (then, let him) act","t1":"Azhivadhooum Aavadhooum Aaki Vazhipayakkum","t2":"Oodhiyamum Soozhndhu Seyal"},{"n":462,"c":47,"ct":"தெரிந்துசெயல்வகை","ce":"On Action after Due Deliberation","l1":"தெரிந்த இனத்தொடு தேர்ந்தெண்ணிச் செய்வார்க்கு","l2":"அரும்பொருள் யாதொன்றும் இல்","mv":"ஆராய்ந்து சேர்ந்த இனத்துடன் (செயலைப்பற்றி) நன்றாகத் தேர்ந்து, தாமும் எண்ணிப்பார்த்துச் செய்கின்றவர்க்கு அறிய பொருள் ஒன்றும் இல்லை.","ex":"There is nothing too difficult to (be attained by) those who, before they act, reflect well themselves, and thoroughly consider (the matter) with chosen friends","t1":"Therindha Inaththotu Therndhennich Cheyvaarkku","t2":"Arumporul Yaadhondrum Il"},{"n":463,"c":47,"ct":"தெரிந்துசெயல்வகை","ce":"On Action after Due Deliberation","l1":"ஆக்கம் கருதி முதலிழக்கும் செய்வினை","l2":"ஊக்கார் அறிவுடை யார்.","mv":"பின் விளையும் ஊதியத்தைக் கருதி இப்போது கையில் உள்ள முதலை இழந்து விடக் காரணமாச் செயலை அறிவுடையோர் மேற்க்கொள்ள மாட்டார்.","ex":"Wise men will not, in the hopes of profit, undertake works that will consume their principal","t1":"Aakkam Karudhi Mudhalizhakkum Seyvinai","t2":"Ookkaar Arivutai Yaar"},{"n":464,"c":47,"ct":"தெரிந்துசெயல்வகை","ce":"On Action after Due Deliberation","l1":"தெளிவி லதனைத் தொடங்கார் இளிவென்னும்","l2":"ஏதப்பாடு அஞ்சு பவர்.","mv":"இழிவு தருவதாகியக் குற்றத்திற்கு அஞ்சுகின்றவர் (இன்ன ஊதியம் பயிக்கும் என்னும்) தெளிவு இல்லாத செயலைத் தொடங்கமாட்டார்.","ex":"Those who fear reproach will not commence anything which has not been (thoroughly considered) and made clear to them","t1":"Thelivi Ladhanaith Thotangaar Ilivennum","t2":"Edhappaatu Anju Pavar"},{"n":465,"c":47,"ct":"தெரிந்துசெயல்வகை","ce":"On Action after Due Deliberation","l1":"வகையறச் சூழா தெழுதல் பகைவரைப்","l2":"பாத்திப் படுப்பதோ ராறு.","mv":"செயலின் வகைகளை எல்லாம் முற்ற எண்ணாமல் செய்யத்தொடங்குதல், பகைவரை வளரும் பாத்தியில் நிலைபெறச் செய்வதொரு வழியாகும்.","ex":"One way to promote the prosperity of an enemy, is (for a king) to set out (to war) without having thoroughly weighed his ability (to cope with its chances)","t1":"Vakaiyarach Choozhaa Thezhudhal Pakaivaraip","t2":"Paaththip Patuppadho Raaru"},{"n":466,"c":47,"ct":"தெரிந்துசெயல்வகை","ce":"On Action after Due Deliberation","l1":"செய்தக்க அல்ல செயக் கெடும் செய்தக்க","l2":"செய்யாமை யானுங் கெடும்.","mv":"ஒருவன் செய்யத்தகாத செயல்களைச் செய்வதனால் கெடுவான், செய்யத்தக்க செயல்களை செய்யாமல் விடுவதனாலும் கெடுவான்.","ex":"He will perish who does not what is not fit to do; and he also will perish who does not do what it is fit to","t1":"Seydhakka Alla Seyak Ketum","t2":"Seydhakka Seyyaamai Yaanung Ketum"},{"n":467,"c":47,"ct":"தெரிந்துசெயல்வகை","ce":"On Action after Due Deliberation","l1":"எண்ணித் துணிக கருமம் துணிந்தபின்","l2":"எண்ணுவம் என்பது இழுக்கு.","mv":"(செய்யத் தகுந்த) செயலையும் வழிகளை எண்ணிய பிறகே துணிந்து தொடங்க வேண்டும், துணிந்த பின் எண்ணிப் பார்க்கலாம் என்பது குற்றமாகும்.","ex":"Consider, and then undertake a matter; after having undertaken it, to say \"We will consider,\" is folly","t1":"Ennith Thunika Karumam Thunindhapin","t2":"Ennuvam Enpadhu Izhukku"},{"n":468,"c":47,"ct":"தெரிந்துசெயல்வகை","ce":"On Action after Due Deliberation","l1":"ஆற்றின் வருந்தா வருத்தம் பலர்நின்று","l2":"போற்றினும் பொத்துப் படும்.","mv":"தக்கவழியில் செய்யப்படாத முயற்சி பலர் துணையாக நின்று(அதை முடிக்குமாறு) காத்த போதிலும் குறையாகிவிடும்.","ex":"The work, which is not done by suitable methods, will fail though many stand to uphold it","t1":"Aatrin Varundhaa Varuththam Palarnindru","t2":"Potrinum Poththup Patum"},{"n":469,"c":47,"ct":"தெரிந்துசெயல்வகை","ce":"On Action after Due Deliberation","l1":"நன்றாற்ற லுள்ளுந் தவுறுண்டு அவரவர்","l2":"பண்பறிந் தாற்றாக் கடை.","mv":"அவரவருடைய இயல்புகளை அறிந்து அவரவருக்குப் பொருந்துமாறு செய்யாவிட்டால், நன்மை செய்வதிலும் தவறு உண்டாகும்.","ex":"There are failures even in acting well, when it is done without knowing the various dispositions of men","t1":"Nandraatra Lullun Thavuruntu Avaravar","t2":"Panparin Thaatraak Katai"},{"n":470,"c":47,"ct":"தெரிந்துசெயல்வகை","ce":"On Action after Due Deliberation","l1":"எள்ளாத எண்ணிச் செயல்வேண்டும் தம்மோடு","l2":"கொள்ளாத கொள்ளாது உலகு.","mv":"தம் நிலையோடு பொருந்தாதவற்றை உலகம் ஏற்றுக்கொள்ளாது, ஆகையால் உலகம் இகழ்ந்து தள்ளாத செயல்களை ஆராய்ந்து செய்ய வேண்டும்.","ex":"Let a man reflect, and do things which bring no reproach; the world will not approve, with him, of things which do not become of his position to adopt","t1":"Ellaadha Ennich Cheyalventum Thammotu","t2":"Kollaadha Kollaadhu Ulaku"},{"n":471,"c":48,"ct":"வலியறிதல்","ce":"On Knowing the Enemy's Strength","l1":"வினைவலியும் தன்வலியும் மாற்றான் வலியும்","l2":"துணைவலியும் தூக்கிச் செயல்.","mv":"செயலின் வலிமையும் தன் வலிமையும் பகைவனுடைய வலிமையும் ,இருவருக்கும் துணையானவரின் வலிமையும் ஆராய்ந்து செயல்பட வேண்டும்.","ex":"Let (one) weigh well the strength of the deed (he purposes to do), his own strength, the strength of his enemy, and the strength of the allies (of both), and then let him act","t1":"Vinaivaliyum Thanvaliyum Maatraan Valiyum","t2":"Thunaivaliyum Thookkich Cheyal"},{"n":472,"c":48,"ct":"வலியறிதல்","ce":"On Knowing the Enemy's Strength","l1":"ஒல்வ தறிவது அறிந்ததன் கண்தங்கிச்","l2":"செல்வார்க்குச் செல்லாதது இல்.","mv":"தனக்குப் பொருந்தும் செயலையும் அதற்காக அறிய வேண்டியதையும் அறிந்து அதனிடம் நிலைத்து முயல்கின்றவர்க்கு முடியாதது ஒன்றும் இல்லை.","ex":"There is nothing which may not be accomplished by those who, before they attack (an enemy), make themselves acquainted with their own ability, and with whatever else is (needful) to be known, and","t1":"Olva Tharivadhu Arindhadhan Kandhangich","t2":"Chelvaarkkuch Chellaadhadhu Il"},{"n":473,"c":48,"ct":"வலியறிதல்","ce":"On Knowing the Enemy's Strength","l1":"உடைத்தம் வலியறியார் ஊக்கத்தின் ஊக்கி","l2":"இடைக்கண் முரிந்தார் பலர்.","mv":"தன்னுடைய வலிமை இவ்வளவு என அறியாமல் ஊக்கத்தால் முனைந்து தொடங்கி இடையில் அதை முடிக்க வகையில்லாமல் அழிந்தவர் பலர்.","ex":"There are many who, ignorant of their (want of) power (to meet it), have haughtily set out to war, and broken down in the midst of it","t1":"Utaiththam Valiyariyaar Ookkaththin Ookki","t2":"Itaikkan Murindhaar Palar"},{"n":474,"c":48,"ct":"வலியறிதல்","ce":"On Knowing the Enemy's Strength","l1":"அமைந்தாங் கொழுகான் அளவறியான் தன்னை","l2":"வியந்தான் விரைந்து கெடும்.","mv":"மற்றவர்களோடு ஒத்து நடக்காமல், தன் வலிமையின் அளவையும் அறியாமல், தன்னை வியந்து மதித்துக் கொண்டிருப்பவன் விரைவில் கெடுவான்.","ex":"He will quickly perish who, ignorant of his own resources flatters himself of his greatness, and does","t1":"Amaindhaang Kozhukaan Alavariyaan Thannai","t2":"Viyandhaan Viraindhu Ketum"},{"n":475,"c":48,"ct":"வலியறிதல்","ce":"On Knowing the Enemy's Strength","l1":"பீலிபெய் சாகாடும் அச்சிறும் அப்பண்டஞ்","l2":"சால மிகுத்துப் பெயின்.","mv":"மயிலிறகு ஏற்றிய வண்டியே ஆனாலும் , அந்த பண்டமும் (அளவோடு ஏற்றாமல்) அளவு கடந்து மிகுதியாக ஏற்றினால் அச்சு முறியும்.","ex":"The axle tree of a bandy, loaded only with peacocks' feathers will break, if it be greatly overloaded","t1":"Peelipey Saakaatum Achchirum Appantanjjch","t2":"Aala Mikuththup Peyin"},{"n":476,"c":48,"ct":"வலியறிதல்","ce":"On Knowing the Enemy's Strength","l1":"நுனிக்கொம்பர் ஏறினார் அஃதிறந் தூக்கின்","l2":"உயிர்க்கிறுதி ஆகி விடும்.","mv":"ஒரு மரத்தின் நுனிக்கொம்பில் ஏறியவர், அதையும் கடந்து மேலே ஏற முனைந்தால், அவருடைய உயிர்க்கு முடிவாக நேர்ந்துவிடும்.","ex":"There will be an end to the life of him who, having climbed out to the end of a branch, ventures to go further","t1":"Nunikkompar Erinaar Aqdhiran Thookkin","t2":"Uyirkkirudhi Aaki Vitum"},{"n":477,"c":48,"ct":"வலியறிதல்","ce":"On Knowing the Enemy's Strength","l1":"ஆற்றின் அறவறிந்து ஈக அதுபொருள்","l2":"போற்றி வழங்கு நெறி.","mv":"தக்க வழியில் பிறர்க்கு கொடுக்கும் அளவு அறிந்து வாழாதவனுடைய வாழ்க்கை (பல வளமும்) இருப்பது போல் தோன்றி இல்லாமல் மறைந்து விடும்.","ex":"Let a man know the measure of his ability (to give), and let him give accordingly; such giving is the way to preserve his property","t1":"Aatrin Aravarindhu Eeka Adhuporul","t2":"Potri Vazhangu Neri"},{"n":478,"c":48,"ct":"வலியறிதல்","ce":"On Knowing the Enemy's Strength","l1":"ஆகாறு அளவிட்டி தாயினுங் கேடில்லை","l2":"போகாறு அகலாக் கடை.","mv":"பொருள் வரும் வழி (வருவாய்) சிறிதாக இருந்தாலும், போகும் வழி (செலவு) விரிவுபடாவிட்டால் அதனால் தீங்கு இல்லை.","ex":"Even though the income (of a king) be small, it will not cause his (ruin), if his outgoings be not larger than his income","t1":"Aakaaru Alavitti Thaayinung Ketillai","t2":"Pokaaru Akalaak Katai"},{"n":479,"c":48,"ct":"வலியறிதல்","ce":"On Knowing the Enemy's Strength","l1":"அளவற஧ந்து வாழாதான் வாழ்க்கை உளபோல","l2":"இல்லாகித் தோன்றாக் கெடும்.","mv":"பொருளின் அளவு அறிந்து வாழாதவனுடைய வாழ்க்கை (பல வளமும்) இருப்பது போல் தோன்றி இல்லாமல் மறைந்து கெட்டு விடும்.","ex":"The prosperity of him who lives without knowing the measure (of his property), will perish, even while it seems to continue","t1":"Alavara�ndhu Vaazhaadhaan Vaazhkkai Ulapola","t2":"Illaakith Thondraak Ketum"},{"n":480,"c":48,"ct":"வலியறிதல்","ce":"On Knowing the Enemy's Strength","l1":"உளவரை தூக்காத ஒப்புர வாண்மை","l2":"வளவரை வல்லைக் கெடும்.","mv":"தனக்கு பொருள் உள்ள அளவை ஆராயாமல் மேற்கொள்ளும் ஒப்புரவினால், ஒருவனுடைய செல்வத்தின் அளவு விரைவில் கெடும்.","ex":"The measure of his wealth will quickly perish, whose liberality weighs not the measure of his property","t1":"Ulavarai Thookkaadha Oppura Vaanmai","t2":"Valavarai Vallaik Ketum"},{"n":481,"c":49,"ct":"காலமறிதல்","ce":"On Knowing the Time","l1":"பகல்வெல்லும் கூகையைக் காக்கை இகல்வெல்லும்","l2":"வேந்தர்க்கு வேண்டும் பொழுது.","mv":"காக்கை தன்னைவிட வலிய கோட்டானைப் பகலில் வென்றுவிடும், அதுபோல் பகையை வெல்லக்கருதும் அரசர்க்கும் அதற்கு ஏற்ற காலம் வேண்டும்.","ex":"A crow will overcome an owl in the day time; so the king who would conquer his enemy must have (a suitable) time","t1":"Pakalvellum Kookaiyaik Kaakkai Ikalvellum","t2":"Vendharkku Ventum Pozhudhu"},{"n":482,"c":49,"ct":"காலமறிதல்","ce":"On Knowing the Time","l1":"பருவத்தோடு ஒட்ட ஒழுகல் திருவினைத்","l2":"தீராமை ஆர்க்குங் கயிறு.","mv":"காலத்தோடுப் பொருந்துமாறு ஆராய்ந்து நடத்தல் ( நில்லாத இயல்பு உடைய) செல்வத்தை நீங்காமல் நிற்குமாறு கட்டும் கயிறாகும்.","ex":"Acting at the right season, is a cord that will immoveably bind success (to a king)","t1":"Paruvaththotu Otta Ozhukal Thiruvinaith","t2":"Theeraamai Aarkkung Kayiru"},{"n":483,"c":49,"ct":"காலமறிதல்","ce":"On Knowing the Time","l1":"அருவினை யென்ப உளவோ கருவியான்","l2":"காலம் அற஧ந்து செயின்.","mv":"(செய்யும் செயலை முடிப்பதற்கு வேண்டிய) கருவிகளுடன் ஏற்றக் காலத்தையும் அறிந்து செய்தால் அரிய செயல்கள் என்பது உண்டோ.","ex":"Is there anything difficult for him to do, who acts, with (the right) instruments at the right time ?","t1":"Aruvinai Yenpa Ulavo Karuviyaan","t2":"Kaalam Arindhu Seyin"},{"n":484,"c":49,"ct":"காலமறிதல்","ce":"On Knowing the Time","l1":"ஞாலம் கருதினுங் கைகூடுங் காலம்","l2":"கருதி இடத்தாற் செயின்.","mv":"(செயலை முடிப்பதற்கு ஏற்ற) காலத்தை அறிந்து இடத்தோடு பொருந்துமாறு செய்தால், உலகமே வேண்டும் எனக் கருதினாலும் கைகூடும்.","ex":"Though (a man) should meditate (the conquest of) the world, he may accomplish it if he acts in the right time, and at the right place","t1":"Gnaalam Karudhinung Kaikootung Kaalam","t2":"Karudhi Itaththaar Seyin"},{"n":485,"c":49,"ct":"காலமறிதல்","ce":"On Knowing the Time","l1":"காலம் கருதி இருப்பர் கலங்காது","l2":"ஞாலம் கருது பவர்.","mv":"உலகத்தைக் கொள்ளக் கருதிகின்றவர் அதைப்பற்றி எண்ணிக் கலங்காமல் அதற்கு ஏற்ற காலத்தைக் கருதிக்கொண்டு பொறுத்திருப்பர்.","ex":"They who thoughtfully consider and wait for the (right) time (for action), may successfully meditate (the conquest of) the world","t1":"Kaalam Karudhi Iruppar Kalangaadhu","t2":"Gnaalam Karudhu Pavar"},{"n":486,"c":49,"ct":"காலமறிதல்","ce":"On Knowing the Time","l1":"ஊக்க முடையான் ஒடுக்கம் பொருதகர்","l2":"தாக்கற்குப் பேருந் தகைத்து.","mv":"ஊக்கம் மிகுந்தவன் (காலத்தை எதிர்பார்த்து) அடங்கியிருத்தல் போர் செய்யும் ஆட்டுக்கடா தன் பகையைத் தாக்குவதற்க்காகப் பின்னே கால் வாங்குதலைப் போன்றது.","ex":"The self-restraint of the energetic (while waiting for a suitable opportunity), is like the drawing back of a fighting-ram in order to butt","t1":"Ookka Mutaiyaan Otukkam Porudhakar","t2":"Thaakkarkup Perun Thakaiththu"},{"n":487,"c":49,"ct":"காலமறிதல்","ce":"On Knowing the Time","l1":"பொள்ளென ஆங்கே புறம்வேரார் காலம்பார்த்து","l2":"உள்வேர்ப்பர் ஒள்ளி யவர்.","mv":"அறிவுடையவர் ( பகைவர் தீங்கு செய்த) அப்பொழுதே உடனே புறத்தில் சினம் கொள்ளமாட்டார், (வெல்வதற்கு ஏற்ற) காலம் பார்த்து அகத்தில் சினம் கொள்வார்.","ex":"The wise will not immediately and hastily shew out their anger; they will watch their time, and restrain it within","t1":"Pollena Aange Puramveraar Kaalampaarththu","t2":"Ulverppar Olli Yavar"},{"n":488,"c":49,"ct":"காலமறிதல்","ce":"On Knowing the Time","l1":"செறுநரைக் காணின் சுமக்க இறுவரை","l2":"காணின் கிழக்காம் தலை.","mv":"பகைவரைக் கண்டால் பொறுத்துச் செல்லவேண்டும், அப் பகைவர்க்கு முடிவுகாலம் வந்த போது அவருடைய தலை கீழே விழும்.","ex":"If one meets his enemy, let him show him all respect, until the time for his destruction is come; when that is come, his head will be easily brought low","t1":"Serunaraik Kaanin Sumakka Iruvarai","t2":"Kaanin Kizhakkaam Thalai"},{"n":489,"c":49,"ct":"காலமறிதல்","ce":"On Knowing the Time","l1":"எய்தற் கரியது இயைந்தக்கால் அந்நிலையே","l2":"செய்தற் கரிய செயல்.","mv":"கிடைத்தற்கறிய காலம் வந்து வாய்க்குமானால், அந்த வாய்ப்பைப் பயன்படுத்திக் கொண்டு அப்போதே செய்தற்கரியச் செயல்களைச் செய்ய வேண்டும்.","ex":"If a rare opportunity occurs, while it lasts, let a man do that which is rarely to be accomplished (but for such an opportunity)","t1":"Eydhar Kariyadhu Iyaindhakkaal Annilaiye","t2":"Seydhar Kariya Seyal"},{"n":490,"c":49,"ct":"காலமறிதல்","ce":"On Knowing the Time","l1":"கொக்கொக்க கூம்பும் பருவத்து மற்றதன்","l2":"குத்தொக்க சீர்த்த இடத்து.","mv":"பொறுத்திருக்கும் காலத்தில் கொக்குப் போல் அமைதியாக இருக்க வேண்டும், காலம் வாய்த்த போது அதன் குத்து போல் தவறாமல் செய்து முடிக்க வேண்டும்.","ex":"At the time when one should use self-control, let him restrain himself like a heron; and, let him like it, strike, when there is a favourable opportunity","t1":"Kokkokka Koompum Paruvaththu Matradhan","t2":"Kuththokka Seerththa Itaththu"},{"n":491,"c":50,"ct":"இடனறிதல்","ce":"On Knowing the Place","l1":"தொடங்கற்க எவ்வினையும் எள்ளற்க முற்றும்","l2":"இடங்கண்ட பின்அல் லது.","mv":"முற்றுகை செய்வதற்கு ஏற்ற இடத்தைக் கண்டபின் அல்லாமல் எச் செயலையும் தொடங்கக்கூடாது, பகைவரை இகழவும் கூடாது.","ex":"Let not (a king) despise (an enemy), nor undertake any thing (against him), until he has obtained (a suitable) place for besieging him","t1":"Thotangarka Evvinaiyum Ellarka Mutrum","t2":"Itanganta Pinal Ladhu"},{"n":492,"c":50,"ct":"இடனறிதல்","ce":"On Knowing the Place","l1":"முரண்சேர்ந்த மொய்ம்பி னவர்க்கும் அரண்சேர்ந்தாம்","l2":"ஆக்கம் பலவுந் தரும்.","mv":"மாறுபாடு பொருந்திய வலிமை உடையவர்க்கும் அரணோடு பொருந்தி ஏற்படுகின்ற வெற்றியானது பல வகைப் பயன்களையும் கொடுக்கும்.","ex":"Even to those who are men of power and expedients, an attack in connection with a fortification will yield many advantages","t1":"Muranserndha Moimpi Navarkkum Aranserndhaam","t2":"Aakkam Palavun Tharum"},{"n":493,"c":50,"ct":"இடனறிதல்","ce":"On Knowing the Place","l1":"ஆற்றாரும் ஆற்றி அடுப இடனறிந்து","l2":"போற்றார்கண் போற்றிச் செயின்.","mv":"தக்க இடத்தை அறிந்து தம்மைக் காத்துக் கொண
