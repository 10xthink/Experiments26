<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kural Reader — Verses &amp; தமிழ் உரை</title>
<style>
  :root{
    --ink: #1B1B2F;
    --ink-soft: #2A2A44;
    --manuscript: #F6F0E4;
    --manuscript-2: #EDE3CE;
    --gold: #C9962F;
    --gold-deep: #A87824;
    --verdigris: #4C7A6B;
    --verdigris-deep: #365A4E;
    --text-muted: #6B6558;
    --text-on-ink: #EFE9DA;
    --line: #DDD0AE;
    --card: #FFFDF7;
    --font-display: Georgia, 'Times New Roman', 'Noto Serif', serif;
    --font-tamil: 'Tamil Sangam MN', 'Nirmala UI', 'Noto Sans Tamil', 'Noto Serif Tamil', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; height:100dvh; margin:0; }
  body{
    background: var(--manuscript); color: var(--ink); font-family: var(--font-body);
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; overflow:hidden;
  }

  .controls-wrap{ flex-shrink:0; width:100%; max-width:940px; margin:0 auto; }

  header{
    flex-shrink:0; padding: 14px 18px 10px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .brand{ font-family: var(--font-display); font-weight:700; font-size:16px; display:flex; align-items:center; gap:7px; white-space:nowrap; }
  .brand .mark{ color: var(--gold-deep); }
  .about-btn{
    border:none; background:none; color: var(--text-muted); font-size:15px;
    cursor:pointer; padding:2px 4px; line-height:1;
  }
  .about-btn:hover{ color: var(--gold-deep); }

  .about-overlay{
    position:fixed; inset:0; background: rgba(27,27,47,0.55);
    z-index:60; display:none; align-items:center; justify-content:center; padding:20px;
  }
  .about-overlay.open{ display:flex; }
  .about-panel{
    background: var(--manuscript); width:100%; max-width:480px;
    max-height: min(80vh, 80dvh); border-radius:20px;
    display:flex; flex-direction:column; box-shadow: 0 14px 36px rgba(0,0,0,0.25);
  }
  .about-header{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding: 16px 18px; border-bottom:1px solid var(--line);
  }
  .about-title{ font-family: var(--font-display); font-weight:700; font-size:16px; }
  .about-close{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background: var(--card); color: var(--ink-soft); font-size:13px; cursor:pointer;
  }
  .about-body{ flex:1; overflow-y:auto; padding: 16px 18px 22px; font-size:13.5px; line-height:1.6; color: var(--ink-soft); }
  .about-body h4{
    font-family: var(--font-display); font-size:13px; color: var(--gold-deep);
    margin: 18px 0 6px; text-transform:uppercase; letter-spacing:0.5px;
  }
  .about-body h4:first-child{ margin-top:0; }
  .about-body p{ margin: 0 0 4px; }
  .about-body ul{ margin: 6px 0 4px; padding-left:18px; }
  .about-body li{ margin-bottom:8px; }
  .about-tip{ font-style:italic; color: var(--gold-deep); }
  .placeholder-note{ color: var(--text-muted); font-style:italic; }
  .about-credit{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line); font-size:12px; color: var(--text-muted); }

  .header-row2{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .lang-toggle{ display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .lang-toggle-btn{
    border:none; background: var(--card); color: var(--text-muted);
    padding: 7px 11px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .lang-toggle-btn.active{ background: var(--verdigris); color:#fff; }

  .jump-row{ display:flex; align-items:center; gap:6px; }
  .jump-row input{
    width: 104px; border:1px solid var(--line); border-radius:10px; padding:7px 8px;
    font-size:16px; background: var(--card); color: var(--ink); font-family: var(--font-body);
  }
  .jump-row button{
    border:1px solid var(--ink); background: var(--ink); color: var(--text-on-ink);
    border-radius:10px; padding:7px 12px; font-size:13px; font-weight:700; cursor:pointer;
  }

  /* ---- Contents panel: fully expanded, no accordion ---- */
  .toc-book{ margin: 18px auto 4px; max-width: 680px; }
  .toc-book:first-child{ margin-top: 4px; }
  .toc-book-head{
    padding: 12px 14px; background: var(--ink); color: var(--text-on-ink); border-radius:12px;
  }
  .toc-book-head .lang-primary{ font-family: var(--font-display); font-weight:700; font-size:14.5px; }
  .toc-book-head .lang-secondary{ font-size:12px; opacity:0.75; }
  .toc-book-head span + span{ margin-left:6px; }
  .toc-book-desc{ font-size:11.5px; opacity:0.75; margin-top:3px; }

  .toc-iyal{ margin-top:12px; }
  .toc-iyal-head{ padding: 4px 4px 6px; }
  .toc-iyal-head .lang-primary{ font-weight:700; font-size:13.5px; color: var(--gold-deep); }
  .toc-iyal-head .lang-secondary{ font-size:12px; color: var(--text-muted); }
  .toc-iyal-head span + span{ margin-left:6px; }
  .toc-iyal-desc{ font-size:11px; color: var(--text-muted); margin-top:2px; }

  .toc-chapters{ background: var(--card); border: 1px solid var(--line); border-radius:10px; overflow:hidden; }

  .toc-chapter{
    display:flex; align-items:baseline; gap:8px; padding: 10px 14px;
    cursor:pointer; border-bottom: 1px solid var(--line); font-size:13px;
  }
  .toc-chapter:last-child{ border-bottom:none; }
  .toc-chapter:active{ background: var(--manuscript-2); }
  .toc-chapter-num{ font-weight:700; color: var(--gold-deep); flex-shrink:0; }
  .toc-chapter .lang-primary{ color: var(--ink); }
  .toc-chapter .lang-secondary{ color: var(--text-muted); font-size:12px; }

  .tabs{ flex-shrink:0; display:flex; padding: 0 18px; gap:8px; }
  .tab-btn{
    flex:1; border:1px solid var(--line); background: var(--card); color: var(--text-muted);
    padding:10px; border-radius:12px 12px 0 0; font-size:13.5px; font-weight:700; cursor:pointer;
    border-bottom:none;
  }
  .tab-btn.active{ background: var(--ink); color: var(--text-on-ink); border-color: var(--ink); }

  .scrub-wrap{ flex-shrink:0; padding: 10px 18px; }
  .scrub-labels{ display:flex; justify-content:space-between; font-size:11px; color: var(--text-muted); margin-bottom:5px; }
  .scrub-bar{
    position:relative; height: 10px; background: var(--manuscript-2); border-radius:999px; cursor:pointer;
    border: 1px solid var(--line);
  }
  .scrub-fill{ position:absolute; left:0; top:0; bottom:0; background: var(--gold); border-radius:999px; width:0%; pointer-events:none; }
  .scrub-marker{
    position:absolute; top:-3px; bottom:-3px; width:1.5px;
    background: var(--ink); opacity:0.35; pointer-events:none;
  }
  .scrub-handle{
    position:absolute; top:50%; width:16px; height:16px; border-radius:50%;
    background: var(--ink); border:2px solid var(--gold); transform: translate(-50%,-50%);
    left:0%; pointer-events:none;
  }

  .panels{ flex:1; min-height:0; position:relative; }
  .panel{
    position:absolute; inset:0; overflow-y:auto;
    visibility:hidden; pointer-events:none; z-index:1;
    padding: 6px 18px 60px;
  }
  .panel.active{ visibility:visible; pointer-events:auto; z-index:2; }

  .item{ padding-top: 24px; position:relative; scroll-margin-top: 10px; max-width: 680px; margin-left:auto; margin-right:auto; }
  .item:first-child{ padding-top:8px; }
  .item:not(:last-child)::after{
    content:""; display:block; width:4px; height:4px; border-radius:50%;
    background: var(--gold); opacity:0.4; margin: 24px auto 0;
  }
  .item-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .i-num{
    font-family: var(--font-display); font-weight:700; font-size:12px;
    color: var(--gold-deep); background: var(--manuscript-2); padding:3px 9px; border-radius:999px;
    display:inline-block;
  }
  .copy-btn{
    margin-left:auto; width:26px; height:26px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--line); background: var(--card); color: var(--text-muted);
    font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition: opacity 0.15s ease;
  }
  /* Hidden until the reader taps the item — content first, controls only when summoned.
     Uses opacity, not display, so the item's height never shifts and the scrubber's
     position tracking stays accurate whether the button is showing or not. */
  .item.show-actions .copy-btn{ opacity:1; pointer-events:auto; }
  .copy-btn.copied{ background: var(--verdigris); border-color: var(--verdigris); color:#fff; }

  /* verses panel — content order swaps with the language toggle; styling stays tied to
     POSITION (primary = prominent, secondary = subtle), never to which language it happens to be. */
  .v-content-primary{ font-family: var(--font-display); font-size: clamp(17px, 2.4vw, 19px); line-height:1.65; color: var(--ink); margin-bottom:6px; }
  .v-content-secondary{ font-size:13px; line-height:1.5; color: var(--text-muted); margin-bottom:6px; }
  .v-chapter{ font-size:11.5px; color: var(--text-muted); font-weight:700; text-transform:uppercase; margin-bottom:8px; }
  .v-chapter .lang-secondary{ text-transform:none; font-weight:500; opacity:0.75; }

  /* meanings panel */
  .m-chapter{ font-size:11.5px; color: var(--text-muted); font-weight:700; text-transform:uppercase; margin-bottom:8px; }
  .m-chapter .lang-secondary{ text-transform:none; font-weight:500; opacity:0.75; }
  /* Whichever language is set as primary gets the large readable style;
     the other becomes the smaller, muted, secondary line — order controlled by the language toggle. */
  .m-content-primary{ font-size: clamp(15.5px, 2.2vw, 17px); line-height:1.7; color: var(--ink); margin: 0 0 6px; }
  .m-content-secondary{ font-size:13.5px; line-height:1.6; color: var(--text-muted); margin:6px 0 0; }
  .lang-ta{ font-family: var(--font-tamil); }

  .empty{ text-align:center; padding: 40px 20px; color: var(--text-muted); font-size:13px; }
</style>
</head>
<body>

<div class="controls-wrap">
  <header>
    <div class="brand"><span class="mark">அ</span>Kural Reader<button class="about-btn" onclick="openAbout()" aria-label="About this project">ⓘ</button></div>
    <div class="header-row2">
      <div class="lang-toggle" id="lang-toggle">
        <button class="lang-toggle-btn" id="lang-btn-ta" onclick="setLangOrder('ta')">தமிழ் முதலில்</button>
        <button class="lang-toggle-btn" id="lang-btn-en" onclick="setLangOrder('en')">English first</button>
      </div>
      <div class="jump-row">
        <input type="number" id="jump-input" min="1" max="1330" placeholder="1-1330" aria-label="Jump to kural number">
        <button onclick="jumpToInput()">Go</button>
      </div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn" id="tab-contents" onclick="switchTab('contents')">Contents</button>
    <button class="tab-btn active" id="tab-verses" onclick="switchTab('verses')">Verses</button>
    <button class="tab-btn" id="tab-meanings" onclick="switchTab('meanings')">Meanings</button>
  </div>

  <div class="scrub-wrap" id="scrub-wrap">
    <div class="scrub-labels"><span id="scrub-current">#1</span><span>1330 kurals</span></div>
    <div class="scrub-bar" id="scrub-bar">
      <div class="scrub-fill" id="scrub-fill"></div>
      <div class="scrub-marker" style="left:28.57%"></div>
      <div class="scrub-marker" style="left:81.20%"></div>
      <div class="scrub-handle" id="scrub-handle"></div>
    </div>
  </div>
</div>

<div class="about-overlay" id="about-overlay">
  <div class="about-panel">
    <div class="about-header">
      <span class="about-title" id="about-title">About this project</span>
      <button class="about-close" onclick="closeAbout()" aria-label="Close">✕</button>
    </div>
    <div class="about-body" id="about-body"></div>
  </div>
</div>

<div class="panels">
  <div class="panel" id="panel-contents"></div>
  <div class="panel active" id="panel-verses"></div>
  <div class="panel" id="panel-meanings"></div>
</div>

<script>
const KURAL_DATA = [{"n":1,"c":1,"ct":"கடவுள் வாழ்த்து","ce":"In Praise of God","l1":"அகர முதல எழுத்தெல்லாம் ஆதி","l2":"பகவன் முதற்றே உலகு.","mv":"எழுத்துக்கள் எல்லாம் அகரத்தை அடிப்படையாக கொண்டிருக்கின்றன. அதுபோல உலகம் கடவுளை அடிப்படையாக கொண்டிருக்கிறது.","ex":"As the letter A is the first of all letters, so the eternal God is first in the world","t1":"Akara Mudhala Ezhuththellaam Aadhi","t2":"Pakavan Mudhatre Ulaku"},{"n":2,"c":1,"ct":"கடவுள் வாழ்த்து","ce":"In Praise of God","l1":"கற்றதனால் ஆய பயனென்கொல் வாலறிவன்","l2":"நற்றாள் தொழாஅர் எனின்.","mv":"தூய அறிவு வடிவாக விளங்கும் இறைவனுடைய நல்ல திருவடிகளை தொழாமல் இருப்பாரானால், அவர் கற்ற கல்வியினால் ஆகிய பயன் என்ன?","ex":"What Profit have those derived from learning, who worship not the good feet of Him who is possessed of pure knowledge ?","t1":"Katradhanaal Aaya Payanenkol Vaalarivan","t2":"Natraal Thozhaaar Enin"},{"n":3,"c":1,"ct":"கடவுள் வாழ்த்து","ce":"In Praise of God","l1":"மலர்மிசை ஏகினான் மாணடி சேர்ந்தார்","l2":"நிலமிசை நீடுவாழ் வார்.","mv":"அன்பரின் அகமாகிய மலரில் வீற்றிருக்கும் கடவுளின் சிறந்த திருவடிகளை பொருந்தி நினைக்கின்றவர், இன்ப உலகில் நிலைத்து வாழ்வார்","ex":"They who are united to the glorious feet of Him who passes swiftly over the flower of the mind, shall flourish long above all worlds","t1":"Malarmisai Ekinaan Maanati Serndhaar","t2":"Nilamisai Neetuvaazh Vaar"},{"n":4,"c":1,"ct":"கடவுள் வாழ்த்து","ce":"In Praise of God","l1":"வேண்டுதல் வேண்டாமை இலானடி சேர்ந்தார்க்கு","l2":"யாண்டும் இடும்பை இல.","mv":"விருப்பு வெறுப்பு இல்லாத கடவுளின் திருவடிகளை பொருந்தி நினைக்கின்றவர்க்கு எப்போதும் எவ்விடத்திலும் துன்பம் இல்லை","ex":"To those who meditate the feet of Him who is void of desire or aversion, evil shall never come","t1":"Ventudhal Ventaamai Ilaanati Serndhaarkku","t2":"Yaantum Itumpai Ila"},{"n":5,"c":1,"ct":"கடவுள் வாழ்த்து","ce":"In Praise of God","l1":"இருள்சேர் இருவினையும் சேரா இறைவன்","l2":"பொருள்சேர் புகழ்புரிந்தார் மாட்டு.","mv":"கடவுளின் உண்மைப் புகழை விரும்பி அன்பு செலுத்துகின்றவரிடம் அறியாமையால் விளையும் இருவகை வினையும் சேர்வதில்லை","ex":"The two-fold deeds that spring from darkness shall not adhere to those who delight in the true praise of God","t1":"Irulser Iruvinaiyum Seraa Iraivan","t2":"Porulser Pukazhpurindhaar Maattu"},{"n":6,"c":1,"ct":"கடவுள் வாழ்த்து","ce":"In Praise of God","l1":"பொறிவாயில் ஐந்தவித்தான் பொய்தீர் ஒழுக்க","l2":"நெறிநின்றார் நீடுவாழ் வார்.","mv":"ஐம்பொறி வாயிலாக பிறக்கும் வேட்கைகளை அவித்த இறைவனுடைய பொய்யற்ற ஒழுக்க நெறியில் நின்றவர், நிலை பெற்ற நல்வாழ்க்கை வாழ்வர்","ex":"Those shall long proposer who abide in the faultless way of Him who has destroyed the five desires of the senses","t1":"Porivaayil Aindhaviththaan Poidheer Ozhukka","t2":"Nerinindraar Neetuvaazh Vaar"},{"n":7,"c":1,"ct":"கடவுள் வாழ்த்து","ce":"In Praise of God","l1":"தனக்குவமை இல்லாதான் தாள்சேர்ந்தார்க் கல்லால்","l2":"மனக்கவலை மாற்றல் அரிது.","mv":"தனக்கு ஒப்புமை இல்லாத தலைவனுடைய திருவடிகளைப் பொருந்தி நினைக்கின்றவர் அல்லாமல், மற்றவர்க்கு மனக்கவலையை மாற்ற முடியாது","ex":"Anxiety of mind cannot be removed, except from those who are united to the feet of Him who is incomparable","t1":"Thanakkuvamai Illaadhaan Thaalserndhaark Kallaal","t2":"Manakkavalai Maatral Aridhu"},{"n":8,"c":1,"ct":"கடவுள் வாழ்த்து","ce":"In Praise of God","l1":"அறவாழி அந்தணன் தாள்சேர்ந்தார்க் கல்லால்","l2":"பிறவாழி நீந்தல் அரிது.","mv":"அறக்கடலாக விளங்கும் கடவுளின் திருவடிகளைப் பொருந்தி நினைக்கின்றவர் அல்லாமல், மற்றவர் பொருளும் இன்பமுமாகிய மற்ற கடல்களைக் கடக்க முடியாது","ex":"None can swim the sea of vice, but those who are united to the feet of that gracious Being who is a sea of virtue","t1":"Aravaazhi Andhanan Thaalserndhaark Kallaal","t2":"Piravaazhi Neendhal Aridhu"},{"n":9,"c":1,"ct":"கடவுள் வாழ்த்து","ce":"In Praise of God","l1":"கோளில் பொறியின் குணமிலவே எண்குணத்தான்","l2":"தாளை வணங்காத் தலை.","mv":"கேட்காதசெவி, பார்க்காத கண் போன்ற எண் குணங்களை உடைய கடவுளின் திருவடிகளை வணங்காதவரின் தலைகள் பயனற்றவைகளாம்","ex":"The head that worships not the feet of Him who is possessed of eight attributes, is as useless as a sense without the power of sensation","t1":"Kolil Poriyin Kunamilave Enkunaththaan","t2":"Thaalai Vanangaath Thalai"},{"n":10,"c":1,"ct":"கடவுள் வாழ்த்து","ce":"In Praise of God","l1":"பிறவிப் பெருங்கடல் நீந்துவர் நீந்தார்","l2":"இறைவன் அடிசேரா தார்.","mv":"இறைவனுடைய திருவடிகளை பொருந்தி நினைக்கின்றவர் பிறவியாகிய பெரிய கடலைக் கடக்க முடியும். மற்றவர் கடக்க முடியாது","ex":"None can swim the great sea of births but those who are united to the feet of God","t1":"Piravip Perungatal Neendhuvar Neendhaar","t2":"Iraivan Atiseraa Thaar"},{"n":11,"c":2,"ct":"வான்சிறப்பு","ce":"In Praise of Rain","l1":"வான்நின்று உலகம் வழங்கி வருதலால்","l2":"தான்அமிழ்தம் என்றுணரற் பாற்று.","mv":"மழை பெய்ய உலகம் வாழ்ந்து வருவதால், மழையானது உலகத்து வாழும் உயிர்களுக்கு அமிழ்தம் என்று உணரத்தக்கதாகும்","ex":"By the continuance of rain the world is preserved in existence; it is therefore worthy to be called ambrosia","t1":"Vaannindru Ulakam Vazhangi Varudhalaal","t2":"Thaanamizhdham Endrunarar Paatru"},{"n":12,"c":2,"ct":"வான்சிறப்பு","ce":"In Praise of Rain","l1":"துப்பார்க்குத் துப்பாய துப்பாக்கித் துப்பார்க்குத்","l2":"துப்பாய தூஉம் மழை.","mv":"உண்பவர்க்குத் தக்க உணவுப் பொருள்களை விளைவித்துத் தருவதோடு, பருகுவோர்க்குத் தானும் ஓர் உணவாக இருப்பது மழையாகும்","ex":"Rain produces good food, and is itself food","t1":"Thuppaarkkuth Thuppaaya Thuppaakkith Thuppaarkkuth","t2":"Thuppaaya Thooum Mazhai"},{"n":13,"c":2,"ct":"வான்சிறப்பு","ce":"In Praise of Rain","l1":"விண்இன்று பொய்ப்பின் விரிநீர் வியனுலகத்து","l2":"உள்நின்று உடற்றும் பசி.","mv":"மழை பெய்யாமல் பொய்படுமானால், கடல் சூழ்ந்த அகன்ற உலகமாக இருந்தும் பசி உள்ளே நிலைத்து நின்று உயிர்களை வருத்தும்","ex":"If the cloud, withholding rain, deceive (our hopes) hunger will long distress the sea-girt spacious world","t1":"Vinindru Poippin Virineer Viyanulakaththu","t2":"Ulnindru Utatrum Pasi"},{"n":14,"c":2,"ct":"வான்சிறப்பு","ce":"In Praise of Rain","l1":"ஏரின் உழாஅர் உழவர் புயல்என்னும்","l2":"வாரி வளங்குன்றிக் கால்.","mv":"மழை என்னும் வருவாய் வளம் குன்றி விட்டால், ( உணவுப் பொருள்களை உண்டாக்கும்) உழவரும் ஏர் கொண்டு உழமாட்டார்","ex":"If the abundance of wealth imparting rain diminish, the labour of the plough must cease","t1":"Erin Uzhaaar Uzhavar Puyalennum","t2":"Vaari Valangundrik Kaal"},{"n":15,"c":2,"ct":"வான்சிறப்பு","ce":"In Praise of Rain","l1":"கெடுப்பதூஉம் கெட்டார்க்குச் சார்வாய்மற் றாங்கே","l2":"எடுப்பதூஉம் எல்லாம் மழை.","mv":"பெய்யாமல் வாழ்வைக் கெடுக்க வல்லதும் மழை; மழையில்லாமல் வளம் கெட்டு நொந்தவர்க்கும் துணையாய் அவ்வாறே காக்க வல்லதும் மழையாகும்","ex":"Rain by its absence ruins men; and by its existence restores them to fortune","t1":"Ketuppadhooum Kettaarkkuch Chaarvaaimar Raange","t2":"Etuppadhooum Ellaam Mazhai"},{"n":16,"c":2,"ct":"வான்சிறப்பு","ce":"In Praise of Rain","l1":"விசும்பின் துளிவீழின் அல்லால்மற் றாங்கே","l2":"பசும்புல் தலைகாண்பு அரிது.","mv":"வானத்திலிருந்து மழைத்துளி வீழ்ந்தால் அல்லாமல், உலகத்தில் ஓரறிவுயிராகிய பசும்புல்லின் தலையையும் காண முடியாது","ex":"If no drop falls from the clouds, not even the green blade of grass will be seen","t1":"Visumpin Thuliveezhin Allaalmar Raange","t2":"Pasumpul Thalaikaanpu Aridhu"},{"n":17,"c":2,"ct":"வான்சிறப்பு","ce":"In Praise of Rain","l1":"நெடுங்கடலும் தன்நீர்மை குன்றும் தடிந்தெழிலி","l2":"தான்நல்கா தாகி விடின்.","mv":"மேகம் கடலிலிருந்து நீரைக் கொண்டு அதனிடத்திலேயே பெய்யாமல் விடுமானால், பெரிய கடலும் தன் வளம் குன்றிப் போகும்","ex":"Even the wealth of the wide sea will be diminished, if the cloud that has drawn (its waters) up gives them not back again (in rain)","t1":"Netungatalum Thanneermai Kundrum Thatindhezhili","t2":"Thaannalkaa Thaaki Vitin"},{"n":18,"c":2,"ct":"வான்சிறப்பு","ce":"In Praise of Rain","l1":"சிறப்பொடு பூசனை செல்லாது வானம்","l2":"வறக்குமேல் வானோர்க்கும் ஈண்டு.","mv":"மழை பெய்யாமல் போகுமானால் இவ்வுலகத்தில் வானோர்க்காக நடைபெறும் திருவிழாவும் நடைபெறாது; நாள் வழிபாடும் நடைபெறாது","ex":"If the heaven dry up, neither yearly festivals, nor daily worship will be offered in this world, to the celestials","t1":"Sirappotu Poosanai Sellaadhu Vaanam","t2":"Varakkumel Vaanorkkum Eentu"},{"n":19,"c":2,"ct":"வான்சிறப்பு","ce":"In Praise of Rain","l1":"தானம் தவம்இரண்டும் தங்கா வியன்உலகம்","l2":"வானம் வழங்கா தெனின்.","mv":"மழை பெய்யவில்லையானால், இந்த பெரிய உலகத்தில் பிறர் பொருட்டு செய்யும் தானமும், தம் பொருட்டு செய்யும் தவமும் இல்லையாகும்.","ex":"If rain fall not, penance and alms-deeds will not dwell within this spacious world","t1":"Thaanam Thavamirantum Thangaa Viyanulakam","t2":"Vaanam Vazhangaa Thenin"},{"n":20,"c":2,"ct":"வான்சிறப்பு","ce":"In Praise of Rain","l1":"நீர்இன்று அமையாது உலகெனின் யார்யார்க்கும்","l2":"வான்இன்று அமையாது ஒழுக்கு.","mv":"எப்படிப்பட்டவர்க்கும் நீர் இல்லாமல் உலக வாழ்க்கை நடைபெறாது என்றால், மழை இல்லையானால் ஒழுக்கமும் நிலைபெறாமல் போகும்","ex":"If it be said that the duties of life cannot be discharged by any person without water, so without rain there cannot be the flowing of water","t1":"Neerindru Amaiyaadhu Ulakenin Yaaryaarkkum","t2":"Vaanindru Amaiyaadhu Ozhukku"},{"n":21,"c":3,"ct":"நீத்தார் பெருமை","ce":"On the Greatness of Renunciation","l1":"ஒழுக்கத்து நீத்தார் பெருமை விழுப்பத்து","l2":"வேண்டும் பனுவல் துணிவு.","mv":"ஒழுக்கத்தில் நிலைத்து நின்று பற்று விட்டவர்களின் பெருமையைச் சிறந்ததாக போற்றி கூறுவதே நூல்களின் துணிவாகும்.","ex":"The end and aim of all treatise is to extol beyond all other excellence, the greatness of those who, while abiding in the rule of conduct peculiar to their state, have abandoned all desire","t1":"Ozhukkaththu Neeththaar Perumai Vizhuppaththu","t2":"Ventum Panuval Thunivu"},{"n":22,"c":3,"ct":"நீத்தார் பெருமை","ce":"On the Greatness of Renunciation","l1":"துறந்தார் பெருமை துணைக்கூறின் வையத்து","l2":"இறந்தாரை எண்ணிக்கொண் டற்று.","mv":"பற்றுக்களைத் துறந்தவர்களின் பெருமையை அளந்து கூறுதல், உலகத்தில் இதுவரை பிறந்து இறந்தவர்களை கணக்கிடுவதைப்போன்றது.","ex":"To describe the measure of the greatness of those who have forsaken the two-fold desires, is like counting the dead","t1":"Thurandhaar Perumai Thunaikkoorin Vaiyaththu","t2":"Irandhaarai Ennikkon Tatru"},{"n":23,"c":3,"ct":"நீத்தார் பெருமை","ce":"On the Greatness of Renunciation","l1":"இருமை வகைதெரிந்து ஈண்டுஅறம் பூண்டார்","l2":"பெருமை பிறங்கிற்று உலகு.","mv":"பிறப்பு வீடு என்பன போல் இரண்டிரண்டாக உள்ளவைகளின் கூறுபாடுகளை ஆராய்ந்தறிந்து அறத்தை மேற்கொண்டவரின் பெருமையே உலகத்தில் உயர்ந்தது","ex":"The greatness of those who have discovered the properties of both states of being, and renounced the world, shines forth on earth (beyond all others)","t1":"Irumai Vakaidherindhu Eentuaram Poontaar","t2":"Perumai Pirangitru Ulaku"},{"n":24,"c":3,"ct":"நீத்தார் பெருமை","ce":"On the Greatness of Renunciation","l1":"உரனென்னும் தோட்டியான் ஓரைந்தும் காப்பான்","l2":"வரனென்னும் வைப்பிற்கோர் வித்து.","mv":"அறிவு என்னும் கருவியினால் ஐம்பொறிகளாகிய யானைகளை அடக்கி காக்க வல்லவன், மேலான வீட்டிற்கு விதை போன்றவன்","ex":"He who guides his five senses by the hook of wisdom will be a seed in the world of heaven","t1":"Uranennum Thottiyaan Oraindhum Kaappaan","t2":"Varanennum Vaippirkor Viththu"},{"n":25,"c":3,"ct":"நீத்தார் பெருமை","ce":"On the Greatness of Renunciation","l1":"ஐந்தவித்தான் ஆற்றல் அகல்விசும்பு ளார்கோமான்","l2":"இந்திரனே சாலுங் கரி.","mv":"ஐந்து புலன்களாலாகும் ஆசைகளை ஒழித்தவனுடைய வல்லமைக்கு, வானுலகத்தாரின் தலைவனாகிய இந்திரனே போதுமான சான்று ஆவான்","ex":"Indra, the king of the inhabitants of the spacious heaven, is himself, a sufficient proof of the strength of him who has subdued his five senses","t1":"Aindhaviththaan Aatral Akalvisumpu Laarkomaan","t2":"Indhirane Saalung Kari"},{"n":26,"c":3,"ct":"நீத்தார் பெருமை","ce":"On the Greatness of Renunciation","l1":"செயற்கரிய செய்வார் பெரியர் சிறியர்","l2":"செயற்கரிய செய்கலா தார்.","mv":"செய்வதற்கு அருமையான செயல்களை செய்ய வல்லவரே பெரியோர். செய்வதற்கு அரிய செயல்களைச் செய்யமாட்டாதவர் சிறியோர்.","ex":"The great will do those things which is difficult to be done; but the mean cannot do them","t1":"Seyarkariya Seyvaar Periyar Siriyar","t2":"Seyarkariya Seykalaa Thaar"},{"n":27,"c":3,"ct":"நீத்தார் பெருமை","ce":"On the Greatness of Renunciation","l1":"சுவைஒளி ஊறுஓசை நாற்றமென ஐந்தின்","l2":"வகைதெரிவான் கட்டே உலகு.","mv":"சுவை, ஒளி, ஊறு, ஓசை, நாற்றம் என்று சொல்லப்படும் ஐந்தின் வகைகளையும் ஆராய்ந்து அறிய வல்லவனுடைய அறிவில் உள்ளது உலகம்.","ex":"The world is within the knowledge of him who knows the properties of taste, sight, touch, hearing and smell","t1":"Suvaioli Ooruosai Naatramendru Aindhin","t2":"Vakaidherivaan Katte Ulaku"},{"n":28,"c":3,"ct":"நீத்தார் பெருமை","ce":"On the Greatness of Renunciation","l1":"நிறைமொழி மாந்தர் பெருமை நிலத்து","l2":"மறைமொழி காட்டி விடும்.","mv":"பயன் நிறைந்த மொழிகளில் வல்ல சான்றோரின் பெருமையை, உலகத்தில் அழியாமல் விளங்கும் அவர்களுடைய மறைமொழிகளே காட்டிவிடும்.","ex":"The hidden words of the men whose words are full of effect, will shew their greatness to the world","t1":"Niraimozhi Maandhar Perumai Nilaththu","t2":"Maraimozhi Kaatti Vitum"},{"n":29,"c":3,"ct":"நீத்தார் பெருமை","ce":"On the Greatness of Renunciation","l1":"குணமென்னும் குன்றேறி நின்றார் வெகுளி","l2":"கணமேயும் காத்தல் அரிது.","mv":"நல்ல பண்புகளாகிய மலையின்மேல் ஏறி நின்ற பெரியோர், ஒரு கணப்பொழுதே சினம் கொள்வார் ஆயினும் அதிலிருந்து ஒருவரைக் காத்தல் அரிதாகும்.","ex":"The anger of those who have ascended the mountain of goodness, though it continue but for a moment, cannot be resisted","t1":"Kunamennum Kundreri Nindraar Vekuli","t2":"Kanameyum Kaaththal Aridhu"},{"n":30,"c":3,"ct":"நீத்தார் பெருமை","ce":"On the Greatness of Renunciation","l1":"அந்தணர் என்போர் அறவோர்மற் றெவ்வுயிர் க்கும்","l2":"செந்தண்மை பூண்டொழுக லான்.","mv":"எல்லா உயிர்களிடத்திலும் செம்மையான அருளை மேற்கொண்டு ஒழுகுவதால், அறவோரே அந்தணர் எனப்படுவோர் ஆவர்.","ex":"The virtuous are truly called Anthanar; because in their conduct towards all creatures they are clothed in kindness","t1":"Andhanar Enpor Aravormar Revvuyir","t2":"Kkum Sendhanmai Poontozhuka Laan"},{"n":31,"c":4,"ct":"அறன் வலியுறுத்தல்","ce":"On Righteousness","l1":"சிறப்பு ஈனும் செல்வமும் ஈனும் அறத்தினூஉங்கு","l2":"ஆக்கம் எவனோ உயிர்க்கு.","mv":"அறம் சிறப்பையும் அளிக்கும்: செல்வத்தையும் அளிக்கும்: ஆகையால் உயிர்க்கு அத்தகைய அறத்தை விட நன்மையானது வேறு யாது?","ex":"Virtue will confer heaven and wealth; what greater source of happiness can man possess ?","t1":"Sirappu Eenum Selvamum Eenum","t2":"Araththinooungu Aakkam Evano Uyirkku"},{"n":32,"c":4,"ct":"அறன் வலியுறுத்தல்","ce":"On Righteousness","l1":"அறத்தினூஉங்கு ஆக்கமும் இல்லை அதனை","l2":"மறத்தலின் ஊங்கில்லை கேடு.","mv":"ஒரு வருடைய வாழ்கைக்கு அறத்தை விட நன்மையானதும் இல்லை: அறத்தை போற்றாமல் மறப்பதை விடக்கொடியதும் இல்லை.","ex":"There can be no greater source of good than (the practice of) virtue; there can be no greater source of evil than the forgetfulness of it","t1":"Araththinooungu Aakkamum Illai Adhanai","t2":"Maraththalin Oongillai Ketu"},{"n":33,"c":4,"ct":"அறன் வலியுறுத்தல்","ce":"On Righteousness","l1":"ஒல்லும் வகையான் அறவினை ஓவாதே","l2":"செல்லும்வாய் எல்லாஞ் செயல்.","mv":"செய்யக்கூடிய வகையால், எக்காரணத்தாலும் விடாமல் செல்லுமிடமெல்லாம் அறச்செயலைப் போற்றிச் செய்ய வேண்டும்.","ex":"As much as possible, in every way, incessantly practise virtue","t1":"Ollum Vakaiyaan Aravinai Ovaadhe","t2":"Sellumvaai Ellaanj Cheyal"},{"n":34,"c":4,"ct":"அறன் வலியுறுத்தல்","ce":"On Righteousness","l1":"மனத்துக்கண் மாசிலன் ஆதல் அனைத்து அறன்","l2":"ஆகுல நீர பிற.","mv":"ஒருவன் தன்மனதில் குற்றம் இல்லாதவானாக இருக்க வேண்டும். அறம் அவ்வளவே: மனத்தூய்மை இல்லாத மற்றவை ஆரவாரத் தன்மை உடையவை.","ex":"Let him who does virtuous deeds be of spotless mind; to that extent is virtue; all else is vain show","t1":"Manaththukkan Maasilan Aadhal Anaiththu","t2":"Aran Aakula Neera Pira"},{"n":35,"c":4,"ct":"அறன் வலியுறுத்தல்","ce":"On Righteousness","l1":"அழுக்காறு அவாவெகுளி இன்னாச்சொல் நான்கும்","l2":"இழுக்கா இயன்றது அறம்.","mv":"பொறாமை, ஆசை, சினம், கடுஞ்சொல் ஆகிய இந்த நான்கு குற்றங்களுக்கும் இடங்கொடுக்காமல் அவற்றைக் கடித்து ஒழுகுவதே அறமாகும்.","ex":"That conduct is virtue which is free from these four things, viz, malice, desire, anger and bitter speech","t1":"Azhukkaaru Avaavekuli Innaachchol Naankum","t2":"Izhukkaa Iyandradhu Aram"},{"n":36,"c":4,"ct":"அறன் வலியுறுத்தல்","ce":"On Righteousness","l1":"அன்றறிவாம் என்னாது அறஞ்செய்க மற்றது","l2":"பொன்றுங்கால் பொன்றாத் துணை.","mv":"இளைஞராக உள்ளவர், பிற்காலத்தில் பார்த்து கொள்ளலாம் என்று எண்ணாமல் அறம் செய்ய வேண்டும். அதுவே உடல் அழியும் காலத்தில் அழியா துணையாகும்.","ex":"Defer not virtue to another day; receive her now; and at the dying hour she will be your undying friend","t1":"Andrarivaam Ennaadhu Aranjeyka Matradhu","t2":"Pondrungaal Pondraath Thunai"},{"n":37,"c":4,"ct":"அறன் வலியுறுத்தல்","ce":"On Righteousness","l1":"அறத்தாறு இதுவென வேண்டா சிவிகை","l2":"பொறுத்தானோடு ஊர்ந்தான் இடை.","mv":"பல்லக்கை சுமப்பவனும் அதன்மேலிருந்து ஊர்ந்து செல்லுவோனுமாகிய அவர்களிடையே அறத்தின் பயன் இஃது என்று கூறவேண்டா.","ex":"The fruit of virtue need not be described in books; it may be inferred from seeing the bearer of a palanquin and the rider therein","t1":"Araththaaru Ithuvena Ventaa Sivikai","t2":"Poruththaanotu Oorndhaan Itai"},{"n":38,"c":4,"ct":"அறன் வலியுறுத்தல்","ce":"On Righteousness","l1":"வீழ்நாள் படாஅமை நன்றாற்றின் அஃதொருவன்","l2":"வாழ்நாள் வழியடைக்கும் கல்.","mv":"ஒருவன் அறம் செய்ய தவறிய நாள் ஏற்படாதவாறு அறத்தை செய்வானானால் அதுவே அவன் உடலோடு வாழும் நாள் வரும் பிறவி வழியை அடைக்கும் கல்லாகும்.","ex":"If one allows no day to pass without some good being done, his conduct will be a stone to block up the passage to other births","t1":"Veezhnaal Pataaamai Nandraatrin Aqdhoruvan","t2":"Vaazhnaal Vazhiyataikkum Kal"},{"n":39,"c":4,"ct":"அறன் வலியுறுத்தல்","ce":"On Righteousness","l1":"அறத்தான் வருவதே இன்பம் மற் றெல்லாம்","l2":"புறத்த புகழும் இல.","mv":"அறநெறியில் வாழ்வதன் பயனாக வருவதே இன்பமாகும். அறத்தோடு பொருந்தாமல் வருவன எல்லாம் இன்பம் இல்லாதவை: புகழும் இல்லாதவை.","ex":"Only that pleasure which flows from domestic virtue is pleasure; all else is not pleasure, and it is without praise","t1":"Araththaan Varuvadhe Inpam Mar","t2":"Rellaam Puraththa Pukazhum Ila"},{"n":40,"c":4,"ct":"அறன் வலியுறுத்தல்","ce":"On Righteousness","l1":"செயற்பால தோரும் அறனே ஒருவற்கு","l2":"உயற்பால தோரும் பழி.","mv":"ஒருவன் வாழ்நாளில் முயற்சி மேற்கொண்டு செய்யத்தக்கது அறமே. செய்யாமல் காத்து கொள்ளத்தக்கது பழியே.","ex":"That is virtue which each ought to do, and that is vice which each should shun","t1":"Seyarpaala Thorum Arane Oruvarku","t2":"Uyarpaala Thorum Pazhi"},{"n":41,"c":5,"ct":"இல்வாழ்க்கை","ce":"On Family Life","l1":"இல்வாழ்வான் என்பான் இயல்புடைய மூவர்க்கும்","l2":"நல்லாற்றின் நின்ற துணை.","mv":"இல்லறத்தில் வாழ்பவனாகச் சொல்லப்படுகிறவன் அறத்தின் இயல்பை உடைய மூவருக்கும் நல்வழியில் நிலை பெற்ற துணையாவான்.","ex":"He will be called a (true) householder, who is a firm support to the virtuous of the three orders in","t1":"Ilvaazhvaan Enpaan Iyalputaiya Moovarkkum","t2":"Nallaatrin Nindra Thunai"},{"n":42,"c":5,"ct":"இல்வாழ்க்கை","ce":"On Family Life","l1":"துறந்தார்க்கும் துவ்வாதவர்க்கும் இறந்தார்க்கும்","l2":"இல்வாழ்வான் என்பான் துணை.","mv":"துறந்தவர்கும் வறியவர்க்கும் தன்னிடத்தே இறந்தவர்க்கும் இல்லறம் மேற்கொண்டு வாழ்கிறவன் துணையாவான்.","ex":"He will be said to flourish in domestic virtue who aids the forsaken, the poor, and the dead","t1":"Thurandhaarkkum Thuvvaa Dhavarkkum Irandhaarkkum","t2":"Ilvaazhvaan Enpaan Thunai"},{"n":43,"c":5,"ct":"இல்வாழ்க்கை","ce":"On Family Life","l1":"தென்புலத்தார் தெய்வம் விருந்தொக்கல் தானென்றாங்கு","l2":"ஐம்புலத்தாறு ஓம்பல் தலை.","mv":"தென்புலத்தார், தெய்வம் விருந்தினர், சுற்றத்தார், தான் என்ற ஐவகையிடத்தும் அறநெறி தவறாமல் போற்றுதல் சிறந்த கடமையாகும்.","ex":"The chief (duty of the householder) is to preserve the five-fold rule (of conduct) towards the manes, the Gods, his guests, his relations and himself","t1":"Thenpulaththaar Theyvam Virundhokkal Thaanendraangu","t2":"Aimpulaththaaru Ompal Thalai"},{"n":44,"c":5,"ct":"இல்வாழ்க்கை","ce":"On Family Life","l1":"பழியஞ்சிப் பாத்தூண் உடைத்தாயின் வாழ்க்கை","l2":"வழியெஞ்சல் எஞ்ஞான்றும் இல்.","mv":"பொருள் சேர்க்கும் பொது பழிக்கு அஞ்சிச் சேர்த்து, செலவு செய்யும் போது பகுந்து உண்பதை மேற்க்கொண்டால், அவ்வாழ்கையின் ஒழுங்கு எப்போதும் குறைவதில்லை.","ex":"His descendants shall never fail who, living in the domestic state, fears vice (in the acquisition of property) and shares his food (with others)","t1":"Pazhiyanjip Paaththoon Utaiththaayin Vaazhkkai","t2":"Vazhiyenjal Egngnaandrum Il"},{"n":45,"c":5,"ct":"இல்வாழ்க்கை","ce":"On Family Life","l1":"அன்பும் அறனும் உடைத்தாயின் இல்வாழ்க்கை","l2":"பண்பும் பயனும் அது.","mv":"இல்வாழ்க்கையின் அன்பும் அறமும் உடையதாக விளங்குமானால், அந்த வாழக்கையின் பண்பும் பயனும் அதுவே ஆகும்.","ex":"If the married life possess love and virtue, these will be both its duty and reward","t1":"Anpum Aranum Utaiththaayin Ilvaazhkkai","t2":"Panpum Payanum Adhu"},{"n":46,"c":5,"ct":"இல்வாழ்க்கை","ce":"On Family Life","l1":"அறத்தாற்றின் இல்வாழ்க்கை ஆற்றின் புறத்தாற்றில்","l2":"போஒய்ப் பெறுவ தெவன்?","mv":"ஒருவன் அறநெறியில் இல்வாழ்க்கையைச் செலுத்தி வாழ்வானானால், அத்தகையவன் வேறு நெறியில் சென்று பெறத்தக்கது என்ன?","ex":"What will he who lives virtuously in the domestic state gain by going into the other, (ascetic) state ?","t1":"Araththaatrin Ilvaazhkkai Aatrin Puraththaatril","t2":"Pooip Peruva Thevan?"},{"n":47,"c":5,"ct":"இல்வாழ்க்கை","ce":"On Family Life","l1":"இயல்பினான் இல்வாழ்க்கை வாழ்பவன் என்பான்","l2":"முயல்வாருள் எல்லாம் தலை.","mv":"அறத்தின் இயல்பொடு இல்வாழ்கை வாழ்கிறவன்- வாழ முயல்கிறவன் பல திறத்தாரிலும் மேம்பட்டு விளங்குகிறவன் ஆவான்.","ex":"Among all those who labour (for future happiness) he is greatest who lives well in the household state","t1":"Iyalpinaan Ilvaazhkkai Vaazhpavan Enpaan","t2":"Muyalvaarul Ellaam Thalai"},{"n":48,"c":5,"ct":"இல்வாழ்க்கை","ce":"On Family Life","l1":"ஆற்றின் ஒழுக்கி அறனிழுக்கா இல்வாழ் க்கை","l2":"நோற்பாரின் நோன்மை உடைத்து.","mv":"மற்றவரை அறநெறியில் ஒழுகச்செய்து தானும்அறம் தவறாத இல்வாழ்க்கை , தவம் செய்வாரைவிட மிகச்சிறந்த வல்லமை உடைய வாழ்க்கையாகும்.","ex":"The householder who, not swerving from virtue, helps the ascetic in his way, endures more than those who endure penance","t1":"Aatrin Ozhukki Aranizhukkaa Ilvaazhkkai","t2":"Norpaarin Nonmai Utaiththu"},{"n":49,"c":5,"ct":"இல்வாழ்க்கை","ce":"On Family Life","l1":"அறன் எனப் பட்டதே இல்வாழ்க்கை அஃதும்","l2":"பிறன்பழிப்ப தில்லாயின் நன்று.","mv":"அறம் என்று சிறப்பித்து சொல்லப்பட்டது இல்வாழ்க்கையே ஆகும். அதுவும் மற்றவன் பழிக்கும் குற்றம் இல்லாமல் விளங்கினால் மேலும் நன்மையாகும்.","ex":"The marriage state is truly called virtue The other state is also good, if others do not reproach it","t1":"Aran Enap Pattadhe Ilvaazhkkai","t2":"Aqdhum Piranpazhippa Thillaayin Nandru"},{"n":50,"c":5,"ct":"இல்வாழ்க்கை","ce":"On Family Life","l1":"வையத்துள் வாழ்வாங்கு வாழ்பவன் வான்உநற்யும்","l2":"தெய்வத்துள் வைக்கப் படும்.","mv":"உலகத்தில் வாழவேண்டிய அறநெறியில் நின்று வாழ்கிறவன், வானுலகத்தில் உள்ள தெய்வ முறையில் வைத்து மதிக்கப்படுவான்.","ex":"He who on earth has lived in the conjugal state as he should live, will be placed among the Gods who dwell in heaven","t1":"Vaiyaththul Vaazhvaangu Vaazhpavan Vaanu�ryum","t2":"Theyvaththul Vaikkap Patum"},{"n":51,"c":6,"ct":"வாழ்க்கைத் துணைநலம்","ce":"On Wives","l1":"மனைக்தக்க மாண்புடையள் ஆகித்தற் கொண்டான்","l2":"வளத்தக்காள் வாழ்க்கைத் துணை.","mv":"இல்வாழ்க்கைக்கு ஏற்ற நற்பண்பு உடையவளாகித் தன்கணவனுடைய பொருள் வளத்துக்குத் தக்க வாழ்க்கை நடத்துகிறவளே வாழ்க்கைத்துணை ஆவாள்.","ex":"She who has the excellence of home virtues, and can expend within the means of her husband, is a help in the domestic state","t1":"Manaikdhakka Maanputaiyal Aakiththar Kontaan","t2":"Valaththakkaal Vaazhkkaith Thunai"},{"n":52,"c":6,"ct":"வாழ்க்கைத் துணைநலம்","ce":"On Wives","l1":"மனைமாட்சி இல்லாள்கண் இல்லாயின் வாழ்க்கை","l2":"எனைமாட்சித் தாயினும் இல்.","mv":"இல்வாழ்க்கைக்கு தக்க நற்பண்பு மனைவியிடம் இல்லையானால், ஒருவனுடைய வாழ்க்கை வேறு எவ்வளவு சிறப்புடையதானாலும் பயன் இல்லை.","ex":"If the wife be devoid of domestic excellence, whatever (other) greatness be possessed, the conjugal state, is nothing","t1":"Manaimaatchi Illaalkan Illaayin Vaazhkkai","t2":"Enaimaatchith Thaayinum Il"},{"n":53,"c":6,"ct":"வாழ்க்கைத் துணைநலம்","ce":"On Wives","l1":"இல்லதென் இல்லவள் மாண்பானால் உள்ளதென்","l2":"இல்லவள் மாணாக் கடை?","mv":"மனைவி நற்பண்பு உடையவளானால் வாழ்க்கையில் இல்லாதது என்ன? அவள் நற்பண்பு இல்லாதவளானால் வாழ்க்கையில் இருப்பது என்ன?","ex":"If his wife be eminent (in virtue), what does (that man) not possess ? If she be without excellence, what does (he) possess ?","t1":"Illadhen Illaval Maanpaanaal Ulladhen","t2":"Illaval Maanaak Katai?"},{"n":54,"c":6,"ct":"வாழ்க்கைத் துணைநலம்","ce":"On Wives","l1":"பெண்ணின் பெருந்தக்க யாவுள கற்பென்னும்","l2":"திண்மைஉண் டாகப் பெறின்.","mv":"இல்வாழ்க்கையில் கற்பு என்னும் உறுதிநிலை இருக்கப் பெற்றால், பெண்ணைவிட பெருமையுடையவை வேறு என்ன இருக்கின்றன?","ex":"What is more excellent than a wife, if she possess the stability of chastity ?","t1":"Pennin Perundhakka Yaavula Karpennum","t2":"Thinmaiun Taakap Perin"},{"n":55,"c":6,"ct":"வாழ்க்கைத் துணைநலம்","ce":"On Wives","l1":"தெய்வம் தொழாஅள் கொழுநன் தொழுதெழுவாள்","l2":"பெய்யெனப் பெய்யும் மழை.","mv":"வேறு தெய்வம் தொழாதவளாய்த் தன் கணவனையே தெய்வமாகக் கொண்டு தொழுது துயிலெழுகின்றவள் பெய் என்றால் மழை பெய்யும்.","ex":"If she, who does not worship God, but who rising worships her husband, say, \"let it rain,\" it will rain","t1":"Theyvam Thozhaaal Kozhunan Thozhudhezhuvaal","t2":"Peyyenap Peyyum Mazhai"},{"n":56,"c":6,"ct":"வாழ்க்கைத் துணைநலம்","ce":"On Wives","l1":"தற்காத்துத் தற்கொண்டாற் பேணித் தகைசான்ற","l2":"சொற்காத்துச் சோர்விலாள் பெண்.","mv":"கற்பு நெறியில் தன்னையும் காத்துக்கொண்டு, தன்கணவனையும் காப்பாற்றி, தகுதியமைந்த புகழையும் காத்து உறுதி தளராமல் வாழ்கின்றவளே பெண்.","ex":"She is a wife who unweariedly guards herself, takes care of her husband, and preserves an unsullied fame","t1":"Tharkaaththuth Tharkontaar Penith Thakaisaandra","t2":"Sorkaaththuch Chorvilaal Pen"},{"n":57,"c":6,"ct":"வாழ்க்கைத் துணைநலம்","ce":"On Wives","l1":"சிறைகாக்கும் காப்பெவன் செய்யும் மகளிர்","l2":"நிறைகாக்கும் காப்பே தலை.","mv":"மகளிரைக் காவல் வைத்துக் காக்கும் காப்பு முறை என்ன பயனை உண்டாக்கும்? அவர்கள் நிறை என்னும் பண்பால் தம்மைத் தான் காக்கும் கற்பே சிறிந்தது.","ex":"What avails the guard of a prison ? The chief guard of a woman is her chastity","t1":"Siraikaakkum Kaappevan Seyyum Makalir","t2":"Niraikaakkum Kaappe Thalai"},{"n":58,"c":6,"ct":"வாழ்க்கைத் துணைநலம்","ce":"On Wives","l1":"பெற்றாற் பெறின்பெறுவர் பெண்டிர் பெருஞ்சிறப்புப்","l2":"புத்தேளிர் வாழும் உலகு.","mv":"கணவனைப் போற்றிக் கடமையைச் செய்யப்பெற்றால் மகளிர் பெரிய சிறப்பை உடைய மேலுலகவாழ்வைப் பெறுவர்.","ex":"If women shew reverence to their husbands, they will obtain great excellence in the world where the gods flourish","t1":"Petraar Perinperuvar Pentir Perunjirappup","t2":"Puththelir Vaazhum Ulaku"},{"n":59,"c":6,"ct":"வாழ்க்கைத் துணைநலம்","ce":"On Wives","l1":"புகழ்புரிந்த இல்லிலோர்க்கு இல்லை இகழ்வார்முன்","l2":"ஏறுபோல் பீடு நடை.","mv":"புகழைக் காக்க விரும்பும் மனைவி இல்லாதவர்க்கு, இகழ்ந்து பேசும் பகைவர் முன் காளை போல் நடக்கும் பெருமித நடை இல்லை.","ex":"The man whose wife seeks not the praise (of chastity) cannot walk with lion-like stately step, before those who revile them","t1":"Pukazhpurindha Illilorkku Illai Ikazhvaarmun","t2":"Erupol Peetu Natai"},{"n":60,"c":6,"ct":"வாழ்க்கைத் துணைநலம்","ce":"On Wives","l1":"மங்கலம் என்ப மனைமாட்சி மற்று அதன்","l2":"நன்கலம் நன்மக்கட் பேறு.","mv":"மனைவியின் நற்பண்பே இல்வாழ்க்கைக்கு மங்கலம் என்று கூறுவர்: நல்ல மக்களைப் பெறுதலே அதற்கு நல்லணிகலம் என்று கூறுவர்.","ex":"The excellence of a wife is the good of her husband; and good children are the jewels of that goodness","t1":"Mangalam Enpa Manaimaatchi Matru","t2":"Adhan Nankalam Nanmakkat Peru"},{"n":61,"c":7,"ct":"புதல்வரைப் பெறுதல்","ce":"On Sons","l1":"பெறுமவற்றுள் யாமறிவது இல்லை அறிவறிந்த","l2":"மக்கட்பேறு அல்ல பிற.","mv":"பெறத்தகுந்த பேறுகளில் அறிய வேண்டியவைகளை அறியும் நன்மக்களைப் பெறுவதைத் தவிர, மற்றப்பேறுகளை யாம் மதிப்பதில்லை.","ex":"Among all the benefits that may be acquired, we know no greater benefit than the acquisition of intelligent children","t1":"Perumavatrul Yaamarivadhu Illai Arivarindha","t2":"Makkatperu Alla Pira"},{"n":62,"c":7,"ct":"புதல்வரைப் பெறுதல்","ce":"On Sons","l1":"எழுபிறப்பும் தீயவை தீண்டா பழிபிறங்காப்","l2":"பண்புடை மக்கட் பெறின்.","mv":"பழி இல்லாத நல்ல பண்பு உடைய மக்களைப்பெற்றால் ஒருவனுக்கு ஏழு பிறவியிலும் தீவினைப் பயனாகிய துன்பங்கள் சென்று சேரா.","ex":"The evils of the seven births shall not touch those who abtain children of a good disposition, free from vice","t1":"Ezhupirappum Theeyavai Theentaa Pazhipirangaap","t2":"Panputai Makkat Perin"},{"n":63,"c":7,"ct":"புதல்வரைப் பெறுதல்","ce":"On Sons","l1":"தம்பொருள் என்பதம் மக்கள் அவர்பொருள்","l2":"தம்தம் வினையான் வரும்.","mv":"தம்மக்களே தம்முடைய பொருள்கள் என்று அறிஞர் கூறுவர். மக்களாகிய அவர்தம் பொருள்கள் அவரவருடைய வினையின் பயனால் வந்து சேரும்.","ex":"Men will call their sons their wealth, because it flows to them through the deeds which they (sons) perform on their behalf","t1":"Thamporul Enpadham Makkal Avarporul","t2":"Thamdham Vinaiyaan Varum"},{"n":64,"c":7,"ct":"புதல்வரைப் பெறுதல்","ce":"On Sons","l1":"அமிழ்தினும் ஆற்ற இனிதேதம் மக்கள்","l2":"சிறுகை அளாவிய கூழ்.","mv":"தம்முடைய மக்களின் சிறு கைகளால் அளாவப்பெற்ற உணவு, பெற்றோர்க்கு அமிழ்தத்தை விட மிக்க இனிமை உடையதாகும்.","ex":"The rice in which the little hand of their children has dabbled will be far sweeter (to the parent) than ambrosia","t1":"Amizhdhinum Aatra Inidhedham Makkal","t2":"Sirukai Alaaviya Koozh"},{"n":65,"c":7,"ct":"புதல்வரைப் பெறுதல்","ce":"On Sons","l1":"மக்கள்மெய் தீண்டல் உடற்கின்பம் மற்று அவர்","l2":"சொற்கேட்டல் இன்பம் செவிக்கு.","mv":"மக்களின் உடம்பைத் தொடுதல் உடம்பிற்கு இன்பம் தருவதாகும்: அம் மக்களின் மழலைச் சொற்களைக் கேட்டால் செவிக்கு இன்பம் தருவதாகும்.","ex":"The touch of children gives pleasure to the body, and the hearing of their words, pleasure to the ear","t1":"Makkalmey Theental Utarkinpam Matru","t2":"Avar Sorkettal Inpam Sevikku"},{"n":66,"c":7,"ct":"புதல்வரைப் பெறுதல்","ce":"On Sons","l1":"குழல் இனிது யாழ்இனிது என்பதம் மக்கள்","l2":"மழலைச்சொல் கேளா தவர்.","mv":"தம் மக்களின் மழலைச் சொல்லைக் கேட்டு அதன் இனிமையை நுகராதவரே குழலின் இசை இனியது யாழின் இசை இனியது என்று கூறுவர்.","ex":"\"The pipe is sweet, the lute is sweet,\" say those who have not heard the prattle of their own children","t1":"Kuzhal Inidhu Yaazhinidhu Enpadham","t2":"Makkal Mazhalaichchol Kelaa Thavar"},{"n":67,"c":7,"ct":"புதல்வரைப் பெறுதல்","ce":"On Sons","l1":"தந்தை மகற்காற்று நன்றி அவையத்து","l2":"முந்தி இருப்பச் செயல்.","mv":"தந்தை தன் மகனுக்குச் செய்யத்தக்க நல்லுதவி, கற்றவர் கூட்டத்தில் தன் மகன் முந்தியிருக்கும்படியாக அவனைக் கல்வியில் மேம்படச் செய்தலாகும்.","ex":"The benefit which a father should confer on his son is to give him precedence in the assembly of the learned","t1":"Thandhai Makarkaatrum Nandri Avaiyaththu","t2":"Mundhi Iruppach Cheyal"},{"n":68,"c":7,"ct":"புதல்வரைப் பெறுதல்","ce":"On Sons","l1":"தம்மின்தம் மக்கள் அறிவுடைமை மாநிலத்து","l2":"மன்னுயிர்க் கெல்லாம் இனிது.","mv":"தம் மக்களின் அறிவுடைமை தமக்கு இன்பம் பயப்பதை விட உலகத்து உயிர்களுக்கேல்லாம் மிகுந்த இன்பம் பயப்பதாகும்.","ex":"That their children should possess knowledge is more pleasing to all men of this great earth than to themselves","t1":"Thammindham Makkal Arivutaimai Maanilaththu","t2":"Mannuyirk Kellaam Inidhu"},{"n":69,"c":7,"ct":"புதல்வரைப் பெறுதல்","ce":"On Sons","l1":"ஈன்ற பொழுதின் பெரிதுவக்கும் தன்மகனைச்","l2":"சான்றோன் எனக்கேட்ட தாய்.","mv":"தன் மகனை நற்பண்பு நிறைந்தவன் என பிறர் சொல்லக் கேள்வியுற்ற தாய், தான் அவனை பெற்றக் காலத்தில் உற்ற மகிழ்ச்சியை விடப் பெரிதும் மகிழ்வாள்.","ex":"The mother who hears her son called \"a wise man\" will rejoice more than she did at his birth","t1":"Eendra Pozhudhin Peridhuvakkum Thanmakanaich","t2":"Chaandron Enakketta Thaai"},{"n":70,"c":7,"ct":"புதல்வரைப் பெறுதல்","ce":"On Sons","l1":"மகன்தந்தைக்கு ஆற்றும் உதவி இவன்தந்தை","l2":"என்நோற்றான் கொல் எனும் சொல்.","mv":"மகன் தன் தந்தைக்குச் செய்யத் தக்க கைம்மாறு, இவன் தந்தை இவனை மகனாகப் பெற என்ன தவம் செய்தானோ என்று பிறர் புகழ்ந்து சொல்லும் சொல்லாகும்.","ex":"(So to act) that it may be said \"by what great penance did his father beget him,\" is the benefit which a son should render to his father","t1":"Makandhandhaikku Aatrum Udhavi Ivandhandhai","t2":"Ennotraan Kol Enum Sol"},{"n":71,"c":8,"ct":"அன்புடைமை","ce":"Loving-Kindness","l1":"அன்பிற்கும் உண்டோ அடைக்குந்தாழ் ஆர்வலர்","l2":"புன்கணீர் பூசல் தரும்.","mv":"அன்புக்கும் அடைத்து வைக்கும் தாழ் உண்டோ? அன்புடையவரின் சிறு கண்ணீரே ( உள்ளே இருக்கும் அன்பைப் ) பலரும் அறிய வெளிப்படுத்திவிடும்","ex":"Is there any fastening that can shut in love ? Tears of the affectionate will publish the love that is within","t1":"Anpirkum Unto Ataikkundhaazh Aarvalar","t2":"Punkaneer Poosal Tharum"},{"n":72,"c":8,"ct":"அன்புடைமை","ce":"Loving-Kindness","l1":"அன்பிலார் எல்லாம் தமக்குரியர் அன்புடையார்","l2":"என்பும் உரியர் பிறர்க்கு.","mv":"அன்பு இல்லாதவர் எல்லாப்பொருள்களையும் தமக்கே உரிமையாகக் கொண்டு வாழ்வார்: அன்பு உடையவர் தம் உடமையும் பிறர்க்கு உரிமையாக்கி வாழ்வர்","ex":"Those who are destitute of love appropriate all they have to themselves; but those who possess love consider even their bones to belong to others","t1":"Anpilaar Ellaam Thamakkuriyar Anputaiyaar","t2":"Enpum Uriyar Pirarkku"},{"n":73,"c":8,"ct":"அன்புடைமை","ce":"Loving-Kindness","l1":"அன்போடு இயைந்த வழக்கென்ப ஆருயிர்க்கு","l2":"என்போடு இயைந்த தொடர்பு.","mv":"அருமையான உயிர்க்கு உடம்போடு பொருந்தி இருக்கின்ற உறவு, அன்போடு பொருந்தி வாழும் வாழ்க்கையின் பயன்என்று கூறுவர்.","ex":"They say that the union of soul and body in man is the fruit of the union of love and virtue (in a former birth)","t1":"Anpotu Iyaindha Vazhakkenpa Aaruyirkku","t2":"Enpotu Iyaindha Thotarpu"},{"n":74,"c":8,"ct":"அன்புடைமை","ce":"Loving-Kindness","l1":"அன்பு ஈனும் ஆர்வம் உடைமை அதுஈனும்","l2":"நண்பு என்னும் நாடாச் சிறப்பு.","mv":"அன்பு பிறரிடம் விருப்பம் உடையவராக வாழும் தன்மையைத் தரும்: அஃது எல்லாரிடத்தும் நட்பு என்றுசொல்லப்படும் அளவற்ற சிறப்பைத் தரும்","ex":"Love begets desire: and that (desire) begets the immeasureable excellence of friendship","t1":"Anpu Eenum Aarvam Utaimai","t2":"Adhueenum Nanpu Ennum Naataach"},{"n":75,"c":8,"ct":"அன்புடைமை","ce":"Loving-Kindness","l1":"அன்புற்று அமர்ந்த வழக்கென்ப வையகத்து","l2":"இன்புற்றார் எய்தும் சிறப்பு.","mv":"உலகத்தில் இன்பம் உற்று வாழ்கின்றவர் அடையும் சிறப்பு, அன்பு உடையவராகிப் பொருந்தி வாழும் வாழ்கையின் பயன் என்று கூறுவர்","ex":"These are the fruits of tranquil life of love","t1":"Anputru Amarndha Vazhakkenpa Vaiyakaththu","t2":"Inputraar Eydhum Sirappu"},{"n":76,"c":8,"ct":"அன்புடைமை","ce":"Loving-Kindness","l1":"அறத்திற்கே அன்புசார் பென்ப அறியார்","l2":"மறத்திற்கும் அஃதே துணை.","mv":"அறியாதவர், அறத்திற்கு மட்டுமே அன்பு துணையாகும் என்று கூறுவர்:ஆராய்ந்து பார்த்தால் வீரத்திற்க்கும் அதுவே துணையாக நிற்கின்றது","ex":"The ignorant say that love is an ally to virtue only, but it is also a help to get out of vice","t1":"Araththirke Anpusaar Penpa Ariyaar","t2":"Maraththirkum Aqdhe Thunai"},{"n":77,"c":8,"ct":"அன்புடைமை","ce":"Loving-Kindness","l1":"என்பி லதனை வெயில்போலக் காயுமே","l2":"அன்பி லதனை அறம்.","mv":"எலும்பு இல்லாத உடம்போடு வாழும் புழுவை வெயில் காய்ந்து வருத்துவது போல் அன்பு இல்லாத உயிரை அறம் வருத்தும்.","ex":"Virtue will burn up the soul which is without love, even as the sun burns up the creature which is without bone, ie worms","t1":"Enpi Ladhanai Veyilpolak Kaayume","t2":"Anpi Ladhanai Aram"},{"n":78,"c":8,"ct":"அன்புடைமை","ce":"Loving-Kindness","l1":"அன்பகத் தில்லா உயிர்வாழ்க்கை வன்பாற்கண்","l2":"வற்றல் மரந்தளிர்த் தற்று.","mv":"அகத்தில் அன்பு இல்லாமல் வாழும் உயிர் வாழக்கை வளமற்ற பாலைநிலத்தில் பட்டமரம் தளிர்த்தாற் போன்றது.","ex":"The domestic state of that man whose mind is without love is like the flourishing of a withered tree upon the parched desert","t1":"Anpakath Thillaa Uyirvaazhkkai Vanpaarkan","t2":"Vatral Marandhalirth Thatru"},{"n":79,"c":8,"ct":"அன்புடைமை","ce":"Loving-Kindness","l1":"புறத்துறுப் பெல்லாம் எவன்செய்பு ம் யாக்கை","l2":"அகத்துறுப்பு அன்பி லவர்க்கு.","mv":"உடம்பின் அகத்து உறுப்பாகிய அன்பு இல்லாதவர்க்கு உடம்பின் புறத்து உறுப்புக்கள் எல்லாம் என்ன பயன் செய்யும்.","ex":"Of what avail are all the external members (of the body) to those who are destitute of love, the internal member","t1":"Puraththurup Pellaam Evanseyyum Yaakkai","t2":"Akaththuruppu Anpi Lavarkku"},{"n":80,"c":8,"ct":"அன்புடைமை","ce":"Loving-Kindness","l1":"அன்பின் வழியது உயிர்நிலை அஃதிலார்க்கு","l2":"என்புதோல் போர்த்த உடம்பு.","mv":"அன்பின் வழியில் இயங்கும் உடம்பே உயிர்நின்ற உடம்பாகும்: அன்பு இல்லாதவர்க்கு உள்ள உடம்பு எலும்பைத் தோல்போர்த்த வெற்றுடம்பே ஆகும்","ex":"That body alone which is inspired with love contains a living soul: if void of it, (the body) is bone overlaid with skin","t1":"Anpin Vazhiyadhu Uyirnilai Aqdhilaarkku","t2":"Enpudhol Porththa Utampu"},{"n":81,"c":9,"ct":"விருந்தோம்பல்","ce":"On Hospitality","l1":"இருந்தோம்பி இல்வாழ்வ தெல்லாம் விருந்தோம்பி","l2":"வேளாண்மை செய்தற் பொருட்டு.","mv":"வீட்டில் இருந்து பொருள்களைக் காத்து இல்வாழ்க்கை நடத்துவதெல்லாம் விருந்தினரைப் போற்றி உதவி செய்யும் பொருட்டே ஆகும்","ex":"The whole design of living in the domestic state and laying up (property) is (to be able) to exercise the benevolence of hospitality","t1":"Irundhompi Ilvaazhva Thellaam Virundhompi","t2":"Velaanmai Seydhar Poruttu"},{"n":82,"c":9,"ct":"விருந்தோம்பல்","ce":"On Hospitality","l1":"விருந்து புறத்ததாத் தானுண்டல் சாவா","l2":"மருந்தெனினும் வேண் டற்பாற் றன்று.","mv":"விருந்தினராக வந்தவர் வீட்டின் புறத்தே இருக்கத் தான் மட்டும் உண்பது சாவாமருந்தாகிய அமிழ்தமே ஆனாலும் அது விரும்பத்தக்கது அன்று","ex":"It is not fit that one should wish his guests to be outside (his house) even though he were eating the food of immortality","t1":"Virundhu Puraththadhaath Thaanuntal Saavaa","t2":"Marundheninum Ventarpaar Randru"},{"n":83,"c":9,"ct":"விருந்தோம்பல்","ce":"On Hospitality","l1":"வருவிருந்து வைகலும் ஓம்புவான் வாழ்க்கை","l2":"பருவந்து பாழ்படுதல் இன்று.","mv":"தன்னை நோக்கி வரும் விருந்தினரை நாள் தோறும் போற்றுகின்றவனுடைய வாழ்க்கை, துன்பத்தால் வருந்திக் கெட்டுப் போவதில்லை.","ex":"The domestic life of the man that daily entertains the guests who come to him shall not be laid waste by poverty","t1":"Varuvirundhu Vaikalum Ompuvaan Vaazhkkai","t2":"Paruvandhu Paazhpatudhal Indru"},{"n":84,"c":9,"ct":"விருந்தோம்பல்","ce":"On Hospitality","l1":"அகனமர்ந்து செய்யாள் உறையும் முகனமர்ந்து","l2":"நல்விருந்து ஓம்புவான் இல்.","mv":"நல்ல விருந்தினராய் வந்தவரை முகமலர்ச்சி கொண்டு போற்றுகின்றவனுடைய வீட்டில் மனமகிழ்ந்து திருமகள் வாழ்வாள்.","ex":"Lakshmi with joyous mind shall dwell in the house of that man who, with cheerful countenance, entertains the good as guests","t1":"Akanamarndhu Seyyaal Uraiyum Mukanamarndhu","t2":"Nalvirundhu Ompuvaan Il"},{"n":85,"c":9,"ct":"விருந்தோம்பல்","ce":"On Hospitality","l1":"வித்தும் இடல்வேண்டும் கொல்லோ விருந்தோம்பி","l2":"மிச்சில் மிசைவான் புலம்.","mv":"விருந்தினரை முன்னே போற்றி உணவளித்து மிஞ்சிய உணவை உண்டு வாழ்கின்றவனுடைய நிலத்தில் விதையும் விதைக்க வேண்டுமோ?","ex":"Is it necessary to sow the field of the man who, having feasted his guests, eats what may remain ?","t1":"Viththum Italventum Kollo Virundhompi","t2":"Michchil Misaivaan Pulam"},{"n":86,"c":9,"ct":"விருந்தோம்பல்","ce":"On Hospitality","l1":"செல்விருந்து ஓம்பி வருவிருந்து பார்த்திருப்பான்","l2":"நல்வருந்து வானத் தவர்க்கு.","mv":"வந்த விருந்தினரைப் போற்றி, இனிவரும் விருந்தினரை எதிர் பார்த்திருப்பவன், வானுலகத்தில் உள்ள தேவர்க்கும் நல்ல விருந்தினனாவான்","ex":"He who, having entertained the guests that have come, looks out for others who may yet come, will be a welcome guest to the inhabitants of heaven","t1":"Selvirundhu Ompi Varuvirundhu Paarththiruppaan","t2":"Nalvarundhu Vaanath Thavarkku"},{"n":87,"c":9,"ct":"விருந்தோம்பல்","ce":"On Hospitality","l1":"இனைத்துணைத் தென்பதொன் றில்லை விருந்தின்","l2":"துணைத்துணை வேள்விப் பயன்.","mv":"விருந்தோம்புதலாகிய வேள்வியின் பயன் இவ்வளவு என்று அளவு படுத்தி கூறத்தக்கது அன்று, விருந்தினரின் தகுதிக்கு ஏற்ற அளவினதாகும்","ex":"The advantages of benevolence cannot be measured; the measure (of the virtue) of the guests (entertained) is the only measure","t1":"Inaiththunaith Thenpadhon Rillai Virundhin","t2":"Thunaiththunai Velvip Payan"},{"n":88,"c":9,"ct":"விருந்தோம்பல்","ce":"On Hospitality","l1":"பரிந்தோம்பிப் பற்றற்றேம் என்பர் விருந்தோம்பி","l2":"வேள்வி தலைப்படா தார்.","mv":"விருந்தினரை ஓம்பி அந்த வேள்வியில் ஈடுபடாதவர் பொருள்களை வருந்திக்காத்துப் (பின்பு இழந்து) பற்றுக்கொடு இழந்தோமே என்று இரங்குவர்","ex":"Those who have taken no part in the benevolence of hospitality shall (at length lament) saying, \"we have laboured and laid up wealth and are now without support.\"","t1":"Parindhompip Patratrem Enpar Virundhompi","t2":"Velvi Thalaippataa Thaar"},{"n":89,"c":9,"ct":"விருந்தோம்பல்","ce":"On Hospitality","l1":"உடைமையுள் இன்மை விருந்தோம்பல் ஓம்பா","l2":"மடமை மடவார்கண் உண்டு.","mv":"செல்வநிலையில் உள்ள வறுமை என்பது விருந்தோம்புதலைப் போற்றாத அறியாமையாகும்: அஃது அறிவிலிகளிடம் உள்ளதாகும்.","ex":"That stupidity which excercises no hospitality is poverty in the midst of wealth It is the property of the stupid","t1":"Utaimaiyul Inmai Virundhompal Ompaa","t2":"Matamai Matavaarkan Untu"},{"n":90,"c":9,"ct":"விருந்தோம்பல்","ce":"On Hospitality","l1":"மோப்பக் குழையும் அனிச்சம் முகந்திரிந்து","l2":"நோக்கக் குநழ்யும் விருந்து.","mv":"அனிச்சப்பூ மோந்தவுடன் வாடிவிடும்: அதுபோல் முகம் மலராமல் வேறு பட்டு நோக்கியவுடன் விருந்தினர் வாடி நிற்பார்.","ex":"As the Anicham flower fades in smelling, so fades the guest when the face is turned away","t1":"Moppak Kuzhaiyum Anichcham Mukandhirindhu","t2":"Nokkak Kuzhaiyum Virundhu"},{"n":91,"c":10,"ct":"இனியவைகூறல்","ce":"On Sweet Words","l1":"இன்சொலால் ஈரம் அளைஇப் படிறுஇலவாம்","l2":"செம்பொருள் கண்டார்வாய்ச் சொல்.","mv":"அன்பு கலந்து வஞ்சம் அற்றவைகளாகிய சொற்கள், மெய்ப்பொருள் கண்டவர்களின் வாய்ச்சொற்கள் இன்சொற்களாகும்.","ex":"Sweet words are those which imbued with love and free from deceit flow from the mouth of the virtuous","t1":"Insolaal Eeram Alaiip Patiruilavaam","t2":"Semporul Kantaarvaaich Chol"},{"n":92,"c":10,"ct":"இனியவைகூறல்","ce":"On Sweet Words","l1":"அகன்அமர்ந்து ஈதலின் நன்றே முகனமர்ந்து","l2":"இன்சொலன் ஆகப் பெறின்.","mv":"முகம் மலர்ந்து இன்சொல் உடையவனாக இருக்கப்பெற்றால், மனம் மகிழ்ந்து பொருள் கொடுக்கும் ஈகையைவிட நல்லதாகும்.","ex":"Sweet speech, with a cheerful countenance is better than a gift made with a joyous mind","t1":"Akanamarndhu Eedhalin Nandre Mukanamarndhu","t2":"Insolan Aakap Perin"},{"n":93,"c":10,"ct":"இனியவைகூறல்","ce":"On Sweet Words","l1":"முகத்தான் அமர்ந் துஇனிது நோக்கி அகத்தானாம்","l2":"இன்சொ லினதே அறம்.","mv":"முகத்தால் விரும்பி- இனிமையுடன் நோக்கி- உள்ளம் கலந்து இன்சொற்களைக் கூறும் தன்மையில் உள்ளதே அறமாகும்.","ex":"Sweet speech, flowing from the heart (uttered) with a cheerful countenance and a sweet look, is true virtue","t1":"Mukaththaan Amarndhuinidhu Nokki Akaththaanaam","t2":"Inso Linadhe Aram"},{"n":94,"c":10,"ct":"இனியவைகூறல்","ce":"On Sweet Words","l1":"துன்புறூஉம் துவ்வாமை இல்லாகும் யார்மாட்டும்","l2":"இன்புறூஉம் இன்சொ லவர்க்கு.","mv":"யாரிடத்திலும் இன்புறத்தக்க இன்சொல் வழங்குவோர்க்குத் துன்பத்தை மிகுதிபடுத்தும் வறுமை என்பது இல்லையாகும்.","ex":"Sorrow-increasing poverty shall not come upon those who use towards all, pleasure-increasing sweetness of speech","t1":"Thunpurooum Thuvvaamai Illaakum Yaarmaattum","t2":"Inpurooum Inso Lavarkku"},{"n":95,"c":10,"ct":"இனியவைகூறல்","ce":"On Sweet Words","l1":"பணிவுடையன் இன்சொலன் ஆதல் ஒருவற்கு","l2":"அணியல்ல மற்றுப் பிற.","mv":"வணக்கம் உடையவனாகவும் இன்சொல் வழங்குவோனாகவும் ஆதலே ஒருவனுக்கு அணிகலனாகும் மற்றவை அணிகள் அல்ல.","ex":"Humility and sweetness of speech are the ornaments of man; all others are not (ornaments)","t1":"Panivutaiyan Insolan Aadhal Oruvarku","t2":"Aniyalla Matrup Pira"},{"n":96,"c":10,"ct":"இனியவைகூறல்","ce":"On Sweet Words","l1":"அல்லவை தேய அறம்பெருகும் நல்லவை","l2":"நாடி இனிய சொலின்","mv":"பிறர்க்கு நன்மையானவற்றை நாடி இனிமை உடையச் சொற்களைச் சொல்லின், பாவங்கள் தேய்ந்து குறைய அறம் வளர்ந்து பெருகும்.","ex":"If a man, while seeking to speak usefully, speaks also sweetly, his sins will diminish and his virtue increase","t1":"Allavai Theya Aramperukum Nallavai","t2":"Naati Iniya Solin"},{"n":97,"c":10,"ct":"இனியவைகூறல்","ce":"On Sweet Words","l1":"நயன் ஈன்று நன்றி பயக்கும் பயன்ஈன்று","l2":"பண்பின் தலைப்பிரியாச் சொல்.","mv":"பிறர்க்கு நன்மையான பயனைத் தந்து நல்ல பண்பிலிருந்து நீங்காத சொற்கள்,வழங்குவோனுக்கும் இன்பம் தந்து நன்மை பயக்கும்.","ex":"That speech which, while imparting benefits ceases not to please, will yield righteousness (for this world) and merit (for the next world)","t1":"Nayan Eendru Nandri Payakkum","t2":"Payaneendru Panpin Thalaippiriyaach Chol"},{"n":98,"c":10,"ct":"இனியவைகூறல்","ce":"On Sweet Words","l1":"சிறுமையுவு நீங்கிய இன்சொல் மறுமையும்","l2":"இம்மையும் இன்பம் தரும்.","mv":"பிறர்க்குத் துன்பம் விளைக்கும் சிறுமையிலிருந்து நீங்கிய இனிய சொற்கள் மறுமைக்கும் இம்மைக்கும் வழங்குவோனுக்கு இன்பம் தரும் .","ex":"Sweet speech, free from harm to others, will give pleasure both in this world and in the next","t1":"Sirumaiyul Neengiya Insol Marumaiyum","t2":"Immaiyum Inpam Tharum"},{"n":99,"c":10,"ct":"இனியவைகூறல்","ce":"On Sweet Words","l1":"இன்சொல் இனிதீன்றல் காண்பான் எவன்கொலோ","l2":"வன்சொல் வழங்கு வது?","mv":"இனிய சொற்கள் இன்பம் பயத்தலைக் காண்கின்றவன், அவற்றிற்கு மாறான வன்சொற்களை வழங்குவது என்ன பயன் கருதியோ?","ex":"Why does he use harsh words, who sees the pleasure which sweet speech yields ?","t1":"Insol Inidheendral Kaanpaan Evankolo","t2":"Vansol Vazhangu Vadhu?"},{"n":100,"c":10,"ct":"இனியவைகூறல்","ce":"On Sweet Words","l1":"இனிய உளவாக இன்னாத கூறல்","l2":"கனிஇருப்பக் காய்கவர்ந் தற்று.","mv":"இனிய சொற்கள் இருக்கும் போது அவற்றை விட்டுக் கடுமையான சொற்களைக் கூறுதல் கனிகள் இருக்கும் போது அவற்றை விட்டு காய்களைப் பறித்துத் தின்பதைப் போன்றது .","ex":"To say disagreeable things when agreeable are at hand is like eating unripe fruit when there is ripe","t1":"Iniya Ulavaaka Innaadha Kooral","t2":"Kaniiruppak Kaaikavarn Thatru"},{"n":101,"c":11,"ct":"செய்ந்நன்றி அறிதல்","ce":"On Gratitude","l1":"செய்யாமல் செய்த உதவிக்கு வையகமும்","l2":"வானகமும் ஆற்றல் அரிது.","mv":"தான் ஓர் உதவியும் முன் செய்யாதிருக்கப் பிறன் தனக்கு செய்த உதவிக்கு மண்ணுலகத்தையும் விண்ணுலகத்தையும் கைமாறாகக் கொடுத்தாலும் ஈடு ஆக முடியாது.","ex":"(The gift of) heaven and earth is not an equivalent for a benefit which is conferred where none had been received","t1":"Seyyaamal Seydha Udhavikku Vaiyakamum","t2":"Vaanakamum Aatral Aridhu"},{"n":102,"c":11,"ct":"செய்ந்நன்றி அறிதல்","ce":"On Gratitude","l1":"காலத்தி னாற்செய்த நன்றி சிறிதெனினும்","l2":"ஞாலத்தின் மாணப் பெரிது.","mv":"உற்ற காலத்தில் ஒருவன் செய்த உதவி சிறிதளவாக இருந்தாலும், அதன் தன்மையை அறிந்தால் உலகைவிட மிகப் பெரிதாகும்.","ex":"A favour conferred in the time of need, though it be small (in itself), is (in value) much larger than the world","t1":"Kaalaththi Naarseydha Nandri Siridheninum","t2":"Gnaalaththin Maanap Peridhu"},{"n":103,"c":11,"ct":"செய்ந்நன்றி அறிதல்","ce":"On Gratitude","l1":"பயன்தூக்கார் செய்த உதவி நயன்தூக்கின்","l2":"நன்மை கடலின் பெரிது.","mv":"இன்ன பயன் கிடைக்கும் என்றுஆராயாமல் ஒருவன் செய்த உதவியின் அன்புடைமையை ஆராய்ந்தால் அதன் நன்மை கடலைவிட பெரியதாகும் .","ex":"If we weigh the excellence of a benefit which is conferred without weighing the return, it is larger than the sea","t1":"Payandhookkaar Seydha Udhavi Nayandhookkin","t2":"Nanmai Katalin Peridhu"},{"n":104,"c":11,"ct":"செய்ந்நன்றி அறிதல்","ce":"On Gratitude","l1":"தினைத்துணை நன்றி செயினும் பனைத்துணையாக்","l2":"கொள்வர் பயன்தெரி வார்.","mv":"ஒருவன் தினையளவாகிய உதவியைச் செய்த போதிலும் அதன் பயனை ஆராய்கின்றவர், அதனையே பனையளவாகக் கொண்டு போற்றுவர்.","ex":"Though the benefit conferred be as small as a millet seed, those who know its advantage will consider it as large as a palmyra fruit","t1":"Thinaiththunai Nandri Seyinum Panaiththunaiyaak","t2":"Kolvar Payandheri Vaar"},{"n":105,"c":11,"ct":"செய்ந்நன்றி அறிதல்","ce":"On Gratitude","l1":"உதவி வரைத்தன்று உதவி உதவி","l2":"செயப்பட்டார் சால்பின் வரைத்து.","mv":"கைமாறாகச் செய்யும் உதவி முன் செய்த உதவியின் அளவை உடையது அன்று, உதவி செய்யப்பட்டவற்றின் பண்புக்கு ஏற்ற அளவை உடையதாகும்.","ex":"The benefit itself is not the measure of the benefit; the worth of those who have received it is its measure","t1":"Udhavi Varaiththandru Udhavi Udhavi","t2":"Seyappattaar Saalpin Varaiththu"},{"n":106,"c":11,"ct":"செய்ந்நன்றி அறிதல்","ce":"On Gratitude","l1":"மறவற்க மாசற்றார் கேண்மை துறவற்க","l2":"துன்பத்துள் துப்பாயார் நட்பு.","mv":"குற்றமற்றவரின் உறவை எப்போதும் மறக்கலாகாது: துன்பம் வந்த காலத்தில் உறுதுணையாய் உதவியவர்களின் நட்பை எப்போதும் விடாலாகாது .","ex":"Forsake not the friendship of those who have been your staff in adversity Forget not be benevolence of the blameless","t1":"Maravarka Maasatraar Kenmai Thuravarka","t2":"Thunpaththul Thuppaayaar Natpu"},{"n":107,"c":11,"ct":"செய்ந்நன்றி அறிதல்","ce":"On Gratitude","l1":"எழுமை எழுபிறப்பும் உள்ளுவர் தங்கண்","l2":"விழுமந் துடைத்தவர் நட்பு.","mv":"தம்முடைய துன்பத்தைப் போக்கி உதவியவரின் நட்பைப் பல்வேறு வகையான பிறவியிலும் மறவாமல் போற்றுவர் பெரியோர்.","ex":"(The wise) will remember throughout their seven-fold births the love of those who have wiped away their affliction","t1":"Ezhumai Ezhupirappum Ulluvar Thangan","t2":"Vizhuman Thutaiththavar Natpu"},{"n":108,"c":11,"ct":"செய்ந்நன்றி அறிதல்","ce":"On Gratitude","l1":"நன்றி மறப்பது நன்றன்று நன்றல்லது","l2":"அன்றே மறப்பது நன்று.","mv":"ஒருவரர்முன்செய்த நன்மையை மறப்பது அறம் அன்று; அவர் செய்த தீமையைச் செய்த அப்‌பொழுதே மறந்து விடுவது அறம்.","ex":"It is not good to forget a benefit; it is good to forget an injury even in the very moment (in which it is inflicted)","t1":"Nandri Marappadhu Nandrandru Nandralladhu","t2":"Andre Marappadhu Nandru"},{"n":109,"c":11,"ct":"செய்ந்நன்றி அறிதல்","ce":"On Gratitude","l1":"கொன்றன்ன இன்னா செயினும் அவர்செய்த","l2":"ஒன்றுநன்று உள்ளக் கெடும்.","mv":"முன் உதவி செய்தவர் பின்பு ‌கொன்றார் போன்ற துன்பத்தைச் செய்தாரானாலும், அவர் முன் செய்த ஒரு நன்மையை நினைத்தாலும் அந்தத் துன்பம் கெடும்.","ex":"Though one inflict an injury great as murder, it will perish before the thought of one benefit (formerly) conferred","t1":"Kondranna Innaa Seyinum Avarseydha","t2":"Ondrunandru Ullak Ketum"},{"n":110,"c":11,"ct":"செய்ந்நன்றி அறிதல்","ce":"On Gratitude","l1":"எந்நன்றி கொன்றார்க்கும் உய்வுண்டாம் உய்வில்லை","l2":"செய்ந்நன்றி கொன்ற மகற்கு.","mv":"எந்த அறத்தை அழித்தவர்க்கும் தப்பிப் பிழைக்க வழி உண்டாகும்; ஒருவர் செய்த உதவியை மறந்து அழித்தவனுக்கு உய்வு இல்லை.","ex":"He who has killed every virtue may yet escape; there is no escape for him who has killed a benefit","t1":"Ennandri Kondraarkkum Uyvuntaam Uyvillai","t2":"Seynnandri Kondra Makarku"},{"n":111,"c":12,"ct":"நடுவு நிலைமை","ce":"On Equity","l1":"தகுதி எனவொன்று நன்றே பகுதியால்","l2":"பாற்பட்டு ஒழுகப் பெறின்.","mv":"அந்தந்தப் பகுதிதோறும் முறையோடு பொருந்தி ஒழுகப்பெற்றால், நடுவுநிலைமை என்று கூறப்படும் அறம் நன்மையாகும்.","ex":"That equity which consists in acting with equal regard to each of (the three) divisions of men [enemies, strangers and friends] is a pre-eminent virtue","t1":"Thakudhi Enavondru Nandre Pakudhiyaal","t2":"Paarpattu Ozhukap Perin"},{"n":112,"c":12,"ct":"நடுவு நிலைமை","ce":"On Equity","l1":"செப்பம் உடையவன் ஆக்கஞ் சிதைவின்றி","l2":"எச்சத்திற் கேமாப்பு உடைத்து.","mv":"நடுவுநிலைமை உடையவனின் செல்வவளம் அழிவில்லாமல் அவனுடைய வழியில் உள்ளார்க்கும் உறுதியான நன்மை தருவதாகும்.","ex":"The wealth of the man of rectitude will not perish, but will bring happiness also to his posterity","t1":"Seppam Utaiyavan Aakkanj Chidhaivindri","t2":"Echchaththir Kemaappu Utaiththu"},{"n":113,"c":12,"ct":"நடுவு நிலைமை","ce":"On Equity","l1":"நன்றே தரினும் நடுவிகந்தாம் ஆக்கத்தை","l2":"அன்றே யொழிய விடல்.","mv":"தீமை பயக்காமல் நன்மையே தருவதானாலும் நடுவு நி‌லைமை தவறி உண்டாகும் ஆக்கத்தை அப்போதே கைவிட வேண்டும்.","ex":"Forsake in the very moment (of acquisition) that gain which, though it should bring advantage, is without equity","t1":"Nandre Tharinum Natuvikandhaam Aakkaththai","t2":"Andre Yozhiya Vital"},{"n":114,"c":12,"ct":"நடுவு நிலைமை","ce":"On Equity","l1":"தக்கார் தகவிலர் என்பது அவரவர்","l2":"எச்சத்தாற் காணப்ப படும்.","mv":"நடுவுநிலைமை உடையவர் நடுவுநிலை‌மை இல்லாதவர் என்பது அவரவர்க்குப் பின் எஞ்சி நிற்கும் புகழாலும் பழியாலும் காணப்படும்.","ex":"The worthy and unworthy may be known by the existence or otherwise of good offsprings","t1":"Thakkaar Thakavilar Enpadhu Avaravar","t2":"Echchaththaar Kaanap Patum"},{"n":115,"c":12,"ct":"நடுவு நிலைமை","ce":"On Equity","l1":"கேடும் பெருக்கமும் இல்லல்ல நெஞ்சத்துக்","l2":"கோடாமை சான்றோர்க் கணி.","mv":"கேடும் ஆக்கமும் வாழ்வில் இல்லாதவை அல்ல; ஆகையால் நெஞ்சில் நடுவுநிலைமை தவறாமல் இருத்தலே சான்றோர்க்கு அழகாகும்.","ex":"Loss and gain come not without cause; it is the ornament of the wise to preserve evenness of mind (under both)","t1":"Ketum Perukkamum Illalla Nenjaththuk","t2":"Kotaamai Saandrork Kani"},{"n":116,"c":12,"ct":"நடுவு நிலைமை","ce":"On Equity","l1":"கெடுவல்யான் என்பது அறிகதன் நெஞ்சம்","l2":"நடுவொரீஇ அல்ல செயின்.","mv":"தன் நெஞ்சம் நடுவுநிலை நீங்கித் தவறு செய்ய நினைக்குமாயின், நான் கெடப்போகின்றேன் என்று ஒருவன் அறிய வேண்டும்.","ex":"Let him whose mind departing from equity commits sin well consider thus within himself, \"I shall perish.\"","t1":"Ketuvalyaan Enpadhu Arikadhan Nenjam","t2":"Natuvoreei Alla Seyin"},{"n":117,"c":12,"ct":"நடுவு நிலைமை","ce":"On Equity","l1":"கெடுவாக வையாது உலகம் நடுவாக","l2":"நன்றிக்கண் தங்கியான் தாழ்வு.","mv":"நடுவுநிலைமை நின்று அறநெறியில் நிலைத்து வாழகின்றவன் அடைந்த வறுமை நிலையைக் கேடு என கொள்ளாது உலகு.","ex":"The great will not regard as poverty the low estate of that man who dwells in the virtue of equity","t1":"Ketuvaaka Vaiyaadhu Ulakam Natuvaaka","t2":"Nandrikkan Thangiyaan Thaazhvu"},{"n":118,"c":12,"ct":"நடுவு நிலைமை","ce":"On Equity","l1":"சமன்செய்து சீர்தூக்குங் கோல்போல் அமைந்தொருபால்","l2":"கோடாமை சான்றோர்க் கணி.","mv":"முன்னே தான் சமமாக இருந்து, பின்பு பொருளைச் சீர்தூக்கும் துலாக்கோல் போல் அமைந்து, ஒரு பக்கமாக சாயாமல் நடுவுநி‌லைமை போற்றுவது சான்றோர்க்கு அழகாகும்.","ex":"To incline to neither side, but to rest impartial as the even-fixed scale is the ornament of the wise","t1":"Samanseydhu Seerdhookkung Kolpol Amaindhorupaal","t2":"Kotaamai Saandrork Kani"},{"n":119,"c":12,"ct":"நடுவு நிலைமை","ce":"On Equity","l1":"சொற்கோட்டம் இல்லது செப்பம் ஒருதலையா","l2":"உட்கோட்டம் இன்மை பெறின்.","mv":"உள்ளத்தில் கோணுதல் இல்லாத தன்மையை உறுதியாகப் பெற்றால், சொல்லிலும் கோணுதல் இல்லாதிருத்தல் நடுவுநிலைமையாம்.","ex":"Freedom from obliquity of speech is rectitude, if there be (corresponding) freedom from bias of mind","t1":"Sorkottam Illadhu Seppam Orudhalaiyaa","t2":"Utkottam Inmai Perin"},{"n":120,"c":12,"ct":"நடுவு நிலைமை","ce":"On Equity","l1":"வாணிகம் செய்வார்க்கு வாணிகம் பேணிப்","l2":"பிறவும் தமபோல் செயின்.","mv":"பிறர் பொருளையும் தம் பொருள் போல் போற்றிச் செய்தால், அதுவே வாணிகம் செய்வோர்க்கு உரி‌ய நல்ல வாணிக முறையாகும்.","ex":"The true merchandize of merchants is to guard and do by the things of others as they do by their own","t1":"Vaanikam Seyvaarkku Vaanikam Penip","t2":"Piravum Thamapol Seyin"},{"n":121,"c":13,"ct":"அடக்கமுடைமை","ce":"On Self-Control","l1":"அடக்கம் அமரருள் உய்க்கும் அடங்காமை","l2":"ஆரிருள் உய்த்து விடும்.","mv":"அடக்கம் ஒருவனை உயர்த்தித் தேவருள் சேர்க்கும்; அடக்கம் இல்லாதிருத்தல், பொல்லாத இருள் போன்ற தீய வாழ்க்கையில் செலுத்தி விடும்.","ex":"Self-control will place (a man) among the Gods; the want of it will drive (him) into the thickest darkness (of hell)","t1":"Atakkam Amararul Uykkum Atangaamai","t2":"Aarirul Uyththu Vitum"},{"n":122,"c":13,"ct":"அடக்கமுடைமை","ce":"On Self-Control","l1":"காக்க பொருளா அடக்கத்தை ஆக்கம்","l2":"அதனினூஉங் கில்லை உயிர்க்கு.","mv":"அடக்கத்தை உறுதிப் பொருளாகக் கொண்டு போற்றிக் ‌காக்க வேண்டும். அந்த அடக்கத்தைவிட மேம்பட்ட ஆக்கம் உயிர்க்கு இல்லை.","ex":"Let self-control be guarded as a treasure; there is no greater source of good for man than that","t1":"Kaakka Porulaa Atakkaththai Aakkam","t2":"Adhaninooung Killai Uyirkku"},{"n":123,"c":13,"ct":"அடக்கமுடைமை","ce":"On Self-Control","l1":"செறிவறிந்து சீர்மை பயக்கும் அறிவறிந்து","l2":"ஆற்றின் அடங்கப் பெறின்.","mv":"அறிய வேண்டியவற்றை அறிந்து, நல்வழியில் அடங்கி ஒழுகப்பெற்றால், அந்த அடக்கம் நல்லோரால் அறியப்பட்டு மேன்மை பயக்கும்.","ex":"Knowing that self-control is knowledge, if a man should control himself, in the prescribed course, such self-control will bring him distinction among the wise","t1":"Serivarindhu Seermai Payakkum Arivarindhu","t2":"Aatrin Atangap Perin"},{"n":124,"c":13,"ct":"அடக்கமுடைமை","ce":"On Self-Control","l1":"நிலையின் திரியாது அடங்கியான் தோற்றம்","l2":"மலையினும் மாணப் பெரிது.","mv":"தன் நிலையிலிருந்து மாறுபடாமல் அடங்கி ஒழுகுவோனுடைய உயர்வு, மலையின் உயர்வை விட மிகவும் பெரிதாகும்.","ex":"More lofty than a mountain will be the greatness of that man who without swerving from his domestic state, controls himself","t1":"Nilaiyin Thiriyaadhu Atangiyaan Thotram","t2":"Malaiyinum Maanap Peridhu"},{"n":125,"c":13,"ct":"அடக்கமுடைமை","ce":"On Self-Control","l1":"எல்லார்க்கும் நன்றாம் பணிதல் அவருள்ளும்","l2":"செல்வர்க்கே செல்வம் தகைத்து.","mv":"பணிவுடையவராக ஒழுகுதல்பொதுவாக எல்லோர்க்கும் நல்லதாகும்; அவர்களுள் சிறப்பாகச் செல்வர்க்கே மற்றொரு செல்வம் போன்றதாகும்.","ex":"Humility is good in all; but especially in the rich it is (the excellence of) higher riches","t1":"Ellaarkkum Nandraam Panidhal Avarullum","t2":"Selvarkke Selvam Thakaiththu"},{"n":126,"c":13,"ct":"அடக்கமுடைமை","ce":"On Self-Control","l1":"ஒருநம்யுள் ஆமைபோல் ஐந்தடக்கல் ஆற்றின்","l2":"எழுநம்யும் ஏமாப் புடைத்து.","mv":"ஒரு பிறப்பில், ஆமைபோல் ஐம்பொறிகளையும் அடக்கியாள வல்லவனானால், அஃது அவனுக்குப் பல பிறப்பிலும் காப்பாகும் சிறப்பு உடையது.","ex":"Should one throughout a single birth, like a tortoise keep in his five senses, the fruit of it will prove a safe-guard to him throughout the seven-fold births.","t1":"Orumaiyul Aamaipol Aindhatakkal Aatrin","t2":"Ezhumaiyum Emaap Putaiththu"},{"n":127,"c":13,"ct":"அடக்கமுடைமை","ce":"On Self-Control","l1":"யாகாவா ராயினும் நாகாக்க காவாக்கால்","l2":"சோகாப்பர் சொல்லிழுக்குப் பட்டு.","mv":"காக்க வேண்டியவற்றுள் எவற்றைக் காக்கா விட்டாலும் நாவையாவது காக்க வேண்டு்ம்; காக்கத் தவறினால் சொற்குற்றத்தில் அகப்பட்டுத் துன்புறுவர்.","ex":"Whatever besides you leave unguarded, guard your tongue; otherwise errors of speech and the consequent misery will ensue","t1":"Yaakaavaa Raayinum Naakaakka Kaavaakkaal","t2":"Sokaappar Sollizhukkup Pattu"},{"n":128,"c":13,"ct":"அடக்கமுடைமை","ce":"On Self-Control","l1":"ஒன்றானுந் தீச்சொல் பொருட்பயன் உண்டாயின்","l2":"நன்றாகா தாகி விடும்.","mv":"தீய ‌சொற்களின் பொருளால் விளையும் தீமை ஒன்றாயினும் ஒருவனிடம் உண்டானால், அதனால் மற்ற அறங்களாலும் நன்மை விளையாமல் போகும்.","ex":"If a man's speech be productive of a single evil, all the good by him will be turned into evil","t1":"Ondraanun Theechchol Porutpayan Untaayin","t2":"Nandraakaa Thaaki Vitum"},{"n":129,"c":13,"ct":"அடக்கமுடைமை","ce":"On Self-Control","l1":"தீயினாற் சுட்டபுண் உள்ளாறும் ஆறாதே","l2":"நாவினாற் சுட்ட வடு.","mv":"தீயினால் சுட்ட புண் புறத்தே வடு இருந்தாலும் உள்ளே ஆறிவிடும்; ஆனால் நாவினால் தீய சொல் கூறிச் சுடும் வடு என்றும் ஆறாது.","ex":"The wound which has been burnt in by fire may heal, but a wound burnt in by the tongue will never heal","t1":"Theeyinaar Suttapun Ullaarum Aaraadhe","t2":"Naavinaar Sutta Vatu"},{"n":130,"c":13,"ct":"அடக்கமுடைமை","ce":"On Self-Control","l1":"கதங்காத்துக் கற்றடங்கல் ஆற்றுவான் செவ்வி","l2":"அறம்பார்க்கும் ஆற்றின் நுழைந்து.","mv":"சினம் தோன்றாமல் காத்து, கல்வி கற்று, அடக்கமுடையவனாக இருக்க வல்லவனுடைய செவ்வியை, அவனுடைய வழியில் சென்று அறம் பார்த்திருக்கும்.","ex":"Virtue, seeking for an opportunity, will come into the path of that man who, possessed of learning and self-control, guards himself against anger","t1":"Kadhangaaththuk Katratangal Aatruvaan Sevvi","t2":"Arampaarkkum Aatrin Nuzhaindhu"},{"n":131,"c":14,"ct":"ஒழுக்கமுடைமை","ce":"On Right Conduct","l1":"ஒழுக்கம் விழுப்பந் தரலான் ஒழுக்கம்","l2":"உயிரினும் ஓம்பப் படும்.","mv":"ஒழுக்கமே எல்லார்க்கும் மேன்மையைத் தருவதாக இருப்பதால், அந்த ஒழுக்கமே உயிரை விடச் சிறந்ததாகப் போற்றப்படும்.","ex":"Propriety of conduct leads to eminence, it should therefore be preserved more carefully than life","t1":"Ozhukkam Vizhuppan Tharalaan Ozhukkam","t2":"Uyirinum Ompap Patum"},{"n":132,"c":14,"ct":"ஒழுக்கமுடைமை","ce":"On Right Conduct","l1":"பரிந்தோம்பிக் காக்க ஒழுக்கம் தெரிந்தோம்பித்","l2":"தேரினும் அஃதே துணை.","mv":"ஒழுக்கத்தை வருந்தியும் போற்றிக் காக்க வேண்டும்; பலவற்றையும் ஆராய்ந்து போற்றித் தெளிந்தாலும், அந்த ஒழுக்கமே வாழ்க்கையில் துணையாக விளங்கும்.","ex":"Let propriety of conduct be laboriously preserved and guarded; though one know and practise and excel in many virtues, that will be an eminent aid","t1":"Parindhompik Kaakka Ozhukkam Therindhompith","t2":"Therinum Aqdhe Thunai"},{"n":133,"c":14,"ct":"ஒழுக்கமுடைமை","ce":"On Right Conduct","l1":"ஒழுக்கம் உடைமை குடிமை இழுக்கம்","l2":"இழிந்த பிறப்பாய் விடும்.","mv":"ஒழுக்கம் உடையவராக வாழ்வதே உயர்ந்த குடிப்பிறப்பின் தன்மையாகும்; ஒழுக்கம் தவறுதல் இழிந்த குடிப்பிறப்பின் தன்மையாகி விடும்.","ex":"Propriety of conduct is true greatness of birth, and impropriety will sink into a mean birth","t1":"Ozhukkam Utaimai Kutimai Izhukkam","t2":"Izhindha Pirappaai Vitum"},{"n":134,"c":14,"ct":"ஒழுக்கமுடைமை","ce":"On Right Conduct","l1":"மறப்பினும் ஓத்துக் கொளலாகும் பார்ப்பான்","l2":"பிறப்பொழுக்கங் குன்றக் கெடும்.","mv":"கற்ற மறைப் பொருளை மறந்தாலும் மீண்டும் அதனை ஓதிக் கற்றுக் கொள்ள முடியும்; ஆனால் மறை ஓதுவனுடைய குடிப்பிறப்பு, ஒழுக்கம் குன்றினால் கெடு்ம்.","ex":"A Brahman though he should forget the Vedas may recover it by reading; but, if he fail in propriety of conduct even his high birth will be destroyed","t1":"Marappinum Oththuk Kolalaakum Paarppaan","t2":"Pirappozhukkang Kundrak Ketum"},{"n":135,"c":14,"ct":"ஒழுக்கமுடைமை","ce":"On Right Conduct","l1":"அழுக்கா றுடையான்கண் ஆக்கம்போன்று இல்லை","l2":"ஒழுக்க மிலான்கண் உயர்வு.","mv":"பொறாமை உடையவனிடத்தில் ஆக்கம் இல்லாதவாறு போல, ஒழுக்கம் இல்லாதவனுடைய வாழ்க்கையில் உயர்வு இல்லையாகும்.","ex":"Just as the envious man will be without wealth, so will the man of destitute of propriety of conduct be without greatness","t1":"Azhukkaa Rutaiyaankan Aakkampondru Illai","t2":"Ozhukka Milaankan Uyarvu"},{"n":136,"c":14,"ct":"ஒழுக்கமுடைமை","ce":"On Right Conduct","l1":"ஒழுக்கத்தின் ஒல்கார் உரவோர் இழுக்கத்தின்","l2":"ஏதம் படுபாக் கறிந்து.","mv":"ஒழுக்கம் தவறுதலால் குற்றம் உண்டாவதை அறிந்து, மனவலிமை உடைய சான்றோர் ஒழுக்கத்தில் தவறாமல் காத்துக் கொள்வர்.","ex":"Those firm in mind will not slacken in their observance of the proprieties of life, knowing, as they do, the misery that flows from the transgression from them","t1":"Ozhukkaththin Olkaar Uravor Izhukkaththin","t2":"Edham Patupaak Karindhu"},{"n":137,"c":14,"ct":"ஒழுக்கமுடைமை","ce":"On Right Conduct","l1":"ஒழுக்கத்தின் எய்துவர் மேன்மை இழுக்கத்தின்","l2":"எய்துவர் எய்தாப் பழி.","mv":"ஒழுக்கத்தால் எவரும் மேம்பாட்டை அடைவர்; ஒழுக்கத்திலிருந்து தவறுதலால் அடையத் தகாத பெரும் பழியை அடைவர்.","ex":"From propriety of conduct men obtain greatness; from impropriety comes insufferable disgrace","t1":"Ozhukkaththin Eydhuvar Menmai Izhukkaththin","t2":"Eydhuvar Eydhaap Pazhi"},{"n":138,"c":14,"ct":"ஒழுக்கமுடைமை","ce":"On Right Conduct","l1":"நன்றிக்கு வித்தாகும் நல்லொழுக்கம் தீயொழுக்கம்","l2":"என்றும் இடும்பை தரும்.","mv":"நல்லொழுக்கம் இன்பமான நல்வாழ்க்கைக்குக் காரணமாக இருக்கும்; தீயொழுக்கம் எப்போதும் துன்பத்தைக் கொடுக்கும்.","ex":"Propriety of conduct is the seed of virtue; impropriety will ever cause sorrow","t1":"Nandrikku Viththaakum Nallozhukkam Theeyozhukkam","t2":"Endrum Itumpai Tharum"},{"n":139,"c":14,"ct":"ஒழுக்கமுடைமை","ce":"On Right Conduct","l1":"ஒழுக்க முடையவர்க்கு ஒல்லாவே தீய","l2":"வழுக்கியும் வாயாற் சொலல்.","mv":"தீய சொற்களைத் தவறியும் தம்முடைய வாயால் சொல்லும் குற்றம், ஒழுக்கம் உடையவர்க்குப் பொருந்தாததாகும்.","ex":"Those who study propriety of conduct will not speak evil, even forgetfully","t1":"Ozhukka Mutaiyavarkku Ollaave Theeya","t2":"Vazhukkiyum Vaayaar Solal"},{"n":140,"c":14,"ct":"ஒழுக்கமுடைமை","ce":"On Right Conduct","l1":"உலகத்தோடு ஒட்ட ஒழுகல் பலகற்றும்","l2":"கல்லார் அறிவிலா தார்","mv":"உலகத்து உயர்ந்தவரோடு பொருந்த ஒழுகும் முறையைக் கற்காதவர், பல நூல்களைக் கற்றிருந்த போதிலும் அறிவில்லாதவரே ஆவர்.","ex":"Those who know not how to act agreeably to the world, though they have learnt many things, are still ignorant","t1":"Ulakaththotu Otta Ozhukal Palakatrum","t2":"Kallaar Arivilaa Thaar"},{"n":141,"c":15,"ct":"பிறனில் விழையாமை","ce":"On Adultery","l1":"பிறன்பொருளாள் பெட்டொழுகும் பேதைமை ஞாலத்து","l2":"அறம்பொருள் கண்டார்கண் இல்.","mv":"பிறனுடைய உரிமையாகிய மனைவியை விரும்பி நடக்கும் அறியாமை, உலகத்தில் அறமும் பொருளும் ஆராய்ந்து கண்டவரிடம் இல்லை.","ex":"The folly of desiring her who is the property of another will not be found in those who know (the attributes of) virtue and (the rights of) property","t1":"Piranporulaal Pettozhukum Pedhaimai Gnaalaththu","t2":"Aramporul Kantaarkan Il"},{"n":142,"c":15,"ct":"பிறனில் விழையாமை","ce":"On Adultery","l1":"அறன்கடை நின்றாருள் எல்லாம் பிறன்கடை","l2":"நின்றாரின் பேதையார் இல்.","mv":"அறத்தை விட்டுத் தீநெறியில் நின்றவர் எல்லாரிலும் பிறன் மனைவியை விரும்பி அவனுடைய வாயிலில் சென்று நின்றவரைப் போல் அறிவிலிகள் இல்லை.","ex":"Among all those who stand on the outside of virtue, there are no greater fools than those who stand outside their neighbour's door","t1":"Arankatai Nindraarul Ellaam Pirankatai","t2":"Nindraarin Pedhaiyaar Il"},{"n":143,"c":15,"ct":"பிறனில் விழையாமை","ce":"On Adultery","l1":"விளிந்தாரின் வேறல்லர் மன்ற தெளிந்தாரில்","l2":"தீமை புரிந்து ஒழுகு வார்.","mv":"ஐயமில்லாமல் தெளிந்து நம்பியவருடைய மனைவியிடத்தே விருப்பம் கொண்டு தீமையைச் செய்து நடப்பவர், செத்தவரை விட வேறுபட்டவர் அல்லர்.","ex":"Certainly they are no better than dead men who desire evil towards the wife of those who","t1":"Vilindhaarin Verallar Mandra Thelindhaaril","t2":"Theemai Purindhu Ozhuku Vaar"},{"n":144,"c":15,"ct":"பிறனில் விழையாமை","ce":"On Adultery","l1":"எனைத்துணையர் ஆயினும் என்னாம் தினைத்துணையும்","l2":"தேரான் பிறனில் புகல்.","mv":"தினையளவும் ஆராய்ந்து பார்க்காமல் பிறனுடைய மனைவியிடம் செல்லுதல், எவ்வளவு பெருமையை உடையவராயினும் என்னவாக முடியும்?","ex":"However great one may be, what does it avail if, without at all considering his guilt, he goes unto the wife of another ?","t1":"Enaiththunaiyar Aayinum Ennaam Thinaiththunaiyum","t2":"Theraan Piranil Pukal"},{"n":145,"c":15,"ct":"பிறனில் விழையாமை","ce":"On Adultery","l1":"எளிதென இல்லிறப்பான் எய்துமெஞ் ஞான்றும்","l2":"விளியாது நிற்கும் பழி.","mv":"இச்செயல் எளியது என எண்ணிப் பிறனுடைய மனைவியிடம் நெறி தவறிச் செல்கின்றவன், ‌எப்போதும் அழியாமல் நிலைநிற்கும் பழியை அடைவான்"
