்டு பகைவரிடத்திற் சென்று தம் செயலைச் செய்தால், வலிமை இல்லாதவறும் வலிமை உடையவராக வெல்வர்,","ex":"Even the powerless will become powerful and conquer, if they select a proper field (of action), and guard themselves, while they make war on their enemies","t1":"Aatraarum Aatri Atupa Itanarindhu","t2":"Potraarkan Potrich Cheyin"},{"n":494,"c":50,"ct":"இடனறிதல்","ce":"On Knowing the Place","l1":"எண்ணியார் எண்ணம் இழப்பர் இடனறிந்து","l2":"துன்னியார் துன்னிச் செயின்.","mv":"தக்க இடத்தை அறிந்து பொருந்தியவராய்ச் செயலைச் செய்வாராயின், அவரை வெல்ல எண்ணியிருந்த பகைவர் தம் எண்ணத்தை இழந்துவிடுவார்.","ex":"If they who draw near (to fight) choose a suitable place to approach (their enemy), the latter, will have to relinquish the thought which they once entertained, of conquering them","t1":"Enniyaar Ennam Izhappar Itanarindhu","t2":"Thunniyaar Thunnich Cheyin"},{"n":495,"c":50,"ct":"இடனறிதல்","ce":"On Knowing the Place","l1":"நெடும்புனலுள் வெல்லும் முதலை அடும்புனலின்","l2":"நீங்கின் அதனைப் பிற.","mv":"ஆழமுள்ள நீரில் முதலை மற்ற உயிர்களை வெல்லும், ஆனால் நீரிலிருந்து விலகிவந்தால் அந்த முதலையையும் மற்ற உயிர்கள் வென்றுவிடும்.","ex":"In deep water, a crocodile will conquer (all other animals); but if it leave the water, other animals will conquer it","t1":"Netumpunalul Vellum Mudhalai Atumpunalin","t2":"Neengin Adhanaip Pira"},{"n":496,"c":50,"ct":"இடனறிதல்","ce":"On Knowing the Place","l1":"கடலோடா கால்வல் நெடுந்தேர் கடலோடும்","l2":"நாவாயும் ஓடா நிலத்து.","mv":"வலிய சக்கரங்களையுடைய பெரியத் தேர்கள் கடலில் ஓடமுடியாது, கடலில் ஓடுகின்ற கப்பல்களும் நிலத்தில் ஓடமுடியாது.","ex":"Wide chariots, with mighty wheels, will not run on the ocean; neither will ships that the traverse ocean, move on the earth","t1":"Katalotaa Kaalval Netundher Katalotum","t2":"Naavaayum Otaa Nilaththu"},{"n":497,"c":50,"ct":"இடனறிதல்","ce":"On Knowing the Place","l1":"அஞ்சாமை அல்லால் துணைவேண்டா எஞ்சாமை","l2":"எண்ணி இடத்தால் செயின்.","mv":"(செய்யும் வழிவகைகமைக்) குறைவில்லாமல் எண்ணித் தக்க இடத்தில் பொருந்திச் செய்தால், அஞ்சாமை அல்லாமல் வேறு துணை வேண்டியதில்லை.","ex":"You will need no other aid than fearlessness, if you thoroughly reflect (on what you are to do), and select (a suitable) place for your operations","t1":"Anjaamai Allaal Thunaiventaa Enjaamai","t2":"Enni Itaththaal Seyin"},{"n":498,"c":50,"ct":"இடனறிதல்","ce":"On Knowing the Place","l1":"சிறுபடையான் செல்லிடம் சேரின் உறுபடையான்","l2":"ஊக்கம் அழிந்து விடும்.","mv":"சிறிய படை உடையவனுக்குத் தக்கதாக உள்ள இடத்தில் பொருந்தி நின்றால், பெரிய படை உடையவன் தன் ஊக்கம் அழிவான்.","ex":"The power of one who has a large army will perish, if he goes into ground where only a small army can act","t1":"Sirupataiyaan Sellitam Serin Urupataiyaan","t2":"Ookkam Azhindhu Vitum"},{"n":499,"c":50,"ct":"இடனறிதல்","ce":"On Knowing the Place","l1":"சிறைநலனும் சீரும் இலரெனினும் மாந்தர்","l2":"உறைநிலத்தோடு ஒட்டல் அரிது.","mv":"அரணாகிய நன்மையும் மற்றச் சிறப்பும் இல்லாதவராயினும் பகைவர் வாழ்கின்ற இடத்திற்குச் சென்று அவரைத் தாக்குதல் அரிது.","ex":"It is a hazardous thing to attack men in their own country, although they may neither have power nor a good fortress","t1":"Sirainalanum Seerum Ilareninum Maandhar","t2":"Urainilaththotu Ottal Aridhu"},{"n":500,"c":50,"ct":"இடனறிதல்","ce":"On Knowing the Place","l1":"காலாழ் களரில் நரியடும் கண்ணஞ்சா","l2":"வேலாள் முகத்த களிறு.","mv":"வேல் ஏந்திய வீரரைக் கோர்த்தெடுத்த கொம்பு உடைய யானையையும், கால் ஆழும் சேற்று நில்த்தில் அகப்பட்ட போது நரிகள் கொன்றுவிடும்.","ex":"A fox can kill a fearless, warrior-faced elephant, if it go into mud in which its legs sink down","t1":"Kaalaazh Kalaril Nariyatum Kannanjaa","t2":"Velaal Mukaththa Kaliru"},{"n":501,"c":51,"ct":"தெரிந்துதெளிதல்","ce":"Engaging Servants After Test","l1":"அறம்பொருள் இன்பம் உயிரச்சம் நான்கின்","l2":"திறந்தெரிந்து தேறப் படும்.","mv":"அறம், பொருள், இன்பம், உயிர்காக அஞ்சும் அச்சம் ஆகிய நான்கு வகையாலும் ஆராயப்பட்ட பிறகே ஒருவன் (ஒரு தொழிலுக்கு உரியவனாகத்) தெளியப்படுவான்.","ex":"Let (a minister) be chosen, after he has been tried by means of these four things, viz,-his virtue, (love of) money, (love of) sexual pleasure, and tear of (losing) life","t1":"Aramporul Inpam Uyirachcham Naankin","t2":"Thirandherindhu Therap Patum"},{"n":502,"c":51,"ct":"தெரிந்துதெளிதல்","ce":"Engaging Servants After Test","l1":"குடிப்பிறந்து குற்றத்தின் நீங்கி வடுப்பரியும்","l2":"நாணுடையான் சுட்டே தெளிவு.","mv":"நல்லகுடியில் பிறந்து குற்றங்களிலிருந்து நீங்கிப் பழியாச் செயல்களைச் செய்ய அஞ்சுகின்ற நாணம் உடையவனையே நம்பித் தெளிய வேண்டும்.","ex":"(The king's) choice should (fall) on him, who is of good family, who is free from faults, and who has the modesty which fears the wounds (of sin)","t1":"Kutippirandhu Kutraththin Neengi Vatuppariyum","t2":"Naanutaiyaan Sutte Thelivu"},{"n":503,"c":51,"ct":"தெரிந்துதெளிதல்","ce":"Engaging Servants After Test","l1":"அரியகற்று ஆசற்றார் கண்ணும் தெரியுங்கால்","l2":"இன்மை அரிதே வெளிறு.","mv":"அரிய நூல்களைத் கற்றுத் தேர்ந்து குற்றம் அற்றவரிடத்திலும் ஆராய்ந்துப் பார்க்குமிடத்தில் அறியாமை இல்லாதிருப்பது அருமையாகும்.","ex":"When even men, who have studied the most difficult works, and who are free from faults, are (carefully) examined, it is a rare thing to find them without ignorance","t1":"Ariyakatru Aasatraar Kannum Theriyungaal","t2":"Inmai Aridhe Veliru"},{"n":504,"c":51,"ct":"தெரிந்துதெளிதல்","ce":"Engaging Servants After Test","l1":"குணம்நாடிக் குற்றமும் நாடி அவற்றுள்","l2":"மிகைநாடி மிக்க கொளல்.","mv":"ஒருவனுடைய குணங்களை ஆராய்ந்து, பிறகு குற்றங்களையும் ஆராய்ந்து, மிகுதியானவை எவையென ஆராய்ந்து, மிகுந்திப்பவற்றால் தெளிந்து கொள்ள வேண்டும்.","ex":"Let (a king) consider (a man's) good qualities, as well as his faults, and then judge (of his character) by that which prevails","t1":"Kunamnaatik Kutramum Naati Avatrul","t2":"Mikainaati Mikka Kolal"},{"n":505,"c":51,"ct":"தெரிந்துதெளிதல்","ce":"Engaging Servants After Test","l1":"பெருமைக்கும் ஏனைச் சிறுமைக்கும் தத்தம்","l2":"கருமமே கட்டளைக் கல்.","mv":"(மக்களுடைய குணங்களாலாகிய) பெருமைக்கும் (குற்றங்களாலாகிய) சிறுமைக்கும் தேர்ந்தறியும் உரைக் கல்லாக இருப்பவை அவரவருடைய செயல்களே ஆகும்.","ex":"A man's deeds are the touchstone of his greatness and littleness","t1":"Perumaikkum Enaich Chirumaikkum Thaththam","t2":"Karumame Kattalaik Kal"},{"n":506,"c":51,"ct":"தெரிந்துதெளிதல்","ce":"Engaging Servants After Test","l1":"அற்றாரைத் தேறுதல் ஓம்புக மற்றவர்","l2":"பற்றிலர் நாணார் பழி.","mv":"சுற்றத்தாறின் தெடர்பு அற்றவரை நம்பித் தெளியக்கூடாது, அவர் உலகத்தில் பற்று இல்லாதவராகையால் பழிக்கு நாண மாட்டார்.","ex":"Let (a king) avoid choosing men who have no relations; such men have no attachment, and thereforehave no fear of crime","t1":"Atraaraith Therudhal Ompuka Matravar","t2":"Patrilar Naanaar Pazhi"},{"n":507,"c":51,"ct":"தெரிந்துதெளிதல்","ce":"Engaging Servants After Test","l1":"காதன்மை கந்தா அறிவறியார்த் தேறுதல்","l2":"பேதைமை எல்லாந் தரும்.","mv":"அறியவேண்டியவற்றை அறியாதிருப்பவரை அன்புடைமை காரணமாக நம்பித்தெளிதல், (தெளிந்தவர்க்கு) எல்லா அறியாமையும் கெடும்.","ex":"Yields all his being up to folly's blind control","t1":"Kaadhanmai Kandhaa Arivariyaarth Therudhal","t2":"Pedhaimai Ellaan Tharum"},{"n":508,"c":51,"ct":"தெரிந்துதெளிதல்","ce":"Engaging Servants After Test","l1":"தேரான் பிறனைத் தெளிந்தான் வழிமுறை","l2":"தீரா இடும்பை தரும்.","mv":"மற்றவனை ஒன்றும் ஆராயாமல் தெளிந்தால் அஃது (அவனுக்கு மட்டும் அல்லாமல்) அவனுடைய வழிமுறையில் தோன்றினவருக்கும் துன்பத்தைக் கொடுக்கும்.","ex":"Sorrow that will not leave even his posterity will come upon him chooses a stranger whose character he has not known","t1":"Theraan Piranaith Thelindhaan Vazhimurai","t2":"Theeraa Itumpai Tharum"},{"n":509,"c":51,"ct":"தெரிந்துதெளிதல்","ce":"Engaging Servants After Test","l1":"தே றற்க யாரையும் தேராது தேர்ந்தபின்","l2":"தேறுக தேறும் பொருள்.","mv":"யாரையும் ஆராயாமல் தெளியக்கூடாது, நன்றாக ஆராய்ந்த பின்னர் அவரிடம் தெளிவாகக் கொள்ளத்தக்க பொருள்களைத் தெளிந்து நம்ப வேண்டும்.","ex":"Let (a king) choose no one without previous consideration; after he has made his choice, let him unhesitatingly select for each such duties as are appropriate","t1":"Therarka Yaaraiyum Theraadhu Therndhapin","t2":"Theruka Therum Porul"},{"n":510,"c":51,"ct":"தெரிந்துதெளிதல்","ce":"Engaging Servants After Test","l1":"தேரான் தெளிவும் தெளிந்தான்கண் ஐயுறவும்","l2":"தீரா இடும்பை தரும்.","mv":"ஒருவனை ஆராயாமல் தெளிவடைதலும், ஆராய்ந்து தெளிவடைந்த ஒருவனிடம் ஐயப்படுதலும் ஆகிய இவை நீங்காதத் துன்பத்தைக் கொடுக்கும்.","ex":"To make choice of one who has not been examined, and to entertain doubts respecting one who has been chosen, will produce irremediable sorrow","t1":"Theraan Thelivum Thelindhaankan Aiyuravum","t2":"Theeraa Itumpai Tharum"},{"n":511,"c":52,"ct":"தெரிந்துவினையாடல்","ce":"On Appointment According to Merit","l1":"நன்மையும் தீமையும் நாடி நலம்புரிந்த","l2":"தன்மையான் ஆளப் படும்.","mv":"நன்மையும் தீமையுமாகிய இரண்டையும் ஆராய்ந்து நன்மை தருகின்றவற்றையே விரும்புகின்ற இயல்புடையவன் (செயலுக்கு உரியவனாக) ஆளப்படுவான்.","ex":"He should be employed (by a king), whose nature leads him to choose the good, after having weighed both the evil and the good in any undertaking","t1":"Nanmaiyum Theemaiyum Naati Nalampurindha","t2":"Thanmaiyaan Aalap Patum"},{"n":512,"c":52,"ct":"தெரிந்துவினையாடல்","ce":"On Appointment According to Merit","l1":"வாரி பெருக்கி வளம்படுத்து உற்றவை","l2":"ஆராய்வான் செய்க வினை.","mv":"பொருள் வரும் வழிகளைப் பெருக்கச் செய்து, அவற்றால் வளத்தை உண்டாக்கி, வரும் இடையூறுகளைஆராய்ந்து நீக்க வல்லவனே செயல் செய்ய வேண்டும்.","ex":"Let him do (the king's) work who can enlarge the sources (of revenue), increase wealth and considerately prevent the accidents (which would destroy it)","t1":"Vaari Perukki Valampatuththu Utravai","t2":"Aaraaivaan Seyka Vinai"},{"n":513,"c":52,"ct":"தெரிந்துவினையாடல்","ce":"On Appointment According to Merit","l1":"அன்பறிவு தேற்றம் அவாவின்மை இந்நான்கும்","l2":"நன்குடையான் கட்டே தெளிவு.","mv":"அன்பு, அறிவு, ஐயமில்லாமல் தெளியும் ஆற்றல், அவா இல்லாமை ஆகிய இந் நான்கு பண்புகளையும் நிலையாக உடையவனைத் தெளியலாம்.","ex":"Let the choice (of a king) fall upon him who largely possesses these four things, love, knowledge, a clear mind and freedom from covetousness","t1":"Anparivu Thetram Avaavinmai Innaankum","t2":"Nankutaiyaan Katte Thelivu"},{"n":514,"c":52,"ct":"தெரிந்துவினையாடல்","ce":"On Appointment According to Merit","l1":"எனைவகையான் தேறியக் கண்ணும் வினைவகையான்","l2":"வேறாகும் மாந்தர் பலர்.","mv":"எவ்வகையால் ஆராய்ந்து தெளிந்த பிறகும்(செயலை மேற்க்கொண்டு செய்யும் போது) அச் செயல்வகையால் வேறுபடும் மக்கள் உலகத்தில் பலர் உண்டு.","ex":"Even when (a king) has tried them in every possible way, there are many men who change, from the nature of the works (in which they may be employed)","t1":"Enaivakaiyaan Theriyak Kannum Vinaivakaiyaan","t2":"Veraakum Maandhar Palar"},{"n":515,"c":52,"ct":"தெரிந்துவினையாடல்","ce":"On Appointment According to Merit","l1":"அறிந்தாற்றிச் செய்கிற்பாற்கு அல்லால் வினைதான்","l2":"சிறந்தானென்று ஏவற்பாற் றன்று.","mv":"(செய்யும் வழிகளை) அறிந்து இடையூறுகளைத்தாங்கிச் செய்து முடிக்க வல்லவனை அல்லாமல், மற்றவனைச் சிறந்தவன் என்றுக் கருதி ஒருச் செயலைச் செய்யுமாறு ஏவக்கூடாது.","ex":"(A king's) work can only be accomplished by a man of wisdom and patient endurance; it is not of a nature to be given to one from mere personal attachment","t1":"Arindhaatrich Cheykirpaarku Allaal Vinaidhaan","t2":"Sirandhaanendru Evarpaar Randru"},{"n":516,"c":52,"ct":"தெரிந்துவினையாடல்","ce":"On Appointment According to Merit","l1":"செய்வானை நாடி வினைநாடிக் காலத்தோடு","l2":"எய்த உணர்ந்து செயல்.","mv":"செய்கின்றவனுடைய தன்மையை ஆராய்ந்து, செயலின் தன்மையையும் ஆராய்ந்து, தக்கக் காலத்தோடு பொறுந்துமாறு உணர்ந்து செய்விக்க வேண்டும்.","ex":"Let (a king) act, after having considered the agent (whom he is to employ), the deed (he desires to do), and the time which is suitable to it","t1":"Seyvaanai Naati Vinainaatik Kaalaththotu","t2":"Eydha Unarndhu Seyal"},{"n":517,"c":52,"ct":"தெரிந்துவினையாடல்","ce":"On Appointment According to Merit","l1":"இதனை இதனால் இவன்முடிக்கும் என்றாய்ந்து","l2":"அதனை அவன்கண் விடல்.","mv":"இந்தச் செயலை இக்கருவியால் இன்னவன் செய்துமுடிப்பான் என்று ஆராய்ந்த பிறகே அத் தொழிலை அவனிடம் ஒப்படைக்க வேண்டும்.","ex":"After having considered, \"this man can accomplish this, by these means\", let (the king) leave with him the discharge of that duty","t1":"Ithanai Ithanaal Ivanmutikkum Endraaindhu","t2":"Adhanai Avankan Vital"},{"n":518,"c":52,"ct":"தெரிந்துவினையாடல்","ce":"On Appointment According to Merit","l1":"வினைக் குரிமை நாடிய பின்றை அவனை","l2":"அதற்குரிய னாகச் செயல்.","mv":"ஒருவன் ஒரு தொழிலைச் செய்வதற்கு உரியவனாக இருப்பதை ஆராய்ந்த பிறகு அவனைத் அத் தொழிலுக்கு உரியவனாகும்படிச் செய்ய வேண்டும்.","ex":"Having considered what work a man is fit for, let (the king) employ him in that work","t1":"Vinaik Kurimai Naatiya Pindrai","t2":"Avanai Adharkuriya Naakach Cheyal"},{"n":519,"c":52,"ct":"தெரிந்துவினையாடல்","ce":"On Appointment According to Merit","l1":"வினைக்கண் வினையுடையான் கேண்மைவே றாக","l2":"நினைப்பானை நீங்கும் திரு.","mv":"மேற்க்கொண்ட தொழிலில் எப்போதும் முயற்சி உடையவனின் உறவைத் தவறாக நினைக்கும் தலைவனை விட்டுச் செல்வம் நீங்கும்.","ex":"Prosperity will leave (the king) who doubts the friendship of the man who steadily labours in the discharge of his duties","t1":"Vinaikkan Vinaiyutaiyaan Kenmaive Raaka","t2":"Ninaippaanai Neengum Thiru"},{"n":520,"c":52,"ct":"தெரிந்துவினையாடல்","ce":"On Appointment According to Merit","l1":"நாடோ றும் நாடுக மன்னன் வினைசெய்வான்","l2":"கோடாமை கோடா துலகு.","mv":"தொழில் செய்கின்றவன் கோணாதிருக்கும் வரையில் உலகம் கெடாது, ஆகையால் மன்னன் நாள்தோறும் அவனுடைய நிலைமையை ஆராய வேண்டும்.","ex":"Let a king daily examine the conduct of his servants; if they do not act crookedly, the world will not act crookedly","t1":"Naatorum Naatuka Mannan Vinaiseyvaan","t2":"Kotaamai Kotaa Thulaku"},{"n":521,"c":53,"ct":"சுற்றந்தழால்","ce":"On Cherishing One's Kindred","l1":"பற்றற்ற கண்ணும் பழைமைபா ராட்டுதல்","l2":"சுற்றத்தார் கண்ணே உள.","mv":"ஒருவன் வறியவனான காலத்திலும் அவனுக்கும் தமக்கும் இருந்த உறவைப் பாராட்டிப் பேசும் பண்புகள் சுற்றத்தாரிடம் உண்டு.","ex":"Even when (a man's) property is all gone, relatives will act towards him with their accustomed (kindness)","t1":"Patratra Kannum Pazhaimaipaa Raattudhal","t2":"Sutraththaar Kanne Ula"},{"n":522,"c":53,"ct":"சுற்றந்தழால்","ce":"On Cherishing One's Kindred","l1":"விருப்பறாச் சுற்றம் இயையின் அருப்பறா","l2":"ஆக்கம் பலவும் தரும்.","mv":"அன்பு நீங்காத சுற்றம் ஒருவனுக்குக் கிடைத்தால், அது மேன்மேலும் வளர்ச்சி குறையாத ஆக்கம் பலவற்றையும் அவனுக்குக் கொடுக்கும்.","ex":"If (a man's) relatives remain attached to him with unchanging love, it will be a source of everincreasing wealth","t1":"Virupparaach Chutram Iyaiyin Arupparaa","t2":"Aakkam Palavum Tharum"},{"n":523,"c":53,"ct":"சுற்றந்தழால்","ce":"On Cherishing One's Kindred","l1":"அளவளா வில்லாதான் வாழ்க்கை குளவளாக்","l2":"கோடின்றி நீர்நிறைந் தற்று.","mv":"சுற்றத்தாரோடு மனம் கலந்து பழகும் தன்மை இல்லாதவனுடைய வாழ்க்கை, குளப்பரப்பானது கரையில்லாமல் நீர் நிறைந்தாற் போன்றது.","ex":"The wealth of one who does not mingle freely with his relatives, will be like the filling of water in a","t1":"Alavalaa Villaadhaan Vaazhkkai Kulavalaak","t2":"Kotindri Neernirain Thatru"},{"n":524,"c":53,"ct":"சுற்றந்தழால்","ce":"On Cherishing One's Kindred","l1":"சுற்றத்தால் சுற்றப் படஒழுகல் செல்வந்தான்","l2":"பெற்றத்தால் பெற்ற பயன்.","mv":"தக்கவழியில் செய்யப்படாத முயற்சி பலர் துணையாக நின்று(அதை முடிக்குமாறு) காத்த போதிலும் குறையாகிவிடும்.","ex":"To live surrounded by relatives, is the advantage to be derived from the acquisition of wealth","t1":"Sutraththaal Sutrap Pataozhukal Selvandhaan","t2":"Petraththaal Petra Payan"},{"n":525,"c":53,"ct":"சுற்றந்தழால்","ce":"On Cherishing One's Kindred","l1":"கொடுத்தலும் இன்சொலும் ஆற்றின் அடுக்கிய","l2":"சுற்றத்தால் சுற்றப் படும்.","mv":"பொருள் கொடுத்தலும் இன்சொல் கூறுதலுமாகிய இரண்டும் செய்யவல்லவனானால் ஒருவன் தொடர்ந்த பலச் சுற்றத்தால் சூழப்படுவான்.","ex":"He will be surrounded by numerous relatives who manifests generosity and affability","t1":"Kotuththalum Insolum Aatrin Atukkiya","t2":"Sutraththaal Sutrap Patum"},{"n":526,"c":53,"ct":"சுற்றந்தழால்","ce":"On Cherishing One's Kindred","l1":"பெருங்கொடையான் பேணான் வெகுளி அவனின்","l2":"மருங்குடையார் மாநிலத்து இல்.","mv":"பெரிய கொடையாளியாகவும் சினமற்றவனாகவும் ஒருவன் இருந்தால் அவனைப் போல் சுற்றத்தாரை உடையவர் உலகத்தில் யாரும் இல்லை.","ex":"No one, in all the world, will have so many relatives (about him), as he who makes large gift, and does not give way to anger","t1":"Perungotaiyaan Penaan Vekuli Avanin","t2":"Marungutaiyaar Maanilaththu Il"},{"n":527,"c":53,"ct":"சுற்றந்தழால்","ce":"On Cherishing One's Kindred","l1":"காக்கை கரவா கரைந்துண்ணும் ஆக்கமும்","l2":"அன்னநீ ரார்க்கே உள.","mv":"காக்கை (தனக்கு கிடைத்ததை) மறைத்து வைக்காமல் சுற்றத்தைக் கூவி அழைத்து உண்ணும். ஆக்கமும் அத்தகைய இயல்பு உடையவர்க்கே உண்டு.","ex":"The crows do not conceal (their prey), but will call out for others (to share with them) while they eat it; wealth will be with those who show a similar disposition (towards their relatives)","t1":"Kaakkai Karavaa Karaindhunnum Aakkamum","t2":"Annanee Raarkke Ula"},{"n":528,"c":53,"ct":"சுற்றந்தழால்","ce":"On Cherishing One's Kindred","l1":"பொதுநோக்கான் வேந்தன் வரிசையா நோக்கின்","l2":"அதுநோக்கி வாழ்வார் பலர்.","mv":"அரசன் எல்லாரையும் பொதுவகையாக நோக்காமல், அவரவர் சிறப்புக்கு ஏற்றவாறு நோக்கினால், அதை விரும்பி சுற்றமாக வாழ்கின்றவர் பலர் ஆவர்.","ex":"Many relatives will live near a king, when they observe that he does not look on all alike, but that he looks on each man according to his merit","t1":"Podhunokkaan Vendhan Varisaiyaa Nokkin","t2":"Adhunokki Vaazhvaar Palar"},{"n":529,"c":53,"ct":"சுற்றந்தழால்","ce":"On Cherishing One's Kindred","l1":"தமராகிக் தற்றுறந்தார் சுற்றம் அமராமைக்","l2":"காரணம் இன்றி வரும்.","mv":"முன் சுற்றத்தாறாக இருந்து பின் ஒருக் காரணத்தால் பிரிந்தவரின் உறவு, அவ்வாறு அவர் பொருந்தாமலிருந்த காரணம் நீங்கியபின் தானே வந்து சேரும்.","ex":"Those who have been friends and have afterwards forsaken him, will return and join themselves (to him), when the cause of disagreement is not to be found in him","t1":"Thamaraakik Thatrurandhaar Sutram Amaraamaik","t2":"Kaaranam Indri Varum"},{"n":530,"c":53,"ct":"சுற்றந்தழால்","ce":"On Cherishing One's Kindred","l1":"உழைப்பிரிந்து காரணத்தின் வந்தானை வேந்தன்","l2":"இழைத் திருந்து எண்ணிக் கொளல்.","mv":"தன்னிடமிருந்து பிரிந்து சென்று பின் ஒருக் காரணம்பற்றித் திரும்பிவந்தவனை, அரசன் அவன் நாடிய உதவியைச் செய்து ஆராய்ந்து உறவு கொள்ள வேண்டும்.","ex":"When one may have left him, and for some cause has returned to him, let the king fulfil the object (for which he has come back) and thoughtfully receive him again","t1":"Uzhaippirindhu Kaaranaththin Vandhaanai Vendhan","t2":"Izhaith Thirundhu Ennik Kolal"},{"n":531,"c":54,"ct":"பொச்சாவாமை","ce":"Against Forgetfulness","l1":"இறந்த வெகுளியின் தீதே சிறந்த","l2":"உவகை மகிழ்ச்சியிற் சோர்வு.","mv":"பெரிய உவகையால் மகிழ்ந்திருக்கும் போது மறதியால் வரும் சோர்வு, ஒருவனுக்கு வரம்பு கடந்த சினம் வருவதைவிடத் தீமையானதாகும்.","ex":"More evil than excessive anger, is forgetfulness which springs from the intoxication of great joy","t1":"Irandha Vekuliyin Theedhe Sirandha","t2":"Uvakai Makizhchchiyir Sorvu"},{"n":532,"c":54,"ct":"பொச்சாவாமை","ce":"Against Forgetfulness","l1":"பொச்சாப்புக் கொல்லும் புகழை அறிவினை","l2":"நிச்ச நிரப்புக் கொன் றாங்கு.","mv":"நாள் தோறும் விடாமல் வரும் வறுமை அறிவைக் கொல்வது போல, ஒருவனுடைய புகழை அவனுடைய மறதிக் கொன்று விடும்.","ex":"Forgetfulness will destroy fame, even as constant poverty destroys knowledge","t1":"Pochchaappuk Kollum Pukazhai Arivinai","t2":"Nichcha Nirappuk Kon Raangu"},{"n":533,"c":54,"ct":"பொச்சாவாமை","ce":"Against Forgetfulness","l1":"பொச்சாப்பார்க் கில்லை புகழ்மை அதுஉலகத்து","l2":"எப்பால்நூ லோர்க்கும் துணிவு.","mv":"மறதியால் சோர்ந்து நடப்பவர்க்குப் புகழுடன் வாழும் தன்மையில்லை, அஃது உலகத்தில் எப்படிப்பட்டநூலோர்க்கும் ஒப்ப முடிந்த முடிப்பாகும்.","ex":"Thoughtlessness will never acquire fame; and this tenet is upheld by all treatises in the world","t1":"Pochchaappaark Killai Pukazhmai Adhuulakaththu","t2":"Eppaalnoo Lorkkum Thunivu"},{"n":534,"c":54,"ct":"பொச்சாவாமை","ce":"Against Forgetfulness","l1":"அச்ச முடையார்க்கு அரணில்லை ஆங்கில்லை","l2":"பொச்சாப் புடையார்க்கு நன்கு.","mv":"உள்ளத்தில் அச்சம் உடையவர்க்குப் புறத்திலே அரண் இருந்து பயன் இல்லை, அதுபோல் மறதி உடையவர்க்கு நல்ல நிலை வாய்த்தும் பயன் இல்லை.","ex":"Just as the coward has no defence (by whatever fortifications ha may be surrounded), so the thoughtless has no good (whatever advantages he may possess)","t1":"Achcha Mutaiyaarkku Aranillai Aangillai","t2":"Pochchaap Putaiyaarkku Nanku"},{"n":535,"c":54,"ct":"பொச்சாவாமை","ce":"Against Forgetfulness","l1":"முன்னுறக் காவாது இழுக்கியான் தன்பிழை","l2":"பின்னூறு இரங்கி விடும்.","mv":"வரும் இடையூறுகளை முன்னே அறிந்துக் காக்காமல் மறந்து சோர்ந்தவன், பின்பு அவை வந்துற்றபோது தன் பிழையை நினைத்து இரங்குவான்.","ex":"The thoughtless man, who provides not against the calamities that may happen, will afterwards repent for his fault","t1":"Munnurak Kaavaadhu Izhukkiyaan Thanpizhai","t2":"Pinnooru Irangi Vitum"},{"n":536,"c":54,"ct":"பொச்சாவாமை","ce":"Against Forgetfulness","l1":"இழுக்காமை யார்மாட்டும் என்றும் வழுக்காமை","l2":"வாயின் அதுவொப்பது இல்.","mv":"யாரிடத்திலும் எக்காலத்திலும் மறந்தும் சோர்ந்திருக்காதத் தன்மை தவறாமல் பொருந்தியிருக்குமானால், அதற்கு ஒப்பான நன்மை வேறொன்றும் இல்லை.","ex":"There is nothing comparable with the possession of unfailing thoughtfulness at all times; and towards all persons","t1":"Izhukkaamai Yaarmaattum Endrum Vazhukkaamai","t2":"Vaayin Adhuvoppadhu Il"},{"n":537,"c":54,"ct":"பொச்சாவாமை","ce":"Against Forgetfulness","l1":"அரியஎன்று ஆகாத இல்லைபொச் சாவாக்","l2":"கருவியால் போற்றிச் செயின்.","mv":"மறவாமை என்னும் கருவிகொண்டு (கடமைகளைப்) போற்றிச் செய்தால், செய்வதற்கு அரியவை என்று ஒருவனால் முடியாத செயல்கள் இல்லை.","ex":"There is nothing too difficult to be accomplished, if a man set about it carefully, with unflinching endeavour","t1":"Ariyaendru Aakaadha Illaipoch Chaavaak","t2":"Karuviyaal Potrich Cheyin"},{"n":538,"c":54,"ct":"பொச்சாவாமை","ce":"Against Forgetfulness","l1":"புகழ்ந்தவை போற்றிச் செயல்வேண்டும் செய்யாது","l2":"இகழ்ந்தார்க்கு எழுமையும் இல்.","mv":"சான்றோர் புகழ்ந்து சொல்லியச் செயல்களைப் போற்றிச் செய்யவேண்டும், அவ்வாறு செய்யாமல் மறந்து சோர்ந்தவர்க்கு ஏழுப் பிறப்பிலும் நன்மை இல்லை.","ex":"Let (a man) observe and do these things which have been praised (by the wise); if he neglects and fails to perform them, for him there will be no (happiness) throughout the seven births","t1":"Pukazhndhavai Potrich Cheyalventum Seyyaadhu","t2":"Ikazhndhaarkku Ezhumaiyum Il"},{"n":539,"c":54,"ct":"பொச்சாவாமை","ce":"Against Forgetfulness","l1":"இகழ்ச்சியின் கெட்டாரை உள்ளுக தாந்தம்","l2":"மகிழ்ச்சியின் மைந்துறும் போழ்து.","mv":"தாம் தம் மகிழ்ச்சியால் செருக்குக் கொண்டு கடமையை மறந்திருக்கும் போது, அவ்வாறு சோர்ந்திருந்த காரணத்தால் முற்காலத்தில் அழிந்தவரை நினைக்க வேண்டும்.","ex":"Let (a king) think of those who have been ruined by neglect, when his mind is elated with joy","t1":"Ikazhchchiyin Kettaarai Ulluka Thaandham","t2":"Makizhchchiyin Maindhurum Pozhdhu"},{"n":540,"c":54,"ct":"பொச்சாவாமை","ce":"Against Forgetfulness","l1":"உள்ளியது எய்தல் எளிதுமன் மற்றுந்தான்","l2":"உள்ளியது உள்ளப் பெறின்.","mv":"ஒருவன் எண்ணியதை விடாமல் எண்ணி (சோர்வில்லாமல்) இருக்கப் பெற்றால், அவன் கருதியதை அடைதல் எளிதாகும்.","ex":"It is easy for (one) to obtain whatever he may think of, if he can again think of it","t1":"Ulliyadhu Eydhal Elidhuman Matrundhaan","t2":"Ulliyadhu Ullap Perin"},{"n":541,"c":55,"ct":"செங்கோன்மை","ce":"On Righteous Sceptre","l1":"ஓர்ந்துகண் ணோடாது இறைபுரிந்து யார்மாட்டும்","l2":"தேர்ந்துசெய் வஃதே முறை.","mv":"யாரிடத்திலும் (குற்றம் இன்னதென்று) ஆராய்ந்து, கண்ணோட்டம் செய்யாமல் நடுவுநிலைமைப் பொருந்தி (செய்யத்தக்கதை) ஆராய்ந்து செய்வதே நீதிமுறையாகும்.","ex":"To examine into (the crimes which may be committed), to show no favour (to any one), to desire to act with impartiality towards all, and to inflict (such punishments) as may be wisely resolved on,","t1":"Orndhukan Notaadhu Iraipurindhu Yaarmaattum","t2":"Therndhusey Vaqdhe Murai"},{"n":542,"c":55,"ct":"செங்கோன்மை","ce":"On Righteous Sceptre","l1":"வானோக்கி வாழும் உலகெல்லாம் மன்னவன்","l2":"கோல் நோக்கி வாழுங் குடி.","mv":"உலகத்தில் உள்ள உயிர்கள் எல்லாம் மழையை நம்பி வாழ்கின்றன, அதுபோல் குடிமக்கள் எல்லாம் அரசனுடைய செங்கோலை நோக்கி வாழ்கின்றனர்.","ex":"When there is rain, the living creation thrives; and so when the king rules justly, his subjects thrive","t1":"Vaanokki Vaazhum Ulakellaam Mannavan","t2":"Kol Nokki Vaazhung Kuti"},{"n":543,"c":55,"ct":"செங்கோன்மை","ce":"On Righteous Sceptre","l1":"அந்தணர் நூற்கும் அறத்திற்கும் ஆதியாய்","l2":"நின்றது மன்னவன் கோல்.","mv":"அந்தணர் போற்றும் மறைநூலுக்கும் அறத்திற்கும் அடிப்படையாய் நின்று உலகத்தைக் காப்பது அரசனுடைய செங்கோலாகும்.","ex":"The sceptre of the king is the firm support of the Vedas of the Brahmin, and of all virtues therein described","t1":"Andhanar Noorkum Araththirkum Aadhiyaai","t2":"Nindradhu Mannavan Kol"},{"n":544,"c":55,"ct":"செங்கோன்மை","ce":"On Righteous Sceptre","l1":"குடிதழீஇக் கோலோச்சும் மாநில மன்னன்","l2":"அடிதழீஇ நிற்கும் உலகு.","mv":"குடிகளை அன்போடு அணைத்துக் கொண்டு செங்கோல் செலுத்துகின்ற அரசனுடைய அடியைப்பொருந்தி உலகம் நிலை பெறும்.","ex":"The world will constantly embrace the feet of the great king who rules over his subjects with love","t1":"Kutidhazheeik Kolochchum Maanila Mannan","t2":"Atidhazheei Nirkum Ulaku"},{"n":545,"c":55,"ct":"செங்கோன்மை","ce":"On Righteous Sceptre","l1":"இயல்புளிக் கோலோச்சும் மன்னவன் நாட்ட","l2":"பெயலும் விளையுளும் தொக்கு.","mv":"நீதி முறைப்படி செங்கோல் செலுத்தும் அரசனுடைய நாட்டில் பருவ மழையும் நிறைந்த விளைவும் ஒருசேர ஏற்படுவனவாகும்.","ex":"Rain and plentiful crops will ever dwell together in the country of the king who sways his sceptre with justice","t1":"Iyalpulik Kolochchum Mannavan Naatta","t2":"Peyalum Vilaiyulum Thokku"},{"n":546,"c":55,"ct":"செங்கோன்மை","ce":"On Righteous Sceptre","l1":"வேலன்று வென்றி தருவது மன்னவன்","l2":"கோலதூஉங் கோடா தெனின்.","mv":"ஒருவனுக்கு வெற்றி பெற்றுத் தருவது வேல் அன்று, அரசனுடைய செங்கோலே ஆகும், அச் செங்கோலும் கோணாதிருக்குமாயின்.","ex":"It is not the javelin that gives victory, but the king's sceptre, if it do no injustice","t1":"Velandru Vendri Tharuvadhu Mannavan","t2":"Koladhooung Kotaa Thenin"},{"n":547,"c":55,"ct":"செங்கோன்மை","ce":"On Righteous Sceptre","l1":"இறைகாக்கும் வையகம் எல்லாம் அவனை","l2":"முறைகாக்கும் முட்டாச் செயின்.","mv":"உலகத்தை எல்லாம் அரசன் காப்பாற்றுவான், நீதிமுறை கெடாதவாறு ஆட்சி செய்வானாயின் அரசனை அந்த முறையே காப்பாற்றும்.","ex":"The king defends the whole world; and justice, when administered without defect, defends the king","t1":"Iraikaakkum Vaiyakam Ellaam Avanai","t2":"Muraikaakkum Muttaach Cheyin"},{"n":548,"c":55,"ct":"செங்கோன்மை","ce":"On Righteous Sceptre","l1":"எண்பதத்தான் ஓரா முறைசெய்யா மன்னவன்","l2":"தண்பதத்தான் தானே கெடும்.","mv":"எளிய செவ்வி உடையவனாய் ஆராய்ந்து நீதி முறை செய்யாத அரசன், தாழ்ந்த நிலையில் நின்று (பகைவரில்லாமலும் ) தானே கெடுவான்.","ex":"The king who gives not facile audience (to those who approach him), and who does not examine and pass judgment (on their complaints), will perish in disgrace","t1":"Enpadhaththaan Oraa Muraiseyyaa Mannavan","t2":"Thanpadhaththaan Thaane Ketum"},{"n":549,"c":55,"ct":"செங்கோன்மை","ce":"On Righteous Sceptre","l1":"குடிபுறங் காத்தோம்பிக் குற்றம் கடிதல்","l2":"வடுவன்று வேந்தன் தொழில்.","mv":"குடிகளைப் பிறர் வருந்தாமல் காத்து, தானும் வருந்தாமல் காப்பாற்றி, அவற்களுடைய குற்றங்களைத் தக்க தண்டனையால் ஒழித்தல், அரசனுடைய தொழில் பழி அன்று.","ex":"In guarding his subjects (against injury from others), and in preserving them himself; to punish crime","t1":"Kutipurang Kaaththompik Kutram Katidhal","t2":"Vatuvandru Vendhan Thozhil"},{"n":550,"c":55,"ct":"செங்கோன்மை","ce":"On Righteous Sceptre","l1":"கொலையிற் கொடியாரை வேந்தொறுத்தல் பைங்கூழ்","l2":"களைகட் டதனொடு நேர்.","mv":"கொடியவர் சிலரைக் கொலைத்தண்டனையால் அரசன் ஒறுத்தல் பயிரைக் காப்பாற்றக் களையைச் களைவதற்க்கு நிகரான செயலாகும்.","ex":"For a king to punish criminals with death, is like pulling up the weeds in the green corn","t1":"Kolaiyir Kotiyaarai Vendhoruththal Paingoozh","t2":"Kalaikat Tadhanotu Ner"},{"n":551,"c":56,"ct":"கொடுங்கோன்மை","ce":"On Unrighteous Rule","l1":"கொலைமேற்கொண் டாரிற் கொடிதே அலைமேற்கொண்டு","l2":"அல்லவை செய்தொழுகும் வேந்து.","mv":"குடிகளை வருத்தும் தொழிலை மேற்கொண்டு, முறையல்லாத செயல்களைச் செய்து நடக்கும் அரசன் கொலைத் தொழிலைக் கொண்டவரை விடக் கொடியவன்.","ex":"The king who gives himself up to oppression and acts unjustly (towards his subjects) is more cruel than the man who leads the life of a murderer","t1":"Kolaimerkon Taarir Kotidhe Alaimerkontu","t2":"Allavai Seydhozhukum Vendhu"},{"n":552,"c":56,"ct":"கொடுங்கோன்மை","ce":"On Unrighteous Rule","l1":"வேலொடு நின்றான் இடுவென் றதுபோலும்","l2":"கோலொடு நின்றான் இரவு.","mv":"ஆட்சிக்குறிய கோலை ஏந்தி நின்ற அரசன் குடிகளைப் பொருள் கேட்டல் , போகும் வழியில் கள்வன் கொடு என்று கேட்பதைப் போன்றது.","ex":"The request (for money) of him who holds the sceptre is like the word of a highway robber who stands with a weapon in hand and says \"give up your wealth\"","t1":"Velotu Nindraan Ituven Radhupolum","t2":"Kolotu Nindraan Iravu"},{"n":553,"c":56,"ct":"கொடுங்கோன்மை","ce":"On Unrighteous Rule","l1":"நாடொறும் நாடி முறைசெய்யா மன்னவன்","l2":"நாடொறும் நாடு கெடும்.","mv":"நாள் தோறும் தன் ஆட்சியில் நன்மை தீமைகளை ஆராய்ந்து முறைசெய்யாத அரசன், நாள் தோறும் (மெல்ல மெல்லத்) தன் நாட்டை இழந்து வருவான்.","ex":"The country of the king who does not daily examine into the wrongs done and distribute justice, will daily fall to ruin","t1":"Naatorum Naati Muraiseyyaa Mannavan","t2":"Naatorum Naatu Ketum"},{"n":554,"c":56,"ct":"கொடுங்கோன்மை","ce":"On Unrighteous Rule","l1":"கூழுங் குடியும் ஒருங்கிழக்கும் கோல்கோடிச்","l2":"சூழாது செய்யும் அரசு.","mv":"(ஆட்சிமுறை கெட்டுக்) கொடுங்கோலனாகி ஆராயாமல் எதையும் செய்யும் அரசன், பொருளையும் குடிகளையும் ஒரு சேர இழந்து விடுவான்.","ex":"The king, who, without reflecting (on its evil consequences), perverts justice, will lose at once both his wealth and his subjects","t1":"Koozhung Kutiyum Orungizhakkum Kolkotich","t2":"Choozhaadhu Seyyum Arasu"},{"n":555,"c":56,"ct":"கொடுங்கோன்மை","ce":"On Unrighteous Rule","l1":"அல்லற்பட்டு ஆற்றாது அழுதகண் ணீரன்றே","l2":"செல்வத்தைத் தேய்க்கும் படை","mv":"(முறை செய்யாதவனுடைய) செல்வத்தைத் தேய்த்து அழிக்க வல்ல படை அவனால் பலர் துன்பப்பட்டுத் துன்பம் பொறுக்க முடியாமல் அழுத கண்ணீர் அன்றோ.","ex":"Will not the tears, shed by a people who cannot endure the oppression which they suffer (from their king), become a saw to waste away his wealth ?","t1":"Allarpattu Aatraadhu Azhudhakan Neerandre","t2":"Selvaththaith Theykkum Patai"},{"n":556,"c":56,"ct":"கொடுங்கோன்மை","ce":"On Unrighteous Rule","l1":"மன்னர்க்கு மன்னுதல் செங்கோன்மை அஃதின்றேல்","l2":"மன்னாவாம் மன்னர்க் கொளி.","mv":"அரசர்க்கு புகழ் நிலைபெறக் காரணம் செங்கோல் முறையாகும், அஃது இல்லையானால் அரசர்க்கு புகழ் நிலைபெறாமல் போகும்.","ex":"Righteous government gives permanence to (the fame of) kings; without that their fame will have no endurance","t1":"Mannarkku Mannudhal Sengonmai Aqdhindrel","t2":"Mannaavaam Mannark Koli"},{"n":557,"c":56,"ct":"கொடுங்கோன்மை","ce":"On Unrighteous Rule","l1":"துளியின்மை ஞாலத்திற்கு எற்றற்றே வேந்தன்","l2":"அளியின்மை வாழும் உயிர்க்கு.","mv":"மழைத்துளி இல்லாதிருத்தல் உலகத்திற்கு எத்தன்மையானதோ, அத்தன்மையானது நாட்டில் வாழும் குடிமக்களுக்கு அரசனுடைய அருள் இல்லாத ஆட்சி.","ex":"As is the world without rain, so live a people whose king is without kindness","t1":"Thuliyinmai Gnaalaththirku Etratre Vendhan","t2":"Aliyinmai Vaazhum Uyirkku"},{"n":558,"c":56,"ct":"கொடுங்கோன்மை","ce":"On Unrighteous Rule","l1":"இன்மையின் இன்னாது உடைமை முறைசெய்யா","l2":"மன்னவன் கோற்கீழ்ப் படின்.","mv":"முறை செய்யாத அரசனுடைய கொடுங்கோல் ஆட்சியின் கீழ் இருக்கப் பெற்றால், பொருள் இல்லாத வறுமை நிலையைவிடச் செல்வநிலை துன்பமானதாகும்.","ex":"Property gives more sorrow than poverty, to those who live under the sceptre of a king without justice","t1":"Inmaiyin Innaadhu Utaimai Muraiseyyaa","t2":"Mannavan Korkeezhp Patin"},{"n":559,"c":56,"ct":"கொடுங்கோன்மை","ce":"On Unrighteous Rule","l1":"முறைகோடி மன்னவன் செய்யின் உறைகோடி","l2":"ஒல்லாது வானம் பெயல்.","mv":"அரசன் முறை தவறி நாட்டை ஆட்சி செய்வானானால், அந்த நாட்டில் பருவமழை தவறி மேகம் மழை பெய்யாமல் போகும்.","ex":"If the king acts contrary to justice, rain will become unseasonable, and the heavens will withhold their showers","t1":"Muraikoti Mannavan Seyyin Uraikoti","t2":"Ollaadhu Vaanam Peyal"},{"n":560,"c":56,"ct":"கொடுங்கோன்மை","ce":"On Unrighteous Rule","l1":"ஆபயன் குன்றும் அறுதொழிலோர் நூல்மறப்பர்","l2":"காவலன் காவான் எனின்.","mv":"நாட்டைக் காக்கும் தலைவன் முறைப்படி காக்காவிட்டால், அந் நாட்டில் பசுக்கள் பால் தருதலாகிய பயன் குன்றும், அந்தணரும் அறநூல்களை மறப்பர்.","ex":"If the guardian (of the country) neglects to guard it, the produce of the cows will fail, and the men of six duties viz, the Brahmins will forget the vedas","t1":"Aapayan Kundrum Arudhozhilor Noolmarappar","t2":"Kaavalan Kaavaan Enin"},{"n":561,"c":57,"ct":"வெருவந்தசெய்யாமை","ce":"On Tyranny","l1":"தக்காங்கு நாடித் தலைச்செல்லா வண்ணத்தால்","l2":"ஒத்தாங்கு ஒறுப்பது வேந்து.","mv":"செய்த குற்றத்தை தக்கவாறு ஆராய்ந்து மீண்டும் அக் குற்றம் செய்யாத படி குற்றத்திற்குப் பொருந்துமாறு தண்டிப்பவனே அரசன் ஆவான்.","ex":"He is a king who having equitably examined (any injustice which has been brought to his notice), suitably punishes it, so that it may not be again committed","t1":"Thakkaangu Naatith Thalaichchellaa Vannaththaal","t2":"Oththaangu Oruppadhu Vendhu"},{"n":562,"c":57,"ct":"வெருவந்தசெய்யாமை","ce":"On Tyranny","l1":"கடிதோச்சி மெல்ல எறிக நெடிதாக்கம்","l2":"நீங்காமை வேண்டு பவர்.","mv":"ஆக்கம் நெடுங்காலம் நீங்காமலிருக்க விரும்புகின்றவர் (தண்டிக்கத் தொடங்கும் போது) அளவு கடந்து செய்வது போல் காட்டி அளவு மீறாமல் முறை செய்ய வேண்டும்.","ex":"Let the king, who desires that his prosperity may long remain, commence his preliminary enquires with strictness, and then punish with mildness","t1":"Katidhochchi Mella Erika Netidhaakkam","t2":"Neengaamai Ventu Pavar"},{"n":563,"c":57,"ct":"வெருவந்தசெய்யாமை","ce":"On Tyranny","l1":"வெருவந்த செய்தொழுகும் வெங்கோல னாயின்","l2":"ஒருவந்தம் ஒல்லைக் கெடும்.","mv":"குடிகள் அஞ்சும் படியான கொடுமைகளைச் செய்து ஆளும் கொடுங்கோல் அரசனானால், அவன் திண்ணமாக விரைவில் கெடுவான்.","ex":"The cruel-sceptred king, who acts so as to put his subjects in fear, will certainly and quickly come to ruin","t1":"Veruvandha Seydhozhukum Vengola Naayin","t2":"Oruvandham Ollaik Ketum"},{"n":564,"c":57,"ct":"வெருவந்தசெய்யாமை","ce":"On Tyranny","l1":"இறைகடியன் என்றுரைக்கும் இன்னாச்சொல் வேந்தன்","l2":"உறைகடுகி ஒல்லைக் கெடும்.","mv":"நம் அரசன் கடுமையானவன் என்று குடிகளால் கூறப்படும் கொடுஞ்சொல்லை உடைய அரசன், தன் ஆயுள் குறைந்து விரைவில் கெடுவான்.","ex":"The king who is spoken of as cruel will quickly perish; his life becoming shortened","t1":"Iraikatiyan Endruraikkum Innaachchol Vendhan","t2":"Uraikatuki Ollaik Ketum"},{"n":565,"c":57,"ct":"வெருவந்தசெய்யாமை","ce":"On Tyranny","l1":"அருஞ்செவ்வி இன்னா முகத்தான் பெருஞ்செல்வம்","l2":"பேஎய்கண் டன்னது உடைத்து.","mv":"எளிதில் காணமுடியாத அருமையும், இனிமையற்ற முகமும் உடையவனது பெரிய செல்வம், பேய் கண்டு காத்திருப்பதைப் போன்ற தன்மையுடையது.","ex":"The great wealth of him who is difficult of access and possesses a sternness of countenance, is like that which has been obtained by a devil","t1":"Arunjevvi Innaa Mukaththaan Perunjelvam","t2":"Peeykan Tannadhu Utaiththu"},{"n":566,"c":57,"ct":"வெருவந்தசெய்யாமை","ce":"On Tyranny","l1":"கடுஞ்சொல்லன் கண்ணிலன் ஆயின் நெடுஞ்செல்வம்","l2":"நீடின்றி ஆங்கே கெடும்.","mv":"கடுஞ்சொல் உடையவனாய்க் கண்ணோட்டம் இல்லாதவனாய் உள்ளவனுடைய பெரிய செல்வம் நீடித்தல் இல்லாமல் அப்பொழுதே கெடும்.","ex":"The abundant wealth of the king whose words are harsh and whose looks are void of kindness, will instantly perish instead of abiding long, with him","t1":"Katunjollan Kannilan Aayin Netunjelvam","t2":"Neetindri Aange Ketum"},{"n":567,"c":57,"ct":"வெருவந்தசெய்யாமை","ce":"On Tyranny","l1":"கடுமொழியும் கையிகந்த தண்டமும் வேந்தன்","l2":"அடுமுரண் தேய்க்கும் அரம்.","mv":"கடுமையான சொல்லும் முறைகடந்த தண்டனையும் அரசனுடைய வெற்றிக்கு காரணமான வலிமையைத் தேய்க்கும் அரம் ஆகும்.","ex":"Severe words and excessive punishments will be a file to waste away a king's power for destroying (his enemies)","t1":"Katumozhiyum Kaiyikandha Thantamum Vendhan","t2":"Atumuran Theykkum Aram"},{"n":568,"c":57,"ct":"வெருவந்தசெய்யாமை","ce":"On Tyranny","l1":"இனத்தாற்றி எண்ணாத வேந்தன் சினத்தாற்றிச்","l2":"சீறிற் சிறுகும் திரு.","mv":"அமைச்சர் முதலான தன் இனத்தாரிடம் கலந்து எண்ணாத அரசன், சினத்தின் வழியில் சென்று சீறி நிற்பானானால், அவனுடைய செல்வம் சுருங்கும்.","ex":"The prosperity of that king will waste away, who without reflecting (on his affairs himself), commits them to his ministers, and (when a failure occurs) gives way to anger, and rages against them","t1":"Inaththaatri Ennaadha Vendhan Sinaththaatrich","t2":"Cheerir Sirukum Thiru"},{"n":569,"c":57,"ct":"வெருவந்தசெய்யாமை","ce":"On Tyranny","l1":"செருவந்த போழ்திற் சிறைசெய்யா வேந்தன்","l2":"வெருவந்து வெய்து கெடும்.","mv":"முன்னமே தக்கவாறு அரண் செய்து கொள்ளாத அரசன் போர் வந்த காலத்தில் (தற்காப்பு இல்லாமல்) அஞ்சி விரைவில் அழிவான்.","ex":"The king who has not provided himself with a place of defence, will in times of war be seized with fear and quickly perish","t1":"Seruvandha Pozhdhir Siraiseyyaa Vendhan","t2":"Veruvandhu Veydhu Ketum"},{"n":570,"c":57,"ct":"வெருவந்தசெய்யாமை","ce":"On Tyranny","l1":"கல்லார்ப் பிணிக்கும் கடுங்கோல் அதுவல்லது","l2":"இல்லை நிலக்குப் பொறை.","mv":"கடுங்கோலாகிய ஆட்சிமுறை கல்லாதவரைத் தனக்கு அரணாகச் சேர்த்துக் கொள்ளும், அது தவிர நிலத்திற்கு சுமை வேறு இல்லை.","ex":"The earth bears up no greater burden than ignorant men whom a cruel sceptre attaches to itself (as the ministers of its evil deeds)","t1":"Kallaarp Pinikkum Katungol Adhuvalladhu","t2":"Illai Nilakkup Porai"},{"n":571,"c":58,"ct":"கண்ணோட்டம்","ce":"On Kindliness","l1":"கண்ணோட்டம் என்னும் கழிபெருங் காரிகை","l2":"உண்மையான் உண்டிவ் வுலகு.","mv":"கண்ணோட்டம் என்று சொல்லப்படுகின்ற மிகச் சிறந்த அழகு இருக்கும் காரணத்தால் தான், இந்த உலகம் அழியாமல் இருக்கின்றது.","ex":"The world exists through that greatest ornament (of princes), a gracious demeanour","t1":"Kannottam Ennum Kazhiperung Kaarikai","t2":"Unmaiyaan Untiv Vulaku"},{"n":572,"c":58,"ct":"கண்ணோட்டம்","ce":"On Kindliness","l1":"கண்ணோட்டத் துள்ளது உலகியல் அஃதிலார்","l2":"உண்மை நிலக்குப் பொறை.","mv":"கண்ணோட்டத்தினால் உலகியல் நடைபெறுகின்றது, கண்ணோட்டம் இல்லாதவர் உயிரோடு இருத்தல் நிலத்திற்குச் சுமையே தவிர வேறு பயனில்லை.","ex":"The prosperity of the world springs from the kindliness, the existence of those who have no (kindliness) is a burden to the earth","t1":"Kannottath Thulladhu Ulakiyal Aqdhilaar","t2":"Unmai Nilakkup Porai"},{"n":573,"c":58,"ct":"கண்ணோட்டம்","ce":"On Kindliness","l1":"பண்என்னாம் பாடற்கு இயைபின்றேல் கண்என்னாம்","l2":"கண்ணோட்டம் இல்லாத கண்.","mv":"பாடலோடு பொருந்துதல் இல்லையானால் இசை என்ன பயனுடையதாகும், அதுபோல் கண்ணோட்டம் இல்லாவிட்டால் கண் என்ன பயனுடையதாகும்.","ex":"Of what avail is a song if it be inconsistent with harmony ? what is the use of eyes which possess no kindliness","t1":"Panennaam Paatarku Iyaipindrel Kanennaam","t2":"Kannottam Illaadha Kan"},{"n":574,"c":58,"ct":"கண்ணோட்டம்","ce":"On Kindliness","l1":"உளபோல் முகத்தெவன் செய்யும் அளவினால்","l2":"கண்ணோட்டம் இல்லாத கண்.","mv":"தக்க அளவிற்குக் கண்ணோட்டம் இல்லாத கண்கள் முகத்தில் உள்ளவை போல் தோன்றுதல் அல்லாமல் வேறு என்ன பயன் செய்யும்.","ex":"Beyond appearing to be in the face, what good do they do, those eyes in which is no well-regulated kindness ?","t1":"Ulapol Mukaththevan Seyyum Alavinaal","t2":"Kannottam Illaadha Kan"},{"n":575,"c":58,"ct":"கண்ணோட்டம்","ce":"On Kindliness","l1":"கண்ணிற்கு அணிகலம் கண்ணோட்டம் அஃதின்றேல்","l2":"புண்ணென்று உணரப் படும்","mv":"ஒருவனுடைய கண்ணுக்கு அணிகலமாவது கண்ணோட்டம் என்னும் பண்பே, அஃது இல்லையானால் புண் என்று உணரப்படும்.","ex":"Kind looks are the ornaments of the eyes; without these they will be considered (by the wise) to be merely two sores","t1":"Kannirku Anikalam Kannottam Aqdhindrel","t2":"Punnendru Unarap Patum"},{"n":576,"c":58,"ct":"கண்ணோட்டம்","ce":"On Kindliness","l1":"மண்ணோ டியைந்த மரத்தனையர் கண்ணோ","l2":"டியைந்துகண் ணோடா தவர்.","mv":"கண்ணோட்டதிற்க்கு உரிய கண்ணோடுப் பொருந்தி இருந்தும் கண்ணோட்டம் இல்லாதவர் (கண் இருந்தும் காணாத ) மரத்தினைப் போன்றவர்.","ex":"They resemble the trees of the earth, who although they have eyes, never look kindly (on others)","t1":"Manno Tiyaindha Maraththanaiyar Kanno","t2":"Tiyaindhukan Notaa Thavar"},{"n":577,"c":58,"ct":"கண்ணோட்டம்","ce":"On Kindliness","l1":"கண்ணோட் டம் இல்லவர் கண்ணிலர் கண்ணுடையார்","l2":"கண்ணோட்டம் இன்மையும் இல்.","mv":"கண்ணோட்டம் இல்லாத மக்கள் கண் இல்லாதவரே ஆவர், கண் உடைய மக்கள் கண்ணோட்டம் இல்லா திருத்தலும் இல்லை.","ex":"Men without kind looks are men without eyes; those who (really) have eyes are also not devoid of kind looks","t1":"Kannottam Illavar Kannilar Kannutaiyaar","t2":"Kannottam Inmaiyum Il"},{"n":578,"c":58,"ct":"கண்ணோட்டம்","ce":"On Kindliness","l1":"கருமம் சிதையாமல் கண்ணோட வல்லார்க்கு","l2":"உரிமை உடைத்திவ் வுலகு.","mv":"தம் தம் கடமையாகிய தொழில் கெடாமல் கண்ணோட்டம் உடையவராக இருக்க வல்லவர்க்கு இவ்வுலகம் உரிமை உடையது.","ex":"The world is theirs (kings) who are able to show kindness, without injury to their affairs, (administration of justice)","t1":"Karumam Sidhaiyaamal Kannota Vallaarkku","t2":"Urimai Utaiththiv Vulaku"},{"n":579,"c":58,"ct":"கண்ணோட்டம்","ce":"On Kindliness","l1":"ஒறுத்தாற்றும் பண்பினார் கண்ணும்கண் ணோடிப்","l2":"பொறுத்தாற்றும் பண்பே தலை.","mv":"தண்டித்தற்குரிய தன்மை உடையவரிடத்திலும் கண்ணோட்டம் செய்து ( அவர் செய்த குற்றத்தைப்) பொருத்துக் காக்கும் பண்பே சிறந்தது.","ex":"Patiently to bear with, and show kindness to those who grieve us, is the most excellent of all dispositions","t1":"Oruththaatrum Panpinaar Kannumkan Notip","t2":"Poruththaatrum Panpe Thalai"},{"n":580,"c":58,"ct":"கண்ணோட்டம்","ce":"On Kindliness","l1":"பெயக்கண்டும் நஞ்சுண் டமைவர் நயத்தக்க","l2":"நாகரிகம் வேண்டு பவர்.","mv":"எவராலும் விரும்பத்தக்க நாகரிகமான கண்ணோட்டத்தை விரும்புகின்றவர், பழகியவர் தமக்கு நஞ்சு இடக்கண்டும் அதை உண்டு அமைவர்.","ex":"Those who desire (to cultivate that degree of) urbanity which all shall love, even after swallowing the poison served to them by their friends, will be friendly with them","t1":"Peyakkantum Nanjun Tamaivar Nayaththakka","t2":"Naakarikam Ventu Pavar"},{"n":581,"c":59,"ct":"ஒற்றாடல்","ce":"On Spies","l1":"ஒற்றும் உரைசான்ற நூலும் இவையிரண்டும்","l2":"தெற்றென்க மன்னவன் கண்.","mv":"ஒற்றரும் புகழ் அமைந்த நீதிநூலும் ஆகிய இவ்விருவகைக் கருவிகளையும் அரசன் தன்னுடைய கண்களாகத் தெளியவேணடும்.","ex":"Let a king consider as his eyes these two things, a spy and a book (of laws) universally esteemed","t1":"Otrum Uraisaandra Noolum Ivaiyirantum","t2":"Thetrenka Mannavan Kan"},{"n":582,"c":59,"ct":"ஒற்றாடல்","ce":"On Spies","l1":"எல்லார்க்கும் எல்லாம் நிகழ்பவை எஞ்ஞான்றும்","l2":"வல்லறிதல் வேந்தன் தொழில்.","mv":"எல்லாரிடத்திலும் நிகழ்கின்றவை எல்லாவற்றையும் எக்காலத்திலும் (ஒற்றரைக் கொண்டு) விரைந்து அறிதல் அரசனுக்குரிய தொழிலாகும்.","ex":"'Tis duty of the king to learn with speed","t1":"Ellaarkkum Ellaam Nikazhpavai Egngnaandrum","t2":"Vallaridhal Vendhan Thozhil"},{"n":583,"c":59,"ct":"ஒற்றாடல்","ce":"On Spies","l1":"ஒற்றினான் ஒற்றிப் பொருள்தெரியா மன்னவன்","l2":"கொற்றங் கொளக்கிடந்தது இல்.","mv":"ஒற்றரால் (நாட்டு நிகழ்ச்சிகளை) அறிந்து அவற்றின் பயனை ஆராய்ந்துணராத அரசன் வெற்றிபெறத்தக்க வழி வேறு இல்லை.","ex":"There is no way for a king to obtain conquests, who knows not the advantage of discoveries made by a spy","t1":"Otrinaan Otrip Poruldheriyaa Mannavan","t2":"Kotrang Kolakkitandhadhu Il"},{"n":584,"c":59,"ct":"ஒற்றாடல்","ce":"On Spies","l1":"வினைசெய்வார் தம்சுற்றம் வேண்டாதார் என்றாங்கு","l2":"அனைவரையும் ஆராய்வது ஒற்று.","mv":"தம்முடைய தொழிலைச் செய்கின்றவர், தம் சுற்றத்தார், தம் பகைவர் என்றுக்கூறப்படும் எல்லாரையும் ஆராய்வதே ஒற்றரின் தொழிலாகும்.","ex":"He is a spy who watches all men, to wit, those who are in the king's employment, his relatives, and his enemies","t1":"Vinaiseyvaar Thamsutram Ventaadhaar Endraangu","t2":"Anaivaraiyum Aaraaivadhu Otru"},{"n":585,"c":59,"ct":"ஒற்றாடல்","ce":"On Spies","l1":"கடாஅ உருவொடு கண்ணஞ்சாது யாண்டும்","l2":"உகாஅமை வல்லதே ஒற்று.","mv":"ஐயுற முடியாத உருவத்தோடு, பார்த்தவருடைய கண் பார்வைக்கு அஞ்சாமல் எவ்விடத்திலும் மனதிலுள்ளதை வெளிப்படுத்தாமல் இருக்க வல்லவனே ஒற்றன் ஆவன்.","ex":"A spy is one who is able to assume an appearance which may create no suspicion (in the minds of others), who fears no man's face, and who never reveals (his purpose)","t1":"Kataaa Uruvotu Kannanjaadhu Yaantum","t2":"Ukaaamai Valladhe Otru"},{"n":586,"c":59,"ct":"ஒற்றாடல்","ce":"On Spies","l1":"துறந்தார் படிவத்த ராகி இறந்தாராய்ந்து","l2":"என்செயினும் சோர்விலது ஒற்று.","mv":"துறந்தவரின் வடிவத்தை உடையவராய், அறிய இடங்களிலெல்லாம் சென்று ஆராய்ந்து (ஐயுற்றவர்) என்ன செய்தாலும் சோர்ந்து விடாதவரே ஒற்றர் ஆவர்.","ex":"He is a spy who, assuming the appearance of an ascetic, goes into (whatever place he wishes), examines into (all, that is needful), and never discovers himself, whatever may be done to him","t1":"Thurandhaar Pativaththa Raaki Irandhaaraaindhu","t2":"Enseyinum Sorviladhu Otru"},{"n":587,"c":59,"ct":"ஒற்றாடல்","ce":"On Spies","l1":"மறைந்தவை கேட்கவற் றாகி அறிந்தவை","l2":"ஐயப்பாடு இல்லதே ஒற்று.","mv":"மறைந்த செய்திகளையும் கேட்டறிய வல்லவனாய் அறிந்த செய்திகளை ஐயப்படாமல் துணிய வல்லவனாய் உள்ளவனே ஒற்றன் ஆவான்.","ex":"A spy is one who is able to discover what is hidden and who retains no doubt concerning what he has known","t1":"Maraindhavai Ketkavar Raaki Arindhavai","t2":"Aiyappaatu Illadhe Otru"},{"n":588,"c":59,"ct":"ஒற்றாடல்","ce":"On Spies","l1":"ஒற்றொற்றித் தந்த பொருளையும் மற்றுமோர்","l2":"ஒற்றினால் ஒற்றிக் கொளல்.","mv":"ஓர் ஒற்றன் மறைந்து கேட்டுத் தெரிவித்தச் செய்தியையும் மற்றோர் ஒற்றனால் கேட்டு வரச் செய்து ஒப்புமை கண்டபின் உண்மை என்றுக் கொள்ள வேண்டும்.","ex":"Let not a king receive the information which a spy has discovered and made known to him, until he has examined it by another spy","t1":"Otrotrith Thandha Porulaiyum Matrumor","t2":"Otrinaal Otrik Kolal"},{"n":589,"c":59,"ct":"ஒற்றாடல்","ce":"On Spies","l1":"ஒற்றெற் றுணராமை ஆள்க உடன்மூவர்","l2":"சொற்றொக்க தேறப் படும்.","mv":"ஓர் ஒற்றனை மற்றோர் ஒற்றன் அறியாதபடி ஆள வேண்டும், அவ்வாறு ஆளப்பட்ட ஒற்றர் மூவரின் சொல் ஒத்திருந்தால் அவை உண்மை எனத் தெளியப்படும்.","ex":"Let a king employ spies so that one may have no knowledge of the other; and when the information of three agrees together, let him receive it","t1":"Otrer Runaraamai Aalka Utanmoovar","t2":"Sotrokka Therap Patum"},{"n":590,"c":59,"ct":"ஒற்றாடல்","ce":"On Spies","l1":"சிறப்பறிய ஒற்ற஧ன்கண் செய்யற்க செய்யின்","l2":"புறப்படுத்தான் ஆகும் மறை.","mv":"ஒற்றனிடத்தில் செய்யும் சிறப்பைப் பிறர் அறியுமாறு செய்யக்கூடாது, செய்தால் மறைபொருளைத்தானே வெளிப்படுத்தியவன் ஆவான்.","ex":"Let not a king publicly confer on a spy any marks of his favour; if he does, he will divulge his own secret","t1":"Sirappariya Otrinkan Seyyarka Seyyin","t2":"Purappatuththaan Aakum Marai"},{"n":591,"c":60,"ct":"ஊக்கமுடைமை","ce":"On Exertion","l1":"உடையர் எனப்படுவது ஊக்கம் அஃ தில்லார்","l2":"உடையது உடையரோ மற்று.","mv":"ஒருவர் பெற்றிருக்கின்றார் என்று சொல்லத்தக்க சிறப்புடையது ஊக்கமாகும், ஊக்கம் இல்லாதவர் வேறு எதைப் பெற்றிருந்தாலும் அதை உடையவர் ஆவரோ.","ex":"Energy makes out the man of property; as for those who are destitute of it, do they (really) possess what they possess ?","t1":"Utaiyar Enappatuvadhu Ookkam Aqdhillaar","t2":"Utaiyadhu Utaiyaro Matru"},{"n":592,"c":60,"ct":"ஊக்கமுடைமை","ce":"On Exertion","l1":"உள்ளம் உடைமை உடைமை பொருளுடைமை","l2":"நில்லாது நீங்கி விடும்.","mv":"ஒருவர்க்கு ஊக்கமுடைமையே நிலையான உடைமையாகும், மற்றப் பொருளுடைமையானது நிலைபேறு இல்லாமல் நீங்கிவிடுவதாகும்.","ex":"The possession of (energy of) mind is true property; the possession of wealth passes away and abides not","t1":"Ullam Utaimai Utaimai Porulutaimai","t2":"Nillaadhu Neengi Vitum"},{"n":593,"c":60,"ct":"ஊக்கமுடைமை","ce":"On Exertion","l1":"ஊக்கம் இழந்தேமென்று அல்லாவார் ஊக்கம்","l2":"ஒருவந்தம் கைத்துடை யார்.","mv":"ஊக்கத்தை உறுதியாகத் தம்கைப் பொருளாக உடையவர், ஆக்கம்( இழந்து விட்டக்காலத்திலும்) இழந்து விட்டோம் என்று கலங்க மாட்டார்.","ex":"They who are possessed of enduring energy will not trouble themselves, saying, \"we have lost our property.\"","t1":"Aakkam Izhandhemendru Allaavaar Ookkam","t2":"Oruvandham Kaiththutai Yaar"},{"n":594,"c":60,"ct":"ஊக்கமுடைமை","ce":"On Exertion","l1":"ஊக்கம் அதர்வினாய்ச் செல்லும் அசைவிலா","l2":"ஊக்க முடையா னுழை.","mv":"சோர்வு இல்லாத ஊக்கம் உடையவனிடத்தில் ஆக்கமானது தானே அவன் உள்ள இடத்திற்கு வழிக் கேட்டுக்கொண்டு போய்ச் சேரும்.","ex":"Wealth will find its own way to the man of unfailing energy","t1":"Aakkam Adharvinaaich Chellum Asaivilaa","t2":"Ookka Mutaiyaa Nuzhai"},{"n":595,"c":60,"ct":"ஊக்கமுடைமை","ce":"On Exertion","l1":"வெள்ளத் தனைய மலர்நீட்டம் மாந்தர்தம்","l2":"உள்ளத் தனையது உயர்வு.","mv":"நீர்ப்பூக்களின் தாளின் நீளம் அவை நின்ற நீரின் அளவினவாகும், மக்களின் ஊக்கத்தை அளவினதாகும் வாழ்க்கையின் உயர்வு.","ex":"The stalks of water-flowers are proportionate to the depth of water; so is men's greatness proportionate to their minds","t1":"Vellath Thanaiya Malarneettam Maandhardham","t2":"Ullath Thanaiyadhu Uyarvu"},{"n":596,"c":60,"ct":"ஊக்கமுடைமை","ce":"On Exertion","l1":"உள்ளுவ தெல்லாம் உயர்வுள்ளல் மற்றது","l2":"தள்ளினுந் தள்ளாமை நீர்த்து.","mv":"எண்ணுவதெல்லாம் உயர்வைப்பற்றியே எண்ண வேண்டும், அவ் வுயர்வுக் கைகூடாவிட்டாலும் அவ்வாறு எண்ணுவதை விடக்கூடாது.","ex":"In all that a king thinks of, let him think of his greatness; and if it should be thrust from him (by fate), it will have the nature of not being thrust from him","t1":"Ulluva Thellaam Uyarvullal Matradhu","t2":"Thallinun Thallaamai Neerththu"},{"n":597,"c":60,"ct":"ஊக்கமுடைமை","ce":"On Exertion","l1":"சிதைவிடத்து ஒல்கார் உரவோர் புதையம்பிற்","l2":"பட்டுப்பா டூன்றுங் களிறு.","mv":"உடம்பை மறைக்குமளவு அம்புகளால் புண்பட்டும் யானைத் தன் பெருமையை நிலைநிறுத்தும், அதுபோல் ஊக்கம் உடையவர் அழிவு வந்தவிடத்திலும் தளர மாட்டார்.","ex":"The strong minded will not faint, even when all is lost; the elephant stands firm, even when wounded by a shower of arrows","t1":"Sidhaivitaththu Olkaar Uravor Pudhaiyampir","t2":"Pattuppaa Toondrung Kaliru"},{"n":598,"c":60,"ct":"ஊக்கமுடைமை","ce":"On Exertion","l1":"உள்ளம் இலாதவர் எய்தார் உலகத்து","l2":"வள்ளியம் என்னுஞ் செருக்கு.","mv":"ஊக்கம் இல்லாதவர் இவ்வுலகில் யாம் வண்மை உடையேம் என்றுத் தம்மைத் தான் எண்ணி மகிழும் மகிழ்ச்சியை அடையமாடடார்.","ex":"Those who have no (greatness of) mind, will not acquire the joy of saying in the world, \"we have excercised liaberality\"","t1":"Ullam Ilaadhavar Eydhaar Ulakaththu","t2":"Valliyam Ennunj Cherukku"},{"n":599,"c":60,"ct":"ஊக்கமுடைமை","ce":"On Exertion","l1":"பரியது கூர்ங்கோட்டது ஆயினும் யானை","l2":"஦வ்ருஉம் புலிதாக் குறின்.","mv":"யானை பருத்த உடம்பை உடையது, கூர்மையானக் கொம்புகளை உடையது, ஆயினும் ஊக்கமுள்ளதாகியப் புலி தாக்கினால் அதற்கு அஞ்சும்.","ex":"Although the elephant has a large body, and a sharp tusk, yet it fears the attack of the tiger","t1":"Pariyadhu Koorngottadhu Aayinum Yaanai","t2":"Veruum Pulidhaak Kurin"},{"n":600,"c":60,"ct":"ஊக்கமுடைமை","ce":"On Exertion","l1":"உரமொருவற்கு உள்ள வெறுக்கைஅஃ தில்லார்","l2":"மரம்மக்க ளாதலே வேறு.","mv":"ஒருவனுக்கு வலிமையானது ஊக்க மிகுதியே, அவ்வூக்கம் இல்லாதவர் மரங்களே, (வடிவால்) மக்களைப் போல் இருத்தலே வேறுபாடு.","ex":"Energy is mental wealth; those men who are destitute of it are only trees in the form of men","t1":"Uramoruvarku Ulla Verukkaiaq Thillaar","t2":"Marammakka Laadhale Veru"},{"n":601,"c":61,"ct":"மடியின்மை","ce":"Against Sloth","l1":"குடியென்னும் குன்றா விளக்கம் மடியென்னும்","l2":"மாசூர மாய்ந்து கெடும்.","mv":"ஒருவனுக்கு தன் குடியாகிய மங்காத விளக்கு, அவனுடைய சோம்பலாகிய மாசு படிய படிய ஒளி மங்கிக் கெட்டுவிடும்.","ex":"By the darkness, of idleness, the indestructible lamp of family (rank) will be extinguished","t1":"Kutiyennum Kundraa Vilakkam Matiyennum","t2":"Maasoora Maaindhu Ketum"},{"n":602,"c":61,"ct":"மடியின்மை","ce":"Against Sloth","l1":"மடியை மடியா ஒழுகல் குடியைக்","l2":"குடியாக வேண்டு பவர்.","mv":"தம் குடியைச் சிறப்புடைய குடியாக விளங்குமாறு செய்ய விரும்புகின்றவர் சோம்பலைச் சோம்பலாகக் கொண்டு முயற்சியுடையவராய் நடக்க வேண்டும்.","ex":"Let those, who desire that their family may be illustrious, put away all idleness from their conduct","t1":"Matiyai Matiyaa Ozhukal Kutiyaik","t2":"Kutiyaaka Ventu Pavar"},{"n":603,"c":61,"ct":"மடியின்மை","ce":"Against Sloth","l1":"மடிமடிக் கொண்டொழுகும் பேதை பிறந்த","l2":"குடிமடியும் தன்னினும் முந்து.","mv":"அழிக்கும் இயல்புடைய சோம்பலைத் தன்னிடம் கொண்டு நடக்கும் அறிவவில்லாதவன் பிறந்த குடி அவனுக்கு முன் அழிந்துவிடும்.","ex":"The (lustre of the) family of the ignorant man, who acts under the influence of destructive laziness will perish, even before he is dead","t1":"Matimatik Kontozhukum Pedhai Pirandha","t2":"Kutimatiyum Thanninum Mundhu"},{"n":604,"c":61,"ct":"மடியின்மை","ce":"Against Sloth","l1":"குடிமடிந்து குற்றம் பெருகும் மடிமடிந்து","l2":"மாண்ட உஞற்றி லவர்க்கு.","mv":"சோம்பலில் அகப்பட்டு சிறந்த முயற்சி இல்லாதவராய் வாழ்கின்றவர்க்கு குடியின் பெருமை அழிந்து குற்றம் பெருகும்.","ex":"Family (greatness) will be destroyed, and faults will increase, in those men who give way to laziness, and put forth no dignified exertions","t1":"Kutimatindhu Kutram Perukum Matimatindhu","t2":"Maanta Ugnatri Lavarkku"},{"n":605,"c":61,"ct":"மடியின்மை","ce":"Against Sloth","l1":"நெடுநீர் மறவி மடிதுயில் நான்கும்","l2":"கெடுநீரார் காமக் கலன்.","mv":"காலம் நீட்டித்தல், சோம்பல், மறதி, அளவு மீறியத் தூக்கம் ஆகிய இந் நான்கும் கெடுகின்ற இயல்புடையவர் விரும்பி ஏறும் மரக்கலமாம்.","ex":"Procrastination, forgetfulness, idleness, and sleep, these four things, form the vessel which is desired by those destined to destruction","t1":"Netuneer Maravi Matidhuyil Naankum","t2":"Ketuneeraar Kaamak Kalan"},{"n":606,"c":61,"ct":"மடியின்மை","ce":"Against Sloth","l1":"படியுடையார் பற்றமைந்தக் கண்ணும் மடியுடையார்","l2":"மாண்பயன் எய்தல் அரிது.","mv":"நாட்டை ஆளும் தலைவருடைய உறவுத் தானே வந்து சேர்ந்தாலும், சோம்பல் உடையவர் சிறந்த பயனை அடைய முடியாது.","ex":"It is a rare thing for the idle, even when possessed of the riches of kings who ruled over the whole earth, to derive any great benefit from it","t1":"Patiyutaiyaar Patramaindhak Kannum Matiyutaiyaar","t2":"Maanpayan Eydhal Aridhu"},{"n":607,"c":61,"ct":"மடியின்மை","ce":"Against Sloth","l1":"இடிபுரிந்து எள்ளுஞ் சொல் கேட்பர் மடிபுரிந்து","l2":"மாண்ட உஞற்றி லவர்.","mv":"சோம்பலை விரும்பி மேற்க் கொண்டு சிறந்த முயற்சி இல்லாதவராய் வாழ்கின்றவர் பிறர் இடித்துக் கூறி இகழ்கின்ற சொல்லைக் கேட்கும் நிலைமை அடைவர்.","ex":"Those who through idleness, and do not engage themselves in dignified exertion, will subject","t1":"Itipurindhu Ellunj Chol Ketpar","t2":"Matipurindhu Maanta Ugnatri Lavar"},{"n":608,"c":61,"ct":"மடியின்மை","ce":"Against Sloth","l1":"மடிமை குடிமைக்கண் தங்கின்தன் ஒன்னார்க்கு","l2":"அடிமை புகுத்தி விடும்.","mv":"சோம்பல் நல்ல குடியில் பிறந்தவனிடம் வந்து பொருந்தினால், அஃது அவனை அவனுடைய பகைவர்க்கு அடிமையாகுமாறு செய்துவிடும்.","ex":"If idleness take up its abode in a king of high birth, it will make him a slave of his enemies","t1":"Matimai Kutimaikkan Thangindhan Onnaarkku","t2":"Atimai Pukuththi Vitum"},{"n":609,"c":61,"ct":"மடியின்மை","ce":"Against Sloth","l1":"குடியாண்மை யுள்வந்த குற்றம் ஒருவன்","l2":"மடியாண்மை மாற்றக் கெடும்.","mv":"ஒருவன் சோம்பலை ஆளுந் தன்மையை மாற்றிவிட்டால் அவனுடைய குடியிலும் ஆண்மையிலும் வந்தக் குற்றம் தீர்ந்து விடும்.","ex":"When a man puts away idleness, the reproach which has come upon himself and his family will disappear","t1":"Kutiyaanmai Yulvandha Kutram Oruvan","t2":"Matiyaanmai Maatrak Ketum"},{"n":610,"c":61,"ct":"மடியின்மை","ce":"Against Sloth","l1":"மடியிலா மன்னவன் எய்தும் அடியளந்தான்","l2":"தாஅய தெல்லாம் ஒருங்கு.","mv":"அடியால் உலகத்தை அளந்த கடவுள் தாவியப் பரப்பு எல்லாவற்றையும் சோம்பல் இல்லாத அரசன் ஒரு சேர அடைவான்.","ex":"The king who never gives way to idleness will obtain entire possession of (the whole earth) passed over by him who measured (the worlds) with His foot","t1":"Matiyilaa Mannavan Eydhum Atiyalandhaan","t2":"Thaaaya Thellaam Orungu"},{"n":611,"c":62,"ct":"ஆள்வினையுடைமை","ce":"On Perseverance","l1":"அருமை உடைத்தென்று அசாவாமை வேண்டும்","l2":"பெருமை முயற்சி தரும்.","mv":"இது செய்வதற்கு அருமையாகாது என்று சோர்வுறாமல் இருக்க வேண்டும், அதைச் செய்வதற்க்குத் தக்க பெருமையை முயற்சி உண்டாக்கும்,","ex":"Yield not to the feebleness which says, \"this is too difficult to be done\"; labour will give the greatness (of mind) which is necessary (to do it)","t1":"Arumai Utaiththendru Asaavaamai Ventum","t2":"Perumai Muyarsi Tharum"},{"n":612,"c":62,"ct":"ஆள்வினையுடைமை","ce":"On Perseverance","l1":"வினைக்கண் வினைகெடல் ஓம்பல் வினைக்குறை","l2":"தீர்ந்தாரின் தீர்ந்தன்று உலகு.","mv":"தொழிலாகிய குறையைச் செய்யாமல் கைவிட்டவரை உலகம் கைவிடும், ஆகையால் தொழில் முயற்சி இல்லாதிருத்தலை ஒழிக்க வேண்டும்.","ex":"Take care not to give up exertion in the midst of a work; the world will abandon those who abandon their unfinished work","t1":"Vinaikkan Vinaiketal Ompal Vinaikkurai","t2":"Theerndhaarin Theerndhandru Ulaku"},{"n":613,"c":62,"ct":"ஆள்வினையுடைமை","ce":"On Perseverance","l1":"தாளாண்மை என்னும் தகைமைக்கண் தங்கிற்றே","l2":"வேளாண்மை என்னுஞ் செருக்கு.","mv":"பிறர்க்கு உதவிசெய்தல் என்னும் மேம்பட்ட நிலைமை முயற்சி என்று சொல்லப்படுகின்ற உயர்ந்த பண்பில் நிலைத்திருக்கின்றது.","ex":"The lustre of munificence will dwell only with the dignity of laboriousness or efforts","t1":"Thaalaanmai Ennum Thakaimaikkan Thangitre","t2":"Velaanmai Ennunj Cherukku"},{"n":614,"c":62,"ct":"ஆள்வினையுடைமை","ce":"On Perseverance","l1":"தாளாண்மை இல்லாதான் வேளாண்மை பேடிகை","l2":"வாளாண்மை போலக் கெடும்.","mv":"முயற்சி இல்லாதவன் உதவிசெய்பவனாக இருத்தல், பேடி தன் கையில் வாளை எடுத்தும் ஆளும் தன்மைபோல் நிறைவேறாமல் போகும்.","ex":"The liberality of him, who does not labour, will fail, like the manliness of a hermaphrodite, who has a sword in its hand","t1":"Thaalaanmai Illaadhaan Velaanmai Petikai","t2":"Vaalaanmai Polak Ketum"},{"n":615,"c":62,"ct":"ஆள்வினையுடைமை","ce":"On Perseverance","l1":"இன்பம் விழையான் வினைவிழைவான் தன்கேளிர்","l2":"துன்பம் துடைத்தூன்றும் தூண்.","mv":"தன் இன்பத்தை விரும்பாதவனாய் மேற்க்கொண்டச் செயலை முடிக்க விரும்புகிறவன், தன் சுற்றத்தாரின் துன்பத்தைப் போக்கித் தாங்குகின்ற தூண் ஆவான்.","ex":"He who desires not pleasure, but desires labour, will be a pillar to sustain his relations, wiping away their sorrows","t1":"Inpam Vizhaiyaan Vinaivizhaivaan Thankelir","t2":"Thunpam Thutaiththoondrum Thoon"},{"n":616,"c":62,"ct":"ஆள்வினையுடைமை","ce":"On Perseverance","l1":"முயற்சி திருவினை ஆக்கும் முயற்றின்மை","l2":"இன்மை புகுத்தி விடும்.","mv":"முயற்சி ஒருவனுக்குச் செல்வத்தைப் பெருகச் செய்யும், முயற்சி இல்லாதிருத்தல் அவனுக்கு வறுமையைச் சேர்த்துவிடும்.","ex":"Labour will produce wealth; idleness will bring poverty","t1":"Muyarsi Thiruvinai Aakkum Muyatrinmai","t2":"Inmai Pukuththi Vitum"},{"n":617,"c":62,"ct":"ஆள்வினையுடைமை","ce":"On Perseverance","l1":"மடியுளாள் மாமுகடி என்ப மடியிலான்","l2":"தாளுளான் தாமரையி னாள்.","mv":"ஒருவனுடைய சோம்பலில் கரிய மூதேவி வாழ்கின்றாள், சோம்பல் இல்லாதவனுடைய முயற்சியிலே திருமகள் வாழ்கின்றாள்.","ex":"They say that the black Mudevi (the goddess of adversity) dwells with laziness, and the Latchmi (the goddess of prosperity) dwells with the labour of the industrious","t1":"Matiyulaal Maamukati Enpa Matiyilaan","t2":"Thaalulaan Thaamaraiyi Naal"},{"n":618,"c":62,"ct":"ஆள்வினையுடைமை","ce":"On Perseverance","l1":"பொறியின்மை யார்க்கும் பழியன்று அறிவறிந்து","l2":"ஆள்வினை இன்மை பழி.","mv":"நன்மை விளைவிக்கும் ஊழ் இல்லாதிருத்தல் யார்க்கும் பழி அன்று, அறிய வேண்டியவற்றை அறிந்து முயற்சி செய்யாதிருத்தலே பழி.","ex":"Adverse fate is no disgrace to any one; to be without exertion and without knowing what should be known, is disgrace","t1":"Poriyinmai Yaarkkum Pazhiyandru Arivarindhu","t2":"Aalvinai Inmai Pazhi"},{"n":619,"c":62,"ct":"ஆள்வினையுடைமை","ce":"On Perseverance","l1":"தெய்வத்தான் ஆகா தெனினும் முயற்சிதன்","l2":"மெய்வருத்தக் கூலி தரும்.","mv":"ஊழியின் காரணத்தால் ஒரு செயல் செய்ய முடியாமல் போகுமாயினும், முயற்சி தன் உடம்பு வருந்திய வருத்தத்தின் கூலியையாவது கொடுக்கும்.","ex":"Although it be said that, through fate, it cannot be attained, yet labour, with bodily exertion, will yield its reward","t1":"Theyvaththaan Aakaa Theninum Muyarsidhan","t2":"Meyvaruththak Kooli Tharum"},{"n":620,"c":62,"ct":"ஆள்வினையுடைமை","ce":"On Perseverance","l1":"ஊழையும் உப்பக்கம் காண்பர் உலைவின்றித்","l2":"தாழாது உஞற்று பவர்.","mv":"சோர்வு இல்லாமல் முயற்சியில் குறைவு இல்லாமல் முயல்கின்றவர்,(செயலுக்கு இடையூறாக வரும்)ஊழையும் ஒரு காலத்தில் தோல்வியுறச் செய்யும்.","ex":"They who labour on, without fear and without fainting will see even fate (put) behind their back","t1":"Oozhaiyum Uppakkam Kaanpar Ulaivindrith","t2":"Thaazhaadhu Ugnatru Pavar"},{"n":621,"c":63,"ct":"இடுக்கணழியாமை","ce":"On Courage","l1":"இடுக்கண் வருங்கால் நகுக அதனை","l2":"அடுத்தூர்வது அஃதொப்ப தில்.","mv":"துன்பம் வரும்போது (அதற்காக கலங்காமல்) நகுதல் வேண்டும், அத் துன்பத்தை எதிர்த்து வெல்லவல்லது அதைப் போன்றது வேறு இல்லை.","ex":"If troubles come, laugh; there is nothing like that, to press upon and drive away sorrow","t1":"Itukkan Varungaal Nakuka Adhanai","t2":"Atuththoorvadhu Aqdhoppa Thil"},{"n":622,"c":63,"ct":"இடுக்கணழியாமை","ce":"On Courage","l1":"வெள்ளத் தனைய இடும்பை அறிவுடையான்","l2":"உள்ளத்தின் உள்ளக் கெடும்.","mv":"வெள்ளம் போல் அளவற்றதாய் வரும் துன்பமும், அறிவுடையவன் தன் உள்ளத்தினால் அத் துன்பத்தின் இயல்பை நினைத்த அளவில் கெடும்.","ex":"A flood of troubles will be overcome by the (courageous) thought which the minds of the wise will entertain, even in sorrow","t1":"Vellath Thanaiya Itumpai Arivutaiyaan","t2":"Ullaththin Ullak Ketum"},{"n":623,"c":63,"ct":"இடுக்கணழியாமை","ce":"On Courage","l1":"இடும்பைக்கு இடும்பை படுப்பர் இடும்பைக்கு","l2":"இடும்பை படாஅ தவர்.","mv":"துன்பம் வந்த போது அதற்க்காக வருந்திக் கலங்காதவர் அந்தத் துன்பத்திற்கே துன்பம் உண்டாக்கி அதை வென்று விடுவார்.","ex":"They give sorrow to sorrow, who in sorrow do not suffer sorrow","t1":"Itumpaikku Itumpai Patuppar Itumpaikku","t2":"Itumpai Pataaa Thavar"},{"n":624,"c":63,"ct":"இடுக்கணழியாமை","ce":"On Courage","l1":"மடுத்தவா யெல்லாம் பகடன்னான் உற்ற","l2":"இடுக்கண் இடர்ப்பாடு உடைத்து.","mv":"தடைபட்ட இடங்களில் எல்லாம் (வண்டியை இழுத்துச் செல்லும்) எருதுபோல் விடாமுயற்சி உடையவன் உற்றத் துன்பமே துன்பப்படுவதாகும்.","ex":"Troubles will vanish (i.e., will be troubled) before the man who (struggles against difficulties) as a","t1":"Matuththavaa Yellaam Pakatannaan Utra","t2":"Itukkan Itarppaatu Utaiththu"},{"n":625,"c":63,"ct":"இடுக்கணழியாமை","ce":"On Courage","l1":"அடுக்கி வரினும் அழிவிலான் உற்ற","l2":"இடுக்கண் இடுக்கட் படும்.","mv":"விடாமல் மேன் மேலும் துன்பம் வந்தபோதிலும் கலங்காமலிருக்கும் ஆற்றலுடையவன் அடைந்த துன்பமே துன்பப்பட்டு போகும்.","ex":"The troubles of that man will be troubled (and disappear) who, however thickly they may come upon him, does not abandon (his purpose)","t1":"Atukki Varinum Azhivilaan Utra","t2":"Itukkan Itukkat Patum"},{"n":626,"c":63,"ct":"இடுக்கணழியாமை","ce":"On Courage","l1":"அற்றேமென்று அல்லற் படுபவோ பெற்றேமென்று","l2":"ஓம்புதல் தேற்றா தவர்.","mv":"செல்வம் வந்த போது இதைப்பெற்றோமே என்று பற்றுக்கொண்டு காத்தறியாதவர் வறுமை வந்த போது இழந்தோமே என்று அல்லல்படுவரோ.","ex":"Will those men ever cry out in sorrow, \"we are destitute\" who, (in their prosperity), give not way to (undue desire) to keep their wealth","t1":"Atremendru Allar Patupavo Petremendru","t2":"Ompudhal Thetraa Thavar"},{"n":627,"c":63,"ct":"இடுக்கணழியாமை","ce":"On Courage","l1":"இலக்கம் உடம்பிடும்பைக் கென்று கலக்கத்தைக்","l2":"கையாறாக் கொள்ளாதாம் மேல்.","mv":"மேலோர், உடம்பு துன்பத்திற்கு இலக்கமானது என்று உணர்ந்து, (துன்பம் வந்த போது) கலங்குவதை ஒழுக்க நெறியாகக் கொள்ளமாட்டர்.","ex":"The great will not regard trouble as trouble, knowing that the body is the butt of trouble","t1":"Ilakkam Utampitumpaik Kendru Kalakkaththaik","t2":"Kaiyaaraak Kollaadhaam Mel"},{"n":628,"c":63,"ct":"இடுக்கணழியாமை","ce":"On Courage","l1":"இன்பம் விழையான் இடும்பை இயல்பென்பான்","l2":"துன்பம் உறுதல் இலன்.","mv":"இன்பமானதை விரும்பாதவனாய்த் துன்பம் இயற்கையானது என்று தெளிந்திருப்பவன், துன்பம் வந்த போது துன்ப முறுவது இல்லை.","ex":"That man never experiences sorrow, who does not seek for pleasure, and who considers distress to be natural (to man)","t1":"Inpam Vizhaiyaan Itumpai Iyalpenpaan","t2":"Thunpam Urudhal Ilan"},{"n":629,"c":63,"ct":"இடுக்கணழியாமை","ce":"On Courage","l1":"இன்பத்துள் இன்பம் விழையாதான் துன்பத்துள்","l2":"துன்பம் உறுதல் இலன்.","mv":"இன்பம் வந்திக் காலத்தில் அந்த இன்பத்தை விரும்பிப் போற்றாதவன் துன்பம் வந்த காலத்தில் அந்தத் துன்பத்தை அடைவது இல்லை.","ex":"He does not suffer sorrow, in sorrow who does not look for pleasure in pleasure","t1":"Inpaththul Inpam Vizhaiyaadhaan Thunpaththul","t2":"Thunpam Urudhal Ilan"},{"n":630,"c":63,"ct":"இடுக்கணழியாமை","ce":"On Courage","l1":"இன்னாமை இன்பம் எனக்கொளின் ஆகுந்தன்","l2":"ஒன்னார் விழையுஞ் சிறப்பு.","mv":"ஒருவன் துன்பத்தையே தனக்கு இன்பமாகக் கருதிக்கொள்வானானால் அவனுடைய பகைவரும் விரும்பத்தக்க சிறப்பு உண்டாகும்.","ex":"The elevation, which even his enemies will esteem, will be gained by him, who regards pain as pleasure","t1":"Innaamai Inpam Enakkolin Aakundhan","t2":"Onnaar Vizhaiyunj Chirappu"},{"n":631,"c":64,"ct":"அமைச்சு","ce":"On Ministers","l1":"கருவியும் காலமும் செய்கையும் செய்யும்","l2":"அருவினையும் மாண்டது அமைச்சு.","mv":"செயலுக்கு உரிய கருவியும், ஏற்றக் காலமும், செய்யும் வகையும் செய்யப்படும் அறியச் செயலும் சிறப்படையச் செய்ய வல்லவன் அமைச்சன்.","ex":"The minister is one who can make an excellent choice of means, time, manner of execution, and the difficult undertaking (itself)","t1":"Karuviyum Kaalamum Seykaiyum Seyyum","t2":"Aruvinaiyum Maantadhu Amaichchu"},{"n":632,"c":64,"ct":"அமைச்சு","ce":"On Ministers","l1":"வன்கண் குடிகாத்தல் கற்றறிதல் ஆள்வினையோடு","l2":"ஐந்துடன் மாண்டது அமைச்சு.","mv":"அஞ்சாமையும், குடிபிறப்பும், காக்கும் திறனும், கற்றறிந்த அறிவும் முயற்சியும் ஆகிய இவ்வைந்தும் திருந்தப்பெற்றவன் அமைச்சன்.","ex":"The minister is one who in addition to the aforesaid five things excels in the possession of firmness,","t1":"Vankan Kutikaaththal Katraridhal Aalvinaiyotu","t2":"Aindhutan Maantadhu Amaichchu"},{"n":633,"c":64,"ct":"அமைச்சு","ce":"On Ministers","l1":"பிரித்தலும் பேணிக் கொளலும் பிரிந்தார்ப்","l2":"பொருத்தலும் வல்ல தமைச்சு.","mv":"பகைவர்ககு துணையானவரைப் பிரித்தலும், தம்மிடம் உள்ளவரைக் காத்தலும், பிரிந்து கொண்டவரை மீண்டும் சேர்த்துக்கொள்ளலும் வல்லவன் அமைச்சன்.","ex":"The minister is one who can effect discord (among foes), maintain the good-will of his friends and restore to friendship those who have seceded (from him)","t1":"Piriththalum Penik Kolalum Pirindhaarp","t2":"Poruththalum Valla Thamaichchu"},{"n":634,"c":64,"ct":"அமைச்சு","ce":"On Ministers","l1":"தெரிதலும் தேர்ந்து செயலும் ஒருதலையாச்","l2":"சொல்லலும் வல்லது அமைச்சு.","mv":"(செய்யத்தக்க செயலை) ஆராய்தலும், அதற்குரிய வழிகளை ஆராய்ந்து செய்தலும், துணிவாகக் கருத்தைச் சொல்லுதலும் வல்லவன் அமைச்சன்.","ex":"The minister is one who is able to comprehend (the whole nature of an undertaking), execute it in the best manner possible, and offer assuring advice (in time of necessity)","t1":"Theridhalum Therndhu Seyalum Orudhalaiyaach","t2":"Chollalum Valladhu Amaichchu"},{"n":635,"c":64,"ct":"அமைச்சு","ce":"On Ministers","l1":"அறனறிந்து ஆன்றமைந்த சொல்லான்எஞ் ஞான்றுந்","l2":"திறனறிந்தான் தேர்ச்சித் துணை.","mv":"அறத்தை அறிந்தவனாய், அறிவு நிறைந்து அமைந்த சொல்லை உடையவனாய், எக்காலத்திலும் செயல்செய்யும் திறன் அறிந்தவனாய் உள்ளவன் ஆராய்ந்து கூறும் துணையாவான்.","ex":"He is the best helper (of the king) who understanding the duties, of the latter, is by his special learning, able to tender the fullest advice, and at all times conversant with the best method (of","t1":"Aranarindhu Aandramaindha Sollaanenj Gnaandrun","t2":"Thiranarindhaan Therchchith Thunai"},{"n":636,"c":64,"ct":"அமைச்சு","ce":"On Ministers","l1":"மதிநுட்பம் நூலோடு உடையார்க்கு அதிநுட்பம்","l2":"யாவுள முன்நிற் பவை.","mv":"இயற்கையான நுட்ப அறிவை நூலறிவோடு ஒருங்கே உடையவர்க்கு மிக்க நுட்பமான சூழ்ச்சிகளாய் முன் நிற்பவை எவை உள்ளன.","ex":"What (contrivances) are there so acute as to resist those who possess natural acuteness in addition to learning ?","t1":"Madhinutpam Noolotu Utaiyaarkku Adhinutpam","t2":"Yaavula Munnir Pavai"},{"n":637,"c":64,"ct":"அமைச்சு","ce":"On Ministers","l1":"செயற்கை அற஧ந்தக் கடைத்தும் உலகத்து","l2":"இயற்கை அறிந்து செயல்.","mv":"நூலறிவால் செயலைச் செய்யும் வகைகளைச் அறிந்த போதிலும் உலகத்தின் இயற்கையை அறிந்து அதனோடு பொருந்துமாறு செய்யவேண்டும்.","ex":"Though you are acquainted with the (theoretical) methods (of performing an act), understand the ways of the world and act accordingly","t1":"Seyarkai Arindhak Kataiththum Ulakaththu","t2":"Iyarkai Arindhu Seyal"},{"n":638,"c":64,"ct":"அமைச்சு","ce":"On Ministers","l1":"அறிகொன்று அறியான் எனினும் உறுதி","l2":"உழையிருந்தான் கூறல் கடன்.","mv":"அறிவுறுத்துவாரின் அறிவையையும் அழித்துத் தானும் அறியாதவனாக அரசன் இருந்தாலும், அமைச்சன் அவனுக்கு உறுதியானவற்றை எடுத்துக்கூறல் க‌டமையாகும்.","ex":"Although the king be utterly ignorant, it is the duty of the minister to give (him) sound advice","t1":"Arikondru Ariyaan Eninum Urudhi","t2":"Uzhaiyirundhaan Kooral Katan"},{"n":639,"c":64,"ct":"அமைச்சு","ce":"On Ministers","l1":"பழுதெண்ணும் மந்திரியின் பக்கததுள் தெவ்வோர்","l2":"எழுபது கோடி உறும்.","mv":"தவறான வழிகளை எண்ணி கூறுகின்ற அமைச்சனை விட எழுபது கோடி பகைவர் பக்கத்தில் இருந்தாலும் நன்மையாகும்.","ex":"Far better are seventy crores of enemies (for a king) than a minister at his side who intends (his) ruin","t1":"Pazhudhennum Mandhiriyin Pakkadhadhul Thevvor","t2":"Ezhupadhu Koti Urum"},{"n":640,"c":64,"ct":"அமைச்சு","ce":"On Ministers","l1":"முறைப்படச் சூழ்ந்தும் முடிவிலவே செய்வர்","l2":"திறப்பாடு இலாஅ தவர்.","mv":"(செயல்களைச் முடிக்கும்) திறன் இல்லாதவர், முன்னே எண்ணி வைத்திருந்தும் (செய்யும் போது) குறையானவைகளையேச் செய்வர்.","ex":"Those ministers who are destitute of (executive) ability will fail to carry out their projects, although they may have contrived aright","t1":"Muraippatach Choozhndhum Mutivilave Seyvar","t2":"Thirappaatu Ilaaa Thavar"},{"n":641,"c":65,"ct":"சொல்வன்மை","ce":"On Good Speech","l1":"நாநலம் என்னும் நலனுடைமை அந்நலம்","l2":"யாநலத்து உள்ளதூஉம் அன்று.","mv":"நாவன்மையாகிய நலம் ஒருவகைச் செல்வம் ஆகும், அந்த நாநலம் தனிச்சிறப்புடையது, ஆகையால் மற்ற எந்த நலங்களிலும் அடங்குவது அன்று.","ex":"The possession of that goodness which is called the goodness of speech is (even to others) better than any other goodness","t1":"Naanalam Ennum Nalanutaimai Annalam","t2":"Yaanalaththu Ulladhooum Andru"},{"n":642,"c":65,"ct":"சொல்வன்மை","ce":"On Good Speech","l1":"ஆக்கமுங் கேடும் அதனால் வருதலால்","l2":"காத்தோம்பல் சொல்லின்கட் சோர்வு.","mv":"ஆக்கமும் கேடும் சொல்லுகின்ற சொல்லால் வருவதால் ஒருவன் தன்னுடைய சொல்லிற்க்கு தவறு நேராமல் காத்துக்கொள்ள வேண்டும்","ex":"Since (both) wealth and evil result from (their) speech, ministers should most carefully guard themselves against faultiness therein","t1":"Aakkamung Ketum Adhanaal Varudhalaal","t2":"Kaaththompal Sollinkat Sorvu"},{"n":643,"c":65,"ct":"சொல்வன்மை","ce":"On Good Speech","l1":"கேட்டார்ப் பிணிக்கும் தகையவாய்க் கேளாரும்","l2":"வேட்ப மொழிவதாம் சொல்.","mv":"சொல்லும் போது கேட்டவரைத் தன் வயப்படுத்தும் பண்புகளுடன், கேட்காதவரும் கேட்க விரும்புமாறு கூறப்படுவது சொல்வன்மையாகும்.","ex":"The (minister's) speech is that which seeks (to express) elements as bind his friends (to himself) and is so delivered as to make even his enemies desire (his friendship)","t1":"Kettaarp Pinikkum Thakaiyavaaik Kelaarum","t2":"Vetpa Mozhivadhaam Sol"},{"n":644,"c":65,"ct":"சொல்வன்மை","ce":"On Good Speech","l1":"திறனறிந்து சொல்லுக சொல்லை அறனும்","l2":"பொருளும் அதனினூஉங்கு இல்.","mv":"சொல்லின் திறத்தை அறிந்து சொல்லை வழங்க வேண்டும், அத் தகைய சொல்வன்மையை விடச் சிறந்த அறமும் பொருளும் இல்லை.","ex":"Understand the qualities (of your hearers) and (then) make your speech; for superior to it, there is neither virtue nor wealth","t1":"Thiranarindhu Solluka Sollai Aranum","t2":"Porulum Adhaninooungu Il"},{"n":645,"c":65,"ct":"சொல்வன்மை","ce":"On Good Speech","l1":"சொல்லுக சொல்லைப் பிறிதோர்சொல் அச்சொல்லை","l2":"வெல்லுஞ்சொல் இன்மை அறிந்து.","mv":"வேறோரு சொல் அந்தச் சொல்லை வெல்லும் சொல்லாக இல்லாதிருந்தால் அறிந்த பிறகே சொல்லக்கருதியதைச் சொல்லவேண்டும்.","ex":"Deliver your speech, after assuring yourself that no counter speech can defeat your own","t1":"Solluka Sollaip Piridhorsol Achchollai","t2":"Vellunjol Inmai Arindhu"},{"n":646,"c":65,"ct":"சொல்வன்மை","ce":"On Good Speech","l1":"வேட்பத்தாஞ் சொல்லிப் பிறர்சொல் பயன்கோடல்","l2":"மாட்சியின் மாசற்றார் கோள்.","mv":"பிறர் விரும்பும் படியாகத் தாம் சொல்லின் பிறர் சொல்லும் போது அச் சொல்லின் பயனை ஆராய்ந்து கொள்ளுதல் மாசற்ற சிறப்புடையவரின் கொள்கையாகும்.","ex":"It is the opinion of those who are free from defects in diplomacy that the minister should speak so as to make his hearers desire (to hear more) and grasp the meaning of what he hears himself","t1":"Vetpaththaanj Chollip Pirarsol Payankotal","t2":"Maatchiyin Maasatraar Kol"},{"n":647,"c":65,"ct":"சொல்வன்மை","ce":"On Good Speech","l1":"சொலல்வல்லன் சோர்விலன் அஞ்சான் அவனை","l2":"இகல்வெல்லல் யார்க்கும் அரிது.","mv":"தான் கருதியவற்றை நன்கு சொல்ல வல்லவனாய் சொல்லும் போது சோர்வு இல்லாதவனாய், அஞ்சாதவனாய் உள்ளவனை மாறுபாட்டால் வெல்வது யார்க்கும் முடியாது.","ex":"It is impossible for any one to conquer him by intrique who possesses power of speech, and is neither faulty nor timid","t1":"Solalvallan Sorvilan Anjaan Avanai","t2":"Ikalvellal Yaarkkum Aridhu"},{"n":648,"c":65,"ct":"சொல்வன்மை","ce":"On Good Speech","l1":"விரைந்து தொழில்கேட்கும் ஞாலம் நிரந்தினிது","l2":"சொல்லுதல் வல்லார்ப் பெறின்.","mv":"கருத்துக்களை ஒழுங்காகக் கோர்த்து இனியாக சொல்ல வல்லவரைப் பெற்றால், உலகம் விரைந்து அவருடைய ஏவலைக் கேட்டு நடக்கும்.","ex":"If there be those who can speak on various subjects in their proper order and in a pleasing manner, the world would readily accept them","t1":"Viraindhu Thozhilketkum Gnaalam Nirandhinidhu","t2":"Solludhal Vallaarp Perin"},{"n":649,"c":65,"ct":"சொல்வன்மை","ce":"On Good Speech","l1":"பலசொல்லக் காமுறுவர் மன்றமா சற்ற","l2":"சிலசொல்லல் தேற்றா தவர்.","mv":"குற்றமற்றவையாகியச் சில சொற்களைச் சொல்லத் தெரியாதவர், உண்மையாகவே பலச் சொற்களைச் சொல்லிக்கொண்டிருக்க விரும்புவர்.","ex":"They will desire to utter many words, who do not know how to speak a few faultless ones","t1":"Palasollak Kaamuruvar Mandramaa Satra","t2":"Silasollal Thetraa Thavar"},{"n":650,"c":65,"ct":"சொல்வன்மை","ce":"On Good Speech","l1":"இண்ருழ்த்தும் நாறா மலரனையர் கற்றது","l2":"உணர விரித்துரையா தார்.","mv":"தாம் கற்ற நூற்ப் பொருளைப் பிறர் உணருமாறு விரிந்துரைக்க முடியாதவர், கொத்தாக மலர்ந்திருந்த போதிலும் மணம் கமழாத மலரைப் போன்றவர்.","ex":"Those who are unable to set forth their acquirements (before others) are like flowers blossoming in a cluster and yet without fragrance","t1":"Inaruzhththum Naaraa Malaranaiyar Katradhu","t2":"Unara Viriththuraiyaa Thaar"},{"n":651,"c":66,"ct":"வினைத்தூய்மை","ce":"On Purity in Action","l1":"துணைநலம் ஆக்கம் த்ருஉம் வினைநலம்","l2":"வேண்டிய எல்லாந் தரும்.","mv":"ஒருவனுக்கு வாய்த்த துணையின் நன்மை ஆக்கத்தைக் கொடுக்கும், செய்யும் வினையின் நன்மை அவன் விரும்பிய எல்லாவற்றையும் கொடுக்கும்.","ex":"The efficacy of support will yield (only) wealth; (but) the efficacy of action will yield all that is desired","t1":"Thunainalam Aakkam Tharuum Vinainalam","t2":"Ventiya Ellaan Tharum"},{"n":652,"c":66,"ct":"வினைத்தூய்மை","ce":"On Purity in Action","l1":"என்றும் ஒருவுதல் வேண்டும் புகழொடு","l2":"நன்றி பயவா வினை.","mv":"புகழையும் அறத்தையும் தாராத (தூய்மை அற்ற) செயல்களை எக்காலத்திலும் ஒருவன் செய்யாமல் விட்டொழிக்க வேண்டும்.","ex":"Ministers should at all times avoid acts which, in addition to fame, yield no benefit (for the future)","t1":"Endrum Oruvudhal Ventum Pukazhotu","t2":"Nandri Payavaa Vinai"},{"n":653,"c":66,"ct":"வினைத்தூய்மை","ce":"On Purity in Action","l1":"ஒஓதல் வேண்டும் ஒளிமாழ்கும் செய்வினை","l2":"ஆஅதும் என்னு மவர்.","mv":"மேன்மேலும் உயர்வோம் என்று விரும்பி முயல்கின்றவர் தம்முடைய புகழ் கெடுவதற்குக் காரணமான செயலைச் செய்யாமல் விட வேண்டும்.","ex":"Those who say, \"we will become (better)\" should avoid the performance of acts that would destroy (their fame)","t1":"Oodhal Ventum Olimaazhkum Seyvinai","t2":"Aaadhum Ennu Mavar"},{"n":654,"c":66,"ct":"வினைத்தூய்மை","ce":"On Purity in Action","l1":"இடுக்கண் படினும் இளிவந்த செய்யார்","l2":"நடுக்கற்ற காட்சி யவர்.","mv":"அசைவற்ற ‌தெளிந்த அறிவினையுடையவர், துன்பத்தில் சிக்குண்டாலும் (அத் துன்பத்தைத் தீர்ப்பதற்க்காகவும்) இழிவானச் செயல்களைச் செய்யமாட்டார்.","ex":"Those who have infallible judgement though threatened with peril will not do acts which have brought disgrace (on former ministers)","t1":"Itukkan Patinum Ilivandha Seyyaar","t2":"Natukkatra Kaatchi Yavar"},{"n":655,"c":66,"ct":"வினைத்தூய்மை","ce":"On Purity in Action","l1":"எற்றென்று இரங்குவ செய்யற்க செய்வானேல்","l2":"மற்றன்ன செய்யாமை நன்று.","mv":"பிறகு நினைத்து வருந்துவதற்குக் காரணமானச் செயல்களைச் செய்யக் கூடாது, ஒரு கால் தவறிச் செய்தாலும் மீண்டும் அத் தன்மையானவற்றைச் செய்யாதிருத்தல் நல்லது.","ex":"Let a minister never do acts of which he would have to grieve saying, \"what is this I have done\"; (but) should he do (them), it were good that he grieved not","t1":"Etrendru Iranguva Seyyarka Seyvaanel","t2":"Matranna Seyyaamai Nandru"},{"n":656,"c":66,"ct":"வினைத்தூய்மை","ce":"On Purity in Action","l1":"ஈன்றாள் பசிகாண்பான் ஆயினுஞ் செய்யற் க","l2":"சான்றோர் பழிக்கும் வினை.","mv":"பெற்ற தாயின் பசியைக் கண்டு வருந்த நேர்ந்தாலும், சான்றோர் பழிப்பதற்குக் காரணமான இழிவுற்றச் செயல்களைச் செய்யக்கூடாது.","ex":"Though a minister may see his mother starve; let him do not act which the wise would (treat with contempt)","t1":"Eendraal Pasikaanpaan Aayinunj Cheyyarka","t2":"Saandror Pazhikkum Vinai"},{"n":657,"c":66,"ct":"வினைத்தூய்மை","ce":"On Purity in Action","l1":"பழிமலைந்து எய்திய ஆக்கத்தின் சான்றோர்","l2":"கழிநல் குரவே தலை.","mv":"பழியை மேற்கொண்டு இழிதொழில் செய்து பெறும் செல்வத்தை விடச் சான்றோர் வினைத்தூய்மையோடிருந்து பெறும் பொல்லாத வறுமையே சிறந்தது.","ex":"Far more excellent is the extreme poverty of the wise than wealth obtained by heaping up of sinful","t1":"Pazhimalaindhu Eydhiya Aakkaththin Saandror","t2":"Kazhinal Kurave Thalai"},{"n":658,"c":66,"ct":"வினைத்தூய்மை","ce":"On Purity in Action","l1":"கடிந்த கடிந்தொரார் செய்தார்க்கு அவைதாம்","l2":"முடிந்தாலும் பீழை தரும்.","mv":"ஆகாதவை என விலக்கப்பட்ட செயல்களை விலக்கிவிடாமல் மேற்கொண்டு செய்தவர்க்கும், அச் செயல் நிறைவேறினாலும் துன்பமே கொடுக்கும்.","ex":"The actions of those, who have not desisted from doing deeds forbidden (by the great), will, even if they succeed, cause them sorrow","t1":"Katindha Katindhoraar Seydhaarkku Avaidhaam","t2":"Mutindhaalum Peezhai Tharum"},{"n":659,"c":66,"ct":"வினைத்தூய்மை","ce":"On Purity in Action","l1":"அழக் கொண்ட எல்லாம் அழப்போம் இழப்பினும்","l2":"பிற்பயக்கும் நற்பா லவை.","mv":"பிறர் வருந்துமாறு செய்து பெற்ற பொருள் எல்லாம் பெற்றவன் வருந்துமாறு செய்து போய்விடும், நல்வழியில் வந்தவை இழக்கப்பட்டாலும் பிறகு பயன் தரும்","ex":"All that has been obtained with tears (to the victim) will depart with tears (to himself); but what has been by fair means; though with loss at first, will afterwards yield fruit","t1":"Azhak Konta Ellaam Azhappom","t2":"Izhappinum Pirpayakkum Narpaa Lavai"},{"n":660,"c":66,"ct":"வினைத்தூய்மை","ce":"On Purity in Action","l1":"சலத்தால் பொருள்செய்தே மார்த்தல் பசுமண்","l2":"கலத்துள்நீர் பெய்திரீஇ யற்று.","mv":"வஞ்சனையான வழியால் பொருளைச்சேர்த்துக் காப்பாற்றுதல், பச்சை மண்கலத்தில் நீரை விட்டு அதைக் காப்பாற்றி வைத்தாற் போன்றது.","ex":"(For a minister) to protect (his king) with wealth obtained by foul means is like preserving a vessel of wet clay by filling it with water","t1":"Salaththaal Porulseydhe Maarththal Pasuman","t2":"Kalaththulneer Peydhireei Yatru"},{"n":661,"c":67,"ct":"வினைத்திட்பம்","ce":"On Resoluteness","l1":"வினைத்திட்பம் என்பது ஒருவன் மனத்திட்பம்","l2":"மற்றைய எல்லாம் பிற.","mv":"ஒரு தொழிலின் திட்பம் என்று சொல்லப்படுவது ஒருவனுடைய மனதின் திட்பமே (உறுதியே) ஆகும், மற்றவை எல்லாம் வேறானவை.","ex":"Firmness in action is (simply) one's firmness of mind; all other (abilities) are not of this nature","t1":"Vinaiththitpam Enpadhu Oruvan Manaththitpam","t2":"Matraiya Ellaam Pira"},{"n":662,"c":67,"ct":"வினைத்திட்பம்","ce":"On Resoluteness","l1":"ஊறொரால் உற்றபின் ஒல்காமை இவ்விரண்டின்","l2":"ஆறென்பர் ஆய்ந்தவர் கோள்.","mv":"இடையூறு வருவதற்கு முன்பே நீக்குதல், வந்த பின் தளராமை ஆகிய இந்த இரண்டினது வழியே வினைத்திட்பம் பற்றி ஆராய்ந்தவரின் கொள்கையாம்.","ex":"Not to perform a ruinous act, and not to be discouraged by the ruinous termination of an act, are the two maxims which, the wise say, from the principles of those who have investigated the subject","t1":"Oororaal Utrapin Olkaamai Ivvirantin","t2":"Aarenpar Aaindhavar Kol"},{"n":663,"c":67,"ct":"வினைத்திட்பம்","ce":"On Resoluteness","l1":"கடைக்கொட்கச் செய்தக்க தாண்மை இடைக்கொட்கின்","l2":"எற்றா விழுமந் தரும்.","mv":"செய்யும் செயலை முடிவில் வெளிப்படும் படியாக செய்யும் தகு
