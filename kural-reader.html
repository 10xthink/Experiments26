தியே ஆண்மையாகும், இடையில் வெளிபட்டால் நீங்காத துன்பத்தைக் கொடுக்கும்.","ex":"So to perform an act as to publish it (only) at its termination is (true) manliness; for to announce it beforehand, will cause irremediable sorrow","t1":"Kataikkotkach Cheydhakka Thaanmai Itaikkotkin","t2":"Etraa Vizhuman Tharum"},{"n":664,"c":67,"ct":"வினைத்திட்பம்","ce":"On Resoluteness","l1":"சொல்லுதல் யார்க்கும் எளிய அரியவாம்","l2":"சொல்லிய வண்ணம் செயல்.","mv":"இச் செயலை இவ்வாறு செய்து முடிக்கலாம் என்று சொல்லுதல் எவர்க்கும் எளியனவாம், சொல்லிய படி செய்து முடித்தல் அரியனவாம்.","ex":"To say (how an act is to be performed) is (indeed) easy for any one; but far difficult it is to do according to what has been said","t1":"Solludhal Yaarkkum Eliya Ariyavaam","t2":"Solliya Vannam Seyal"},{"n":665,"c":67,"ct":"வினைத்திட்பம்","ce":"On Resoluteness","l1":"வீறெய்தி மாண்டார் வினைத்திட்பம் வேந்தன்கண்","l2":"ஊறெய்தி உள்ளப் படும்.","mv":"செயல் திறனால் பெருமைபெற்று உயர்ந்தவரின் வினைத் திட்பமானது நாட்டை ஆளும் அரசனிடத்திலும் எட்டி மதிக்கப்பட்டு விளங்கும்.","ex":"The firmness in action of those who have become great by the excellence (of their counsel) will, by attaining its fulfilment in the person of the king, be esteemed (by all).","t1":"Veereydhi Maantaar Vinaiththitpam Vendhankan","t2":"Ooreydhi Ullap Patum"},{"n":666,"c":67,"ct":"வினைத்திட்பம்","ce":"On Resoluteness","l1":"எண்ணிய எண்ணியாங்கு எய்துவர் எண்ணியார்","l2":"திண்ணியர் ஆகப் பெறின்.","mv":"எண்ணியவர் (எண்ணியபடியே செயல் ஆற்றுவதில்) உறுதியுடையவராக இருக்கப்பெற்றால் அவர் எண்ணியவற்றை எண்ணியவாறே அடைவர்.","ex":"If those who have planned (an undertaking) possess firmness (in executing it) they will obtain what they have desired even as they have desired it","t1":"Enniya Enniyaangu Eydhu Enniyaar","t2":"Thinniyar Aakap Perin"},{"n":667,"c":67,"ct":"வினைத்திட்பம்","ce":"On Resoluteness","l1":"உருவுகண்டு எள்ளாமை வேண்டும் உருள்பெருந்தேர்க்கு","l2":"அச்சாணி அன்னார் உடைத்து.","mv":"உருளும் பெரிய தேர்க்கு அச்சில் இருந்து தாங்கும் சிறிய ஆணிப் போன்றவர்கள் உலகத்தில் உள்ளனர், அவர்களுடைய உருவின் சிறுமையைக்கண்டு இகழக் கூடாது.","ex":"Let none be despised for (their) size; (for) the world has those who resemble the linch-pin of the big rolling car","t1":"Uruvukantu Ellaamai Ventum Urulperundherkku","t2":"Achchaani Annaar Utaiththu"},{"n":668,"c":67,"ct":"வினைத்திட்பம்","ce":"On Resoluteness","l1":"கலங்காது கண்ட வினைக்கண் துளங்காது","l2":"தூக்கங் கடிந்து செயல்.","mv":"மனம் தளராமல் ஆராய்ந்து துணிந்து ஏற்றத் தொழிலைச் சோர்வு கொள்ளாமல் காலந் தாழ்த்தாமல் செய்து முடிக்க வேண்டும்.","ex":"An act that has been firmly resolved on must be as firmly carried out without delay","t1":"Kalangaadhu Kanta Vinaikkan Thulangaadhu","t2":"Thookkang Katindhu Seyal"},{"n":669,"c":67,"ct":"வினைத்திட்பம்","ce":"On Resoluteness","l1":"துன்பம் உறவரினும் செய்க துணிவாற்றி","l2":"இன்பம் பயக்கும் வினை.","mv":"(முடிவில்) இன்பம் கொடுக்கும் தொழிலைச் செய்யும் போது துன்பம் மிக வந்த போதிலும் துணிவு மேற்கொண்டு செய்து முடிக்க வேண்டும்.","ex":"Though it should cause increasing sorrow (at the outset), do with firmness the act that yield bliss (in the end)","t1":"Thunpam Uravarinum Seyka Thunivaatri","t2":"Inpam Payakkum Vinai"},{"n":670,"c":67,"ct":"வினைத்திட்பம்","ce":"On Resoluteness","l1":"எனைத்திட்பம் எய் தியக் கண்ணும் வினைத்திட்பம்","l2":"வேண்டாரை வேண்டாது உலகு.","mv":"வேறு எத்தகைய உறுதி உடையவராக இருந்தாலும், செய்யும் தொழிலில் உறுதி இல்லாதவரை உலகம் விரும்பிப் போற்றாது.","ex":"The great will not esteem those who esteem not firmness of action, whatever other abilities the latter may possess","t1":"Enaiththitpam Ey Thiyak Kannum","t2":"Vinaiththitpam Ventaarai Ventaadhu Ulaku"},{"n":671,"c":68,"ct":"வினைசெயல்வகை","ce":"On the Means of Action","l1":"சூழ்ச்சி முடிவு துணிவெய்தல் அத்துணிவு","l2":"தாழ்ச்சியுள் தங்குதல் தீது.","mv":"ஆராய்ந்து எண்ணுவதற்கு எல்லை துணிவு கொள்வதே ஆகும், அவ்வாறு கொண்ட துணிவு காலந் தாழ்த்து நிற்பது குற்றமாகும்.","ex":"Consultation ends in forming a resolution (to act); (but) delay in the execution of that resolve is an evil","t1":"Soozhchchi Mutivu Thuniveydhal Aththunivu","t2":"Thaazhchchiyul Thangudhal Theedhu"},{"n":672,"c":68,"ct":"வினைசெயல்வகை","ce":"On the Means of Action","l1":"தூங்குக தூங்கிச் செயற்பால தூங்கற்க","l2":"தூங்காது செய்யும் வினை.","mv":"காலந்தாழ்த்தி செய்யத் தக்கவற்றைக் காலந்தாழ்ந்தே செய்ய வேண்டும், காலந்தாழ்த்தாமல் விரைந்து செய்யவேண்டிய செயல்களைச் செய்ய காலந்தாழ்த்தக் கூடாது.","ex":"Sleep over such (actions) as may be slept over; (but) never over such as may not be slept over","t1":"Thoonguka Thoongich Cheyarpaala Thoongarka","t2":"Thoongaadhu Seyyum Vinai"},{"n":673,"c":68,"ct":"வினைசெயல்வகை","ce":"On the Means of Action","l1":"ஙல்லும்வா யெல்லாம் வினைநன்றே ஒல்லாக்கால்","l2":"செல்லும்வாய் நோக்கிச் செயல்.","mv":"இயலுமிடத்தில் எல்லாம் செயலைச் செய்து முடித்தல் நல்லது, இயலாவில்லையானால் பயன்படும் இடம் நோக்கியாவது செய்ய வேண்டும்.","ex":"Whenever it is possible (to overcome your enemy) the act (of fighting) is certainly good; if not, endeavour to employ some more successful method","t1":"Ollumvaa Yellaam Vinainandre Ollaakkaal","t2":"Sellumvaai Nokkich Cheyal"},{"n":674,"c":68,"ct":"வினைசெயல்வகை","ce":"On the Means of Action","l1":"வினைபகை என்றிரண்டின் எச்சம் நினையுங்கால்","l2":"தீயெச்சம் போலத் தெறும்.","mv":"செய்யத்தொடங்கியச் செயல், கொண்ட பகை என்று இவ்விரண்டின் குறை ஆராய்ந்து பார்த்தால், தீயின் குறைபோல் தெரியாமல் வளர்ந்து கெடுக்கும்.","ex":"When duly considered, the incomplete execution of an undertaking and hostility will grow and destroy one like the (unextinguished) remnant of a fire","t1":"Vinaipakai Endrirantin Echcham Ninaiyungaal","t2":"Theeyechcham Polath Therum"},{"n":675,"c":68,"ct":"வினைசெயல்வகை","ce":"On the Means of Action","l1":"பொருள்கருவி காலம் வினையிடனொடு ஐந்தும்","l2":"இருள்தீர எண்ணிச் செயல்.","mv":"வேண்டிய பொருள், ஏற்றக்கருவி, தக்க காலம், மேற்கொண்ட தொழில், உரிய இடம் ஆகிய ஐந்தினையும் மயக்கம் தீர எண்ணிச் செய்ய வேண்டும்.","ex":"Do an act after a due consideration of the (following) five, viz money, means, time, execution and place","t1":"Porulkaruvi Kaalam Vinaiyitanotu Aindhum","t2":"Iruldheera Ennich Cheyal"},{"n":676,"c":68,"ct":"வினைசெயல்வகை","ce":"On the Means of Action","l1":"முடிவும் இடையூறும் முற்றியாங்கு எய்தும்","l2":"படுபயனும் பார்த்துச் செயல்.","mv":"செயலை முடிக்கும் வகையும், வரக்கூடிய இடையூறும், முடிந்த போது கிடைக்கும் பெரும்பயனும் ஆகியவற்றை ஆராய்ந்து செய்ய வேண்டும்.","ex":"An act is to be performed after considering the exertion required, the obstacles to be encountered, and the great profit to be gained (on its completion)","t1":"Mutivum Itaiyoorum Mutriyaangu Eydhum","t2":"Patupayanum Paarththuch Cheyal"},{"n":677,"c":68,"ct":"வினைசெயல்வகை","ce":"On the Means of Action","l1":"செய்வினை செய்வான் செயன்முறை அவ்வினை","l2":"உள்ளறிவான் உள்ளம் கொளல்.","mv":"செயலைச் செய்கின்றவன் செய்ய வேண்டிய முறை, அச் செயலின் உண்மையான இயல்பை அறிந்தவனுடையக் கருத்தைத் தான் ஏற்றுக் கொள்ளவதாகும்","ex":"The method of performance for one who has begun an act is to ascertain the mind of him who knows the secret thereof","t1":"Seyvinai Seyvaan Seyanmurai Avvinai","t2":"Ullarivaan Ullam Kolal"},{"n":678,"c":68,"ct":"வினைசெயல்வகை","ce":"On the Means of Action","l1":"வினையான் வினையாக்கிக் கோடல் நனைகவுள்","l2":"யானையால் யானையாத் தற்று.","mv":"ஒரு செயலைச் செய்யும் போது அச் செயலால் மற்றொரு செயலையும் செய்து முடித்துக் கொள்ளல், ஒரு யானையால் மற்றொரு யானையைப் பிடித்தலைப் போன்றது.","ex":"To make one undertaking the means of accomplishing another (similar to it) is like making one rutting elephant the means of capturing another","t1":"Vinaiyaan Vinaiyaakkik Kotal Nanaikavul","t2":"Yaanaiyaal Yaanaiyaath Thatru"},{"n":679,"c":68,"ct":"வினைசெயல்வகை","ce":"On the Means of Action","l1":"நட்டார்க்கு நல்ல செயலின் விரைந்ததே","l2":"ஒட்டாரை ஒட்டிக் கொளல்.","mv":"பகைவராக உள்ளவரைப் பொருந்துமாறு சேர்த்துக் கொள்ளல், நண்பர்க்கு உதவியானவற்றை செய்தலைவிட விரைந்து செய்யத்தக்கதாகும்.","ex":"One should rather hasten to secure the alliance of the foes (of one's foes) than perform good offices to one's friends","t1":"Nattaarkku Nalla Seyalin Viraindhadhe","t2":"Ottaarai Ottik Kolal"},{"n":680,"c":68,"ct":"வினைசெயல்வகை","ce":"On the Means of Action","l1":"உறைசிறியார் உள்நடுங்கல் அஞ்சிக் குறைபெறின்","l2":"கொள்வர் பெரியார்ப் பணிந்து.","mv":"வலிமை குறைந்தவர், தம்மை சார்ந்துள்ளவர் நடுங்குவதற்காக தாம் அஞ்சி, வேண்டியது கிடைக்ககுமானால் வலிமைமிக்கவரைப் பணிந்தும் ஏற்றுக் கொள்வர்.","ex":"Ministers of small states, afraid of their people being frightened, will yield to and acknowledge their superior foes, if the latter offer them a chance of reconciliation","t1":"Uraisiriyaar Ulnatungal Anjik Kuraiperin","t2":"Kolvar Periyaarp Panindhu"},{"n":681,"c":69,"ct":"தூது","ce":"On Embassy","l1":"அன்புடைமை ஆன்ற குடிப்பிறத்தல் வேந்தவாம்","l2":"பண்புடைமை தூதுரைப்பான் பண்பு.","mv":"அன்புடையவனாதல், தகுதியானக் குடிப்பிறப்பு உடையவனாதல் அரசர் விரும்பும் சிறந்த பண்பு உடையவனாதல், ஆகிய இவை தூது உரைப்பவனுடையத் தகுதிகள்.","ex":"The qualification of an ambassador are affection (for his relations) a fitting birth, and the possession of attributes pleasing to royalty","t1":"Anputaimai Aandra Kutippiraththal Vendhavaam","t2":"Panputaimai Thoodhuraippaan Panpu"},{"n":682,"c":69,"ct":"தூது","ce":"On Embassy","l1":"அன்பறிவு ஆராய்ந்த சொல்வன்மை தூதுரைப்பார்க்கு","l2":"இன்றி யமையாத மூன்று.","mv":"அன்பு, அறிவு, ஆராய்ந்து சொல்கின்ற சொல் வன்மை ஆகிய இவை மூன்றும் தூது உரைப்பவர்க்கு இன்றியமையாத மூன்று பண்புகளாகும்.","ex":"Love (to his sovereign), knowledge (of his affairs), and a discriminating power of speech (before other sovereigns) are the three sine qua non qualifications of an ambassador","t1":"Anparivu Aaraaindha Solvanmai Thoodhuraippaarkku","t2":"Indri Yamaiyaadha Moondru"},{"n":683,"c":69,"ct":"தூது","ce":"On Embassy","l1":"நூலாருள் நூல்வல்லன் ஆகுதல் வேலாருள்","l2":"வென்றி வினையுரைப்பான் பண்பு.","mv":"அரசனிடம் சென்று தன் அரசனுடைய வெற்றிக்கு காரணமானச் செயலைப் பற்றித் தூது உரைப்பவன் திறம் நூலறிந்தவருள் நூல் வல்லவனாக விளங்குதல் ஆகும்.","ex":"To be powerful in politics among those who are learned (in ethics) is the character of him who speaks","t1":"Noolaarul Noolvallan Aakudhal Velaarul","t2":"Vendri Vinaiyuraippaan Panpu"},{"n":684,"c":69,"ct":"தூது","ce":"On Embassy","l1":"அறிவுரு வாராய்ந்த கல்விஇம் மூன்றன்","l2":"செறிவுடையான் செல்க வினைக்கு.","mv":"இயற்கை அறிவு, விரும்பத்தக்கத் தோற்றம், ஆராய்ச்சி உடையக் கல்வி ஆகிய இம் மூன்றின் பொருத்தம் உடையவன் தூது உரைக்கும் தொழிலுக்குச் செல்லலாம்.","ex":"He may go on a mission (to foreign rulers) who has combined in him all these three viz, (natural) sense, an attractive bearing and well-tried learning","t1":"Arivuru Vaaraaindha Kalviim Moondran","t2":"Serivutaiyaan Selka Vinaikku"},{"n":685,"c":69,"ct":"தூது","ce":"On Embassy","l1":"தொகச் சொல்லித் தூவாத நீக்கி நகச்சொல்லி","l2":"நன்றி பயப்பதாந் தூது.","mv":"பலவற்றைத் தொகுத்து சொல்லியும், அவற்றுள் பயனற்றவைகளை நீக்கியும், மகிழுமாறு சொல்லியும் தன் தலைவனுக்கு நன்மை உண்டாக்குகின்றவன் தூதன்.","ex":"He is an ambassador who (in the presence of foreign rulers) speaks briefly, avoids harshness, talks so as to make them smile, and thus brings good (to his own sovereign)","t1":"Thokach Chollith Thoovaadha Neekki","t2":"Nakachcholli Nandri Payappadhaan Thoodhu"},{"n":686,"c":69,"ct":"தூது","ce":"On Embassy","l1":"கற்றுக்கண் அஞ்சான் செலச்சொல்லிக் காலத்தால்","l2":"தக்கது அறிவதாம் தூது.","mv":"கற்பன கற்று, பிறருடைய பகையான பார்வைக்கு அஞ்சாமல் கேட்பவர் உள்ளத்தில் பதியுமாறு சொல்லி, காலத்திற்க்குப் பொருத்தமானதை அறிகின்றவனே தூதன்.","ex":"He is an ambassador who having studied (politics) talks impressively, is not afraid of angry looks, and knows (to employ) the art suited to the time","t1":"Katrukkan Anjaan Selachchollik Kaalaththaal","t2":"Thakkadhu Arivadhaam Thoodhu"},{"n":687,"c":69,"ct":"தூது","ce":"On Embassy","l1":"கடனறிந்து காலங் கருதி இடனறிந்து","l2":"எண்ணி உரைப்பான் தலை.","mv":"தன் கடமை இன்னதென்று தெளிவாக அறிந்து , அதை செய்வதற்கு ஏற்றக்காலத்தை எதிர்நோக்கி தக்க இடத்தையும் ஆராய்ந்து சொல்கின்றவனே தூதன்.","ex":"He is chief (among ambassadors) who understands the proper decorum (before foreign princes), seeks the (proper) occasion, knows the (most suitable) place, and delivers his message after (due)","t1":"Katanarindhu Kaalang Karudhi Itanarindhu","t2":"Enni Uraippaan Thalai"},{"n":688,"c":69,"ct":"தூது","ce":"On Embassy","l1":"தூய்மை துணைமை துணிவுடைமை இம்மூன்றின்","l2":"வாய்மை வழியுரைப்பான் பண்பு.","mv":"தூய ஒழுக்கம் உடையவனாதல், துணை உடையவனாதல், துணிவு உடையவனாதல் இந்த மூன்றும் வாய்த்திருத்தலே தூது உரைப்பவனுடைய தகுதியாகும்.","ex":"The qualifications of him who faithfully delivers his (sovereign's) message are purity, the support (of foreign ministers), and boldness, with truthfulness in addition to the (aforesaid) three","t1":"Thooimai Thunaimai Thunivutaimai Immoondrin","t2":"Vaaimai Vazhiyuraippaan Panpu"},{"n":689,"c":69,"ct":"தூது","ce":"On Embassy","l1":"விடுமாற்றம் வேந்தர்க்கு உரைப்பான் வடுமாற்றம்","l2":"வாய்சேரா வன்கணவன்.","mv":"குற்றமானச் சொற்களை வாய் சோர்ந்தும் சொல்லாத உறுதி உடையவனே அரசன் சொல்லியனுப்பிய சொற்களை மற்ற வேந்தர்க்கு உரைக்கும் தகுதியுடையவன்.","ex":"He alone is fit to communicate (his sovereign's) reply, who possesses the firmness not to utter even inadvertently what may reflect discredit (on the latter)","t1":"Vitumaatram Vendharkku Uraippaan Vatumaatram","t2":"Vaaiseraa Vanka Navan"},{"n":690,"c":69,"ct":"தூது","ce":"On Embassy","l1":"இறுதி பயப்பினும் எஞ்சாது இறைவற் கு","l2":"உறுதி பயப்பதாம் தூது.","mv":"தனக்கு அழிவே தருவதாக இருந்தாலும் அதற்காக அஞ்சி விட்டுவிடாமல், தன் அரசனுக்கு நன்மை உண்டாகுமாறு செய்கின்றவனே தூதன்.","ex":"He is the ambassador who fearlessly seeks his sovereign's good though it should cost him his life (to deliver his message)","t1":"Irudhi Payappinum Enjaadhu Iraivarku","t2":"Urudhi Payappadhaam Thoodhu"},{"n":691,"c":70,"ct":"மன்னரைச் சேர்ந்தொழுதல்","ce":"On Co-operation with King","l1":"அகலாது அணுகாது தீக்காய்வார் போல்க","l2":"இகல்வேந்தர்ச் சேர்ந்தொழுகு வார்.","mv":"அரசரைச் சார்ந்து வாழ்கின்றவர், அவரை மிக நீங்காமலும், மிக அணுகாமலும் நெருப்பில் குளிர் காய்கின்றவர் போல இருக்க வேண்டும்.","ex":"Thus let them act who dwell beneath of warlike kings the palace-roof","t1":"Akalaadhu Anukaadhu Theekkaaivaar Polka","t2":"Ikalvendharch Cherndhozhuku Vaar"},{"n":692,"c":70,"ct":"மன்னரைச் சேர்ந்தொழுதல்","ce":"On Co-operation with King","l1":"மன்னர் விழைப விழையாமை மன்னரால்","l2":"மன்னிய ஆக்கந் தரும்.","mv":"அரசர் விரும்புகின்றவர்களைத் தாம் விரும்பாமலிருத்தல் (அரசரைச் சார்ந்திருப்பவர்க்கு) அரசரால் நிலையான ஆக்கத்தைப் பெற்றுத் தரும்.","ex":"For ministers not to cover the things desired by their kings will through the kings themselves yield them everlasting wealth","t1":"Mannar Vizhaipa Vizhaiyaamai Mannaraal","t2":"Manniya Aakkan Tharum"},{"n":693,"c":70,"ct":"மன்னரைச் சேர்ந்தொழுதல்","ce":"On Co-operation with King","l1":"போற்றின் அரியவை போற்றல் கடுத்தபின்","l2":"தேற்றுதல் யார்க்கும் அரிது.","mv":".( அரசரைச் சார்ந்தவர்) தம்மைக் காத்துக் கொள்ள விரும்பினால் அரியத் தவறுகள் நேராமல் காத்துக்கொள்ள வேண்டும், ஐயுற்றபின் அரசரைத் தெளிவித்தல் எவர்க்கும் முடியாது.","ex":"Ministers who would save themselves should avoid (the commission of) serious errors for if the king's suspicion is once roused, no one can remove it","t1":"Potrin Ariyavai Potral Katuththapin","t2":"Thetrudhal Yaarkkum Aridhu"},{"n":694,"c":70,"ct":"மன்னரைச் சேர்ந்தொழுதல்","ce":"On Co-operation with King","l1":"செவிச்சொல்லும் சேர்ந்த நகையும் அவித்தொழுகல்","l2":"ஆன்ற பெரியா ரகத்து.","mv":"வல்லமை அமைந்த பெரியாரிடத்தில் (மற்றொருவன்) செவியை நெருங்கிச் சொல்லுதல் உடன் சேர்ந்து நகைத்தலும் செய்யாமல் ஒழுகவேண்டும்.","ex":"While in the presence of the sovereign, ministers should neither whisper to nor smile at others","t1":"Sevichchollum Serndha Nakaiyum Aviththozhukal","t2":"Aandra Periyaa Rakaththu"},{"n":695,"c":70,"ct":"மன்னரைச் சேர்ந்தொழுதல்","ce":"On Co-operation with King","l1":"எப்பொருளும் ஓரார் தொடரார்மற் றப்பொருளை","l2":"விட்டக்கால் கேட்க மறை.","mv":"(அரசர் மறைபொருள் பேசும் போது) எப்பொருளையும் உற்றுக் கேட்காமல் தொடர்ந்து வினவாமல் அப்பொருளை அவரே விட்டுச் சொன்னபோது கேட்டறிய வேண்டும்.","ex":"(When the king is engaged) in secret counsel (with others), ministers should neither over-hear anything whatever nor pry into it with inquisitive questions, but (wait to) listen when it is divulged (by","t1":"Epporulum Oraar Thotaraarmar Rapporulai","t2":"Vittakkaal Ketka Marai"},{"n":696,"c":70,"ct":"மன்னரைச் சேர்ந்தொழுதல்","ce":"On Co-operation with King","l1":"குறிப்பறிந்து காலங் கருதி வெறுப்பில","l2":"வேண்டுப வேட்பச் சொலல்.","mv":"அரசருடையக் குறிப்பை அறிந்து தக்கக் காலத்தை எதிர்நோக்கி, வெறுப்பில்லாதவற்றையும் விருப்பமானவற்றையும் அவர் விரும்புமாறுச் சொல்ல வேண்டும்.","ex":"Knowing the (king's disposition and seeking the right time, (the minister) should in a pleasing manner suggest things such as are desirable and not disagreeable","t1":"Kuripparindhu Kaalang Karudhi Veruppila","t2":"Ventupa Vetpach Cholal"},{"n":697,"c":70,"ct":"மன்னரைச் சேர்ந்தொழுதல்","ce":"On Co-operation with King","l1":"வேட்பன சொல்லி வினையில எஞ்ஞான்றும்","l2":"கேட்பினும் சொல்லா விடல்.","mv":"அரசர் விரும்புகின்றவற்றை மட்டும் சொல்லிப் பயனில்லாதவற்றை அவரே கேட்ட போதிலும் சொல்லாமல் விட வேண்டும்.","ex":"Ministers should (always) give agreeable advice but on no occasion recommend useless actions, though requested (to do so)","t1":"Vetpana Solli Vinaiyila Egngnaandrum","t2":"Ketpinum Sollaa Vital"},{"n":698,"c":70,"ct":"மன்னரைச் சேர்ந்தொழுதல்","ce":"On Co-operation with King","l1":"இளையர் இனமுறையர் என்றிகழார் நின்ற","l2":"ஒளியோடு ஒழுகப் படும்.","mv":"(அரசரை) எமக்கு இளையவர், எமக்கு இன்ன முறை உடையவர் என்று இகழாமல் அவருடைய நிலைக்கு ஏற்றவாறு அமைந்த புகழுடன் பொருந்த நடக்க வேண்டும்.","ex":"Ministers should behave in accordance with the (Divine) light in the person of kings and not despise them saying, \"He is our junior (in age) and connected with our family!\"","t1":"Ilaiyar Inamuraiyar Endrikazhaar Nindra","t2":"Oliyotu Ozhukap Patum"},{"n":699,"c":70,"ct":"மன்னரைச் சேர்ந்தொழுதல்","ce":"On Co-operation with King","l1":"கொளப்பட்டேம் என்றெண்ணிக் கொள்ளாத செய்யார்","l2":"துளக்கற்ற காட்சி யவர்.","mv":"அசைவற்ற தெளிந்த அறிவினை உடையவர் யாம் அரசரால் விரும்பப்பட்டோம் என்று எண்ணி அவர் விரும்பாதவற்றைச் செய்யமாட்டார்.","ex":"Those whose judgement is firm will not do what is disagreeable (to the sovereign) saying (within","t1":"Kolappattem Endrennik Kollaadha Seyyaar","t2":"Thulakkatra Kaatchi Yavar"},{"n":700,"c":70,"ct":"மன்னரைச் சேர்ந்தொழுதல்","ce":"On Co-operation with King","l1":"பழையம் எனக்கருதிப் பண்பல்ல செய்யும்","l2":"கெழுதகைமை கேடு தரும்.","mv":"யாம் அரசர்க்கு பழைமையானவராய் உள்ளோம் எனக்கருதித் தகுதி அல்லாதவற்றைச் செய்யும் உரிமை கேட்டைத்தரும்.","ex":"The (foolish) claim with which a minister does unbecoming acts because of his (long) familiarity (with the king) will ensure his ruin","t1":"Pazhaiyam Enakkarudhip Panpalla Seyyum","t2":"Kezhudhakaimai Ketu Tharum"},{"n":701,"c":71,"ct":"குறிப்பறிதல்","ce":"On Reading One's Intentions","l1":"கூறாமை நோக்க஧க் குறிப்பறிவான் எஞ்ஞான்றும்","l2":"மாறாநீர் வையக் கணி.","mv":"ஓருவர் சொல்லாமலே அவறுடைய முகத்தை நோக்கி அவர் கருதிய குறிப்பை அறிகின்றவன் எப்போதும் உலகத்திற்க்கு ஓர் அணிகலன் ஆவான்.","ex":"The minister who by looking (at the king) understands his mind without being told (of it), will be a perpetual ornament to the world which is surrounded by a never-drying sea","t1":"Kooraamai Nokkake Kuripparivaan Egngnaandrum","t2":"Maaraaneer Vaiyak Kani"},{"n":702,"c":71,"ct":"குறிப்பறிதல்","ce":"On Reading One's Intentions","l1":"ஐயப் படாஅது அகத்தது உணர்வானைத்","l2":"தெய்வத்தோ டொப்பக் கொளல்.","mv":"ஐயப்படாமல் மனத்தில் உள்ளதை உணரவல்லவனை (அவன் மனிதனே ஆனாலும்) தெய்வத் தோடு ஒப்பாக கொள்ள வேண்டும்.","ex":"He is to be esteemed a god who is able to ascertain without a doubt what is within (one's mind)","t1":"Aiyap Pataaadhu Akaththadhu Unarvaanaith","t2":"Theyvaththo Toppak Kolal"},{"n":703,"c":71,"ct":"குறிப்பறிதல்","ce":"On Reading One's Intentions","l1":"குறிப்பிற் குறிப்புணர் வாரை உறுப்பினுள்","l2":"யாது கொடுத்தும் கொளல்.","mv":"(முகம் கண் இவற்றின்) குறிப்புக்களால் உள்ள குறிப்பை உணர வல்லவரை நாட்டின் உறுப்புக்களுள் எதைக் கொடுத்தாவது துணையாக பெற்றுக்கொள்ள வேண்டும்.","ex":"The king should ever give whatever (is asked) of his belongings and secure him who, by the indications (of his own mind) is able to read those of another","t1":"Kurippir Kurippunar Vaarai Uruppinul","t2":"Yaadhu Kotuththum Kolal"},{"n":704,"c":71,"ct":"குறிப்பறிதல்","ce":"On Reading One's Intentions","l1":"குறித்தது கூறாமைக் கொள்வாரோ டேனை","l2":"உறுப்போ ரனையரால் வேறு.","mv":"ஒருவன் மனதில் கருதியதை அவன் கூறாமலே அறிந்து கொள்ள வல்லவரோடு மற்றவர் உறுப்பால் ஒத்தவராக இருந்தாலும் அறிவால் வேறுபட்டவர் ஆவார்.","ex":"Those who understand one's thoughts without being informed (thereof) and those who do not, may (indeed) resemble one another bodily; still are they different (mentally)","t1":"Kuriththadhu Kooraamaik Kolvaaro Tenai","t2":"Uruppo Ranaiyaraal Veru"},{"n":705,"c":71,"ct":"குறிப்பறிதல்","ce":"On Reading One's Intentions","l1":"குறிப்பிற் குறிப்புணரா வாயின் உறுப்பினுள்","l2":"என்ன பயத்தவோ கண்?","mv":"(முகம் கண் இவற்றின்) குறிப்புக்களால் உள்ளக்குறிப்பை உணராவிட்டால், ஒருவனுடைய உறுப்புகளுள் கண்கள் என்னப் பயன்படும்.","ex":"Of what use are the eyes amongst one's members, if they cannot by their own indications dive those of another ?","t1":"Kurippir Kurippunaraa Vaayin Uruppinul","t2":"Enna Payaththavo Kan?"},{"n":706,"c":71,"ct":"குறிப்பறிதல்","ce":"On Reading One's Intentions","l1":"அடுத்தது காட்டும் பளிங்குபோல் நெஞ்சம்","l2":"கடுத்தது காட்டும் முகம்.","mv":"தன்னை அடுத்தப் பொருளைத் தன்னிடம் காட்டும் பளிங்கு போல், ஒருவனுடைய நெஞ்சில் மிகுந்துள்ளதை அவனுடைய முகம் காட்டும்.","ex":"As the mirror reflects what is near so does the face show what is uppermost in the mind","t1":"Atuththadhu Kaattum Palingupol Nenjam","t2":"Katuththadhu Kaattum Mukam"},{"n":707,"c":71,"ct":"குறிப்பறிதல்","ce":"On Reading One's Intentions","l1":"முகத்தின் முதுக்குறைந்தது உண்டோ உவப்பினும்","l2":"காயினும் தான்முந் துறும்.","mv":"ஒருவன் விருப்பம் கொண்டாலும், வெறுப்புக் கொண்டாலும் அவனுடைய முகம் முற்ப்பட்டு அதைத் தெரிவிக்கும், அம் முகத்தைவிட அறிவு மிக்கது உண்டோ.","ex":"Is there anything so full of knowledge as the face ? (No) it precedes the mind, whether (the latter is) pleased or vexed","t1":"Mukaththin Mudhukkuraindhadhu Unto Uvappinum","t2":"Kaayinum Thaanmun Thurum"},{"n":708,"c":71,"ct":"குறிப்பறிதல்","ce":"On Reading One's Intentions","l1":"முகம்நோக்கி நிற்க அமையும் அகம்நோக்கி","l2":"உற்ற துணர்வார்ப் பெறின்.","mv":"உள்ளக் குறிப்பை நோக்கி உற்றதை உணரவல்லவரைப் பெற்றால், (அவரிடம் எதையும் கூறாமல்) அவறுடைய முகத்தை நோக்கி நின்றால் போதும்.","ex":"If the king gets those who by looking into his mind can understand (and remove) what has occurred (to him) it is enough that he stand looking at their face","t1":"Mukamnokki Nirka Amaiyum Akamnokki","t2":"Utra Thunarvaarp Perin"},{"n":709,"c":71,"ct":"குறிப்பறிதல்","ce":"On Reading One's Intentions","l1":"பகைமையும் கேண்மையும் கண்ணுரைக்கும் கண்ணின்","l2":"வகைமை உணர்வார்ப் பெறின்.","mv":"கண்பார்வையின் வேறுபாடுகளை உணரவல்லவரைப் பெற்றால்( ஒருவனுடைய மனதில் உள்ள) கையையும் நட்பையும் அவனுடைய கண்களே சொல்லி விடும்.","ex":"If a king gets ministers who can read the movements of the eye, the eyes (of foreign kings) will (themselves) reveal (to him) their hatred or friendship","t1":"Pakaimaiyum Kenmaiyum Kannuraikkum Kannin","t2":"Vakaimai Unarvaarp Perin"},{"n":710,"c":71,"ct":"குறிப்பறிதல்","ce":"On Reading One's Intentions","l1":"நுண்ணியம் என்பார் அளக்குங்கோல் காணுங்கால்","l2":"கண்ணல்லது இல்லை பிற.","mv":"யாம் நுட்பமான அறிவுடையேம் என்று பிறர் கருத்தை அறிபவரின் அளக்குங்கோல், ஆராய்ந்து பார்த்தால் அவனுடையக் கண்களே அல்லாமல் வேறு இல்லை.","ex":"The measuring-rod of those (ministers) who say \"we are acute\" will on inquiry be found to be their (own) eyes and nothing else","t1":"Nunniyam Enpaar Alakkungol Kaanungaal","t2":"Kannalladhu Illai Pira"},{"n":711,"c":72,"ct":"அவையறிதல்","ce":"On Knowing the Assembly","l1":"அவையறிநது ஆராய்ந்து சொல்லுக சொல்லின்","l2":"தொகையறிந்த தூய்மை யவர்.","mv":"சொற்களின் தொகுதி அறிந்த தூய்மை உடையவர், அவைக்களத்தின் தன்மை அறிந்து ஏற்றச் சொற்களை ஆராய்ந்து சொல்ல வேண்டும்.","ex":"Let the pure who know the arrangement of words speak with deliberation after ascertaining (the nature of) the court (then assembled)","t1":"Avaiyarinadhu Aaraaindhu Solluka Sollin","t2":"Thokaiyarindha Thooimai Yavar"},{"n":712,"c":72,"ct":"அவையறிதல்","ce":"On Knowing the Assembly","l1":"இடைதெரிந்து நன்குணர்ந்து சொல்லுக சொல்லின்","l2":"நடைதெரிந்த நன்மை யவர்.","mv":"சொற்களின் தன்மையை ஆராய்ந்த நன்மை உடையவர், அவையின் செவ்வியை ஆராய்ந்து நன்றாக உணர்ந்து சொல்ல வேண்டும்.","ex":"Let the good who know the uses of words speak with a clear knowledge after ascertaining the time (suited to the court)","t1":"Itaidherindhu Nankunarndhu Solluka Sollin","t2":"Nataidherindha Nanmai Yavar"},{"n":713,"c":72,"ct":"அவையறிதல்","ce":"On Knowing the Assembly","l1":"அவையறியார் சொல்லல்மேற் கொள்பவர் சொல்லின்","l2":"வகையறியார் வல்லதூஉம் இல்.","mv":"அவையின் தன்மை அறியாமல் சொல்லுதலை மேற்கொள்கின்றவர், சொற்களின் வகை அறியாதவரே, அவர் சொல்லவல்லதும் இல்லை.","ex":"Those who undertake to speak without knowing the (nature of the) court are ignorant of the quality of words as well as devoid of the power (of learning)","t1":"Avaiyariyaar Sollalmer Kolpavar Sollin","t2":"Vakaiyariyaar Valladhooum Il"},{"n":714,"c":72,"ct":"அவையறிதல்","ce":"On Knowing the Assembly","l1":"ஒளியார்முன் ஒள்ளிய ராதல் வெளியார்முன்","l2":"வான்சுதை வண்ணம் கொளல்.","mv":"அறிவிற் சிறந்தவரின் முன் தானும் அறிவிற் சிறந்தவராக நடந்து கொள்ள வேண்டும், அறிவில்லாதவர் முன் தாமும் வெண் கண்ணம் போல் அறிவில்லாதவராய் இருக்க வேண்டும்.","ex":"Ministers should be lights in the assembly of the enlightned, but assume the pure whiteness of mortar (ignorance) in that of fools","t1":"Oliyaarmun Olliya Raadhal Veliyaarmun","t2":"Vaansudhai Vannam Kolal"},{"n":715,"c":72,"ct":"அவையறிதல்","ce":"On Knowing the Assembly","l1":"நன்றென்ற வற்றுள்ளும் நன்றே முதுவருள்","l2":"முந்து கிளவாச் செறிவு.","mv":"அறிவு மிகுந்தவரிடையே முந்திச் சென்று பேசாத அடக்கம் ஒருவனுக்கு நன்மை என்று சொல்லப்பட்டவை எல்லாவற்றிலும நல்லது.","ex":"The modesty by which one does not rush forward and speak in (an assembly of) superiors is the best among all (one's) good qualities","t1":"Nandrendra Vatrullum Nandre Mudhuvarul","t2":"Mundhu Kilavaach Cherivu"},{"n":716,"c":72,"ct":"அவையறிதல்","ce":"On Knowing the Assembly","l1":"ஆற்றின் நிலைதளர்ந் தற்றே வியன்புலம்","l2":"ஏற்றுணர்வார் முன்னர் இழுக்கு.","mv":"விரிவான அறிவுத்துறைகளை அறிந்து உணர்கின்றவரின் முன்னே குற்றப்படுதல், ஒழுக்கநெறியிலிருந்து நிலைத் தளர்ந்து கெடுவதைப் போன்றதாகும்.","ex":"(For a minister) to blunder in the presence of those who have acquired a vast store of learning and know (the value thereof) is like a good man stumbling (and falling away) from the path (of virtue)","t1":"Aatrin Nilaidhalarn Thatre Viyanpulam","t2":"Etrunarvaar Munnar Izhukku"},{"n":717,"c":72,"ct":"அவையறிதல்","ce":"On Knowing the Assembly","l1":"கற்றறிந்தார் கல்வி விளங்கும் கசடறச்","l2":"சொல்தெரிதல் வல்லார் அகத்து.","mv":"குற்றமறச்சொற்களை ஆராயவதில் வ ல்ல அறிஞர்களிடத்தில் பல நூல்களைக் கற்றறிந்தவரின் கல்வியானது நன்றாக விளங்கித் தொன்றும்.","ex":"The learning of those who have read and understood (much) will shine in the assembly of those who faultlessly examine (the nature of) words","t1":"Katrarindhaar Kalvi Vilangum Kasatarach","t2":"Choldheridhal Vallaar Akaththu"},{"n":718,"c":72,"ct":"அவையறிதல்","ce":"On Knowing the Assembly","l1":"உணர்வ துடையார்முன் சொல்லல் வளர்வதன்","l2":"பாத்தியுள் நீர்சொரிந் தற்று.","mv":"தாமே உணர்கின்ற தன்மை உடையவரின் முன் கற்றவர் பேசுதல், தானே வளரும் பயிருள்ள பாத்தியில் நீரைச் சொரிந்தாற் போன்றது.","ex":"Lecturing to those who have the ability to understand (for themselves) is like watering a bed of plants that are growing (of themselves)","t1":"Unarva Thutaiyaarmun Sollal Valarvadhan","t2":"Paaththiyul Neersorin Thatru"},{"n":719,"c":72,"ct":"அவையறிதல்","ce":"On Knowing the Assembly","l1":"புல்லவையுள் பொச்சாந்தும் சொல்லற்க நல்லவையுள்","l2":"நன்குசலச் சொல்லு வார்.","mv":"நல்ல அறிஞரின் அவையில் நல்ல பொருளைப் மனதில் பதியுமாறு சொல்லவல்லவர், அறிவில்லாதவரின் கூட்டத்தில் மறந்தும் பேசக் கூடாது.","ex":"Those who are able to speak good things impressively in an assembly of the good should not even forgetfully speak them in that of the low","t1":"Pullavaiyul Pochchaandhum Sollarka Nallavaiyul","t2":"Nankusalach Chollu Vaar"},{"n":720,"c":72,"ct":"அவையறிதல்","ce":"On Knowing the Assembly","l1":"அங்கணத்துள் உக்க அமிழ்தற்றால் தங்கணத்தார்","l2":"அல்லார்முன் கோட்டி கொளல்.","mv":"தன் இனத்தார் அல்லாதவரின் கூட்டத்தில் முன் ஒரு பொருளைப்பற்றி பேசுதல், தூய்மையில்லாத முற்றத்தில் சிந்திய அமிழ்தம் போன்றது.","ex":"To utter (a good word) in the assembly of those who are of inferior rank is like dropping nectar on the ground","t1":"Anganaththul Ukka Amizhdhatraal Thanganaththaar","t2":"Allaarmun Kotti Kolal"},{"n":721,"c":73,"ct":"அவையஞ்சாமை","ce":"Not to be Afraid of Assembly","l1":"வகையறிந்து வல்லவை வாய்சோரார் சொல்லின்","l2":"தொகையறிந்த தூய்மை யவர்.","mv":"சொற்களின் தூய்மை தொகுதி அறிந்த தூய்மை உடையவர், அவைக்களத்தின் வகையினை அறிந்து, வல்லவறின் அவையில் வாய்ச் சோர்ந்து பிழை சொல்லமாட்டார்.","ex":"The pure who know the classification of words having first ascertained the nature (of the court) will not (through fear) falter in their speech before the powerful body","t1":"Vakaiyarindhu Vallavai Vaaisoraar Sollin","t2":"Thokaiyarindha Thooimai Yavar"},{"n":722,"c":73,"ct":"அவையஞ்சாமை","ce":"Not to be Afraid of Assembly","l1":"கற்றாருள் கற்றார் எனப்படுவர் கற்றார்முன்","l2":"கற்ற செலச்சொல்லு வார்.","mv":"கற்றவரின் முன் தாம் கற்றவைகளைச் அவருடைய மனதில் பதியுமாறுச் சொல்லவல்லவர், கற்றவர் எல்லாரிலும் கற்றவராக மதித்துச் சொல்லப்படுவார்.","ex":"Those who can agreeably set forth their acquirements before the learned will be regarded as the most learned among the learned","t1":"Katraarul Katraar Enappatuvar Katraarmun","t2":"Katra Selachchollu Vaar"},{"n":723,"c":73,"ct":"அவையஞ்சாமை","ce":"Not to be Afraid of Assembly","l1":"பகையகத்துச் சாவார் எளியர் அரியர்","l2":"அவையகத்து அஞ்சா தவர்.","mv":"பகைவர் உள்ள போர்க்களத்தில் (அஞ்சாமல் சென்று) சாகத் துணிந்தவர் உலகத்தில் பலர், கற்றவரின் அவைக்களத்தில் பேச வல்லவர் சிலரே.","ex":"Many indeed may (fearlessly) die in the presence of (their) foes; (but) few are those who are fearless in the assembly (of the learned)","t1":"Pakaiyakaththuch Chaavaar Eliyar Ariyar","t2":"Avaiyakaththu Anjaa Thavar"},{"n":724,"c":73,"ct":"அவையஞ்சாமை","ce":"Not to be Afraid of Assembly","l1":"கற்றார்முன் கற்ற செலச்சொல்லித் தாம்கற்ற","l2":"மிக்காருள் மிக்க கொளல்.","mv":"கற்றவரின் முன் தான் கற்றவைகளை அவருடைய மனதில் பதியுமாறு சொல்லி, மிகுதியாகக் கற்றவரிடம் அம்மிகுதியான கல்வியைக் அறிந்து கொள்ள வேண்டும்.","ex":"(Ministers) should agreeably set forth their acquirements before the learned and acquire more (knowledge) from their superiors (in learning)","t1":"Katraarmun Katra Selachchollith Thaamkatra","t2":"Mikkaarul Mikka Kolal"},{"n":725,"c":73,"ct":"அவையஞ்சாமை","ce":"Not to be Afraid of Assembly","l1":"ஆற்றின் அளவறிந்து கற்க அவையஞ்சா","l2":"மாற்றங் கொடுத்தற் பொருட்டு.","mv":"அவையில் (ஒன்றைக் கேட்டவர்க்கு) அஞ்சாது விடைகூறும் பொருட்டாக நூல்களைக் கற்க்கும் நெறியில் அளவை நூல் அறிந்து கற்க வேண்டும்.","ex":"In order to reply fearlessly before a foreign court, (ministers) should learn logic according to the rules (of grammar)","t1":"Aatrin Alavarindhu Karka Avaiyanjaa","t2":"Maatrang Kotuththar Poruttu"},{"n":726,"c":73,"ct":"அவையஞ்சாமை","ce":"Not to be Afraid of Assembly","l1":"வாளொடென் வன்கண்ணர் அல்லார்க்கு நூலொடென்","l2":"நுண்ணவை அஞ்சு பவர்க்கு.","mv":"அஞ்சாத வீரர் அல்லாத மற்றவர்க்கு வாளோடு என்ன தொடர்பு உண்டு, நுண்ணறிவுடையவரின் அவைக்கு அஞ்சுகின்றவர்க்கு நூலோடு என்ன தொடர்பு உண்டு.","ex":"What have they to do with a sword who are not valiant, or they with learning who are afraid of an intelligent assembly ?","t1":"Vaaloten Vankannar Allaarkku Nooloten","t2":"Nunnavai Anju Pavarkku"},{"n":727,"c":73,"ct":"அவையஞ்சாமை","ce":"Not to be Afraid of Assembly","l1":"பகையகத்துப் பேடிகை ஒள்வாள் அவையகத்து","l2":"அஞ்சு மவன்கற்ற நூல்.","mv":"அவையினிடத்தில் அஞ்சுகின்றவன் கற்ற நூல், பகைவரின் போர்க்களத்தில் அஞ்சுகின்ற பேடியின் கையில் உள்ள கூர்மையான வாள் போன்றது.","ex":"The learning of him who is diffident before an assembly is like the shining sword of an hermaphrodite in the presence of his foes","t1":"Pakaiyakaththup Petikai Olvaal Avaiyakaththu","t2":"Anju Mavankatra Nool"},{"n":728,"c":73,"ct":"அவையஞ்சாமை","ce":"Not to be Afraid of Assembly","l1":"பல்லவை கற்றும் பயமிலரே நல்லவையுள்","l2":"நன்கு செலச்சொல்லா தார்.","mv":"நல்ல அறிஞரின் அவையில் நல்லப் பொருளைக் கேட்பவர் மனதில் பதியுமாறு சொல்ல முடியாதவர், பல நூல்களைக் கற்றாலும் பயன் இல்லாதவரே.","ex":"Those who cannot agreeably speak good things before a good assembly are indeed unprofitable persons inspite of all their various acquirements","t1":"Pallavai Katrum Payamilare Nallavaiyul","t2":"Nanku Selachchollaa Thaar"},{"n":729,"c":73,"ct":"அவையஞ்சாமை","ce":"Not to be Afraid of Assembly","l1":"கல்லா தவரின் கடையென்ப கற்றறிந்தும்","l2":"நல்லா ரவையஞ்சு வார்.","mv":"நூல்களைக் கற்றிந்த போதிலும் நல்ல அறிஞரின் அவைக்கு அஞ்சுகின்றவர், கல்லாதவரை விடக் கடைப்பட்டவர் என்று கூறுவர்.","ex":"They who, though they have learned and understood, are yet afraid of the assembly of the good, are said to be inferior (even) to the illiterate","t1":"Kallaa Thavarin Kataiyenpa Katrarindhum","t2":"Nallaa Ravaiyanju Vaar"},{"n":730,"c":73,"ct":"அவையஞ்சாமை","ce":"Not to be Afraid of Assembly","l1":"உளரெனினும் இல்லாரொடு ஒப்பர் களன்அஞ்சிக்","l2":"கற்ற செலச்சொல்லா தார்.","mv":"அவைக்களத்திற்கு அஞ்சித் தாம் கற்றவைகளைக் (கேட்பவர் மனத்தில்) பதியுமாறு சொல்ல முடியாதவர், உயிரோடு வாழ்ந்தலும் இறந்தவர்க்கு ஒப்பாவர்.","ex":"Those who through fear of the assembly are unable to set forth their learning in an interesting manner, though alive, are yet like the dead","t1":"Ulareninum Illaarotu Oppar Kalananjik","t2":"Katra Selachchollaa Thaar"},{"n":731,"c":74,"ct":"நாடு","ce":"On the Country","l1":"தள்ளா விளையுளும் தக்காரும் தாழ்விலாச்","l2":"செல்வரும் சேர்வது நாடு.","mv":"குறையாத விளைபொருளும் தக்க அறிஞரும் கேடில்லாத செல்வம் உடையவரும் கூடிப் பொருந்தியுள்ள நாடே நாடாகும்.","ex":"A kingdom is that in which (those who carry on) a complete cultivation, virtuous persons, and","t1":"Thallaa Vilaiyulum Thakkaarum Thaazhvilaach","t2":"Chelvarum Servadhu Naatu"},{"n":732,"c":74,"ct":"நாடு","ce":"On the Country","l1":"பெரும்பொருளால் பெட்டக்க தாகி அருங்கேட்டால்","l2":"ஆற்ற விளைவது நாடு.","mv":"மிக்க பொருள் வளம் உடையதாய், எல்லோரும் விரும்பத்தக்கதாய் கேடு இல்லாததாய், மிகுதியாக விளைபொருள் தருவதே நாடாகும்.","ex":"A kingdom is that which is desire for its immense wealth, and which grows greatly in prosperity, being free from destructive causes","t1":"Perumporulaal Pettakka Thaaki Arungettaal","t2":"Aatra Vilaivadhu Naatu"},{"n":733,"c":74,"ct":"நாடு","ce":"On the Country","l1":"பொறையொருங்கு மேல்வருங்கால் தாங்கி இறைவற்கு","l2":"இறையொருங்கு நேர்வது நாடு.","mv":"(மற்ற நாட்டு மக்கள் குடியேறுவதால்) சுமை ஒரு சேரத் தன் மேல் வரும் போது தாங்கி, அரசனுக்கு இறைபொருள் முழுதும் தர வல்லது நாடாகும்.","ex":"A kingdom is that which can bear any burden that may be pressed on it (from adjoining kingdoms) and (yet) pay the full tribute to its sovereign","t1":"Poraiyorungu Melvarungaal Thaangi Iraivarku","t2":"Iraiyorungu Nervadhu Naatu"},{"n":734,"c":74,"ct":"நாடு","ce":"On the Country","l1":"உறுபசியும் ஓவாப் பிணியும் செறுபகையும்","l2":"சேரா தியல்வது நாடு.","mv":"மிக்க பசியும், ஓயாத நோயும் (வெளியே வந்து தாக்கி) அழிவு செய்யும் பகையும் தன்னிடம் சேராமல் நல்ல வகையில் நடைபெறுவதே நாடாகும்.","ex":"A kingdom is that which continues to be free from excessive starvation, irremediable epidemics, and destructive foes","t1":"Urupasiyum Ovaap Piniyum Serupakaiyum","t2":"Seraa Thiyalvadhu Naatu"},{"n":735,"c":74,"ct":"நாடு","ce":"On the Country","l1":"பல்குழுவும் பாழ்செய்யும் உட்பகையும் வேந்தலைக்கும்","l2":"கொல்குறும்பும் இல்லது நாடு.","mv":"பல வகை மாறுபடும் கூட்டங்களும், உடனிருந்தே அழிவு செய்யும் பகையும், அரசனை வருத்துகின்ற கொலைத் தொழில் பொருந்திய குறுநில மன்னரும் இல்லாதது நாடு.","ex":"A kingdom is that which is without various (irregular) associations, destructive internal enemies, and murderous savages who (sometimes) harass the sovereign","t1":"Palkuzhuvum Paazhseyyum Utpakaiyum Vendhalaikkum","t2":"Kolkurumpum Illadhu Naatu"},{"n":736,"c":74,"ct":"நாடு","ce":"On the Country","l1":"கேடறியாக் கெட்ட இடத்தும் வளங்குன்றா","l2":"நாடென்ப நாட்டின் தலை.","mv":"பகைவரால் கெடுக்கப் படாததாய், கெட்டுவிட்ட காலத்திலும் வளம் குன்றாததாய் உள்ள நாடே நாடுகள் எல்லாவற்றிலும் தலைமையானது என்று கூறுவர்.","ex":"The learned say that the best kingdom is that which knows no evil (from its foes), and, if injured (at all), suffers no diminution in its fruitfulness","t1":"Ketariyaak Ketta Itaththum Valangundraa","t2":"Naatenpa Naattin Thalai"},{"n":737,"c":74,"ct":"நாடு","ce":"On the Country","l1":"இருபுனலும் வாய்ந்த மலையும் வருபுனலும்","l2":"வல்லரணும் நாட்டிற்கு உறுப்பு.","mv":"ஊற்றும் மழையும் மாகிய இருவகை நீர்வளமும், தக்கவாறு அமைந்த மலையும் அந்த மலையிலிருந்து ஆறாக வரும் நீர் வளமும் வலிய அரணும் நாட்டிற்கு உறுப்புகளாகும்.","ex":"The constituents of a kingdom are the two waters (from above and below), well situated hills and an undestructible fort","t1":"Irupunalum Vaaindha Malaiyum Varupunalum","t2":"Vallaranum Naattirku Uruppu"},{"n":738,"c":74,"ct":"நாடு","ce":"On the Country","l1":"பிணியின்மை செல்வம் விளைவின்பம் ஏமம்","l2":"அணியென்ப நாட்டிவ் வைந்து.","mv":"நோயில்லாதிருத்தல், செல்வம், விளை பொருள், வளம், இன்பவாழ்வு, நல்ல காவல் இந்த ஐந்தும் நாட்டிற்கு அழகு என்று கூறுவர்.","ex":"Freedom from epidemics, wealth, produce, happiness and protection (to subjects); these five, the learned, say, are the ornaments of a kingdom","t1":"Piniyinmai Selvam Vilaivinpam Emam","t2":"Aniyenpa Naattiv Vaindhu"},{"n":739,"c":74,"ct":"நாடு","ce":"On the Country","l1":"நாடென்ப நாடா வளத்தன நாடல்ல","l2":"நாட வளந்தரு நாடு.","mv":"முயற்சி செய்து தேடாமலேயே தரும் வளத்தை உடைய நாடுகளைச் சிறந்த நாடுகள் என்று கூறுவர், தேடிமுயன்றால் வளம் தரும் நாடுகள் சிறந்த நாடுகள் அல்ல.","ex":"The learned say that those are kingdom whose wealth is not laboured for, and those not, whose wealth is only obtained through labour","t1":"Naatenpa Naataa Valaththana Naatalla","t2":"Naata Valandharu Naatu"},{"n":740,"c":74,"ct":"நாடு","ce":"On the Country","l1":"ஆங்கமை வெய்தியக் கண்ணும் பயமின்றே","l2":"வேந்தமை வில்லாத நாடு.","mv":"நல்ல அரசன் பொருந்தாத நாடு, மேற்சொன்ன நன்மைகள் எல்லாம் அமைதிருந்த போதிலும் அவற்றால் பயன் இல்லாமல் போகும்.","ex":"Although in possession of all the above mentioned excellences, these are indeed of no use to a country, in the absence of harmony between the sovereign and the sujects","t1":"Aangamai Veydhiyak Kannum Payamindre","t2":"Vendhamai Villaadha Naatu"},{"n":741,"c":75,"ct":"அரண்","ce":"On Fortress","l1":"ஆற்று பவர்க்கும் அரண்பொருள் அஞ்சித்தற்","l2":"போற்று பவர்க்கும் பொருள்.","mv":"(படையெடுத்தும்) போர் செய்யச் செல்பவர்க்கும் அரண் சிறந்ததாகும், (படையெடுத்தவர்க்கு) அஞ்சித் தன்னை புகழிடமாக அடைந்தவர்க்கும் அது சிறந்ததாகும்.","ex":"A fort is an object of importance to those who march (against their foes) as well as to those who through fear (of pursuers) would seek it for shelter","t1":"Aatru Pavarkkum Aranporul Anjiththar","t2":"Potru Pavarkkum Porul"},{"n":742,"c":75,"ct":"அரண்","ce":"On Fortress","l1":"மணிநீரும் மண்ணும் மலையும் அணிநிழற்","l2":"காடும் உடைய தரண்.","mv":"மணிபோல் தெளிந்த நீரும், வெட்ட வெளியான நிலமும், மலையும், அழகிய நிழல் உடைய காடும் ஆகிய இவை நான்கும் உள்ளதே அரண் ஆகும்.","ex":"A fort is that which has everlasting water, plains, mountains and cool shady forests","t1":"Manineerum Mannum Malaiyum Aninizhar","t2":"Kaatum Utaiya Tharan"},{"n":743,"c":75,"ct":"அரண்","ce":"On Fortress","l1":"உயர்வகலம் திண்மை அருமைஇந் நான்கின்","l2":"அமைவரண் என்றுரைக்கும் நூல்.","mv":"உயரம், அகலம், உறுதி, பகைவரால் அழிக்க முடியாத அருமை ஆகிய இந்த நான்கும் அமைந்திப்பதே அரண் என்று நூலோர் கூறுவர்.","ex":"The learned say that a fortress is an enclosure having these four (qualities) viz, height, breadth, strength and inaccessibility","t1":"Uyarvakalam Thinmai Arumaiin Naankin","t2":"Amaivaran Endruraikkum Nool"},{"n":744,"c":75,"ct":"அரண்","ce":"On Fortress","l1":"சிறுகாப்பிற் பேரிடத்த தாகி உறுபகை","l2":"ஊக்கம் அழிப்ப தரண்.","mv":"காக்க வேண்டிய இடம் சிறியதாய், மற்ற இடம் பெரிய பரப்புள்ளதாய், தன்னை எதிர்த்துவந்த பகைவரிருடைய ஊக்கத்தை அழிக்க வல்லது அரண் ஆகும்.","ex":"A fort is that which has an extensive space within, but only small places to be guarded, and such as can destroy the courage of besieging foes","t1":"Sirukaappir Peritaththa Thaaki Urupakai","t2":"Ookkam Azhippa Tharan"},{"n":745,"c":75,"ct":"அரண்","ce":"On Fortress","l1":"கொளற்கரிதாய்க் கொண்டகூழ்த் தாகி அகத்தார்","l2":"நிலைக்கெளிதாம் நீரது அரண்.","mv":"பகைவரால் கைப்பற்ற முடியாததாய், தன்னிடம் உணவுபொருள் கொண்டதாய், உள்ளிருப்போர் நிலைத்திருப்பதர்க்கு எளிதாகிய தன்மை உடையது அரண்.","ex":"A fort is that which cannot be captured, which abounds in suitable provisions, and affords a position of easy defence to its inmates","t1":"Kolarkaridhaaik Kontakoozhth Thaaki Akaththaar","t2":"Nilaikkelidhaam Neeradhu Aran"},{"n":746,"c":75,"ct":"அரண்","ce":"On Fortress","l1":"எல்லாப் பொருளும் உடைத்தாய் இடத்துதவும்","l2":"நல்லாள் உடையது அரண்.","mv":"தன்னிடம் (உள்ளவர்க்கு) எல்லாப் பொருளும் உடையதாய், போர் நெருக்கடியானவிடத்தில் உதவ வல்ல நல்ல விரர்களை உடையது அரண் ஆகும்.","ex":"A fort is that which has all (needful) things, and excellent heroes that can help it against destruction (by foes)","t1":"Ellaap Porulum Utaiththaai Itaththudhavum","t2":"Nallaal Utaiyadhu Aran"},{"n":747,"c":75,"ct":"அரண்","ce":"On Fortress","l1":"முற்றியும் முற்றா தெறிந்தும் அறைப்படுத்தும்","l2":"பற்றற் கரியது அரண்.","mv":"முற்றுகையிட்டும் முற்றுகையிடாமல் போர் செய்தும், வஞ்சனை செய்தும் எப்படியும் பகைவரால் கைப்பற்ற முடியாத அருமை உடையது அரண் ஆகும்.","ex":"A fort is that which cannot be captured by blockading, assaulting, or undermining it","t1":"Mutriyum Mutraa Therindhum Araippatuththum","t2":"Patrar Kariyadhu Aran"},{"n":748,"c":75,"ct":"அரண்","ce":"On Fortress","l1":"முற்றாற்றி முற்றி யவரையும் பற்றாற்றிப்","l2":"பற்றியார் வெல்வது அரண்.","mv":"முற்றுகையிடுவதில் வல்லமை கொண்டு முற்றுகை இட்டவரையும், (உள்ளிருந்தவர் பற்றிய) பற்றை விடாமலிருந்து வெல்வதற்கு உரியது அரண் ஆகும்.","ex":"That is a fort whose inmates are able to overcome without losing their ground, even abler men who have besieged it","t1":"Mutraatri Mutri Yavaraiyum Patraatrip","t2":"Patriyaar Velvadhu Aran"},{"n":749,"c":75,"ct":"அரண்","ce":"On Fortress","l1":"முனைமுகத்து மாற்றலர் சாய வினைமுகத்து","l2":"வீறெய்தி மாண்ட தரண்.","mv":"போர் முனையில் பகைவர் அழியும் படியாக (உள்ளிருந்தவர்செய்யும்) போர்ச் செயல்வகையால் பெருமைப் பெற்றுச் சிறப்புடையதாய் விளங்குவது அரண் ஆகும்.","ex":"A fort is that which derives excellence from the stratagems made (by its inmates) to defeat their enemies in the battlefield","t1":"Munaimukaththu Maatralar Saaya Vinaimukaththu","t2":"Veereydhi Maanta Tharan"},{"n":750,"c":75,"ct":"அரண்","ce":"On Fortress","l1":"எனைமாட்சித் தாகியக் கண்ணும் வினைமாட்சி","l2":"இல்லார்கண் இல்லது அரண்.","mv":"எத்தகைய பெருமையை உடையதாக இருந்த போதிலும், செயல்வகையால் சிறப்பு இல்லாதவரரிடத்தில் அரண் பயனில்லாததாகும். பொருள் செயல்வகை","ex":"Although a fort may possess all (the above-said) excellence, it is, as it were without these, if its inmates possess not the excellence of action","t1":"Enaimaatchith Thaakiyak Kannum Vinaimaatchi","t2":"Illaarkan Illadhu Aran"},{"n":751,"c":76,"ct":"பொருள்செயல்வகை","ce":"On Acquisition of Wealth","l1":"பொருளல் லவரைப் பொருளாகச் செய்யும்","l2":"பொருளல்லது இல்லை பொருள்.","mv":"ஒரு பொருளாக மதிக்கத் தகாதவரையும், மதிப்புடையவராகச் செய்வதாகிய பொருள் அல்லாமல் சிறப்புடைய பொருள் வேறு இல்லை.","ex":"Besides wealth there is nothing that can change people of no importance into those of (some) importance","t1":"Porulal Lavaraip Porulaakach Cheyyum","t2":"Porulalladhu Illai Porul"},{"n":752,"c":76,"ct":"பொருள்செயல்வகை","ce":"On Acquisition of Wealth","l1":"இல்லாரை எல்லாரும் எள்ளுவர் செல்வரை","l2":"எல்லாரும் செய்வர் சிறப்பு.","mv":"பொருள் இல்லாதவரை (வேறு நன்மை உடையவராக இருந்தாலும்) எல்லாரும் இகழ்வார், செல்வரை (வேறு நன்மை இல்லாவிட்டாலும்) எல்லாரும் சிறப்பு செய்வர்.","ex":"All despise the poor; (but) all praise the rich","t1":"Illaarai Ellaarum Elluvar Selvarai","t2":"Ellaarum Seyvar Sirappu"},{"n":753,"c":76,"ct":"பொருள்செயல்வகை","ce":"On Acquisition of Wealth","l1":"பொருளென்னும் பொய்யா விளக்கம் இருளறுக்கும்","l2":"எண்ணிய தேயத்துச் சென்று.","mv":"பொருள் என்று சொல்லப்படுகின்ற நந்தா விளக்கு, நினைத்த இடத்திற்குச் சென்று உள்ள இடையூற்றைக் கெடுக்கும்","ex":"The imperishable light of wealth goes into regions desired (by its owner) and destroys the darkness (of enmity therein)","t1":"Porulennum Poiyaa Vilakkam Irularukkum","t2":"Enniya Theyaththuch Chendru"},{"n":754,"c":76,"ct":"பொருள்செயல்வகை","ce":"On Acquisition of Wealth","l1":"அறன்ஈனும் இன்பமும் ஈனும் திறனறிந்து","l2":"தீதின்றி வந்த பொருள்.","mv":"சேர்க்கும் திறம் அறிந்து தீமை ஒன்றும் இல்லாமல், சேர்க்கப் பட்டுவந்த பொருள் ஒருவனுக்கு அறத்தையும் கொடுக்கும் இன்பத்தையும் கொடுக்கும்.","ex":"The wealth acquired with a knowledge of the proper means and without foul practices will yield virtue and happiness","t1":"Araneenum Inpamum Eenum Thiranarindhu","t2":"Theedhindri Vandha Porul"},{"n":755,"c":76,"ct":"பொருள்செயல்வகை","ce":"On Acquisition of Wealth","l1":"அருளொடும் அன்பொடும் வாராப் பொருளாக்கம்","l2":"புல்லார் புரள விடல்.","mv":"அருளோடும், அன்போடும் பொருந்தாத வழிகளில் வந்த செல்வத்தின் ஆக்கத்தைப் பெற்று மகிழாமல் அதைத் தீமையானது என்று நீக்கிவிட வேண்டும்.","ex":"(Kings) should rather avoid than seek the accumulation of wealth which does not flow in with mercy and love","t1":"Arulotum Anpotum Vaaraap Porulaakkam","t2":"Pullaar Purala Vital"},{"n":756,"c":76,"ct":"பொருள்செயல்வகை","ce":"On Acquisition of Wealth","l1":"உறுபொருளும் உல்கு பொருளும்தன் ஒன்னார்த்","l2":"தெறுபொருளும் வேந்தன் பொருள்.","mv":"இறையாக வந்து சேரும் பொருளும், சுங்கமாகக் கொள்ளும் பொருளும், தன் பகைவரை வென்று திறமையாகக் கொள்ளும் பொருளும் அரசனுடைய பொருள்களாகும்.","ex":"The spoils of slaughtered foes; these are the royal revenues","t1":"Uruporulum Ulku Porulumdhan Onnaarth","t2":"Theruporulum Vendhan Porul"},{"n":757,"c":76,"ct":"பொருள்செயல்வகை","ce":"On Acquisition of Wealth","l1":"அருளென்னும் அன்பீன் குழவி பொருளென்னும்","l2":"செல்வச் செவிலியால் உண்டு.","mv":"அன்பினால் பெறப்பட்ட அருள் என்றுக் கூறப்படும் குழந்தை, பொருள் என்றுக் கூறப்படும் செல்வமுள்ள செவிலித் தாயால் வளர்வதாகும்.","ex":"The child mercy which is borne by love grows under the care of the rich nurse of wealth","t1":"Arulennum Anpeen Kuzhavi Porulennum","t2":"Selvach Cheviliyaal Untu"},{"n":758,"c":76,"ct":"பொருள்செயல்வகை","ce":"On Acquisition of Wealth","l1":"குன்றேறி யானைப் போர் கண்டற்றால் தன்கைத்தொன்று","l2":"உண்டாகச் செய்வான் வினை.","mv":"தன் கைப்பொருள் ஒன்று தன்னிடம் இருக்க அதைக் கொண்டு ஒருவன் செயல் செய்தால், மலையின் மேல் ஏறி யானைப் போரைக் கண்டாற் போன்றது.","ex":"An undertaking of one who has wealth in one's hands is like viewing an elephant-fight from a hill-top","t1":"Kundreri Yaanaip Por Kantatraal","t2":"Thankaiththondru Untaakach Cheyvaan Vinai"},{"n":759,"c":76,"ct":"பொருள்செயல்வகை","ce":"On Acquisition of Wealth","l1":"செய்க பொருளைச் செறுநர் செருக்கறுக்கும்","l2":"எஃகதனிற் கூரிய தில்.","mv":"ஒருவன் பொருளை ஈட்டவேண்டும், அவனுடைய பகைவரின் செருக்கைக் கெடுக்க வல்ல வாள் அதைவிடக் கூர்மையானது வேறு இல்லை.","ex":"Accumulate wealth; it will destroy the arrogance of (your) foes; there is no weapon sharper than it","t1":"Seyka Porulaich Cherunar Serukkarukkum","t2":"Eqkadhanir Kooriya Thil"},{"n":760,"c":76,"ct":"பொருள்செயல்வகை","ce":"On Acquisition of Wealth","l1":"ஒண்பொருள் காழ்ப்ப இயற்றியார்க்கு எண்பொருள்","l2":"ஏனை இரண்டும் ஒருங்கு.","mv":"சிறந்ததாகிய பொருளை மிகுதியாக ஈட்டியவர்க்கு, மற்ற அறமும் இன்பமுமாகிய இரண்டும் ஒரு சேரக்கைகூடும் எளிய பொருளாகும்.","ex":"To those who have honestly acquired an abundance of riches, the other two, (virtue and pleasure) are things easy (of acquisition)","t1":"Onporul Kaazhppa Iyatriyaarkku Enporul","t2":"Enai Irantum Orungu"},{"n":761,"c":77,"ct":"படைமாட்சி","ce":"On the Value of an Army","l1":"உறுப்பமைந்து ஊறஞ்சா வெல்படை வேந்தன்","l2":"வெறுக்கையுள் எல்லாம் தலை.","mv":"எல்லா உறுப்புக்களும் நிறைந்ததாய் இடையூறுகளுக்கு அஞ்சாததாய் உள்ள வெற்றி தரும் படை, அரசனுடைய செல்வங்கள் எல்லாவற்றிலும் சிறந்ததாகும்.","ex":"The army which is complete in (its) parts and conquers without fear of wounds is the chief wealth of the king","t1":"Uruppamaindhu Ooranjaa Velpatai Vendhan","t2":"Verukkaiyul Ellaam Thalai"},{"n":762,"c":77,"ct":"படைமாட்சி","ce":"On the Value of an Army","l1":"உலைவிடத்து ஊறஞ்சா வன்கண் தொலைவிடத்துத்","l2":"தொல்படைக் கல்லால் அரிது.","mv":"போரில் அழிவு வந்தவிடத்தில் வலிமைக் குன்றினாலும், இடையூறுகளுக்கு அஞ்சாத அஞ்சாமை தொன்றுதொட்டுப் பெருமை உடையபடைக்கு அல்லாமல் முடியாது.","ex":"Ancient army can alone have the valour which makes it stand by its king at the time of defeat, fearless of wounds and unmindful of its reduced strength","t1":"Ulaivitaththu Ooranjaa Vankan Tholaivitaththuth","t2":"Tholpataik Kallaal Aridhu"},{"n":763,"c":77,"ct":"படைமாட்சி","ce":"On the Value of an Army","l1":"ஒலித்தக்கால் என்னாம் உவரி எலிப்பகை","l2":"நாகம் உயிர்ப்பக் கெடும்.","mv":"எலியாகிய பகைக்கூடி கடல் போல் ஒலித்தாலும் என்ன தீங்கு ஏற்ப்படும், பாம்பு மூச்சு விட்ட அளவில் அவைக் கெட்டழியும்.","ex":"What if (a host of) hostile rats roar like the sea ? They will perish at the mere breath of the cobra","t1":"Oliththakkaal Ennaam Uvari Ela�ppakai","t2":"Naakam Uyirppak Ketum"},{"n":764,"c":77,"ct":"படைமாட்சி","ce":"On the Value of an Army","l1":"அழிவின்றி அறைபோகா தாகி வழிவந்த","l2":"வன்க ணதுவே படை.","mv":"(போர் முனையில்) அழிவு இல்லாததாய்(பகைவருடைய) வஞ்சனைக்கு இரையாகாததாய், தொன்று தொட்டுவந்த அஞ்சாமை உடையதே படையாகும்.","ex":"That indeed is an army which has stood firm of old without suffering destruction or deserting (to the enemy)","t1":"Azhivindri Araipokaa Thaaki Vazhivandha","t2":"Vanka Nadhuve Patai"},{"n":765,"c":77,"ct":"படைமாட்சி","ce":"On the Value of an Army","l1":"கூற்றுடன்று மேல்வரினும் கூடி எதிர்நிற்கும்","l2":"ஆற்ற லதுவே படை.","mv":"எமனே சினங்கொண்டு தன் மேல் எதிர்த்து வந்தாலும் ஒன்றாகத் திரண்டு எதிர்த்து நிற்க்கும் ஆற்றல் உடையதே படையாகும்.","ex":"That indeed is an army which is capable of offering a united resistance, even if Yama advances against it with fury","t1":"Kootrutandru Melvarinum Kooti Edhirnirkum","t2":"Aatra Ladhuve Patai"},{"n":766,"c":77,"ct":"படைமாட்சி","ce":"On the Value of an Army","l1":"மறமானம் மாண்ட வழிச்செலவு தேற்றம்","l2":"எனநான்கே ஏமம் படைக்கு.","mv":"வீரம், மானம், சிறந்த வழியில் நடக்கும் நடக்கை, தலைவரால் நம்பித் தெளியப்படுதல் ஆகிய இந்த நான்கு பண்புகளும் படைக்கு சிறந்தவையாகும்.","ex":"Valour, honour, following in the excellent-footsteps (of its predecessors) and trust-worthiness; these four alone constitute the safeguard of an army","t1":"Maramaanam Maanta Vazhichchelavu Thetram","t2":"Enanaanke Emam Pataikku"},{"n":767,"c":77,"ct":"படைமாட்சி","ce":"On the Value of an Army","l1":"தார்தாங்கிச் செல்வது தானை தலைவந்த","l2":"போர்தாங்கும் தன்மை அறிந்து.","mv":"தன் மேல் எதிர்த்து வந்த பகைவரின் போரைத்தாங்கி, வெல்லும் தன்மை அறிந்து அவனுடைய தூசிப்படையை எதிர்த்துச் செல்லவல்லதே படையாகும்.","ex":"That is an army which knowing the art of warding off an impending struggle, can bear against the dust-van (of a hostile force)","t1":"Thaardhaangich Chelvadhu Thaanai Thalaivandha","t2":"Pordhaangum Thanmai Arindhu"},{"n":768,"c":77,"ct":"படைமாட்சி","ce":"On the Value of an Army","l1":"அடல்தகையும் ஆற்றலும் இல்லெனினும் தானை","l2":"படைத்தகையால் பாடு பெறும்.","mv":"போர் செய்யும் வீரமும்( எதிர்ப்பைத் தாங்கும்) ஆற்றலுமும் இல்லையானால் படைத்தன்னுடைய அணிவகுப்பால் பெருமை பெறும்.","ex":"Though destitute of courage to fight and strength (to endure), an army may yet gain renown by the splendour of its appearance","t1":"Ataldhakaiyum Aatralum Illeninum Thaanai","t2":"Pataiththakaiyaal Paatu Perum"},{"n":769,"c":77,"ct":"படைமாட்சி","ce":"On the Value of an Army","l1":"சிறுமையும் செல்லாத் துனியும் வறுமையும்","l2":"இல்லாயின் வெல்லும் படை.","mv":"தன் அளவு சிறிதாகத் தேய்தலும், தலைவரிடம் நீங்காத வெறுப்பும் வறுமையும் இல்லாதிருக்குமானால் அத்தகைய படை வெற்றி பெறும்.","ex":"An army can triumph (over its foes) if it is free from diminution; irremediable aversion and poverty","t1":"Sirumaiyum Sellaath Thuniyum Varumaiyum","t2":"Illaayin Vellum Patai"},{"n":770,"c":77,"ct":"படைமாட்சி","ce":"On the Value of an Army","l1":"நிலைமக்கள் சால உடைத்தெனினும் தானை","l2":"தலைமக்கள் இல்வழி இல்.","mv":"நெடுங்காலமாக நிலைத்திருக்கும் வீரர் பலரை உடையதே ஆனாலும், தலைமைதாங்கும் தலைவர் இல்லாத போது படைக்குப் பெருமை இல்லையாகும்.","ex":"Though an army may contain a large number of permanent soldiers, it cannot last if it has no generals","t1":"Nilaimakkal Saala Utaiththeninum Thaanai","t2":"Thalaimakkal Ilvazhi Il"},{"n":771,"c":78,"ct":"படைச்செருக்கு","ce":"On Courage of the Army","l1":"என்னைமுன் நில்லன்மின் தெவ்விர் பலரென்னை","l2":"முன்நின்று கல்நின் றவர்.","mv":"பகைவரே! என்னுடைய தலைவர் முன் எதிர்த்து நிற்காதீர்கள், என்னுடைய தலைவர் முன் எதிர்த்து நின்று கல்வடிவாய் நின்றவர் பலர்.","ex":"O my foes, stand not before my leader; (for) many are those who did so but afterwards stood (in the shape of) statues","t1":"Ennaimun Nillanmin Thevvir Palarennai","t2":"Munnindru Kalnin Ravar"},{"n":772,"c":78,"ct":"படைச்செருக்கு","ce":"On Courage of the Army","l1":"கான முயலெய்த அம்பினில் யானை","l2":"பிழைத்தவேல் ஏந்தல் இனிது.","mv":"காட்டில் ஓடுகின்ற முயலை நோக்கி குறிதவறாமல் எய்த அம்பை ஏந்துதலைவிட, வெட்ட வெளியில் நின்ற யானை மேல் எறிந்து தவறிய வேலை ஏந்துதல் சிறந்தது.","ex":"It is more pleasant to hold the dart that has missed an elephant than that which has hit hare in the forest","t1":"Kaana Muyaleydha Ampinil Yaanai","t2":"Pizhaiththavel Endhal Inidhu"},{"n":773,"c":78,"ct":"படைச்செருக்கு","ce":"On Courage of the Army","l1":"பேராண்மை என்ப தறுகண்ஒன் றுற்றக்கால்","l2":"ஊராண்மை மற்றதன் எஃகு.","mv":"பகைவரை எதிர்த்து நிற்க்கும் வீரத்தை மிக்க ஆண்மை என்று கூறுவர், ஒரு துன்பம் வந்த போது பகைவர்க்கும் உதவிச் செய்தலை அந்த ஆண்மையின் கூர்மை என்று கூறுவர்.","ex":"The learned say that fierceness (incontest with a foe) is indeed great valour; but to become a benefactor in case of accident (to a foe) is the extreme (limit) of that valour","t1":"Peraanmai Enpa Tharukanon Rutrakkaal","t2":"Ooraanmai Matradhan Eqku"},{"n":774,"c":78,"ct":"படைச்செருக்கு","ce":"On Courage of the Army","l1":"கைவேல் களிற்றொடு போக்கி வருபவன்","l2":"மெய்வேல் பறியா நகும்.","mv":"கையில் ஏந்திய வேலை ஒரு யானையின் மேல் எறிந்து துரத்திவிட்டு, வேறு வேல் தேடி வருகின்றவன் தன் மார்பில் பட்டிருந்த வேலைக் கண்டு பறித்து மகிழ்கின்றான்.","ex":"The hero who after casting the lance in his hand on an elephant, comes (in search of another) will pluck the one (that sticks) in his body and laugh (exultingly)","t1":"Kaivel Kalitrotu Pokki Varupavan","t2":"Meyvel Pariyaa Nakum"},{"n":775,"c":78,"ct":"படைச்செருக்கு","ce":"On Courage of the Army","l1":"விழித்தகண் வேல்கொண டெறிய அழித்திமைப்பின்","l2":"ஒட்டன்றோ வன்க ணவர்க்கு.","mv":"பகைவரை சினந்து நோக்கியக் கண், அவர் வேலைக் கொண்டு எறிந்த போது மூடி இமைக்குமானால், அது வீரமுடையவர்க்குத் தோல்வி அன்றோ.","ex":"Is it not a defeat to the valiant to wink and destroy their ferocious look when a lance in cast at them (by their foe) ?","t1":"Vizhiththakan Velkona Teriya Azhiththimaippin","t2":"Ottandro Vanka Navarkku"},{"n":776,"c":78,"ct":"படைச்செருக்கு","ce":"On Courage of the Army","l1":"விழுப்புண் படாதநாள் எல்லாம் வழுக்கினுள்","l2":"வைக்கும்தன் நாளை எடுத்து.","mv":"வீரன் தன் கழிந்த நாட்களைக் கணக்கிட்டு, விழுப்புண் படாத நாட்களை எல்லாம் பயன் படாமல் தவறிய நாட்களுள் சேர்ப்பான்.","ex":"The hero will reckon among wasted days all those on which he had not received severe wounds","t1":"Vizhuppun Pataadhanaal Ellaam Vazhukkinul","t2":"Vaikkumdhan Naalai Etuththu"},{"n":777,"c":78,"ct":"படைச்செருக்கு","ce":"On Courage of the Army","l1":"சுழலும் இசைவேண்டி வேண்டா உயிரார்","l2":"கழல்யாப்புக் காரிகை நீர்த்து.","mv":"பரந்து நிற்க்கும் புகழை விரும்பி, உயிர்வாழ்வையும் விரும்பாத வீரர், வீரக் கழலை காலில் கட்டிக்கொள்ளுதல் அழகு செய்யும் தன்மையுடையதாகும்.","ex":"The fastening of ankle-ring by those who disire a world-wide renown and not (the safety of) their lives is like adorning (themselves)","t1":"Suzhalum Isaiventi Ventaa Uyiraar","t2":"Kazhalyaappuk Kaarikai Neerththu"},{"n":778,"c":78,"ct":"படைச்செருக்கு","ce":"On Courage of the Army","l1":"உறின்உயிர் அஞ்சா மறவர் இறைவன்","l2":"செறினும் சீர்குன்றல் இலர்.","mv":"போர்வந்தால் உயிரின் பொருட்டு அஞ்சாமல் போர் செய்யத் துணியும் வீரர், அரசன் சினந்தாலும் தம்முடைய சிறப்புக் குன்றாதவர் ஆவர்.","ex":"The heroes who are not afraid of losing their life in a contest will not cool their ardour, even if the king prohibits (their fighting)","t1":"Urinuyir Anjaa Maravar Iraivan","t2":"Serinum Seerkundral Ilar"},{"n":779,"c":78,"ct":"படைச்செருக்கு","ce":"On Courage of the Army","l1":"இழைத்தது இகவாமைச் சாவாரை யாரே","l2":"பிழைத்தது ஒறுக்கிற் பவர்.","mv":"தாம் உரைத்த சூள் தவராத படி போர் செய்து சாக வல்லவரை, அவர் செய்தப் பிழைக்காக தண்டிக்க வல்லவர் யார்.","ex":"Who would reproach with failure those who seal their oath with their death ?","t1":"Izhaiththadhu Ikavaamaich Chaavaarai Yaare","t2":"Pizhaiththadhu Orukkir Pavar"},{"n":780,"c":78,"ct":"படைச்செருக்கு","ce":"On Courage of the Army","l1":"புரந்தார்கண் நீர்மல்கச் சாகிற்பின் சாக்காடு","l2":"இரந்துகோள் தக்கது உடைத்து.","mv":"தம்மைக் காத்த தலைவருடைய கண்கள் நீர் பெருக்குமாறு சாகப் பெற்றால், சாவு இரந்தாவது பெற்றுக் கொள்ளத் தக்க பெருமை உடையதாகும்.","ex":"If (heroes) can so die as to fill with tears the eyes of their rulers, such a death deserves to be obtained even by begging","t1":"Purandhaarkan Neermalkach Chaakirpin Saakkaatu","t2":"Irandhukol Thakkadhu Utaiththu"},{"n":781,"c":79,"ct":"நட்பு","ce":"On Friendship","l1":"செயற்கரிய யாவுள நட்பின் அதுபோல்","l2":"வினைக்கரிய யாவுள காப்பு.","mv":"நட்பைப்போல் செய்து கொள்வதற்கு அருமையானவை எவை உள்ளன, அதுபோல் தொழிலுக்கு அரிய காவலாக இருப்பவை எவை உள்ளன.","ex":"What so sure defence 'gainst all that foe can do?","t1":"Seyarkariya Yaavula Natpin Adhupol","t2":"Vinaikkariya Yaavula Kaappu"},{"n":782,"c":79,"ct":"நட்பு","ce":"On Friendship","l1":"நிறைநீர நீரவர் கேண்மை பிறைமதிப்","l2":"பின்னீர பேதையார் நட்பு.","mv":"அறிவுடையவரின் நட்பு பிறை நிறைந்து வருதல் போன்ற தன்மையுடையது, அறிவில்லாதவரின் நட்பு முழுமதி தேய்ந்து பின் செல்லுதல் போன்ற தன்மையுடையன.","ex":"The friendship of the wise waxes like the new moon; (but) that of fools wanes like the full moon","t1":"Niraineera Neeravar Kenmai Piraimadhip","t2":"Pinneera Pedhaiyaar Natpu"},{"n":783,"c":79,"ct":"நட்பு","ce":"On Friendship","l1":"நவில்தொறும் நூல்நயம் போலும் பயில்தொறும்","l2":"பண்புடை யாளர் தொடர்பு.","mv":"பழகப் பழக நற்பண்பு உடையவரின் நட்பு இன்பம் தருதல், நூலின் நற்பொருள் கற்கக் கற்க மேன்மேலும் இன்பம் தருதலைப் போன்றதாகும்.","ex":"Like learning, the friendship of the noble, the more it is cultivated, the more delightful does it become","t1":"Navildhorum Noolnayam Polum Payildhorum","t2":"Panputai Yaalar Thotarpu"},{"n":784,"c":79,"ct":"நட்பு","ce":"On Friendship","l1":"நகுதற் பொருட்டன்று நட்டல் மிகுதிக்கண்","l2":"மேற்செனறு இடித்தற் பொருட்டு.","mv":"நட்புச் செய்தல் ஒருவரோடு ஒருவர் சிரித்து மகிழும் பொருட்டு அன்று, நண்பர் நெறிக்கடந்து செல்லும் போது முற்ப்பட்டுச் சென்று இடித்துரைப்பதற்காகும்.","ex":"Friendship is to be practised not for the purpose of laughing but for that of being beforehand in giving one another sharp rebukes in case of transgression","t1":"Nakudhar Poruttandru Nattal Mikudhikkan","t2":"Mersenaru Itiththar Poruttu"},{"n":785,"c":79,"ct":"நட்பு","ce":"On Friendship","l1":"புணர்ச்சி பழகுதல் வேண்டா உணர்ச்சிதான்","l2":"நட்பாங் கிழமை தரும்.","mv":"நட்புச் செய்வதற்குத் தொடர்பும் பழக்கமும் வேண்டியதில்லை, ஒத்த உணர்ச்சியே நட்பு ஏற்படுத்துவதற்கு வேண்டிய உரிமையைக் கொடுக்கும்.","ex":"Living together and holding frequent intercourse are not necessary (for friendship); (mutual) understanding can alone create a claim for it","t1":"Punarchchi Pazhakudhal Ventaa Unarchchidhaan","t2":"Natpaang Kizhamai Tharum"},{"n":786,"c":79,"ct":"நட்பு","ce":"On Friendship","l1":"முகநக நட்பது நட்பன்று நெஞ்சத்து","l2":"அகநக நட்பது நட்பு.","mv":"முகம் மட்டும் மலரும் படியா நட்பு செய்வது நட்பு அன்று, நெஞ்சமும் மலரும் படியாக உள்ளன்பு கொண்டு நட்பு செய்வதே நட்பு ஆகும்.","ex":"The love that dwells (merely in the smiles of the face is not friendship; (but) that which dwells deep in the smiles of the heart is true friendship","t1":"Mukanaka Natpadhu Natpandru Nenjaththu","t2":"Akanaka Natpadhu Natpu"},{"n":787,"c":79,"ct":"நட்பு","ce":"On Friendship","l1":"அழிவி னவைநீக்கி ஆறுய்த்து அழிவின்கண்","l2":"அல்லல் உழப்பதாம் நட்பு.","mv":"அழிவைத் தரும் தீமைகளிலிருந்து நீக்கி, நல்ல வழியில் நடக்கச் செய்து, அழிவுவந்த காலத்தில் உடனிருந்து துன்பப்படுவதே நட்பாகும்.","ex":"(True) friendship turns aside from evil (ways) makes (him) walk in the (good) way, and, in case of loss if shares his sorrow (with him)","t1":"Azhivi Navaineekki Aaruyththu Azhivinkan","t2":"Allal Uzhappadhaam Natpu"},{"n":788,"c":79,"ct":"நட்பு","ce":"On Friendship","l1":"உடுக்கை இழந்தவன் கைபோல ஆங்கே","l2":"இடுக்கண் களைவதாம் நட்பு.","mv":"உடைநெகிழ்ந்தவனுடைய கை, உடனே உதவிக்காப்பது போல் (நண்பனுக்குத் துன்பம் வந்தால்) அப்போதே சென்று துன்பத்தைக் களைவது நட்பு.","ex":"(True) friendship hastens to the rescue of the afflicted (as readily) as the hand of one whose garment is loosened (before an assembly)","t1":"Utukkai Izhandhavan Kaipola Aange","t2":"Itukkan Kalaivadhaam Natpu"},{"n":789,"c":79,"ct":"நட்பு","ce":"On Friendship","l1":"நட்பிற்கு வீற்றிருக்கை யாதெனின் கொட்பின்றி","l2":"ஒல்லும்வாய் ஊன்றும் நிலை.","mv":"நட்புக்கு சிறந்த நிலை எது என்றால், எப்போதும் வேறுபடுதல் இல்லாமல், முடியும் போதெல்லாம் உதவி செய்து தாங்கும் நிலையாகும்.","ex":"Friendship may be said to be on its throne when it possesses the power of supporting one at all times and under all circumstances, (in the practice or virtue and wealth)","t1":"Natpirku Veetrirukkai Yaadhenin Kotpindri","t2":"Ollumvaai Oondrum Nilai"},{"n":790,"c":79,"ct":"நட்பு","ce":"On Friendship","l1":"இனையர் இவரெமக்கு இன்னம்யாம் என்று","l2":"புனையினும் புல்லென்னும் நட்பு.","mv":"இவர் எமக்கு இத்தன்மையானவர், யாம் இவர்க்கு இத் தன்மையுடையேம் என்று புனைந்துரைத்தாலும் நட்பு சிறப்பிழந்து விடும்.","ex":"Though friends may praise one another saying, \"He is so intimate with us, and we so much (with him)\"; (still) such friendship will appear mean","t1":"Inaiyar Ivaremakku Innamyaam Endru","t2":"Punaiyinum Pullennum Natpu"},{"n":791,"c":80,"ct":"நட்பாராய்தல்","ce":"On True Friendship","l1":"நாடாது நட் டலிற் கேடில்லை நட்டபின்","l2":"வீடில்லை நட்பாள் பவர்க்கு.","mv":"நட்புச் செய்தபிறகு நட்பை உடையவர்க்கு அதிலிருந்து விடுதலை இல்லை, ஆகையால் ஆராயாமல் நட்புச் செய்வது போல் கெடுதியானது வேறு இல்லை.","ex":"As those who are of a friendly nature will not forsake (a friend) after once loving (him), there is no evil so great as contracting a friendship without due inquiry","t1":"Naataadhu Nattalir Ketillai Nattapin","t2":"Veetillai Natpaal Pavarkku"},{"n":792,"c":80,"ct":"நட்பாராய்தல்","ce":"On True Friendship","l1":"ஆய்ந்தாய்ந்து கொள்ளாதான் கேண்மை கடைமுறை","l2":"தான்சாம் துயரம் தரும்.","mv":"ஆராய்ந்து ஆராய்ந்து நட்புக் கொள்ளாதவனுடைய நட்பு, இறுதியில் தான் சாவதற்க்குக் காரணமானத் துயரத்தை உண்டாக்கிவிடும்.","ex":"The friendship contracted by him who has not made repeated inquiry will in the end grieve (him) to death","t1":"Aaindhaaindhu Kollaadhaan Kenmai Kataimurai","t2":"Thaansaam Thuyaram Tharum"},{"n":793,"c":80,"ct":"நட்பாராய்தல்","ce":"On True Friendship","l1":"குணமும் குடிமையும் குற்றமும் குன்றா","l2":"இனனும் அறிந்தியாக்க நட்பு.","mv":"ஒருவனுடைய குணத்தையும், குடிப்பிறப்பையும் குற்றத்தையும் குறையாத இனத்தாரின் இயல்பையும் அறிந்து அவனேடு நட்புக் கொள்ள வேண்டும்.","ex":"Make friendship (with one) after ascertaining (his) character, birth, defects and the whole of one's relations","t1":"Kunamum Kutimaiyum Kutramum Kundraa","t2":"Inanum Arindhiyaakka Natpu"},{"n":794,"c":80,"ct":"நட்பாராய்தல்","ce":"On True Friendship","l1":"குடிப்பிறந்து தன்கண் பழிநாணு வானைக்","l2":"கொடுத்தும் கொளல்வேண்டும் நட்பு.","mv":"உயர்ந்த குடியில் பிறந்து, தன்னிடத்தில் வருகின்றப் பழிக்கு நாணுகின்றவனைப் பொருள் கொடுத்தாவது நட்பு கொள்ளவேண்டும்.","ex":"The friendship of one who belongs to a (good) family and is afraid of (being charged with) guilt, is worth even purchasing","t1":"Kutippirandhu Thankan Pazhinaanu Vaanaik","t2":"Kotuththum Kolalventum Natpu"},{"n":795,"c":80,"ct":"நட்பாராய்தல்","ce":"On True Friendship","l1":"அழச்சொல்லி அல்லது இடித்து வழக்கறிய","l2":"வல்லார்நடபு ஆய்ந்து கொளல்.","mv":"நன்மை இல்லாதச் சொற்களைக் கண்டபோது வருந்தும்படியாக இடிந்துச் சொல்லி, உலகநடையை அறிய வல்லவரின் நட்பை ஆராய்ப்து கொள்ள வேண்டும்.","ex":"You should examine and secure the friendship of those who can speak so as to make you weep over a crime (before its commission) or rebuke you severely (after you have done it) and are able to teach","t1":"Azhachcholli Alladhu Itiththu Vazhakkariya","t2":"Vallaarnatapu Aaindhu Kolal"},{"n":796,"c":80,"ct":"நட்பாராய்தல்","ce":"On True Friendship","l1":"கேட்டினும் உண்டோ ர் உறுதி கிளைஞரை","l2":"நீட்டி அளப்பதோர் கோல்.","mv":"கேடு வந்த போதும் ஒருவகை நன்மை உண்டு, அக் கேடு ஒருவனுடைய நண்பரின் இயல்புகளை நீட்டிஅளந்து பார்ப்பதொரு கோலாகும்.","ex":"Even in ruin there is some good; (for) it is a rod by which one may measure fully (the affection of one's) relations","t1":"Kettinum Untor Urudhi Kilaignarai","t2":"Neetti Alappadhor Kol"},{"n":797,"c":80,"ct":"நட்பாராய்தல்","ce":"On True Friendship","l1":"ஊதியம் என்பது ஒருவற்குப் பேதையார்","l2":"கேண்மை ஒரீஇ விடல்.","mv":"ஒருவனுக்கு ஊதியம் என்று சொல்லப்படுவது, அறிவில்லாதவறுடன் செய்து கொண்ட நட்பிலிருந்து நீங்கி அவரைக் கைவிடுதலாகும்.","ex":"It is indead a gain for one to renounce the friendship of fools","t1":"Oodhiyam Enpadhu Oruvarkup Pedhaiyaar","t2":"Kenmai Oreei Vital"},{"n":798,"c":80,"ct":"நட்பாராய்தல்","ce":"On True Friendship","l1":"உள்ளற்க உள்ளம் சிறுகுவ கொள்ளற்க","l2":"அல்லற்கண் ஆற்றறுப்பார் நட்பு.","mv":"ஊக்கம் குறைவதற்குக் காரணமான செயல்களை எண்ணாமலிருக்க வேண்டும், அதுபோல் துன்பம் வந்த போது கைவிடுகின்றவரின் நட்பைக் கொள்ளாதிருக்க வேண்டும்.","ex":"Do not think of things that discourage your mind, nor contract friendship with those who would forsake you in adversity","t1":"Ullarka Ullam Sirukuva Kollarka","t2":"Allarkan Aatraruppaar Natpu"},{"n":799,"c":80,"ct":"நட்பாராய்தல்","ce":"On True Friendship","l1":"கெடுங்காலைக் கைவிடுவார் கேண்மை அடுங்காலை","l2":"உள்ளினும் உள்ளஞ் சுடும்.","mv":"கேடு வரும் காலத்தில் கைவிட்டு ஒதுங்குகின்றவரின் நட்பு, எமன் கொல்லும் காலத்தில் நினைத்தாலும் நினைத்த உள்ளத்தை வருத்தும்.","ex":"The very thought of the friendship of those who have deserted one at the approach of adversity will burn one's mind at the time of death","t1":"Ketungaalaik Kaivituvaar Kenmai Atungaalai","t2":"Ullinum Ullanj Chutum"},{"n":800,"c":80,"ct":"நட்பாராய்தல்","ce":"On True Friendship","l1":"மருவுக மாசற்றார் கேண்மைஒன் றீத்தும்","l2":"ஒருவுக ஒப்பிலார் நட்பு.","mv":"குற்றமற்றவருடைய நட்பைக் கொள்ள வேண்டும், ஒத்தபண்பை இல்லாதவறுடைய நட்பை ஒன்றைக் கொடுத்தாவது கைவிட வேண்டும்.","ex":"Continue to enjoy the friendship of the pure; (but) renounce even with a gift, the friendship of those who do not agree (with the world)","t1":"Maruvuka Maasatraar Kenmaion Reeththum","t2":"Oruvuka Oppilaar Natpu"},{"n":801,"c":81,"ct":"பழைமை","ce":"On Old Friendship","l1":"பழைமை எனப்படுவது யாதெனின் யாதும்","l2":"கிழமையைக் கீழ்ந்திடா நட்பு.","mv":"பழைமை என்று சொல்லப்படுவது எது என்று வினாவினால் அது பழகியவர் உரிமைப் பற்றிச் செய்யும் செயலைக் கீழ்ப்படுத்தாமல் ஏற்கும் நட்பாகும்.","ex":"Imtimate friendship is that which cannot in the least be injured by (things done through the) right (of longstanding intimacy)","t1":"Pazhaimai Enappatuvadhu Yaadhenin Yaadhum","t2":"Kizhamaiyaik Keezhndhitaa Natpu"},{"n":802,"c":81,"ct":"பழைமை","ce":"On Old Friendship","l1":"நட்பிற் குறுப்புக் கெழுதகைமை மற்றதற்கு","l2":"உப்பாதல் சான்றோர் கடன்.","mv":"நட்பிற்க்கு உறுப்பாவது நண்பனுடைய உரிமைச் செயலாகும், அந்த உரிமைச் செயலுக்கு உடன்பட்டவராதல் சான்றோரின் கடமையாகும்.","ex":"The constituents of friendship are (things done through) the right of intimacy; to be pleased with such a right is the duty of the wise","t1":"Natpir Kuruppuk Kezhudhakaimai Matradharku","t2":"Uppaadhal Saandror Katan"},{"n":803,"c":81,"ct":"பழைமை","ce":"On Old Friendship","l1":"பழகிய நட்பெவன் செய்யுங் கெழுதகைமை","l2":"செய்தாங்கு அமையாக் கடை.","mv":"பழகியவர் உரிமைப்பற்றிச் செய்யும் செயலைத் தாம் செய்தது போலவேக் கருதி உடன்படாவிட்டால் அவரோடு தாம் பழகிய நட்பு என்ன பயன் தரும்.","ex":"Of what avail is long-standing friendship, if friends do not admit as their own actions done through the right of intimacy ?","t1":"Pazhakiya Natpevan Seyyung Kezhudhakaimai","t2":"Seydhaangu Amaiyaak Katai"},{"n":804,"c":81,"ct":"பழைமை","ce":"On Old Friendship","l1":"விழைதகையான் வேண்டி இருப்பர் கெழுதகையாற்","l2":"கேளாது நட்டார் செயின்.","mv":"உரிமையால் கேளாமலே நண்பர் ஒன்றைச் செய்தால், அந்த உரிமையைப் போற்றி விரும்பும் தன்மையோடு அச் செயலையும் விரும்பி உடன்பட்டிருப்பர் அறிஞர்.","ex":"If friends, through the right of friendship, do (anything) without being asked, the wise will be pleased with them on account of its desirability","t1":"Vizhaidhakaiyaan Venti Iruppar Kezhudhakaiyaar","t2":"Kelaadhu Nattaar Seyin"},{"n":805,"c":81,"ct":"பழைமை","ce":"On Old Friendship","l1":"பேதைமை ஒன்றோ பெருங்கிழமை என்றுணர்க","l2":"நோதக்க நட்டார் செயின்.","mv":"வருந்ததக்க செயல்களை நண்பர் செய்தால் அதற்குக் காரணம் அறியாமை என்றாவது மிகுந்த உரிமை என்றாவது உணரவேண்டும்.","ex":"If friends should perform what is painful, understand that it is owing not only to ignorance, but also to the strong claims of intimacy","t1":"Pedhaimai Ondro Perungizhamai Endrunarka","t2":"Nodhakka Nattaar Seyin"},{"n":806,"c":81,"ct":"பழைமை","ce":"On Old Friendship","l1":"எல்லைக்கண் நின்றார் துறவார் தொலைவிடத்தும்","l2":"தொல்லைக்கண் நின்றார் தொடர்பு.","mv":"உரிமை வாழ்வின் எல்லையில் நின்றவர், தமக்கு அழிவுநேர்ந்தவிடத்திலும் பழைமையாய் உறவு கொண்டு நின்றவரின் தொடர்பைக் கைவிட மாட்டார்.","ex":"Those who stand within the limits (of true friendship) will not even in adversity give up the intimacy of long-standing friends","t1":"Ellaikkan Nindraar Thuravaar Tholaivitaththum","t2":"Thollaikkan Nindraar Thotarpu"},{"n":807,"c":81,"ct":"பழைமை","ce":"On Old Friendship","l1":"அழிவந்த செய்யினும் அன்பறார் அன்பின்","l2":"வழிவந்த கேண்மை யவர்.","mv":"அன்புடன் தொன்றுதொட்டு வந்த உறவை உடையவர், அழிவுதரும் செயல்களை பழகியவர் செய்த போதிலும் தம் அன்பு நீங்காமலிருப்பர்.","ex":"Those who have (long) stood in the path of affection will not give it up even if their friends cause (them) their ruin","t1":"Azhivandha Seyyinum Anparaar Anpin","t2":"Vazhivandha Kenmai Yavar"},{"n":808,"c":81,"ct":"பழைமை","ce":"On Old Friendship","l1":"கேளிழுக்கம் கேளாக் கெழுதகைமை வல்லார்க்கு","l2":"நாளிழுக்கம் நட்டார் செயின்.","mv":"பழகிய நண்பர் செய்த தவறு பற்றிப் பிறர் சொன்னாலும், கேளாமலிருக்கும் உரிமை வல்லவர்க்கு, அந்த நண்பர் தவறுசெய்வாரானால் அது பயனுள்ள நாளாகும்.","ex":"To those who understand that by which they should not listen to (tales about) the faults of their friends, that is a (profitable) day on which the latter may commit a fault","t1":"Kelizhukkam Kelaak Kezhudhakaimai Vallaarkku","t2":"Naalizhukkam Nattaar Seyin"},{"n":809,"c":81,"ct":"பழைமை","ce":"On Old Friendship","l1":"கெடாஅ வழிவந்த கேண்மையார் கேண்மை","l2":"விடாஅர் விழையும் உலகு.","mv":"உரிமை கெடாமல் தொன்று தொட்டு வந்த உறவு உடையவரின் தொடர்பைக் கைவிடாதவரை உலகம் விரும்பிப் போற்றும்.","ex":"They will be loved by the world, who have not forsaken the friendship of those with whom they have kept up an unbroken long-standing intimacy","t1":"Ketaaa Vazhivandha Kenmaiyaar Kenmai","t2":"Vitaaar Vizhaiyum Ulaku"},{"n":810,"c":81,"ct":"பழைமை","ce":"On Old Friendship","l1":"விழையார் விழையப் படுப பழையார்கண்","l2":"பண்பின் தலைப்பிரியா தார்.","mv":"(தவறு செய்த போதிலும்)பழகிய நண்பரிடத்தில் தம் உரிமை பண்பிலிருந்து மாறாதவர், தம் பகைவராலும் விரும்பப்படுதற்குறிய சிறப்பை அடைவர்","ex":"Even enemies will love those who have never changed in their affection to their long-standingfriends","t1":"Vizhaiyaar Vizhaiyap Patupa Pazhaiyaarkan","t2":"Panpin Thalaippiriyaa Thaar"},{"n":811,"c":82,"ct":"தீ நட்பு","ce":"On Base Alliance","l1":"பருகுவார் போலினும் பண்பிலார் கேண்மை","l2":"பெருகலிற் குன்றல் இனிது.","mv":"அன்பு மிகுதியால் பருகுவார் போல் தோன்றினாலும் நற்பண்பு இல்லாதவரின் நட்பு, வளர்ந்து பெருகுவதை விடத் தேய்ந்து குறைவது நல்லது.","ex":"The decrease of friendship with those who look as if they would eat you up (through excess of love) while they are really destitute of goodness is far better than its increase","t1":"Parukuvaar Polinum Panpilaar Kenmai","t2":"Perukalir Kundral Inidhu"},{"n":812,"c":82,"ct":"தீ நட்பு","ce":"On Base Alliance","l1":"உறின்நட்டு அறின்ஙருஉம் ஒப்பிலார் கேண்மை","l2":"பெறினும் இழப்பினும் என்?","mv":"தமக்கு பயன் உள்ள போது நட்பு செய்து பயன் இல்லாத போது நீங்கிவிடும் தகுதியில்லாதவரின் நட்பைப் பெற்றாலும் என்ன பயன், இழந்தாலும் என்ன பயன்.","ex":"Of what avail is it to get or lose the friendship of those who love when there is gain and leave when there is none ?","t1":"Urinnattu Arinoruum Oppilaar Kenmai","t2":"Perinum Izhappinum En?"},{"n":813,"c":82,"ct":"தீ நட்பு","ce":"On Base Alliance","l1":"உறுவது சீர்தூக்கும் நட்பும் பெறுவது","l2":"கொள்வாரும் கள்வரும் நேர்.","mv":"கிடைக்கும் பயனை அளந்து பார்க்கும் நண்பரும், அன்பைக் கொள்ளாமல் பெறுகின்ற பொருளைக் கொள்ளும் விலை மகளிரும், கள்வரும் ஒரு நிகரானவர்.","ex":"Friendship who calculate the profits (of their friendship), prostitutes who are bent on obtaining their gains, and thieves are (all) of the same character","t1":"Uruvadhu Seerdhookkum Natpum Peruvadhu","t2":"Kolvaarum Kalvarum Ner"},{"n":814,"c":82,"ct":"தீ நட்பு","ce":"On Base Alliance","l1":"அமரகத்து ஆற்றறுக்கும் கல்லாமா அன்னார்","l2":"தமரின் தனிமை தலை.","mv":"போர் வந்த போது களத்தில் தள்ளிவிட்டு ஓடும் அறிவில்லாத குதிரை போன்றவரின் உறவை விட, ஒரு நட்பும் இல்லாமல் தனித்திருத்தலே சிறந்தது.","ex":"Solitude is more to be desired than the society of those who resemble the untrained horses which throw down (their riders) in the fields of battle","t1":"Amarakaththu Aatrarukkum Kallaamaa Annaar","t2":"Thamarin Thanimai Thalai"},{"n":815,"c":82,"ct":"தீ நட்பு","ce":"On Base Alliance","l1":"செய்தேமஞ் சாராச் சிறியவர் புன்கேண்மை","l2":"எய்தலின் எய்தாமை நன்று.","mv":"காவல் செய்து வைத்தாலும் காவல் ஆகாத கீழ்மக்களின் தீய நட்பு, ஒருவனுக்கு ஏற்படுவதை விட ஏற்படாமலிருப்பதே நன்மையாகும்.","ex":"It is far better to avoid that to contract the evil friendship of the base who cannot protect (their friends) even when appointed to do so","t1":"Seydhemanj Chaaraach Chiriyavar Punkenmai","t2":"Eydhalin Eydhaamai Nandru"},{"n":816,"c":82,"ct":"தீ நட்பு","ce":"On Base Alliance","l1":"பேதை பெருங்கெழீஇ நட்பின் அறிவுடையார்","l2":"ஏதின்மை கோடி உறும்.","mv":"அறிவில்லாதவனுடைய மிகப் பொருந்திய நட்பை விட அறிவுடையவரின் நட்பில்லாத தன்மை கோடி மடங்கு நன்மை தருவதாகும்.","ex":"The hatred of the wise is ten-million times more profitable than the excessive intimacy of the fool","t1":"Pedhai Perungezheei Natpin Arivutaiyaar","t2":"Edhinmai Koti Urum"},{"n":817,"c":82,"ct":"தீ நட்பு","ce":"On Base Alliance","l1":"நகைவகைய ராகிய நட்பின் பகைவரால்","l2":"பத்தடுத்த கோடி உறும்.","mv":"(அகத்தில் அன்பு இல்லாமல் புறத்தில்) நகைக்கும் தன்மை உடையவரின் நட்பை விட, பகைவரால் வருவன பத்துகோடி மடங்கு நன்மையாகும்.","ex":"What comes from enemies is a hundred million times more profitable than what comes from the friendship of those who cause only laughter","t1":"Nakaivakaiya Raakiya Natpin Pakaivaraal","t2":"Paththatuththa Koti Urum"},{"n":818,"c":82,"ct":"தீ நட்பு","ce":"On Base Alliance","l1":"ஒல்லும் கருமம் உடற்று பவர்கேண்மை","l2":"சொல்லாடார் சோர விடல்.","mv":"முடியும் செயலையும் முடியாத படி செய்து கெடுப்பவரின் உறவை, அவர் அறியுமாறு ஒன்றும் செய்யாமலே தளரச் செய்து கைவிட வேண்டும்.","ex":"Gradually abandon without revealing (beforehand) the friendship of those who pretend inability to carry out what they (really) could do","t1":"Ollum Karumam Utatru Pavarkenmai","t2":"Sollaataar Sora Vital"},{"n":819,"c":82,"ct":"தீ நட்பு","ce":"On Base Alliance","l1":"கனவினும் இன்னாது மன்னோ வினைவேறு","l2":"சொல்வேறு பட்டார் தொடர்பு.","mv":"செய்யும் செயல் வேறாகவும் சொல்லும் சொல் வேறாகவும் உள்ளவரின் நட்பு, ஒருவனுக்கு கனவிலும் துன்பம் தருவதாகும்.","ex":"The friendship of those whose actions do not agree with their words will distress (one) even in (one's) dreams","t1":"Kanavinum Innaadhu Manno Vinaiveru","t2":"Solveru Pattaar Thotarpu"},{"n":820,"c":82,"ct":"தீ நட்பு","ce":"On Base Alliance","l1":"எனைத்தும் குறுகுதல் ஓம்பல் மனைக்கெழீஇ","l2":"மன்றில் பழிப்பார் தொடர்பு.","mv":"தனியே வீட்டில் உள்ளபோது பொருந்தியிருந்து, பலர் கூடிய மன்றத்தில் பழித்து பேசுவோரின் நட்பை எவ்வளவு சிறிய அளவிலும் அணுகாமல் விட வேண்டும்.","ex":"Avoid even the least approach to a contraction of friendship with those who would love you in private but ridicule you in public","t1":"Enaiththum Kurukudhal Ompal Manaikkezheei","t2":"Mandril Pazhippaar Thotarpu"},{"n":821,"c":83,"ct":"கூடாநட்பு","ce":"On False Alliance","l1":"சீரிடம் காணின் எறிதற்குப் பட் டடை","l2":"நேரா நிரந்தவர் நட்பு.","mv":"அகத்தே பொருந்தாமல் புறத்தே பொருந்தி நடப்பவரின் நட்பு, தக்க இடம் கண்டபோது எறிவதற்கு உரிய பட்டையாகும்.","ex":"The friendship of those who behave like friends without inward affection is a weapon that may be thrown when a favourable opportunity presents itself","t1":"Seeritam Kaanin Eridharkup Pattatai","t2":"Neraa Nirandhavar Natpu"},{"n":822,"c":83,"ct":"கூடாநட்பு","ce":"On False Alliance","l1":"இனம்போன்று இனமல்லார் கேண்மை மகளிர்","l2":"மனம்போல வேறு படும்.","mv":"இனம் போலவே இருந்து உண்மையில் இனம் அல்லாதவரின் நட்பு, பொதுமகளிரின் மனம் போல உள்ளொன்று புறமொன்றாக வேறுபட்டு நிற்கும்.","ex":"The friendship of those who seem to be friends while they are not, will change like the love of women","t1":"Inampondru Inamallaar Kenmai Makalir","t2":"Manampola Veru Patum"},{"n":823,"c":83,"ct":"கூடாநட்பு","ce":"On False Alliance","l1":"பலநல்ல கற்றக் கடைத்து மனநல்லர்","l2":"ஆகுதல் மாணார்க் கரிது.","mv":"பல நல்ல நூல்களைக் கற்றுத் தேர்ந்த போதிலும், அவற்றின் பயனாக நல்ல மனம் உடையவராகப் பழகுதல், (உள்ளன்பினால்) மாட்சியடையாதவர்க்கு இல்லை.","ex":"Though (one's) enemies may have mastered many good books, it will be impossible for them to become truly loving at heart","t1":"Palanalla Katrak Kataiththu Mananallar","t2":"Aakudhal Maanaark Karidhu"},{"n":824,"c":83,"ct":"கூடாநட்பு","ce":"On False Alliance","l1":"முகத்தின் இனிய நகாஅ அகத்தின்னா","l2":"வஞ்சரை அஞ்சப் படும்.","mv":"முகத்தால் இனிமையாகச் சிரித்துப் பழகி அகத்தில் தீமை கொண்டுள்ள வஞ்சகருடன் நட்பு கொள்வதற்கு அஞ்ச வேண்டும்.","ex":"One should fear the deceitful who smile sweetly with their face but never love with their heart","t1":"Mukaththin Iniya Nakaaa Akaththinnaa","t2":"Vanjarai Anjap Patum"},{"n":825,"c":83,"ct":"கூடாநட்பு","ce":"On False Alliance","l1":"மனத்தின் அமையா தவரை எனைத்தொன்றும்","l2":"சொல்லினால் தேறற்பாற்று அன்று.","mv":"மனத்தால் தம்மொடு பொருந்தாமல் பழகுகின்றவரை அவர் கூறுகின்ற சொல்லைக் கொண்டு எத்தகைய ஒரு செயலிலும் நம்பித் தெளியக்கூடாது.","ex":"In nothing whatever is it proper to rely on the words of those who do not love with their heart","t1":"Manaththin Amaiyaa Thavarai Enaiththondrum","t2":"Sollinaal Therarpaatru Andru"},{"n":826,"c":83,"ct":"கூடாநட்பு","ce":"On False Alliance","l1":"நட்டார்போல் நல்லவை சொல்லினும் ஒட்டார்சொல்","l2":"ஒல்லை உணரப் படும்.","mv":"நண்பர்போல் நன்மையானவற்றைச் சொன்னபோதிலும் பகைமை கொண்டவர் சொல்லும் சொற்களின் உண்மைத் தன்மை விரைவில் உணரப்படும்.","ex":"Though (one's) foes may utter good things as though they were friends, once will at once understand (their evil, import)","t1":"Nattaarpol Nallavai Sollinum Ottaarsol","t2":"Ollai Unarap Patum"},{"n":827,"c":83,"ct":"கூடாநட்பு","ce":"On False Alliance","l1":"சொல்வணக்கம் ஒன்னார்கண் கொள்ளற்க வில்வணக்கம்","l2":"தீங்கு குறித்தமை யான்.","mv":"வில்லின் வணக்கம் வணக்கமாக இருந்தாலும் தீங்கு செய்தலைக்குறித்தமையால், பகைவரிடத்திலும் அவருடைய சொல்லின் வணக்கத்தை நன்மையாகக் கொள்ளக் கூடாது.","ex":"Since the bending of the bow bespeaks evil, one should not accept (as good) the humiliating speeches of one's foes","t1":"Solvanakkam Onnaarkan Kollarka Vilvanakkam","t2":"Theengu Kuriththamai Yaan"},{"n":828,"c":83,"ct":"கூடாநட்பு","ce":"On False Alliance","l1":"தொழுதகை யுள்ளும் படையொடுங்கும் ஒன்னார்","l2":"அழுதகண் ணீரும் அனைத்து.","mv":"பகைவர் வணங்கித் தொழுத கையினுள்ளும் கொலைக்கருவி மறைந்திருக்கும், பகைவர் அழுதுசொரிந்த கண்ணீரும் அத்தன்மையானதே.","ex":"A weapon may be hid in the very hands with which (one's) foes adore (him) (and) the tears they shed are of the same nature","t1":"Thozhudhakai Yullum Pataiyotungum Onnaar","t2":"Azhudhakan Neerum Anaiththu"},{"n":829,"c":83,"ct":"கூடாநட்பு","ce":"On False Alliance","l1":"மிகச்செய்து தம்மெள்ளு வாரை நகச்செய்து","l2":"நட்பினுள் சாப்புல்லற் பாற்று.","mv":"புறத்தே மிகுதியாக நட்புத் தோன்றச் செய்து அகத்தில் இகழ்கின்றவரைத் தாமும் அந
