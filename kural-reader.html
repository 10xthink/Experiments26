றியில்செல்வம்","ce":"On Unprofitable Wealth","l1":"எச்சமென்று என்எண்ணுங் கொல்லோ ஒருவரால்","l2":"நச்சப் படாஅ தவன்.","mv":"பிறர்க்கு உதவியாக வாழாதக் காரணத்தால் ஒருவராலும் விரும்பப்படாதவன் , தான் இறந்த பிறகு எஞ்சி நிற்பது என்று எதனை எண்ணுவானே.","ex":"What will the miser who is not liked (by any one) regard as his own (in the world to come) ?","t1":"Echchamendru Enennung Kollo Oruvaraal","t2":"Nachchap Pataaa Thavan"},{"n":1005,"c":101,"ct":"நன்றியில்செல்வம்","ce":"On Unprofitable Wealth","l1":"கொடுப்பதூஉம் துய்ப்பதூஉம் இல்லார்க்கு அடுக்கிய","l2":"கோடியுண் டாயினும் இல்.","mv":"பிறர்க்கு கொடுத்து உதவுவதும் தான் நுகர்வதும் இல்லாதவர்க்கு மேன் மேலும் பெருகிய பல கோடிப் பொருள் உண்டானாலும் பயன் இல்லை.","ex":"Those who neither give (to others) nor enjoy (their property) are (truly) destitute, though possessing immense riches","t1":"Kotuppadhooum Thuyppadhooum Illaarkku Atukkiya","t2":"Kotiyun Taayinum Il"},{"n":1006,"c":101,"ct":"நன்றியில்செல்வம்","ce":"On Unprofitable Wealth","l1":"ஏதம் பெருஞ்செல்வம் தான்துவ்வான் தக்கார்க்கொன்று","l2":"ஈதல் இயல்பிலா தான்.","mv":"தானும் நுகராமல் தக்கவற்க்கு ஒன்று கொடுத்து உதவும் இயல்பும் இல்லாமல் வாழ்கின்றவன், தன்னிடமுள்ள பெருஞ் செல்வத்திற்கு ஒரு நோய் ஆவான்.","ex":"He who enjoys not (his riches) nor relieves the wants of the worthy is a disease to his wealth","t1":"Edham Perunjelvam Thaandhuvvaan Thakkaarkkondru","t2":"Eedhal Iyalpilaa Thaan"},{"n":1007,"c":101,"ct":"நன்றியில்செல்வம்","ce":"On Unprofitable Wealth","l1":"அற்றார்க்கொன்று ஆற்றாதான் செல்வம் மிகநலம்","l2":"பெற்றாள் தமியள்மூத் தற்று.","mv":"பொருள் இல்லாத வறியவர்க்கு ஒரு பொருள் கொடுத்து உதவாதவனுடையச் செல்வம், மிக்க அழகு பெற்றவள் தனியாக வாழ்ந்து முதுமையுற்றாற் போன்றது.","ex":"The wealth of him who never bestows anything on the destitute is like a woman of beauty growing old without a husband","t1":"Atraarkkondru Aatraadhaan Selvam Mikanalam","t2":"Petraal Thamiyalmooth Thatru"},{"n":1008,"c":101,"ct":"நன்றியில்செல்வம்","ce":"On Unprofitable Wealth","l1":"நச்சப் படாதவன் செல்வம் நடுவூருள்","l2":"நச்சு மரம்பழுத் தற்று.","mv":"பிறர்க்கு உதவாத காரணத்தால் ஒருவராலும் விரும்பப்படாதவனுடைய செல்வம், ஊர் நடுவில் நச்சு மரம் பழுத்தாற் போன்றது.","ex":"The wealth of him who is disliked (by all) is like the fruit-bearing of the etty tree in the midst of a town","t1":"Nachchap Pataadhavan Selvam Natuvoorul","t2":"Nachchu Marampazhuth Thatru"},{"n":1009,"c":101,"ct":"நன்றியில்செல்வம்","ce":"On Unprofitable Wealth","l1":"அன்பொரீஇத் தற்செற்று அறநோக்காது ஈட்டிய","l2":"ஒண்பொருள் கொள்வார் பிறர்.","mv":"பிறரிடம் செலுத்தும் அன்பையும் விட்டுத் தன்னையும் வருத்தி அறத்தையும் போற்றாமல் சேர்த்து வைத்தப் பெரும் பொருளைப் பெற்று நுகர்பவர் மற்றவரே.","ex":"To heap up glittering wealth, their hoards shall others take","t1":"Anporeeith Tharsetru Aranokkaadhu Eettiya","t2":"Onporul Kolvaar Pirar"},{"n":1010,"c":101,"ct":"நன்றியில்செல்வம்","ce":"On Unprofitable Wealth","l1":"சீருடைச் செல்வர் சிறுதுனி மார஧","l2":"வறங்கூர்ந் தனையது உடைத்து.","mv":"புகழ் பொருந்திய செல்வர் உற்ற சிறிய வறுமை உலகத்தைக் காக்க வல்ல மேகம் வறுமை மிகுந்தாற் போன்ற தன்மை உடையது.","ex":"The short-lived poverty of those who are noble and rich is like the clouds becoming poor (for a while)","t1":"Seerutaich Chelvar Sirudhuni Maari","t2":"Varangoorn Thanaiyadhu Utaiththu"},{"n":1011,"c":102,"ct":"நாணுடைமை","ce":"On Modesty","l1":"கருமத்தால் நாணுதல் நாணுந் திருநுதல்","l2":"நல்லவர் நாணுப் பிற.","mv":"தகாத செயல் காரணமாக நாணுவதே நாணமாகும், பெண்களுக்கு இயல்பான மற்ற நாணங்கள் வேறு வகையானவை.","ex":"True modesty is the fear of (evil) deeds; all other modesty is (simply) the bashfulness of virtuous maids","t1":"Karumaththaal Naanudhal Naanun Thirunudhal","t2":"Nallavar Naanup Pira"},{"n":1012,"c":102,"ct":"நாணுடைமை","ce":"On Modesty","l1":"ஊணுடை எச்சம் உயிர்க்கெல்லாம் வேறல்ல","l2":"நாணுடைமை மாந்தர் சிறப்பு.","mv":"உணவும், உடையும் எஞ்சி நிற்கும் மற்றவையும், எல்லா உயிர்களுக்கும் பொதுவானவை, மக்களின் சிறப்பியல்பாக விளங்குவது நாணுடைமையே ஆகும்.","ex":"Food, clothing and the like are common to all men but modesty is peculiar to the good","t1":"Oonutai Echcham Uyirkkellaam Veralla","t2":"Naanutaimai Maandhar Sirappu"},{"n":1013,"c":102,"ct":"நாணுடைமை","ce":"On Modesty","l1":"ஊனைக் குறித்த உயிரெல்லாம் நாண்என்னும்","l2":"நன்மை குறித்தது சால்பு.","mv":"எல்லா உயிர்களும் ஊனாலாகிய உடம்பை இருப்பிடமாகக் கொண்டவை, சால்பு என்பது நாணம் என்று சொல்லப்படும் நல்லப் பண்பை இருப்பிடமாகக் கொண்டது.","ex":"As the body is the abode of the spirit, so the excellence of modesty is the abode of perfection","t1":"Oonaik Kuriththa Uyirellaam Naanennum","t2":"Nanmai Kuriththadhu Saalpu"},{"n":1014,"c":102,"ct":"நாணுடைமை","ce":"On Modesty","l1":"அணிஅன்றோ நாணுடைமை சான்றோர்க்கு அஃதின்றேல்","l2":"பிணிஅன்றோ பீடு நடை.","mv":"சான்றோர்க்கு நாணுடைமை அணிகலம் அன்றோ, அந்த அணிகலம் இல்லையானால் பெருமிதமாக நடக்கும் நடை ஒரு நோய் அன்றோ.","ex":"Is not the modesty ornament of the noble ? Without it, their haughtiness would be a pain (to others)","t1":"Aniandro Naanutaimai Saandrorkku Aqdhindrel","t2":"Piniandro Peetu Natai"},{"n":1015,"c":102,"ct":"நாணுடைமை","ce":"On Modesty","l1":"பிறர்பழியும் தம்பழியும் நாணுவார் நாணுக்கு","l2":"உறைபதி என்னும் உலகு.","mv":"பிறர்க்கு வரும் பழிக்காகவும், தமக்கு வரும் பழிக்காகவும் நாணுகின்றவர் நாணத்திற்கு உறைவிட மானவர் என்று உலகம் சொல்லும்.","ex":"The world regards as the abode of modesty him who fear his own and other's guilt","t1":"Pirarpazhiyum Thampazhiyum Naanuvaar Naanukku","t2":"Uraipadhi Ennum Ulaku"},{"n":1016,"c":102,"ct":"நாணுடைமை","ce":"On Modesty","l1":"நாண்வேலி கொள்ளாது மன்னோ வியன்ஞாலம்","l2":"பேணலர் மேலா யவர்.","mv":"நாணமாகிய வேலியை தமக்கு காவலாகச் செய்து கொள்ளாமல், மேலோர் பரந்த உலகில் வாழும் வாழ்க்கை விரும்பி மேற்கொள்ள மாட்டார்.","ex":"The great make modesty their barrier (of defence) and not the wide world","t1":"Naanveli Kollaadhu Manno Viyangnaalam","t2":"Penalar Melaa Yavar"},{"n":1017,"c":102,"ct":"நாணுடைமை","ce":"On Modesty","l1":"நாணால் உயிரைத் துறப்பர் உயிர்ப்பொருட்டால்","l2":"நாண்துறவார் நாணாள் பவர்.","mv":"நாணத்தை தமக்கரிய பண்பாகக் கொள்பவர் நாணத்தால் உயிரை விடுவர், உயிரைக் காக்கும் பொருட்டாக நாணத்தை விட மாட்டார்.","ex":"The modest would rather lose their life for the sake of modesty than lose modesty for the sake of life","t1":"Naanaal Uyiraith Thurappar Uyirpporuttaal","t2":"Naandhuravaar Naanaal Pavar"},{"n":1018,"c":102,"ct":"நாணுடைமை","ce":"On Modesty","l1":"பிறர்நாணத் தக்கது தான்நாணா னாயின்","l2":"அறம்நாணத் தக்கது உடைத்து.","mv":"ஒருவன் மற்றவர் நாணத்தக்க பழிக்குக் காரணமாக இருந்தும் தான் நாணாமலிருப்பானானால், அறம் நாணி அவனைக் கைவிடும் தன்மையுடையதாகும்.","ex":"Virtue is likely to forsake him who shamelessly does what others are ashamed of","t1":"Pirarnaanath Thakkadhu Thaannaanaa Naayin","t2":"Aramnaanath Thakkadhu Utaiththu"},{"n":1019,"c":102,"ct":"நாணுடைமை","ce":"On Modesty","l1":"குலஞ்சுடும் கொள்கை பிழைப்பின் நலஞ்சுடும்","l2":"நாணின்மை நின்றக் கடை.","mv":"ஒருவன் கொள்கை தவறினால் , அத் தவறு அவனுடையக் குடிப் பிறப்பைத் கெடுக்கும், நாணில்லாத தன்மை நிலைப் பெற்றால் நன்மை எல்லாவற்றையும் கெடுக்கும்.","ex":"Want of manners injures one's family; but want of modesty injures one's character","t1":"Kulanjutum Kolkai Pizhaippin Nalanjutum","t2":"Naaninmai Nindrak Katai"},{"n":1020,"c":102,"ct":"நாணுடைமை","ce":"On Modesty","l1":"நாண்அகத் தில்லார் இயக்கம் மரப்பாவை","l2":"நாணால் உயிர்மருட்டி அற்று.","mv":"மனத்தில் நாணம் இல்லாதவர் உலகத்தில் இயங்குதல், மரத்தால் செய்த பாவையைக் கயிறு கொண்டு ஆட்டி உயிருள்ளதாக மயக்கினாற் போன்றது.","ex":"The actions of those who are without modesty at heart are like those of puppet moved by a string","t1":"Naanakath Thillaar Iyakkam Marappaavai","t2":"Naanaal Uyirmarutti Atru"},{"n":1021,"c":103,"ct":"குடிசெயல்வகை","ce":"On Exalting One's Family","l1":"கருமம் செயஒருவன் கைதூவேன் என்னும்","l2":"பெருமையின் பீடுடையது இல்.","mv":"குடிப் பெருமைக்கு உரிய கடமையைச் செய்வதற்குச் சோர்வடைய மாட்டேன் என்று ஒருவன் முயலும் பெருமையைப் போல மேம்பாடானது வேறொன்றும் இல்லை.","ex":"There is no higher greatness than that of one saying I will not cease in my effort (to raise my family)","t1":"Karumam Seyaoruvan Kaidhooven Ennum","t2":"Perumaiyin Peetutaiyadhu Il"},{"n":1022,"c":103,"ct":"குடிசெயல்வகை","ce":"On Exalting One's Family","l1":"ஆள்வினையும் ஆன்ற அறிவும் எனஇரண்டின்","l2":"நீள்வினையால் நீளும் குடி.","mv":"முயற்சி நிறைந்த அறிவு என்று சொல்லப்படும் இரண்டினையும் உடைய இடைவிடாத செயலால் ஒருவனுடைய குடி உயர்ந்து விளங்கும்.","ex":"One's family is raised by untiring perseverance in both effort and wise contrivances","t1":"Aalvinaiyum Aandra Arivum Enairantin","t2":"Neelvinaiyaal Neelum Kuti"},{"n":1023,"c":103,"ct":"குடிசெயல்வகை","ce":"On Exalting One's Family","l1":"குடிசெய்வல் என்னும் ஒருவற்குத் தெய்வம்","l2":"மடிதற்றுத் தான்முந் துறும்.","mv":"என் குடியை உயரச் செய்வேன் என்று முயலும் ஒருவனுக்கு ஊழ், ஆடையைக் கட்டிக் கொண்டு தானே முன் வந்து துணை செய்யும்.","ex":"The Deity will clothe itself and appear before him who resolves on raising his family","t1":"Kutiseyval Ennum Oruvarkuth Theyvam","t2":"Matidhatruth Thaanmun Thurum"},{"n":1024,"c":103,"ct":"குடிசெயல்வகை","ce":"On Exalting One's Family","l1":"சூழாமல் தானே முடிவெய்தும் தம்குடியைத்","l2":"தாழாது உஞற்று பவர்க்கு.","mv":"தம் குடி உயர்வதற்கான செயலை விரைந்து முயன்று செய்வோர்க்கு அவர் ஆராயமலே அச் செயல் தானே நிறைவேறும்.","ex":"Those who are prompt in their efforts (to better their family) need no deliberation, such efforts will of themselves succeed","t1":"Soozhaamal Thaane Mutiveydhum Thamkutiyaith","t2":"Thaazhaadhu Ugnatru Pavarkku"},{"n":1025,"c":103,"ct":"குடிசெயல்வகை","ce":"On Exalting One's Family","l1":"குற்றம் இலனாய்க் குடிசெய்து வாழ்வானைச்","l2":"சுற்றமாச் சுற்றும் உலகு.","mv":"குற்றம் இல்லாதவனாய்க் குடி உயர்வதற்கான செயல் செய்து வாழ்கின்றவனை உலகத்தார் சுற்றமாக விரும்பிச் சூழ்ந்து கொள்வர்.","ex":"People will eagerly seek the friendship of the prosperous soul who has raised his family without foul means","t1":"Kutram Ilanaaik Kutiseydhu Vaazhvaanaich","t2":"Chutramaach Chutrum Ulaku"},{"n":1026,"c":103,"ct":"குடிசெயல்வகை","ce":"On Exalting One's Family","l1":"நல்லாண்மை என்பது ஒருவற்குத் தான்பிறந்த","l2":"இல்லாண்மை ஆக்கிக் கொளல்.","mv":"ஒருவனுக்கு நல்ல ஆண்மை என்று சொல்லப்படுவது தான் பிறந்த குடியை ஆளும் சிறப்பைத் தனக்கு உண்டாக்கி கொள்வதாகும்.","ex":"A man's true manliness consists in making himself the head and benefactor of his family","t1":"Nallaanmai Enpadhu Oruvarkuth Thaanpirandha","t2":"Illaanmai Aakkik Kolal"},{"n":1027,"c":103,"ct":"குடிசெயல்வகை","ce":"On Exalting One's Family","l1":"அமரகத்து வன்கண்ணர் போலத் தமரகத்தும்","l2":"ஆற்றுவார் மேற்றே பொறை.","mv":"போர்க்களத்தில் பலரிடையே பொறுப்பை ஏற்றுக் கொள்ளும் அஞ்சாத வீரரைப் போல் குடியில் பிறந்தவரிடையிலும் தாங்க வல்லவர் மேல் தான் பொறுப்பு உள்ளது.","ex":"Amid his kindred so the burthen rests upon the strong","t1":"Amarakaththu Vankannar Polath Thamarakaththum","t2":"Aatruvaar Metre Porai"},{"n":1028,"c":103,"ct":"குடிசெயல்வகை","ce":"On Exalting One's Family","l1":"குடிசெய்வார்க் கில்லை பருவம் மடிசெய்து","l2":"மானங் கருதக் கெடும்.","mv":"குடி உயர்வதற்கான செயல் செய்கின்றவர்க்கு உரிய காலம் என்று ஒன்று இல்லை, சோம்பல் கொண்டு தம் மானத்தைக் கருதுவாரானால் குடிப்பெருமைக் கெடும்.","ex":"As a family suffers by (one's) indolence and false dignity there is to be so season (good or bad) to those who strive to raise their family","t1":"Kutiseyvaark Killai Paruvam Matiseydhu","t2":"Maanang Karudhak Ketum"},{"n":1029,"c":103,"ct":"குடிசெயல்வகை","ce":"On Exalting One's Family","l1":"இடும்பைக்கே கொள்கலம் கொல்லோ குடும்பத்தைக்","l2":"குற்ற மறைப்பான் உடம்பு.","mv":"தன் குடிக்கு வரக்குடிய குற்றத்தை வராமல் நீக்க முயல்கின்ற ஒருவனுடைய உடம்பு துன்பத்திற்கே இருப்பிடமானதோ.","ex":"Is it only to suffering that his body is exposed who undertakes to preserve his family from evil ?","t1":"Itumpaikke Kolkalam Kollo Kutumpaththaik","t2":"Kutra Maraippaan Utampu"},{"n":1030,"c":103,"ct":"குடிசெயல்வகை","ce":"On Exalting One's Family","l1":"இடுக்கண்கால் கொன்றிட வீழும் அடுத்தூன்றும்","l2":"நல்லாள் இலாத குடி.","mv":"துன்பம் வந்த போது உடனிருந்து தாங்க வல்ல நல்ல ஆள் இல்லாத குடி, துன்பமாகிய கோடாரி அடியில் வெட்டி வீழ்த்த விழுந்துவிடும்.","ex":"If there are none to prop up and maintain a family (in distress), it will fall at the stroke of the axe of misfortune","t1":"Itukkankaal Kondrita Veezhum Atuththoondrum","t2":"Nallaal Ilaadha Kuti"},{"n":1031,"c":104,"ct":"உழவு","ce":"On Agriculture","l1":"சுழன்றும்ஏர்ப் பின்னது உலகம் அதனால்","l2":"உழந்தும் உழவே தலை.","mv":"உலகம் பல தொழில் செய்து சுழன்றாலும் ஏர்த் தொழிலின் பின் நிற்கின்றது, அதனால் எவ்வளவு துன்புற்றாலும் உழவுத் தொழிலே சிறந்தது.","ex":"Agriculture, though laborious, is the most excellent (form of labour); for people, though they go about (in search of various employments), have at last to resort to the farmer","t1":"Suzhandrumerp Pinnadhu Ulakam Adhanaal","t2":"Uzhandhum Uzhave Thalai"},{"n":1032,"c":104,"ct":"உழவு","ce":"On Agriculture","l1":"உழுவார் உலகத்தார்க்கு ஆணிஅஃ தாற்றாது","l2":"எழுவாரை எல்லாம் பொறுத்து.","mv":"உழவு செய்ய முடியாமல் உயிர் வாழ்கின்றவர், எல்லாரையும் தாங்குவதால், உழவு செய்கின்றவர் உலகத்தாற்கு அச்சாணி போன்றவர்.","ex":"Agriculturists are (as it were) the linch-pin of the world for they support all other workers who cannot till the soil","t1":"Uzhuvaar Ulakaththaarkku Aaniaq Thaatraadhu","t2":"Ezhuvaarai Ellaam Poruththu"},{"n":1033,"c":104,"ct":"உழவு","ce":"On Agriculture","l1":"உழுதுண்டு வாழ்வாரே வாழ்வார்மற் றெல்லாம்","l2":"தொழுதுண்டு பின்செல் பவர்.","mv":"உழவு செய்து அதனால் கிடைத்ததைக் கொண்டு வாழ்கின்றவரே உரிமையோடு வாழ்கின்றவர், மற்றவர் எல்லோரும் பிறரைத் தொழுது உண்டு பின் செல்கின்றவரே.","ex":"They alone live who live by agriculture; all others lead a cringing, dependent life","t1":"Uzhudhuntu Vaazhvaare Vaazhvaarmar Rellaam","t2":"Thozhudhuntu Pinsel Pavar"},{"n":1034,"c":104,"ct":"உழவு","ce":"On Agriculture","l1":"பலகுடை நீழலும் தங்குடைக்கீழ்க் காண்பர்","l2":"அலகுடை நீழ லவர்.","mv":"நெல் வளம் உடைய தண்ணளி பொருந்திய உழவர், பல அரசரின் குடை நிழல்களையும் தம் குடையின் கீழ் காணவல்லவர் ஆவர்.","ex":"Patriotic farmers desire to bring all other states under the control of their own king","t1":"Palakutai Neezhalum Thangutaikkeezhk Kaanpar","t2":"Alakutai Neezha Lavar"},{"n":1035,"c":104,"ct":"உழவு","ce":"On Agriculture","l1":"இரவார் இரப்பார்க்கொன்று ஈவர் கரவாது","l2":"கைசெய்தூண் மாலை யவர்.","mv":"கையால் தொழில் செய்து உணவு தேடி உண்ணும் இயல்புடைய தொழிலாளர், பிறரிடம் சென்று இரக்கமாட்டார், தம்மிடம் இரந்தவர்க்கு ஒளிக்காமல் ஒரு பொருள் ஈவார்.","ex":"Those whose nature is to live by manual labour will never beg but give something to those who beg","t1":"Iravaar Irappaarkkondru Eevar Karavaadhu","t2":"Kaiseydhoon Maalai Yavar"},{"n":1036,"c":104,"ct":"உழவு","ce":"On Agriculture","l1":"உழவினார் கைம்மடங்கின் இல்லை விழைவதூஉம்","l2":"விட்டேம்என் பார்க்கும் நிலை.","mv":"உழவருடைய கை, தொழில் செய்யாமல் மடங்கியிருக்குமானால், விரும்புகின்ற எந்தப் பற்றையும் விட்டுவிட்டோம் என்று கூறும் துறவிகளுக்கும் வாழ்வு இல்லை.","ex":"If the farmer's hands are slackened, even the ascetic state will fail","t1":"Uzhavinaar Kaimmatangin Illai Vizhaivadhooum","t2":"Vittemen Paarkkum Nilai"},{"n":1037,"c":104,"ct":"உழவு","ce":"On Agriculture","l1":"தொடிப்புழுதி கஃசா உணக்கின் பிடித்தெருவும்","l2":"வேண்டாது சாலப் படும்.","mv":"ஒரு பலம் புழுதி கால்பலம் ஆகும்படி உழுது காயவிட்டால், ஒரு பிடி எருவும் இடவேண்டாமல் அந் நிலத்தில் பயிர் செலுத்தி செழித்து விளையும்.","ex":"If the land is dried so as to reduce one ounce of earth to a quarter, it will grow plentifully even without a handful of manure","t1":"Thotippuzhudhi Kaqsaa Unakkin Pitiththeruvum","t2":"Ventaadhu Saalap Patum"},{"n":1038,"c":104,"ct":"உழவு","ce":"On Agriculture","l1":"ஏரினும் நன்றால் எருவிடுதல் கட்டபின்","l2":"நீரினும் நன்றதன் காப்பு.","mv":"ஏர் உழுதலை விட எரு இடுதல் நல்லது, இந்த இரண்டும் சேர்ந்துக் களை நீக்கிய பின், நீர் பாய்ச்சுதலை விடக் காவல்காத்தல் நல்லது.","ex":"Manuring is better than ploughing; after weeding, watching is better than watering (it)","t1":"Erinum Nandraal Eruvitudhal Kattapin","t2":"Neerinum Nandradhan Kaappu"},{"n":1039,"c":104,"ct":"உழவு","ce":"On Agriculture","l1":"செல்லான் கிழவன் இருப்பின் நிலம்புலந்து","l2":"இல்லாளின் ஊடி விடும்.","mv":"நிலத்திற்கு உரியவன் நிலத்தைச் சென்று பார்க்காமல் வாளா இருந்தால் அந் நிலம் அவனுடைய மனைவியைப் போல் வெறுத்து அவனோடு பிணங்கிவிடும்.","ex":"If the owner does not (personally) attend to his cultivation, his land will behave like an angry wife and yield him no pleasure","t1":"Sellaan Kizhavan Iruppin Nilampulandhu","t2":"Illaalin Ooti Vitum"},{"n":1040,"c":104,"ct":"உழவு","ce":"On Agriculture","l1":"இலமென்று அசைஇ இருப்பாரைக் காணின்","l2":"நிலமென்னும் நல்லாள் நகும்.","mv":"எம்மிடம் ஒரு பொருளும் இல்லை என்று எண்ணி வறுமையால் சோம்பியிருப்பவரைக் கண்டால், நிலமகள் தன்னுள் சிரிப்பாள்.","ex":"The maiden, Earth, will laugh at the sight of those who plead poverty and lead an idle life","t1":"Ilamendru Asaii Iruppaaraik Kaanin","t2":"Nilamennum Nallaal Nakum"},{"n":1041,"c":105,"ct":"நல்குரவு","ce":"On Poverty","l1":"இன்மையின் இன்னாதது யாதெனின் இன்மையின்","l2":"இன்மையே இன்னா தது.","mv":"வறுமையைப் போல் துன்பமானது எது என்று கேட்டால், வறுமையைப் போல் துன்பமானது வறுமை ஒன்றே ஆகும்.","ex":"There is nothing that afflicts (one) like poverty","t1":"Inmaiyin Innaadhadhu Yaadhenin Inmaiyin","t2":"Inmaiye Innaa Thadhu"},{"n":1042,"c":105,"ct":"நல்குரவு","ce":"On Poverty","l1":"இன்மை எனவொரு பாவி மறுமையும்","l2":"இம்மையும் இன்றி வரும்.","mv":"வறுமை என்று சொல்லப்படும் பாவி ஒருவனை நெருங்கினால், அவனுக்கு மறுமையின்பமும், இன்மையின்பமும் இல்லாமற் போகும் நிலைமை வரும்.","ex":"When cruel poverty comes on, it deprives one of both the present and future (bliss)","t1":"Inmai Enavoru Paavi Marumaiyum","t2":"Immaiyum Indri Varum"},{"n":1043,"c":105,"ct":"நல்குரவு","ce":"On Poverty","l1":"தொல்வரவும் தோலும் கெடுக்கும் தொகையாக","l2":"நல்குரவு என்னும் நசை.","mv":"வறுமை என்று சொல்லப்படும் ஆசைநிலை ஒருவனைப் பற்றினால், அவனுடைய பழைமையானக் குடிப் பண்பையும் புகழையும் ஒரு சேரக் கெடுக்கும்.","ex":"Hankering poverty destroys at once the greatness of (one's) ancient descent and (the dignity of one's) speech","t1":"Tholvaravum Tholum Ketukkum Thokaiyaaka","t2":"Nalkuravu Ennum Nasai"},{"n":1044,"c":105,"ct":"நல்குரவு","ce":"On Poverty","l1":"இற்பிறந்தார் கண்ணேயும் இன்மை இளிவந்த","l2":"சொற்பிறக்கும் சோர்வு தரும்.","mv":"வறுமை என்பது, நல்ல குடியிற் பிறந்தவரிடத்திலும் இழிவு தரும் சொல் பிறப்பதற்குக் காரணமான சோர்வை உண்டாக்கி விடும்.","ex":"Even in those of high birth, poverty will produce the fault of uttering mean words","t1":"Irpirandhaar Kanneyum Inmai Ilivandha","t2":"Sorpirakkum Sorvu Tharum"},{"n":1045,"c":105,"ct":"நல்குரவு","ce":"On Poverty","l1":"நல்குரவு என்னும் இடும்பையுள் பல்குரைத்","l2":"துன்பங்கள் சென்று படும்.","mv":"வறுமை என்று சொல்லப்படும் துன்ப நிலையினுள் பலவகையாக வேறுபட்டுள்ள எல்லாத் துன்பங்களும் சென்று விளைந்திடும்.","ex":"The misery of poverty brings in its train many (more) miseries","t1":"Nalkuravu Ennum Itumpaiyul Palkuraith","t2":"Thunpangal Sendru Patum"},{"n":1046,"c":105,"ct":"நல்குரவு","ce":"On Poverty","l1":"நற்பொருள் நன்குணர்ந்து சொல்லினும் நல்கூர்ந்தார்","l2":"சொற்பொருள் சோர்வு படும்.","mv":"நல்ல நூற் பொருளை நன்றாக உணர்ந்து எடுத்துச் சொன்னப் போதிலும் வறியவர் சொன்ன சொற்பொருள் கேட்பார் இல்லாமல் பயன்படாமல் போகும்.","ex":"The words of the poor are profitless, though they may be sound in thought and clear in expression","t1":"Narporul Nankunarndhu Sollinum Nalkoorndhaar","t2":"Sorporul Sorvu Patum"},{"n":1047,"c":105,"ct":"நல்குரவு","ce":"On Poverty","l1":"அறஞ்சாரா நல்குரவு ஈன்றதா யானும்","l2":"பிறன்போல நோக்கப் படும்.","mv":"அறத்தோடு பொருந்தாத வறுமை ஒருவனைச் சேர்ந்தால் பெற்றத் தாயாலும் அவன் அயலானைப் போல் புறக்கணித்துப் பார்க்கப்படுவான்.","ex":"He that is reduced to absolute poverty will be regarded as a stranger even by his own mother","t1":"Aranjaaraa Nalkuravu Eendradhaa Yaanum","t2":"Piranpola Nokkap Patum"},{"n":1048,"c":105,"ct":"நல்குரவு","ce":"On Poverty","l1":"இன்றும் வருவது கொல்லோ நெருநலும்","l2":"கொன்றது போலும் நிரப்பு.","mv":"நேற்றும் கொலை செய்தது போல் துன்புறுத்திய வறுமை இன்றும் என்னிடம் வருமோ, (என்று வறியவன் நாள்தோறும் கலங்கி வருந்துவான்).","ex":"Is the poverty that almost killed me yesterday, to meet me today too ?","t1":"Indrum Varuvadhu Kollo Nerunalum","t2":"Kondradhu Polum Nirappu"},{"n":1049,"c":105,"ct":"நல்குரவு","ce":"On Poverty","l1":"நெருப்பினுள் துஞ்சலும் ஆகும் நிரப்பினுள்","l2":"யாதொன்றும் கண்பாடு அரிது.","mv":"ஒருவன் நெருப்பினுள் இருந்து தூங்குதலும் முடியும், ஆனால் வறுமை நிலையில் எவ்வகையாலும் கண்மூடித் தூங்குதல் அரிது.","ex":"One may sleep in the midst of fire; but by no means in the midst of poverty","t1":"Neruppinul Thunjalum Aakum Nirappinul","t2":"Yaadhondrum Kanpaatu Aridhu"},{"n":1050,"c":105,"ct":"நல்குரவு","ce":"On Poverty","l1":"துப்புர வில்லார் துவரத் துறவாமை","l2":"உப்பிற்கும் காடிக்கும் கூற்று.","mv":"நுகரும் பொருள் இல்லாத வறியவர் முற்றுந் துறக்க கூடியவராக இருந்தும் துறக்காத காரணம், உப்புக்கும் கஞ்சிக்கும் எமனாக இருப்பதே ஆகும்.","ex":"The destitute poor, who do not renounce their bodies, only consume their neighbour's salt and water","t1":"Thuppura Villaar Thuvarath Thuravaamai","t2":"Uppirkum Kaatikkum Kootru"},{"n":1051,"c":106,"ct":"இரவு","ce":"On Begging","l1":"இரக்க இரத்தக்கார்க் காணின் கரப்பின்","l2":"அவர்பழி தம்பழி அன்று.","mv":"இரந்து கேட்க தக்கவரைக் கண்டால் அவனிடம் இரக்க வேண்டும், அவர் இல்லை என்று ஒளிப்பாரானால் அது அவர்க்கு பழி, தமக்கு பழி அன்று.","ex":"If you meet with those that may be begged of, you may beg; (but) if they withhold (their gift) it is their blame and not yours","t1":"Irakka Iraththakkaark Kaanin Karappin","t2":"Avarpazhi Thampazhi Andru"},{"n":1052,"c":106,"ct":"இரவு","ce":"On Begging","l1":"இன்பம் ஒருவற்கு இரத்தல் இரந்தவை","l2":"துன்பம் உறாஅ வரின்.","mv":"இரந்து கேட்ட பொருள் துன்பமுறாமல் கிடைக்குமானால், அவ்வாறு இரத்தலும் இன்பம் என்று சொல்லத் தக்கதாகும்.","ex":"Even begging may be pleasant, if what is begged for is obtained without grief (to him that begs)","t1":"Inpam Oruvarku Iraththal Irandhavai","t2":"Thunpam Uraaa Varin"},{"n":1053,"c":106,"ct":"இரவு","ce":"On Begging","l1":"கரப்பிலா நெஞ்சின் கடனறிவார் முன்நின்று","l2":"இரப்புமோ ரேஎர் உடைத்து.","mv":"ஒளிப்பு இல்லாத நெஞ்சும், கடைமையுணர்ச்சியும், உள்ளவரின் முன்னே நின்று இரந்து பொருள் கேட்பதும் ஓர் அழகு உடையதாகும்.","ex":"There is even a beauty in standing before and begging of those who are liberal in their gifts and understand their duty (to beggars)","t1":"Karappilaa Nenjin Katanarivaar Munnindru","t2":"Irappumo Reer Utaiththu"},{"n":1054,"c":106,"ct":"இரவு","ce":"On Begging","l1":"இரத்தலும் ஈதலே போலும் கரத்தல்","l2":"கனவிலும் தேற்றாதார் மாட்டு.","mv":"உள்ளதை மறைத்துக் கூறும் தன்மையைக் கனவிலும் அறியாதவரிடத்தில் இரந்து கேட்பதும் பிறர்க்கு கொடுப்பதைப் போன்ற சிறப்புடையது.","ex":"To beg of such as never think of withholding (their charity) even in their dreams, is in fact the same as giving (it oneself);","t1":"Iraththalum Eedhale Polum Karaththal","t2":"Kanavilum Thetraadhaar Maattu"},{"n":1055,"c":106,"ct":"இரவு","ce":"On Begging","l1":"கரப்பிலார் வையகத்து உண்மையால் கண்ணின்று","l2":"இரப்பவர் மேற்கொள் வது.","mv":"ஒருவர் முன் நின்று இரப்பவர் அந்த இரத்தலை மேற்கொள்வது, உள்ளதை இல்லை என்று ஒளித்துக்கூறாத நன்மைகள் உலகத்தில் இருப்பதால் தான்.","ex":"As there are in the world those that give without refusing, there are (also) those that prefer to beg by simply standing before them","t1":"Karappilaar Vaiyakaththu Unmaiyaal Kannindru","t2":"Irappavar Merkol Vadhu"},{"n":1056,"c":106,"ct":"இரவு","ce":"On Begging","l1":"கரப்பிடும்பை யில்லாரைக் காணின் நிரப்பிடும்பை","l2":"எல்லாம் ஒருங்கு கெடும்.","mv":"உள்ளதை ஒளிக்கும் துன்பநிலை இல்லாதவரைக் கண்டால், இரப்பவரின் வறுமைத் துன்பம் எல்லாம் ஒரு சேரக் கெடும்.","ex":"All the evil of begging will be removed at the sight of those who are far from the evil of refusing","t1":"Karappitumpai Yillaaraik Kaanin Nirappitumpai","t2":"Ellaam Orungu Ketum"},{"n":1057,"c":106,"ct":"இரவு","ce":"On Begging","l1":"இகழ்ந்தெள்ளாது ஈவாரைக் காணின் மகிழ்ந்துள்ளம்","l2":"உள்ளுள் உவப்பது உடைத்து.","mv":"இகழ்ந்து எள்ளாமல் பொருள் கொடுப்பவரைக் கண்டால், இரப்பவரின் உள்ளம் மகிழ்ந்து உள்ளுக்குள்ளே உவகை அடையும் தன்மையுடையதாகும்.","ex":"Beggars rejoice exceedingly when they behold those who bestow (their alms) with kindness and courtesy","t1":"Ikazhndhellaadhu Eevaaraik Kaanin Makizhndhullam","t2":"Ullul Uvappadhu Utaiththu"},{"n":1058,"c":106,"ct":"இரவு","ce":"On Begging","l1":"இரப்பாரை இல்லாயின் ஈர்ங்கண்மா ஞாலம்","l2":"மரப்பாவை சென்றுவந் தற்று.","mv":"இரப்பவர் இல்லையானால், இப் பெரிய உலகின் இயக்கம் மரத்தால் செய்த பாவை கயிற்றினால் ஆட்டப்பட்டுச் சென்று வந்தாற் போன்றதாகும்.","ex":"If there were no beggars, (the actions done in) the cool wide world would only resemble the movement of a puppet","t1":"Irappaarai Illaayin Eernganmaa Gnaalam","t2":"Marappaavai Sendruvan Thatru"},{"n":1059,"c":106,"ct":"இரவு","ce":"On Begging","l1":"ஈவார்கண் என்னுண்டாம் தோற்றம் இரந்துகோள்","l2":"மேவார் இலாஅக் கடை.","mv":"பொருள் இல்லை என்று இரந்து அதைப் பெற்றுக் கொள்ள விரும்புவோர் இல்லாதபோது, பொருள் கொடுப்பவனிடத்தில் என்ன புகழ் உண்டாகும்.","ex":"What (praise) would there be to givers (of alms) if there were no beggars to ask for and reveive (them)","t1":"Eevaarkan Ennuntaam Thotram Irandhukol","t2":"Mevaar Ilaaak Katai"},{"n":1060,"c":106,"ct":"இரவு","ce":"On Begging","l1":"இரப்பான் வெகுளாமை வேண்டும் நிரப்பிடும்பை","l2":"தானேயும் சாலும் கரி.","mv":"இரப்பவன் எவரிடத்திலும் சினம் கொள்ளாதிருக்க வேண்டும், அவன் அடைந்துள்ள வறுமைத் துன்பமே அவனுக்கு அறிவு புகட்டும் சான்றாக அமையும்.","ex":"He who begs ought not to be angry (at a refusal); for even the misery of (his own) poverty should be a sufficient reason (for so doing)","t1":"Irappaan Vekulaamai Ventum Nirappitumpai","t2":"Thaaneyum Saalum Kari"},{"n":1061,"c":107,"ct":"இரவச்சம்","ce":"On Fear of Begging","l1":"கரவாது உவந்தீயும் கண்ணன்னார் கண்ணும்","l2":"இரவாமை கோடி உறும்.","mv":"உள்ளதை மறைக்காமல் உள்ளம் மகிழ்ந்து கொடுக்கும் கண்போல் சிறந்தவரிடத்திலும் சென்று இரவாமலிருப்பதே கோடி மடங்கு நல்லதாகும்.","ex":"Not to beg (at all) even from those excellent persons who cheerfully give without refusing, will do immense good","t1":"Karavaadhu Uvandheeyum Kannannaar Kannum","t2":"Iravaamai Koti Urum"},{"n":1062,"c":107,"ct":"இரவச்சம்","ce":"On Fear of Begging","l1":"இரந்தும் உயிர்வாழ்தல் வேண்டின் பரந்து","l2":"கெடுக உலகியற்றி யான்.","mv":"உலகத்தை படைத்தவன் உலகில் சிலர் இரந்தும் உயிர்வாழுமாறு ஏற்படுத்தியிருந்தால், அவன் இரப்பவரைப் போல் எங்கும் அலைந்து கெடுவானாக.","ex":"If the Creator of the world has decreed even begging as a means of livelihood, may he too go abegging and perish","t1":"Irandhum Uyirvaazhdhal Ventin Parandhu","t2":"Ketuka Ulakiyatri Yaan"},{"n":1063,"c":107,"ct":"இரவச்சம்","ce":"On Fear of Begging","l1":"இன்மை இடும்பை இரந்துதீர் வாமென்னும்","l2":"வன்மையின் வன்பாட்ட தில்.","mv":"வறுமைத் துன்பத்தை இரப்பதன் வாயிலாகத் தீர்ப்போம், என்று கருதி முயற்சியைக் கைவிட்ட வன்மையைப் போல் வன்மையானது வேறு இல்லை.","ex":"There is no greater folly than the boldness with which one seeks to remedy the evils of poverty by begging (rather than by working)","t1":"Inmai Itumpai Irandhudheer Vaamennum","t2":"Vanmaiyin Vanpaatta Thil"},{"n":1064,"c":107,"ct":"இரவச்சம்","ce":"On Fear of Begging","l1":"இடமெல்லாம் கொள்ளாத் தகைத்தே இடமில்லாக்","l2":"காலும் இரவொல்லாச் சால்பு.","mv":"வாழ வழி இல்லாத போதும் இரந்து கேட்க உடன்படாத சால்பு, உலகத்தில் இடமெல்லாம் கொள்ளாத அவ்வளவு பொருமையுடையதாகும்.","ex":"Even the whole world cannot sufficiently praise the dignity that would not beg even in the midst of destitution","t1":"Itamellaam Kollaath Thakaiththe Itamillaak","t2":"Kaalum Iravollaach Chaalpu"},{"n":1065,"c":107,"ct":"இரவச்சம்","ce":"On Fear of Begging","l1":"தெண்ணீர் அடுபுற்கை ஆயினும் தாள்தந்தது","l2":"உண்ணலின் ஊங்கினிய தில்.","mv":"தெளிந்த நீர் போல் சமைத்த கூழே ஆனாலும், முயற்சியால் கிடைத்ததை உண்பதைவிட இனிமையானது வேறொன்றும் இல்லை.","ex":"Even thin gruel is ambrosia to him who has obtained it by labour","t1":"Thenneer Atupurkai Aayinum Thaaldhandhadhu","t2":"Unnalin Oonginiya Thil"},{"n":1066,"c":107,"ct":"இரவச்சம்","ce":"On Fear of Begging","l1":"ஆவிற்கு நீரென்று இரப்பினும் நாவிற்கு","l2":"இரவின் இளிவந்த தில்.","mv":"பசுவிற்கு நீர் வேண்டும் என்று அறம் நோக்கி இரந்து கேட்டாலும், இர த்தலை விட நாவிற்கு இழிவானது மற்றொன்று இல்லை.","ex":"There is nothing more disgraceful to one's tongue than to use it in begging water even for a cow","t1":"Aavirku Neerendru Irappinum Naavirku","t2":"Iravin Ilivandha Thil"},{"n":1067,"c":107,"ct":"இரவச்சம்","ce":"On Fear of Begging","l1":"இரப்பன் இரப்பாரை எல்லாம் இரப்பின்","l2":"கரப்பார் இரவன்மின் என்று.","mv":"இரந்து கேட்பதனால் உள்ளதை ஒளிப்பவரிடத்தில் சென்று இரக்க வேண்டுடாம் என்று இரப்பவர் எல்லோரையும் இரந்து வேண்டுகின்றேன்.","ex":"I beseech all beggars and say, \"If you need to beg, never beg of those who give unwillingly.\"","t1":"Irappan Irappaarai Ellaam Irappin","t2":"Karappaar Iravanmin Endru"},{"n":1068,"c":107,"ct":"இரவச்சம்","ce":"On Fear of Begging","l1":"இரவென்னும் ஏமாப்பில் தோணி கரவென்னும்","l2":"பார்தாக்கப் பக்கு விடும்.","mv":"இரத்தல் என்னும் காவல் இல்லாத மரக்கலம் உள்ளதை ஒளித்துவைக்கும் தன்மையாகிய வன்னிலம் தாக்கினால் உடைந்து விடும்.","ex":"The unsafe raft of begging will split when it strikes on the rock of refusal","t1":"Iravennum Emaappil Thoni Karavennum","t2":"Paardhaakkap Pakku Vitum"},{"n":1069,"c":107,"ct":"இரவச்சம்","ce":"On Fear of Begging","l1":"இரவுள்ள உள்ளம் உருகும் கரவுள்ள","l2":"உள்ளதூஉம் இன்றிக் கெடும்.","mv":"இரத்தலின் கொடுமையை நினைத்தால் உள்ளம் கரைந்து உருகும், உள்ளதை ஒழிக்கும் கொடுமையை நினைத்தால் உருகுமளவும் இல்லாமல் அழியும்.","ex":"To think of (the evil of) begging is enough to melt one's heart; but to think of refusal is enough to break it","t1":"Iravulla Ullam Urukum Karavulla","t2":"Ulladhooum Indrik Ketum"},{"n":1070,"c":107,"ct":"இரவச்சம்","ce":"On Fear of Begging","l1":"கரப்பவர்க்கு யாங்கொளிக்கும் கொல்லோ இரப்பவர்","l2":"சொல்லாடப் போஒம் உயிர்.","mv":"இரப்பவர் இல்லை என்று சொல்கின்ற அளவிலேயே உயிர் போகின்றதே, உள்ளதை இல்லை என்று ஒளிப்பவர்க்கு உயிர் எங்கு ஒளிந்திருக்குமோ.","ex":"Saying \"No\" to a beggar takes away his life. (but as that very word will kill the refuser) where then would the latter's life hide itself ?","t1":"Karappavarkku Yaangolikkum Kollo Irappavar","t2":"Sollaatap Poom Uyir"},{"n":1071,"c":108,"ct":"கயமை","ce":"On Meanness","l1":"மக்களே போல்வர் கயவர் அவரன்ன","l2":"ஒப்பாரி யாங்கண்ட தில்.","mv":"மக்களே போல் இருப்பார் கயவர், அவர் மக்களை ஒத்திருப்பது போன்ற ஒப்புமை வேறு எந்த இருவகைப் பொருள்களிடத்திலும் யாம் கண்டதில்லை.","ex":"The base resemble men perfectly (as regards form); and we have not seen such (exact) resemblance (among any other species)","t1":"Makkale Polvar Kayavar Avaranna","t2":"Oppaari Yaanganta Thil"},{"n":1072,"c":108,"ct":"கயமை","ce":"On Meanness","l1":"நன்றறி வாரிற் கயவர் திருவுடையர்","l2":"நெஞ்சத்து அவலம் இலர்.","mv":"நன்மை அறிந்தவரை விடக் கயவரே நல்ல பேறு உடையவர், ஏன் என்றால், கயவர் தம் நெஞ்சில் எதைப் பற்றியும் கவலை இல்லாதவர்.","ex":"The low enjoy more felicity than those who know what is good; for the former are not troubled with anxiety (as to the good)","t1":"Nandrari Vaarir Kayavar Thiruvutaiyar","t2":"Nenjaththu Avalam Ilar"},{"n":1073,"c":108,"ct":"கயமை","ce":"On Meanness","l1":"தேவர் அனையர் கயவர் அவருந்தாம்","l2":"மேவன செய்தொழுக லான்.","mv":"கயவரும் தேவரைப் போல் தான் விரும்புகின்றவைகளைச் செய்து மனம் போன போக்கில் நடத்தலால், கயவர் தேவரைப் போன்றவர்.","ex":"The base resemble the Gods; for the base act as they like","t1":"Thevar Anaiyar Kayavar Avarundhaam","t2":"Mevana Seydhozhuka Laan"},{"n":1074,"c":108,"ct":"கயமை","ce":"On Meanness","l1":"அகப்பட்டி ஆவாரைக் காணின் அவர஧ன்","l2":"மிகப்பட்டுச் செம்மாக்கும் கீழ்.","mv":"கீழ் மக்கள் தமக்கு கீழ் பட்டவராய் நடப்பவரைக் கண்டால், அவரை விடத் தாம் மேம்பாடு உடையவராய் இறுமாப்படைவர்.","ex":"The base feels proud when he sees persons whose acts meaner than his own","t1":"Akappatti Aavaaraik Kaanin Avarin","t2":"Mikappattuch Chemmaakkum Keezh"},{"n":1075,"c":108,"ct":"கயமை","ce":"On Meanness","l1":"அச்சமே கீழ்களது ஆசாரம் எச்சம்","l2":"அவாவுண்டேல் உண்டாம் சிறிது.","mv":"கீழ் மக்களின் ஆசாரத்திற்கு காரணமாக இருப்பது அச்சமே, எஞ்சியவற்றில் அவா உண்டானால் அதனாலும் சிறிதளவு ஆசாரம் உண்டாகும்.","ex":"(The principle of) behaviour in the mean is chiefly fear; if not, hope of gain, to some extent","t1":"Achchame Keezhkaladhu Aasaaram Echcham","t2":"Avaavuntel Untaam Siridhu"},{"n":1076,"c":108,"ct":"கயமை","ce":"On Meanness","l1":"அறைபறை அன்னர் கயவர்தாம் கேட்ட","l2":"மறைபிறர்க்கு உய்த்துரைக்க லான்.","mv":"கயவர், தாம் கேட்டறிந்த மறைப்பொருளைப் பிறர்க்கு வலிய கொண்டுபோய்ச் சொல்லுவதலால், அறையப்படும் பறை போன்றவர்.","ex":"The base are like a drum that is beaten, for they unburden to others the secrets they have heard","t1":"Araiparai Annar Kayavardhaam Ketta","t2":"Maraipirarkku Uyththuraikka Laan"},{"n":1077,"c":108,"ct":"கயமை","ce":"On Meanness","l1":"ஈர்ங்கை விதிரார் கயவர் கொடிறுடைக்கும்","l2":"கூன்கையர் அல்லா தவர்க்கு.","mv":"கயவர் தம் கன்னத்தை இடித்து உடைக்கும் படி வளைந்த கை உடையவரல்லாத மற்றவர்க்கு உண்ட எச்சில் கையையும் உதற மாட்டார்.","ex":"The mean will not (even) shake off (what sticks to) their hands (soon after a meal) to any but those who would break their jaws with their clenched fists","t1":"Eerngai Vidhiraar Kayavar Kotirutaikkum","t2":"Koonkaiyar Allaa Thavarkku"},{"n":1078,"c":108,"ct":"கயமை","ce":"On Meanness","l1":"சொல்லப் பயன்படுவர் சான்றோர் கரும்புபோல்","l2":"கொல்லப் பயன்படும் கீழ்.","mv":"அணுகி குறைச் சொல்லுகின்ற அளவிலேயே சான்றோர் பயன்படுவர், கரும்புபோல் அழித்துப் பிழிந்தால் தான் கீழ்மக்கள் பயன்படுவர்.","ex":"The great bestow (their alms) as soon as they are informed; (but) the mean, like the sugar-cane, only when they are tortured to death","t1":"Sollap Payanpatuvar Saandror Karumpupol","t2":"Kollap Payanpatum Keezh"},{"n":1079,"c":108,"ct":"கயமை","ce":"On Meanness","l1":"உடுப்பதூஉம் உண்பதூஉம் காணின் பிறர்மேல்","l2":"வடுக்காண வற்றாகும் கீழ்.","mv":"கீழ் மகன் பிறர் உடுப்பதையும், உண்பதையும் கண்டால் அவர் மேல் பொறாமை கொண்டு, வேண்டும் என்றே குற்றம் காண வல்லவனாவான்.","ex":"The base will bring an evil (accusation) against others, as soon as he sees them (enjoying) good food","t1":"Utuppadhooum Unpadhooum Kaanin Pirarmel","t2":"Vatukkaana Vatraakum Keezh"},{"n":1080,"c":108,"ct":"கயமை","ce":"On Meanness","l1":"எற்றிற் குரியர் கயவரொன்று உற்றக்கால்","l2":"விற்றற்கு உரியர் விரைந்து.","mv":"கயவர், எதற்கு உரியவர், ஒரு துன்பம் வந்தடைந்த காலத்தில் அதற்காக தம்மை பிறர்க்கு விலையாக விற்றுவிடுவதற்கு உரியவர் ஆவர்.","ex":"The base will hasten to sell themselves as soon as a calamity has befallen them. For what else are they fitted ?","t1":"Etrir Kuriyar Kayavarondru Utrakkaal","t2":"Vitrarku Uriyar Viraindhu"},{"n":1081,"c":109,"ct":"தகையணங்குறுத்தல்","ce":"On Lover's Distraction","l1":"அணங்குகொல் ஆய்மயில் கொல்லோ கனங்குழை","l2":"மாதர்கொல் மாலும் என் நெஞ்சு.","mv":"தெய்வப் பெண்ணோ! மயிலோ, கனமான குழை அணிந்த மனிதப் பெண்ணோ, என் நெஞ்சம் மயங்குகின்றதே.","ex":"Is this jewelled female a celestial, a choice peahen, or a human being ? My mind is perplexed","t1":"Anangukol Aaimayil Kollo Kananguzhai","t2":"Maadharkol Maalum En Nenju"},{"n":1082,"c":109,"ct":"தகையணங்குறுத்தல்","ce":"On Lover's Distraction","l1":"நோக்கினாள் நோக்கெதிர் நோக்குதல் தாக்கணங்கு","l2":"தானைக்கொண் டன்ன துடைத்து.","mv":"நோக்கிய அவள் பார்வைக்கு எதிரே நோக்குதல் தானே தாக்கி வருத்தும் அணங்கு, ஒரு சேனையையும் கொண்டு வந்து தாக்கினாற் போன்றது.","ex":"This female beauty returning my looks is like a celestial maiden coming with an army to contend against me","t1":"Nokkinaal Nokkedhir Nokkudhal Thaakkanangu","t2":"Thaanaikkon Tanna Thutaiththu"},{"n":1083,"c":109,"ct":"தகையணங்குறுத்தல்","ce":"On Lover's Distraction","l1":"பண்டறியேன் கூற்றென் பதனை இனியறிந்தேன்","l2":"பெண்டகையால் பேரமர்க் கட்டு.","mv":"எமன் என்று சொல்லப்படுவதை முன்பு அறியேன், இப்பொழுது கண்டறிந்தேன், அது பெண் தனமையுடன் போர் செய்யும் பெரிய கண்களை உடையது","ex":"I never knew before what is called Yama; I see it now; it is the eyes that carry on a great fight with (the help of) female qualities","t1":"Pantariyen Kootren Padhanai Iniyarindhen","t2":"Pentakaiyaal Peramark Kattu"},{"n":1084,"c":109,"ct":"தகையணங்குறுத்தல்","ce":"On Lover's Distraction","l1":"கண்டார் உயிருண்ணும் தோற்றத்தால் பெண்டகைப்","l2":"பேதைக்கு அமர்த்தன கண்.","mv":"பெண்தன்மை உடைய இந்தப் பேதைக்குக் கண்கள் கண்டவரின் உயிரை உண்ணும் தோற்றத்தோடு கூடி ஒன்றோடொன்று மாறுபட்டிருந்தன.","ex":"These eyes that seem to kill those who look at them are as it were in hostilities with this feminine simplicity","t1":"Kantaar Uyirunnum Thotraththaal Pentakaip","t2":"Pedhaikku Amarththana Kan"},{"n":1085,"c":109,"ct":"தகையணங்குறுத்தல்","ce":"On Lover's Distraction","l1":"கூற்றமோ கண்ணோ பிணையோ மடவரல்","l2":"நோக்கமிம் மூன்றும் உடைத்து.","mv":"எமனோ. கண்ணோ, பெண்மானோ, இந்த இளம் பெண்ணின் பார்வை இந்த மூன்றன் தன்மையும் உடையதாக இருக்கிறது.","ex":"Is it Yama, (a pair of) eyes or a hind ?- Are not all these three in the looks of this maid ?","t1":"Kootramo Kanno Pinaiyo Matavaral","t2":"Nokkamim Moondrum Utaiththu"},{"n":1086,"c":109,"ct":"தகையணங்குறுத்தல்","ce":"On Lover's Distraction","l1":"கொடும்புருவம் கோடா மறைப்பின் நடுங்கஞர்","l2":"செய்யல மன்இவள் கண்.","mv":"வளைந்த புருவங்கள் கோணாமல் நேராக இருந்து மறைக்குமானால், இவளுடைய கண்கள் யான் நடுங்கும் படியான துன்பத்தைச் செய்யமாட்டா.","ex":"Her eyes will cause (me) no trembling sorrow, if they are properly hidden by her cruel arched eyebrows","t1":"Kotumpuruvam Kotaa Maraippin Natungagnar","t2":"Seyyala Manival Kan"},{"n":1087,"c":109,"ct":"தகையணங்குறுத்தல்","ce":"On Lover's Distraction","l1":"கடாஅக் களிற்றின்மேற் கட்படாம் மாதர்","l2":"படாஅ முலைமேல் துகில்.","mv":"மாதருடைய சாயாத கொங்கைகளின் மேல் அணிந்த ஆடை, மதம் பிடித்த யானையின் மேல் இட்ட முகப்படாம் போன்றது.","ex":"The cloth that covers the firm bosom of this maiden is (like) that which covers the eyes of a rutting elephant","t1":"Kataaak Kalitrinmer Katpataam Maadhar","t2":"Pataaa Mulaimel Thukil"},{"n":1088,"c":109,"ct":"தகையணங்குறுத்தல்","ce":"On Lover's Distraction","l1":"ஒண்ணுதற் கோஒ உடைந்ததே ஞாட்பினுள்","l2":"நண்ணாரும் உட்குமென் பீடு.","mv":"போர்க்களத்தில் பகைவரும் அஞ்சுதற்க்கு காரணமான என் வலிமை, இவளுடைய ஒளி பொருந்திய நெற்றிக்குத் தோற்று அழிந்ததே.","ex":"On her bright brow alone is destroyed even that power of mine that used to terrify the most fearless","t1":"Onnudhar Koo Utaindhadhe Gnaatpinul","t2":"Nannaarum Utkumen Peetu"},{"n":1089,"c":109,"ct":"தகையணங்குறுத்தல்","ce":"On Lover's Distraction","l1":"பிணையேர் மடநோக்கும் நாணும் உடையாட்கு","l2":"அணியெவனோ ஏதில தந்து.","mv":"பெண்மானைப் போன்ற இளமைப் பார்வையும் நாணமும் உடைய இவளுக்கு, ஒரு தொடர்பும் இல்லாத அணிகளைச் செய்து அணிவது ஏனோ.","ex":"Of what use are other jewels to her who is adorned with modesty, and the meek looks of a hind ?","t1":"Pinaiyer Matanokkum Naanum Utaiyaatku","t2":"Aniyevano Edhila Thandhu"},{"n":1090,"c":109,"ct":"தகையணங்குறுத்தல்","ce":"On Lover's Distraction","l1":"உண்டார்கண் அல்லது அடுநறாக் காமம்போல்","l2":"கண்டார் மகிழ்செய்தல் இன்று.","mv":"கள், தன்னை உண்டவரிடத்தில் அல்லாமல் காமத்தைப் போல் தன்னைக் கண்டவரிடத்தில் மயக்கத்தை உண்டாக்குவதில்லையே.","ex":"Unlike boiled honey which yields delight only when it is drunk, love gives pleasure even when looked at","t1":"Untaarkan Alladhu Atunaraak Kaamampol","t2":"Kantaar Makizhseydhal Indru"},{"n":1091,"c":110,"ct":"குறிப்பறிதல்","ce":"Reading Love's Signs","l1":"இருநோக்கு இவளுண்கண் உள்ளது ஒருநோக்கு","l2":"நோய்நோக்கொன் றந்நோய் மருந்து.","mv":"இவளுடைய மை தீட்டிய கண்களில் உள்ளது இருவகைப்பட்ட நோக்கமாகும், அவற்றுள் ஒரு நோக்கம் நோய் செய்யும் நோக்கம், மற்றொன்று அந் நோய்க்கு மருந்தாகும்.","ex":"There are two looks in the dyed eyes of this (fair one); one causes pain, and the other is the cure thereof","t1":"Irunokku Ivalunkan Ulladhu Orunokku","t2":"Noinokkon Rannoi Marundhu"},{"n":1092,"c":110,"ct":"குறிப்பறிதல்","ce":"Reading Love's Signs","l1":"கண்களவு கொள்ளும் சிறுநோக்கம் காமத்தில்","l2":"செம்பாகம் அன்று பெரிது.","mv":"கண்ணால் என்னை நோக்கிக் களவு கொள்கின்ற சுருங்கிய பார்வை காமத்தில் நேர்பாதி அன்று, அதைவிடப் பெரிய பகுதியாகும்.","ex":"A single stolen glance of her eyes is more than half the pleasure (of sexual embrace)","t1":"Kankalavu Kollum Sirunokkam Kaamaththil","t2":"Sempaakam Andru Peridhu"},{"n":1093,"c":110,"ct":"குறிப்பறிதல்","ce":"Reading Love's Signs","l1":"நோக்கினாள் நோக்கி இறைஞ்சினாள் அஃதவள்","l2":"யாப்பினுள் அட்டிய நீர்.","mv":"என்னை நோக்கினாள், யான் கண்டதும் நோக்கித் தலைகுனிந்தால், அது அவள் வளர்க்கும் அன்பினுள் வார்க்கின்ற நீராகும்.","ex":"She has looked (at men) and stooped (her head); and that (sign) waters as it were (the corn of) our love","t1":"Nokkinaal Nokki Irainjinaal Aqdhaval","t2":"Yaappinul Attiya Neer"},{"n":1094,"c":110,"ct":"குறிப்பறிதல்","ce":"Reading Love's Signs","l1":"யான்நோக்கும் காலை நிலன்நோக்கும் நோக்காக்கால்","l2":"தான்நோக்கி மெல்ல நகும்.","mv":"யான் நோக்கும் போது அவள் நிலத்தை நோக்குவாள், யான் நோக்காத போது அவள் என்னை நோக்கி மெல்லத் தனக்குள் மகிழ்வாள்.","ex":"When I look, she looks down; when I do not, she looks and smiles gently","t1":"Yaannokkum Kaalai Nilannokkum Nokkaakkaal","t2":"Thaannokki Mella Nakum"},{"n":1095,"c":110,"ct":"குறிப்பறிதல்","ce":"Reading Love's Signs","l1":"குறிக்கொண்டு நோக்காமை அல்லால் ஒருகண்","l2":"சிறக்கணித்தாள் போல நகும்","mv":"என்னை நேராகக் குறித்துப் பார்க்காத அத் தன்மையே அல்லாமல், ஒரு கண்ணைச் சுருக்கினவள் போல் என்னைப் பார்த்து தனக்குள் மகிழ்வாள்.","ex":"She not only avoids a direct look at me, but looks as it were with a half-closed eye and smiles","t1":"Kurikkontu Nokkaamai Allaal Orukan","t2":"Sirakkaniththaal Pola Nakum"},{"n":1096,"c":110,"ct":"குறிப்பறிதல்","ce":"Reading Love's Signs","l1":"உறாஅ தவர்போல் சொலினும் செறாஅர்சொல்","l2":"ஒல்லை உணரப் படும்.","mv":"புறத்தே அயலார் போல் அன்பில்லாத சொற்களைச் சொன்னாலும், அகத்தே பகையில்லாதவரின் சொல் என்பது விரைவில் அறியப்படும்.","ex":"Though they may speak harshly as if they were strangers, the words of the friendly are soon understood","t1":"Uraaa Thavarpol Solinum Seraaarsol","t2":"Ollai Unarap Patum"},{"n":1097,"c":110,"ct":"குறிப்பறிதல்","ce":"Reading Love's Signs","l1":"செறாஅச் சிறுசொல்லும் செற்றார்போல் நோக்கும்","l2":"உறாஅர்போன்று உற்றார் குறிப்பு.","mv":"பகை கொள்ளாத கடுஞ்சொல்லும், பகைவர் போல் பார்க்கும் பார்வையும் புறத்தே அயலார் போல் இருந்து அகத்தே அன்பு கொண்டவரின் குறிப்பாகும்.","ex":"Little words that are harsh and looks that are hateful are (but) the expressions of lovers who wish to act like strangers","t1":"Seraaach Chirusollum Setraarpol Nokkum","t2":"Uraaarpondru Utraar Kurippu"},{"n":1098,"c":110,"ct":"குறிப்பறிதல்","ce":"Reading Love's Signs","l1":"அசையியற்கு உண்டாண்டோ ர் ஏஎர்யான் நோக்கப்","l2":"பசையினள் பைய நகும்.","mv":"யான் நோக்கும் போது அதற்காக அன்பு கொண்டவனாய் மெல்லச் சிரிப்பாள், அசையும் மெல்லிய இயல்பை உடைய அவளுக்கு அப்போது ஓர் அழகு உள்ளது.","ex":"When I look, the pitying maid looks in return and smiles gently; and that is a comforting sign for me","t1":"Asaiyiyarku Untaantor Eeryaan Nokkap","t2":"Pasaiyinal Paiya Nakum"},{"n":1099,"c":110,"ct":"குறிப்பறிதல்","ce":"Reading Love's Signs","l1":"ஏதிலார் போலப் பொதுநோக்கு நோக்குதல்","l2":"காதலார் கண்ணே உள.","mv":"புறத்தே அயலார்போல் அன்பில்லாத பொது நோக்கம் கொண்டு பார்த்தல், அகத்தே காதல் கொண்டவரிடம் உள்ள இயல்பாகும்.","ex":"Both the lovers are capable of looking at each other in an ordinary way, as if they were perfect strangers","t1":"Edhilaar Polap Podhunokku Nokkudhal","t2":"Kaadhalaar Kanne Ula"},{"n":1100,"c":110,"ct":"குறிப்பறிதல்","ce":"Reading Love's Signs","l1":"கண்ணொடு கண்இணை நோக்கொக்கின் வாய்ச்சொற்கள்","l2":"என்ன பயனும் இல.","mv":"கண்களோடு கண்கள் நோக்காமல் ஒத்திருந்து அன்பு செய்யுமானால் வாய்ச் சொற்கள் என்ன பயனும் இல்லாமற் போகின்றன.","ex":"The words of the mouths are of no use whatever, when there is perfect agreement between the eyes (of lovers)","t1":"Kannotu Kaninai Nokkokkin Vaaichchorkal","t2":"Enna Payanum Ila"},{"n":1101,"c":111,"ct":"புணர்ச்சிமகிழ்தல்","ce":"The Ecstasy of Love's Union","l1":"கண்டுகேட்டு உண்டுயிர்த்து உற்றறியும் ஐம்புலனும்","l2":"ஒண்தொடி கண்ணே உள.","mv":"கண்டும் கேட்டும் உண்டும் முகர்ந்தும் உற்றும் அறிகின்ற ஐந்து புலன்களாகிய இன்பங்களும் ஒளி பொருந்திய வளையல் அணிந்த இவளிடத்தில் உள்ளன.","ex":"The (simultaneous) enjoyment of the five senses of sight, hearing, taste, smell and touch can only be found with bright braceleted (women)","t1":"Kantukettu Untuyirththu Utrariyum Aimpulanum","t2":"Ondhoti Kanne Ula"},{"n":1102,"c":111,"ct":"புணர்ச்சிமகிழ்தல்","ce":"The Ecstasy of Love's Union","l1":"பிணிக்கு மருந்து பிறமன் அணியிழை","l2":"தன்நோய்க்குத் தானே மருந்து.","mv":"நோய்களுக்கு மருந்து வேறு பொருள்களாக இருக்கின்றன, ஆனால் அணிகலன் அணிந்த இவளால் வளர்ந்த நோய்க்கு இவளே மருந்தாக இருக்கின்றாள்.","ex":"The remedy for a disease is always something different (from it); but for the disease caused by this jewelled maid, she is herself the cure","t1":"Pinikku Marundhu Piraman Aniyizhai","t2":"Thannoikkuth Thaane Marundhu"},{"n":1103,"c":111,"ct":"புணர்ச்சிமகிழ்தல்","ce":"The Ecstasy of Love's Union","l1":"தாம்வீழ்வார் மென்றோள் துயிலின் இனிதுகொல்","l2":"தாமரைக் கண்ணான் உலகு.","mv":"தாமரைக் கண்ணனுடைய உலகம், தாம் விரும்பும் காதலியரின் மெல்லிய தோள்களில் துயிலும் துயில் போல் இனிமை உடையதோ.","ex":"Can the lotus-eyed Vishnu's heaven be indeed as sweet to those who delight to sleep in the delicate arms of their beloved ?","t1":"Thaamveezhvaar Mendrol Thuyilin Inidhukol","t2":"Thaamaraik Kannaan Ulaku"},{"n":1104,"c":111,"ct":"புணர்ச்சிமகிழ்தல்","ce":"The Ecstasy of Love's Union","l1":"நீங்கின் தெறூஉம் குறுகுங்கால் தண்ணென்னும்","l2":"தீயாண்டுப் பெற்றாள் இவள்?","mv":"நீங்கினால் சுடுகின்றது, அணுகினால் குளிர்ச்சியாக இருக்கின்றது, இத்தகைய புதுமையானத் தீயை இவள் எவ்விடத்திலிருந்து பெற்றாள்.","ex":"From whence has she got this fire that burns when I withdraw and cools when I approach ?","t1":"Neengin Theru�um Kurukungaal Thannennum","t2":"Theeyaantup Petraal Ival?"},{"n":1105,"c":111,"ct":"புணர்ச்சிமகிழ்தல்","ce":"The Ecstasy of Love's Union","l1":"வேட் ட பொழுதின் அவையவை போலுமே","l2":"தோட் டார் கதுப்பினாள் தோள்.","mv":"மலரணிந்த கூந்தலை உடைய இவளுடைய தோள்கள் விருப்பமான பொருள்களை நினைத்து விரும்பிய பொழுது அவ்வப் பொருள்களைப் போலவே இன்பம் செய்கின்றன.","ex":"Each varied form of joy the soul can wish is found","t1":"Vetta Pozhudhin Avaiyavai Polume","t2":"Thottaar Kadhuppinaal Thol"},{"n":1106,"c":111,"ct":"புணர்ச்சிமகிழ்தல்","ce":"The Ecstasy of Love's Union","l1":"உறுதோறு உயிர்தளிர்ப்பத் தீண்டலால் பேதைக்கு","l2":"அமிழ்தின் இயன்றன தோள்.","mv":"பொருந்து போதெல்லாம் உயிர் தளிர்க்கும் படியாகத் தீண்டுதலால் இவளுக்கு தோள்கள் அமிழ்தத்தால் செய்யப்பட்டிருக்க வேண்டும்.","ex":"The shoulders of this fair one are made of ambrosia, for they revive me with pleasure every time I embrace them","t1":"Urudhoru Uyirdhalirppath Theentalaal Pedhaikku","t2":"Amizhdhin Iyandrana Thol"},{"n":1107,"c":111,"ct":"புணர்ச்சிமகிழ்தல்","ce":"The Ecstasy of Love's Union","l1":"தம்மில் இருந்து தமதுபாத்து உண்டற்றால்","l2":"அம்மா அரிவை முயக்கு.","mv":"அழகிய மா நிறம் உடைய இவளுடைய தழுவுதல், தம்முடைய வீட்டிலிருந்து தாம் ஈட்டிய பொருளைப் பகுந்து கொடுத்து உண்டாற் போன்றது.","ex":"The embraces of a gold-complexioned beautiful female are as pleasant as to dwell in one's own house and live by one's own (earnings) after distributing (a portion of it in charity)","t1":"Thammil Irundhu Thamadhupaaththu Untatraal","t2":"Ammaa Arivai Muyakku"},{"n":1108,"c":111,"ct":"புணர்ச்சிமகிழ்தல்","ce":"The Ecstasy of Love's Union","l1":"வீழும் இருவர்க்கு இனிதே வளியிடை","l2":"போழப் படாஅ முயக்கு.","mv":"காற்று இடையறுத்துச் செல்லாதபடி தழுவும் தழுவுதல், ஒருவரை ஒருவர் விரும்பிய காதலர் இருவருக்கும் இனிமை உடையதாகும்.","ex":"To ardent lovers sweet is the embrace that cannot be penetrated even by a breath of breeze","t1":"Veezhum Iruvarkku Inidhe Valiyitai","t2":"Pozhap Pataaa Muyakku"},{"n":1109,"c":111,"ct":"புணர்ச்சிமகிழ்தல்","ce":"The Ecstasy of Love's Union","l1":"ஊடல் உணர்தல் புணர்தல் இவைகாமம்","l2":"கூடியார் பெற்ற பயன்.","mv":"ஊடுதல், ஊடலை உணர்ந்து விடுதல், அதன்பின் கூடுதல் ஆகிய இவை காதல் வாழ்வு நிறைவேறப் பெற்றவர் பெற்ற பயன்களாகும்.","ex":"Love quarrel, reconciliation and intercourse - these are the advantages reaped by those who marry for lust","t1":"Ootal Unardhal Punardhal Ivaikaamam","t2":"Kootiyaar Petra Payan"},{"n":1110,"c":111,"ct":"புணர்ச்சிமகிழ்தல்","ce":"The Ecstasy of Love's Union","l1":"அறிதோறு அறியாமை கண்டற்றால் காமம்","l2":"செறிதோறும் சேயிழை மாட்டு.","mv":"செந்நிற அணிகலன்களை அணிந்த இவளிடம் பொருந்துந்தோறும் காதல் உணர்தல்,நூற் பொருள்களை அறிய அறிய அறியாதமைக் கண்டாற் போன்றது.","ex":"As (one's) ignorance is discovered the more one learns, so does repeated intercourse with a welladorned female (only create a desire for more)","t1":"Aridhoru Ariyaamai Kantatraal Kaamam","t2":"Seridhorum Seyizhai Maattu"},{"n":1111,"c":112,"ct":"நலம்புனைந்துரைத்தல்","ce":"On His Lady","l1":"நன்னீரை வாழி அனிச்சமே நின்னினும்","l2":"மென்னீரள் யாம்வீழ் பவள்.","mv":"அனிச்சப்பூவே நல்ல மென்மை தன்மை பெற்றிறுக்கின்றாய், நீ வாழ்க, யாம் விரும்பும் காதலி உன்னை விட மெல்லியத் தன்மை கொண்டவள்.","ex":"May you flourish, O Anicham! you have a delicate nature But my beloved is more delicate than you","t1":"Nanneerai Vaazhi Anichchame Ninninum","t2":"Menneeral Yaamveezh Paval"},{"n":1112,"c":112,"ct":"நலம்புனைந்துரைத்தல்","ce":"On His Lady","l1":"மலர்காணின் மையாத்தி நெஞ்சே இவள்கண்","l2":"பலர்காணும் பூவொக்கும் என்று.","mv":"நெஞ்சமே! இவளுடைய கண்கள் பலரும் காண்கின்ற மலர்களை ஒத்திருக்கின்றன, என்று நினைத்து ஒத்த மலர்களைக் கண்டால் நீ மயங்குகின்றாய்.","ex":"O my soul, fancying that flowers which are seen by many can resemble her eyes, you become confused at the sight of them","t1":"Malarkaanin Maiyaaththi Nenje Ivalkan","t2":"Palarkaanum Poovokkum Endru"},{"n":1113,"c":112,"ct":"நலம்புனைந்துரைத்தல்","ce":"On His Lady","l1":"முறிமேனி முத்தம் முறுவல் வெறிநாற்றம்","l2":"வேலுண்கண் வேய்த்தோ ளவட்கு.","mv":"மூங்கில் போன்ற தோளை உடைய இவளுக்குத் தளிரே மேன், முத்தே பல், இயற்கை மணமே மணம், வேலே மை உண்ட கண்.","ex":"The complexion of this bamboo-shouldered one is that of a shoot; her teeth, are pearls; her breath,","t1":"Murimeni Muththam Muruval Verinaatram","t2":"Velunkan Veyththo Lavatku"},{"n":1114,"c":112,"ct":"நலம்புனைந்துரைத்தல்","ce":"On His Lady","l1":"காணின் குவளை கவிழ்ந்து நிலன்நோக்கும்","l2":"மாணிழை கண்ணொவ்வேம் என்று.","mv":"குவளை மலர்கள் காணும் தன்மைப் பெற்றுக் கண்டால், இவளுடைய கண்களுக்கு தாம் ஒப்பாக வில்லையே என்று தலை கவிழ்ந்து நிலத்தை நோக்கும்.","ex":"If the blue lotus could see, it would stoop and look at the ground saying, \"I can never resemble the eyes of this excellent jewelled one.\"","t1":"Kaanin Kuvalai Kavizhndhu Nilannokkum","t2":"Maanizhai Kannovvem Endru"},{"n":1115,"c":112,"ct":"நலம்புனைந்துரைத்தல்","ce":"On His Lady","l1":"அனிச்சப்பூக் கால்களையாள் பெய்தாள் நுகப்பிற்கு","l2":"நல்ல படாஅ பறை.","mv":"அவள் தன் மென்மை அறியாமல் அனிச்ச மலர்களைக் காம்பு களையாமல் சூடினால், அவற்றால் நொந்து வருத்தும் அவளுடைய இடைக்குப் பறைகள் நல்லனவாய் ஒலியா.","ex":"No merry drums will be beaten for the (tender) waist of her who has adorned herself with the anicham without having removed its stem","t1":"Anichchappook Kaalkalaiyaal Peydhaal Nukappirku","t2":"Nalla Pataaa Parai"},{"n":1116,"c":112,"ct":"நலம்புனைந்துரைத்தல்","ce":"On His Lady","l1":"மதியும் மடந்தை முகனும் அறியா","l2":"பதியின் கலங்கிய மீன்.","mv":"விண்மீன்கள் திங்களையும் இவளுடைய முகத்தையும் வேறுபாடு கண்டு அறியமுடியாமல் தம் நிலையில் நிற்காமல் கலங்கித் திரிகின்றன.","ex":"The stars have become confused in their places not being able to distinguish between the moon and the maid's countenance","t1":"Madhiyum Matandhai Mukanum Ariyaa","t2":"Padhiyin Kalangiya Meen"},{"n":1117,"c":112,"ct":"நலம்புனைந்துரைத்தல்","ce":"On His Lady","l1":"அறுவாய் நிறைந்த அவிர்மத஧ க்குப் போல","l2":"மறுவுண்டோ மாதர் முகத்து.","mv":"குறைந்த இடமெல்லாம் படிப்படியாக நிறைந்து விளங்குகின்ற திங்களிடம் உள்ளது போல் இந்த மாதர் முகத்தில் களங்கம் உண்டோ.இல்லையே.","ex":"Could there be spots in the face of this maid like those in the bright full moon ?","t1":"Aruvaai Niraindha Avirmadhikkup Pola","t2":"Maruvunto Maadhar Mukaththu"},{"n":1118,"c":112,"ct":"நலம்புனைந்துரைத்தல்","ce":"On His Lady","l1":"மாதர் முகம்போல் ஒளிவிட வல்லையேல்","l2":"காதலை வாழி மத஧.","mv":"திங்களே! இம் மாதரின் முகத்தைப் போல உண்ணால் ஒளி வீச முடியுமானால், நீயும் இவள் போல் என் காதலுக்கு உரிமை பெறுவாய்.","ex":"If you can indeed shine like the face of women, flourish, O moon, for then would you be worth loving ?","t1":"Maadhar Mukampol Olivita Vallaiyel","t2":"Kaadhalai Vaazhi Madhi"},{"n":1119,"c":112,"ct":"நலம்புனைந்துரைத்தல்","ce":"On His Lady","l1":"மலரன்ன கண்ணாள் முகமொத்தி யாயின்","l2":"பலர்காணத் தோன்றல் மதி.","mv":"திங்களே! மலர்போன்ற கண்களை உடைய இவளுடைய முகத்தை ஒத்திருக்க விரும்பினால், நீ பலரும் காணும்படியாகத் தோன்றாதே.","ex":"O moon, if you wish to resemble the face of her whose eyes are like (these) flowers, do not appear so as to be seen by all","t1":"Malaranna Kannaal Mukamoththi Yaayin","t2":"Palarkaanath Thondral Madhi"},{"n":1120,"c":112,"ct":"நலம்புனைந்துரைத்தல்","ce":"On His Lady","l1":"அனிச்சமும் அன்னத்தின் தூவியும் மாதர்","l2":"அடிக்கு நெருஞ்சிப் பழம்.","mv":"அனிச்ச மலரும், அன்னப்பறவையின் இறகும் ஆகிய இவைகள் மாதரின் மெல்லிய அடிகளுக்கு நெருஞ்சிமுள் போன்றவை.","ex":"The anicham and the feathers of the swan are to the feet of females, like the fruit of the (thorny) Nerunji","t1":"Anichchamum Annaththin Thooviyum Maadhar","t2":"Atikku Nerunjip Pazham"},{"n":1121,"c":113,"ct":"காதற்சிறப்புரைத்தல்","ce":"On the Affirmation of Love","l1":"பாலொடு தேன்கலந் தற்றே பணிமொழி","l2":"வாலெயிறு ஊறிய நீர்.","mv":"மென்மையான மொழிகளைப் பேசு கின்ற இவளுடைய தூய பற்களில் ஊறிய நீர் பாலுடன் தேனைக் கலந்தாற் போன்றதாகும்.","ex":"The water which oozes from the white teeth of this soft speeched damsel is like a mixture of milk and honey","t1":"Paalotu Thenkalan Thatre Panimozhi","t2":"Vaaleyiru Ooriya Neer"},{"n":1122,"c":113,"ct":"காதற்சிறப்புரைத்தல்","ce":"On the Affirmation of Love","l1":"உடம்பொடு உயிரிடை என்னமற் றன்ன","l2":"மடந்தையொடு எம்மிடை நட்பு.","mv":"இம் மடந்தையோடு எம்மிடையே உள்ள நட்பு முறைகள், உடம்போடு உயிர்க்கு உள்ள தொடர்புகள், எத்தன்மையானவையோ அத்தன்மையானவை.","ex":"The love between me and this damsel is like the union of body and soul","t1":"Utampotu Uyiritai Ennamar Ranna","t2":"Matandhaiyotu Emmitai Natpu"},{"n":1123,"c":113,"ct":"காதற்சிறப்புரைத்தல்","ce":"On the Affirmation of Love","l1":"கருமணியிற் பாவாய்நீ போதாயாம் வீழும்","l2":"திருநுதற்கு இல்லை இடம்.","mv":"என் கண்ணின் கருமணியில் உள்ள பாவையே நீ போய் விடு, யாம் விரும்புகின்ற இவளுக்கு என் கண்ணில் இருக்க இடம் இல்லையே.","ex":"O you image in the pupil (of my eye)! depart; there is no room for (my) fair-browed beloved","t1":"Karumaniyir Paavaainee Podhaayaam Veezhum","t2":"Thirunudharku Illai Itam"},{"n":1124,"c":113,"ct":"காதற்சிறப்புரைத்தல்","ce":"On the Affirmation of Love","l1":"வாழ்தல் உயிர்க்கன்னள் ஆயிழை சாதல்","l2":"அதற்கன்னள் நீங்கும் இடத்து.","mv":"ஆராய்ந்து அணிகலன்களை அணிந்த இவள் கூடும் போது உயிர்க்கு வாழ்வு போன்றவள், பிரியும் போது உயிர்க்கு சாவு போன்றவள்.","ex":"My fair-jewelled one resembles the living soul (when she is in union with me), the dying soul when she leaves me","t1":"Vaazhdhal Uyirkkannal Aayizhai Saadhal","t2":"Adharkannal Neengum Itaththu"},{"n":1125,"c":113,"ct":"காதற்சிறப்புரைத்தல்","ce":"On the Affirmation of Love","l1":"உள்ளுவன் மன்யான் மறப்பின் மறப்பறியேன்","l2":"ஒள்ளமர்க் கண்ணாள் குணம்.","mv":"போர் செய்யும் பண்புகளை உடைய இவளுடைய பண்புகளை யான் மறந்தால் பிறகு நினைக்க முடியும் ஆனால் ஒரு போதும் மறந்ததில்லையே.","ex":"If I had forgotten her who has bright battling eyes, I would have remembered (thee); but I never forget her (Thus says he to her maid)","t1":"Ulluvan Manyaan Marappin Marappariyen","t2":"Ollamark Kannaal Kunam"},{"n":1126,"c":113,"ct":"காதற்சிறப்புரைத்தல்","ce":"On the Affirmation of Love","l1":"கண்ணுள்ளின் போகார் இமைப்பின் பருகுவரா","l2":"நுண்ணியர்எம் காத லவர்.","mv":"எம் காதலர் எம் கண்ணுள்ளிருந்து போக மாட்டார், கண்ணை மூடி இமைத்தாலும் அதனால் வருந்த மாட்டார், அவர் அவ்வளவு நுட்பமானவர்.","ex":"My lover would not depart from mine eyes; even if I wink, he would not suffer (from pain); he is so ethereal","t1":"Kannullin Pokaar Imaippin Parukuvaraa","t2":"Nunniyarem Kaadha Lavar"},{"n":1127,"c":113,"ct":"காதற்சிறப்புரைத்தல்","ce":"On the Affirmation of Love","l1":"கண்ணுள்ளார் காத லவராகக் கண்ணும்","l2":"எழுதேம் கரப்பாக்கு அறிந்து.","mv":"எம் காதலர் கண்ணினுள் இருக்கின்றார், ஆகையால் மை எழுதினால் அவர் மறைவதை எண்ணிக் கண்ணுக்கு மையும் எழுதமாட்டோம்.","ex":"As my lover abides in my eyes, I will not even paint them, for he would (then) have to conceal himself","t1":"Kannullaar Kaadha Lavaraakak Kannum","t2":"Ezhudhem Karappaakku Arindhu"},{"n":1128,"c":113,"ct":"காதற்சிறப்புரைத்தல்","ce":"On the Affirmation of Love","l1":"நெஞ்சத்தார் காத லவராக வெய்துண்டல்","l2":"அஞ்சுதும் வேபாக் கறிந்து.","mv":"எம் காதலர் நெஞ்சினுள் இருக்கின்றார், ஆகையால் சூடான பொருளை உண்டால் அவர் வெப்பமுறுதலை எண்ணிச் சூடான பொருளை உண்ண அஞ்சு கின்றோம்.","ex":"As my lover is in my heart, I am afraid of eating (anything) hot, for I know it would pain him","t1":"Nenjaththaar Kaadha Lavaraaka Veydhuntal","t2":"Anjudhum Vepaak Karindhu"},{"n":1129,"c":113,"ct":"காதற்சிறப்புரைத்தல்","ce":"On the Affirmation of Love","l1":"இமைப்பின் கரப்பாக்கு அறிவல் அனைத்திற்கே","l2":"ஏதிலர் என்னும் இவ் வூர்.","mv":"கண் இமைத்தால் காதலர் மறைந்து போதலை அறிகின்றேன், அவ்வளவிற்கே இந்த ஊரார் அவரை அன்பில்லாதவர் என்று சொல்லுவர்.","ex":"I will not wink, knowing that if I did, my lover would hide himself; and for this reason, this town says, he is unloving","t1":"Imaippin Karappaakku Arival Anaiththirke","t2":"Edhilar Ennum Iv Voor"},{"n":1130,"c":113,"ct":"காதற்சிறப்புரைத்தல்","ce":"On the Affirmation of Love","l1":"உவந்துறைவர் உள்ளத்துள் என்றும் இகந்துறைவர்","l2":"ஏதிலர் என்னும் இவ் வூர்.","mv":"காதலர் எப்போதும் என் உள்ளத்தில் மகிழ்ந்து வாழ்கின்றார், ஆனால் அதை அறியாமல் பிரிந்து வாழ்கின்றார், அன்பில்லாதவர் என்று இந்த ஊரார் அவரைப் பழிப்பர்.","ex":"My lover dwells in my heart with perpetual delight; but the town says he is unloving and (therefore) dwells afar","t1":"Uvandhuraivar Ullaththul Endrum Ikandhuraivar","t2":"Edhilar Ennum Iv Voor"},{"n":1131,"c":114,"ct":"நாணுத்துறவுரைத்தல்","ce":"Speaking Out Unabashed","l1":"காமம் உழந்து வருந்தினார்க்கு ஏமம்","l2":"மடலல்லது இல்லை வலி.","mv":"காமத்தால் துன்புற்று (காதலின் அன்பு பெறாமல்) வருந்தினவர்க்குக் காவல் மடலூர்தல் அல்லாமல் வலிமையானத் துணை வேறொன்றும் இல்லை.","ex":"To those who after enjoyment of sexual pleasure suffer (for want of more), there is no help so efficient as the palmyra horse","t1":"Kaamam Uzhandhu Varundhinaarkku Emam","t2":"Matalalladhu Illai Vali"},{"n":1132,"c":114,"ct":"நாணுத்துறவுரைத்தல்","ce":"Speaking Out Unabashed","l1":"நோனா உடம்பும் உயிரும் மடலேறும்","l2":"நாணினை நீக்கி நிறுத்து.","mv":"(காதலின் பிரிவால் ஆகிய துன்பத்தைப்) பொறுக்காத என் உடம்பும் உயிரும், நாணத்தை நீக்கி நிறுத்தி விட்டு மடலூரத் துணிந்தன.","ex":"Having got rid of shame, the suffering body and soul save themselves on the palmyra horse","t1":"Nonaa Utampum Uyirum Matalerum","t2":"Naaninai Neekki Niruththu"},{"n":1133,"c":114,"ct":"நாணுத்துறவுரைத்தல்","ce":"Speaking Out Unabashed","l1":"நாணொடு நல்லாண்மை பண்டுடையேன் இன்றுடையேன்","l2":"காமுற்றார் ஏறும் மடல்.","mv":"நாணமும் நல்ல ஆண்மையும் முன்பு பெற்றிருந்தேன், (காதலியை பிரிந்து வருந்துகின்ற) இப்போது காமம் மிக்கவர் ஏறும் மடலையே உடையேன்.","ex":"Modesty and manliness were once my own; now, my own is the palmyra horse that is ridden by the lustful","t1":"Naanotu Nallaanmai Pantutaiyen Indrutaiyen","t2":"Kaamutraar Erum Matal"},{"n":1134,"c":114,"ct":"நாணுத்துறவுரைத்தல்","ce":"Speaking Out Unabashed","l1":"காமக் கடும்புனல் உய்க்கும் நாணொடு","l2":"நல்லாண்மை என்னும் புணை.","mv":"நாணமும் நல்ல ஆண்மையுமாகிய தோணிகளைக் காமம் என்னும் கடுமையான வெள்ளம் அடித்துக் கொண்டு போய் விடுகின்றன.","ex":"The raft of modesty and manliness, is, alas, carried-off by the strong current of lust","t1":"Kaamak Katumpunal Uykkum Naanotu","t2":"Nallaanmai Ennum Punai"},{"n":1135,"c":114,"ct":"நாணுத்துறவுரைத்தல்","ce":"Speaking Out Unabashed","l1":"தொடலைக் குறுந்தொடி தந்தாள் மடலொடு","l2":"மாலை உழக்கும் துயர்.","mv":"மடலோறுதலோடு மாலைக்காலத்தில் வருந்தும் துயரத்தை மாலைபோல் தொடர்ந்த சிறு வளையல் அணிந்த காதலி எனக்கு தந்தாள்.","ex":"She with the small garland-like bracelets has given me the palmyra horse and the sorrow that is endured at night","t1":"Thotalaik Kurundhoti Thandhaal Matalotu","t2":"Maalai Uzhakkum Thuyar"},{"n":1136,"c":114,"ct":"நாணுத்துறவுரைத்தல்","ce":"Speaking Out Unabashed","l1":"மடலூர்தல் யாமத்தும் உள்ளுவேன் மன்ற","l2":"படல்ஒல்லா பேதைக்கென் கண்.","mv":"மடலூர்தலைப் பற்றி நள்ளிரவிலும் உறுதியாக நினைக்கின்றேன், காதலியின் பிரிவின் காரணமாக என் கண்கள் உறங்காமல் இருக்கின்றன.","ex":"Mine eyes will not close in sleep on your mistress's account; even at midnight will I think of mounting the palmyra horse","t1":"Mataloordhal Yaamaththum Ulluven Mandra","t2":"Patalollaa Pedhaikken Kan"},{"n":1137,"c":114,"ct":"நாணுத்துறவுரைத்தல்","ce":"Speaking Out Unabashed"
