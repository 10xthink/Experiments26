<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>Journal</title>
<style>
  :root{
    --bg:#0f0f10;
    --panel:#18181a;
    --bubble:#232326;
    --accent:#d97757;
    --accent-soft:#3a2c26;
    --text:#ececec;
    --text-dim:#9a9a9a;
    --border:#2a2a2c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  header{
    padding:12px 18px 10px;
    border-bottom:1px solid var(--border);
    display:flex;
    flex-direction:column;
    background:var(--panel);
    flex-shrink:0;
    position:relative;
    gap:10px;
  }
  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .header-icons{
    display:flex;
    align-items:center;
    gap:8px;
    position:relative;
    flex-shrink:0;
  }
  header h1{
    font-size:16px;
    font-weight:600;
    margin:0;
    letter-spacing:.2px;
  }
  header .sub{
    font-size:12px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .tabs{
    display:flex;
    gap:4px;
    background:var(--bubble);
    border:1px solid var(--border);
    border-radius:10px;
    padding:3px;
    flex-shrink:0;
    width:100%;
  }
  .tab-btn{
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-size:13px;
    font-weight:500;
    padding:8px 11px;
    border-radius:7px;
    cursor:pointer;
    transition:.15s;
    white-space:nowrap;
    flex:1;
  }
  .tab-btn.active{
    background:var(--accent);
    color:#1a1a1a;
  }
  .view{display:none;flex-direction:column;flex:1;overflow:hidden;}
  .view.active{display:flex;}
  .icon-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:8px;
    padding:7px 10px;
    font-size:12px;
    cursor:pointer;
    transition:.15s;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .icon-btn:hover{
    background:var(--bubble);
    color:var(--text);
    border-color:#3a3a3c;
  }
  .icon-btn.danger{color:#e05a5a;}
  .icon-btn.danger:hover{
    background:#2a1a1a;
    border-color:#5a2c2c;
  }
  .settings-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:8px;
    width:34px;
    height:34px;
    font-size:16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.15s;
    flex-shrink:0;
  }
  .settings-btn:hover{
    background:var(--bubble);
    color:var(--text);
    border-color:#3a3a3c;
  }
  .settings-menu{
    position:absolute;
    top:42px;
    right:0;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:6px;
    display:none;
    flex-direction:column;
    gap:2px;
    min-width:160px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
    z-index:40;
  }
  .settings-menu.open{display:flex;}
  .settings-menu .icon-btn{
    justify-content:flex-start;
    border:none;
    border-radius:8px;
    padding:9px 10px;
  }

  /* Shared scrollable body */
  .scroll-body{
    flex:1;
    overflow-y:auto;
    padding:20px 14px 10px;
  }
  .date-divider{
    text-align:center;
    margin:18px 0 14px;
    position:relative;
  }
  .date-divider span{
    background:var(--panel);
    color:var(--text-dim);
    font-size:11px;
    font-weight:600;
    padding:4px 12px;
    border-radius:20px;
    border:1px solid var(--border);
  }

  /* Shared "card" style used by journal entries, tasks, ideas */
  .card{
    max-width:640px;
    margin:0 auto 10px;
    background:var(--bubble);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 16px;
    position:relative;
    animation:fadeIn .2s ease;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    transition:background .15s;
  }
  .card.pressed{background:#2a2a2d;}
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(4px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* Journal entry */
  .entry{margin-bottom:14px;}
  .entry-text{
    white-space:pre-wrap;
    word-wrap:break-word;
    line-height:1.5;
    font-size:14.5px;
  }
  .entry-meta{
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    font-size:11px;
    color:var(--text-dim);
  }

  /* Shared inline edit textarea */
  .inline-edit{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:14.5px;
    font-family:inherit;
    line-height:1.5;
    resize:none;
    padding:0;
    border-bottom:1px solid var(--accent);
    user-select:text;
  }

  /* Shared popup (Edit / Copy / Delete) */
  .action-popup{
    position:fixed;
    background:#2c2c2e;
    border:1px solid var(--border);
    border-radius:10px;
    padding:4px;
    z-index:60;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    display:none;
    flex-direction:row;
    gap:2px;
  }
  .action-popup.open{display:flex;}
  .action-popup button{
    background:none;
    border:none;
    font-size:13px;
    padding:8px 13px;
    cursor:pointer;
    border-radius:6px;
    white-space:nowrap;
    color:var(--text);
  }
  .action-popup button:hover{background:#3a3a3c;}
  .action-popup .btn-delete{color:#e05a5a;}
  .action-popup .btn-delete:hover{background:#3a1a1a;}
  .popup-backdrop{
    position:fixed;
    inset:0;
    z-index:55;
    display:none;
  }
  .popup-backdrop.open{display:block;}

  .empty-state{
    text-align:center;
    color:var(--text-dim);
    margin-top:80px;
    font-size:14px;
    line-height:1.6;
  }
  .empty-state .big{
    font-size:32px;
    margin-bottom:10px;
  }
  footer{
    flex-shrink:0;
    border-top:1px solid var(--border);
    background:var(--panel);
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  }
  .composer{
    max-width:640px;
    margin:0 auto;
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:var(--bubble);
    border:1px solid var(--border);
    border-radius:16px;
    padding:8px 8px 8px 16px;
  }
  .composer textarea{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:16px;
    font-family:inherit;
    resize:none;
    max-height:160px;
    line-height:1.5;
    padding:6px 0;
  }
  .composer textarea::placeholder{color:var(--text-dim);}
  .composer-send{
    background:var(--accent);
    border:none;
    color:#1a1a1a;
    width:34px;
    height:34px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:.15s;
  }
  .composer-send:hover{opacity:.85;}
  #fileInput{display:none;}
  .toast{
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:#232326;
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 16px;
    border-radius:10px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:70;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(-6px);
  }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:#2c2c2e;border-radius:4px;}

  /* Section header shared by Today + Ideas */
  .section-title{
    max-width:640px;
    margin:0 auto 8px;
    font-size:11px;
    color:var(--text-dim);
    font-weight:600;
    letter-spacing:.3px;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:6px;
    padding:0 2px;
  }
  .section-count{
    font-weight:500;
    text-transform:none;
    letter-spacing:0;
    color:var(--text-dim);
    background:var(--bubble);
    border:1px solid var(--border);
    padding:1px 7px;
    border-radius:20px;
    font-size:10.5px;
  }
  .section{margin-bottom:20px;}
  .day-label{
    max-width:640px;
    margin:0 auto 16px;
    color:var(--text-dim);
    font-size:12px;
    font-weight:600;
    letter-spacing:.3px;
    text-transform:uppercase;
  }

  /* Row style used by tasks + ideas */
  .row{
    max-width:640px;
    margin:0 auto 8px;
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bubble);
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 14px;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    transition:background .15s;
  }
  .row.pressed{background:#2a2a2d;}
  .row.past{opacity:.5;}
  .idea-active-empty{
    max-width:640px;
    margin:0 auto;
    color:var(--text-dim);
    font-size:13px;
    padding:2px;
  }
  .row-toggle{
    width:20px;
    height:20px;
    border-radius:6px;
    border:1.5px solid #4a4a4c;
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:transparent;
    transition:.15s;
    background:transparent;
  }
  .row-toggle.checked{
    background:var(--accent);
    border-color:var(--accent);
    color:#1a1a1a;
  }
  .row-toggle.star{
    border-radius:50%;
    font-size:12px;
    color:var(--text-dim);
    border-color:#4a4a4c;
  }
  .row-toggle.star.checked{
    background:var(--accent-soft);
    border-color:var(--accent);
    color:var(--accent);
  }
  .row-label{
    flex:1;
    font-size:14.5px;
    line-height:1.4;
    word-break:break-word;
    white-space:pre-wrap;
  }
  .row-label.checked{
    color:var(--text-dim);
    text-decoration:line-through;
  }
  .row-badge{
    font-size:10px;
    color:var(--text-dim);
    border:1px solid var(--border);
    padding:2px 7px;
    border-radius:20px;
    flex-shrink:0;
  }
  .row.active-idea{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .today-empty, .ideas-empty, .events-empty{
    text-align:center;
    color:var(--text-dim);
    margin-top:60px;
    font-size:14px;
    line-height:1.6;
  }
  .today-empty .big, .ideas-empty .big, .events-empty .big{font-size:32px;margin-bottom:10px;}
  .task-composer-extra{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--text-dim);
    cursor:pointer;
    user-select:none;
    padding:4px 8px;
    border-radius:8px;
    flex-shrink:0;
    white-space:nowrap;
  }
  .task-composer-extra input{accent-color:var(--accent);}

  /* PIN lock */
  .lock-overlay{
    position:fixed;
    inset:0;
    z-index:100;
    background:var(--bg);
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .lock-overlay.open{display:flex;}
  .lock-icon{font-size:38px;margin-bottom:14px;}
  .lock-title{font-size:17px;font-weight:600;margin-bottom:6px;}
  .lock-sub{font-size:13px;color:var(--text-dim);margin-bottom:22px;max-width:280px;line-height:1.5;}
  .lock-form{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:260px;}
  .lock-input{
    width:100%;
    background:var(--bubble);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--text);
    font-size:22px;
    letter-spacing:6px;
    text-align:center;
    padding:14px 10px;
    outline:none;
    font-family:inherit;
  }
  .lock-input:focus{border-color:var(--accent);}
  .lock-input.shake{animation:shake .35s;}
  @keyframes shake{
    20%,60%{transform:translateX(-8px);}
    40%,80%{transform:translateX(8px);}
  }
  .lock-submit{
    background:var(--accent);
    border:none;
    color:#1a1a1a;
    font-weight:600;
    font-size:14px;
    padding:11px;
    border-radius:12px;
    cursor:pointer;
    width:100%;
  }
  .lock-link{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:12.5px;
    cursor:pointer;
    text-decoration:underline;
    padding:4px;
  }
  .lock-link.danger{color:#e05a5a;}
  .lock-error{color:#e05a5a;font-size:12.5px;min-height:16px;}

  /* In-app confirm modal (replaces native confirm()/alert(), which sandboxed/embedded browsers can block) */
  .confirm-overlay{
    position:fixed;
    inset:0;
    z-index:110;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    max-width:320px;
    width:100%;
    box-shadow:0 12px 32px rgba(0,0,0,.5);
  }
  .confirm-title{font-size:15px;font-weight:600;margin-bottom:8px;}
  .confirm-message{font-size:13.5px;color:var(--text-dim);line-height:1.5;margin-bottom:18px;}
  .confirm-actions{display:flex;gap:8px;}
  .confirm-actions button{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bubble);
    color:var(--text);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .confirm-actions .confirm-danger{
    background:#3a1a1a;
    border-color:#5a2c2c;
    color:#e05a5a;
  }

  /* Search bar */
  .search-bar{
    display:none;
    align-items:center;
    gap:8px;
    padding:10px 14px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .search-bar.open{display:flex;}
  .search-bar input{
    flex:1;
    background:var(--bubble);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    font-size:15px;
    padding:8px 12px;
    outline:none;
    font-family:inherit;
  }
  .search-bar input:focus{border-color:var(--accent);}
  .search-close{
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:16px;
    cursor:pointer;
    padding:4px 8px;
    flex-shrink:0;
  }

  /* Events */
  .event-composer{
    max-width:640px;
    margin:0 auto;
    background:var(--bubble);
    border:1px solid var(--border);
    border-radius:16px;
    padding:10px 14px;
  }
  .event-composer input[type="text"]{
    width:100%;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:16px;
    font-family:inherit;
    padding:4px 0 8px;
  }
  .event-composer input[type="text"]::placeholder{color:var(--text-dim);}
  .event-composer-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .event-composer-row input[type="date"],
  .event-composer-row input[type="time"]{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:8px;
    padding:6px 8px;
    font-size:13px;
    font-family:inherit;
    flex:1;
    min-width:0;
    color-scheme:dark;
  }
  .event-time-badge{
    flex-shrink:0;
    width:52px;
    text-align:center;
    font-size:12px;
    font-weight:600;
    color:var(--accent);
  }
  .event-time-badge.no-time{color:var(--text-dim);font-size:10px;}
  .event-title{
    flex:1;
    font-size:14.5px;
    line-height:1.4;
    word-break:break-word;
  }

</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <h1 id="pageTitle">Journal</h1>
      <div class="sub" id="headerSub">0 entries</div>
    </div>
    <div class="header-icons">
      <button class="settings-btn" id="searchBtn">🔍</button>
      <button class="settings-btn" id="settingsBtn">⋯</button>
      <div class="settings-menu" id="settingsMenu">
        <button class="icon-btn" id="pinMenuBtn">🔒 Set PIN lock</button>
        <button class="icon-btn" id="removePinBtn" style="display:none;">🔓 Remove PIN lock</button>
        <button class="icon-btn" id="exportBtn">⭳ Export</button>
        <button class="icon-btn" id="importBtn">⭱ Import</button>
        <button class="icon-btn danger" id="clearBtn">Clear all</button>
      </div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" id="tabJournal">Journal</button>
    <button class="tab-btn" id="tabToday">Today</button>
    <button class="tab-btn" id="tabIdeas">Ideas</button>
    <button class="tab-btn" id="tabEvents">Events</button>
  </div>
</header>

<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" placeholder="Search this tab…">
  <button class="search-close" id="searchCloseBtn">✕</button>
</div>

<input type="file" id="fileInput" accept="application/json">

<!-- JOURNAL -->
<div class="view active" id="journalView">
  <div class="scroll-body" id="entries"></div>
  <footer>
    <form class="composer" id="journalForm">
      <textarea id="input" placeholder="Write in your journal…" rows="1"></textarea>
      <button type="submit" class="composer-send">↑</button>
    </form>
  </footer>
</div>

<!-- TODAY -->
<div class="view" id="todayView">
  <div class="scroll-body">
    <div class="day-label" id="todayDate"></div>
    <div id="taskSections"></div>
  </div>
  <footer>
    <form class="composer" id="taskForm">
      <textarea id="taskInput" placeholder="Add a task…" rows="1"></textarea>
      <label class="task-composer-extra">
        <input type="checkbox" id="repeatDaily"> Daily
      </label>
      <button type="submit" class="composer-send">+</button>
    </form>
  </footer>
</div>

<!-- IDEAS -->
<div class="view" id="ideasView">
  <div class="scroll-body">
    <div id="ideaSections"></div>
  </div>
  <footer>
    <form class="composer" id="ideaForm">
      <textarea id="ideaInput" placeholder="Capture an idea…" rows="1"></textarea>
      <button type="submit" class="composer-send">+</button>
    </form>
  </footer>
</div>

<!-- EVENTS -->
<div class="view" id="eventsView">
  <div class="scroll-body" id="eventsList"></div>
  <footer>
    <form class="event-composer" id="eventForm">
      <input type="text" id="eventTitle" placeholder="What's the event?">
      <div class="event-composer-row">
        <input type="date" id="eventDate">
        <input type="time" id="eventTime">
        <button type="submit" class="composer-send">+</button>
      </div>
    </form>
  </footer>
</div>

<div class="popup-backdrop" id="popupBackdrop"></div>
<div class="action-popup" id="actionPopup">
  <button id="editPopupBtn">Edit</button>
  <button id="copyPopupBtn">Copy</button>
  <button class="btn-delete" id="deletePopupBtn">Delete</button>
</div>

<div class="toast" id="toast"></div>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-icon" id="lockIcon">🔒</div>
  <div class="lock-title" id="lockTitle">Enter PIN</div>
  <div class="lock-sub" id="lockSub">This journal is locked.</div>
  <form class="lock-form" id="lockForm">
    <input class="lock-input" id="lockInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <div class="lock-error" id="lockError"></div>
    <button type="submit" class="lock-submit" id="lockSubmit">Unlock</button>
    <button type="button" class="lock-link" id="lockSkip" style="display:none;">Skip for now</button>
    <button type="button" class="lock-link danger" id="lockForgot">Forgot PIN? Erase and start over</button>
  </form>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title" id="confirmTitle">Are you sure?</div>
    <div class="confirm-message" id="confirmMessage"></div>
    <div class="confirm-actions">
      <button id="confirmCancelBtn">Cancel</button>
      <button class="confirm-danger" id="confirmOkBtn">Confirm</button>
    </div>
  </div>
</div>

<script>
/* ============ Shared helpers ============ */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function newId(){
  return Date.now() + '-' + Math.random().toString(36).slice(2,8);
}
function loadJSON(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  localStorage.setItem(key, JSON.stringify(val));
}
const toastEl = document.getElementById('toast');
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1800);
}
function autoGrow(el, max){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, max) + 'px';
}
function renderEmptyState(container, icon, message, className){
  container.innerHTML = '';
  const div = document.createElement('div');
  div.className = className || 'empty-state';
  const iconDiv = document.createElement('div');
  iconDiv.className = 'big';
  iconDiv.textContent = icon;
  div.appendChild(iconDiv);
  div.appendChild(document.createTextNode(message));
  container.appendChild(div);
}
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

/* ============ Search (simple live substring filter, per-tab) ============ */
let searchQuery = '';
const searchBar = document.getElementById('searchBar');
const searchInput = document.getElementById('searchInput');

function matchesSearch(text){
  return !searchQuery || (text || '').toLowerCase().includes(searchQuery);
}
function resetSearchState(){
  searchBar.classList.remove('open');
  searchInput.value = '';
  searchQuery = '';
}
function rerenderCurrentTab(){
  if(currentTab === 'journal') renderJournal();
  else if(currentTab === 'today') renderTasks();
  else if(currentTab === 'ideas') renderIdeas();
  else if(currentTab === 'events') renderEvents();
}
document.getElementById('searchBtn').addEventListener('click', () => {
  document.getElementById('settingsMenu').classList.remove('open');
  searchBar.classList.add('open');
  searchInput.focus();
});
document.getElementById('searchCloseBtn').addEventListener('click', () => {
  resetSearchState();
  rerenderCurrentTab();
});
searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value.trim().toLowerCase();
  rerenderCurrentTab();
});
searchInput.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){
    resetSearchState();
    rerenderCurrentTab();
  }
});

/* ============ In-app confirm modal (replaces native confirm(), which
   sandboxed/embedded browsers can silently block) ============ */
function appConfirm(message, opts){
  opts = opts || {};
  return new Promise((resolve) => {
    const overlay = document.getElementById('confirmOverlay');
    const titleEl = document.getElementById('confirmTitle');
    const msgEl = document.getElementById('confirmMessage');
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');

    titleEl.textContent = opts.title || 'Are you sure?';
    msgEl.textContent = message;
    okBtn.textContent = opts.confirmLabel || 'Confirm';
    overlay.classList.add('open');

    function cleanup(result){
      overlay.classList.remove('open');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      overlay.removeEventListener('click', onBackdrop);
      document.removeEventListener('keydown', onKey);
      resolve(result);
    }
    function onOk(){ cleanup(true); }
    function onCancel(){ cleanup(false); }
    function onBackdrop(e){ if(e.target === overlay) cleanup(false); }
    function onKey(e){ if(e.key === 'Escape') cleanup(false); }

    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    overlay.addEventListener('click', onBackdrop);
    document.addEventListener('keydown', onKey);
  });
}

/* ============ PIN lock (deterrent-level, not encryption) ============ */
const Lock = (function(){
  const PIN_KEY = 'journal_pin_hash_v1';
  const overlay = document.getElementById('lockOverlay');
  const icon = document.getElementById('lockIcon');
  const title = document.getElementById('lockTitle');
  const sub = document.getElementById('lockSub');
  const form = document.getElementById('lockForm');
  const input = document.getElementById('lockInput');
  const error = document.getElementById('lockError');
  const submitBtn = document.getElementById('lockSubmit');
  const skipBtn = document.getElementById('lockSkip');
  const forgotBtn = document.getElementById('lockForgot');

  let mode = 'unlock'; // 'unlock' | 'setup-first' | 'setup-confirm' | 'change-current' | 'change-new' | 'change-confirm'
  let pendingPin = null;

  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }
  function hasPin(){ return !!localStorage.getItem(PIN_KEY); }

  function show(newMode){
    mode = newMode;
    error.textContent = '';
    input.value = '';
    skipBtn.style.display = 'none';
    forgotBtn.style.display = 'none';
    if(mode === 'unlock'){
      icon.textContent = '🔒'; title.textContent = 'Enter PIN'; sub.textContent = 'This journal is locked.';
      submitBtn.textContent = 'Unlock';
      forgotBtn.style.display = '';
    } else if(mode === 'setup-first'){
      icon.textContent = '🔒'; title.textContent = 'Create a PIN';
      sub.textContent = 'Protects this journal from casual snooping on this device.';
      submitBtn.textContent = 'Next';
      skipBtn.style.display = '';
    } else if(mode === 'setup-confirm'){
      icon.textContent = '🔒'; title.textContent = 'Confirm your PIN';
      sub.textContent = 'Enter it once more.';
      submitBtn.textContent = 'Set PIN';
    } else if(mode === 'change-current'){
      icon.textContent = '🔒'; title.textContent = 'Enter current PIN';
      sub.textContent = 'Confirm your current PIN to change it.';
      submitBtn.textContent = 'Next';
    } else if(mode === 'change-new'){
      icon.textContent = '🔒'; title.textContent = 'New PIN';
      sub.textContent = 'Enter a new PIN.';
      submitBtn.textContent = 'Next';
    } else if(mode === 'change-confirm'){
      icon.textContent = '🔒'; title.textContent = 'Confirm new PIN';
      sub.textContent = 'Enter it once more.';
      submitBtn.textContent = 'Save';
    }
    overlay.classList.add('open');
    setTimeout(() => input.focus(), 50);
  }
  function hide(){
    overlay.classList.remove('open');
  }
  function fail(msg){
    error.textContent = msg;
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
    input.value = '';
    input.focus();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const val = input.value.trim();
    if(val.length < 4){ fail('PIN must be at least 4 digits'); return; }

    if(mode === 'unlock'){
      const hash = await sha256Hex(val);
      if(hash === localStorage.getItem(PIN_KEY)){
        hide();
        showToast('Unlocked');
        updateSettingsPinButtons();
      } else {
        fail('Incorrect PIN');
      }
    } else if(mode === 'setup-first'){
      pendingPin = val;
      show('setup-confirm');
    } else if(mode === 'setup-confirm'){
      if(val !== pendingPin){ fail("PINs didn't match — try again"); show('setup-first'); return; }
      localStorage.setItem(PIN_KEY, await sha256Hex(val));
      pendingPin = null;
      hide();
      showToast('PIN set');
      updateSettingsPinButtons();
    } else if(mode === 'change-current'){
      const hash = await sha256Hex(val);
      if(hash !== localStorage.getItem(PIN_KEY)){ fail('Incorrect PIN'); return; }
      show('change-new');
    } else if(mode === 'change-new'){
      pendingPin = val;
      show('change-confirm');
    } else if(mode === 'change-confirm'){
      if(val !== pendingPin){ fail("PINs didn't match — try again"); show('change-new'); return; }
      localStorage.setItem(PIN_KEY, await sha256Hex(val));
      pendingPin = null;
      hide();
      showToast('PIN updated');
    }
  });

  skipBtn.addEventListener('click', () => { hide(); });

  forgotBtn.addEventListener('click', async () => {
    const ok = await appConfirm(
      'This erases everything on this device — journal, tasks, ideas, events, and the PIN. This cannot be undone.',
      { title:'Forgot PIN?', confirmLabel:'Erase everything' }
    );
    if(ok){
      localStorage.clear();
      location.reload();
    }
  });

  function startSetup(){ pendingPin = null; show('setup-first'); }
  function startChange(){ pendingPin = null; show('change-current'); }
  function startUnlockGate(){ show('unlock'); }

  function init(){
    if(hasPin()) startUnlockGate();
    updateSettingsPinButtons();
  }

  function updateSettingsPinButtons(){
    const pinBtn = document.getElementById('pinMenuBtn');
    const removeBtn = document.getElementById('removePinBtn');
    if(hasPin()){
      pinBtn.textContent = '🔒 Change PIN';
      removeBtn.style.display = '';
    } else {
      pinBtn.textContent = '🔒 Set PIN lock';
      removeBtn.style.display = 'none';
    }
  }

  return { init, startSetup, startChange, hasPin, updateSettingsPinButtons };
})();

document.getElementById('pinMenuBtn').addEventListener('click', () => {
  document.getElementById('settingsMenu').classList.remove('open');
  if(Lock.hasPin()) Lock.startChange(); else Lock.startSetup();
});
document.getElementById('removePinBtn').addEventListener('click', async () => {
  document.getElementById('settingsMenu').classList.remove('open');
  const ok = await appConfirm(
    'Anyone with access to this device will be able to open the app directly.',
    { title:'Remove PIN lock?', confirmLabel:'Remove lock' }
  );
  if(ok){
    localStorage.removeItem('journal_pin_hash_v1');
    showToast('PIN lock removed');
    Lock.updateSettingsPinButtons();
  }
});

/* ============ Shared Edit/Copy/Delete popup ============ */
const Popup = (function(){
  const backdrop = document.getElementById('popupBackdrop');
  const popup = document.getElementById('actionPopup');
  const editBtn = document.getElementById('editPopupBtn');
  const copyBtn = document.getElementById('copyPopupBtn');
  const deleteBtn = document.getElementById('deletePopupBtn');
  let current = null; // {onEdit, onCopy, onDelete}

  function open(handlers, x, y){
    current = handlers;
    deleteBtn.dataset.confirming = 'false';
    deleteBtn.textContent = 'Delete';
    editBtn.style.display = handlers.onEdit ? '' : 'none';
    copyBtn.style.display = handlers.onCopy ? '' : 'none';
    popup.classList.add('open');
    backdrop.classList.add('open');
    const pw = 210, ph = 44;
    let left = Math.min(Math.max(8, x - pw/2), window.innerWidth - pw - 8);
    let top = Math.min(Math.max(8, y - ph - 12), window.innerHeight - ph - 8);
    popup.style.left = left + 'px';
    popup.style.top = top + 'px';
    if(navigator.vibrate) navigator.vibrate(10);
  }
  function close(){
    popup.classList.remove('open');
    backdrop.classList.remove('open');
    current = null;
  }
  backdrop.addEventListener('click', close);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && popup.classList.contains('open')) close();
  });
  editBtn.addEventListener('click', () => { const h = current; close(); if(h && h.onEdit) h.onEdit(); });
  copyBtn.addEventListener('click', () => {
    if(current && current.onCopy){
      const text = current.onCopy();
      navigator.clipboard.writeText(text).then(()=>showToast('Copied')).catch(()=>showToast('Copy failed'));
    }
    close();
  });
  deleteBtn.addEventListener('click', () => {
    if(deleteBtn.dataset.confirming === 'true'){
      const h = current;
      close();
      if(h && h.onDelete) h.onDelete();
    } else {
      deleteBtn.dataset.confirming = 'true';
      deleteBtn.textContent = 'Confirm delete?';
    }
  });

  // Attach long-press / right-click to any element, excluding taps on `excludeSelector`
  function attach(el, handlers, excludeSelector){
    let pressTimer = null;
    const start = (x, y, target) => {
      if(excludeSelector && target.closest(excludeSelector)) return;
      el.classList.add('pressed');
      pressTimer = setTimeout(() => {
        el.classList.remove('pressed');
        open(handlers, x, y);
      }, 500);
    };
    const cancel = () => {
      el.classList.remove('pressed');
      clearTimeout(pressTimer);
    };
    el.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      start(t.clientX, t.clientY, e.target);
    }, { passive:true });
    el.addEventListener('touchend', cancel);
    el.addEventListener('touchmove', cancel);
    el.addEventListener('mousedown', (e) => start(e.clientX, e.clientY, e.target));
    el.addEventListener('mouseup', cancel);
    el.addEventListener('mouseleave', cancel);
    el.addEventListener('contextmenu', (e) => {
      if(excludeSelector && e.target.closest(excludeSelector)) return;
      e.preventDefault();
      open(handlers, e.clientX, e.clientY);
    });
  }

  return { attach };
})();

/* Shared inline-edit swap: replaces `labelEl` with a textarea, commits on blur/Enter */
function inlineEdit(labelEl, getValue, onCommit){
  const box = document.createElement('textarea');
  box.className = 'inline-edit';
  box.value = getValue();
  labelEl.replaceWith(box);
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);
  autoGrow(box, 200);
  box.addEventListener('input', () => autoGrow(box, 200));
  let done = false;
  const commit = () => {
    if(done) return;
    done = true;
    const val = box.value.trim();
    onCommit(val || getValue());
  };
  box.addEventListener('blur', commit);
  box.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      box.blur();
    }
    if(e.key === 'Escape'){
      done = true;
      onCommit(null); // null = cancel, just re-render
    }
  });
}

/* ============ Tab switching ============ */
const tabs = {
  journal: { btn: document.getElementById('tabJournal'), view: document.getElementById('journalView'), title:'Journal' },
  today:   { btn: document.getElementById('tabToday'),   view: document.getElementById('todayView'),   title:'Today' },
  ideas:   { btn: document.getElementById('tabIdeas'),   view: document.getElementById('ideasView'),   title:'Ideas' },
  events:  { btn: document.getElementById('tabEvents'),  view: document.getElementById('eventsView'),  title:'Events' }
};
const pageTitle = document.getElementById('pageTitle');
const headerSub = document.getElementById('headerSub');
const settingsMenu = document.getElementById('settingsMenu');

function switchTab(name){
  Object.entries(tabs).forEach(([key, t]) => {
    t.btn.classList.toggle('active', key === name);
    t.view.classList.toggle('active', key === name);
  });
  pageTitle.textContent = tabs[name].title;
  settingsMenu.classList.remove('open');
  resetSearchState();
  if(name === 'journal'){ renderJournal(); updateHeaderSub(); }
  if(name === 'today'){ renderTasks(); updateHeaderSub(); }
  if(name === 'ideas'){ renderIdeas(); updateHeaderSub(); }
  if(name === 'events'){ renderEvents(); updateHeaderSub(); }
  currentTab = name;
}
let currentTab = 'journal';
tabs.journal.btn.addEventListener('click', () => switchTab('journal'));
tabs.today.btn.addEventListener('click', () => switchTab('today'));
tabs.ideas.btn.addEventListener('click', () => switchTab('ideas'));
tabs.events.btn.addEventListener('click', () => switchTab('events'));

function updateHeaderSub(){
  if(currentTab === 'journal'){
    headerSub.textContent = entries.length + (entries.length === 1 ? ' entry' : ' entries');
  } else if(currentTab === 'today'){
    const doneCount = tasks.filter(isDoneToday).length;
    headerSub.textContent = `${doneCount}/${tasks.length} done today`;
  } else if(currentTab === 'ideas'){
    const active = ideas.find(i => i.active);
    headerSub.textContent = active ? '1 active · ' + (ideas.length-1) + ' parked' : ideas.length + ' ideas';
  } else {
    const upcoming = events.filter(e => e.date >= todayStr()).length;
    headerSub.textContent = upcoming + ' upcoming · ' + events.length + ' total';
  }
}

/* JOURNAL                                                              */
/* =================================================================== */
const JOURNAL_KEY = 'journal_entries_v1';
let entries = loadJSON(JOURNAL_KEY, []);

const entriesEl = document.getElementById('entries');
const journalInput = document.getElementById('input');

function dayLabel(dateObj){
  const now = new Date();
  const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.round((today - d) / 86400000);
  if(diffDays === 0) return 'Today';
  if(diffDays === 1) return 'Yesterday';
  if(diffDays === -1) return 'Tomorrow';
  const opts = d.getFullYear() === now.getFullYear()
    ? { weekday:'long', month:'long', day:'numeric' }
    : { weekday:'long', month:'long', day:'numeric', year:'numeric' };
  return d.toLocaleDateString(undefined, opts);
}
function timeLabel(dateObj){
  return dateObj.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}

// Anchor-based scroll preservation: remember which entry is at the top of
// the visible area, then re-align to that same entry after re-rendering,
// so edits/deletes elsewhere in the list don't shift what you're looking at.
function captureAnchor(){
  const containerTop = entriesEl.scrollTop;
  const cards = entriesEl.querySelectorAll('.entry[data-id]');
  for(const card of cards){
    if(card.offsetTop + card.offsetHeight > containerTop){
      return { id: card.dataset.id, offset: card.offsetTop - containerTop };
    }
  }
  return null;
}
function restoreAnchor(anchor){
  if(!anchor){ return; }
  const el = entriesEl.querySelector(`.entry[data-id="${anchor.id}"]`);
  if(el){
    entriesEl.scrollTop = el.offsetTop - anchor.offset;
  }
}

function renderJournal(scrollToBottom){
  const anchor = scrollToBottom ? null : captureAnchor();
  entriesEl.innerHTML = '';
  updateHeaderSub();

  if(entries.length === 0){
    entriesEl.innerHTML = `<div class="empty-state"><div class="big">📓</div>Nothing here yet.<br>Start writing below.</div>`;
    return;
  }

  const sorted = [...entries]
    .filter(e => matchesSearch(e.text))
    .sort((a,b)=> new Date(a.ts) - new Date(b.ts));

  if(sorted.length === 0){
    renderEmptyState(entriesEl, '🔍', `No entries match "${searchInput.value}".`);
    return;
  }
  let lastDay = null;
  sorted.forEach(entry => {
    const d = new Date(entry.ts);
    const label = dayLabel(d);
    if(label !== lastDay){
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.innerHTML = `<span>${label}</span>`;
      entriesEl.appendChild(div);
      lastDay = label;
    }
    const card = document.createElement('div');
    card.className = 'card entry';
    card.dataset.id = entry.id;
    const textDiv = document.createElement('div');
    textDiv.className = 'entry-text';
    textDiv.textContent = entry.text;
    const meta = document.createElement('div');
    meta.className = 'entry-meta';
    meta.innerHTML = `<span>${entry.edited ? 'edited · ' : ''}${timeLabel(d)}</span>`;
    card.appendChild(textDiv);
    card.appendChild(meta);

    Popup.attach(card, {
      onEdit: () => inlineEdit(textDiv, () => entry.text, (val) => {
        if(val !== null && val !== entry.text){
          entry.text = val;
          entry.edited = true;
        }
        saveJSON(JOURNAL_KEY, entries);
        renderJournal();
      }),
      onCopy: () => entry.text,
      onDelete: () => {
        entries = entries.filter(e => e.id !== entry.id);
        saveJSON(JOURNAL_KEY, entries);
        renderJournal();
      }
    });

    entriesEl.appendChild(card);
  });

  if(scrollToBottom){
    entriesEl.scrollTop = entriesEl.scrollHeight;
  } else {
    restoreAnchor(anchor);
  }
}

function addEntry(){
  const text = journalInput.value.trim();
  if(!text) return;
  entries.push({ id: newId(), text, ts: new Date().toISOString() });
  saveJSON(JOURNAL_KEY, entries);
  journalInput.value = '';
  journalInput.style.height = 'auto';
  renderJournal(true);
}
document.getElementById('journalForm').addEventListener('submit', (e) => {
  e.preventDefault();
  addEntry();
});
journalInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !isMobile && !e.shiftKey){
    e.preventDefault();
    addEntry();
  }
});
journalInput.addEventListener('input', () => autoGrow(journalInput, 160));

/* Export / Import / Clear — covers Journal, Today, Ideas, and Events */
document.getElementById('exportBtn').addEventListener('click', () => {
  const data = JSON.stringify({ exportedAt: new Date().toISOString(), entries, tasks, ideas, events }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `journal-export-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Exported everything');
  settingsMenu.classList.remove('open');
});

const fileInput = document.getElementById('fileInput');
document.getElementById('importBtn').addEventListener('click', () => { fileInput.click(); settingsMenu.classList.remove('open'); });
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const parsed = JSON.parse(evt.target.result);
      let added = 0;

      // Journal entries (also supports the old export format: a bare array)
      const incomingEntries = Array.isArray(parsed) ? parsed : parsed.entries;
      if(Array.isArray(incomingEntries)){
        const existingIds = new Set(entries.map(e => e.id));
        incomingEntries.forEach(item => {
          if(!item || !item.text || !item.ts) return;
          const id = item.id || newId();
          if(existingIds.has(id)) return;
          entries.push({ id, text: item.text, ts: item.ts, edited: !!item.edited });
          existingIds.add(id);
          added++;
        });
      }

      if(Array.isArray(parsed.tasks)){
        const existingIds = new Set(tasks.map(t => t.id));
        parsed.tasks.forEach(item => {
          if(!item || !item.text) return;
          const id = item.id || newId();
          if(existingIds.has(id)) return;
          tasks.push({
            id, text: item.text, recurring: !!item.recurring, done: !!item.done,
            completions: item.completions || {}, createdDate: item.createdDate || todayStr()
          });
          existingIds.add(id);
          added++;
        });
      }

      if(Array.isArray(parsed.ideas)){
        const existingIds = new Set(ideas.map(i => i.id));
        parsed.ideas.forEach(item => {
          if(!item || !item.text) return;
          const id = item.id || newId();
          if(existingIds.has(id)) return;
          // avoid importing a second "active" idea if one is already active
          const active = !!item.active && !ideas.some(i => i.active);
          ideas.push({ id, text: item.text, active, ts: item.ts || new Date().toISOString() });
          existingIds.add(id);
          added++;
        });
      }

      if(Array.isArray(parsed.events)){
        const existingIds = new Set(events.map(e => e.id));
        parsed.events.forEach(item => {
          if(!item || !item.title || !item.date) return;
          const id = item.id || newId();
          if(existingIds.has(id)) return;
          events.push({ id, title: item.title, date: item.date, time: item.time || '', createdTs: item.createdTs || new Date().toISOString() });
          existingIds.add(id);
          added++;
        });
      }

      saveJSON(JOURNAL_KEY, entries);
      saveTasks();
      saveIdeas();
      saveEvents();
      renderJournal();
      renderTasks();
      renderIdeas();
      renderEvents();
      updateHeaderSub();
      showToast(`Imported ${added} item${added===1?'':'s'}`);
    }catch(err){
      showToast('Import failed: invalid file');
    }
    fileInput.value = '';
  };
  reader.readAsText(file);
});

document.getElementById('clearBtn').addEventListener('click', async () => {
  settingsMenu.classList.remove('open');
  const total = entries.length + tasks.length + ideas.length + events.length;
  if(total === 0) return;
  const ok = await appConfirm(
    'This deletes journal entries, tasks, ideas, and events. This cannot be undone (export first if unsure).',
    { title:'Clear everything?', confirmLabel:'Delete everything' }
  );
  if(ok){
    entries = []; tasks = []; ideas = []; events = [];
    saveJSON(JOURNAL_KEY, entries);
    saveTasks();
    saveIdeas();
    saveEvents();
    renderJournal();
    renderTasks();
    renderIdeas();
    renderEvents();
    updateHeaderSub();
    showToast('Everything cleared');
  }
});

/* =================================================================== */
/* TODAY (tasks + routines)                                             */
/* =================================================================== */
const TASKS_KEY = 'journal_tasks_v1';
let tasks = loadJSON(TASKS_KEY, []);

const taskSections = document.getElementById('taskSections');
const todayDateEl = document.getElementById('todayDate');
const taskInput = document.getElementById('taskInput');
const repeatDaily = document.getElementById('repeatDaily');

function saveTasks(){ saveJSON(TASKS_KEY, tasks); }

function isDoneToday(task){
  if(task.recurring) return !!(task.completions && task.completions[todayStr()]);
  return !!task.done;
}
function setDoneToday(task, val){
  if(task.recurring){
    task.completions = task.completions || {};
    if(val) task.completions[todayStr()] = true;
    else delete task.completions[todayStr()];
  } else {
    task.done = val;
  }
}
function daysSince(dateStr){
  if(!dateStr) return 1;
  const [y,m,dd] = dateStr.split('-').map(Number);
  const start = new Date(y, m-1, dd);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.max(1, Math.round((today - start) / 86400000) + 1);
}

function renderTasks(){
  const d = new Date();
  todayDateEl.textContent = d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  updateHeaderSub();

  taskSections.innerHTML = '';

  if(tasks.length === 0){
    renderEmptyState(taskSections, '☀️', 'Nothing planned for today. Add a task or a daily routine below.', 'today-empty');
    return;
  }

  const filtered = tasks.filter(t => matchesSearch(t.text));
  if(filtered.length === 0){
    renderEmptyState(taskSections, '🔍', `No tasks match "${searchInput.value}".`, 'today-empty');
    return;
  }

  const routines = filtered.filter(t => t.recurring);
  const oneOff = filtered.filter(t => !t.recurring);

  if(routines.length) taskSections.appendChild(buildTaskSection('Routines', routines));
  if(oneOff.length) taskSections.appendChild(buildTaskSection("Today's tasks", oneOff));
}

function buildTaskSection(title, list){
  const wrap = document.createElement('div');
  wrap.className = 'section';
  const h = document.createElement('div');
  h.className = 'section-title';
  const doneCount = list.filter(isDoneToday).length;
  h.innerHTML = `<span>${title}</span><span class="section-count">${doneCount}/${list.length}</span>`;
  wrap.appendChild(h);
  list.forEach(task => wrap.appendChild(buildTaskRow(task)));
  return wrap;
}

function buildTaskRow(task){
  const row = document.createElement('div');
  row.className = 'row';
  const done = isDoneToday(task);

  const check = document.createElement('button');
  check.className = 'row-toggle' + (done ? ' checked' : '');
  check.textContent = '✓';
  check.onclick = () => {
    setDoneToday(task, !isDoneToday(task));
    saveTasks();
    renderTasks();
  };

  const label = document.createElement('div');
  label.className = 'row-label' + (done ? ' checked' : '');
  label.textContent = task.text;

  row.appendChild(check);
  row.appendChild(label);
  if(task.recurring){
    const badge = document.createElement('span');
    badge.className = 'row-badge';
    const completedCount = task.completions ? Object.keys(task.completions).length : 0;
    badge.textContent = `${completedCount}/${daysSince(task.createdDate)}`;
    row.appendChild(badge);
  }

  Popup.attach(row, {
    onEdit: () => inlineEdit(label, () => task.text, (val) => {
      if(val !== null) task.text = val;
      saveTasks();
      renderTasks();
    }),
    onCopy: () => task.text,
    onDelete: () => {
      tasks = tasks.filter(t => t.id !== task.id);
      saveTasks();
      renderTasks();
    }
  }, '.row-toggle');

  return row;
}

function addTask(){
  const text = taskInput.value.trim();
  if(!text) return;
  if(repeatDaily.checked){
    const dup = tasks.find(t => t.recurring && t.text.trim().toLowerCase() === text.toLowerCase());
    if(dup){
      taskInput.value = '';
      repeatDaily.checked = false;
      showToast(`"${dup.text}" is already a daily routine`);
      return;
    }
  }
  tasks.push({ id: newId(), text, recurring: repeatDaily.checked, done:false, completions:{}, createdDate: todayStr() });
  saveTasks();
  taskInput.value = '';
  taskInput.style.height = 'auto';
  repeatDaily.checked = false;
  renderTasks();
}
document.getElementById('taskForm').addEventListener('submit', (e) => { e.preventDefault(); addTask(); });
taskInput.addEventListener('input', () => autoGrow(taskInput, 120));
taskInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !isMobile && !e.shiftKey){
    e.preventDefault();
    addTask();
  }
});

/* =================================================================== */
/* IDEAS (active vs parked)                                             */
/* =================================================================== */
const IDEAS_KEY = 'journal_ideas_v1';
let ideas = loadJSON(IDEAS_KEY, []);

const ideaSections = document.getElementById('ideaSections');
const ideaInput = document.getElementById('ideaInput');

function saveIdeas(){ saveJSON(IDEAS_KEY, ideas); }

function setActiveIdea(id){
  const target = ideas.find(i => i.id === id);
  if(!target) return;
  const wasActive = target.active;
  ideas.forEach(i => i.active = false);
  if(!wasActive) target.active = true;
  saveIdeas();
  renderIdeas();
}

function renderIdeas(){
  updateHeaderSub();
  ideaSections.innerHTML = '';

  if(ideas.length === 0){
    renderEmptyState(ideaSections, '💡', 'No ideas yet. Capture one below — tap the circle to make it active.', 'ideas-empty');
    return;
  }

  const filtered = ideas.filter(i => matchesSearch(i.text));
  if(filtered.length === 0){
    renderEmptyState(ideaSections, '🔍', `No ideas match "${searchInput.value}".`, 'ideas-empty');
    return;
  }

  const active = filtered.filter(i => i.active);
  const parked = filtered.filter(i => !i.active);

  const activeWrap = document.createElement('div');
  activeWrap.className = 'section';
  const activeTitle = document.createElement('div');
  activeTitle.className = 'section-title';
  activeTitle.innerHTML = `<span>Active</span>`;
  activeWrap.appendChild(activeTitle);
  if(active.length === 0){
    const empty = document.createElement('div');
    empty.className = 'idea-active-empty';
    empty.textContent = 'Nothing active — tap an idea below to focus on it.';
    activeWrap.appendChild(empty);
  } else {
    active.forEach(idea => activeWrap.appendChild(buildIdeaRow(idea)));
  }
  ideaSections.appendChild(activeWrap);

  if(parked.length){
    const wrap = document.createElement('div');
    wrap.className = 'section';
    const h = document.createElement('div');
    h.className = 'section-title';
    h.innerHTML = `<span>Parked</span><span class="section-count">${parked.length}</span>`;
    wrap.appendChild(h);
    parked.forEach(idea => wrap.appendChild(buildIdeaRow(idea)));
    ideaSections.appendChild(wrap);
  }
}

function buildIdeaRow(idea){
  const row = document.createElement('div');
  row.className = 'row' + (idea.active ? ' active-idea' : '');

  const star = document.createElement('button');
  star.className = 'row-toggle star' + (idea.active ? ' checked' : '');
  star.textContent = '●';
  star.title = idea.active ? 'Tap to park' : 'Tap to make active';
  star.onclick = () => setActiveIdea(idea.id);

  const label = document.createElement('div');
  label.className = 'row-label';
  label.textContent = idea.text;

  row.appendChild(star);
  row.appendChild(label);

  Popup.attach(row, {
    onEdit: () => inlineEdit(label, () => idea.text, (val) => {
      if(val !== null) idea.text = val;
      saveIdeas();
      renderIdeas();
    }),
    onCopy: () => idea.text,
    onDelete: () => {
      ideas = ideas.filter(i => i.id !== idea.id);
      saveIdeas();
      renderIdeas();
    }
  }, '.row-toggle');

  return row;
}

function addIdea(){
  const text = ideaInput.value.trim();
  if(!text) return;
  ideas.push({ id: newId(), text, active:false, ts: new Date().toISOString() });
  saveIdeas();
  ideaInput.value = '';
  ideaInput.style.height = 'auto';
  renderIdeas();
}
document.getElementById('ideaForm').addEventListener('submit', (e) => { e.preventDefault(); addIdea(); });
ideaInput.addEventListener('input', () => autoGrow(ideaInput, 120));
ideaInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !isMobile && !e.shiftKey){
    e.preventDefault();
    addIdea();
  }
});

/* =================================================================== */
/* EVENTS (scheduled: meetings, birthdays, shows, etc.)                 */
/* =================================================================== */
const EVENTS_KEY = 'journal_events_v1';
let events = loadJSON(EVENTS_KEY, []);

const eventsList = document.getElementById('eventsList');
const eventTitle = document.getElementById('eventTitle');
const eventDate = document.getElementById('eventDate');
const eventTime = document.getElementById('eventTime');

function saveEvents(){ saveJSON(EVENTS_KEY, events); }

function formatEventTime(t){
  if(!t) return '';
  const [h, m] = t.split(':').map(Number);
  const d = new Date(); d.setHours(h, m, 0, 0);
  return d.toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
}

function parseEventDate(dateStr){
  const [y,m,dd] = dateStr.split('-').map(Number);
  return new Date(y, m-1, dd);
}

function renderEvents(){
  eventsList.innerHTML = '';

  if(events.length === 0){
    renderEmptyState(eventsList, '📅', 'Nothing scheduled. Add a meeting, show, or birthday below.', 'events-empty');
    return;
  }

  const filtered = events.filter(e => matchesSearch(e.title));
  if(filtered.length === 0){
    renderEmptyState(eventsList, '🔍', `No events match "${searchInput.value}".`, 'events-empty');
    return;
  }

  const sorted = [...filtered].sort((a,b) => {
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (a.time || '99:99') < (b.time || '99:99') ? -1 : 1;
  });

  let lastDate = null;
  let todayDividerEl = null;
  let firstUpcomingEl = null;
  const today = todayStr();

  sorted.forEach(ev => {
    if(ev.date !== lastDate){
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.innerHTML = `<span>${dayLabel(parseEventDate(ev.date))}</span>`;
      eventsList.appendChild(div);
      lastDate = ev.date;
      if(ev.date === today) todayDividerEl = div;
    }

    const card = document.createElement('div');
    card.className = 'row' + (ev.date < today ? ' past' : '');

    const timeBadge = document.createElement('div');
    timeBadge.className = 'event-time-badge' + (ev.time ? '' : ' no-time');
    timeBadge.textContent = ev.time ? formatEventTime(ev.time) : 'ALL DAY';

    const title = document.createElement('div');
    title.className = 'event-title';
    title.textContent = ev.title;

    card.appendChild(timeBadge);
    card.appendChild(title);

    Popup.attach(card, {
      onEdit: () => inlineEdit(title, () => ev.title, (val) => {
        if(val !== null) ev.title = val;
        saveEvents();
        renderEvents();
      }),
      onCopy: () => `${ev.title} — ${ev.date}${ev.time ? ' ' + ev.time : ''}`,
      onDelete: () => {
        events = events.filter(e => e.id !== ev.id);
        saveEvents();
        renderEvents();
      }
    });

    eventsList.appendChild(card);

    if(!firstUpcomingEl && ev.date >= today) firstUpcomingEl = card;
  });

  // Open near "today" — the nearest upcoming event, or today's divider, or bottom if all past
  const scrollTarget = todayDividerEl || firstUpcomingEl;
  if(scrollTarget){
    scrollTarget.scrollIntoView({ block:'start' });
    eventsList.scrollTop -= 8;
  } else {
    eventsList.scrollTop = eventsList.scrollHeight;
  }
}

function addEvent(){
  const title = eventTitle.value.trim();
  const date = eventDate.value;
  if(!title || !date) {
    showToast(title ? 'Pick a date' : 'Add a title');
    return;
  }
  events.push({ id: newId(), title, date, time: eventTime.value || '', createdTs: new Date().toISOString() });
  saveEvents();
  eventTitle.value = '';
  eventTime.value = '';
  renderEvents();
}
document.getElementById('eventForm').addEventListener('submit', (e) => { e.preventDefault(); addEvent(); });

// Default the date picker to today for convenience
eventDate.value = todayStr();

/* ============ Init ============ */
Lock.init();
renderJournal(true);
</script>
